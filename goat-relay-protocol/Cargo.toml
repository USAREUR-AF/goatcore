[package]
name = "goat-relay-protocol"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
description = "Wire-protocol library for the Netbird relay (rels:// over WebSocket and QUIC). Clean-room implementation per docs/design/netbird-relay-wire-protocol.md."
repository = "https://github.com/usareur-af/goatcore"
readme = "README.md"
keywords = ["netbird", "relay", "wireguard", "vpn", "mesh"]
categories = ["network-programming", "parser-implementations"]

[dependencies]
bytes = "1.7"
thiserror = "1.0"

[dev-dependencies]
proptest = "1.5"
criterion = { version = "0.5", default-features = false, features = ["plotters", "cargo_bench_support"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[[bin]]
name = "goat-relay-conformance"
path = "src/bin/conformance.rs"
required-features = []

[[bench]]
name = "wire_format"
harness = false
