# golangci-lint v2 config — Block 50A.3 production-readiness hardening.
#
# Strict-but-pragmatic linter set for load-bearing Go services. Each enabled
# linter closes a specific class of production bug; this is not a style
# enforcement config. Where load-bearing services live in their own go.mod,
# run from inside that module dir — golangci-lint picks up this file from
# the nearest ancestor.
#
# Scope today: load-bearing services (signal-server, ops/time-hygiene,
# ops/mgmt-host-bootstrap, ops/admit-audit, ops/enrollment). Peripheral
# services (gatewatch, airdefenders, archived/) opt in via a follow-up.
#
# Rationale per linter:
#   errcheck       — unchecked errors (production data-loss bugs)
#   errorlint      — wrong %w usage, wrong errors.Is/As (silent error masking)
#   gosec          — security issues (path traversal, weak crypto, unsafe parse)
#   bodyclose      — http.Body not closed (FD + connection-pool exhaustion)
#   noctx          — http.NewRequest without context (no cancellation in prod)
#   contextcheck   — context-not-propagated (orphan goroutines + missed timeout)
#   nilerr         — `if err != nil { return nil }` (lost error)
#   rowserrcheck   — sql.Rows.Err() not checked (silent partial-result bugs)
#   sqlclosecheck  — sql.Rows / Stmt not closed (connection-pool leak)
#   copyloopvar    — Go 1.22+ loop-variable capture safety
#   unconvert      — useless type conversion (dead code smell)
#   misspell       — comment / string typos (cheap; catches real bugs)
#   govet          — standard checks, kept on
#   staticcheck    — comprehensive checks, kept on
#   unused         — dead code, kept on
#   ineffassign    — ineffective assignment, kept on

version: "2"

run:
  timeout: 3m
  tests: true

linters:
  default: standard
  enable:
    - errorlint
    - gosec
    - bodyclose
    - noctx
    - contextcheck
    - nilerr
    - rowserrcheck
    - sqlclosecheck
    - copyloopvar
    - unconvert
    - misspell
  settings:
    errcheck:
      # An explicit blank assignment still discards an error. Keep these
      # visible in production code so a failed operation cannot be made
      # invisible to CI merely by spelling the discard with `_`.
      check-blank: true
      # Best-effort cleanup patterns. Each entry below is a well-known idiom
      # where the error is structurally benign (Close on a read-side handle
      # after we have the data; Shutdown during process exit; Rollback after
      # a committed-or-already-failed Tx; Remove of a temp file we created).
      # Wrapping each in `_ = ...` adds noise without information.
      exclude-functions:
        - (io.Closer).Close
        - (*net/http.Server).Shutdown
        - (*os.File).Close
        - (*database/sql.DB).Close
        - (*database/sql.Rows).Close
        - (*database/sql.Tx).Rollback
        - (*github.com/jmoiron/sqlx.DB).Close
        - (*github.com/jmoiron/sqlx.Tx).Rollback
        - (*github.com/jmoiron/sqlx.Rows).Close
        - (*google.golang.org/grpc.ClientConn).Close
        - (*net.UnixListener).Close
        - (*net.UnixConn).Close
        - (*net.TCPListener).Close
        - (*net.TCPConn).Close
        - (net.Listener).Close
        - (net.Conn).Close
        - os.Remove
        - fmt.Fprintf
        - fmt.Fprintln
    gosec:
      excludes:
        # G104 (audit unchecked errors) is covered by errcheck — disable here
        # to avoid duplicate signal.
        - G104
        # G115 (integer overflow conversion) generates many false positives
        # on protobuf int64<->int32 conversions bounded by protocol design.
        # Re-evaluate after first clean pass.
        - G115
        # G118 (goroutine uses context.Background while request-scoped ctx
        # available) flags shutdown-goroutine pattern where we DELIBERATELY
        # decouple shutdown from the parent ctx so SIGTERM still drains
        # cleanly when parent ctx is already canceled. Per-line nolint is
        # noisier than this global suppression for an intentional pattern.
        - G118
        # G302 (file permissions <= 0600) flags 0660 unix sockets we
        # deliberately group-readable for sibling-container Prometheus
        # scrape (admit-sidecar /run/ntp-health.sock pattern). The socket
        # is on a per-site mgmt-host with non-shared filesystem; threat
        # model is intra-host privsep, addressed by group ownership.
        - G302
        # G306 (write file <= 0600) — load-gen evidence files are 0o644
        # for human readability on shared dev hosts; not a production path.
        - G306
        # G304 (file inclusion via variable) flags os.ReadFile(operator-
        # supplied-config-path) — operator-controlled path is the input
        # contract, not an adversary surface.
        - G304
        # G404 (math/rand instead of crypto/rand) — used for load
        # generation seeds and non-security test fixtures only.
        # Crypto-sensitive paths use crypto/rand explicitly.
        - G404
    misspell:
      locale: US
      # British spellings used deliberately in user-facing text (ADR 1148
      # partner-guide wording and the repo-access matcher comments quote it).
      ignore-rules:
        - organisation
        - organisations
        - honour
        - honours
        - honoured
        - behaviour
        - behaviours

  exclusions:
    rules:
      # Test helpers contain many deliberate best-effort cleanup operations.
      # Suppress only explicit blank assignments anchored to the assignment's
      # left-hand side. A range clause cannot hide another call on its line.
      - path: '_test\.go'
        source: '(^[[:space:]]*|[{;][[:space:]]*|\b(if|switch)[[:space:]]+)([[:alnum:]_.]+[[:space:]]*,[[:space:]]*)*_([[:space:]]*,[[:space:]]*[[:alnum:]_.]+)*[[:space:]]*:?='
        linters:
          - errcheck
      # Generated code — protobuf, mocks, etc.
      - path: '_test\.go'
        linters:
          - bodyclose  # http.Get in tests is short-lived; httptest cleans up
      - path: 'gen/'
        linters:
          - errcheck
          - gosec
          - staticcheck
          - unused
      - path: '\.pb\.go$'
        linters:
          - errcheck
          - gosec
          - staticcheck
          - unused
