# Spock / Postgres alert rules — production source of truth (per-site).
#
# This file is the authoritative ruleset deployed to mgmt-hosts via the
# ops/ansible/roles/observability/ role. The earlier "copied from
# ops/monitoring/prometheus/rules/spock.yml skeleton" contract is
# retired (Block 50E.9, 2026-05-05): ops/monitoring/ is now scoped as
# a local-dev sandbox + alert-rule R&D area, not a source of truth.
#
# Operating notes:
# - Metric names match the custom queries defined in
#   monitoring/postgres-exporter-queries.yml. Where a metric isn't
#   produced by a stock postgres-exporter (e.g.
#   max_slot_wal_keep_size_bytes), the dependent rule is DEFERRED and
#   commented out with a TODO, rather than shipping a broken alert.
# - `site` is Prometheus's external label (SITE_NAME, prometheus.yml), not a
#   series label, so a summary names the site from $externalLabels.site when
#   the series carries no `site` of its own.
#
# Implements docs/design/ha-multi-site.md §7.3 replication lag /
# WAL ceiling / conflict-log / availability criteria.

groups:

  - name: spock.replication
    interval: 30s
    rules:

      # No subscriber-side lag alert. Spock 5's sub_show_status() has no lag
      # column, and spock.lag_tracker's lag is the time since the last change
      # arrived: it grows without end on a database nobody writes to (measured
      # past 370 s seven minutes after the last write, subscriptions
      # replicating), so an alert on it would fire on every quiet database.
      # The replication backlog is measured at the provider instead:
      # SpockSlotWALSenderLag (pg_stat_replication_pending_bytes), below.


      # Slot invalidated — urgent, rebuild required. Metric comes
      # from the pg_replication_slots custom query.
      - alert: SpockSlotInvalidated
        expr: pg_replication_slot_wal_status_lost == 1
        for: 1m
        labels:
          severity: critical
          component: spock
        annotations:
          summary: "Spock slot {{ $labels.slot_name }} at {{ with $labels.site }}{{ . }}{{ else }}{{ $externalLabels.site }}{{ end }} INVALIDATED — rebuild required"
          description: "Slot wal_status is 'lost'. The subscriber cannot resume from this slot. Run the slot-rebuild runbook: docker compose stop postgres on the disconnected node; rm -rf pgdata; pg_basebackup from a healthy peer; spock.sub_create with the new base; monitor catchup."
          runbook_url: "https://github.com/usareur-af/goatcore/blob/main/docs/operations/post-partition-convergence-runbook.md"

      # WAL retention approaching max_slot_wal_keep_size. The cap differs
      # by site: the Spock image sets one value, and on a pair's primary
      # the postgres-streaming-replication role raises it (F-093;
      # ops/postgres/spock/README.md, The slot WAL cap). The cap is read
      # live from pg_settings by the exporter's `spock_config` query, whose
      # column max_slot_wal_keep_size_bytes is exported as
      # `spock_config_max_slot_wal_keep_size_bytes`
      # (monitoring/postgres-exporter-queries.yml). Until this rule named
      # that series it divided by one no exporter emits, scalar() of
      # nothing is NaN, and the alert never fired. An unlimited cap is the
      # sentinel 2^63-1, so the ratio stays near 0. Each slot is divided by
      # the cap of its own Postgres, matched on `instance`, so a Prometheus
      # that scrapes more than one cap series (a pair's postgres-a and
      # postgres-b, or a hub federating several sites) compares each slot
      # with the right one; scalar() of two series is NaN and would silence
      # the alert again. tests/spock-slot-wal-near-limit.test.yml holds it.
      - alert: SpockSlotWALNearLimit
        expr: |
          pg_replication_slot_retained_wal_bytes
            / on(instance) group_left() spock_config_max_slot_wal_keep_size_bytes > 0.8
        for: 5m
        labels:
          severity: critical
          component: spock
        annotations:
          summary: "Spock slot {{ $labels.slot_name }} at {{ with $labels.site }}{{ . }}{{ else }}{{ $externalLabels.site }}{{ end }} > 80% of max_slot_wal_keep_size"
          description: "Replication slot is retaining WAL and approaching max_slot_wal_keep_size. If it hits the ceiling, Postgres invalidates the slot and the disconnected peer will require a full pg_basebackup + Spock re-subscribe to recover. Investigate why the subscriber isn't consuming — network partition, crashed apply worker, or a schema mismatch stopping replay."
          runbook_url: "https://github.com/usareur-af/goatcore/blob/main/docs/operations/post-partition-convergence-runbook.md"

      # Block 52A.1 — subscription stuck in non-replicating state.
      # spock.sub_show_status() exposes status as one of:
      #   replicating | initializing | down | unknown
      # A halted subscription sends no backlog, so the provider-side
      # SpockSlotWALSenderLag stays quiet when status != 'replicating'.
      # This alert closes that gap. spock_subscription_lag_replicating is
      # the 0/1 gauge from the spock_subscription_lag custom query, one
      # series per subscription in each replicated database (datname).
      - alert: SpockSubscriptionNotReplicating
        expr: spock_subscription_lag_replicating == 0
        for: 2m
        labels:
          severity: critical
          component: spock
        annotations:
          summary: "Spock subscription {{ $labels.subscription_name }} ({{ $labels.datname }}) at {{ with $labels.site }}{{ . }}{{ else }}{{ $externalLabels.site }}{{ end }} not replicating for 2m"
          description: "Subscription status is not 'replicating' (likely 'down' or 'initializing'). Lag metrics are unreliable in this state. Run `psql {{ $labels.datname }} -c 'SELECT * FROM spock.sub_show_status();'` on the subscribing node to see the exact status. Common causes: apply worker crashed (check Postgres logs), provider unreachable, or a replicated DDL replay error stopping the apply queue. See post-partition convergence runbook for rejoin scenarios."
          runbook_url: "https://github.com/usareur-af/goatcore/blob/main/docs/operations/post-partition-convergence-runbook.md"

      # A mesh subscription that is not replicating, including one that
      # never started. Expected: spock_mesh_expected_subscriptions, one per
      # declared peer site for each replicated database, written by the
      # spock-mesh-peering and ory-narrow-repset roles from the deployment's
      # peers. Replicating: spock_mesh_subscriptions_replicating, the
      # subscriptions whose status reads 'replicating' in that database. A
      # subscription that was never created, or whose status row is missing
      # because its worker never started, has no series of its own and
      # SpockSubscriptionNotReplicating cannot see it; it still counts here.
      # The `or ... * 0` makes a database with no series read 0.
      - alert: SpockMeshSubscriptionsMissing
        expr: |
          max by (datname) (spock_mesh_expected_subscriptions)
            > on (datname)
          (max by (datname) (spock_mesh_subscriptions_replicating)
             or max by (datname) (spock_mesh_expected_subscriptions) * 0)
        for: 5m
        labels:
          severity: critical
          component: spock
        annotations:
          summary: "Spock mesh at {{ $externalLabels.site }}: fewer {{ $labels.datname }} subscriptions replicating than the declared peers need"
          description: "This site should hold one replicating subscription to each declared peer site in {{ $labels.datname }}; fewer have read 'replicating' for 5m. A subscription may never have been created, may be down, or may never have started (its apply worker or Spock manager had no background worker slot: see PostgresBackgroundWorkersNearLimit and SpockApplyWorkersMissing). Run `psql {{ $labels.datname }} -c 'SELECT * FROM spock.sub_show_status();'` and compare with the peers in the inventory; re-run spock-mesh-peering (or ory-narrow-repset for kratos and hydra) to create a missing one."
          runbook_url: "https://github.com/usareur-af/goatcore/blob/main/docs/design/spock-mesh-peering.md"

      # Enabled subscriptions whose apply worker is not running, per database.
      # Read from the catalog (spock.subscription) and pg_stat_activity, so it
      # holds even when Spock's manager for the database never started.
      - alert: SpockApplyWorkersMissing
        expr: spock_mesh_subscriptions_configured > spock_mesh_subscriptions_running
        for: 5m
        labels:
          severity: critical
          component: spock
        annotations:
          summary: "Spock at {{ with $labels.site }}{{ . }}{{ else }}{{ $externalLabels.site }}{{ end }}: {{ $labels.datname }} has enabled subscriptions with no apply worker running"
          description: "spock.subscription in {{ $labels.datname }} lists more enabled subscriptions than there are Spock apply workers running for it, for 5m: those subscriptions replicate nothing. The usual cause is no free background worker slot (max_worker_processes; see PostgresBackgroundWorkersNearLimit), or Spock's manager for the database not running. Check the Postgres log, then `SELECT backend_type, datname FROM pg_stat_activity WHERE backend_type LIKE 'spock%';`."
          runbook_url: "https://github.com/usareur-af/goatcore/blob/main/ops/postgres/spock/README.md"

      # The background worker pool nearly full: the next apply worker or
      # Spock manager to start may find no slot. Early warning for the two
      # alerts above.
      - alert: PostgresBackgroundWorkersNearLimit
        expr: pg_background_workers_in_use >= 0.85 * pg_background_workers_max
        for: 10m
        labels:
          severity: warning
          component: spock
        annotations:
          summary: "Postgres at {{ with $labels.site }}{{ . }}{{ else }}{{ $externalLabels.site }}{{ end }} uses {{ $value }} of its background worker slots (max_worker_processes)"
          description: "At least 85% of max_worker_processes is in use for 10m. Spock runs one apply worker per subscription and one manager per replicated database, and parallel queries draw from the same pool; when it is full, a new subscription's worker does not start and replicates nothing. Raise max_worker_processes (ops/postgres/spock/conf/postgresql.conf) to at least 3 x sites + 3 for a mesh of three replicated databases (per site: one apply worker per other site per database, one Spock manager per database, the Spock supervisor, the spock_failover_slots worker and the logical replication launcher), plus max_parallel_workers (8 by default). It takes effect at a Postgres restart; on a site with a streaming pair, restart the standby first. ops/postgres/spock/README.md has the counts."
          runbook_url: "https://github.com/usareur-af/goatcore/blob/main/ops/postgres/spock/README.md"

      # Block 52A.1 — replication slot reports inactive even though
      # the subscription view may report 'replicating'. This is the
      # 2026-04-25 Mac observation pattern: subscription view + slot
      # state can disagree, and the slot is the authoritative path
      # of bytes. Both must be true for replication to actually flow.
      - alert: SpockSlotInactive
        expr: pg_replication_slot_active == 0
        for: 2m
        labels:
          severity: critical
          component: spock
        annotations:
          summary: "Spock slot {{ $labels.slot_name }} at {{ with $labels.site }}{{ . }}{{ else }}{{ $externalLabels.site }}{{ end }} inactive for 2m"
          description: "Replication slot has no consumer connected (pg_replication_slots.active = false). If wal_status is also 'lost' the SpockSlotInvalidated alert is the authoritative one — see inhibition rules. Otherwise: the subscriber's WAL sender connection has dropped without invalidating the slot. Check network path, subscriber's apply worker, and ensure `wal_keep_size`/`max_slot_wal_keep_size` haven't been changed unexpectedly."
          runbook_url: "https://github.com/usareur-af/goatcore/blob/main/docs/operations/post-partition-convergence-runbook.md"

      # Block 52A.1 — provider-side WAL sender backlog (sent_lsn far
      # behind current_wal_lsn). Subscriber-side lag alerts only fire
      # after the WAL reaches them; a saturated provider→network path
      # with a fast subscriber would show subscriber-lag near zero
      # while pending_bytes climbs. 100 MB threshold matches §5.3 risk
      # framing — well below max_slot_wal_keep_size on any site (see
      # ops/postgres/spock/README.md, The slot WAL cap) but high enough above
      # noise floor to indicate sustained backlog.
      - alert: SpockSlotWALSenderLag
        expr: pg_stat_replication_pending_bytes > 100 * 1024 * 1024
        for: 5m
        labels:
          severity: warning
          component: spock
        annotations:
          summary: "Spock WAL sender backlog to {{ $labels.subscriber }} at {{ with $labels.site }}{{ . }}{{ else }}{{ $externalLabels.site }}{{ end }} > 100 MB for 5m"
          description: "Provider-side WAL is queueing for subscriber {{ $labels.subscriber }}. Subscriber-side replay lag may still look healthy; this alert catches the case where bytes haven't yet left the provider. Check inter-site network throughput, congestion on the WireGuard tunnel, and subscriber's TCP receive window. Sustained growth ⇒ subscriber-side cannot drain; will eventually trigger SpockSlotWALNearLimit."
          runbook_url: "https://github.com/usareur-af/goatcore/blob/main/docs/operations/post-partition-convergence-runbook.md"

  - name: spock.drift
    interval: 60s
    rules:

      # Block 52A.3 — ACE drift-watch detects row-level divergence
      # within the L2a hourly window. Per ADR 1010 §D5. Metrics are
      # emitted by the spock-drift-watch cron via the node_exporter
      # textfile collector. Any non-zero diff = human investigation.
      - alert: SpockACEDriftDetected
        expr: spock_ace_drift_rows > 0
        for: 5m
        labels:
          severity: warning
          component: spock
        annotations:
          summary: "ACE drift-watch detected {{ $value }} divergent rows on {{ $labels.db }}/{{ $labels.table_pair }} at {{ with $labels.site }}{{ . }}{{ else }}{{ $externalLabels.site }}{{ end }}"
          description: "pgEdge ACE row-level diff found a non-empty result on this table-pair. L1 (Spock) is supposed to keep these in sync within seconds. A non-empty diff means either Spock missed an apply (rare bug or partition aftermath), an out-of-band SQL bypass occurred (forbidden per ADR 1010 D4), or the LWW resolution surfaced a column-level loss. Investigate via post-partition convergence runbook §4."
          runbook_url: "https://github.com/usareur-af/goatcore/blob/main/docs/operations/post-partition-convergence-runbook.md"

      # Block 52A.3 — drift-watch cron itself has stalled. Cadence
      # is hourly; alert if last-run timestamp is older than 2× cadence.
      # Without this, a silently-broken cron yields silently-stale
      # divergence detection — the worst kind of false-negative.
      - alert: SpockACEDriftWatchStale
        expr: time() - spock_ace_drift_watch_last_run_seconds > 7200
        for: 5m
        labels:
          severity: warning
          component: spock
        annotations:
          summary: "ACE drift-watch at {{ with $labels.site }}{{ . }}{{ else }}{{ $externalLabels.site }}{{ end }} has not run in over 2h"
          description: "The hourly drift-watch cron has not emitted a successful-run timestamp in >2h. Check `systemctl status spock-drift-watch.timer` on the mgmt-host. Without drift-watch the L2a hourly observability layer is silently dark."
          runbook_url: "https://github.com/usareur-af/goatcore/blob/main/docs/operations/post-partition-convergence-runbook.md"

      # A platform-admin grant reached a site from a node that is not the hub
      # (ADR 1205 D10). The guard on Kratos identities applied the row without
      # PLATFORM-ADMIN and logged it in goat_ceiling_refused; drift-watch counts
      # that table per peer (spock_ceiling_refused_rows, the table as it
      # stands). drift-watch runs hourly, so the window is 2h. Critical: with
      # reason not_hub, a site wrote a grant past its own guard.
      - alert: SpockCeilingRefused
        expr: increase(spock_ceiling_refused_rows[2h]) > 0
        labels:
          severity: critical
          component: spock
        annotations:
          summary: "Peer {{ $labels.peer }} refused {{ $value | printf \"%.0f\" }} platform-admin grant(s) not made at the hub"
          description: "The platform-admin guard at peer {{ $labels.peer }} (database {{ $labels.db }}) applied a replicated grant of PLATFORM-ADMIN without the group (ADR 1205 D10). Read goat_ceiling_refused there for the identity, the sending node (origin), the reason, the groups as received and committed_at. Reason not_hub: the sending site made the grant past its own guard; treat that site as broken into and consider the hub's sever_site (ADR 1205 D4). Reason forwarding: a subscription at the peer has non-empty forward_origins, which ADR 1205 D9 forbids; recreate it with none. Reason no_hub: goat.hub_site is not set at the peer; set goatnet_hub_site and run the ory-narrow-repset role."
          runbook_url: "https://github.com/usareur-af/goatcore/blob/main/docs/adr/1205-the-highest-echelon-site-overrides-and-can-sever-every-other-site.md"

  - name: spock.conflicts
    interval: 30s
    rules:

      # Any conflict resolved. Metric comes from the spock_resolutions custom
      # query (COUNT over spock.resolutions; needs spock.save_resolutions=on),
      # one series per replicated database (`datname`: netbird, kratos, ...).
      # After a partition this is expected, and each row is one write that
      # lost the merge; with the revocation guard (ADR 1193) a revocation
      # cannot be one of them. Review with the post-partition runbook.
      - alert: SpockConflictLogged
        expr: increase(spock_resolutions_total[5m]) > 0
        labels:
          severity: warning
          component: spock
        annotations:
          summary: "Spock resolved conflict(s) at {{ with $labels.site }}{{ . }}{{ else }}{{ $externalLabels.site }}{{ end }} in {{ $labels.datname }} in last 5m"
          description: "New rows in spock.resolutions: a replicated write lost to a later write at another site (last-writer-wins, per row). Outside a partition this means two sites changed the same row; after a rejoin it is expected. Review the rows (post-partition runbook §3) and confirm nothing that should have won was dropped."
          runbook_url: "https://github.com/usareur-af/goatcore/blob/main/docs/operations/post-partition-convergence-runbook.md"

      # A remote change could not be applied and was skipped. The sites now
      # differ on that row until someone reconciles it. One series per
      # replicated database (`datname`), as above.
      - alert: SpockApplyExceptionLogged
        expr: increase(spock_exceptions_total[5m]) > 0
        labels:
          severity: warning
          component: spock
        annotations:
          summary: "Spock skipped remote change(s) at {{ with $labels.site }}{{ . }}{{ else }}{{ $externalLabels.site }}{{ end }} in {{ $labels.datname }} in last 5m"
          description: "New rows in spock.exception_log: a change from another site failed to apply here and was skipped (spock.exception_behaviour = discard). The usual cause after a partition is an update to a row this site deleted, which is correct to skip. Anything else means the sites now disagree on that row. Review with the post-partition runbook §3."
          runbook_url: "https://github.com/usareur-af/goatcore/blob/main/docs/operations/post-partition-convergence-runbook.md"

  - name: postgres.availability
    interval: 30s
    rules:

      - alert: PostgresDown
        expr: up{job="postgres"} == 0
        for: 2m
        labels:
          severity: critical
          component: postgres
        annotations:
          summary: "postgres-exporter at {{ with $labels.site }}{{ . }}{{ else }}{{ $externalLabels.site }}{{ end }}:{{ $labels.instance }} unreachable for 2m"
          description: "Prometheus cannot scrape postgres-exporter. Either the exporter is down, or postgres itself is down (exporter fails open on a dead DB). Check `docker compose ps postgres postgres-exporter` on the mgmt-host."
          runbook_url: "https://github.com/usareur-af/goatcore/blob/main/docs/operations/post-partition-convergence-runbook.md"

  # The exporter itself. A query that fails on every scrape leaves its alert
  # without a series, so the alert stays silent whatever happens: it is
  # indistinguishable from a healthy one. The Spock subscription query once
  # ran only in `postgres`, which has no spock schema, and
  # SpockSubscriptionNotReplicating could not fire.
  - name: postgres.exporter
    interval: 30s
    rules:
      - alert: PostgresExporterScrapeFailing
        expr: pg_exporter_last_scrape_error == 1
        for: 15m
        labels:
          severity: warning
          component: spock
        annotations:
          summary: "postgres-exporter at {{ with $labels.site }}{{ . }}{{ else }}{{ $externalLabels.site }}{{ end }} has failed a query on every scrape for 15m"
          description: "pg_exporter_last_scrape_error is 1: at least one query in monitoring/postgres-exporter-queries.yml fails, and the alerts that read its metrics have no series and cannot fire. `docker logs postgres-exporter` names the query and the database (\"Error running query on database\"). Usual causes: a query run in a database without the spock schema, a missing grant for the monitoring role, or a database the exporter cannot reach."
          runbook_url: "https://github.com/usareur-af/goatcore/blob/main/docs/design/replication-consistency-observability.md"
