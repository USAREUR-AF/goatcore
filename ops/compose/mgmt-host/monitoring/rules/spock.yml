# Spock / Postgres alert rules — production source of truth (per-site).
#
# This file is the authoritative ruleset deployed to mgmt-hosts via the
# ops/ansible/roles/observability/ role. The earlier "copied from
# ops/monitoring/prometheus/rules/spock.yml skeleton" contract is
# retired (Block 50E.9, 2026-05-05): ops/monitoring/ is now scoped as
# a local-dev sandbox + alert-rule R&D area, not a source of truth.
#
# Operating notes:
# - Metric names match the custom queries defined in
#   monitoring/postgres-exporter-queries.yml. Where a metric isn't
#   produced by a stock postgres-exporter (e.g.
#   max_slot_wal_keep_size_bytes), the dependent rule is DEFERRED and
#   commented out with a TODO, rather than shipping a broken alert.
# - `site` label is set at scrape time via external_labels (SITE_NAME
#   per-node: vega-a, vega-b).
#
# Implements docs/design/ha-multi-site.md §7.3 replication lag /
# WAL ceiling / conflict-log / availability criteria.

groups:

  - name: spock.replication
    interval: 30s
    rules:

      # Replication lag — any subscription lagging > 60s. Metric
      # produced by the spock_subscription_lag custom query in
      # monitoring/postgres-exporter-queries.yml.
      - alert: SpockSubscriptionLag
        expr: spock_subscription_lag_seconds > 60
        for: 2m
        labels:
          severity: warning
          component: spock
        annotations:
          summary: "Spock subscription {{ $labels.subscription_name }} at {{ $labels.site }} lagging >60s for 2m"
          description: "Replication replay lag exceeds 60s. Check network path to provider, provider WAL senders, and subscriber apply worker. Sustained lag past a few minutes can cascade into slot-retention issues."
          runbook_url: "https://github.com/usareur-af/goatcore/blob/main/docs/operations/post-partition-convergence-runbook.md"

      # Slot invalidated — urgent, rebuild required. Metric comes
      # from the pg_replication_slots custom query.
      - alert: SpockSlotInvalidated
        expr: pg_replication_slot_wal_status_lost == 1
        for: 1m
        labels:
          severity: critical
          component: spock
        annotations:
          summary: "Spock slot {{ $labels.slot_name }} at {{ $labels.site }} INVALIDATED — rebuild required"
          description: "Slot wal_status is 'lost'. The subscriber cannot resume from this slot. Run the slot-rebuild runbook: docker compose stop postgres on the disconnected node; rm -rf pgdata; pg_basebackup from a healthy peer; spock.sub_create with the new base; monitor catchup."
          runbook_url: "https://github.com/usareur-af/goatcore/blob/main/docs/operations/post-partition-convergence-runbook.md"

      # WAL retention approaching max_slot_wal_keep_size. The cap is
      # configured per-cluster via the postgres-streaming-replication
      # role's `postgres_max_slot_wal_keep_size` var (default 6GB per
      # F-093 closure 2026-05-09; was hardcoded to 1GB pre-F-093). The
      # `spock_max_slot_wal_keep_size_bytes` gauge is now LIVE-read
      # from pg_settings via the postgres-exporter custom query, so
      # this expression always uses the true configured threshold —
      # no stale-constant drift class.
      - alert: SpockSlotWALNearLimit
        expr: |
          pg_replication_slot_retained_wal_bytes
            / scalar(spock_max_slot_wal_keep_size_bytes) > 0.8
        for: 5m
        labels:
          severity: critical
          component: spock
        annotations:
          summary: "Spock slot {{ $labels.slot_name }} at {{ $labels.site }} > 80% of max_slot_wal_keep_size"
          description: "Replication slot is retaining WAL and approaching max_slot_wal_keep_size. If it hits the ceiling, Postgres invalidates the slot and the disconnected peer will require a full pg_basebackup + Spock re-subscribe to recover. Investigate why the subscriber isn't consuming — network partition, crashed apply worker, or a schema mismatch stopping replay."
          runbook_url: "https://github.com/usareur-af/goatcore/blob/main/docs/operations/post-partition-convergence-runbook.md"

      # Block 52A.1 — subscription stuck in non-replicating state.
      # spock.sub_show_status() exposes status as one of:
      #   replicating | initializing | down | unknown
      # Lag-based alerts go quiet when status != 'replicating' (lag
      # column is 0 / NULL), so a silent halt won't fire SpockSubscriptionLag.
      # This alert closes that gap. spock_subscription_lag_replicating is
      # the 0/1 gauge from the spock_subscription_lag custom query.
      - alert: SpockSubscriptionNotReplicating
        expr: spock_subscription_lag_replicating == 0
        for: 2m
        labels:
          severity: critical
          component: spock
        annotations:
          summary: "Spock subscription {{ $labels.subscription_name }} at {{ $labels.site }} not replicating for 2m"
          description: "Subscription status is not 'replicating' (likely 'down' or 'initializing'). Lag metrics are unreliable in this state. Run `psql netbird -c 'SELECT * FROM spock.sub_show_status();'` on the subscribing node to see the exact status. Common causes: apply worker crashed (check Postgres logs), provider unreachable, or a replicated DDL replay error stopping the apply queue. See post-partition convergence runbook for rejoin scenarios."
          runbook_url: "https://github.com/usareur-af/goatcore/blob/main/docs/operations/post-partition-convergence-runbook.md"

      # Block 52A.1 — replication slot reports inactive even though
      # the subscription view may report 'replicating'. This is the
      # 2026-04-25 Mac observation pattern: subscription view + slot
      # state can disagree, and the slot is the authoritative path
      # of bytes. Both must be true for replication to actually flow.
      - alert: SpockSlotInactive
        expr: pg_replication_slot_active == 0
        for: 2m
        labels:
          severity: critical
          component: spock
        annotations:
          summary: "Spock slot {{ $labels.slot_name }} at {{ $labels.site }} inactive for 2m"
          description: "Replication slot has no consumer connected (pg_replication_slots.active = false). If wal_status is also 'lost' the SpockSlotInvalidated alert is the authoritative one — see inhibition rules. Otherwise: the subscriber's WAL sender connection has dropped without invalidating the slot. Check network path, subscriber's apply worker, and ensure `wal_keep_size`/`max_slot_wal_keep_size` haven't been changed unexpectedly."
          runbook_url: "https://github.com/usareur-af/goatcore/blob/main/docs/operations/post-partition-convergence-runbook.md"

      # Block 52A.1 — provider-side WAL sender backlog (sent_lsn far
      # behind current_wal_lsn). Subscriber-side lag alerts only fire
      # after the WAL reaches them; a saturated provider→network path
      # with a fast subscriber would show subscriber-lag near zero
      # while pending_bytes climbs. 100 MB threshold matches §5.3 risk
      # framing — well below max_slot_wal_keep_size (1 GiB) but high
      # enough above noise floor to indicate sustained backlog.
      - alert: SpockSlotWALSenderLag
        expr: pg_stat_replication_pending_bytes > 100 * 1024 * 1024
        for: 5m
        labels:
          severity: warning
          component: spock
        annotations:
          summary: "Spock WAL sender backlog to {{ $labels.subscriber }} at {{ $labels.site }} > 100 MB for 5m"
          description: "Provider-side WAL is queueing for subscriber {{ $labels.subscriber }}. Subscriber-side replay lag may still look healthy; this alert catches the case where bytes haven't yet left the provider. Check inter-site network throughput, congestion on the WireGuard tunnel, and subscriber's TCP receive window. Sustained growth ⇒ subscriber-side cannot drain; will eventually trigger SpockSlotWALNearLimit."
          runbook_url: "https://github.com/usareur-af/goatcore/blob/main/docs/operations/post-partition-convergence-runbook.md"

  - name: spock.drift
    interval: 60s
    rules:

      # Block 52A.3 — ACE drift-watch detects row-level divergence
      # within the L2a hourly window. Per ADR 1010 §D5. Metrics are
      # emitted by the spock-drift-watch cron via the node_exporter
      # textfile collector. Any non-zero diff = human investigation.
      - alert: SpockACEDriftDetected
        expr: spock_ace_drift_rows > 0
        for: 5m
        labels:
          severity: warning
          component: spock
        annotations:
          summary: "ACE drift-watch detected {{ $value }} divergent rows on {{ $labels.db }}/{{ $labels.table_pair }} at {{ $labels.site }}"
          description: "pgEdge ACE row-level diff found a non-empty result on this table-pair. L1 (Spock) is supposed to keep these in sync within seconds. A non-empty diff means either Spock missed an apply (rare bug or partition aftermath), an out-of-band SQL bypass occurred (forbidden per ADR 1010 D4), or the LWW resolution surfaced a column-level loss. Investigate via post-partition convergence runbook §4."
          runbook_url: "https://github.com/usareur-af/goatcore/blob/main/docs/operations/post-partition-convergence-runbook.md"

      # Block 52A.3 — drift-watch cron itself has stalled. Cadence
      # is hourly; alert if last-run timestamp is older than 2× cadence.
      # Without this, a silently-broken cron yields silently-stale
      # divergence detection — the worst kind of false-negative.
      - alert: SpockACEDriftWatchStale
        expr: time() - spock_ace_drift_watch_last_run_seconds > 7200
        for: 5m
        labels:
          severity: warning
          component: spock
        annotations:
          summary: "ACE drift-watch at {{ $labels.site }} has not run in over 2h"
          description: "The hourly drift-watch cron has not emitted a successful-run timestamp in >2h. Check `systemctl status spock-drift-watch.timer` on the mgmt-host. Without drift-watch the L2a hourly observability layer is silently dark."
          runbook_url: "https://github.com/usareur-af/goatcore/blob/main/docs/operations/post-partition-convergence-runbook.md"

      # A heal replaced a row by last-write-wins: two sites wrote different
      # rows under one key while cut off, and one site's row is gone at both.
      # The row compare above reports such a table equal; this reads Spock's
      # own log through drift-watch (spock_ace_lww_lost_rows, a count of the
      # log as it stands). drift-watch runs hourly, so the window is 2h. Unlike
      # SpockConflictLogged it ignores a conflict whose two versions were equal.
      - alert: SpockHealReplacedRow
        expr: increase(spock_ace_lww_lost_rows[2h]) > 0
        labels:
          severity: warning
          component: spock
        annotations:
          summary: "A heal replaced {{ $value | printf \"%.0f\" }} row(s) of {{ $labels.db }}.{{ $labels.table }} by last-write-wins, at peer {{ $labels.peer }}"
          description: "A heal replaced a row by last-write-wins; check spock.resolutions on peer {{ $labels.peer }} (database {{ $labels.db }}, table {{ $labels.table }}). Two sites wrote different rows under one key while cut off; the kept version is at both sites and the other is in the log's local_tuple or remote_tuple. Decide whether the lost version must be written back. Post-partition runbook §3."
          runbook_url: "https://github.com/usareur-af/goatcore/blob/main/docs/operations/post-partition-convergence-runbook.md"

  - name: spock.conflicts
    interval: 30s
    rules:

      # Any conflict resolved. Metric comes from the spock_resolutions custom
      # query (COUNT over spock.resolutions; needs spock.save_resolutions=on).
      # After a partition this is expected, and each row is one write that
      # lost the merge; with the revocation guard (ADR 1193) a revocation
      # cannot be one of them. Review with the post-partition runbook.
      - alert: SpockConflictLogged
        expr: increase(spock_resolutions_total[5m]) > 0
        labels:
          severity: warning
          component: spock
        annotations:
          summary: "Spock resolved conflict(s) at {{ $labels.site }} in last 5m"
          description: "New rows in spock.resolutions: a replicated write lost to a later write at another site (last-writer-wins, per row). Outside a partition this means two sites changed the same row; after a rejoin it is expected. Review the rows (post-partition runbook §3) and confirm nothing that should have won was dropped."
          runbook_url: "https://github.com/usareur-af/goatcore/blob/main/docs/operations/post-partition-convergence-runbook.md"

      # A remote change could not be applied and was skipped. The sites now
      # differ on that row until someone reconciles it.
      - alert: SpockApplyExceptionLogged
        expr: increase(spock_exceptions_total[5m]) > 0
        labels:
          severity: warning
          component: spock
        annotations:
          summary: "Spock skipped remote change(s) at {{ $labels.site }} in last 5m"
          description: "New rows in spock.exception_log: a change from another site failed to apply here and was skipped (spock.exception_behaviour = discard). The usual cause after a partition is an update to a row this site deleted, which is correct to skip. Anything else means the sites now disagree on that row. Review with the post-partition runbook §3."
          runbook_url: "https://github.com/usareur-af/goatcore/blob/main/docs/operations/post-partition-convergence-runbook.md"

  - name: postgres.availability
    interval: 30s
    rules:

      - alert: PostgresDown
        expr: up{job="postgres"} == 0
        for: 2m
        labels:
          severity: critical
          component: postgres
        annotations:
          summary: "postgres-exporter at {{ $labels.site }}:{{ $labels.instance }} unreachable for 2m"
          description: "Prometheus cannot scrape postgres-exporter. Either the exporter is down, or postgres itself is down (exporter fails open on a dead DB). Check `docker compose ps postgres postgres-exporter` on the mgmt-host."
          runbook_url: "https://github.com/usareur-af/goatcore/blob/main/docs/operations/post-partition-convergence-runbook.md"
