# Alertmanager config — local-dev / standalone-compose path only.
#
# IMPORTANT: production mgmt-hosts do NOT use this
# file. The observability Ansible role renders
# ops/ansible/roles/observability/templates/alertmanager.yml.j2 onto
# the target host's compose dir at deploy time, overwriting this
# file. That templated version wires PagerDuty (Events API v2),
# Slack, and email conditionally based on env-var-sourced credentials
# in group_vars/<env>_hosts/vars.yml. To activate paging on a
# production host: set PAGERDUTY_INTEGRATION_KEY in your env and
# re-run the observability role; the alertmanager restart handler
# picks up the new config.
#
# This static file is the fallback for `docker compose -f
# docker-compose.obs.yml up` invoked outside of Ansible (local dev,
# offline triage, etc.). It deliberately drops every alert: the
# webhook-noop receiver has no integrations, so nothing is sent and
# nothing is logged as a delivery failure. Alertmanager still renders /
# groups / inhibits correctly and the Prometheus UI shows firing
# alerts; we just don't wake anyone up from a dev workstation.

global:
  resolve_timeout: 5m

route:
  receiver: webhook-noop
  group_by: ["alertname", "site", "component"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  routes:
    - matchers:
        - severity = "critical"
      receiver: webhook-noop   # TODO: replace with pager receiver post-shakedown
      continue: true

inhibit_rules:
  # PostgresDown suppresses all Spock noise on the same site.
  - source_matchers:
      - alertname = "PostgresDown"
    target_matchers:
      - component = "spock"
    equal: ["site"]

  # Slot invalidated suppresses lag alerts for the same subscription.
  - source_matchers:
      - alertname = "SpockSlotInvalidated"
    target_matchers:
      - alertname = "SpockSubscriptionLag"
    equal: ["site", "subscription_name"]

  # SignalServerDown suppresses downstream signal-server alerts on
  # the same instance.
  - source_matchers:
      - alertname = "SignalServerDown"
    target_matchers:
      - component = "signal-server"
    equal: ["site", "instance"]

receivers:
  - name: webhook-noop
