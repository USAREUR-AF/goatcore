# relay-health overlay — the relay-fleet health dashboard, mesh-internal +
# Ory-admin-gated. Sibling-of the oauth2-proxy-id-console fence (ADR 0860):
# Traefik router (mesh-only) → oauth2-proxy-relay-health:4180 → (ADMINS gate)
# → relay-health:80 (static nginx serving the dashboard + the probe JSON).
#
# Used as a compose OVERLAY on the mgmt-host docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.relay-health.yml \
#                  up -d relay-health oauth2-proxy-relay-health
#
# Driven by ops/ansible/roles/relay-health/. The dashboard JSON is refreshed
# on the host by relay-health-probe.timer (fast probes, credential-free) into
# the bind-mounted www dir.

services:
  # Static dashboard server — read-only bind of the prober output dir.
  relay-health:
    # nginx:1.30.6-alpine, digest-pinned to the multi-arch index (ADR 0703;
    # Thor is arm64 so it MUST be the manifest-LIST digest, not a per-arch one).
    image: ${RELAY_HEALTH_NGINX_IMAGE:-nginx:1.30.6-alpine@sha256:583b7f2fce1cdb8da5ad5c39ebd3c33b98b87d493190e548bdee1fa8c619c311}
    container_name: relay-health
    restart: unless-stopped
    networks:
      - mgmt
    expose:
      - "80"
    volumes:
      - /opt/relay-health/www:/usr/share/nginx/html:ro
    labels:
      - "traefik.enable=false"   # fronted by oauth2-proxy-relay-health, not Traefik directly
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # Admin gate. SHA-pinned per ADR 0859; per-service image var for independent rollback.
  oauth2-proxy-relay-health:
    image: ${OAUTH2_PROXY_RELAY_HEALTH_IMAGE:-quay.io/oauth2-proxy/oauth2-proxy:v7.6.0@sha256:dcb6ff8dd21bf3058f6a22c6fa385fa5b897a9cd3914c88a2cc2bb0a85f8065d}
    container_name: oauth2-proxy-relay-health
    restart: unless-stopped
    # On-host OIDC-discovery resolution.
    extra_hosts:
      - "${OAUTH2_PROXY_RELAY_HEALTH_OIDC_HOST_ENTRY:-localhost.invalid:127.0.0.1}"
    env_file:
      - oauth2-proxy-relay-health.env
    ports:
      - "127.0.0.1:${RELAY_HEALTH_OAUTH2_PROXY_HOST_PORT:-4183}:4180"
    networks:
      - mgmt
    depends_on:
      - relay-health
    # distroless image — no shell/wget for an exec healthcheck.
    healthcheck:
      test: ["NONE"]
    labels:
      - "site_id=${SITE_ID:-unknown}"
      - "adr=0860"

  # Relay metrics ingest — token-gated sink for relay self-published metrics
  # (ADR 1058). Relays POST their own host metrics here (via the rathole :443
  # path → Traefik enrollment entrypoint → this service); it writes per-relay
  # files the prober folds in. Stdlib python under a pinned stock image — the
  # ingest script is bind-mounted, no custom image to build. Token + the known
  # relay-name allowlist come from the compose .env.
  relay-metrics-ingest:
    # python:3.12-alpine, multi-arch INDEX digest (Thor is arm64 — must be the
    # manifest-list digest, not a per-arch one).
    image: ${RELAY_METRICS_INGEST_IMAGE:-python:3.12-alpine@sha256:6d43704baacd1bfbe7c295d7f13079d5d8104ed33568873133f8fc69980419df}
    container_name: relay-metrics-ingest
    restart: unless-stopped
    command: ["python3", "/app/relay-metrics-ingest.py"]
    environment:
      RELAY_METRICS_BEARER_TOKEN: "${RELAY_METRICS_BEARER_TOKEN:?relay-metrics ingest requires a bearer token}"
      RELAY_METRICS_ALLOWED_NAMES: "${RELAY_METRICS_ALLOWED_NAMES:?relay-metrics ingest requires the relay-name allowlist}"
      # Site network hosts allowed to publish host-net health
      # (host-net-publish.sh). Empty = route 404s.
      HOST_NET_ALLOWED_NAMES: "${HOST_NET_ALLOWED_NAMES:-}"
      # Zenoh routers allowed to publish their SERVICE health (zenoh-health-probe.sh,
      # F-248/F-253). Empty = /zenoh-health-ingest 404s.
      ZENOH_HEALTH_ALLOWED_NAMES: "${ZENOH_HEALTH_ALLOWED_NAMES:-}"
      # Cross-goatnet rollup ingest (goatnets.html). Its OWN token so a sibling
      # goatnet never holds this box's full ingest credential; both empty ⇒ the
      # route 404s and the feature is simply off.
      CROSS_FLEET_TOKEN: "${CROSS_FLEET_TOKEN:-}"
      CROSS_FLEET_ALLOWED_NAMES: "${CROSS_FLEET_ALLOWED_NAMES:-}"
      RELAY_METRICS_INGEST_DIR: "/ingest"
      RELAY_METRICS_LISTEN_PORT: "8090"
    networks:
      - mgmt
    expose:
      - "8090"
    volumes:
      - /opt/relay-health/relay-metrics-ingest.py:/app/relay-metrics-ingest.py:ro
      - /opt/relay-health/www/ingest:/ingest
    labels:
      - "traefik.enable=false"   # routed by the file-provider router, not labels
      - "adr=1058"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

networks:
  mgmt:
    external: true
    name: mgmt
