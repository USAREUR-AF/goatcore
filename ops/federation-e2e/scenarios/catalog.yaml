  - id: preflight-port-in-use
    title: Preflight refuses when the tunnel port is already held on the edge
    unit: preflight
    runs_where: local
    pass_condition: >
      With another process holding UDP 51820 on the listening edge ({A}) before phase 1,
      phase 1 exits non-zero, its message names port 51820 and a fix (a free inner port
      through peering_wg_listen_port, or the peering forwarder), and the edge holds no
      tunnel interface or tunnel configuration afterwards. Optional evidence: when phase 1
      lets the held port through, whether a later phase fails naming the port.
    checks:
      - {id: port-held, step: "pf-port-held-before-phase-1"}
      - {id: refused-names-port, step: "pf-port-in-use-refused"}
      - {id: no-change-before-refusal, step: "pf-port-in-use-no-change-before-refusal"}
      - {id: later-phase-names-port, step: "pf-port-later-phase-names-port", required: false}

  - id: preflight-slot-list
    title: Preflight refuses a committed slot list that differs from the registry
    unit: pair-role
    runs_where: local
    pass_condition: >
      On a core router deployed by the goat-zenoh role in per-uuid-slot-pool mode with lazy
      slot storage, and the portal's slot registry at the role's default path: with three
      live slots and two committed, the core's dry run (zenoh-deploy.yml --check) refuses
      naming the difference; with the list regenerated to the registry the role's guard
      passes the dry run; with one more slot assigned after that dry run, the real run, the
      one that restarts the router, reads the registry again and refuses, and the running
      router is not restarted. The role re-reads the registry at the start of that run, not
      between its render and its restart handler.
    checks:
      - {id: refused, step: "pf-slot-list-refused"}
      - {id: matching-list-passes, step: "pf-slot-list-matching-list-passes-the-dry-run"}
      - {id: recheck-before-restart, step: "pf-slot-list-refused-on-the-run-that-restarts"}

  - id: core-by-role
    title: Each core router deployed by the ref's goat-zenoh role
    unit: pair-role
    runs_where: local
    pass_condition: >
      Each sovereign's core router is deployed by the ref's goat-zenoh role (zenoh-deploy.yml
      run from the sovereign's own clone on its edge host, against the core host over ssh,
      with the engine's digest-pinned zenoh image): container {id}-zenoh-router, label
      org.goat.component=zenoh-core, compose project {id}-zenoh from
      /opt/{id}-zenoh/docker-compose.yml, config /etc/{id}-zenoh/config.json5. Phase 10 admits
      each peering through the role: the peering declared in the core's group_vars, the
      reviewed fragment as the role's org fragment, a dry run, then the deploy that
      re-renders and restarts the router. Phases 1-14 pass through that core: one agreement
      selecting WireGuard, the handshake, both republishers, strict acceptance from both
      sides, the core trusting only its own CA, and the round trip failing with the
      republisher stopped or the link cut and passing again.
    checks:
      - {id: first-core-is-the-roles, step: "s{n}-{F}-core-is-the-roles"}
      - {id: second-core-is-the-roles, step: "s{n}-{S}-core-is-the-roles"}
      - {id: first-phases-1-to-5, step: "s{n}-{F}-{S}-phases-1-to-5"}
      - {id: second-phases-1-to-5, step: "s{n}-{S}-{F}-phases-1-to-5"}
      - {id: first-phases-6-to-10, step: "s{n}-{F}-{S}-phases-6-to-10"}
      - {id: second-phases-6-to-10, step: "s{n}-{S}-{F}-phases-6-to-10"}
      - {id: one-agreement, step: "s{n}-{F}-{S}-both-sides-hold-one-agreement"}
