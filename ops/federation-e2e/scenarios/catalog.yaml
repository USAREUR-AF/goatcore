      - {id: handshake, step: "nh-{A}-{B}-a-wireguard-handshake"}
      - {id: acceptance, step: "nh-acceptance-as-{A}-with-{B}"}
      - {id: nothing-hand-written, step: "nh-nothing-hand-written"}

  - id: bilateral-acceptance
    title: Each side's acceptance holds the partner's signed result, by the command alone (gate B2)
    unit: {goatbuilder: bilateral}
    runs_where: local
    pass_condition: >
      nothing-hand-written, then both operators run `goatbuilder federate test <partner>
      --bilateral` at the same time, each on its own driver with only its own surfaces: no
      FED_THEIRS_REST, FED_SSH_THEIRS, FED_SPIRE_THEIRS or FED_PROBE_LAUNCHER and no reach into
      the partner's network. Neither run is refused (exit 2) and each publishes its signed
      result; each side's evidence bundle records that no counterparty surface was given; each
      side's combined result under evidence/bilateral/ is authenticated, its peer_key is the
      key the run's keyring bound to the partner at phase 5, and the partner's result is kept
      under evidence/peer/<partner>/; and the two sides' combined verdicts are equal. A
      combined PASS is recorded but not required: it also needs the refusal probes, which hold
      the partner's agreed identity, and the partner's SPIRE command.
    checks:
      - {id: first-run, step: "ba-{A}-{B}-run"}
      - {id: second-run, step: "ba-{B}-{A}-run"}
      - {id: first-own-surfaces, step: "ba-{A}-{B}-own-surfaces"}
      - {id: second-own-surfaces, step: "ba-{B}-{A}-own-surfaces"}
      - {id: first-holds-signed-result, step: "ba-{A}-{B}-holds-signed-result"}
      - {id: second-holds-signed-result, step: "ba-{B}-{A}-holds-signed-result"}
      - {id: verdicts-agree, step: "ba-verdicts-agree"}
      - {id: first-verdict-pass, step: "ba-{A}-{B}-verdict-pass", required: false}
      - {id: second-verdict-pass, step: "ba-{B}-{A}-verdict-pass", required: false}

  - id: offer-narrower-than-release
    title: An offer narrower than the deployment's release sets is carried out for one partner (gate B5)
    unit: {goatbuilder: offer}
    runs_where: local
    pass_condition: >
      nothing-hand-written, with {A}'s peering entry offering only release/all/** while {A}'s
      environment releases release/all/** and release/{B}/**. The agreement names only
      release/all/** for {A}'s flow; a value staged under release/all on {A}'s core arrives at
      {B}'s core under from/{A}/all; a value staged under release/{B} on {A}'s core does not
      arrive, while an offered control does. The run is otherwise nothing-hand-written's:
      strict acceptance passes and nothing is written by hand outside the lab-only lines.
    checks:
      - {id: agreement-offers-only-the-narrowed-set, step: "b5-{A}-offers-only-the-narrowed-set"}
      - {id: offered-set-arrives, step: "b5-{A}-{B}-offered-set-arrives"}
      - {id: narrowed-out-set-does-not-arrive, step: "b5-{A}-{B}-narrowed-out-set-does-not-arrive"}
      - {id: acceptance, step: "nh-acceptance-as-{A}-with-{B}"}
      - {id: nothing-hand-written, step: "nh-nothing-hand-written"}

  - id: two-drivers-per-sovereign
    title: Two drivers per sovereign, the edge driver holding no CA key and no route to the core (gate B10)
    unit: {goatbuilder: twodrivers}
    runs_where: local
    pass_condition: >
      The contract in docs/design/federation-two-drivers.md. On each side a controller holds the
      CA key and reaches the core host only, and an edge driver holds no CA key and reaches the
      edge host only, both enforced by the network. Each controller's peering entry declares
      `drivers: two`, the operator's opt-in, committed. Each side follows the hand-offs the
      command gives, from phase 1 to phase 14: the controller's run stops at what only the edge
      reaches and names the edge driver's `--side edge` run, and the edge driver's goatbuilder
      offers it. Then every required acceptance check passes on both sides; no private key is
      present on a machine other than the one that made it; the controller's journal holds
      every phase with each edge result's digest; a run killed during an edge half and started
      again with --from on the same machine finishes; and `status` on each controller shows the
      peering at phase 14 with its evidence.
    checks:
      - {id: first-edge-driver-reaches-the-edge, step: "td-{A}-edge-driver-reaches-the-edge"}
      - {id: first-edge-driver-cannot-reach-the-core, step: "td-{A}-edge-driver-cannot-reach-the-core"}
      - {id: first-controller-cannot-reach-the-edge, step: "td-{A}-controller-cannot-reach-the-edge"}
      - {id: first-controller-reaches-the-core, step: "td-{A}-controller-reaches-the-core"}
      - {id: first-edge-driver-holds-no-ca-key, step: "td-{A}-edge-driver-holds-no-ca-key"}
      - {id: second-edge-driver-reaches-the-edge, step: "td-{B}-edge-driver-reaches-the-edge"}
      - {id: second-edge-driver-cannot-reach-the-core, step: "td-{B}-edge-driver-cannot-reach-the-core"}
      - {id: second-controller-cannot-reach-the-edge, step: "td-{B}-controller-cannot-reach-the-edge"}
      - {id: second-controller-reaches-the-core, step: "td-{B}-controller-reaches-the-core"}
      - {id: second-edge-driver-holds-no-ca-key, step: "td-{B}-edge-driver-holds-no-ca-key"}
      - {id: first-controller-hands-off-phase-1, step: "td-{A}-controller-phase-1-hands-off-to-the-edge-driver"}
      - {id: second-controller-hands-off-phase-1, step: "td-{B}-controller-phase-1-hands-off-to-the-edge-driver"}
      - {id: first-edge-driver-offers-side-edge, step: "td-{A}-edge-driver-offers-side-edge"}
      - {id: second-edge-driver-offers-side-edge, step: "td-{B}-edge-driver-offers-side-edge"}
      - {id: acceptance-first, step: "td-acceptance-as-{A}-with-{B}"}
      - {id: acceptance-second, step: "td-acceptance-as-{B}-with-{A}"}
      - {id: private-keys-stay-where-made, step: "td-private-keys-stay-where-they-were-made"}
      - {id: first-journal-holds-every-phase, step: "td-{A}-controller-journal-holds-every-phase-and-edge-digest"}
      - {id: second-journal-holds-every-phase, step: "td-{B}-controller-journal-holds-every-phase-and-edge-digest"}
      - {id: edge-half-kill-resumes, step: "td-edge-half-killed-and-resumed"}
      - {id: first-status-at-14, step: "td-{A}-controller-status-at-phase-14"}
      - {id: second-status-at-14, step: "td-{B}-controller-status-at-phase-14"}

  - id: flow-monitor-measures-a-core-restart
    title: The harness's flow monitor measures a gap it is shown (lib/flow.sh, for gate rows B3 and B4)
    unit: {goatbuilder: flow}
    runs_where: local
    pass_condition: >
      On a peering up through phase 14 on role cores (FE2E_CORE=role), a flow of one fresh value
      a second from the first side to the second is read back value by value. With the second's
      core router restarted 15 s into the flow and the flow kept for 45 s more, the monitor
      reports values stored from the start, a run lost while the core's interest returns (at
      least one value, no longer than 40 s), and the last five values stored. A monitor that
      saw no gap, or no recovery, would not be measuring the flow.
    checks:
      - {id: restart-ran, step: "fl-{B}-core-router-restarted"}
      - {id: stored-before, step: "fl-flow-stored-before-the-restart"}
      - {id: bounded-gap, step: "fl-flow-saw-a-bounded-gap"}
      - {id: stored-after, step: "fl-flow-stored-again-after-it"}

  - id: key-rotation
    title: Each key rotated in turn on a running peering, data arriving throughout (gate B3)
    unit: {goatbuilder: rotation}
    runs_where: local
    pass_condition: >
      The proving scenario of docs/design/federation-key-rotation.md §6, on the forwarder unit's
      peering ({A} behind NAT through its forwarder). A flow of one numbered sample a second
      runs each way for the whole scenario (lib/flow.sh), with a reader on each receiving core
      recording each number's arrival time (lib/samples.py). For each key in turn (leaves, carrier,
      transport, signing), first {A} and then {B}: `goatbuilder federate rotate <partner> <key>`
      exits 0; the key's material differs from the material set aside before it; every other
      key's material is unchanged and was read (non-empty, no error); the partner's material is
      unchanged; and strict acceptance passes on both sides. For signing the material is the
      seed the side signs this peering with (its edge group's goat_federation_signing_key, else
      FED_SIGNING_KEY), whose digest must change, and, as its own check (partner-keyring), its
      verifying key in the partner's keyring, which must change too; the partner's step for
      that waits on §5, and the check reads BLOCKED until it exists. After each rotation the
      ordinary command from phase 1 skips 3, 6 and 9 and rotates nothing (rerun-after). Once
      both sides rotated a key, its old material is retired where §6 says: the old WireGuard
      key in no peer list on the partner's interface, the old carrier key in none on the
      forwarder (old-retired); the old leaf's exposure until notAfter is not driven yet and
      reads BLOCKED. Per key, no number is missing at either reader across the key's step, and
      for transport and carrier, whose step has a gap by design, every number is re-delivered
      after it, the gap named in seconds (samples-<key>). A key the goatbuilder under test
      refuses (GB-189 or GB-282) has every check of its own marked BLOCKED with the refusal's
      words, and the next key goes on. The forced SPIRE CA rotation is not driven yet
      (spire-ca-rotation, BLOCKED).
      Values are stored during and after every rotation and the last five of each flow are
      stored (samples-resume), and no .rotation-pending file remains. How much a flow may lose
      during a rotation is an operator decision not yet made (the same as gate row B4's
      re-convergence): samples-loss reads BLOCKED until it is, with the flow's figures kept. The partner's step
      after a transport or signing rotation waits on §5's decision.
    checks:
      - {id: rotate-leaves-first-ran, step: "rot-rotate-leaves-{A}-ran"}
      - {id: rotated-leaves-first, step: "rot-rotated-leaves-{A}"}
      - {id: kept-leaves-first, step: "rot-kept-leaves-{A}"}
      - {id: partner-kept-leaves-first, step: "rot-partner-kept-leaves-{A}"}
      - {id: acceptance-leaves-first, step: "rot-acceptance-leaves-{A}"}
      - {id: rotate-leaves-second-ran, step: "rot-rotate-leaves-{B}-ran"}
      - {id: rotated-leaves-second, step: "rot-rotated-leaves-{B}"}
      - {id: kept-leaves-second, step: "rot-kept-leaves-{B}"}
      - {id: partner-kept-leaves-second, step: "rot-partner-kept-leaves-{B}"}
      - {id: acceptance-leaves-second, step: "rot-acceptance-leaves-{B}"}
      - {id: rotate-carrier-first-ran, step: "rot-rotate-carrier-{A}-ran"}
      - {id: rotated-carrier-first, step: "rot-rotated-carrier-{A}"}
      - {id: kept-carrier-first, step: "rot-kept-carrier-{A}"}
      - {id: partner-kept-carrier-first, step: "rot-partner-kept-carrier-{A}"}
      - {id: acceptance-carrier-first, step: "rot-acceptance-carrier-{A}"}
      - {id: rotate-carrier-second-ran, step: "rot-rotate-carrier-{B}-ran"}
      - {id: rotated-carrier-second, step: "rot-rotated-carrier-{B}"}
      - {id: kept-carrier-second, step: "rot-kept-carrier-{B}"}
      - {id: partner-kept-carrier-second, step: "rot-partner-kept-carrier-{B}"}
      - {id: acceptance-carrier-second, step: "rot-acceptance-carrier-{B}"}
