      partner (B) that is not in the lab (FE2E_PARTNER=external): no peering directory, phase 5
      by hand through two exchange folders, and a pause at each human step that waits for a
      file. On the lab side: phases 1-5, 6-10, 11-12 and 13 pass; the partner's package
      matches the facts file; the key and CA fingerprint read on the voice call match the
      partner's files; the agreement selects WireGuard and its digest equals the partner's;
      phase 10 admits through the role; the tunnel handshakes and carries traffic both ways;
      a sample staged on each side with no subscriber but the stores reaches the other side's
      store, again after each receiving core restarts (its edge not restarted); and strict
      acceptance run locally with this side's own surfaces passes (fail=0, skip=0). What the
      partner read of our samples, and its acceptance, are peer-reported, never local
      observations.
