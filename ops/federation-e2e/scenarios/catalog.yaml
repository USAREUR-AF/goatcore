  - id: back-out-one-peering
    title: One of two peerings backed out while the other carries traffic
    not_built: the two-peering form waits on back-out-to-before (B7) passing for one peering first
    pass_condition: >
      Backing out {A}-{C} removes its edge router, tunnel, republisher, core admission and
      forwarder mapping; {A}-{B} carries traffic throughout with an unchanged agreement digest.
    checks: [{id: other-unchanged, step: "bo-other-peering-unchanged"}]

  - id: back-out-to-before
    title: Backing a peering out leaves both hosts as they were before it (gate B7)
    unit: {goatbuilder: backout}
    runs_where: local
    pass_condition: >
      nothing-hand-written runs {A}'s peering with {B} to acceptance; then `goatbuilder
      federate backout {B}` on {A} exits 0, and {A}'s edge host and core host are each equal to
      a snapshot taken before the first phase: containers, WireGuard interfaces, nftables
      tables, goat and peering units, the edge's and the republisher's files, the core's org
      fragment and configuration digests, and SPIRE's federation list. A difference names what
      the command left or what it took.
    checks:
      - {id: peering-accepted, step: "nh-acceptance-as-{A}-with-{B}"}
      - {id: backout-ran, step: "bo-{A}-{B}-backout-ran"}
      - {id: edge-as-before, step: "bo-{A}-edge-as-before"}
      - {id: core-as-before, step: "bo-{A}-core-as-before"}

  - id: rollback-tools
    title: A deployment rolled back to the previous release of the tools still works
    unit: {goatbuilder: rollback}
    runs_where: local
    pass_condition: >
      A peering deployed with the ref's tools (goatbuilder, phases 1-14, strict acceptance from
      both sides); then goat and goatbuilder on both sides replaced with the previous release
      (the newest published release older than the ref's version of each) and phases 11-14
      driven again from both sides: it still passes strict acceptance, and its tunnel keys,
      peering keys and agreement digest are unchanged.
    checks:
      - {id: deployed, step: "rb-deployed"}
      - {id: rolled-back-versions, step: "rb-rolled-back-versions"}
      - {id: phases-11-to-13, step: "rb-phases-11-to-13-after-rollback"}
      - {id: accepted, step: "rb-acceptance-after-rollback"}
      - {id: keys-unchanged, step: "rb-keys-unchanged"}
      # The same rerun with the ref's own tools, before the swap: when it fails too, the
      # failure is the ref's rerun, not the rollback.
      - {id: control-ref-tools-rerun, step: "rb-control-phases-11-to-13-with-the-ref-tools", required: false}

