  - id: preflight-port-in-use
    title: Preflight refuses when the tunnel port is already held on the edge
    unit: preflight
    runs_where: local
    pass_condition: >
      With another process holding UDP 51820 on the listening edge ({A}) before phase 1,
      phase 1 exits non-zero, its message names port 51820 and a fix (a free inner port
      through peering_wg_listen_port, or the peering forwarder), and the edge holds no
      tunnel interface or tunnel configuration afterwards. Optional evidence: when phase 1
      lets the held port through, whether a later phase fails naming the port.
    checks:
      - {id: port-held, step: "pf-port-held-before-phase-1"}
      - {id: refused-names-port, step: "pf-port-in-use-refused"}
      - {id: no-change-before-refusal, step: "pf-port-in-use-no-change-before-refusal"}
      - {id: later-phase-names-port, step: "pf-port-later-phase-names-port", required: false}

  - id: preflight-slot-list
    title: Preflight refuses a committed slot list that differs from the registry
    unit: pair-role
    runs_where: local
    pass_condition: >
      On a core router deployed by the goat-zenoh role in per-uuid-slot-pool mode with lazy
      slot storage, and the portal's slot registry at the role's default path: with three
      live slots and two committed, the core's dry run (zenoh-deploy.yml --check) refuses
      naming the difference; with the list regenerated to the registry the role's guard
      passes the dry run; with one more slot assigned after that dry run, the real run, the
      one that restarts the router, reads the registry again and refuses, and the running
      router is not restarted. The role re-reads the registry at the start of that run, not
      between its render and its restart handler.
    checks:
      - {id: refused, step: "pf-slot-list-refused"}
      - {id: matching-list-passes, step: "pf-slot-list-matching-list-passes-the-dry-run"}
      - {id: recheck-before-restart, step: "pf-slot-list-refused-on-the-run-that-restarts"}

  - id: core-by-role
    title: Each core router deployed by the ref's goat-zenoh role
    unit: pair-role
    runs_where: local
    pass_condition: >
      Each sovereign's core router is deployed by the ref's goat-zenoh role (zenoh-deploy.yml
      run from the sovereign's own clone on its edge host, against the core host over ssh,
      with the engine's digest-pinned zenoh image): container {id}-zenoh-router, label
      org.goat.component=zenoh-core, compose project {id}-zenoh from
      /opt/{id}-zenoh/docker-compose.yml, config /etc/{id}-zenoh/config.json5. Phase 10 admits
      each peering through the role: the peering declared in the core's group_vars, the
      reviewed fragment as the role's org fragment, a dry run, then the deploy that
      re-renders and restarts the router. Phases 1-14 pass through that core: one agreement
      selecting WireGuard, the handshake, both republishers, strict acceptance from both
      sides, the core trusting only its own CA, and the round trip failing with the
      republisher stopped or the link cut and passing again.
    checks:
      - {id: first-core-is-the-roles, step: "s{n}-{F}-core-is-the-roles"}
      - {id: second-core-is-the-roles, step: "s{n}-{S}-core-is-the-roles"}
      - {id: first-phases-1-to-5, step: "s{n}-{F}-{S}-phases-1-to-5"}
      - {id: second-phases-1-to-5, step: "s{n}-{S}-{F}-phases-1-to-5"}
      - {id: first-phases-6-to-10, step: "s{n}-{F}-{S}-phases-6-to-10"}
      - {id: second-phases-6-to-10, step: "s{n}-{S}-{F}-phases-6-to-10"}
      - {id: one-agreement, step: "s{n}-{F}-{S}-both-sides-hold-one-agreement"}
      - {id: first-core-dry-run, step: "s{n}-{F}-{S}-core-role-dry-run"}
      - {id: first-core-admits, step: "s{n}-{F}-{S}-core-role-admits"}
      - {id: second-core-dry-run, step: "s{n}-{S}-{F}-core-role-dry-run"}
      - {id: second-core-admits, step: "s{n}-{S}-{F}-core-role-admits"}
      - {id: first-phases-11-to-12, step: "s{n}-{F}-{S}-phases-11-to-12"}
      - {id: second-phases-11-to-12, step: "s{n}-{S}-{F}-phases-11-to-12"}
      - {id: first-republisher-sets, step: "s{n}-{F}-{S}-republisher-maps-both-sets"}
      - {id: second-republisher-sets, step: "s{n}-{S}-{F}-republisher-maps-both-sets"}
      - {id: handshake, step: "s{n}-{F}-{S}-a-wireguard-handshake"}
      - {id: first-phase-13, step: "s{n}-{F}-{S}-phase-13"}
      - {id: second-phase-13, step: "s{n}-{S}-{F}-phase-13"}
      - {id: acceptance-first, step: "s{n}-acceptance-as-{F}-with-{S}"}
      - {id: acceptance-second, step: "s{n}-acceptance-as-{S}-with-{F}"}
      - {id: first-core-trusts-own-ca, step: "s{n}-{F}-core-trusts-only-its-own-ca"}
      - {id: second-core-trusts-own-ca, step: "s{n}-{S}-core-trusts-only-its-own-ca"}
      - {id: fails-without-republisher, step: "s{n}-round-trip-fails-without-the-republisher"}
      - {id: passes-with-republisher, step: "s{n}-round-trip-passes-with-the-republisher"}
      - {id: fails-when-cut, step: "s{n}-round-trip-fails-when-cut"}
      - {id: passes-again, step: "s{n}-round-trip-passes-again"}

  - id: preflight-store-wider
    title: Preflight refuses a core receive store wider than the edge grants
    unit: preflight
    runs_where: local
    pass_condition: >
      With {A}'s core receive store for {B} at from/** where {A}'s edge grants
      from/{B}/<set>/**, some phase from 1 to 13 on either side exits non-zero with a message
      that names the from/** store and the from/{B}/ grant. Optional evidence: whether the
      edge's own ingress-storage inspection verified the store during phase 12, and what
      strict phase 14 acceptance did with the wide store in place.
    checks:
      - {id: store-is-wide, step: "pf-wider-store-is-from-all"}
      - {id: store-wide-after-phase-10, step: "pf-wider-store-still-from-all-after-phase-10"}
      - {id: refused, step: "pf-store-wider-refused"}
      - {id: edge-inspection-verified, step: "pf-wider-edge-inspection-said", required: false}
      - {id: acceptance-today, step: "s-pf-wider-acceptance-as-{A}-with-{B}", required: false}

  - id: preflight-router-discovery
    title: Core router found or refused with a named fix
    unit: preflight
    runs_where: local
    pass_condition: >
      Phase 3 (`goat federate init` through FED_ROUTER_DOCKER_HOST) on {B} writes a package
      carrying the router's fabric_version when the core router is the role's (standard name
      <s>-zenoh-router with label org.goat.component=zenoh-core), the legacy goat-zenoh
      without the label, and a custom name with the label. A custom name without the label
      is refused naming FED_ROUTER_CONTAINER, and passes with FED_ROUTER_CONTAINER set to
      it. With two labelled routers running, phase 3 refuses naming both container ids and
      FED_ROUTER_CONTAINER.
    checks:
      - {id: prerequisite-phases-1-to-2, step: "pf-router-phases-1-to-2"}
      - {id: standard, step: "pf-router-standard-name"}
      - {id: legacy, step: "pf-router-legacy-name"}
      - {id: custom-with-label, step: "pf-router-custom-name-with-label"}
      - {id: custom-refused, step: "pf-router-custom-name-refused"}
      - {id: custom-with-variable, step: "pf-router-custom-name-with-variable"}
      - {id: several-refused, step: "pf-router-several-refused"}

  - id: agreement-send-only
    title: Send-only agreement, from the side that releases
    unit: shapes-oneway
    runs_where: local
    known_failure: >
      Phase 12 on the side that accepts nothing: the goat-zenoh-edge role asserts
      goat_zenoh_edge_ingress_key_exprs | length > 0 and refuses ("missing required peering
      parameters"), so its edge and republisher are never deployed and nothing crosses. Phase
      14: acceptance.sh FAILs any agreement with no release set in one direction ("the
      agreement offers no release set from them").
    pass_condition: >
      {A} releases release/all and release/{B} and declares no receive half; {B} declares only
      the receive half. Both sides compose one agreement whose flows are exactly {A}->{B} with
      {A}'s two sets; phases 11-13 complete; {A}'s republisher maps exactly its two sets; each
      of them crosses to {B}'s store, release/not-offered does not, and nothing {B} stages
      crosses to {A}. Every {B}->{A} crossing check is NOT APPLICABLE with the agreement digest
      as its reason, and strict acceptance as {A} passes without refusing the shape.
    checks:
      - {id: first-phases-1-to-5, step: "sh1-{A}-{B}-phases-1-to-5"}
      - {id: second-phases-1-to-5, step: "sh1-{B}-{A}-phases-1-to-5"}
      - {id: first-phases-6-to-10, step: "sh1-{A}-{B}-phases-6-to-10"}
      - {id: second-phases-6-to-10, step: "sh1-{B}-{A}-phases-6-to-10"}
      - {id: one-agreement, step: "sh1-{A}-{B}-both-sides-hold-one-agreement"}
      - {id: flows-match-the-shape, step: "sh1-{A}-{B}-flows-match-the-shape"}
      - {id: first-phases-11-to-12, step: "sh1-{A}-{B}-phases-11-to-12"}
      - {id: second-phases-11-to-12, step: "sh1-{B}-{A}-phases-11-to-12"}
      - {id: republisher-maps-sets, step: "sh1-{A}-{B}-republisher-maps-the-offered-sets"}
      - {id: handshake, step: "sh1-{A}-{B}-a-wireguard-handshake"}
      - {id: first-phase-13, step: "sh1-{A}-{B}-phase-13"}
      - {id: second-phase-13, step: "sh1-{B}-{A}-phase-13"}
      - {id: sends-cross-all, step: "sh1-{A}-to-{B}-all-crosses"}
      - {id: sends-cross-own-set, step: "sh1-{A}-to-{B}-{B}-crosses"}
      - {id: unoffered-stays, step: "sh1-{A}-to-{B}-not-offered-does-not-cross"}
      - {id: receives-cross, step: "sh1-{B}-to-{A}-all-crosses"}
      - {id: nothing-comes-back, step: "sh1-{B}-to-{A}-all-does-not-cross"}
      - {id: acceptance-accepts-the-shape, step: "sh1-acceptance-as-{A}-with-{B}-accepts-the-shape"}
      - {id: acceptance, step: "sh1-acceptance-as-{A}-with-{B}"}

  - id: agreement-receive-only
    title: Receive-only agreement, from the side that releases nothing
    unit: shapes-oneway
    runs_where: local
    known_failure: >
      Phase 12 on the side that releases nothing: the goat-zenoh-edge template renders the
      partner-receive rule with key_exprs [], the edge router refuses its config ("Given
      collection was empty") and restarts, and the role refuses an edge with "NO connection to
      any core endpoint", so nothing reaches this side's core. Phase 14: acceptance.sh FAILs
      any agreement with no release set in one direction ("the agreement offers no release
      set from us", then "no round trip possible").
    pass_condition: >
      The mirror of send-only, from {B}'s side: {B} composes the same agreement with only the
      {A}->{B} flow, completes phases 11-13, receives each of {A}'s sets in its own store, and
      sends nothing: what {B} stages under release/all and release/{B} does not reach {A}.
      Every {B}->{A} check is NOT APPLICABLE with the agreement digest as its reason, and
      strict acceptance as {B} passes without refusing the shape. What the republisher role
      does on {B} (deployed or not) is recorded as an optional check.
    checks:
      - {id: first-phases-1-to-5, step: "sh1-{A}-{B}-phases-1-to-5"}
      - {id: second-phases-1-to-5, step: "sh1-{B}-{A}-phases-1-to-5"}
      - {id: first-phases-6-to-10, step: "sh1-{A}-{B}-phases-6-to-10"}
      - {id: second-phases-6-to-10, step: "sh1-{B}-{A}-phases-6-to-10"}
      - {id: one-agreement, step: "sh1-{A}-{B}-both-sides-hold-one-agreement"}
      - {id: flows-match-the-shape, step: "sh1-{B}-{A}-flows-match-the-shape"}
      - {id: second-phases-11-to-12, step: "sh1-{B}-{A}-phases-11-to-12"}
      - {id: republisher-maps-sets, step: "sh1-{B}-{A}-republisher-maps-the-offered-sets"}
      - {id: republisher-not-deployed, step: "sh1-{B}-{A}-republisher-when-nothing-leaves", required: false}
      - {id: handshake, step: "sh1-{A}-{B}-a-wireguard-handshake"}
      - {id: second-phase-13, step: "sh1-{B}-{A}-phase-13"}
      - {id: receives-cross-all, step: "sh1-{A}-to-{B}-all-crosses"}
      - {id: receives-cross-own-set, step: "sh1-{A}-to-{B}-{B}-crosses"}
      - {id: sends-cross, step: "sh1-{B}-to-{A}-all-crosses"}
      - {id: all-stays-home, step: "sh1-{B}-to-{A}-all-does-not-cross"}
      - {id: own-set-stays-home, step: "sh1-{B}-to-{A}-{B}-does-not-cross"}
      - {id: acceptance-accepts-the-shape, step: "sh1-acceptance-as-{B}-with-{A}-accepts-the-shape"}
      - {id: acceptance, step: "sh1-acceptance-as-{B}-with-{A}"}

  - id: agreement-asymmetric
    title: Asymmetric agreement, each side offering a different set
    unit: shapes-asym
    runs_where: local
    pass_condition: >
      Both sides accept; {C} releases only release/all and {D} only release/{C}. Both compose
      one agreement with exactly those two flows; phases 11-13 complete; each republisher maps
      only its own set; release/all crosses {C}->{D} and release/{C} crosses {D}->{C}, while
      each set staged on the side that does not offer it, and release/not-offered, stays home;
      strict acceptance passes from both sides.
    checks:
      - {id: first-phases-1-to-5, step: "sh2-{C}-{D}-phases-1-to-5"}
      - {id: second-phases-1-to-5, step: "sh2-{D}-{C}-phases-1-to-5"}
      - {id: first-phases-6-to-10, step: "sh2-{C}-{D}-phases-6-to-10"}
      - {id: second-phases-6-to-10, step: "sh2-{D}-{C}-phases-6-to-10"}
      - {id: one-agreement, step: "sh2-{C}-{D}-both-sides-hold-one-agreement"}
      - {id: first-flows-match-the-shape, step: "sh2-{C}-{D}-flows-match-the-shape"}
      - {id: second-flows-match-the-shape, step: "sh2-{D}-{C}-flows-match-the-shape"}
      - {id: first-phases-11-to-12, step: "sh2-{C}-{D}-phases-11-to-12"}
      - {id: second-phases-11-to-12, step: "sh2-{D}-{C}-phases-11-to-12"}
      - {id: first-republisher-maps-its-set, step: "sh2-{C}-{D}-republisher-maps-the-offered-sets"}
      - {id: second-republisher-maps-its-set, step: "sh2-{D}-{C}-republisher-maps-the-offered-sets"}
      - {id: handshake, step: "sh2-{C}-{D}-a-wireguard-handshake"}
      - {id: first-phase-13, step: "sh2-{C}-{D}-phase-13"}
      - {id: second-phase-13, step: "sh2-{D}-{C}-phase-13"}
      - {id: first-set-crosses, step: "sh2-{C}-to-{D}-all-crosses"}
      - {id: second-set-crosses, step: "sh2-{D}-to-{C}-{C}-crosses"}
      - {id: second-set-not-sent-by-first, step: "sh2-{C}-to-{D}-{C}-does-not-cross"}
      - {id: first-set-not-sent-by-second, step: "sh2-{D}-to-{C}-all-does-not-cross"}
      - {id: first-unoffered-stays, step: "sh2-{C}-to-{D}-not-offered-does-not-cross"}
      - {id: second-unoffered-stays, step: "sh2-{D}-to-{C}-not-offered-does-not-cross"}
      - {id: acceptance-first, step: "sh2-acceptance-as-{C}-with-{D}"}
      - {id: acceptance-second, step: "sh2-acceptance-as-{D}-with-{C}"}

  - id: forwarder-path
    title: Forwarder path, an edge behind NAT that cannot accept inbound
    unit: forwarder
    runs_where: local
    pass_condition: >
      {A}'s edge sits behind a NAT router that forwards nothing inbound: {B}'s probe of the
      edge fails, and the same probe reaches it with the NAT opened. The tree's own
      peering-forwarder.yml, applied from {A}'s edge to {A}'s forwarder in the three runs of
      peering-forwarder.md §7, brings the carrier up. Through the avenue, the peering
      handshakes, {B}'s WireGuard endpoint is the forwarder's public address and {A} sees
      {B} at the forwarder's carrier address, the tunnel carries both ways, the forwarder
      holds no WireGuard or TLS key of either party, and strict acceptance passes from both
      sides.
    checks:
      - {id: partner-cannot-reach-edge, step: "sfwd-{B}-cannot-reach-{A}-edge-through-its-nat"}
      - {id: probe-reaches-without-nat, step: "sfwd-the-same-probe-reaches-{A}-edge-with-the-nat-open"}
      - {id: edge-carrier-key, step: "sfwd-{A}-prepare-makes-the-carrier-key"}
      - {id: forwarder-role-applied, step: "sfwd-forwarder-role-applied"}
      - {id: forwarder-in-place, step: "sfwd-forwarder-carrier-and-table-in-place"}
      - {id: carrier-up, step: "sfwd-{A}-prepare-brings-the-carrier-up"}
      - {id: carrier-handshake, step: "sfwd-{A}-carrier-handshake"}
      - {id: first-phases-1-to-5, step: "sfwd-{A}-{B}-phases-1-to-5"}
      - {id: second-phases-1-to-5, step: "sfwd-{B}-{A}-phases-1-to-5"}
      - {id: first-phases-11-to-12, step: "sfwd-{A}-{B}-phases-11-to-12"}
      - {id: second-phases-11-to-12, step: "sfwd-{B}-{A}-phases-11-to-12"}
      - {id: handshake, step: "sfwd-{A}-{B}-a-wireguard-handshake"}
      - {id: dialer-endpoint-is-forwarder, step: "sfwd-{B}-endpoint-is-the-forwarder"}
      - {id: listener-sees-carrier, step: "sfwd-{A}-sees-{B}-at-the-carrier"}
      - {id: first-tunnel-carried, step: "sfwd-{A}-tunnel-carried-it"}
      - {id: second-tunnel-carried, step: "sfwd-{B}-tunnel-carried-it"}
      - {id: forwarder-holds-no-key, step: "sfwd-forwarder-holds-no-peering-key"}
      - {id: acceptance-nated, step: "sfwd-acceptance-as-{A}-with-{B}"}
      - {id: acceptance-partner, step: "sfwd-acceptance-as-{B}-with-{A}"}

  - id: port-51820-held
    title: Another service already holds UDP 51820 on an edge
    unit: preflight
    runs_where: local
    pass_condition: >
      With UDP 51820 held on the listening edge ({A}) by another process, the peering
      configured on the free inner port 51823 (peering_wg_listen_port, and the endpoint {A}'s
      package offers) completes phases 1-13 on both sides; {A}'s tunnel listens on 51823 and
      {B} dials {A}'s boundary address on 51823; the tunnel handshakes; strict phase 14
      acceptance passes from both sides; and the other process still holds 51820.
    checks:
      - {id: port-held, step: "pf-held-port-held-before-phase-1"}
      - {id: first-phases-1-to-5, step: "s-pf-held-{A}-{B}-phases-1-to-5"}
      - {id: second-phases-1-to-5, step: "s-pf-held-{B}-{A}-phases-1-to-5"}
      - {id: first-phases-6-to-10, step: "s-pf-held-{A}-{B}-phases-6-to-10"}
      - {id: second-phases-6-to-10, step: "s-pf-held-{B}-{A}-phases-6-to-10"}
      - {id: first-phases-11-to-12, step: "s-pf-held-{A}-{B}-phases-11-to-12"}
      - {id: second-phases-11-to-12, step: "s-pf-held-{B}-{A}-phases-11-to-12"}
      - {id: first-phase-13, step: "s-pf-held-{A}-{B}-phase-13"}
      - {id: second-phase-13, step: "s-pf-held-{B}-{A}-phase-13"}
      - {id: listens-on-inner-port, step: "pf-held-listens-on-the-inner-port"}
      - {id: dialer-endpoint-inner-port, step: "pf-held-dialer-endpoint-is-the-inner-port"}
      - {id: handshake, step: "s-pf-held-{A}-{B}-a-wireguard-handshake"}
      - {id: acceptance-first, step: "s-pf-held-acceptance-as-{A}-with-{B}"}
      - {id: acceptance-second, step: "s-pf-held-acceptance-as-{B}-with-{A}"}
      - {id: port-still-held, step: "pf-held-port-still-held"}

  - id: ipsec-profile
    title: IPsec transport profile
    unit: ipsec
    runs_where: local
    pass_condition: >
      Both sides' packages offer ipsec-fips and the agreement selects it; phases 11-12 open
      it through goat-peering-edge with a recorded waiver; the IKE SA and CHILD SA establish,
      ESP counters move both ways on each side, and strict acceptance passes from both
      sides. Not a FIPS claim. The optional checks show the machine carries IKE between two
      edges outside the driver, and what phase 11's ipsec-fips play does with a waiver.
    checks:
      - {id: substrate-ike-sa, step: "ipsec-substrate-ike-sa-established", required: false}
      - {id: substrate-ping, step: "ipsec-substrate-ping-both-ways", required: false}
      - {id: substrate-counters, step: "ipsec-substrate-child-sa-counters-both-ways", required: false}
      - {id: first-phases-1-to-5, step: "ipsec-{A}-{B}-phases-1-to-5"}
      - {id: second-phases-1-to-5, step: "ipsec-{B}-{A}-phases-1-to-5"}
      - {id: first-phases-6-to-10, step: "ipsec-{A}-{B}-phases-6-to-10"}
      - {id: second-phases-6-to-10, step: "ipsec-{B}-{A}-phases-6-to-10"}
      - {id: first-offers-ipsec-fips, step: "ipsec-{A}-offers-ipsec-fips"}
      - {id: second-offers-ipsec-fips, step: "ipsec-{B}-offers-ipsec-fips"}
      - {id: agreement-selected-ipsec-fips, step: "ipsec-{A}-{B}-the-agreement-selected-ipsec-fips"}
      - {id: first-play-with-waiver, step: "ipsec-{A}-peering-edge-play-with-a-waiver", required: false}
      - {id: second-play-with-waiver, step: "ipsec-{B}-peering-edge-play-with-a-waiver", required: false}
      - {id: first-phases-11-to-12, step: "ipsec-{A}-{B}-phases-11-to-12"}
      - {id: second-phases-11-to-12, step: "ipsec-{B}-{A}-phases-11-to-12"}
      - {id: ike-sa-established, step: "ipsec-{A}-{B}-ike-sa-established"}
      - {id: child-sa-installed, step: "ipsec-{A}-{B}-child-sa-installed"}
      - {id: first-counters, step: "ipsec-{A}-counters-move-both-ways"}
      - {id: second-counters, step: "ipsec-{B}-counters-move-both-ways"}
      - {id: acceptance-first, step: "ipsec-acceptance-as-{A}-with-{B}"}
      - {id: acceptance-second, step: "ipsec-acceptance-as-{B}-with-{A}"}

  - id: mixed-versions
    title: Released goat 0.5.18 with `goat federate` on one side, goatbuilder on the other
    unit: {goatbuilder: mixed}
    runs_where: local
    pass_condition: >
      {A} drives with the released goat 0.5.18 (units.mixed.goat_versions, or
      `env run --goat-version {A}=<version>`) through peering-standup.sh from its own clone of
      the ref; {B} with the ref's goat and goatbuilder federate. Each side's goat reports the
      version it was given, both complete phases 1 to 13, both hold one agreement digest, and
      phase 14 acceptance passes from both sides with FED_ACCEPTANCE_STRICT=1.
    checks:
      - {id: first-goat-version, step: "mv-{A}-goat-version"}
      - {id: second-goat-version, step: "mv-{B}-goat-version"}
      - {id: first-phases-1-to-5, step: "s4-{A}-{B}-phases-1-to-5"}
      - {id: second-phases-1-to-5, step: "s4-{B}-{A}-phases-1-to-5"}
      - {id: first-phases-6-to-10, step: "s4-{A}-{B}-phases-6-to-10"}
      - {id: second-phases-6-to-10, step: "s4-{B}-{A}-phases-6-to-10"}
      - {id: one-agreement, step: "s4-{A}-{B}-both-sides-hold-one-agreement"}
      - {id: first-phases-11-to-12, step: "s4-{A}-{B}-phases-11-to-12"}
      - {id: second-phases-11-to-12, step: "s4-{B}-{A}-phases-11-to-12"}
      - {id: first-phase-13, step: "s4-{A}-{B}-phase-13"}
      - {id: second-phase-13, step: "s4-{B}-{A}-phase-13"}
      - {id: acceptance-first, step: "s4-acceptance-as-{A}-with-{B}"}
      - {id: acceptance-second, step: "s4-acceptance-as-{B}-with-{A}"}

  - id: back-out-one-peering
    title: One of two peerings backed out while the other carries traffic
    not_built: waits for the back-out command (the ref offers none to drive yet)
    pass_condition: >
      Backing out {A}-{C} removes its edge router, tunnel, republisher, core admission and
      forwarder mapping; {A}-{B} carries traffic throughout with an unchanged agreement digest.
    checks: [{id: other-unchanged, step: "bo-other-peering-unchanged"}]

  - id: rollback-tools
    title: A deployment rolled back to the previous release of the tools still works
    unit: {goatbuilder: rollback}
    runs_where: local
    pass_condition: >
      A peering deployed with the ref's tools (goatbuilder, phases 1-14, strict acceptance from
      both sides); then goat and goatbuilder on both sides replaced with the previous release
      (the newest published release older than the ref's version of each) and phases 11-14
      driven again from both sides: it still passes strict acceptance, and its tunnel keys,
      peering keys and agreement digest are unchanged.
    checks:
      - {id: deployed, step: "rb-deployed"}
      - {id: rolled-back-versions, step: "rb-rolled-back-versions"}
      - {id: phases-11-to-13, step: "rb-phases-11-to-13-after-rollback"}
      - {id: accepted, step: "rb-acceptance-after-rollback"}
      - {id: keys-unchanged, step: "rb-keys-unchanged"}
      # The same rerun with the ref's own tools, before the swap: when it fails too, the
      # failure is the ref's rerun, not the rollback.
      - {id: control-ref-tools-rerun, step: "rb-control-phases-11-to-13-with-the-ref-tools", required: false}

  - id: module-revert
    title: Reverting a module on the integration branch returns the matrix to its prior state
    not_built: measured by the watcher on integration merges, not by a unit
    pass_condition: >
      For each module merged into integration/federation-turnkey, the integration head with
      that merge reverted produces the same outcomes as the integration head before it.
    checks: [{id: same-outcomes, step: "mr-same-outcomes"}]
