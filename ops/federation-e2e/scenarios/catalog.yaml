      - {id: second-wg-key, step: "kr-{S}-wireguard-key-is-the-one-the-partner-holds"}
      - {id: first-peering-keys, step: "kr-{F}-peering-keys-match-their-certificates"}
      - {id: second-peering-keys, step: "kr-{S}-peering-keys-match-their-certificates"}
