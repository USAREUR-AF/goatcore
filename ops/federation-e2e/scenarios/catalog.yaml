      - {id: carrier-handshake, step: "sfwd-{A}-carrier-handshake"}
      - {id: first-phases-1-to-5, step: "sfwd-{A}-{B}-phases-1-to-5"}
      - {id: second-phases-1-to-5, step: "sfwd-{B}-{A}-phases-1-to-5"}
      - {id: first-phases-11-to-12, step: "sfwd-{A}-{B}-phases-11-to-12"}
      - {id: second-phases-11-to-12, step: "sfwd-{B}-{A}-phases-11-to-12"}
