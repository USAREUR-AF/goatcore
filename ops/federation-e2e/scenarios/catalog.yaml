      - {id: phase-8-resumed, step: "kr-phase-8-resumed"}
      - {id: phase-9-resumed, step: "kr-phase-9-resumed"}
      - {id: phase-10-resumed, step: "kr-phase-10-resumed"}
      - {id: phase-11-resumed, step: "kr-phase-11-resumed"}
      - {id: phase-12-resumed, step: "kr-phase-12-resumed"}
      - {id: phase-13-resumed, step: "kr-phase-13-resumed"}
      - {id: phase-1-killed-mid-phase, step: "kr-phase-1-killed-mid-phase", required: false}
      - {id: phase-2-killed-mid-phase, step: "kr-phase-2-killed-mid-phase", required: false}
      - {id: phase-3-killed-mid-phase, step: "kr-phase-3-killed-mid-phase", required: false}
      - {id: phase-4-killed-mid-phase, step: "kr-phase-4-killed-mid-phase", required: false}
