  - id: nothing-hand-written
    title: A peering declared from nothing, every file but the operator's input from the command
    unit: {goatbuilder: nohand}
    runs_where: local
    pass_condition: >
      {A} and {B} each start with no peering to the other: overlay.py --no-peering writes no
      peering group_vars, no peering inventory and no goatbuilder.yaml `peerings:` entry, and
      no goat context holds a peering's federation.toml. Both sides are declared alike. The operator's input is
      exactly the peering entry in goatbuilder.yaml (with, environment, site, edge_class),
      the offer in ops/federation/{A}/federation.toml, and the two confirmations answered at
      the command's prompts. Every other file and value comes from `goatbuilder federate
      allocate` and `goatbuilder federate {B}` (per-peering values, inventory, deployment
      halves, the peering's federation.toml, certificates, admission), and {A} passes phases
      1 to 13 by the one command, holds one agreement digest with {B} and handshakes. Both
      cores are deployed by the goat-zenoh role and declare only site_id; admission's values
      are withheld on both sides. {A} admits {B} through the plain run, {B} admits {A}
      through `federate plan` and `federate deploy` (plan-deploy-admits), and once both have
      passed 13 phase 14 runs inside the command on each side, given the drill's lab-only
      reach to the partner. The first refusal ends the run (FE2E_NH_MODE=strict). The
      list of everything a person still had to write (RECORD/hand-written.txt, also the
      reason of nothing-hand-written, each line naming the command that should have produced
      it) holds only the reviewed lab-only lines (units/nohand.sh nh_lab_only).
