      - {id: forwarder-holds-no-key, step: "sfwd-forwarder-holds-no-peering-key"}
      - {id: acceptance-nated, step: "sfwd-acceptance-as-{A}-with-{B}"}
      - {id: acceptance-partner, step: "sfwd-acceptance-as-{B}-with-{A}"}

  - id: port-51820-held
    title: Another service already holds UDP 51820 on an edge
    unit: preflight
    runs_where: local
    pass_condition: >
      With UDP 51820 held on the listening edge ({A}) by another process, the peering
      configured on the free inner port 51823 (peering_wg_listen_port, and the endpoint {A}'s
      package offers) completes phases 1-13 on both sides; {A}'s tunnel listens on 51823 and
      {B} dials {A}'s boundary address on 51823; the tunnel handshakes; strict phase 14
      acceptance passes from both sides; and the other process still holds 51820.
    checks:
      - {id: port-held, step: "pf-held-port-held-before-phase-1"}
      - {id: first-phases-1-to-5, step: "s-pf-held-{A}-{B}-phases-1-to-5"}
      - {id: second-phases-1-to-5, step: "s-pf-held-{B}-{A}-phases-1-to-5"}
      - {id: first-phases-6-to-10, step: "s-pf-held-{A}-{B}-phases-6-to-10"}
