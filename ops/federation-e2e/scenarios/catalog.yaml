      - {id: first-phases-11-to-12, step: "s{n}-{F}-{S}-phases-11-to-12"}
      - {id: second-phases-11-to-12, step: "s{n}-{S}-{F}-phases-11-to-12"}
      - {id: first-republisher-sets, step: "s{n}-{F}-{S}-republisher-maps-both-sets"}
      - {id: second-republisher-sets, step: "s{n}-{S}-{F}-republisher-maps-both-sets"}
      - {id: handshake, step: "s{n}-{F}-{S}-a-wireguard-handshake"}
      - {id: first-phase-13, step: "s{n}-{F}-{S}-phase-13"}
      - {id: second-phase-13, step: "s{n}-{S}-{F}-phase-13"}
      - {id: acceptance-first, step: "s{n}-acceptance-as-{F}-with-{S}"}
      - {id: acceptance-second, step: "s{n}-acceptance-as-{S}-with-{F}"}
      - {id: first-core-trusts-own-ca, step: "s{n}-{F}-core-trusts-only-its-own-ca"}
      - {id: second-core-trusts-own-ca, step: "s{n}-{S}-core-trusts-only-its-own-ca"}
      - {id: fails-without-republisher, step: "s{n}-round-trip-fails-without-the-republisher"}
