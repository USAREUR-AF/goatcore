      - {id: first-set-crosses, step: "sh2-{C}-to-{D}-all-crosses"}
      - {id: second-set-crosses, step: "sh2-{D}-to-{C}-{C}-crosses"}
      - {id: second-set-not-sent-by-first, step: "sh2-{C}-to-{D}-{C}-does-not-cross"}
      - {id: first-set-not-sent-by-second, step: "sh2-{D}-to-{C}-all-does-not-cross"}
      - {id: first-unoffered-stays, step: "sh2-{C}-to-{D}-not-offered-does-not-cross"}
      - {id: second-unoffered-stays, step: "sh2-{D}-to-{C}-not-offered-does-not-cross"}
      - {id: acceptance-first, step: "sh2-acceptance-as-{C}-with-{D}"}
      - {id: acceptance-second, step: "sh2-acceptance-as-{D}-with-{C}"}

  - id: forwarder-path
    title: Forwarder path, an edge behind NAT that cannot accept inbound
    unit: forwarder
    runs_where: local
    pass_condition: >
      {A}'s edge sits behind a NAT router that forwards nothing inbound: {B}'s probe of the
      edge fails, and the same probe reaches it with the NAT opened. The tree's own
      peering-forwarder.yml, applied from {A}'s edge to {A}'s forwarder in the three runs of
      peering-forwarder.md §7, brings the carrier up. Through the avenue, the peering
      handshakes, {B}'s WireGuard endpoint is the forwarder's public address and {A} sees
      {B} at the forwarder's carrier address, the tunnel carries both ways, the forwarder
      holds no WireGuard or TLS key of either party, and strict acceptance passes from both
      sides.
    checks:
      - {id: partner-cannot-reach-edge, step: "sfwd-{B}-cannot-reach-{A}-edge-through-its-nat"}
      - {id: probe-reaches-without-nat, step: "sfwd-the-same-probe-reaches-{A}-edge-with-the-nat-open"}
      - {id: edge-carrier-key, step: "sfwd-{A}-prepare-makes-the-carrier-key"}
      - {id: forwarder-role-applied, step: "sfwd-forwarder-role-applied"}
