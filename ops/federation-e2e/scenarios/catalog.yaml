      - {id: first-republisher-maps-its-set, step: "sh2-{C}-{D}-republisher-maps-the-offered-sets"}
      - {id: second-republisher-maps-its-set, step: "sh2-{D}-{C}-republisher-maps-the-offered-sets"}
      - {id: handshake, step: "sh2-{C}-{D}-a-wireguard-handshake"}
      - {id: first-phase-13, step: "sh2-{C}-{D}-phase-13"}
