# The federation e2e environment's scenario catalog (docs/design/federation-e2e-environment.md).
#
# A scenario states its pass condition and lists checks. Each check reads one step a unit
# records (report.jsonl, rec.py); {A} {B} {C} {D} are the unit's sovereign ids, {n} {F} {S}
# the pair unit's scenario number, first and second side for the avenue (avenue_params).
# lib/verdict.py turns the steps into outcome words: PASS, FAIL, BLOCKED, SKIP,
# NOT APPLICABLE. A required check that is BLOCKED or SKIP never passes.
#
# runs_where: ci = also run in .github/workflows/federation-e2e.yml (run.sh records its steps);
# local = the full privileged matrix on one Linux machine only.
#
# To ask for a scenario: the shared notes of the federation work, or a pull request that
# adds an entry here with `not_built: <reason>` and its pass condition.
schema: fed-e2e-catalog/1
params: {A: xaa, B: xab, C: xac, D: xad}
avenue_params:
  goatbuilder: {n: 1, F: xaa, S: xab}
  script: {n: 2, F: xab, S: xaa}
units:
  pair: {parties: "xaa xab xac"}
  three: {parties: "xaa xab xac"}
  apparmor: {parties: "xaa xab xac"}
  ipsec: {parties: "xaa xab xac"}
  # goat_versions: the released goat env resolves for a sovereign when `env run` is given no
  # --goat-version for it. previous_release: env resolves the newest published goat and
  # goatbuilder older than the ref's versions (FE2E_PREV_GOAT, FE2E_PREV_GB).
  mixed: {parties: "xaa xab", goat_versions: "xaa=0.5.18"}
  rollback: {parties: "xaa xab", previous_release: true}
  forwarder: {parties: "xaa xab xac"}
  preflight: {parties: "xaa xab"}
  killresume: {parties: "xaa xab"}
  pair-role: {parties: "xaa xab xac"}
  nodesec: {parties: "xaa xab xac"}
  shapes-oneway: {parties: "xaa xab"}
  shapes-asym: {parties: "xac xad"}
  workspace: {parties: "xaa xab"}
  # The solo unit waits on people at each human step (FE2E_SOLO_STEP_TIMEOUT each), so its
  # limit (timeout, seconds) is two days; env --parties "<lab> <partner>" replaces these ids.
  solo: {parties: "xae xaf", timeout: 172800}
  onecmd: {parties: "xaa xab"}
  nohand: {parties: "xaa xab"}
  twodrivers: {parties: "xaa xab"}
  rotation: {parties: "xaa xab xac"}
  flow: {parties: "xaa xab xac"}
  offer: {parties: "xaa xab"}
  bilateral: {parties: "xaa xab"}
  backout: {parties: "xaa xab"}

scenarios:
  - id: two-party-full
    title: Two parties, all fourteen phases, one avenue
    unit: pair
    runs_where: ci
    pass_condition: >
      Both sides complete phases 1 to 13 through the avenue, hold one agreement digest that
      selects WireGuard, the tunnel handshakes, each republisher maps both offered sets, and
      phase 14 acceptance passes from both sides with FED_ACCEPTANCE_STRICT=1 (fail=0, skip=0);
      a round trip fails with the republisher stopped or the link cut, and passes again after.
    checks:
      - {id: isolation-core-boundary, step: "s{n}-{F}-core-cannot-reach-{S}-boundary"}
      - {id: isolation-core-core, step: "s{n}-{F}-core-cannot-reach-{S}-core"}
      - {id: isolation-edge-core, step: "s{n}-{F}-edge-cannot-reach-{S}-core"}
      - {id: first-phases-1-to-5, step: "s{n}-{F}-{S}-phases-1-to-5"}
      - {id: second-phases-1-to-5, step: "s{n}-{S}-{F}-phases-1-to-5"}
      - {id: first-directory-files, step: "s{n}-{F}-{S}-their-files-are-in-place"}
      - {id: first-phases-6-to-10, step: "s{n}-{F}-{S}-phases-6-to-10"}
      - {id: second-phases-6-to-10, step: "s{n}-{S}-{F}-phases-6-to-10"}
      - {id: one-agreement, step: "s{n}-{F}-{S}-both-sides-hold-one-agreement"}
      - {id: wireguard-selected, step: "s{n}-{F}-{S}-the-agreement-selected-wireguard"}
      - {id: first-phases-11-to-12, step: "s{n}-{F}-{S}-phases-11-to-12"}
      - {id: second-phases-11-to-12, step: "s{n}-{S}-{F}-phases-11-to-12"}
      - {id: first-republisher-sets, step: "s{n}-{F}-{S}-republisher-maps-both-sets"}
      - {id: second-republisher-sets, step: "s{n}-{S}-{F}-republisher-maps-both-sets"}
      - {id: handshake, step: "s{n}-{F}-{S}-a-wireguard-handshake"}
      - {id: fabric-port-closed, step: "s{n}-{F}-{S}-fabric-port-closed-on-the-boundary"}
      - {id: first-phase-13, step: "s{n}-{F}-{S}-phase-13"}
      - {id: second-phase-13, step: "s{n}-{S}-{F}-phase-13"}
      - {id: acceptance-first, step: "s{n}-acceptance-as-{F}-with-{S}"}
      - {id: acceptance-second, step: "s{n}-acceptance-as-{S}-with-{F}"}
      - {id: core-trusts-own-ca, step: "s{n}-{F}-core-trusts-only-its-own-ca"}
      - {id: tunnel-carried, step: "s{n}-{F}-tunnel-carried-it"}
      - {id: fails-without-republisher, step: "s{n}-round-trip-fails-without-the-republisher"}
      - {id: passes-with-republisher, step: "s{n}-round-trip-passes-with-the-republisher"}
      - {id: fails-when-cut, step: "s{n}-round-trip-fails-when-cut"}
      - {id: passes-again, step: "s{n}-round-trip-passes-again"}
      - {id: wg-refused-without-waiver, step: "s{n}-wireguard-refused-without-a-waiver"}
      - {id: wg-refused-other-transport, step: "s{n}-wireguard-refused-under-another-transport"}

  - id: direct-path
    title: Direct path, the listening edge accepts inbound
    unit: pair
    runs_where: local
    pass_condition: >
      The dialing edge's WireGuard endpoint is the listening edge's own boundary address and
      tunnel port, with no relay between; the listening edge sees the dialer at the dialer's
      own boundary address and has no carrier interface (the contrast with forwarder-path);
      and the pair's traffic crossed it.
    checks:
      - {id: endpoint-is-listener, step: "s{n}-direct-path-endpoint-is-the-listener"}
      - {id: listener-sees-dialer, step: "s{n}-direct-path-listener-sees-the-dialer"}
      - {id: tunnel-carried, step: "s{n}-{F}-tunnel-carried-it"}

  - id: persistent-reception
    title: Persistent reception with no diagnostic subscriber
    unit: pair-role
    runs_where: local
    pass_condition: >
      On a core router deployed by the ref's goat-zenoh role (FE2E_CORE=role), so the
      receiving store is the one the ref renders.
      With no responder, probe or other subscriber running on either side, a fresh value
      released on each side is stored by the receiving core's own configured store; and after
      the receiving core's router restarts, with the edge router left running, a fresh value
      is stored again (the core's interest reaches the edge without an edge restart). After
      the restart a fresh value, each with a nonce never used before, is released every 2 s
      for 60 s; the first one stored passes, and the run records how many were lost before it
      and how many seconds after the core answered it was stored. Values released while the
      core's interest is travelling back (about 11 s in this environment) have no route and
      are lost by design (docs/design/zenoh-brokerless-consequences.md, row 4); none stored
      within 60 s is a FAIL naming the count.
    checks:
      - {id: no-subscriber, step: "s{n}-no-diagnostic-subscriber-runs"}
      - {id: first-to-second, step: "s{n}-{F}-to-{S}-stored-without-a-subscriber"}
      - {id: second-to-first, step: "s{n}-{S}-to-{F}-stored-without-a-subscriber"}
      - {id: first-to-second-after-core-restart, step: "s{n}-{F}-to-{S}-stored-after-the-receiving-core-restarts"}
      - {id: second-to-first-after-core-restart, step: "s{n}-{S}-to-{F}-stored-after-the-receiving-core-restarts"}
      - {id: second-edge-not-restarted, step: "s{n}-{S}-edge-was-not-restarted"}
      - {id: first-edge-not-restarted, step: "s{n}-{F}-edge-was-not-restarted"}

  - id: republisher-boundary
    title: A set that was not offered does not cross the republisher
    unit: pair-role
    runs_where: local
    pass_condition: >
      On a core router deployed by the ref's goat-zenoh role (FE2E_CORE=role), so the
      receiving store is the one the ref renders.
      A value staged under release/not-offered beside a control under release/all: the
      control is stored at the receiver, the unoffered value is not, and the republisher
      never names the unoffered set. Both directions.
    checks:
      - {id: first-control, step: "s{n}-{F}-control-crosses-the-republisher"}
      - {id: first-unoffered, step: "s{n}-{F}-unoffered-set-does-not-cross"}
      - {id: second-control, step: "s{n}-{S}-control-crosses-the-republisher"}
      - {id: second-unoffered, step: "s{n}-{S}-unoffered-set-does-not-cross"}

  - id: out-of-lane-refused
    title: Out-of-lane writes refused, shown by the receiving edge's records
    unit: pair
    runs_where: local
    pass_condition: >
      Through the agreed identity's own session, a control write in lane and two writes out
      of lane (ops/fabric, and the receiver's own wire name): the receiving edge records an
      allow for the control and a deny for each refused write, and the receiving core holds
      the control and neither refused key. Both directions.
    checks:
      - {id: first-allow, step: "s{n}-{F}-to-{S}-edge-allowed-the-control"}
      - {id: first-deny, step: "s{n}-{F}-to-{S}-edge-denied-out-of-lane"}
      - {id: first-core, step: "s{n}-{F}-to-{S}-core-holds-control-not-refused"}
      - {id: second-allow, step: "s{n}-{S}-to-{F}-edge-allowed-the-control"}
      - {id: second-deny, step: "s{n}-{S}-to-{F}-edge-denied-out-of-lane"}
      - {id: second-core, step: "s{n}-{S}-to-{F}-core-holds-control-not-refused"}

  - id: identity-refused
    title: Forged name, wrong CA and impersonation refused
    unit: pair
    runs_where: local
    pass_condition: >
      Phase 14 acceptance (strict) passes from both sides, which includes the forged-name and
      impersonation probes being refused by the receiving edge beside an allowed agreed probe;
      and a session holding a certificate from a CA neither party trusts stores nothing.
    checks:
      - {id: acceptance-first, step: "s{n}-acceptance-as-{F}-with-{S}"}
      - {id: acceptance-second, step: "s{n}-acceptance-as-{S}-with-{F}"}
      - {id: wrong-ca, step: "s{n}-wrong-ca-session-is-refused"}

  - id: acceptance-exit-status
    title: Skipped required checks do not exit 0
    unit: pair
    runs_where: local
    pass_condition: >
      acceptance.sh run without FED_ACCEPTANCE_STRICT and without the probes its refusal
      checks need exits non-zero.
    checks:
      - {id: nonstrict-skip-not-zero, step: "s{n}-acceptance-with-a-skipped-check-does-not-exit-0"}

  - id: rerun-every-phase
    title: Every phase rerun on a running peering
    unit: pair
    runs_where: local
    pass_condition: >
      Phases 1-4, 6-9 and 11-13 rerun on both sides succeed; the WireGuard key and every
      peering key are unchanged; no container, interface or republisher is duplicated; the
      edge and republisher configuration snapshot is unchanged and a round trip passes.
    checks:
      - {id: first-rerun-1-4, step: "s{n}-{F}-rerun-phases-1-to-4"}
      - {id: first-rerun-6-9, step: "s{n}-{F}-rerun-phases-6-to-9"}
      - {id: first-rerun-11-13, step: "s{n}-{F}-rerun-phases-11-to-13"}
      - {id: second-rerun-1-4, step: "s{n}-{S}-rerun-phases-1-to-4"}
      - {id: second-rerun-6-9, step: "s{n}-{S}-rerun-phases-6-to-9"}
      - {id: second-rerun-11-13, step: "s{n}-{S}-rerun-phases-11-to-13"}
      - {id: first-keys-kept, step: "s{n}-{F}-rerun-kept-the-working-keys"}
      - {id: second-keys-kept, step: "s{n}-{S}-rerun-kept-the-working-keys"}
      - {id: first-nothing-duplicated, step: "s{n}-{F}-rerun-duplicated-nothing"}
      - {id: second-nothing-duplicated, step: "s{n}-{S}-rerun-duplicated-nothing"}
      - {id: round-trip, step: "s{n}-round-trip-after-rerun"}
      - {id: rotation-explicit-only, step: "s{n}-rotation-only-on-request"}

  - id: three-party-shared-edge
    title: Three parties, two peerings on one shared edge and one shared core
    unit: three
    runs_where: local
    pass_condition: >
      {A} peers with {B} and with {C} on ONE edge host and ONE core host. Each peering passes
      strict acceptance by its own agreement; {B} never receives {A}'s bilateral set for {C}
      and {C} never receives the set for {B}, beside each receiving its own; the refusals that
      keep two peerings on one host apart fire (interface, port, metrics port, inventory name).
    checks:
      - {id: ab-acceptance, step: "s3-acceptance-as-{A}-with-{B}"}
      - {id: ba-acceptance, step: "s3-acceptance-as-{B}-with-{A}"}
      - {id: ac-acceptance, step: "s3-acceptance-as-{A}-with-{C}"}
      - {id: ca-acceptance, step: "s3-acceptance-as-{C}-with-{A}"}
      - {id: b-receives-own, step: "s3-both-up-{B}-receives-its-own-set"}
      - {id: c-receives-own, step: "s3-both-up-{C}-receives-its-own-set"}
      - {id: b-never-c-set, step: "s3-both-up-{B}-never-receives-{C}-set"}
      - {id: c-never-b-set, step: "s3-both-up-{C}-never-receives-{B}-set"}
      - {id: refuse-interface, step: "s3-a-second-peering-may-not-take-the-first-ones-interface"}
      - {id: refuse-port, step: "s3-a-second-peering-may-not-take-the-first-ones-port"}
      - {id: refuse-metrics, step: "s3-a-second-republisher-may-not-take-the-first-ones-metrics-port"}
      - {id: refuse-inventory-name, step: "s3-preflight-refuses-one-inventory-name-in-two-peerings"}

  - id: second-peering-while-first-carries
    title: A second peering added while the first carries traffic
    unit: three
    runs_where: local
    pass_condition: >
      Adding {A}-{C} leaves {A}-{B}'s tunnel, keys, edge and republisher configuration
      unchanged, its agreement digest unchanged, and {A}-{B} passes strict acceptance after;
      re-running either peering's phases leaves the other untouched.
    checks:
      - {id: first-untouched, step: "s3-adding-{C}-left-{B}-untouched"}
      - {id: first-agreement-digest-unchanged, step: "s3-adding-{C}-left-{B}-agreement-digest"}
      - {id: first-acceptance-after, step: "s3-acceptance-as-{A}-with-{B}-after-{C}"}
      - {id: rerun-b-left-c, step: "s3-{B}-rerun-left-{C}-untouched"}
      - {id: rerun-c-left-b, step: "s3-{C}-rerun-left-{B}-untouched"}
      - {id: c-round-trip-after-b-rerun, step: "s3-{C}-round-trip-after-{B}-rerun"}
      - {id: b-round-trip-after-c-rerun, step: "s3-{B}-round-trip-after-{C}-rerun"}

  - id: directory-two-peerings
    title: One party publishing packages for two peerings to the directory
    unit: three
    runs_where: local
    pass_condition: >
      With {A} holding peerings with {B} and {C}, the directory still names the package {B}
      composed against, and a rerun of phases 5 to 7 by {B} after {A} publishes its second
      package composes the same agreement digest; {B}'s peering keeps carrying.
    checks:
      - {id: names-first-package, step: "s3-directory-names-the-{B}-package"}
      - {id: second-package-visible, step: "s3-what-{B}-sees-if-{A}-republishes"}
      - {id: first-still-carries, step: "s3-{B}-still-carries-after-the-republish"}
      - {id: rerun-5-to-7-same-digest, step: "s3-{B}-rerun-5-to-7-composes-the-same-agreement"}

  - id: ubuntu-2604-apparmor
    title: The edge tunnel under the stock Ubuntu 26.04 AppArmor profile for wg
    unit: apparmor
    runs_where: local
    pass_condition: >
      With the machine's AppArmor profile `wg` in force (Ubuntu 26.04 LTS ships it; it lets
      /usr/bin/wg read keys only under /etc/wireguard), phases 11-12 bring the tunnel up on
      both edges and it handshakes.
    checks:
      - {id: first-phases-1-to-5, step: "s1-{A}-{B}-phases-1-to-5"}
      - {id: first-phases-11-to-12, step: "s1-{A}-{B}-phases-11-to-12"}
      - {id: handshake, step: "s1-{A}-{B}-a-wireguard-handshake"}

  - id: node-ports-declared
    title: An edge refuses to run at the host firewall's default, and each edge and core answers on exactly its declared ports
    unit: nodesec
    runs_where: local
    pass_condition: >
      With {A}'s edge host firewall baseline at the role's default (goat_host_firewall_baseline
      false), {A}'s phases 1-2 refuse with GB-279, before phase 2 changes the edge. Then, with
      the baseline on for each edge (as every scenario runs, lib/hostfw.sh) and a full two-party
      federation up, every TCP port (1-65535) and a list of relevant UDP ports is scanned on each
      edge and each core: from the partner's edge toward our edge's boundary address, toward our
      edge's tunnel address (the partner's own egress filter lifted for the scan), and toward our
      core; and from the internal network, from our core host toward our edge and from a scanner
      (the management source) toward our edge and our core. Each target answers on exactly the
      declared ports and nothing else, and on every one of them. An edge's declared set is the
      rule set the role loaded on it; a core's is the ref's host firewall profile when the core
      carries one, else the operator's baseline: core internal, TCP 7447 and TCP 22 from the
      management source (ADR 1219); core from the partner, nothing. The SPIRE federation
      forwards the peering roles open and the drill's own surfaces (core REST 8000 and SPIRE
      server 8443 on the internal network, probe REST ports on the edge's internal side) are
      allowed at those exact ports and sides only, and each scan lists them separately. Every
      scan's full record is in RECORD/<step>.json.
    checks:
      - {id: default-refused, step: "ns-{A}-edge-default-refused"}
      - {id: federation-up, step: "s1-{A}-{B}-a-wireguard-handshake"}
      - {id: a-edge-boundary, step: "ns-{A}-edge-from-{B}-edge-boundary"}
      - {id: a-edge-tunnel, step: "ns-{A}-edge-from-{B}-edge-tunnel"}
      - {id: a-core-partner, step: "ns-{A}-core-from-{B}-edge"}
      - {id: a-edge-core, step: "ns-{A}-edge-from-{A}-core"}
      - {id: a-edge-mgmt, step: "ns-{A}-edge-from-{A}-scanner"}
      - {id: a-core-mgmt, step: "ns-{A}-core-from-{A}-scanner"}
      - {id: b-edge-boundary, step: "ns-{B}-edge-from-{A}-edge-boundary"}
      - {id: b-edge-tunnel, step: "ns-{B}-edge-from-{A}-edge-tunnel"}
      - {id: b-core-partner, step: "ns-{B}-core-from-{A}-edge"}
      - {id: b-edge-core, step: "ns-{B}-edge-from-{B}-core"}
      - {id: b-edge-mgmt, step: "ns-{B}-edge-from-{B}-scanner"}
      - {id: b-core-mgmt, step: "ns-{B}-core-from-{B}-scanner"}

  - id: node-firewall-profile
    title: The baseline host firewall profile, and one tightening override, both pass the port scan
    unit: nodesec
    runs_where: local
    pass_condition: >
      Each sovereign switches the ref's goat-host-firewall baseline on in its own group_vars
      (goat_host_firewall_baseline, the management sources, and named loosenings with a
      reason for the drill's own surfaces), committed to its trunk, and reruns phases 11-12,
      whose plays (peering-wg.yml, peering-republisher.yml) apply the role. The scans of
      node-ports-declared then pass against the rule set the role loaded on each host (the
      ports its accept rules admit from the scanning source; no separate SPIRE or drill list);
      then with one tightening override (ssh-management on each edge from the management host
      only), the edge scans from the core host and from the management source pass against
      the tightened rule set. A host the switch is on for that carries no loaded rule set
      FAILs its checks. On a ref with no goat-host-firewall role every check is BLOCKED.
    checks:
      - {id: a-edge-boundary, step: "nsp-{A}-edge-from-{B}-edge-boundary"}
      - {id: a-edge-tunnel, step: "nsp-{A}-edge-from-{B}-edge-tunnel"}
      - {id: a-core-partner, step: "nsp-{A}-core-from-{B}-edge"}
      - {id: a-edge-core, step: "nsp-{A}-edge-from-{A}-core"}
      - {id: a-edge-mgmt, step: "nsp-{A}-edge-from-{A}-scanner"}
      - {id: a-core-mgmt, step: "nsp-{A}-core-from-{A}-scanner"}
      - {id: b-edge-boundary, step: "nsp-{B}-edge-from-{A}-edge-boundary"}
      - {id: b-edge-tunnel, step: "nsp-{B}-edge-from-{A}-edge-tunnel"}
      - {id: b-core-partner, step: "nsp-{B}-core-from-{A}-edge"}
      - {id: b-edge-core, step: "nsp-{B}-edge-from-{B}-core"}
      - {id: b-edge-mgmt, step: "nsp-{B}-edge-from-{B}-scanner"}
      - {id: b-core-mgmt, step: "nsp-{B}-core-from-{B}-scanner"}
      - {id: override-a-edge-core, step: "nso-{A}-edge-from-{A}-core"}
      - {id: override-a-edge-mgmt, step: "nso-{A}-edge-from-{A}-scanner"}
      - {id: override-b-edge-core, step: "nso-{B}-edge-from-{B}-core"}
      - {id: override-b-edge-mgmt, step: "nso-{B}-edge-from-{B}-scanner"}

  - id: node-firewall-three-party
    title: Three parties on one shared edge and core still pass with the baseline profile on
    unit: nodesec
    runs_where: local
    pass_condition: >
      With the goat-host-firewall baseline on in every party's group_vars before the first
      phase, {A} peers with {B} and with {C} on one edge host and one core host (scenario 3):
      both peerings pass strict acceptance from {A}'s side, each partner receives its own set,
      and {A}'s edge and core answer on exactly the ports the loaded rule set admits for both
      peerings, from each partner and from the internal side. On a ref with no
      goat-host-firewall role every check is BLOCKED.
    checks:
      - {id: ab-acceptance, step: "s3-acceptance-as-{A}-with-{B}"}
      - {id: ac-acceptance, step: "s3-acceptance-as-{A}-with-{C}"}
      - {id: b-receives-own, step: "s3-both-up-{B}-receives-its-own-set"}
      - {id: c-receives-own, step: "s3-both-up-{C}-receives-its-own-set"}
      - {id: a-edge-from-b-boundary, step: "ns3-{A}-edge-from-{B}-edge-boundary"}
      - {id: a-edge-from-c-boundary, step: "ns3-{A}-edge-from-{C}-edge-boundary"}
      - {id: a-edge-from-b-tunnel, step: "ns3-{A}-edge-from-{B}-edge-tunnel"}
      - {id: a-edge-from-c-tunnel, step: "ns3-{A}-edge-from-{C}-edge-tunnel"}
      - {id: a-edge-core, step: "ns3-{A}-edge-from-{A}-core"}
      - {id: a-edge-mgmt, step: "ns3-{A}-edge-from-{A}-scanner"}
      - {id: a-core-mgmt, step: "ns3-{A}-core-from-{A}-scanner"}

  - id: kill-resume
    title: A run killed at each phase resumes correctly
    unit: killresume
    runs_where: local
    pass_condition: >
      On the first side ({F}), each phase 1-13 is started, its driver's process tree is
      killed -9 inside the edge host partway through, and the phase is run again with
      --from P --to P: every rerun exits 0. The peering then ends as an uninterrupted run
      does: the same files, containers, interfaces, tables and units as the clean second
      side, nothing duplicated, each WireGuard key the one its partner holds, every peering
      key matching its certificate, one agreement digest on both sides, a handshake, and
      strict acceptance (FED_ACCEPTANCE_STRICT=1, fail=0, skip=0) from both sides. Whether
      each kill landed inside its phase is recorded (optional checks), with its timing in
      kills.tsv. Phase 11's kill is aimed, not timed: it lands once the WireGuard peering
      role has written its firewall table (after the link environment) and before the
      handler restarts the link; kr-phase-11-kill.txt records both files' write times and
      the interface's peers at the kill.
    checks:
      - {id: phase-1-resumed, step: "kr-phase-1-resumed"}
      - {id: phase-2-resumed, step: "kr-phase-2-resumed"}
      - {id: phase-3-resumed, step: "kr-phase-3-resumed"}
      - {id: phase-4-resumed, step: "kr-phase-4-resumed"}
      - {id: phase-5-resumed, step: "kr-phase-5-resumed"}
