schema: goatbuilder-target/v1
type: breakglass
# A small computer is the type's machine; a host-class one (a Thor) plays the
# role at sites today, so the type accepts that family beside it.
families: [small-computer, host-class]
encryption: root
inventory: "inventory/{site}-breakglass-nodes.ini"
site:
  declared_by: has_breakglass_node
  absent_reason: breakglass_absent_reason
  standup: phase-14
phases:
  - label: "break-glass node (ADR 1114 — the way in when mesh + control plane are both down)"
    plays:
      - {play: breakglass-nodes.yml, args: "-e target={group}"}
