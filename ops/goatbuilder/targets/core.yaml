# A core machine: the management plane. Its steps hold logic (a joiner seeds
# from its founder and wires replication both ways), so most are named steps
# of goatbuilder's own; the data router is a play like any other.
schema: goatbuilder-target/v1
type: core
families: [host-class, cloud]
group: "{site_us}_hosts"
preflight: "{group}"
phases:
  - builtin: seed-and-replicate
    when: joiner
  - builtin: signal-federation
    when: joiner
  - builtin: site-leaves
    when: joiner
  # The site's own data router (gate row I3): its fabric does not depend on
  # reaching the founder's. The play's pre-flight refuses a node without its
  # router leaf certificate. In per-uuid-slot-pool mode the role refuses to
  # render without the portal's slot fragment, and a joining site runs no
  # portal until gate row I4: the first-render check (as standup phase 9 asks
  # for it) lets a router that serves no holder yet render its slots
  # unassigned, granting nobody; holders keep using the founder's router.
  - tag: data router
    label: "the site's own Zenoh router (zenoh-deploy.yml), limited to the node: the site's fabric runs on its own router, not the founder's; its slots render unassigned until the site has a portal (gate row I4)"
    when: joiner
    plays:
      - {play: zenoh-deploy.yml, args: "-e target={site_group} -e zenoh_slot_fragment_bootstrap_if_unassigned=true"}
  - builtin: front-door
    when: joiner
  - builtin: health-publishers
    when: joiner
  # Site services each site turns on in its group_vars. Each play ends at once
  # where its switch is off (decoy: deception_enabled; deadman-watch:
  # deadman_watch_enabled), and traefik-compression-metrics with its switch off
  # takes the exporter down, so a machine of a site that runs none gets none.
# A joining site's core machine, as for the health publishers beside it.
  - tag: site services
    when: joiner
    label: "the site services the site's group_vars turn on (decoy layer, dead-man watcher, Traefik compression exporter), limited to the node; each is a no-op, or removes itself, where its switch is off"
    plays:
      - {play: decoy-deploy.yml, args: "-e target={site_group}"}
      - {play: deadman-watch-deploy.yml, args: "-e target={site_group}"}
      - {play: traefik-compression-metrics-deploy.yml, args: "-e target={site_group}"}
  # Host services with a switch of their own (off by default): each play says in
  # one line that its switch is off and ends, so a site that turns none on gets
  # none of them.
  - tag: switched services
    when: joiner
    label: "the host services the site's group_vars switch on (budget notifier, self-claims collector, image substrate client, host network publisher), limited to the node; each says so and changes nothing where its switch is off"
    plays:
      - {play: budget-notify-deploy.yml, args: "-e target={site_group}"}
      - {play: names-collector-deploy.yml, args: "-e target={site_group}"}
      - {play: oci-substrate-deploy.yml, args: "-e target={site_group}"}
      - {play: host-net-publish-deploy.yml, args: "-e target={site_group}"}
  - builtin: mesh-dns
    when: joiner
  - builtin: single-host-obs
    when: joiner
  - builtin: founder-bootstrap
    when: founder
