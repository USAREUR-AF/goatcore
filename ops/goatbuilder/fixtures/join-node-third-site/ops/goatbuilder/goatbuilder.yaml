# The synthetic goatnet zagros: a founder, a joiner, and a third site joining.
schema: goatbuilder/v1
repo:
  source: example-org/zagros
  image_namespace: ghcr.io/example-org
components:
  netbird-mgmt:
    declared_in: declared/pins.yaml
deploy:
  ssh_user: operator
  aws_profile: zagros-example
environments:
  - name: zagros
    converger: push-ansible
    sites:
      - name: alpha
        role: founder
        classes:
          core: {}
      - name: beta
        role: joiner
        joins: alpha
        classes:
          core: {}
      - name: gamma
        role: joiner
        joins: alpha
        classes:
          core: {}
promotion:
  path:
    - name: zagros
      kind: rung
      environment: zagros
