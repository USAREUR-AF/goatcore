# gamma: the third site. Its node is not enrolled yet, so its mesh address is
# the placeholder phase 12 fills. Signal federation is declared off.
goatnet_founder: false
join_founder_site: alpha
mesh_ip_a: TBD_GAMMA_MESH_IP_A
has_breakglass_node: false
breakglass_absent_reason: the operator console sits in the same rack
has_network_jump_node: false
network_jump_absent_reason: the switch is managed from the same rack
mgmt_container_host_port: 8081
signal_proto: https
auth_issuer: https://auth.zagros.example.org/
auth_audience: netbird
auth_oidc_config_endpoint: https://auth.zagros.example.org/.well-known/openid-configuration
kratos_secrets_cookie_env: ZAGROS_KRATOS_COOKIE
site_enrollment_dns: netbird.zagros.example.org
mesh_enrollment_url: https://netbird.zagros.example.org:443
signal_federation_absent_reason: one management node at gamma holds every peer that signals through it
