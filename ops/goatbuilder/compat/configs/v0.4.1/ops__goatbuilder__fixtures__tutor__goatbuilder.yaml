# The tutor's fixture (`goatbuilder tutor`, docs/design/goatbuilder.md):
# a dev environment where machines misbehave on purpose, so the learner reads
# pending and unknown (lesson 2), and a preprod environment where every machine
# behaves, so a deploy and a rollback complete (lessons 3 and 5). `db-schema`
# is a data artifact, which a rollback must refuse (declared/artifacts.yaml).
schema: goatbuilder/v1
preset: lite
repo:
  source: example-org/example-repo
  image_namespace: ghcr.io/example-org
components:
  portal:
    declared_in: declared/pins.yaml
  db-schema:
    declared_in: declared/pins.yaml
environments:
  - name: dev
    converger: push-ansible
  - name: preprod
    converger: push-ansible
promotion:
  path:
    - name: dev
      kind: rung
      environment: dev
    - name: preprod
      kind: rung
      environment: preprod
