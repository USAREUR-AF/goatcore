# The kept configuration files (A2): every goatbuilder.yaml in each release's
# tree, every refusal fixture, and every whole example in its documents, kept
# once, under the first release that carried it. `expect` is what that
# release's binary did with it: valid (exit 0), refused (exit 1, a checks
# document) or error (with the code it printed). Every later build must do
# the same, printing the same code or the one `named`. Written by
# `compat.py refresh`; `named` is the catalog error the release's documents
# name for the refusal, added by hand.
configs:
- file: v0.4.1/crates__goatbuilder__tests__fixtures__configs__not-yaml.yaml
  release: goatbuilder/v0.4.1
  source: crates/goatbuilder/tests/fixtures/configs/not-yaml.yaml
  expect: error
  code: null
  named: GB-025
  note: 'the refusal prints no catalog code (C5): the documents name GB-025'
