# The standup rehearsal fixture (goatbuilder-conformance.md §"Rehearsing a
# standup on the fixture"): one environment, one founder site with three
# machine classes, five components spread across them. `standup --mock` on
# this directory declares every component for every class in the doctrine's
# phase order (converger.yaml `standup:`), converges each through the scripted
# converger, and verifies every record. `records/` starts empty on purpose.
schema: goatbuilder/v1
preset: lite
repo:
  source: example-org/example-repo
  image_namespace: ghcr.io/example-org
components:
  netbird-mgmt:
    declared_in: declared/pins.yaml
  zenoh-router:
    declared_in: declared/pins.yaml
  portal:
    declared_in: declared/pins.yaml
  obs-stack:
    declared_in: declared/pins.yaml
  breakglass-node:
    declared_in: declared/pins.yaml
environments:
  - name: dev
    converger: push-ansible
    sites:
      - name: alpha
        role: founder
        classes:
          core: {}
          obs: {}
          breakglass: {}
promotion:
  path:
    - name: dev
      kind: rung
      environment: dev
