# A checkout for the run-record verbs (runs, show, runs diff): the basic
# fixture's shape, with its state directory in this fixture, so the kept
# documents read the two run records under ../../state/runs.
schema: goatbuilder/v1
preset: lite
repo:
  source: example-org/example-repo
  image_namespace: ghcr.io/example-org
components:
  portal:
    declared_in: declared/pins.yaml
environments:
  - name: dev
    converger: push-ansible
promotion:
  path:
    - name: dev
      kind: rung
      environment: dev
deploy:
  state_dir: ops/goatbuilder/compat/documents/fixtures/runs/state
