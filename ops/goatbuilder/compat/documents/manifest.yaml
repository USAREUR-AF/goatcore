# The kept documents (A4): each invocation is run from the repository root with
# `-o <format>` in front, against the fixtures kept beside this file, and its
# output must stay a superset of the release's document of the same name. The
# exit codes, and the documents, are written by `compat.py refresh` from the
# released binary. A change that moves a kept exit code edits `exit` here in
# the same pull request, with its reason in `exit_changed`; `release_exit` is
# what the release did, and the check refuses an `exit` that differs from it
# without a reason. So every change to a promised exit code is a reviewed
# baseline change. To keep another document,
# add its invocation here and rerun the refresh against the last release's
# binary.
documents:
- name: validate-basic
  format: json
  args:
  - validate
  - -C
  - .
  - ops/goatbuilder/compat/documents/fixtures/basic/goatbuilder.yaml
  exit: 0
  release_exit: 0
