# Gate row J28 (docs/design/goatbuilder-v1-gate.md): every ops/ansible/*-deploy.yml
# is reached by a goatbuilder verb, or listed here: under unreached: with why no
# verb should run it, or under owed: with the gate row that will route it.
# ops/ci/check-deploy-plays-reached.py reads this file, and CI runs it --strict
# (.github/workflows/deploy-play-reach.yml): a new play no verb reaches fails
# until it has a component, a phase, a type or an entry here.
schema: goatbuilder-deploy-plays/v1

# Plays a verb runs only some tags of. A play they import is not reached
# through them.
runs_in_part:
  site-services.yml: "standup's LAN branch runs only its LAN-surface tags (lan-dns, traefik, stun); the rest of it is run by hand"

# Plays no verb reaches, each with why that is the right answer. A play a
# reason names must be one a verb reaches (the check holds it to that).
unreached:
  e2e-canary-secret-deploy.yml: "a test play: the e2e harness's overlay gives it a pins row (ops/e2e/overlay.py) and deploys it through deploy-component.sh, to exercise alias following (ops/e2e/hermetic.sh); no goatnet runs it"
  netbird-boot-selfheal-deploy.yml: "a re-run of one role: the netbird-boot-selfheal role runs in mgmt-host-baseline.yml (standup phase 2, join-node phase 5, the obs type) and breakglass-nodes.yml (the breakglass type)"
  netbird-client-pin-deploy.yml: "a re-run of one role: the netbird-client-pin role runs in mgmt-host-baseline.yml (standup phase 2, join-node phase 5, the obs type) and breakglass-nodes.yml (the breakglass type)"
  ntp-health-agent-deploy.yml: "a re-run of one role on a host already bootstrapped: the ntp-health-agent role runs in site-bootstrap.yml (standup, join-node) and obs-host-bootstrap.yml (the obs type)"

# Plays a verb should run and none does yet: tracked gaps, not answers. Each
# names the gate row that routes it; the change that gives it a component, a
# phase or a type takes it off this list. --strict passes on them; gate row J28
# is done when this list is empty.
owed:
  budget-notify-deploy.yml: "J28: a host reconciler and systemd timer (no image), run by hand; needs a phase or a release component"
  compliance-proxy-deploy.yml: "J28: oauth2-proxy and a signing proxy in front of a cloud dashboard, imported by site-services.yml, whose non-LAN plays standup does not run"
  crutch-tier-deploy.yml: "J28: the optional public mTLS tier (off unless crutch_tier_enabled) on cloud hosts made by Terraform; no type builds those hosts"
  dashboard-fence-deploy.yml: "J28: the oauth2-proxy fences in front of the dashboard, run by hand after dashboard-deploy.yml; standup does not run them"
  deadman-watch-deploy.yml: "J28: the dead-man watcher on a mgmt host (off unless deadman_watch_enabled), run by hand"
  decoy-deploy.yml: "J28: the decoy layer (off unless deception_enabled), run by hand"
  goat-logship-deploy.yml: "J28: the off-box log collector (a Vector image pinned in its role, not in the pins), run by hand"
  goat-relay-deploy.yml: "J28: the Rust relay tier (a goat-relay image pinned in its role, not in the pins), run by hand during its cutover"
  host-net-publish-deploy.yml: "J28: the host network health publisher (off unless host_net_publish_enabled), run by hand"
  isitup-deploy.yml: "J28: the status page behind oauth2-proxy, imported by site-services.yml, whose non-LAN plays standup does not run"
  minio-console-deploy.yml: "J28: the MinIO console's OIDC sign-in and route, imported by site-services.yml, whose non-LAN plays standup does not run"
  names-collector-deploy.yml: "J28: the self-claims collector beside goat-get on a mgmt host, run by hand"
  node-exporter-deploy.yml: "J28: a standalone node_exporter for scraped hosts with no obs stack (an image tag in its role, not in the pins), run by hand"
  oci-substrate-deploy.yml: "J28: the image distribution substrate's docker client config and admit-audit re-render, run by hand"
  relay-health-cloud-deploy.yml: "J28: the relay-health dashboard in standalone mode on a cloud host made by Terraform, run by hand"
  relay-health-deploy.yml: "J28: the relay-health dashboard on a mgmt host, imported by site-services.yml, whose non-LAN plays standup does not run"
  surface-visit-deploy.yml: "J28: the per-visit audit emitters (off unless surface_visit_enabled; a goat-surface-visit image pinned in its role, not in the pins), run by hand"
  traefik-compression-metrics-deploy.yml: "J28: the Traefik compression exporter (off unless traefik_compression_metrics_enabled), run by hand"
