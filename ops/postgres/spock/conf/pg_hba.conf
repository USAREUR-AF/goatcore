# PostgreSQL client authentication for the goat multi-site Spock cluster.
# Site-specific replicator entries are rendered by Ansible at deploy time.
#
# TYPE   DATABASE         USER         ADDRESS         METHOD

# --- Local sockets (used by the container's postgres superuser) ------------
local    all              all                          trust

# --- Container-local loopback ----------------------------------------------
host     all              all          127.0.0.1/32    scram-sha-256
host     all              all          ::1/128         scram-sha-256

# --- Netbird application users (management / dashboard / events) -----------
# Access comes from other containers in the same docker-compose network;
# scope by DB and user, password auth over the container network.
host     netbird          netbird      0.0.0.0/0       scram-sha-256
host     netbird_idp      netbird      0.0.0.0/0       scram-sha-256
host     netbird_events   netbird      0.0.0.0/0       scram-sha-256

# --- Phase 1-2 application DSN (management-a uses user=postgres) -----------
# Upstream netbirdio/management's init scripts do NOT create a 'netbird' role,
# so the Phase 1-2 compose DSN connects as the superuser 'postgres'. Without
# this line, management-a crash-loops with "no pg_hba.conf entry for ...
# user postgres". Before Phase 3, switch management DSN to a least-privilege
# role and remove this broad rule.
host     all              postgres     0.0.0.0/0       scram-sha-256

# --- Spock logical replication: replicator role (base rules) ---------------
# Both rules are needed: 'all' for Spock's catalog queries (spock.node_info,
# schema introspection) and 'replication' for the physical replication slot
# protocol (pg_basebackup + Spock sub_create both consume this).
# Source CIDR is wide-open here because mesh-IP scoping is handled by the
# Netbird WireGuard overlay + SG rules, not by pg_hba.
host     all              replicator   0.0.0.0/0       scram-sha-256
host     replication      replicator   0.0.0.0/0       scram-sha-256

# --- Phase 2 observability / security sidecars ----------------------------
# admit-audit sidecar (see ops/admit-audit + ops/ansible/roles/admit-audit)
# runs a least-privilege read-only role. Connects from the docker compose
# mgmt network.
host     all              admit_audit  0.0.0.0/0       scram-sha-256
# postgres-exporter (prometheus) uses a 'monitoring' role with pg_monitor
# membership — same scope.
host     all              monitoring   0.0.0.0/0       scram-sha-256
# SPIRE server (Phase A workload identity) — own logical DB on this
# cluster; connects from the docker compose mgmt network. The spire role also
# appends this at runtime (idempotent) so existing clusters get it without an
# image rebuild.
host     all              spire        0.0.0.0/0       scram-sha-256
# goat-id-console (ADR 1165 step A) — its two databases only, its own role.
# The id-admin-console role also appends this at runtime (idempotent) so
# existing clusters get it without an image rebuild.
host     id_console_onboard,id_console_orgs id_console 0.0.0.0/0 scram-sha-256
# goat-zenoh-portal registry (ADR 1165 step A) — its one database, its own role.
# The goat-zenoh-portal-store role also appends this at runtime (idempotent) so
# existing clusters get it without an image rebuild.
host     portal_registry  portal       0.0.0.0/0       scram-sha-256

# --- Spock logical replication from peer sites (mesh overlay IPs) ----------
# Ansible appends one line per peer site from Terraform/mesh inventory.
# Template format:
#   host   netbird          replicator   <peer-mesh-ip>/32   scram-sha-256
#   host   netbird_idp      replicator   <peer-mesh-ip>/32   scram-sha-256
#   host   replication      replicator   <peer-mesh-ip>/32   scram-sha-256
# --- BEGIN ANSIBLE SITES ---
# --- END ANSIBLE SITES ---
