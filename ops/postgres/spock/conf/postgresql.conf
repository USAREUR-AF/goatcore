# PostgreSQL 16 config for the goat multi-site Spock deployment.
# See docs/design/ha-multi-site.md §5 for design rationale.

# --- Listeners --------------------------------------------------------------
listen_addresses = '*'
port = 5432

# --- Authentication ---------------------------------------------------------
hba_file = '/etc/postgresql/pg_hba.conf'
password_encryption = scram-sha-256

# --- Memory + connection budget ---------------------------------------------
# Sized for production-shape mgmt-host (≥4 GiB RAM, ≥2 vCPU). Cloud-PoC hosts
# (1.9 GiB t3.small class) MUST override at runtime
# via ALTER SYSTEM with scaled-down values; see F-020 §"Per-host-shape sizing"
# for the cloud-PoC override matrix.
#
# max_connections sized per F-020 to cover six-site full-stack steady-state +
# headroom: netbird-mgmt + signal + Kratos + Hydra + db-policy-engine +
# pgbackrest + OpenObserve + Spock workers + a 2× burst buffer.
#
# work_mem dropped from prior 16MB default because at max_connections=300, a
# query storm with each backend holding 16MB for sort/hash would peak at
# ~4.8 GB just for work_mem — exceeds production-host RAM budget. 8MB keeps
# peak query memory under 2.4 GB.
max_connections = 300
shared_buffers = 768MB
work_mem = 8MB
maintenance_work_mem = 64MB
effective_cache_size = 1GB

# --- WAL + logical replication (Spock prerequisites) ------------------------
# wal_level=logical is the hard requirement. max_slot_wal_keep_size is the
# *most important* setting — without it, a multi-day satellite-link outage
# accumulates WAL on the hub until disk fills, crashing PG for ALL sites.
# With 1GB, a disconnected site's slot is invalidated after 1GB and must be
# rebuilt via pg_basebackup + Spock re-subscribe. Validate this ceiling
# against measured WAL generation rate during Phase 2.
wal_level = logical
max_worker_processes = 16
max_replication_slots = 10
max_wal_senders = 10
max_slot_wal_keep_size = 1GB

# --- Conflict resolution (Last-Write-Wins) needs commit timestamps ----------
track_commit_timestamp = on

# --- Spock preload ----------------------------------------------------------
shared_preload_libraries = 'spock'

# --- Output-plugin allowlist (REQUIRED, and it is new) ----------------------
# Recent PostgreSQL 16 minors restrict which libraries a REPLICATION user may
# name as a logical-decoding output plugin. The list is empty by default, so
# Spock's plugin is refused and NO SUBSCRIPTION CAN EVER START:
#
#   ERROR: could not create replication slot on provider:
#   ERROR: library "spock_output" may not be used as an output plugin
#   HINT:  If it is safe for all REPLICATION users to use this library as an
#          output plugin, add it to "output_plugin_libraries" and reload.
#   query: CREATE_REPLICATION_SLOT "spk_netbird_node_a_sub_from_a" LOGICAL spock_output
#
# This is a PRODUCTION setting, not a test accommodation. Without it every
# cross-site Spock subscription on this image fails at slot creation, so
# multi-site replication would have broken on the next postgres-spock image
# bump — the fleet is unaffected today only because it runs a pin built before
# the base picked the restriction up.
#
# It arrived through the base image rather than through anything committed
# here: `pgedge-postgres:16-spock5-minimal` was a floating tag previously
# (see the Dockerfile), and moved twice in the fortnight the smoke test spent
# red. The two-instance replication check is what caught it; nobody read it,
# because the job had been failing for two weeks for an unrelated reason.
#
# Scope is one library, deliberately. The HINT's "safe for all REPLICATION
# users" is the actual question, and the answer for this cluster is that the
# only replication user is the Spock replicator role (see pg_hba.conf), so
# naming exactly the plugin it needs grants nothing else.
output_plugin_libraries = 'spock_output'

# --- Logging ----------------------------------------------------------------
log_destination = 'stderr'
logging_collector = off
log_line_prefix = '%m [%p] %q%u@%d '
log_statement = 'ddl'
log_min_duration_statement = 1000
log_connections = on
log_disconnections = on

# Spock apply behaviour (issue #1505, ADR 1193, F-574). Measured by
# ops/postgres/spock/tests/partition-revoke on Spock 5.0.11:
#   - The default exception_behaviour, transdiscard, drops a WHOLE remote
#     transaction when one change in it fails. After a partition the common
#     failure is an update to a row the other site deleted, so every other
#     change in that transaction was silently lost and the sites diverged.
#     discard skips only the failing change and applies the rest.
#   - Conflicts were only LOG lines. save_resolutions records them in
#     spock.resolutions, and failed changes go to spock.exception_log, so
#     postgres-exporter can count both (spock_resolutions, spock_exceptions).
spock.exception_behaviour = discard
spock.exception_logging = all
spock.save_resolutions = on
