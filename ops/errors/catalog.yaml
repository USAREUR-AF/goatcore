    fixes:
      - "ls ops/ansible/group_vars/   (the site names this repository declares)"
      - "pip3 install pyyaml"
      - "python3 ops/validation/run-acceptance.py --self-test"
    read: docs/design/goatnet-acceptance-suite.md
    matches:
      - "no goatnet named `[^`]+` here"
      - "the site's values could not be derived"
      - "the acceptance runner did not finish"
      - "no value set at "
    exit: 1

