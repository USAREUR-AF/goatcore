    what: "After placing the new access control (nothing loads it before a restart), the core router's dry run failed, or the committed slot list differs from the registry or the registry could not be read. Restarting now could drop or add stores, so the files placed were put back and the core was not restarted."
    causes:
      - the assembled configuration does not pass the core's play in check mode
      - the slot list in the repository is behind the registry
    fixes:
