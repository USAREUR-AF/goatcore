    tool: goatbuilder
    title: the published declarations are out of order or altered
    what: a declaration is applied only from an intact, ordered log (contract C2). A row whose signature does not match its content, or a serial not greater than one already accepted, is refused before anything is published, so a replayed or edited declaration never reaches a machine. A new serial at an earlier digest is accepted; that is a revert.
    causes:
      - a row of declared/publications.jsonl was edited by hand after it was published
      - an older copy of the log was restored over a newer one, or a row was replayed
    fixes:
      - "restore declared/publications.jsonl from the source of record"
      - "to go back to an earlier ref, declare it anew: goatbuilder --mock <fixture> rollback <component> 1 --env <env> --ack \"<your name>\""
    read: docs/design/goatbuilder-conformance.md
    matches:
      - "is older than last accepted"
      - "the signature does not match its content"
    exit: 1

