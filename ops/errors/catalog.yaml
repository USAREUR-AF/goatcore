    tool: goatbuilder
    title: nothing is declared on that goatnet
    what: diff or adopt found no fleet-pins component whose member groups include the goatnet.
    causes:
      - the goatnet key is right but no component is pinned there yet
      - every component is absent on it
    fixes:
      - "goatbuilder doctor --env <goatnet> --all   (lists what the goatnet runs)"
    read: docs/design/goatbuilder.md
    matches:
      - "no component is declared on"
    exit: 2

  - code: GB-051
    tool: goatbuilder
    title: the plan request is incomplete or not planned yet
    what: plan writes deploy and rollback plans; a deploy plan needs --env, and a rollback plan reads a host ledger, so it has no fixture form.
    causes:
      - plan deploy without --env
      - a verb other than deploy or rollback
      - plan rollback with --mock
    fixes:
      - "goatbuilder plan deploy <component> --env <goatnet> --out <file>"
      - "goatbuilder plan rollback <component> --n 1 --out <file>"
    read: docs/design/goatbuilder-conformance.md
    matches:
      - "plan deploy needs --env"
      - "plan covers deploy and rollback"
      - "the fixture has no rollback converger"
      - "cannot be applied here"
    exit: 2

  - code: GB-052
    tool: goatbuilder
    title: that file is not a goatbuilder plan
    what: apply runs only a file plan wrote, which carries schema goatbuilder.plan/v1.
    causes:
      - the wrong file was passed to apply
      - the plan was edited by hand and its schema line lost
    fixes:
      - "goatbuilder plan <verb> <component> … --out <file>   (write it again)"
    read: docs/design/goatbuilder-conformance.md
    matches:
      - "is not a goatbuilder plan"
    exit: 2

  - code: GB-053
    tool: goatbuilder
    title: the plan no longer matches the tree
    what: apply recomputed the plan's decisions and at least one moved since it was written; it names each, and runs nothing.
    causes:
      - main's declaration or the pins file changed since the plan
      - a newer deploy or rollback moved the rollback target
      - the plan is old
    fixes:
      - "goatbuilder plan <same arguments> --out <file>, review it, then goatbuilder apply <file>"
    read: docs/design/goatbuilder-conformance.md
    matches:
      - "no longer matches:"
    exit: 1

  - code: GB-054
    tool: goatbuilder
    title: adopt could not create its worktree
    what: adopt --yes writes its declarations into a fresh worktree of origin/main beside the checkout; git refused to create it.
    causes:
      - origin/main is not fetched
      - a branch or directory of that name already exists
    fixes:
      - "git fetch origin main"
      - "git worktree list   (remove a stale adopt worktree)"
    read: docs/design/goatbuilder.md
    matches:
      - "git worktree add"
    exit: 2

  - code: GB-055
    tool: goatbuilder
    title: a rollback with no --site would flip every goatnet
    what: the component is deployed on more than one goatnet and no --site was given; with no site the roll narrows to nothing, so it would flip every goatnet at once, prod included. Nothing was touched; the error lists the goatnets to choose from.
    causes:
      - rollback (or plan rollback) was run on a component that spans several goatnets without --site
      - the goatnet to roll back was left off the command
    fixes:
      - "goatbuilder rollback <component> <N> --site <goatnet>   (one of the goatnets the error names)"
      - "ops/scripts/rollback.sh <component> <N> --site <goatnet>"
    read: docs/design/universal-deploy-rollback.md
    matches:
      - "a rollback with no --site would flip every one"
    exit: 1

  - code: GB-060
    tool: goatbuilder
    title: a standup input is required and not set
    what: "A role or play the site's standup will reach asserts this variable, or reads it through `| mandatory`, and nothing the site supplies sets it: not group_vars, the inventory, host_vars, the play's vars, a role default, nor an extra var the plan passes. The scan lists every such input at once, before any host is touched."
    causes:
      - the site's config surface was made from a reference goatnet and this key was not carried over
      - the role gained a required input after the site was configured
    fixes:
      - "set the variable in ops/ansible/group_vars/<group>/ (or the inventory)"
      - "goatbuilder doctor --site <site>   (re-scan; every gap is listed)"
    read: docs/design/goatbuilder-speed.md
    matches:
      - "is required and not set"
    exit: 1

  - code: GB-061
    tool: goatbuilder
    title: a secret the standup templates is not in this environment
    what: "A value the site supplies is lookup('env', NAME), a play or role the standup reaches uses it, and the declared secrets posture cannot supply NAME (ops/secrets/posture.py, ADR 1204)."
    causes:
      - the run is not under the site's secrets posture
      - the posture's references file has no line for this name
    fixes:
      - "run under your secrets posture: ops/scripts/with-secrets goatbuilder standup <env> --site <site>"
      - "add the reference for NAME to your .refs file"
    read: docs/design/pluggable-dependencies.md
    matches:
      - "reads env"
      - "which the secrets posture does not supply"
    exit: 1

  - code: GB-062
    tool: goatbuilder
    title: a standup input may be required
    what: "The input is required under a `when:` condition the scan cannot evaluate from the site's own values (it depends on a registered result, a fact, or a template). This is a warning, never a refusal: the scan does not claim more than it knows."
    causes:
      - the condition reads a value only known when the play runs
    fixes:
      - "read the role at the file named and decide whether the condition will hold for this site"
      - "set the input anyway if it will"
    read: docs/design/goatbuilder-speed.md
    matches:
      - "required under a condition the scan cannot evaluate"
    exit: 0

  - code: GB-063
    tool: goatbuilder
    title: a standup step's host limit selects no host
    what: "The plan runs this play with --limit <pattern>, and the pattern matches no host of the target group in the inventory, so the play runs on nothing and reports success."
    causes:
      - the limit assumes the mgmt-<site>-01 host naming and this site names its hosts differently
      - the step is meant for the founder only and this site is a joiner
    fixes:
      - "check whether the step should run on this site (a joiner runs no admin surface, ADR 1084 D3)"
      - "if it should, fix the limit in goat-standup.sh and goatbuilder standup together"
    read: docs/design/goatbuilder-speed.md
    matches:
      - "selects no host of"
    exit: 0

  - code: GB-064
    tool: goatbuilder
    title: the checkout is behind the trunk in what a deploy reads
    what: "A real run reads ops/ansible (roles, plays, group_vars, inventory, the rendered pins) and ops/pins from the checkout it runs in. The trunk carries commits to those paths that this checkout lacks, so a file rendered from it would remove on the host what those commits added, and the play would report success (contract C3, F-410). Refused before any host is touched, in both avenues (ops/scripts/fresh-source.sh)."
    causes:
      - the checkout was not brought onto the trunk after a merge
      - a feature branch was cut before a change to a role, group_vars or the pins landed
    fixes:
      - "on main: git pull --ff-only <trunk remote> main"
      - "on a branch: git fetch <trunk remote> main && git rebase <trunk remote>/main"
    read: docs/design/goatbuilder-conformance.md
    matches:
      - "is behind .* in what a deploy reads"
    exit: 1

  - code: GB-065
    tool: goatbuilder
    title: the trunk could not be fetched, so the checkout cannot be shown current
    what: "A real run proves its checkout is current with the trunk before any host is touched (contract C3). The trunk remote did not answer a fetch, so that proof is missing and the run is refused. An islanded site, cut off by design, runs with --offline: it is judged against the cached trunk and the ledger row it writes says source: offline."
    causes:
      - no route to the git remote (the laptop is offline, the forge is down)
      - the remote's credentials are not loaded (an ssh key not in the agent)
    fixes:
      - "restore the connection to the trunk remote and re-run"
      - "on an islanded site: re-run with --offline"
    read: docs/design/goatbuilder-conformance.md
    matches:
      - "could not fetch .* so this checkout cannot be shown current"
    exit: 1

  - code: GB-066
    tool: goatbuilder
    title: the site's declared end state cannot be derived or read
    what: "endstate derives what a site should run from its own declarations (group_vars, the fleet pin table, the inventory) and the service catalog, then reads the site's hosts once over Ansible. One of those could not start, so nothing was graded."
    causes:
      - the site name has no ops/ansible/group_vars/<site>_hosts/ directory
      - python3 or PyYAML is not installed on this machine
      - the catalog file ops/goatbuilder/endstate/catalog.yaml does not parse
    fixes:
      - "ls ops/ansible/group_vars/   (the site names this repository declares)"
      - "python3 ops/goatbuilder/endstate/endstate.py model <site>   (the derived end state, without reading any host)"
      - "python3 ops/goatbuilder/endstate/endstate.py --self-test"
    read: docs/design/goatnet-end-state.md
    matches:
      - "no goatnet site named `[^`]+`: ops/ansible/group_vars/"
    exit: 1

  - code: GB-067
    tool: goatbuilder
    title: a site's service presence is undeclared or contradicted
    what: "Every service the catalog lists must be declared present or absent for every governed site, by exactly one answer: a flag in the site's group_vars, the fleet pin table (an absent deviation), or the founder rule. The baseline ops/goatbuilder/endstate/baseline.txt lists the gaps that exist today and may only shrink: a new gap, or a baseline row that is no longer true, fails."
    causes:
      - a new service in the catalog with no flag declared for a site
      - the fleet pin table renders a component the site's flag says it does not run (or the reverse)
      - a gap was closed and its baseline row was left behind
    fixes:
      - "set the service's flag (its catalog `var:`) in ops/ansible/group_vars/<site>_hosts/vars.yml"
      - "add `absent: true` for the member in ops/pins/fleet-pins.yaml, then regenerate and re-sign the pins"
      - "delete the stale row from ops/goatbuilder/endstate/baseline.txt"
    read: docs/design/goatnet-end-state.md
    matches:
      - "GB-067: (new (undeclared|contradiction)|baseline row no longer true)"
    exit: 1

  - code: GB-068
    tool: goatbuilder
    title: the goatnet is not in its declared end state
    what: "endstate graded every service the site declares: present or absent, deployed (its ledger names the declared ref), active (every container running), healthy (its healthcheck or isitup probe), functional (the acceptance rows that exercise it), and its zero-trust edges (its served name resolves and its certificate verifies, its OIDC client is registered in Hydra, its SPIRE entry exists). At least one grade failed or could not be read, or something runs that the end state does not declare (an orphan)."
    causes:
      - a declared service is not running, or its ledger is pending, rolled back or at another ref
      - an edge is broken, such as an OIDC client never registered or a name that does not resolve
      - an orphan, such as a container left behind by a retired service, or a Hydra client or SPIRE entry no service declares
      - a grade could not be read, most often because a host was unreachable or the assay did not run
    fixes:
      - "goatbuilder endstate <site>   (each failing grade with its reason)"
      - "goatbuilder deploy --component <c> --env <goatnet>   (restore a declared service)"
      - "goatbuilder endstate <site> --json   (the grades as data)"
    read: docs/design/goatnet-end-state.md
    matches:
      - "is NOT in its declared end state"
    exit: 3

  - code: GB-069
    tool: goatbuilder
    title: the rollout preflight cannot run
    what: "preflight reads the component's declared rollout facts from ops/pins/fleet-pins.yaml (owns_state, rollback, restore_from, coupled_with) and the open graduation sets. The component is not in the pins, or the pins could not be read, so there is nothing to grade."
    causes:
      - the component name is misspelled or not a fleet-pins component key
      - ops/pins/fleet-pins.yaml is missing, unreadable, or did not parse
      - on a fixture (--mock), declared/artifacts.yaml did not parse
    fixes:
      - "grep -n '^  [a-z].*:' ops/pins/fleet-pins.yaml   (the component keys this repository declares)"
      - "goatbuilder preflight <component> --env <goatnet>   (name the component as its fleet-pins key)"
    read: docs/design/goatbuilder-rollout-preflight.md
    matches:
      - "the rollout preflight cannot run"
    exit: 1

  - code: GB-070
    tool: goatbuilder
    title: survey could read no goatnet at all
    what: "survey reads every goatnet it was asked for in parallel and reports what it could not read as unknown. When not one goatnet answered, there is nothing to compare, and the run stops instead of printing an empty survey that would look consistent."
    causes:
      - this laptop is on no goatnet's mesh profile and no door opened (no AWS credentials for the SSM door)
      - every goatnet named with --env is misspelled or not in ops/pins/fleet-pins.yaml
      - ansible is not installed, or ops/scripts/with-aws cannot run
    fixes:
      - "goatbuilder doctor --env <goatnet> --all names the transport each goatnet would use and what is missing"
      - "name goatnets by their fleet-pins key: --env <goatnet> (repeatable)"
    read: docs/design/goatbuilder.md
    matches:
      - "no goatnet could be read"
    exit: 1

  - code: GB-071
    tool: goatbuilder
    title: a site's leaf certificate is not on this controller
    what: "A play that installs a site's leaf (the zenoh router, the LAN mgmt identity, the dashboard pair, the names collector) found the cert or key nowhere it looks: the site manifest's out_dir (<deploy.state_dir>/<site>-leaves), then a copy staged in this checkout or the main checkout. It refuses before touching a host."
    causes:
      - the leaf was never minted for this site, or was minted on another operator's machine
      - the manifest's out_dir points somewhere this machine does not have
      - GOAT_LEAF_DIR is set to a directory that does not hold it
    fixes:
      - "mint it into the out_dir: ops/scripts/mint-site-certs.sh <site> --only <leaf> (idempotent; an existing leaf is skipped)"
      - "copy an existing pair into <deploy.state_dir>/<site>-leaves/ (key mode 0600), never into the repository"
    read: docs/operations/goatnet-standup.md
    matches:
      - "GB-071"
    exit: 1

  - code: GB-072
    tool: goatbuilder
    title: goatbuilder cannot name the download surface to update from
    what: "update (and the behind-version notice) reads the release a goatnet serves at get.<site_id>.<site_dns_zone>/goatbuilder/. It looks at GOATBUILDER_UPDATE_URL, then --site (named from the site's group_vars), then the surface the last successful update used. None of them named a surface that serves goatbuilder for this machine."
    causes:
      - the first update on this machine was run without --site, and GOATBUILDER_UPDATE_URL is not set
      - the site named with --site has no ops/ansible/group_vars/<site>_hosts/ in the checkout goatbuilder was run in
      - the site does not serve goatbuilder (goat_get_goatbuilder_enabled is not true in its group_vars)
      - no goatbuilder release is built for this operating system and architecture
    fixes:
      - "goatbuilder update --site <site>   (a goatnet that serves goatbuilder)"
      - "run it from a goat checkout, or pass -C <checkout>"
      - "GOATBUILDER_UPDATE_URL=https://get.<site>.<zone>/goatbuilder goatbuilder update"
    read: docs/design/goatbuilder-distribution.md
    matches:
      - "cannot resolve goatbuilder's download surface"
      - "does not serve goatbuilder: goat_get_goatbuilder_enabled"
    exit: 1

  - code: GB-073
    tool: goatbuilder
    title: the goatbuilder download surface could not be read
    what: "update reads version.json, the platform binary and its .sha256 from get.<site>.<zone>/goatbuilder/. One of them did not arrive: the connection failed, the server answered with an error, the answer was not what the surface publishes, or the binary stopped arriving for 30 seconds. Nothing was installed; the binary in place is the one that ran."
    causes:
      - this machine is not on the goatnet's mesh (get.<site> is mesh-only)
      - the surface is mid-deploy, or does not publish this platform's binary
      - the link stalled; a slow link is fine, a silent one for 30 seconds is not
    fixes:
      - "curl -fsS https://get.<site>.<zone>/goatbuilder/version.json   (is the surface reachable from here?)"
      - "retry the update; it is idempotent"
      - "GOATBUILDER_UPDATE_STALL_SECS=120 goatbuilder update   (a slower link)"
    read: docs/design/goatbuilder-distribution.md
    matches:
      - "cannot read the served version"
      - "the download of .* stalled or broke"
    exit: 1

  - code: GB-074
    tool: goatbuilder
    title: the downloaded goatbuilder is not vouched for by its release
    what: "Before touching anything, update checks that the <asset>.sha256 the surface serves agrees with the release's SHA256SUMS, that the SHA256SUMS signature verifies against the release workflow's identity (when cosign is on PATH), and that the downloaded binary hashes to that digest. One of these failed, so it refused to install; the installed binary is unchanged."
    causes:
      - the surface is mid-deploy and the binary, its checksum and SHA256SUMS are from different releases
      - the download was altered or truncated on the way
      - the signature over SHA256SUMS is not from the release workflow of the repository goatbuilder.yaml names
    fixes:
      - "retry in a few minutes; the surface's files are written together"
      - "goatbuilder update --check   (what the surface serves now)"
      - "cosign verify-blob --bundle SHA256SUMS.cosign-bundle --certificate-identity-regexp '^https://github.com/<owner>/<repo>/' --certificate-oidc-issuer https://token.actions.githubusercontent.com SHA256SUMS   (the check by hand)"
    read: docs/design/goatbuilder-distribution.md
    matches:
      - "checksum mismatch, refusing to install"
      - "signature (refused|not checked), refusing to install"
    exit: 1

  - code: GB-075
    tool: goatbuilder
    title: goatbuilder could not replace its own binary
    what: "The download was verified, but writing it next to the running binary or renaming it into place failed. The rename is atomic, so the binary in place is either the old one, whole, or the new one, whole."
    causes:
      - the install directory is not writable by this user (a binary under /usr/local/bin installed with sudo)
      - the disk is full
    fixes:
      - "run the update as the user that installed goatbuilder (sudo goatbuilder update --site <site> for a system-wide install)"
      - "install by hand from get.<site>.<zone>/goatbuilder/, checking the .sha256 first"
    read: docs/design/goatbuilder-distribution.md
    matches:
      - "goatbuilder-update-[^ ]*\\.tmp"
    exit: 1

  - code: GB-076
    tool: goatbuilder
    title: the rollout is not cleanly reversible or not ready
    what: "preflight graded the three rollout facts (State, Rollback, Scope) and the readiness half, and at least one row is not a clean, declared, validated pass. An undeclared fact fails closed (stateful, rollback none) and reads not-clean on purpose, so the gap is visible rather than guessed green; an UNKNOWN is not a pass either. The facts are still printed — a stateful, restore-required rollout is a valid state to deploy knowingly, with --ack."
    causes:
      - a fact is undeclared, so it failed closed (declare owns_state / rollback / restore_from / coupled_with in ops/pins/fleet-pins.yaml)
      - a declared rollback contradicts the artifact type (pin-revert over a data/cert/forward-only component, or one flagged reversible false)
      - a readiness check failed — the ref is not pullable, pins --check found drift, the secrets gate is unsatisfied, the checkout is stale, or the end state is not declared
      - a validation could not answer (UNKNOWN) — no registry probe, or no reachable ledger for the rollback --dry-run
    fixes:
      - "goatbuilder preflight <component> --env <goatnet>   (each not-ok row with its reason)"
      - "declare the component's rollout facts in ops/pins/fleet-pins.yaml (owns_state, rollback, restore_from, coupled_with)"
      - "goatbuilder deploy --component <c> --env <goatnet> --ack \"<you>\"   (deploy knowingly; the accepted risk is recorded)"
    read: docs/design/goatbuilder-rollout-preflight.md
    matches:
      - "NOT clean .*\\(GB-076\\)"
    exit: 3

  - code: GB-100
    tool: goatbuilder
    title: the federation verbs cannot find this party's context directory
    what: "goatbuilder federate init (and verify or apply without --as) reads this party's declaration, federation.toml, and init also reads the mTLS certificate and CA roots beside it. goatbuilder has no profile of its own, so it takes the directory from --context-dir, else $GOAT_CONTEXT_DIR, else the goat profile ($GOAT_PROFILE_DIR, else ~/.goat), and none of those was set."
    causes:
      - "none of --context-dir, GOAT_CONTEXT_DIR, GOAT_PROFILE_DIR or HOME is set, as in a bare container or a service unit"
    fixes:
      - "goatbuilder federate init --context-dir <dir>   (the directory holding federation.toml, mtls.cert.pem and ca-roots.pem)"
      - "export GOAT_PROFILE_DIR=<goat profile directory>   (the verbs then read its active context, as goat does)"
      - "goatbuilder federate verify <agreement> --as <sovereign_id>   (verify and apply need no context when --as is given)"
    read: docs/design/goatbuilder.md
    matches:
      - "no context directory for the federation verbs"
    exit: 2

  - code: GB-110
    tool: goatbuilder
    title: the inventory does not name a federation host phase 3 can reach
    what: "federate phase 3 measures the edge and the core from this machine, reaching each host the way the peering plays do: the host in the edge group and the host in the core group of inventory/peering-edges.ini, with its address, user, port, key and SSH options. The inventory could not be read, the group has no host or several, or the host uses a connection phase 3 does not use."
    causes:
      - ansible-inventory is not installed here, or the inventory does not parse
      - the edge group (<partner>_edge) or the core group (<partner>_core) is empty or missing in inventory/peering-edges.ini
      - the group has several hosts and none was named
      - the host uses an ansible_connection other than ssh or local
    fixes:
      - "cd ops/ansible && ansible-inventory -i inventory/peering-edges.ini --playbook-dir . --graph   (what the plays see)"
      - "add the host to the group, or name it: goatbuilder federate init --edge-host <host> --core-host <host>"
    read: docs/design/federation-router-discovery.md
    exit: 1

  - code: GB-111
    tool: goatbuilder
    title: a federation host did not answer over SSH
    what: "Before measuring anything, phase 3 runs `true` on the edge and on the core over SSH, with the inventory's connection settings and the plays' privilege escalation. That command failed, so nothing was measured. The message carries the ssh command it ran."
    causes:
      - this machine is not on a network that reaches the host (mesh profile, door or jump host)
      - the host refused the key (see X-SSH-001)
      - the host key changed (see X-SSH-003)
    fixes:
      - "run the ssh command the message prints, without its last argument, and read ssh's own error"
      - "goatbuilder doctor --env <env>   (the transport row)"
    read: docs/design/federation-router-discovery.md
    exit: 1

  - code: GB-112
    tool: goatbuilder
    title: sudo on a federation host wants a password
    what: "The host answered over SSH, but `sudo -n true` failed: phase 3 reads the federation interface and the container runtime as root, the way the plays become root, and it never types a password."
    causes:
      - the host's operator user is not NOPASSWD in sudoers (the baseline play sets it)
      - ansible_become_user names a user this account cannot become without a password
    fixes:
      - "run ops/ansible/mgmt-host-baseline.yml against the host once"
      - "set ansible_become: false for the host if its user can already read wg and the container runtime"
    read: docs/design/federation-router-discovery.md
    matches:
      - "sudo there wants a password"
    exit: 1

  - code: GB-113
    tool: goatbuilder
    title: no core router to measure on the core host
    what: "Phase 3 measures the core router's image and version on the core host. It takes the router the operator names with --router-container, else the name the deployment's variables give (zenoh_stack, or site_id with the goat-zenoh role's default, as <zenoh_stack>-router), else the one running core router discovery finds. That router was not running, could not be read, or several candidates were found."
    causes:
      - the declared router is not running on the core host, or the variables give a different name than the one deployed
      - nothing declares the router and no running container carries org.goat.component=zenoh-core or a standard name
      - several core routers run on the host
    fixes:
      - "goatbuilder federate init --router-container <name>   (name it by hand)"
      - "FED_ROUTER_CONTAINER=<name> goatbuilder federate <partner>   (the one command passes it to phase 3 as --router-container)"
      - "set zenoh_stack or site_id for the core host in the deployment's group_vars or host_vars"
      - "ssh <user>@<core> sudo docker ps --format '{{.Names}} {{.Label \"org.goat.component\"}}'   (what is running)"
    read: docs/design/federation-router-discovery.md
    matches:
      - "no core router to measure on"
    exit: 1

  - code: GB-114
    tool: goatbuilder
    title: an edge half of phase 3 cannot be joined
    what: "With two drivers, the edge driver measures phase 3's edge half with `goatbuilder federate init --over-ssh <partner> --side edge --half-out <file>` and prints its sha256 and a confirm code. The controller joins it with `--side core --edge-half <file> --edge-half-sha256 <code>` before it builds and signs the package. The half carries the edge's WireGuard public key, which the package is signed with, so it is joined only when it is the file the edge driver wrote. The file given could not be read; its sha256 is not the one confirmed; it is not an edge half; it was measured for another peering, on another host than this checkout's inventory names as the edge, or for another federation interface than the package asks for; or it was measured more than 24 hours ago, or later than now."
    causes:
      - the file was changed or not copied whole on its way from the edge driver, or another file was given
      - the confirm code was mistyped, or read from another run of the edge half
      - the edge half was measured for another partner or on another edge host
      - the declaration or the init flags differ between the two machines, so the edge was measured for another interface (or none)
      - the edge half is older than a day, or one of the two machines' clocks is wrong
    fixes:
      - "goatbuilder federate init --over-ssh <partner> --side edge --half-out <file>   (on the edge driver, with the same declaration and init flags; it prints the confirm code)"
      - "sha256sum <file>   (on both machines: the two must agree)"
    read: docs/design/federation-router-discovery.md
    matches:
      - "cannot be used for peering"
    exit: 1

  - code: GB-120
    tool: goatbuilder
    title: a peering names a partner with a reserved word
    what: "A word of `goatbuilder federate` (init lint compose diff verify apply help status plan deploy test allocate backout rotate) can never name a partner: `goatbuilder federate <word>` runs that step, so the peering could never be run by name."
    causes:
      - a peerings entry's `with:` is one of the reserved words
    fixes:
      - "name the partner by its sovereign id in goatbuilder.yaml peerings: with:"
    read: docs/design/goatbuilder.md
    matches:
      - "\\(GB-120\\)"
    exit: 2

  - code: GB-121
    tool: goatbuilder
    title: two peerings would share a value
    what: "A per-peering value (an interface, a UDP or TCP port, a link subnet, a forwarder port, a certificate directory, an inventory name) is pinned on one peering and already held by another, by a pin or by the allocation record, or a partner is declared twice on one environment. Two peerings on one edge or core host cannot share one."
    causes:
      - "two peerings pin the same value under values:"
      - a pin takes a value the allocation record holds for another peering
      - the same partner is declared twice on one environment
    fixes:
      - "pin a different value on one of the two peerings, or remove the pin and run goatbuilder federate allocate to have one allocated"
      - "goatbuilder validate   (every collision, each naming both peerings)"
    read: docs/design/goatbuilder.md
    matches:
      - "\\(GB-121\\)"
    exit: 2

  - code: GB-122
    tool: goatbuilder
    title: a pinned port is one the edge host already holds
    what: "A pinned WireGuard or carrier listen port is a UDP port the environment's edge hosts already hold (environments[].peering_edge_reserved_udp; absent, NetBird's WireGuard on 51820). A second listener there fails or steals its traffic."
    causes:
      - values.wg_listen_port or values.carrier_listen_port is pinned to a reserved port
      - "a peering running on the role default 51820, on edges with no mesh client, is being adopted"
    fixes:
      - "remove the pin and run goatbuilder federate allocate (it allocates odd ports from 51823 up and never takes a reserved port)"
      - "when the environment's edges run no mesh client: set peering_edge_reserved_udp: [] on that environment in goatbuilder.yaml"
    read: docs/design/goatbuilder.md
    matches:
      - "\\(GB-122\\)"
    exit: 2

  - code: GB-123
    tool: goatbuilder
    title: a peering's pin is not usable
    what: "A pin under a peering's values: is malformed (an interface name over 15 characters, a subnet that is not a /31 or /30 on its boundary, a relative certificate directory, a name with spaces), or pins a forwarder value on a peering no forwarder relays."
    causes:
      - a typing mistake in a pin
      - "public_port or a carrier_* value pinned without forwarder:"
    fixes:
      - "correct the pin, or remove it to have the value allocated"
      - "declare forwarder: endpoint: on the peering, or remove the forwarder pins"
    read: docs/design/goatbuilder.md
    matches:
      - "\\(GB-123\\)"
    exit: 2

  - code: GB-124
    tool: goatbuilder
    title: the peering allocation record cannot be used
    what: "ops/goatbuilder/peering-values.yaml, the record of the per-peering values goatbuilder federate allocate chose, is unreadable, has another schema, holds a malformed value, gives two peerings one value, or records a port the edge host already holds. Allocation reads it so a re-run never moves a value; it will not guess around a broken one."
    causes:
      - a hand edit or a merge conflict in the record
      - a record from a newer goatbuilder
    fixes:
      - "git log -p ops/goatbuilder/peering-values.yaml   (restore it from its history)"
      - "remove the broken entry and run goatbuilder federate allocate to allocate it afresh (that peering's values may change)"
    read: docs/design/goatbuilder.md
    matches:
      - "\\(GB-124\\)"
    exit: 2

  - code: GB-125
    tool: goatbuilder
    title: a peering file exists that goatbuilder did not generate
    what: "goatbuilder federate allocate writes the peering inventory and each peering's peering-values.yml. It never overwrites a file it did not generate (its first line says who did), and never renders a variable a hand-written file already sets for the same hosts (the group, its parent peering group, or the host_vars of its inventory names), because Ansible's file order would then pick the value. Nothing was written."
    causes:
      - ops/ansible/inventory/peering-edges.ini or a peering-values.yml was written by hand before the values were allocated
      - "a hand-written group_vars or host_vars file sets a variable allocate renders (a listen port, a certificate path)"
    fixes:
      - "move its values into goatbuilder.yaml (pins under the peering's values:, addresses under hosts:), remove the file, and run goatbuilder federate allocate again"
    read: docs/design/goatbuilder.md
    matches:
      - "\\(GB-125\\)"
    exit: 2

  - code: GB-126
    tool: goatbuilder
    title: a peering's inventory group is defined twice
    what: "Not every peering declares hosts:, so ops/ansible/inventory/peering-edges.ini stays hand-written and each peering that declares hosts: gets its own rendered inventory file (inventory/peering-<edge_group>.ini), which the driver reads beside it. That peering's group is also defined in the hand-written inventory, so the plays would see it twice. Nothing was written."
    causes:
      - "hosts: added to a peering whose group is still in the hand-written peering-edges.ini"
    fixes:
      - "remove that peering's groups from ops/ansible/inventory/peering-edges.ini"
      - "or remove hosts: from the peering and keep its groups in the hand-written inventory"
    read: docs/design/goatbuilder.md
    matches:
      - "\\(GB-126\\)"
    exit: 2

  - code: GB-127
    tool: goatbuilder
    title: no free per-peering value is left
    what: "Every candidate in a per-peering value's sequence is held by another peering of the same environment (128 interfaces, ports or /31 subnets), or by a pin."
    causes:
      - many peerings on one environment, or pins scattered over the sequence
    fixes:
      - "pin the value under the peering's values:"
    read: docs/design/goatbuilder.md
    matches:
      - "\\(GB-127\\)"
    exit: 2

  - code: GB-128
    tool: goatbuilder
    title: a federate run disagrees with the peering's allocated values
    what: "The allocation record holds this peering, and the run's working directory, edge group or core group is not the allocated one. Phase 8 would mint certificates where the edge does not read them, or the plays would run on another peering's hosts. Nothing ran."
    causes:
      - "--work or FED_WORK names a directory whose pki is not the allocated cert_dir"
      - "--edge-group names another group than the allocated edge_group"
      - "a partner declared on a second environment, or a core_group pin: the driver runs the republisher on <with>_core and does not read the allocated core group yet"
    fixes:
      - "goatbuilder federate allocate --dry-run   (the allocated values)"
      - "pass the --work and --edge-group the refusal names, or pin cert_dir and edge_group under the peering's values: to what you pass"
    read: docs/design/goatbuilder.md
    matches:
      - "\\(GB-128\\)"
    exit: 2

  - code: GB-129
    tool: goatbuilder
    title: a peering's offer would widen what federation.toml declares
    what: "federation.toml owns the release sets this party offers ([data] release). A peering's offer: may only narrow that list for one partner. It names a set federation.toml does not offer, is empty or malformed, or federation.toml cannot be read. Or the peering's federation.toml is hand-written (federation_toml: hand), whose [data] release phase 3 offers whole, and offer: is narrower than it; a peering whose federation.toml goatbuilder federate allocate generates gets the narrowed list. Nothing ran."
    causes:
      - "offer: names a set that is not in federation.toml's [data] release"
      - "offer: is narrower than the [data] release of a hand-written federation.toml (federation_toml: hand), which phase 3 offers whole"
      - "GOAT_PROFILE_DIR or GOAT_CONTEXT points at another goat context than the one phase 3 runs in"
    fixes:
      - "add the set to [data] release in federation.toml, the one owner of the offered sets, or remove it from offer:"
      - "declare federation_toml: rendered on the peering so goatbuilder federate allocate generates its federation.toml, or narrow [data] release in the hand-written file to what this partner receives, or remove offer:"
      - "goatbuilder validate   (the offer's shape)"
    read: docs/design/goatbuilder.md
    matches:
      - "\\(GB-129\\)"
    exit: 2

  - code: GB-210
    tool: goatbuilder
    title: the host firewall baseline is missing a value it needs
    what: "The host firewall baseline (roles/goat-host-firewall, rendered by its goat-host-firewall-render.py) could not build a ruleset, because a value it derives the rules from is missing or malformed. Nothing was applied."
    causes:
      - goat_host_firewall_management_sources is empty, so SSH would be admitted from nowhere
      - an edge run reached the role without its peering values (the play was not peering-wg.yml or peering-edge.yml)
      - a port, address or interface name in the input is not one (a partner endpoint given as a name, an interface name over 15 characters)
      - "a management source is /0, the mesh interface is the host's uplink, or a br-* bridge that is not docker's (a VXLAN segment bridge) exists while container-bridges is kept"
      - twice goat_host_firewall_confirm_timeout plus 15 s is not below goat_host_firewall_rollback_seconds
      - the switch is false but the host still carries the baseline (/etc/goat-host-firewall/profile exists)
    fixes:
      - "set goat_host_firewall_management_sources in the host's group_vars to the address or CIDR the deployment manages it from"
      - "python3 ops/ansible/roles/goat-host-firewall/files/goat-host-firewall-render.py --input <input.json> --list-rules   (what the baseline derives)"
    read: docs/design/peering-host-firewall.md
    matches:
      - "goat-host-firewall: REFUSED \\(GB-210\\)"
      - "goat-host-firewall refuses \\(GB-210\\)"
    exit: 2

  - code: GB-211
    tool: goatbuilder
    title: the host firewall override names a rule the baseline does not have, or is malformed
    what: "The deployment's goat_host_firewall_override names a rule that is not in the baseline, names a fixed rule (loopback, established, invalid), uses a key other than drop, sources, ports, interface and reason, asks a fixed-expression rule for more than drop, or gives a reason holding a line break or another control character (the reason is written into the ruleset file). The whole override was refused and nothing was applied."
    causes:
      - a misspelled rule name, or a peering rule named for an interface this host does not carry
      - an attempt to add a new allow rule; only named baseline rules can be changed, and other-tcp / other-udp are the named rules for a service the host also runs
    fixes:
      - "python3 ops/ansible/roles/goat-host-firewall/files/goat-host-firewall-render.py --input <input.json> --list-rules   (the names an override may use)"
    read: docs/design/peering-host-firewall.md
    matches:
      - "goat-host-firewall: REFUSED \\(GB-211\\)"
    exit: 3

  - code: GB-212
    tool: goatbuilder
    title: the host firewall is loosened without a recorded reason
    what: "An override entry widens a baseline rule (more sources, other ports, another interface), or a role input is wider than the profile (goat_host_firewall_mesh_udp_ports not empty, a mesh DNS port other than 5353, a management source broader than goat_host_firewall_management_prefix_floor, or that floor set broader than /24 or /64), and no reason is recorded for that rule. Tightening is free; loosening a named rule needs a reason recorded in the deployment's configuration. Nothing was applied."
    causes:
      - "the entry has no reason: key, or a blank one"
      - "an entry meant to narrow widens instead (an empty sources list means any source)"
    fixes:
      - "add reason: \"<why this host needs it>\" to the entry in goat_host_firewall_override"
      - narrow the rule instead, which needs no reason
    read: docs/design/peering-host-firewall.md
    matches:
      - "goat-host-firewall: REFUSED \\(GB-212\\)"
    exit: 3

  - code: GB-213
    tool: goatbuilder
    title: the host firewall would cut the session managing the host
    what: "The rendered ruleset admits no SSH from the source of the session running the play (read from SSH_CONNECTION on the host), so loading it would lock the deployment out. Nothing was applied."
    causes:
      - goat_host_firewall_management_sources does not hold the address this play connects from
      - the override drops ssh-management, narrows its sources past this address, or binds it to another interface
      - SSH listens on another port than goat_host_firewall_ssh_port
      - the session's source could not be read, so the check could not run
    fixes:
      - "add the controller's address to goat_host_firewall_management_sources"
      - "run the play from a declared management source"
    read: docs/design/peering-host-firewall.md
    matches:
      - "goat-host-firewall: REFUSED \\(GB-213\\)"
      - "goat-host-firewall refuses \\(GB-213\\)"
    exit: 4

  - code: GB-214
    tool: goatbuilder
    title: the host firewall ruleset was not loaded or not confirmed
    what: "Loading the rendered ruleset failed, or a fresh connection to the host did not succeed after it was loaded. A ruleset that was loaded is undone by the rollback timer the role armed before loading it."
    causes:
      - the kernel refused the ruleset (nft -c failed), for example an nftables too old for a rule
      - the new ruleset blocks the connection the controller makes, through a path the lockout check could not see (a jump host, a NAT between controller and host)
      - systemd-run is not available on the host, so no rollback could be armed and nothing was loaded
    fixes:
      - "wait goat_host_firewall_rollback_seconds, then: nft list table inet goat_host_firewall   (the previous table is back)"
      - "read /etc/goat-host-firewall/ruleset.nft.new on the host and the play output"
    read: docs/design/peering-host-firewall.md
    matches:
      - "goat-host-firewall \\(GB-214\\)"
    exit: 1

  - code: GB-215
    tool: goatbuilder
    title: the host firewall would close a port this host listens on
    what: "Before loading, the host firewall baseline reads the sockets the host listens on (ss) and found one, on a non-loopback address, that no rule admits and that the deployment has not named as closed on purpose. Loading would cut that service without anyone deciding it. Nothing was applied."
    causes:
      - the host runs another service beside the peering (a management server, a portal, an exporter)
      - a port the deployment means to close is not listed in goat_host_firewall_closed_listeners
    fixes:
      - "admit it: goat_host_firewall_override: {other-tcp: {ports: [<port>], reason: \"<why>\"}}"
      - "close it on purpose: goat_host_firewall_closed_listeners: [\"tcp/<port>\"]   (or the process name)"
    read: docs/design/peering-host-firewall.md
    matches:
      - "goat-host-firewall: REFUSED \\(GB-215\\)"
    exit: 5
  # ---------------------------------- goatbuilder federate: journal and locks

  - code: GB-180
    tool: goatbuilder
    title: another run of this peering is in progress
    what: "A real run of `goatbuilder federate` holds <work>/.lock from start to end, so two runs of one peering never interleave phases or overwrite each other's run journal. This run found the lock held and changed nothing."
    causes:
      - another terminal or a scheduled job is running `goatbuilder federate` for the same peering
      - two peerings were given the same working folder (--work or FED_WORK)
    fixes:
      - "wait for the other run to finish; the lock file names its process id"
      - "give each peering its own working folder: --work /var/lib/goat-federation/<partner>"
    read: docs/design/goatbuilder.md
    matches:
      - "another run of peering '[^']*' holds"
    exit: 1

  - code: GB-181
    tool: goatbuilder
    title: a resource this peering needs is held by another peering on the same host
    what: "Before a peering takes a resource on a shared host (a tunnel interface, a port, a link subnet, a certificate folder), goatbuilder reads every other peering's run journal in the same work root under <root>/.allocation.lock. One of them holds the same resource on the same host, or a journal there could not be read, so nothing was claimed and nothing changed."
    causes:
      - two peerings were given the same per-peering value (a pinned value in `peerings:` or a hand-written group_vars file)
      - a journal in the work root is damaged, so the check cannot tell what it holds
    fixes:
      - "give this peering a different value, or let allocation choose one, then make a new plan"
      - "read the other peering's journal named in the message: <root>/<peering>/state.json"
    read: docs/design/goatbuilder.md
    matches:
      - "cannot take what another peering on the same host holds"
      - "cannot tell whether peering '[^']*' may take its resources"
    exit: 1

  - code: GB-182
    tool: goatbuilder
    title: the run journal cannot be read
    what: "<work>/state.json is the only account of what ran for this peering, so a journal that does not parse, has a later schema than this goatbuilder reads, or names another peering is refused rather than overwritten. A journal of the same schema that a later goatbuilder wrote is read: a word or field this one does not know is shown as written and kept."
    causes:
      - the file was edited by hand or cut short
      - a later goatbuilder wrote it with a later schema (the message names the schema and the goatbuilder that wrote it)
      - two peerings share one working folder
    fixes:
      - "use the goatbuilder that wrote it, or move the file aside and run again (the run then starts with no journal, and --resume skips nothing)"
      - "give each peering its own working folder: --work /var/lib/goat-federation/<partner>"
    read: docs/design/goatbuilder.md
    matches:
      - "the run journal (does not parse|is goatbuilder|is for peering|cannot be read)"
      - "cannot read the run journal"
    exit: 1

  - code: GB-183
    tool: goatbuilder
    title: a federate phase failed
    what: "The word the run journal records for a phase that exited non-zero, with its exit code. The run stopped there; no later phase ran."
    causes:
      - "the phase's own error, printed above it (a `goat federate` exit 20 to 24, a play's failed task, a refused gate)"
    fixes:
      - "fix the cause, then run the same command again; with --resume, the phases found unchanged are not run again"
    read: docs/operations/sovereign-federation-runbook.md
    matches:
      - "GB-183: phase [0-9]+ failed with exit"
    exit: 1

  - code: GB-184
    tool: goatbuilder
    title: the working folder or its lock cannot be made, taken or written
    what: "A real run of `goatbuilder federate` keeps its lock and its run journal in the peering's working folder, and the allocation lock in the folder above it. One of them could not be created, locked or written, so the run did not start (or, mid-run, its journal is behind; the run says so in a failed `journal` row)."
    causes:
      - the working folder is not writable by this user (the default /var/lib/goat-federation needs root or a folder made for you)
      - the disk is full or the folder is on a read-only mount
    fixes:
      - "sudo install -d -o $USER /var/lib/goat-federation   (or pass --work <a folder you own>)"
      - "check free space where the working folder is"
    read: docs/design/goatbuilder.md
    matches:
      - "cannot (create|open|take|write|read) the (working folder|peering lock|allocation lock|work root|run journal)"
      - "cannot rename .*state\\.json"
    exit: 1
  # ------------------------------------------- federate phase 1, preflight (GB-130..149)

  - code: GB-130
    tool: goatbuilder
    title: a federation input is missing
    what: "federate phase 1 (preflight) found inputs the later phases need that nothing declared and nothing could derive. Every missing input is listed with where to declare it. Nothing was measured, signed or deployed."
    causes:
      - the deployment does not declare it (the edge group's group_vars, the peering's entry in goatbuilder.yaml peerings:, the inventory)
      - the script avenue (peering-standup.sh) was run without exporting it; goatbuilder derives what it can, the script does not
    fixes:
      - "declare each listed value where the line names it, then: goatbuilder federate <partner> --from 1 --to 1"
      - "export FED_<NAME>=...   (one command only; an exported value always overrides what goatbuilder derives)"
    read: docs/design/federation-preflight.md
    exit: 1
    matches:
      - "required inputs .*\\(GB-130\\)"

  - code: GB-131
    tool: goatbuilder
    title: a port this peering needs is already held on the edge
    what: "the tunnel listen port (UDP) or the edge router listen port (TCP) is held on the edge host by something other than this peering's own interface or container. NetBird holds UDP 51820 on a mesh host, which is also the WireGuard default."
    causes:
      - the tunnel listen port is the WireGuard default 51820 and NetBird's interface holds it
      - another peering's edge router or interface already uses the port on a shared edge host
    fixes:
      - "pin another port in the peering declaration: goatbuilder.yaml peerings: values: wg_listen_port / edge_listen_port"
      - "or set peering_wg_listen_port / goat_zenoh_edge_listen_port in group_vars/<edge group>/, then re-run phase 1"
    read: docs/design/federation-preflight.md
    exit: 1
    matches:
      - "edge ports free .*\\(GB-131\\)"

  - code: GB-132
    tool: goatbuilder
    title: the republisher metrics port is already held on the core
    what: "the outbound republisher's loopback metrics port is held on the core host by something other than this peering's republisher. One port per peering on a shared core host."
    causes:
      - another peering's republisher uses the same metrics port on the core host
      - another service listens on that loopback port
    fixes:
      - "pin republisher_metrics_port in the peering declaration (goatbuilder.yaml peerings: values:)"
      - "or set goat_fed_republisher_metrics_port in group_vars/<peering>_core/"
    read: docs/design/federation-preflight.md
    exit: 1
    matches:
      - "core metrics port free .*\\(GB-132\\)"

  - code: GB-133
    tool: goatbuilder
    title: the edge or core host could not be probed for its ports
    what: "the read-only probe (ops/ansible/peering-preflight.yml) returned no answer for a host, or `ss` could not list its sockets, so the ports were not checked. Not a pass."
    causes:
      - the host is unreachable with the inventory the peering plays use (mesh down, wrong ansible_host, no SSH key)
      - iproute2 (`ss`) is not installed on the host
    fixes:
      - "cd ops/ansible && ansible -i inventory/peering-edges.ini <group> -m ping"
      - "install iproute2 on the host, then re-run phase 1"
    read: docs/design/federation-preflight.md
    exit: 1
    matches:
      - "no probe answer from"

  - code: GB-134
    tool: goatbuilder
    title: the committed slot list differs from the slot registry
    what: "ops/scripts/sync-slot-anchors.py --check found live slots with no declared store or declared stores for slots that are not live. A core router restarted on this list drops or misses receive stores. Slots minted between the fix and the restart drift it again, so the restart step runs this check once more."
    causes:
      - slots were minted or revoked since the list was last regenerated and committed
      - the list was regenerated, and a slot was minted before the core router restarted
    fixes:
      - "python3 ops/scripts/sync-slot-anchors.py --env <goatnet> --db <registry.db>   (writes the list; commit it)"
      - "python3 ops/federation/standup/preflight.py <partner> --work <dir> --only slot-anchors   (re-check just before the restart)"
    read: docs/design/federation-preflight.md
    exit: 1
    matches:
      - "slot list equals registry .*\\(GB-134\\)"

  - code: GB-135
    tool: goatbuilder
    title: the slot registry could not be read
    what: "sync-slot-anchors.py exited 2: the registry was unreadable, or it reported zero live slots. That is not a verdict on drift, and the check is not passed."
    causes:
      - FED_SLOT_DB names a file that is not the portal registry, or it cannot be opened read-only
      - the management host named by FED_SLOT_PG_SSH is unreachable, or its portal database container differs
    fixes:
      - "check FED_SLOT_DB, or FED_SLOT_REGISTRY_STORE=postgres with FED_SLOT_PG_SSH (portal_store in group_vars/<goatnet>_hosts says which)"
    read: docs/design/federation-preflight.md
    exit: 1
    matches:
      - "slot list equals registry .*\\(GB-135\\)"

  - code: GB-136
    tool: goatbuilder
    title: the core has no receive store matching what the edge grants
    what: "the core router's storage_manager has no store whose key expression equals an ingress scope the edge admits (from/<partner>/** by the spec's rule, or the rendered goat_zenoh_edge_ingress_key_exprs). A store wider than the grant, such as from/**, declares a subscriber the edge refuses, so data would cross and not be kept."
    causes:
      - the core keeps only a historical from/** store
      - the core's per-partner store names a different partner or lane than the edge grants
    fixes:
      - "add a store on the core whose key_expr equals each admitted scope (the goat-zenoh role renders one per partner); keep a historical from/** store beside it if its data is needed"
    read: docs/design/federation-ingress-storage-preflight.md
    exit: 1
    matches:
      - "core receive stores .*\\(GB-136\\)"

  - code: GB-137
    tool: goatbuilder
    title: the core router's configuration could not be read
    what: "preflight found the core router but could not read its configuration, so the receive stores were not checked. Reported SKIP, never PASS; FED_PREFLIGHT_STRICT=1 refuses on it."
    causes:
      - the core router reads its configuration from another path than /etc/zenoh/config.json5
      - the account behind FED_ROUTER_DOCKER_HOST may list containers but not exec in them
    fixes:
      - "export FED_CORE_CONFIG_PATH=<path inside the core container>"
      - "inspect the core's storages through its own approved workflow"
    read: docs/design/federation-ingress-storage-preflight.md
    exit: 1
    matches:
      - "core receive stores .*\\(GB-137\\)"

  - code: GB-138
    tool: goatbuilder
    title: no core router container was found
    what: "the selection phase 3 uses (goat federate init) found no running core router on the daemon preflight read: FED_ROUTER_DOCKER_HOST, else the local runtime. Discovery accepts the org.goat.component=zenoh-core label, *-zenoh-router names and legacy goat-zenoh."
    causes:
      - the core router runs on another host and FED_ROUTER_DOCKER_HOST does not point at it
      - the core router is stopped, or runs under a custom name without the role label
    fixes:
      - "export FED_ROUTER_DOCKER_HOST=ssh://<user>@<core>   (goatbuilder derives it from the peering's hosts.core, else the one host of inventory group <partner>_core)"
      - "export FED_ROUTER_CONTAINER=<name or ID>"
    read: docs/design/federation-router-discovery.md
