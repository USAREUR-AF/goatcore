# The error catalog: every error goat and goatbuilder can print, and every
# error the tools they call can hand back through them, with what it means
# and what to do. One home (ADR 1199, docs/design/error-interpretation.md).
#
# Compiled into both binaries at build time (crates/goat-errors), so
# `goat explain` and `goatbuilder explain` work offline. The CI gate
# ops/ci/check-error-catalog.py keeps this file, the Rust code that cites it,
# docs/design/goat-cli-error-codes.md and the generated docs/reference/errors.md
# in step.
#
# An entry:
#   code     stable; `E_*` = goat's own codes (crates/goat-cli/src/errors.rs),
#            `GB-NNN` = goatbuilder's, `X-<TOOL>-NNN` = a tool either binary calls
#   tool     who prints it
#   title    the claim, in the operator's words
#   what     what happened, one or two sentences
#   causes   the likely reasons, most likely first
#   fixes    what to do, as commands where a command exists
#   read     where to read more (a repo path)
#   exit     the exit code the binary returns for it (goat and goatbuilder codes only)
#   matches  regular expressions over the WHOLE text of an error, for errors that
#            arrive as text (a tool's stderr carried inside a goat error). Any one
#            matching is a hit. Case-sensitive; keep them literal and specific.
#   retired  "<release tag>: <why>" for a code no binary raises any more: the tag of
#            the release that stopped raising it, goatbuilder/vX.Y.Z or goat-cli-vX.Y.Z
#            (ADR 1228's form), e.g. "goatbuilder/v0.6.0: <why>". A code a release
#            printed is never deleted or given another meaning: logs keep it, and
#            explain must still answer for it. A retired entry stays, and only it may
#            change its title (ops/ci/check-error-codes-kept.py, gate row A5).
#
# Adding an entry is a YAML block here and nothing else, unless a binary should
# emit the code itself (then cite it in the Rust and the gate checks it exists).

schema: goat-errors/v1

entries:

  # ---------------------------------------------------------------- goat (E_*)

  - code: E_PROFILE_MISSING
    tool: goat
    title: no profile for this context
    what: goat was run before `goat profile init`, or the context named has no profile.toml, certificate or key.
    causes:
      - the bundle was never installed on this machine
      - the bundle was installed into a different context than the one in use
    fixes:
      - "goat profile init <bundle.cbor>"
      - "goat --context <name> …   (when the bundle was installed under another context)"
    read: docs/design/goat-cli-error-codes.md
    exit: 3
    matches:
      - "no profile for context"

  - code: E_PROFILE_DENIED
    tool: goat
    title: the profile exists but this user cannot read it
    what: the profile directory is there and permission was denied reading it, typically a root-owned 0700 ~/.goat probed without sudo, or bare sudo that reset $HOME to /root.
    causes:
      - the profile was created as root
      - bare `sudo goat …` looked in /root/.goat
    fixes:
      - "sudo chown -R $USER ~/.goat"
      - "sudo -E goat …   (keeps your $HOME)"
    read: docs/design/goat-cli-error-codes.md
    exit: 3

  - code: E_BUNDLE_INVALID
    tool: goat
    title: the bundle did not verify
    what: at `goat profile init` the bundle's structure, signature or expiry failed. The help line says which of the three.
    causes:
      - a truncated or wrong download (malformed CBOR)
      - a signing CA this machine does not trust
      - an expired bundle
    fixes:
      - "goat ca ls             (what this machine trusts)"
      - "goat ca add <root.pem> (when the CA is the problem)"
      - "ask the operator for a re-issued bundle when it has expired"
    read: docs/design/goat-cli-error-codes.md
    exit: 3

  - code: E_OFF_MESH
    tool: goat
    title: not connected to the mesh
    what: the local mesh client reports no connected tunnel, so nothing on the goatnet is reachable.
    causes:
      - the mesh client is stopped or logged out
      - this device was never enrolled
      - the device is on a network that blocks the mesh
    fixes:
      - "netbird status -d"
      - "goat heal && goat doctor"
    read: docs/design/goat-cli-error-codes.md
    exit: 5

  - code: E_CLOCK_SKEW
    tool: goat
    title: the device clock is wrong
    what: the device clock differs from the management server's authenticated HTTPS Date by more than 60 seconds, so certificates cannot be judged valid.
    causes:
      - the clock drifted while the device was off or offline
    fixes:
      - "synchronise the clock (chrony/ntp), then: goat doctor"
    read: docs/design/time-hygiene-trusted-time.md
    exit: 6

  - code: E_ROUTER_UNREACHABLE
    tool: goat
    title: the Zenoh router did not answer
    what: the configured router's TCP path or Zenoh session timed out or could not be reached.
    causes:
      - the mesh tunnel is up but the route to the router is not
      - the router service is down on its host
      - the endpoint in the profile is stale
    fixes:
      - "goat doctor --all"
      - "compare from another enrolled peer before changing anything local"
    read: docs/design/goat-cli-error-codes.md
    exit: 5

  - code: E_CERT_EXPIRED
    tool: goat
    title: the mTLS certificate is outside its validity
    what: the local certificate is expired, not yet valid, or was rejected by the router.
    causes:
      - the certificate's validity interval has passed
      - the device clock is wrong (see E_CLOCK_SKEW)
    fixes:
      - "goat profile show"
      - "goat profile rotate <new-bundle.cbor>   (after the operator re-issues it)"
    read: docs/design/internal-tls-ca.md
    exit: 6

  - code: E_DOCTOR_INCONCLUSIVE
    tool: goat
    title: doctor saw a failure it cannot narrow
    what: a local TLS or configuration failure, or a session rejection, without enough evidence for one cause.
    causes:
      - router-side admission refused this identity
      - a local TLS setup problem the probe cannot distinguish from the router's
    fixes:
      - "follow the hint on the failing doctor step"
      - "if the local certificate is valid, send the step output to the goatnet operator"
    read: docs/design/goat-cli-error-codes.md
    exit: 1

  - code: E_PORTAL_UNREACHABLE
    tool: goat
    title: the portal API did not answer
    what: the portal was not reachable for network reasons (DNS, TCP or TLS), not an authorization failure.
    causes:
      - the portal host is not reachable over the mesh from this device
      - mesh DNS is not resolving the portal name
    fixes:
      - "goat doctor --all"
      - "check from another peer: if it answers there, the problem is local"
    read: docs/design/goat-cli-error-codes.md
    exit: 4

  - code: E_PORTAL_NOT_FOUND
    tool: goat
    title: the portal answered that what was named is not registered
    what: "the portal is up and answered HTTP 404 for the request path shown: the org, topic, schema, machine or person the command named does not exist there. An answer, not a network fault."
    causes:
      - a typo in the org prefix, topic key or handle
      - the thing is registered on another goatnet than the active context's
      - it was removed, or never created
    fixes:
      - "goat vendor ls   (the orgs that exist)"
      - "goat topic ls <org>/   (the topics under one org)"
      - "goat context show   (which goatnet this context talks to)"
    read: docs/design/goat-cli-error-codes.md
    matches:
      - "the portal answered HTTP 404 for"
    exit: 7

  - code: E_PORTAL_RATE_LIMITED
    tool: goat
    title: the portal is rate-limiting this client
    what: "the portal is up and answered HTTP 429: this client sent too many requests. The hint carries the portal's Retry-After when it sent one."
    causes:
      - a script calling goat in a tight loop
      - an older goat whose `topic ls` with no prefix made one request per org
    fixes:
      - "wait the Retry-After the hint names, then retry"
      - "space the calls out, or list one org at a time: goat topic ls <org>/"
      - "goat update   (current goat lists the whole goatnet in one request)"
    read: docs/design/goat-cli-error-codes.md
    matches:
      - "the portal answered HTTP 429 for"
    exit: 8

  - code: E_PORTAL_SERVER_ERROR
    tool: goat
    title: the portal failed on its own side
    what: "the portal is up and answered HTTP 5xx for the request path shown. Nothing on this device's network or credential is at fault."
    causes:
      - the portal or a service behind it (its database, the registry) is failing
      - the portal is restarting during a deploy (often a 502 or 503)
    fixes:
      - "retry after the Retry-After the hint names, or in a minute"
      - "if it persists, send the code, status and path to a platform admin; the portal's log on the goatnet's management host names the cause"
    read: docs/design/goat-cli-error-codes.md
    matches:
      - "the portal answered HTTP 5[0-9][0-9] for"
    exit: 9

  - code: E_PORTAL_REFUSED
    tool: goat
    title: the portal refused the request
    what: "the portal is up and answered a non-2xx status no command curates (a 400, 405, 410, 413 or 422) for the request path shown."
    causes:
      - this goat build and the portal are at different API versions
      - a value the command sent is one the portal does not accept
    fixes:
      - "goat doctor   (shows whether goat is behind the served version)"
      - "goat update"
    read: docs/design/goat-cli-error-codes.md
    matches:
      - "request refused$"
    exit: 4

  - code: E_PORTAL_BAD_RESPONSE
    tool: goat
    title: the portal answered in a shape this goat build does not understand
    what: the portal returned 2xx but the body did not deserialize. The portal is healthy; the CLI and the portal are at different versions.
    causes:
      - goat is behind the portal
      - the portal deployed ahead of the CLI
    fixes:
      - "goat update   (or re-install from get.<site>)"
      - "goat --version, and report the endpoint if already current"
    read: docs/design/goat-cli-error-codes.md
    exit: 4

  - code: E_TOKEN_INVALID
    tool: goat
    title: the portal rejected the token
    what: "the portal accepted the connection and refused the bearer token (HTTP 401): the credential itself is expired or misissued."
    causes:
      - the token in ~/.goat/contexts/<name>/portal.token has expired
      - the token belongs to another goatnet
    fixes:
      - "goat profile rotate <new-bundle.cbor>   (after re-running onboarding)"
    read: docs/design/goat-cli-error-codes.md
    exit: 4

  - code: E_PORTAL_FORBIDDEN
    tool: goat
    title: the portal refused this identity
    what: HTTP 403 to the probe. The token was accepted; the identity lacks the access.
    causes:
      - the active context is a different identity than you meant
      - the grant for this surface was never made
    fixes:
      - "goat context show"
      - "ask the goatnet operator for the access grant; rotating the token will not grant it"
    read: docs/design/goat-cli-error-codes.md
    exit: 4

  - code: E_NOT_ADMIN
    tool: goat
    title: an operator-only action without operator authority
    what: a `goat admin` action was refused, client-side (no operator credentials in the profile) or by the portal/NetBird API (HTTP 403, nothing changed).
    causes:
      - the profile is using the vp_ participant token, not the op_ operator key
      - the role is not authorized for this action
    fixes:
      - "GOAT_PORTAL_TOKEN=op_… goat admin …"
      - "goat admin operator-key request --reason …   (when you hold no op_ key)"
    read: docs/design/platform-admin-lifecycle.md
    exit: 4

  - code: E_TOPIC_CONFLICT
    tool: goat
    title: the topic already exists
    what: "`goat topic create` was asked for a name that is already registered."
    causes:
      - someone created it first
      - a re-run of a create that already succeeded
    fixes:
      - "goat topic show <topic>"
      - "pick a new name, or version the topic (docs/design/pubsub-best-practices.md)"
    read: docs/design/goat-cli-error-codes.md
    exit: 1

  - code: E_MACHINE_UNRESOLVED
    tool: goat
    title: the machine named is not exactly one enrolled machine
    what: a `goat machine` verb was given a handle or slot anchor that matches no enrolled machine this profile can see, or a handle that matches machines under more than one custodian. Nothing was changed.
    causes:
      - a typo in the handle
      - the machine is under another custodian's custody, which a non-operator profile cannot see
      - the machine was revoked
      - two custodians each enrolled a machine with the same handle
    fixes:
      - "goat machine ls   (shows each machine's handle, custodian and slot anchor)"
      - "pass the 32-hex slot anchor instead of the handle when the handle is ambiguous"
    read: docs/design/goat-cli-error-codes.md
    exit: 1

  - code: E_MESH_PEER_UNRESOLVED
    tool: goat
    title: the enrolled machine has no single mesh peer
    what: the machine is enrolled, but no NetBird peer carries its name, or several do. A machine's peer is named `machine-<handle>-<host>` by its setup key, or `<handle>` when renamed by hand. Nothing was changed.
    causes:
      - the machine never joined the mesh with its setup key
      - the peer was renamed off its handle in the NetBird dashboard
      - the machine joined twice, leaving a stale peer beside the live one
    fixes:
      - "goat admin peer ls   (find the machine's peer and its name)"
      - "goat machine mesh-key <machine>   (when it never joined)"
      - "rename the peer back to `<handle>`, or remove the stale peer with goat admin peer cut <peer-id>"
    read: docs/design/goat-cli-error-codes.md
    exit: 1

  - code: E_NETBIRD_FAILED
    tool: goat
    title: the NetBird management API call failed
    what: a call to the goatnet's NetBird management API did not succeed for a reason other than authorization, so nothing was changed. The help line carries the status or the transport error.
    causes:
      - the NetBird admin token was rejected (HTTP 401)
      - the management server is unreachable from this machine
      - the management server answered an unexpected status
      - the peer record lacked a setting the update has to send back unchanged
    fixes:
      - "check the token: export <CONTEXT>_NB_API_TOKEN (or GOAT_NB_API_TOKEN) with a current admin token"
      - "goat admin peer ls   (proves the URL and token work)"
      - "retry once the management server answers"
    read: docs/design/goat-cli-error-codes.md
    exit: 4

  - code: E_ACL_DECLARATION_MISSING
    tool: goat
    title: no ACL declaration was supplied
    what: "`goat acl test` or `goat warrant` needs the goatnet's netbird_acl_taxonomy.yml and netbird_acl_matrix.yml and found them nowhere. goat carries no deployment's declaration, so it stops rather than check other rules."
    causes:
      - the command ran outside a checkout and the context holds no declaration
      - the goatnet does not serve its declaration at get.<site>/acl/, so `goat context refresh` fetched none
    fixes:
      - "goat acl test --declaration <dir>   (a directory holding both files)"
      - "export GOAT_ACL_DECLARATION_DIR=<dir>"
      - "set acl_declaration_dir = \"<dir>\" in ~/.goat/contexts/<name>/profile.toml"
      - "goat context refresh   (fills ~/.goat/contexts/<name>/acl/ when the goatnet serves it)"
      - "run from a checkout that carries ops/ansible/netbird_acl_taxonomy.yml and netbird_acl_matrix.yml"
    read: docs/design/goat-cli-error-codes.md
    exit: 1

  # --------------------------------------------------------------- goatbuilder

  - code: GB-001
    tool: goatbuilder
    title: unknown component
    what: the component named is not declared in ops/pins/fleet-pins.yaml (or, on a fixture, in goatbuilder.yaml).
    causes:
      - a typo in the component name
      - the component is declared under its ledger name, not its image name
    fixes:
      - "grep -n '^  [a-z0-9-]*:' ops/pins/fleet-pins.yaml | head -60"
      - "goatbuilder validate"
    read: docs/design/goatbuilder.md
    matches:
      - "unknown component"
      - "is not declared in goatbuilder.yaml"
    exit: 2

  - code: GB-002
    tool: goatbuilder
    title: unknown goatnet
    what: the --env value is not a goatnet key the pins declare. A key is spelled exactly as the pins spell it, underscores included.
    causes:
      - the goatnet was typed with a hyphen where its key has an underscore
    fixes:
      - "goatbuilder deploy --env <goatnet> …"
      - "goatbuilder doctor --all   (lists every environment)"
    read: docs/design/goatbuilder.md
    matches:
      - "unknown goatnet"
    exit: 2

  - code: GB-003
    tool: goatbuilder
    title: the group is not one the component deploys to
    what: --group named a group that is not a member of the goatnet, or one where the component is declared absent.
    causes:
      - the group belongs to another goatnet
      - "the pins mark the component `absent: true` for that group"
    fixes:
      - "goatbuilder deploy --env <env> --component <c> --dry-run   (prints the member groups)"
    read: docs/design/goatbuilder.md
    matches:
      - "is not a member of goatnet"
      - "does not run component"
    exit: 2

  - code: GB-004
    tool: goatbuilder
    title: the component declares no image variable
    what: the pins entry has no `var:` so there is nothing to template into a play.
    causes:
      - an incomplete pins entry
    fixes:
      - "add `var:` to the component in ops/pins/fleet-pins.yaml, then: goatbuilder validate"
    read: docs/design/goatbuilder.md
    matches:
      - "declares no var in fleet-pins.yaml"
    exit: 2

  - code: GB-005
    tool: goatbuilder
    title: no deploy playbook resolves for the component
    what: neither <ledger>-deploy.yml nor <component>-deploy.yml exists in ops/ansible, or the declared deploy_playbook is not there.
    causes:
      - the component is deployed by another play and does not declare it
      - the playbook was renamed
    fixes:
      - "declare deploy_playbook: <play>.yml on the component in ops/pins/fleet-pins.yaml"
      - "goatbuilder doctor --all   (the playbook row names what was looked for)"
    read: docs/design/goatbuilder.md
    matches:
      - "no deploy playbook for"
      - "which is not in ops/ansible/"
      - "resolves to no play with a hosts: line"
    exit: 2

  - code: GB-006
    tool: goatbuilder
    title: the door to the goatnet did not open
    what: the goatnet's management host was not reachable over the mesh, so the SSM door was tried, and it did not open.
    causes:
      - no AWS credentials in the keychain for aws-vault (the profile in deploy.aws_profile)
      - the SSM agent on the management host is not connected (TargetNotConnected)
      - the door registry row is stale
    fixes:
      - "ops/scripts/door-open.sh <goatnet> --status"
      - "aws-vault exec <profile> --no-session -- aws sts get-caller-identity"
    read: docs/design/env-doors.md
    matches:
      - "door to .* did not open"
      - "door-open: "
    exit: 1

  - code: GB-007
    tool: goatbuilder
    title: a secret the play needs is not in your environment
    what: the play templates one or more variables from the environment and they are not set, so the run was refused before any host was touched.
    causes:
      - the refs file for this component was never written
      - the command was run without `op run`
    fixes:
      - "put the lines for the named variables from <owner>/goat-credentials refs/goat.refs into .envrc.local.d/<file>.refs"
      - "OP_ACCOUNT=<account> op run --env-file=.envrc.local.d/<file>.refs -- <the same command>"
    read: docs/design/secret-store-requirements.md
    matches:
      - "NOT SET: "
      - "refusing before any host is touched"
    exit: 1

  - code: GB-008
    tool: goatbuilder
    title: a mutation needs --yes when there is no terminal
    what: deploy, release, rollback and fastlane change state; without a terminal to confirm on, they refuse unless --yes is passed (contract C10).
    causes:
      - run from a script, CI or a pipe
    fixes:
      - "add --yes"
      - "add --dry-run to see the plan without changing anything"
    read: docs/design/goatbuilder.md
    matches:
      - "pass --yes without a terminal"
    exit: 2

  - code: GB-009
    tool: goatbuilder
    title: not a current main checkout
    what: releases and deploys run from the invoking checkout, and only a main checkout kept current with origin carries the pin that was merged. A branch or detached checkout can deploy a stale pin and verify green.
    causes:
      - running from a feature-branch worktree
      - running from a detached HEAD
      - main is behind origin/main
    fixes:
      - "git checkout main && git pull --ff-only origin main"
      - "goatbuilder doctor --all   (the checkout row)"
    read: docs/design/release-candidate-validation.md
    matches:
      - "releases run from a main checkout"
      - "run rc.sh from a checkout on main"
      - "is behind origin/main"
    exit: 1

  - code: GB-010
    tool: goatbuilder
    title: a Python dependency is missing
    what: the pins and intents render through PyYAML and jsonschema, and python3 cannot import one of them.
    causes:
      - a fresh machine
      - a venv that is not on PATH
    fixes:
      - "pip install pyyaml jsonschema   (or pipx/venv), then re-run; re-running is safe"
    read: docs/design/goatbuilder.md
    matches:
      - "python deps missing"
      - "python dep missing"
      - "PyYAML or jsonschema missing"
    exit: 2

  - code: GB-011
    tool: goatbuilder
    title: only a repository admin may nominate a release candidate
    what: the GitHub login in use does not hold the admin role on the repository; the rc-validate workflow deletes a tag pushed by anyone else (ADR 1173).
    causes:
      - gh is logged in as a different account
      - the account is a maintainer, not an admin
    fixes:
      - "gh auth status"
      - "ask a repository admin to push the tag, or to grant the role"
    read: docs/design/release-candidate-validation.md
    matches:
      - "only a repository admin may nominate"
      - "rc-validate deleted"
    exit: 1

  - code: GB-077
    tool: goatbuilder
    title: this checkout's origin is not where release candidates are cut
    what: the repository that origin names does not run rc-validate.yml, so a tag pushed there is never validated or built where the ladder reads images; the run refuses before the tag (ADR 1173).
    causes:
      - the checkout is a clone of a mirror or a fork, not the primary repository
    fixes:
      - "git remote get-url origin"
      - "run from a checkout whose origin is the primary repository"
    read: docs/design/release-candidate-validation.md
    matches:
      - "does not run rc-validate.yml"
    exit: 1

  - code: GB-078
    tool: goatbuilder
    title: no release signer is known, so the update refuses
    what: "`goatbuilder update` checks SHA256SUMS against the repository whose release workflow signed it. It found none: the working directory is in no checkout whose ops/goatbuilder/goatbuilder.yaml names repo.release_source or repo.source, and this binary was built outside a release workflow, so it names no publisher itself. Nothing was installed."
    causes:
      - goatbuilder update ran outside a deployment checkout with a locally built binary
    fixes:
      - "goatbuilder -C <checkout> update   (a checkout whose goatbuilder.yaml names repo.release_source)"
      - "install a goatbuilder from a release, which carries its own publisher"
    read: docs/design/goatbuilder-distribution.md
    matches:
      - "no release signer is known"
    exit: 1

  - code: GB-265
    tool: goatbuilder
    title: the run is waiting on the other driver
    what: "The peering is declared with two drivers (`drivers: two`): an edge driver that reaches only the edge host and a controller that reaches the core. This phase needs the edge, so the controller stopped before acting and handed it to the edge driver. The stop prints the exact command to run there, the file it writes, and the two commands to run here after it; with -o json the report carries them as the member handoff. It stops as a by-hand stop does (exit 0)."
    causes:
      - "the peering's phase needs the edge host, and this machine is the controller"
    fixes:
      - "run the command the stop names on the edge driver, bring its result file here, then run the import and the command after it that the stop names"
    read: docs/design/federation-two-drivers.md
    matches:
      - "^GB-265: "
    exit: 0

  - code: GB-266
    tool: goatbuilder
    title: the controller's checkout is not clean, so no hand-off is given
    what: "A two-driver peering's hand-off pins the edge driver's checkout to the controller's commit, so the controller gives one only when its own checkout is a git checkout with nothing uncommitted. The run stopped at the phase that needs the edge, before acting, and names each file with changes."
    causes:
      - "phase 10 placed rendered files, or admission wrote peerings.yml, and they are not committed yet"
      - "a file was edited by hand and not committed"
      - "the deployment's directory is not a git checkout"
    fixes:
      - "commit each file the refusal names, then run the same command again"
    read: docs/design/federation-two-drivers.md
    matches:
      - "^GB-266: "
    exit: 1

  - code: GB-261
    tool: goatbuilder
    title: the release's signature does not verify, so the update refuses
    what: "`goatbuilder update` verifies the keyless signature over the release's SHA256SUMS (SHA256SUMS.cosign-bundle) itself, offline, against the Sigstore trusted root: the certificate chains to a Fulcio CA, Rekor's signed entry timestamp verifies, the entry names this file, and the certificate is the release signer's goatbuilder-release.yml at the served version's goatbuilder/v<version> tag. One of these failed, or the surface serves no signature. The message names the check. Nothing was installed."
    causes:
      - the surface serves a SHA256SUMS or a binary that the release workflow did not sign
      - the signature is another repository's, another workflow's, or another version's
      - Sigstore rotated its Fulcio CA or Rekor key after this goatbuilder was built
      - the surface serves no SHA256SUMS.cosign-bundle
    fixes:
      - "check that the surface serves the release unchanged: the goat-get role's goat_get_goatbuilder_release_tag, and the release page's SHA256SUMS"
      - "after a Sigstore key rotation: GOATBUILDER_UPDATE_TRUSTED_ROOT=<a trusted_root.json holding the new key> goatbuilder update"
      - "goatbuilder -C <checkout> update, so that repo.release_source names the repository that publishes goatbuilder"
    read: docs/design/goatbuilder-distribution.md
