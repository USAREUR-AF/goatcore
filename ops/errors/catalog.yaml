      - the plan file was edited by hand after it was written
    fixes:
      - "goatbuilder federate plan <partner> --work <dir>"
    read: docs/design/federation-plan.md
    exit: 1
    matches:
      - "\\(GB-201\\)"

  - code: GB-202
    tool: goatbuilder
    title: a live prerequisite of the federation plan no longer holds
    what: "rerun immediately before a change, a live phase-1 check (ports, slot list, core router, receive stores) did not pass, so nothing may change. SKIP is not a pass here."
    causes:
      - another service took a port the plan expected free
      - a slot was minted after the slot list was fixed
      - the core router was replaced or stopped
    fixes:
      - "fix the cause the check names (its own code is shown beside GB-202), then goatbuilder federate plan <partner> --recheck"
    read: docs/design/federation-plan.md
    exit: 1
    matches:
      - "GB-202"

  - code: GB-232
    tool: goatbuilder
    title: a rendered deployment half needs a site value no declaration yields
    what: "The peering declares deployment: rendered, so goatbuilder federate allocate renders the edge's and the core's deployment halves (peering-deployment.yml). Each required site value is taken from the group_vars of the environment's groups (environments[].groups) or all when one sets it, and is otherwise derived from the declaration that owns it: the core's address from peerings[].hosts.core or its line in the peering inventory, the core router's port from goat_zenoh_listen_port (group_vars, else the goat-zenoh role default), the images from the role defaults and ops/pins/fleet-pins.yaml, the core's certificate name from its name in the site inventory (ops/ansible/inventory/*.ini). One of them could be found in none of these places; the message names each place it read. Nothing is invented and nothing was written."
    causes:
      - "the peering declares no hosts: and the peering inventory has no single host for its core group"
      - "no role default and no fleet-pins component pins the image the message names"
      - "the site values live in a group the environment does not name in environments[].groups"
    fixes:
      - "declare what the message names where it looked (peerings[].hosts, the core group's inventory line, the image pin)"
      - "or set the named variable once in the group_vars of one of the environment's groups"
      - "or declare deployment: hand on the peering and keep writing its deployment halves by hand"
    read: docs/design/goatbuilder.md
    matches:
      - "\\(GB-232\\)"
    exit: 2

  - code: GB-233
    tool: goatbuilder
    title: a peering's federation.toml cannot be generated from the environment's
    what: "The peering declares federation_toml: rendered, so goatbuilder federate allocate generates its federation.toml from the environment's own ops/federation/<environment>/federation.toml, the one owner of sovereign_id, term_days, cut_contact, the release sets, the accept limits and the measured path MTU, and fills [transport] from the allocated values. That file is missing, is not TOML, or lacks a required top-level value. Nothing was written."
    causes:
      - "the environment has no ops/federation/<environment>/federation.toml yet"
      - "sovereign_id, term_days or cut_contact is missing from it"
    fixes:
      - "write ops/federation/<environment>/federation.toml once for the environment (the template goat federate init prints is the shape)"
      - "or declare federation_toml: hand on the peering and keep writing its federation.toml by hand"
    read: docs/design/goatbuilder.md
    matches:
      - "\\(GB-233\\)"
    exit: 2

  # ------------------------------------------------ federate: the peering forwarder

  - code: GB-160
    tool: goatbuilder
    title: two peerings on one forwarder would share a value
    what: "The peerings one forwarder relays must share no carrier interface, public port, carrier port or carrier address on it: the forwarder sends each packet by its port alone. Allocation keeps them apart across every environment the forwarder relays (by its endpoint); this refusal is the backstop for values that collide anyway."
    causes:
      - "a hand edit of peering-values.yaml gives two relayed peerings one forwarder value"
      - "a pin under values: (public_port, carrier_port, carrier_interface, carrier_subnet) repeats another peering's value"
    fixes:
      - "pin different public_port, carrier_port, carrier_interface and carrier_subnet values under one peering's values:"
      - "or give each environment its own forwarder (forwarder: group:)"
    read: docs/design/peering-forwarder.md
    matches:
      - "\\(GB-160\\)"
    exit: 2

  - code: GB-161
    tool: goatbuilder
    title: a peering's partner id cannot name a forwarder entry
    what: "The forwarder names each peering it relays by the partner id, and its role accepts 2-16 characters of a-z 0-9 and hyphen. This partner id is outside that, so the forwarder would refuse the entry."
    causes:
      - "the peering's with: holds an underscore, or is one character or longer than 16"
    fixes:
      - "declare the partner by its sovereign id (lower-case letters, digits, hyphens)"
    read: docs/design/peering-forwarder.md
    matches:
      - "\\(GB-161\\)"
    exit: 2

  - code: GB-162
    tool: goatbuilder
    title: one forwarder group names two forwarders
    what: "The forwarder's peerings are rendered into its inventory group's group_vars, so every host in the group would relay every peering. Two peerings name the same group with different forwarder endpoints."
    causes:
      - "two forwarders declared without forwarder: group:, so both took the default peering_forwarders"
    fixes:
      - "give each forwarder its own group under forwarder: group:"
    read: docs/design/peering-forwarder.md
    matches:
      - "\\(GB-162\\)"
    exit: 2

  - code: GB-163
    tool: goatbuilder
    title: a forwarded peering has no allocated values yet
    what: "The peering declares forwarder:, so phase 2 runs the forwarder play and copies the carrier keys, and both read the group_vars goatbuilder federate allocate renders from the allocation record. The record does not hold this peering, so those files do not exist. Nothing ran."
    causes:
      - "forwarder: was added to the peering and goatbuilder federate allocate was not run since"
    fixes:
      - "goatbuilder federate allocate   (then review and commit what it writes)"
    read: docs/design/peering-forwarder.md
    matches:
      - "\\(GB-163\\)"
    exit: 2
  - code: GB-203
    tool: goatbuilder
    title: two peerings would bind the same value on one machine
    what: "this peering and another declared peering would bind the same WireGuard interface, tunnel UDP port or republisher metrics port, or overlapping link subnets, on the same machine (by inventory address), so one would break the other."
    causes:
      - two environments, or two hand-named inventory groups, place their edges or cores on one machine
      - a value was pinned or declared by hand without looking at the other peerings on that machine
    fixes:
      - "give this peering another value in its edge or core group's vars (or its allocation pin), then goatbuilder federate plan <partner>"
    read: docs/design/federation-plan.md
    exit: 1
    matches:
      - "GB-203"

  # ----------------------------------------------------------- external tools

  # ------------------------------------------- federate backout, one peering (GB-220..229)

  - code: GB-220
    tool: goatbuilder
    title: federate backout was not given a partner it can act on
    what: "goatbuilder federate backout takes one partner: a sovereign id (2-16 characters of a-z0-9-) that is not a federate subcommand. The working directory and edge group must be plain paths and names, because they go into the play's command line. Nothing ran."
    causes:
      - the partner was left out, or is not a sovereign id
      - --work or --edge-group holds a quote, a space or a shell character
    fixes:
      - "goatbuilder federate backout <partner> --dry-run"
    read: docs/design/goatbuilder.md
    exit: 1
    matches:
      - "federate backout needs the partner"
      - "backout takes the partner whose peering it removes"

  - code: GB-221
    tool: goatbuilder
    title: the back-out found a resource it cannot show is this peering's alone
    what: "The read-only survey found a resource under this peering's names that another peering holds (a WireGuard interface whose state file or peer names another partner, a carrier another peering's state names), or a core configuration it cannot prove changes by this peering alone (the live file is not seed + org fragment, partner ids overlap, a policy mixes partners). Nothing was changed on any host."
    causes:
      - two peerings were given the same interface, carrier or stack name in their group values
      - the core's live configuration was edited by hand after the last assemble
      - the core keeps no seed/org split (slot-pool mode), so the admission cannot be located
    fixes:
      - "read the REFUSED lines of goatbuilder federate backout <partner> --dry-run; give each peering its own names, or reconcile the core's live file with its seed and org fragment"
    read: docs/design/goatbuilder.md
    exit: 1
    matches:
      - "refused \\(GB-221\\)"

  - code: GB-222
    tool: goatbuilder
    title: the back-out survey did not complete
    what: "ops/ansible/peering-backout.yml failed before every host of the peering answered, or no host answered while the working folder holds the peering's agreement, so there is no plan to show and nothing was changed."
    causes:
      - a host of <partner>_edge, <partner>_core or peering_forwarders is unreachable
      - neither ops/ansible/inventory/peering-edges.ini nor a per-peering peering-<edge group>.ini names the peering's hosts, so the play matched no host
    fixes:
      - "read the play output above; fix reachability or the inventory, then goatbuilder federate backout <partner> --dry-run"
    read: docs/design/goatbuilder.md
    exit: 1
    matches:
      - "survey play failed before every host answered"
      - "answered the survey, but"

  - code: GB-223
    tool: goatbuilder
    title: the slot recheck did not allow the core router restart
    what: "Immediately before the core router restarts without this peering's admission, the committed slot list is checked against the registry, as the admission path does. It drifted, the registry could not be read, or no registry was named, so the core was not restarted. The edge side of the peering is already removed and the partner has no path to the core."
    causes:
      - slots were minted or revoked since the list was committed
      - FED_SLOT_DB (or FED_SLOT_REGISTRY_STORE=postgres with FED_SLOT_PG_SSH) is not set for a deployment with lazy slot storage
    fixes:
      - "regenerate and commit the slot list (ops/scripts/sync-slot-anchors.py --env <env> ...), then goatbuilder federate backout <partner>"
    read: docs/design/goatbuilder.md
    exit: 3
    matches:
      - "\\(GB-223\\)"

  - code: GB-224
    tool: goatbuilder
    title: the core router was not restarted on the reviewed candidate
    what: "The core step installs only the candidate configuration whose digest the survey printed. The core's files changed since the survey (so the candidate's digest differs), more than one core router was found, or the restart failed. The org fragment kept beside it as <fragment>.before-backout-<partner> is the state before the step."
    causes:
      - another change reached the core between the survey and the restart
      - several containers qualify as the core router
    fixes:
      - "goatbuilder federate backout <partner> --dry-run, review the new candidate, then run it again"
      - "name the router with peering_backout_core_container or FED_ROUTER_CONTAINER"
    read: docs/design/goatbuilder.md
    exit: 3
    matches:
      - "\\(GB-224\\)"

  - code: GB-225
    tool: goatbuilder
    title: resources of the peering are still present after the back-out
    what: "The survey run after the removal still finds resources of this peering, or the removal play stopped partway. Every step is idempotent: running the back-out again removes what is left and reports the rest as absent."
    causes:
      - a host became unreachable during the removal
      - a unit or container would not stop
    fixes:
      - "goatbuilder federate backout <partner>"
    read: docs/design/goatbuilder.md
    exit: 3
    matches:
      - "\\(GB-225\\)"

  - code: GB-226
    tool: goatbuilder
    title: our package for the counterparty could not be withdrawn from the directory
    what: "The back-out asks the peering directory to delete /v1/parties/<us>/packages/<partner>, signed by our bound key. The directory refused or could not be reached. This is a warning: a listing grants nothing, and the peering's hosts are already clean. Our single entry and every other party's entry are never touched."
    causes:
      - FED_SIGNING_KEY is not set, or is not the key the directory binds to us
      - the directory is unreachable
    fixes:
      - "python3 ops/federation/standup/directory_withdraw.py --url <directory> --us <us> --them <partner> --key <signing key>"
    read: docs/design/peering-directory-service.md
    exit: 0
    matches:
      - "WARN \\(GB-226\\)"

  - code: GB-227
    tool: goatbuilder
    title: the core still admits the partner through its own configuration
    what: "The core router was configured by roles/goat-zenoh from zenoh_sovereign_peerings, which declares the partner's subject and grants as sovereign-<partner> ids. That is the deployment's configuration, not a spliced fragment, so the back-out reports it and does not edit it. The partner has no edge left to reach the core through."
    causes:
      - the core admits the peering from zenoh_sovereign_peerings rather than from the spliced fragment
    fixes:
      - "remove the partner's entry from zenoh_sovereign_peerings by review and run the core play (a router restart)"
    read: docs/operations/sovereign-federation-runbook.md
    exit: 3
    matches:
      - "\\(GB-227\\)"

  - code: X-ANSIBLE-001
    tool: ansible
    title: a host was unreachable
    what: ansible could not open a connection to the host over the transport it was given (ssh over the mesh, or the door).
    causes:
      - this laptop is not on the goatnet's mesh profile and no door was opened
      - the host is down
      - the SSH key is not accepted (see the ssh entries)
    fixes:
      - "goatbuilder doctor --env <env> --all   (the transport row)"
      - "ssh -o ConnectTimeout=5 <ssh user>@<mesh ip> true"
    read: docs/design/env-doors.md
    matches:
      - "UNREACHABLE!"
      - "Failed to connect to the host via ssh"

  - code: X-ANSIBLE-002
    tool: ansible
    title: sudo on the host wants a password
    what: a task needed privilege escalation and the host's operator user is not NOPASSWD.
    causes:
      - the host was not baselined (mgmt-host-baseline.yml sets NOPASSWD sudo)
      - the wrong remote user
    fixes:
      - "run ops/ansible/mgmt-host-baseline.yml against the host once"
    read: docs/operations/goatnet-standup.md
    matches:
      - "Missing sudo password"

  - code: X-ANSIBLE-003
    tool: ansible
    title: a play assertion failed on the host
    what: a task asserted a precondition, usually that a templated secret is non-empty, and it was false on the host.
    causes:
      - a secret the play templates was empty in the deployer's environment (see GB-007)
      - a group_vars fact missing for this goatnet
    fixes:
      - "goatbuilder deploy --env <env> --component <c> --dry-run   (names every variable the play needs)"
    read: docs/operations/goatnet-standup.md
    matches:
      - "Assertion failed"
      - "\"assertion\": "
      - "evaluated to false"

  - code: X-ANSIBLE-004
    tool: ansible
    title: a task failed on a host
    what: ansible marks the task fatal; its msg field says what the module could not do.
    causes:
      - see the msg in the fatal line
    fixes:
      - "grep -n -A3 'fatal:' <log>"
    read: docs/operations/goatnet-standup.md
    matches:
      - "fatal: \\[[^\\]]+\\]: FAILED!"

  - code: X-ANSIBLE-005
    tool: ansible-preflight
    title: the preflight refused a stale or unsafe checkout
    what: ops/scripts/ansible-preflight.sh refuses to run a play from a tree that differs from origin/main in a safety-critical path, or from a stale trunk; ansible reads role defaults from the working tree, so a stale tree templates stale pins.
    causes:
      - local main behind origin
      - a feature branch that touches group_vars or roles
    fixes:
      - "git pull --ff-only origin main   (the message prints the exact command)"
    read: docs/operations/goatnet-standup.md
    matches:
      - "ansible-preflight: REFUSE"
      - "ansible-preflight: refused"

  - code: X-SSH-001
    tool: ssh
    title: the host refused the key
    what: the connection reached the host and SSH rejected every key offered.
    causes:
      - your public key is not on the host's operator user (ssh-key-self-service)
      - the wrong user (hosts take the deploy.ssh_user account)
      - the key is not loaded in the agent
    fixes:
      - "ssh -v <ssh user>@<host> true 2>&1 | grep -i 'offering\\|denied'"
      - "goat admin ssh-key …   (register the key through the goatnet)"
    read: docs/design/ssh-key-self-service.md
    matches:
      - "Permission denied \\(publickey"

  - code: X-SSH-002
    tool: ssh
    title: no route to the host
    what: "the connection never reached the host: timed out, no route, or refused on port 22."
    causes:
      - the address is on a network this laptop is not on (a mesh IP without the mesh, a Tailscale IP without the tailnet)
      - the host is down
    fixes:
      - "netbird status | head -5"
      - "goatbuilder doctor --env <env>"
    read: docs/design/env-doors.md
    # ssh names the port it tried: "ssh: connect to host h port 22: Connection
    # refused". The bare phrases also come out of every HTTP client there is,
    # and this entry then answered an HTTP failure with port 22, a mesh IP and
    # `netbird status` -- a diagnosis of something nobody did.
    matches:
      - "port 22: Connection timed out"
      - "port 22: Connection refused"
      - "port 22: Operation timed out"
      - "port 22: No route to host"

  - code: X-SSH-003
    tool: ssh
    title: the host key changed
    what: the host presented a different key than ~/.ssh/known_hosts holds for that address.
    causes:
      - the host was rebuilt (expected after a re-image)
      - an address was reused by another machine
    fixes:
      - "confirm the rebuild with the operator, then: ssh-keygen -R <address>"
    read: docs/operations/site-node-troubleshooting.md
    matches:
      - "REMOTE HOST IDENTIFICATION HAS CHANGED"
      - "Host key verification failed"

  - code: X-OP-001
    tool: op
    title: 1Password CLI is not signed in
    what: op needs a session for the account before it can resolve references.
    causes:
      - no `op signin` in this shell
      - OP_ACCOUNT names a different account than the one signed in
    fixes:
      - "eval $(op signin)   (OP_ACCOUNT=<account> for the team store)"
      - "goatbuilder doctor --credentials --all   (the tool:op-session row)"
    read: docs/design/secret-store-requirements.md
    matches:
      - "not currently signed in"
      - "account is not signed in"
      - "authorization timeout"
      - "please run 'op signin'"
      - "no account found"

  - code: X-OP-002
    tool: op
    title: an op:// reference is malformed
    what: op run validates every op:// value in the environment and refuses the whole run when one has fewer than three parts (vault/item/field). The variable is often one from your shell profile, not the refs file.
    causes:
      - a variable in your shell holds a two-part reference (op://Vault/Item)
    fixes:
      - "env | grep 'op://'   (find the variable)"
      - "env -u <THAT_VAR> op run --env-file=… -- <command>"
      - "or complete it to op://<vault>/<item>/<field>"
    read: docs/design/secret-store-requirements.md
    matches:
      - "invalid secret reference"
      - "too few '/'"

  - code: X-OP-003
    tool: op
    title: a reference does not resolve to an item
    what: the vault, item or field named in an op:// reference does not exist, or this account cannot see it.
    causes:
      - the item was renamed or moved to another vault
      - the account lacks access to the vault
    fixes:
      - "op item get '<item>' --vault <vault>"
      - "check refs/goat.refs in <owner>/goat-credentials for the current line"
    read: docs/design/secret-store-requirements.md
    matches:
      - "isn't an item"
      - "could not resolve"
      - "no item found"
      - "isn't a vault"

  - code: X-AWS-001
    tool: aws
    title: AWS rejected the credentials
    what: the access key is unknown to AWS, or a session token was sent where none is accepted.
    causes:
      - aws-vault run without --no-session (STS tokens are rejected by this account)
      - a rotated key still in the keychain
    fixes:
      - "aws-vault exec <profile> --no-session -- aws sts get-caller-identity"
      - "aws-vault add <profile>   (re-enter the current key)"
    read: docs/design/cloud-infrastructure-discipline.md
    matches:
      - "InvalidClientTokenId"
      - "SignatureDoesNotMatch"
      - "ExpiredToken"

  - code: X-AWS-002
    tool: aws-vault
    title: aws-vault has no credentials for the profile
    what: the keychain holds no credentials under the profile name, or the keychain could not be opened (headless).
    causes:
      - a fresh machine
      - a headless session cannot prompt the keychain
    fixes:
      - "aws-vault add <profile>"
      - "aws-vault list"
    read: docs/design/cloud-infrastructure-discipline.md
    matches:
      - "aws-vault: error"
      - "profile .* not found"
      - "credentials not found"

  - code: X-AWS-003
    tool: aws
    title: the SSM target is not connected
    what: Session Manager has no live agent for the instance, so the door cannot open.
    causes:
      - the host is down or has no route to the SSM endpoint
      - the instance id in doors.yaml is stale
    fixes:
      - "aws-vault exec <profile> --no-session -- aws ssm describe-instance-information --region <region>"
    read: docs/design/env-doors.md
    matches:
      - "TargetNotConnected"

  - code: X-AWS-004
    tool: aws
    title: the AWS CLI fell back to an expired aws login session
    what: "the aws-vault credential for the profile is empty or malformed, so the CLI used an expired `aws login` session instead and asked to reauthenticate."
    causes:
      - "the aws-vault credential is empty or malformed, so the CLI fell back to an expired aws login session"
      - "AWS_VAULT_KEYCHAIN_NAME in the environment (a direnv export) points aws-vault at the wrong keychain"
    fixes:
      - "aws login   (when the error names it)"
      - "env -u AWS_VAULT_KEYCHAIN_NAME aws-vault exec <profile> --no-session -- aws sts get-caller-identity   (when the keychain name is set)"
      - "aws-vault add <profile>   (when the key really is bad; it replaces the stored key without deleting it first)"
    read: docs/design/cloud-infrastructure-discipline.md
    matches:
      - "Your session has expired. Please reauthenticate using 'aws login'"

  - code: X-GIT-001
    tool: git
    title: not a git repository
    what: the working directory is not inside a checkout.
    causes:
      - run from the wrong directory
    fixes:
      - "cd /path/to/goat   (or pass -C)"
    read: CONTRIBUTING.md
    matches:
      - "not a git repository"

  - code: X-GIT-002
    tool: git
    title: the branch cannot fast-forward
    what: local and remote histories diverged, so a --ff-only pull refuses.
    causes:
      - local commits on main
    fixes:
      - "git log --oneline origin/main..HEAD   (what is local); move it to a branch, then git pull --ff-only"
    read: CONTRIBUTING.md
    matches:
      - "Not possible to fast-forward"
      - "non-fast-forward"
      - "fatal: Need to specify how to reconcile divergent branches"

  - code: X-GIT-003
    tool: git
    title: the remote refused access
    what: "the push or fetch was refused: the SSH key is not authorised for the repository, or the remote does not exist."
    causes:
      - the wrong GitHub account for this remote
      - the key is not loaded
    fixes:
      - "ssh -T git@github.com" # oss-allow: GitHub SSH user
      - "gh auth status"
    read: CONTRIBUTING.md
    matches:
      - "Could not read from remote repository"
      - "Repository not found"

  - code: X-GH-001
    tool: gh
    title: GitHub returned 404
    what: the repository, run, release or API path does not exist, or this account cannot see it.
    causes:
      - a typo in the slug or id
      - a private resource the account is not a member of
    fixes:
      - "gh auth status"
      - "gh repo view <owner>/<repo>"
    read: CONTRIBUTING.md
    matches:
      - "HTTP 404"
      - "Could not resolve to a Repository"

  - code: X-GH-002
    tool: gh
    title: the GitHub CLI is not logged in
    what: gh has no token for github.com in this environment.
    causes:
      - a fresh machine
      - GH_TOKEN set to an expired token
    fixes:
      - "gh auth login"
    read: CONTRIBUTING.md
    matches:
      - "gh auth login"
      - "authentication required"

  - code: X-GH-003
    tool: gh
    title: GitHub rate-limited or forbade the call
    what: "HTTP 403 from the API: a rate limit, or a token without the scope."
    causes:
      - many unauthenticated calls in a short time
      - a token missing `read:packages` or `repo`
    fixes:
      - "gh api rate_limit"
      - "gh auth refresh -s read:packages"
    read: CONTRIBUTING.md
    matches:
      - "HTTP 403"
      - "API rate limit exceeded"

  - code: X-COSIGN-001
    tool: cosign
    title: the signature did not verify
    what: cosign found no signature for the artifact under the expected identity, or the signature does not match.
    causes:
      - the artifact was rebuilt without signing
      - the wrong public key or identity
    fixes:
      - "cosign verify --key <org key> <image@digest>"
    read: docs/reference/goatbuilder/02-install.md
    matches:
      - "no matching signatures"
      - "signature mismatch"
      - "cosign: error"

  - code: X-DOCKER-001
    tool: docker
    title: no permission on the Docker socket
    what: the user is not in the docker group on that host, so every docker call is refused.
    causes:
      - running docker without sudo on a host where the operator user is not in the docker group
    fixes:
      - "sudo docker …   (hosts run docker as root by baseline)"
    read: docs/operations/site-node-troubleshooting.md
    matches:
      - "permission denied while trying to connect to the Docker daemon socket"

  - code: X-DOCKER-002
    tool: docker
    title: the image could not be pulled
    what: the registry answered that the manifest is unknown or the pull is unauthorised.
    causes:
      - a tag that was never pushed, or a digest from the other GHCR org
      - the host's registry login has expired
    fixes:
      - "crane digest <repo.image_namespace>/<image>:<tag>"
      - "on the host: sudo docker pull <ref>"
    read: docs/design/base-images.md
    matches:
      - "manifest unknown"
      - "pull access denied"
      - "unauthorized: authentication required"

  - code: X-DOCKER-003
    tool: docker
    title: the Docker daemon is not running
    what: the socket exists but nothing answers, or does not exist at all.
    causes:
      - docker.service stopped on the host
      - a local Docker Desktop that is not launched (never launch it for goat work)
    fixes:
      - "on the host: sudo systemctl status docker"
    read: docs/operations/site-node-troubleshooting.md
    matches:
      - "Cannot connect to the Docker daemon"

  - code: X-NETBIRD-001
    tool: netbird
    title: no such mesh profile
    what: the profile named does not exist on this laptop; profiles are per goatnet.
    causes:
      - the profile was never added
      - the hyphen/underscore form differs from the profile name
    fixes:
      - "netbird profile list"
    read: docs/design/env-doors.md
    matches:
      - "profile .* not found"
      - "unknown profile"

  - code: X-NETBIRD-002
    tool: netbird
    title: the mesh daemon is not running
    what: the netbird client could not reach its own daemon.
    causes:
      - the service is stopped
    fixes:
      - "sudo netbird service start   (or restart the desktop client)"
    read: docs/operations/battle-drills/02-mesh-client.md
    matches:
      - "daemon is not running"
      - "failed to connect to daemon"

  - code: X-HTTP-001
    tool: http
    title: the service rejected the credential (401)
    what: the request reached the service and the token or cookie was not accepted.
    causes:
      - an expired or wrong token
    fixes:
      - "check which token the command is using; for goat, E_TOKEN_INVALID says how to rotate it"
    read: docs/design/goat-cli-error-codes.md
    matches:
      - "401 Unauthorized"
      - "HTTP 401"

  - code: X-HTTP-002
    tool: http
    title: the service refused the identity (403)
    what: the credential was accepted and the identity is not allowed to do this.
    causes:
      - the wrong one of two credentials (participant vs operator)
      - no grant for this surface
    fixes:
      - "for goat admin verbs: GOAT_PORTAL_TOKEN=op_… goat …"
    read: docs/design/identity-access-and-onboarding-reference.md
    matches:
      - "403 Forbidden"

  - code: X-HTTP-003
    tool: http
    title: the service is up but its backend is not (5xx)
    what: "the front door answered with a gateway error: Traefik or Caddy is up and the service behind it is not."
    causes:
      - the container is restarting or down
    fixes:
      - "on the host: sudo docker ps --format '{{.Names}} {{.Status}}' | grep -v healthy"
    read: docs/operations/site-node-troubleshooting.md
    matches:
      - "502 Bad Gateway"
      - "503 Service Unavailable"
      - "504 Gateway Time-out"

  - code: X-HTTP-004
    tool: http
    title: an onboarding call went to the portal
    what: "goat sent an onboarding call (invite, approve) to the portal instead of the onboarding endpoint: the portal answers 405 Method Not Allowed, or the call names a host that is only `portal`."
    causes:
      - "the context's profile has no onboard_endpoint, so onboarding calls went to the portal"
    fixes:
      - "GOAT_ONBOARD_ENDPOINT=<onboard url> goat …   (for this run)"
      - "goat --context <name> profile init <bundle.cbor> from a current bundle (the profile then carries onboard_endpoint); goatbuilder doctor's tool:goat-contexts row names the contexts"
    read: docs/design/three-stage-candidate-onboarding.md
    matches:
      - "HTTP 405 Method Not Allowed"
      - "portal API at [`']portal[`'] is unreachable"

  - code: X-DIRENV-001
    tool: direnv
    title: direnv exec was given an assignment, not a command
    what: "`direnv exec <dir> VAR=value cmd` looks VAR=value up on PATH as the command and fails; direnv exec takes a command."
    causes:
      - "an environment assignment placed where direnv exec expects the command"
    fixes:
      - "direnv exec . env VAR=value cmd"
    read: docs/operations/admin-operator-guide.md
    matches:
      - "direnv: error command '[A-Za-z_]+=[^']*' not found on PATH"

  - code: X-DNS-001
    tool: dns
    title: the name did not resolve
    what: the resolver has no answer for the name; mesh names resolve only while the mesh is up.
    causes:
      - off the mesh (mesh names are served by mesh CoreDNS)
      - a typo in the name
    fixes:
      - "netbird status | head -5"
      - "dig +short <name>   (then the same against the mesh resolver the profile names: goat names)"
    read: docs/design/mesh-dns-redundancy.md
    matches:
      - "Temporary failure in name resolution"
      - "Could not resolve host"
      - "no such host"
      - "NXDOMAIN"

  - code: X-TLS-001
    tool: tls
    title: the TLS handshake failed
    what: the certificate presented was not trusted, did not match, or the handshake ended early.
    causes:
      - a CA this machine does not trust (goat ca add)
      - a clock far enough off that the certificate reads as invalid
    fixes:
      - "goat ca ls"
      - "date -u   (compare with a known-good clock)"
    read: docs/design/internal-tls-ca.md
    matches:
      - "certificate verify failed"
      - "x509: certificate"
      - "tls handshake"

  - code: X-SMOKE-001
    tool: onboard-intake-smoke
    title: the live rows' browser toolchain is not on this machine
    what: "the live acceptance rows (intake-form-browser-submit, review-gate-accepts-open-field-invite) run ops/scripts/onboard-intake-smoke.sh from the deployer's laptop, and it exits 2 before touching the goatnet when ops/goat-id-console/web/e2e has no node_modules. The release did not fail on the goatnet; it failed here."
    causes:
      - a laptop that never installed the console's Playwright suite
    fixes:
      - "(cd ops/goat-id-console/web/e2e && npm ci && npx playwright install chromium)"
      - "goatbuilder doctor --browser-tests   (the tool:live-rows row fails until this machine is ready)"
    read: docs/design/release-candidate-validation.md
    matches:
      - "has no node_modules"

  - code: X-PY-001
    tool: python
    title: a Python module is missing
    what: python3 could not import a module a script needs.
    causes:
      - a fresh machine or a venv not on PATH
    fixes:
      - "pip install <module>   (pyyaml, jsonschema are the usual two)"
      - "a script Ansible runs on the control node uses ansible_playbook_python, which carries PyYAML; a task that still calls bare python3 should too"
    read: docs/design/goatbuilder.md
    matches:
      - "ModuleNotFoundError: No module named"
      - "(X-PY-001)"

  # ------------------------------------------------- the secrets posture (ADR 1204)

  - code: X-SECRETS-001
    tool: with-secrets
    title: "the declared secrets store is unknown"
    what: "GOAT_SECRET_STORE or `secrets: store:` in goatbuilder.yaml names a store goat does not have, so no command can get its secrets."
    causes:
      - a typo in GOAT_SECRET_STORE or in goatbuilder.yaml
      - a custom store whose ops/secrets/<name>/run is not on this checkout
    fixes:
      - "goatbuilder secrets store   (prints the store in force and where it came from)"
      - "use one of: 1password, openbao, custom, sops, git-crypt, env-file, env"
    read: docs/design/pluggable-dependencies.md
    matches:
      - "unknown secrets store"
      - "unknown GOAT_SECRET_STORE"

  - code: X-SECRETS-002
    tool: with-secrets
    title: "the env-file store has no file"
    what: "the declared store is env-file, and its file of values does not exist on this laptop."
    causes:
      - the quickstart's env file was never generated
      - a goatlite whose phase 1 has not run yet (phase 1 renders the goatnet, then creates this file)
      - GOAT_SECRET_ENV_FILE points somewhere else
    fixes:
      - "on a goatlite: goatbuilder standup <name> --to 1   (renders the goatnet, then creates the file)"
      - "on any other goatnet: goatbuilder secrets init --env <goatnet>   (strong random values, 0600, gitignored)"
    read: docs/design/pluggable-dependencies.md
    matches:
      - "env-file store: .* does not exist"
      - "the goatlite .* has no config surface yet"

  - code: X-SECRETS-003
    tool: goatbuilder
    title: "refusing to write secret values to a file git would commit"
    what: "`secrets init` writes plaintext values, so it refuses a path that is not gitignored."
    causes:
      - --file names a path inside the repository that .gitignore does not cover
    fixes:
      - "add the path to .gitignore, or use the default .envrc.local.d/secrets.env"
    read: docs/design/pluggable-dependencies.md
    matches:
      - "refusing to write values to .* it is not gitignored"

  - code: X-SECRETS-004
    tool: with-secrets
    title: "bao:// references need the OpenBao injector"
    what: "the environment holds bao:// references, and ops/secrets/openbao/run (the OpenBao store's injector, ADR 1203) is not on this checkout."
    causes:
      - a .refs file holds bao:// lines on a checkout that predates the OpenBao store
    fixes:
      - "git pull --ff-only origin main   (the injector lands with the OpenBao store)"
      - "or remove the bao:// lines and use op:// references meanwhile"
    read: docs/design/pluggable-dependencies.md
    matches:
      - "bao:// references need the OpenBao store's injector"

  - code: X-SECRETS-005
    tool: with-secrets
    title: "a git-crypt file is still encrypted"
    what: "the declared store is git-crypt and its file has not been unlocked on this laptop, so its values cannot be read."
    causes:
      - this clone was never unlocked
    fixes:
      - "git-crypt unlock"
    read: docs/design/pluggable-dependencies.md
    matches:
      - "is still encrypted — run: git-crypt unlock"

  - code: X-ACCEPT-001
    tool: acceptance.sh
    title: "acceptance could not run a required check, so the peering is not accepted"
    what: "ops/federation/standup/acceptance.sh (phase 14) found no failure, but a required check was BLOCKED (its input or evidence was unavailable) or SKIPPED (not exercised). Such a check proves nothing, so the verdict in <work>/evidence/acceptance/result.json is INCOMPLETE and the run exits 3, not 0."
    causes:
      - a surface the check reads is not configured (for example the partner's REST endpoint or the SPIRE servers)
      - the agreement offers nothing in one direction, so that direction's checks had nothing to send
      - a probe session the check needs was not started
    fixes:
      - "read the BLOCKED and skipped lines above the acceptance-counts line, or the why field of result.json; set what each names, then run phase 14 again"
      - "ops/scripts/peering-standup.sh <peering> --from 14"
    read: docs/design/federation-acceptance.md
    matches:
      - "ACCEPTANCE FAILED — [0-9]+ passed, [0-9]+ SKIPPED"
  - code: X-DIGEST-001
    tool: image-digest
    title: "no tool could read the image's digest"
    what: "ops/scripts/image-digest tried crane, skopeo and docker in turn; none is installed, or each refused, and each tool's own error is printed beneath."
    causes:
      - none of crane, skopeo or docker is installed
      - the registry refused this laptop's credentials (each tool's error says which)
      - the tag does not exist yet (its image build has not finished)
    fixes:
      - "brew install crane"
      - "gh auth token | crane auth login ghcr.io -u <user> --password-stdin"
    read: docs/design/pluggable-dependencies.md
    matches:
      - "image-digest: none of crane, skopeo or docker is installed"
      - "image-digest: no digest for"
