    tool: goatbuilder
    title: a declaration must name who made it
    what: every declaration, and every record it converges, carries the person who made it (contract C4). A deploy, rollback or standup run without --ack is refused before anything is published.
    causes:
      - --ack was not passed, or was empty
    fixes:
      - "re-run with --ack \"<your name>\""
    read: docs/design/goatbuilder.md
    matches:
      - "a declaration names who made it"
    exit: 1

