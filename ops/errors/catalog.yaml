  - code: GB-188
    tool: goatbuilder
    title: the plan no longer holds
    what: "Immediately before anything changes, deploy runs the planner's live recheck: every live prerequisite is checked again and every input section is compared with a plan built now. Something did not hold (a section changed, a check was not PASS or NOT APPLICABLE or was not answered, or the plan was not READY), so the approved plan no longer describes the change, and a saved plan is not proof the environment stayed the same. Nothing changed."
    causes:
      - the agreement was composed again (a new package from either side)
      - apply rendered the files again, or one was edited by hand
    fixes:
      - "goatbuilder federate plan <partner>   (a new plan from what is there now; approve its hash)"
    read: docs/design/goatbuilder.md
    matches:
