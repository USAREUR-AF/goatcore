      - "^unexpected argument '[^']*': only a stage word"
      - "^--plan and --approve-plan belong to"
      - "^deploy: --from [0-9]+ is not a deploy start"
      - "^--partner-key, --partner-ca-fingerprint(, --agreement-digest and --place-pointer-package| and --agreement-digest) belong to phases 5 and 6"
      - "^--confirm, --approve-admission and --review-in-pr do not apply to"
      - "^--approve-admission and --review-in-pr (are for phase 10|belong to)"
      - "^--approve-admission, --review-in-pr and --confirm are for phase 10"
      - "^--partner-key and --partner-ca-fingerprint are for phase 5"
