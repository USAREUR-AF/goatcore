    tool: goatbuilder
    title: the local declaration is not the source of record's
    what: a deploy applies only what the source of record declares (contract C3). A local copy behind it is fast-forwarded first, or refused under --frozen; a local copy ahead of it or diverged from it is always refused, because a declaration that is not in the source of record is never applied.
    causes:
      - the checkout or the fixture's declared/ was not fast-forwarded and --frozen was passed
      - a declaration was edited locally instead of in the source of record
    fixes:
      - "fast-forward, then re-run: cp source/pins.yaml declared/pins.yaml (on a repository: git pull --ff-only)"
      - "make the change in the source of record and re-run"
    read: docs/design/goatbuilder-conformance.md
    matches:
      - "behind the source of record"
      - "ahead of the source of record"
      - "is not the source of record's"
    exit: 1

