[workspace]
resolver = "2"
members = [
    "goat-consistency",
    "goat-consistency-wire",
    "goat-consistency-health",
    "goat-consistency-console",
]

# Its own workspace, detached from the repo root — the convention every
# ops/zenoh-trial-peers/* crate follows, so a `cargo build` here never drags in
# the goat-cli tree or its lockfile.

[profile.release]
lto = "thin"
codegen-units = 16

# Finding F-614: the published zenoh-link-tls shares one TLS stream between
# its read and write tasks. This patched 1.9.0 copy fixes that; every other
# zenoh crate stays on the published =1.9.0. Remove with the copy (see its
# README.md) once a zenoh release ships the fix.
[patch.crates-io]
zenoh-link-tls = { path = "vendor/zenoh-link-tls" }
