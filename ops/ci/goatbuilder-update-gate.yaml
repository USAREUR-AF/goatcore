# The goatbuilder update gate (ops/ci/goatbuilder-update-gate.py), run by the
# release workflow before a goatbuilder release is published.
#
# floor: the oldest 0.x minor whose last release must still update to every new
#   release. Raising it drops a minor from the promise; record why in the PR.
# refuses: an installed release that cannot update and cannot be fixed in place,
#   with the code it refuses with, why, and the fix its catalog entry gives. The
#   gate runs it and asserts exactly that refusal; one that starts to install
#   again must be removed, so the list only shrinks.
# measured_elsewhere: a build that is not published in this repository and so
#   cannot be run here, keyed by the sha256 of its binary, with the refusal
#   measured where that binary is kept, why it cannot be fixed in place, and the
#   fix its catalog entry gives. Describe what the build is, never where it is.
floor: "0.4"
refuses: []
measured_elsewhere: []
