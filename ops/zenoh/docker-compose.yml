# Zenoh load generator — Phase 2 soak test (Step 6).
# Deploy alongside the zenoh router pair on integdev.
#
# Required env (pass via -e or .env):
#   ZENOH_ENDPOINT   — e.g. http://172.31.x.x:8088
#   SCENARIO         — baseline | persistent10x | burst
#
# Usage:
#   ZENOH_ENDPOINT=http://172.31.x.x:8088 SCENARIO=baseline \
#     docker compose -f ops/zenoh/docker-compose.yml up -d loadgen

services:
  loadgen:
    build:
      context: loadgen/
    container_name: zenoh-loadgen
    restart: unless-stopped
    environment:
      ZENOH_ENDPOINT: "${ZENOH_ENDPOINT}"
      SCENARIO: "${SCENARIO:-baseline}"
      BURST_DURATION: "${BURST_DURATION:-10m}"
      KEY_PREFIX: "${KEY_PREFIX:-ops/loadgen}"
      DRY_RUN: "${DRY_RUN:-0}"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: "${LOADGEN_MEMORY:-64M}"
