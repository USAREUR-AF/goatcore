# Release-set registry (ADR 1027) — the declared SoT for partner namespace
# partitioning (data-access program B2).
#
# A RELEASE SET is a named group of partner orgs that may READ a release lane
# (`release/<set>/**`). Membership is registry-authoritative and edited HERE;
# changing membership is a registry edit — never a republish, a cert change, a
# NetBird group, or an Ory claim (identity-grammar invariant: affiliation /
# release standing rides the registry only).
#
# This file is DECLARATIVE. It drives two consumers:
#   1. the Data-Access COP reveal (portal `Sources.Releases` → partner→release
#      graph edges) — visible as soon as this is populated;
#   2. the B2.1 Zenoh ACL read-carve (static `release/<set>/**` read lanes cut
#      per partner subject) — the ENFORCEMENT, default-off + tripwire-gated.
#
# Declaring a set here does NOT by itself restrict reads: the trial fabric is
# flat-read until the B2.1 partition is enabled on a goatnet. The COP is honest
# about that (it flags reads as still-flat while showing the declared sets).
#
# WHERE A GOATNET DECLARES ITS OWN SETS: `portal_release_sets` in its
# group_vars (e.g. group_vars/<site>_hosts/data-access.yml), a list of
# {set, prefix, members} in exactly this file's shape. When that list is
# defined and non-empty, roles/goat-zenoh-portal renders the portal's registry
# from it (templates/release-sets.yaml.j2) and this file is not used. This
# file is the generic registry a goatnet that declares nothing receives.
#
# `members` are ORG identifiers (the write-anchor UUID or seed org prefix),
# never person handles. `prefix` defaults to `release/<set>/` when omitted.
#
# READ vs WRITE are two registry-driven ACL carves (both built):
#   READ  — who may READ a lane: `zenoh_partner_read_lanes` (partner anchor ->
#           the sets it reads), B2.1 partner read partition.
#   WRITE — who may PUBLISH into a lane: `zenoh_release_writers` (producer anchor
#           -> the sets it may write), release-lane write grant. This is
#           how data ENTERS a lane. See partner-read-partition.md +
#           partner-data-exchange.md §"Outbound enforcement, today".

version: 1
release_sets:
  # ADR 1027 §2: at the sandbox stage a goatnet is ONE coarse release set of its
  # participating partner orgs. Membership is filled by partner onboarding
  # (B2.2) — declared empty here rather than fabricated.
  - set: ZAGROS
    prefix: release/ZAGROS/
    members: []

  # REL-ALL — the BROAD lane: every partner org onboarded to this goatnet reads
  # it. The "rel all" half of the rel-them/rel-all pair (partner-data-exchange.md).
  # A producer publishing here is saying "any partner may have this", which is
  # why membership is not enumerated per org: the read carve grants this lane to
  # every partitioned partner anchor. Adding a member here is therefore NOT how
  # a partner gains access — `zenoh_partner_read_lanes` is.
  - set: REL-ALL
    prefix: release/REL-ALL/
    members: []

  # REL-PARTNER — a BILATERAL lane: one nation's partner orgs, nobody else. This is
  # the shape a `partner`-standing org gets by construction (ADR 1077): coalition
  # MEMBER orgs are eligible for the framework's member lane, partners get
  # bilateral / coalition lanes only. UKR is not a NATO member, so REL-PARTNER is
  # how Ukrainian partner orgs receive anything beyond REL-ALL.
  #
  # `members` are ORG ids. Empty until the cohort is minted —
  # declaring a member here does not grant a read (that is the ACL carve); this
  # list is the DECLARATION the COP reveals and the reason the lane exists.
  - set: REL-PARTNER
    prefix: release/REL-PARTNER/
    members: []
