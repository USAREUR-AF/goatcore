<!DOCTYPE html>
<!-- SPDX-License-Identifier: Apache-2.0
     Bleating Edge starter: copy this file to ops/fieldkit/<tool>/<tool>.html.
     A new tool is its API and an action list:
       1. Declare each action once, on its element: data-action (a name),
          data-cli (the goat verb it equals) and data-api ("METHOD /route").
          At most eight. Add one row per action to ops/ci/fieldkit-cli-allowlist.txt.
       2. Call an action only with BE.call(name, params, body).
       3. Show the result before it runs (a .be-preview and a "Same as" strip),
          and ask with BE.confirm before any change.
       4. Run python3 ops/fieldkit/inline.py to copy Bleating Edge in.
     ops/ci/check-fieldkit-scope.py checks 1 and 2. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self'; img-src 'none'; base-uri 'none'; form-action 'none'">
<title>Fieldkit Example</title>
<style data-bleating-edge>
/* SPDX-License-Identifier: Apache-2.0
 * Bleating Edge — the design system for Fieldkit tools.
 * docs/design/fieldkit-and-bleating-edge.md §4.
 *
 * Tokens: one high-contrast palette with a sunlight mode (default) and a dark
 * mode, one type scale, touch targets of at least 44 px. Components are the
 * eight in §4; each is a class prefixed `be-`. Inlined into each tool by
 * ops/fieldkit/inline.py, so a tool is one file with no outside assets.
 */

:root {
  /* Sunlight: black on white, saturated signal colours, nothing pale. */
  --be-bg: #ffffff;
  --be-surface: #f2f2f2;
  --be-text: #000000;
  --be-muted: #2b2b2b;
  --be-line: #000000;
  --be-accent: #0033cc;
  --be-on-accent: #ffffff;
  --be-ok: #005a1e;
  --be-ok-bg: #d9f2df;
  --be-warn: #6b4500;
  --be-warn-bg: #ffe08a;
  --be-bad: #a10000;
  --be-bad-bg: #ffd6d6;
  --be-focus: #ff6a00;

  /* One type scale (ratio 1.25 on an 18 px base: readable at arm's length). */
  --be-size-small: 0.9rem;
  --be-size-base: 1.125rem;
  --be-size-large: 1.4rem;
  --be-size-title: 1.75rem;
  --be-font: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
  --be-mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;

  --be-target: 48px; /* never below 44 px */
  --be-gap: 12px;
  --be-radius: 6px;
  --be-border: 2px;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="sunlight"]) {
    --be-bg: #000000;
    --be-surface: #161616;
    --be-text: #ffffff;
    --be-muted: #d6d6d6;
    --be-line: #ffffff;
    --be-accent: #7fb2ff;
    --be-on-accent: #000000;
    --be-ok: #7dffa0;
    --be-ok-bg: #003d14;
    --be-warn: #ffd34d;
    --be-warn-bg: #3d2b00;
    --be-bad: #ff8a8a;
    --be-bad-bg: #4a0000;
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --be-bg: #000000;
  --be-surface: #161616;
  --be-text: #ffffff;
  --be-muted: #d6d6d6;
  --be-line: #ffffff;
  --be-accent: #7fb2ff;
  --be-on-accent: #000000;
  --be-ok: #7dffa0;
  --be-ok-bg: #003d14;
  --be-warn: #ffd34d;
  --be-warn-bg: #3d2b00;
  --be-bad: #ff8a8a;
  --be-bad-bg: #4a0000;
  color-scheme: dark;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--be-bg);
  color: var(--be-text);
  font-family: var(--be-font);
  font-size: var(--be-size-base);
  line-height: 1.45;
}

.be-page { max-width: 760px; margin: 0 auto; padding: 16px; }
.be-title { font-size: var(--be-size-title); margin: 0 0 4px; }
.be-subtitle { font-size: var(--be-size-small); color: var(--be-muted); margin: 0 0 var(--be-gap); }
h2 { font-size: var(--be-size-large); margin: 24px 0 8px; }
p { margin: 8px 0; }
code, .be-mono { font-family: var(--be-mono); font-size: 0.95em; overflow-wrap: anywhere; }

:focus-visible { outline: 4px solid var(--be-focus); outline-offset: 2px; }

button, input, select, textarea { font: inherit; color: inherit; }

/* Every control is at least one target tall. */
button, .be-button, input[type="text"], select, textarea {
  min-height: var(--be-target);
  border: var(--be-border) solid var(--be-line);
  border-radius: var(--be-radius);
  background: var(--be-bg);
  padding: 8px 14px;
}
input[type="text"], textarea { width: 100%; }
label { display: block; font-weight: 600; margin: 12px 0 4px; }
button { cursor: pointer; font-weight: 600; }
button.be-primary { background: var(--be-accent); color: var(--be-on-accent); border-color: var(--be-accent); }
button:disabled { opacity: 0.45; cursor: not-allowed; }

/* 1. Connected or cut-off banner */
.be-banner {
  border: var(--be-border) solid var(--be-line);
  border-radius: var(--be-radius);
  padding: 12px 14px;
  margin: 0 0 var(--be-gap);
  font-weight: 600;
}
.be-banner[data-state="connected"] { background: var(--be-ok-bg); color: var(--be-ok); border-color: var(--be-ok); }
.be-banner[data-state="cutoff"] { background: var(--be-warn-bg); color: var(--be-warn); border-color: var(--be-warn); }
.be-banner[data-state="unknown"] { background: var(--be-surface); }
.be-banner small { display: block; font-weight: 400; color: inherit; }

/* Action list: the tool's fixed actions, as big buttons. */
.be-actions { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin: 0 0 var(--be-gap); }
.be-actions button[aria-pressed="true"] { background: var(--be-accent); color: var(--be-on-accent); border-color: var(--be-accent); }

/* 2. List row for a source or rule */
.be-list { list-style: none; margin: 0; padding: 0; }
.be-row {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
  min-height: var(--be-target);
  padding: 10px 12px;
  border: var(--be-border) solid var(--be-line);
  border-radius: var(--be-radius);
  margin: 0 0 8px;
}
.be-row-main { flex: 1 1 240px; min-width: 0; }
.be-row-title { font-weight: 600; overflow-wrap: anywhere; }
.be-row-meta { font-size: var(--be-size-small); color: var(--be-muted); }
.be-row[aria-selected="true"] { outline: 4px solid var(--be-accent); }
.be-row button { flex: 0 0 auto; }
.be-badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: var(--be-size-small); font-weight: 700; border: var(--be-border) solid currentColor; }
.be-badge[data-tone="ok"] { color: var(--be-ok); background: var(--be-ok-bg); }
.be-badge[data-tone="warn"] { color: var(--be-warn); background: var(--be-warn-bg); }
.be-badge[data-tone="bad"] { color: var(--be-bad); background: var(--be-bad-bg); }

/* 3. Action button with a result preview */
.be-preview {
  border-left: 6px solid var(--be-accent);
  background: var(--be-surface);
  padding: 10px 12px;
  margin: 12px 0;
}
.be-preview:empty { display: none; }

/* 4. Duration picker (4, 24, 72 hours) */
.be-duration { display: flex; gap: 8px; border: 0; padding: 0; margin: 0; }
.be-duration legend { font-weight: 600; margin-bottom: 4px; padding: 0; }
.be-duration label { margin: 0; font-weight: 600; }
.be-duration input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.be-duration span {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 88px; min-height: var(--be-target);
  border: var(--be-border) solid var(--be-line); border-radius: var(--be-radius);
  padding: 0 12px; cursor: pointer;
}
.be-duration input:checked + span { background: var(--be-accent); color: var(--be-on-accent); border-color: var(--be-accent); }
.be-duration input:focus-visible + span { outline: 4px solid var(--be-focus); outline-offset: 2px; }
.be-duration input:disabled + span { opacity: 0.45; cursor: not-allowed; }

/* 5. Confirm sheet */
.be-sheet {
  border: var(--be-border) solid var(--be-line);
  border-radius: var(--be-radius);
  background: var(--be-bg);
  color: var(--be-text);
  padding: 16px;
  width: min(560px, calc(100vw - 32px));
}
.be-sheet::backdrop { background: rgba(0, 0, 0, 0.6); }
.be-sheet-buttons { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 16px; }

/* 6. "Same as" CLI strip */
.be-cli {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  background: var(--be-surface);
  border: var(--be-border) dashed var(--be-line);
  border-radius: var(--be-radius);
  padding: 8px 12px;
  margin: 12px 0;
}
.be-cli-label { font-size: var(--be-size-small); font-weight: 700; }
.be-cli code { flex: 1 1 200px; }

/* 7. Waiting list */
.be-waiting .be-row { border-style: dashed; }

/* 8. Error with what-to-do text */
.be-error {
  border: var(--be-border) solid var(--be-bad);
  background: var(--be-bad-bg);
  color: var(--be-text);
  border-radius: var(--be-radius);
  padding: 12px 14px;
  margin: 12px 0;
}
.be-error:empty { display: none; }
.be-error dt { font-weight: 700; color: var(--be-bad); }
.be-error dd { margin: 0 0 8px; }
.be-ok-note {
  border: var(--be-border) solid var(--be-ok);
  background: var(--be-ok-bg);
  border-radius: var(--be-radius);
  padding: 12px 14px;
  margin: 12px 0;
}
.be-ok-note:empty { display: none; }

[hidden] { display: none !important; }
.be-hint { font-size: var(--be-size-small); color: var(--be-muted); }
</style>
</head>
<body>
<main class="be-page">
  <h1 class="be-title">Fieldkit Example</h1>
  <p class="be-subtitle">One line: what this tool is for.</p>
  <div id="banner" class="be-banner" data-state="unknown" role="status">State not known yet.</div>
  <div id="error" class="be-error"></div>

  <nav class="be-actions" aria-label="Actions">
    <button type="button" data-action="status" data-cli="pod status" data-api="GET /v1/status">Status</button>
  </nav>

  <section>
    <h2>Status</h2>
    <ul id="list" class="be-list"></ul>
    <div class="be-cli" id="strip"></div>
  </section>
</main>

<script data-bleating-edge>
/* SPDX-License-Identifier: Apache-2.0
 * Bleating Edge — the one small script every Fieldkit tool includes.
 * docs/design/fieldkit-and-bleating-edge.md §4.
 *
 * A tool declares its actions in its own HTML, one element per action:
 *   <button data-action="allow" data-cli="pod rules allow" data-api="POST /v1/rules">
 * BE.call(name, params, body) is the ONLY way a tool reaches its API, and it
 * can reach only a route an action declares. ops/ci/check-fieldkit-scope.py
 * checks every declared action against the allow list of CLI verbs, so a tool
 * cannot do anything the CLI cannot.
 *
 * No state is kept here: every list is read fresh from the API.
 */
(function () {
  "use strict";

  function h(tag, attrs) {
    var el = document.createElement(tag);
    var a = attrs || {};
    Object.keys(a).forEach(function (k) {
      var v = a[k];
      if (v === null || v === undefined || v === false) return;
      if (k === "text") el.textContent = v;
      else if (k.slice(0, 2) === "on" && typeof v === "function") el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? "" : String(v));
    });
    for (var i = 2; i < arguments.length; i++) {
      var c = arguments[i];
      if (c === null || c === undefined || c === false) continue;
      (Array.isArray(c) ? c : [c]).forEach(function (x) {
        el.append(x instanceof Node ? x : document.createTextNode(String(x)));
      });
    }
    return el;
  }

  // The action table, read from the page: name -> {cli, method, route, el}.
  function actions() {
    var out = {};
    document.querySelectorAll("[data-action]").forEach(function (el) {
      var api = (el.getAttribute("data-api") || "").trim().split(/\s+/);
      out[el.getAttribute("data-action")] = {
        cli: el.getAttribute("data-cli") || "",
        method: api[0] || "GET",
        route: api[1] || "",
        el: el,
      };
    });
    return out;
  }

  function fillRoute(route, params) {
    return route.replace(/\{(\w+)\}/g, function (_, k) {
      if (!params || params[k] === undefined || params[k] === "") throw plainError("The page is missing a value: " + k + ".");
      return encodeURIComponent(params[k]);
    });
  }

  function plainError(what, why, fix, code) {
    var e = new Error(what);
    e.what = what;
    e.why = why || "";
    e.fix = fix || "";
    e.code = code || "";
    return e;
  }

  // Call one declared action. Resolves to the parsed JSON body.
  function call(name, params, body) {
    var a = actions()[name];
    if (!a || !a.route) return Promise.reject(plainError("This page has no action named " + name + "."));
    var path;
    try { path = fillRoute(a.route, params); } catch (e) { return Promise.reject(e); }
    var opts = { method: a.method, headers: { Accept: "application/json" }, credentials: "same-origin", cache: "no-store" };
    if (body !== undefined) {
      opts.headers["Content-Type"] = "application/json";
      opts.body = JSON.stringify(body);
    }
    return fetch(path, opts).then(function (res) {
      return res.text().then(function (text) {
        var data = null;
        try { data = text ? JSON.parse(text) : {}; } catch (_) { data = null; }
        if (res.ok && data) return data;
        var err = data && data.error ? data.error : {};
        throw plainError(
          err.what || err.message || ("The pod refused (" + res.status + ")."),
          err.why || "",
          err.fix || (res.status === 401 || res.status === 403
            ? "Sign in with your goat certificate or card. Only a person named as local authority can change rules."
            : "Try again. If it fails again, give the code below to your goat operator."),
          err.code || ("HTTP " + res.status)
        );
      });
    }, function () {
      throw plainError(
        "The pod did not answer.",
        "This page talks only to the pod that served it. The pod service may have stopped or restarted.",
        "Wait one minute and press Refresh. If it still fails, check the pod has power and its service is running.",
        "NO-ANSWER"
      );
    });
  }

  // ---- time --------------------------------------------------------------
  function untilFromHours(hours, now) {
    var t = new Date((now || Date.now()) + hours * 3600 * 1000);
    t.setUTCSeconds(0, 0);
    return t.toISOString().replace(".000Z", "Z");
  }

  function age(seconds) {
    var s = Math.max(0, Math.round(seconds));
    if (s < 90) return s + " seconds";
    if (s < 90 * 60) return Math.round(s / 60) + " minutes";
    if (s < 48 * 3600) return Math.round(s / 3600) + " hours";
    return Math.round(s / 86400) + " days";
  }

  function when(iso) {
    if (!iso) return "no end date";
    var d = new Date(iso);
    if (isNaN(d.getTime())) return iso;
    var diff = (d.getTime() - Date.now()) / 1000;
    var rel = diff >= 0 ? "in " + age(diff) : age(-diff) + " ago";
    var two = function (n) { return (n < 10 ? "0" : "") + n; };
    var abs = d.getFullYear() + "-" + two(d.getMonth() + 1) + "-" + two(d.getDate()) + " " + two(d.getHours()) + ":" + two(d.getMinutes());
    return abs + " (" + rel + ")";
  }

  // ---- components ----------------------------------------------------------

  // 1. Connected or cut-off banner.
  function banner(el, s) {
    el.replaceChildren();
    if (!s) {
      el.setAttribute("data-state", "unknown");
      el.append("Pod state not known yet.");
      return;
    }
    el.setAttribute("data-state", s.connected ? "connected" : "cutoff");
    el.append(s.connected ? "Connected to goat." : "Cut off from goat. This pod works on its own.");
    var detail = s.connected
      ? "Rules came from goat " + age(s.generation_age_seconds || 0) + " ago."
      : "Last rules from goat are " + age(s.generation_age_seconds || 0) + " old. Changes made here wait for an org lead to check them.";
    el.append(h("small", { text: detail }));
  }

  // 2. List row for a source or rule.
  function row(o) {
    var li = h("li", { class: "be-row", "data-key": o.key || null },
      h("div", { class: "be-row-main" },
        h("div", { class: "be-row-title", text: o.title }),
        o.meta ? h("div", { class: "be-row-meta", text: o.meta }) : null),
      o.badge ? h("span", { class: "be-badge", "data-tone": o.badge.tone || "", text: o.badge.text }) : null,
      o.button ? h("button", { type: "button", text: o.button.label, onclick: o.button.onClick }) : null);
    return li;
  }

  // 4. Duration picker. Hours above `max` are disabled.
  function duration(container, name, max, choices) {
    var hours = choices || [4, 24, 72];
    var fs = h("fieldset", { class: "be-duration" }, h("legend", { text: "For how long" }));
    var first = true;
    hours.forEach(function (n) {
      var off = typeof max === "number" && n > max;
      var input = h("input", { type: "radio", name: name, value: String(n), disabled: off, checked: !off && first });
      if (!off) first = false;
      fs.append(h("label", null, input, h("span", { text: n + " hours" })));
    });
    container.replaceChildren(fs);
    return {
      hours: function () {
        var c = fs.querySelector("input:checked");
        return c ? Number(c.value) : null;
      },
      onChange: function (fn) { fs.addEventListener("change", fn); },
    };
  }

  // Shell-quote one argument for the CLI strip.
  function quote(s) {
    s = String(s);
    if (/^[A-Za-z0-9._:\/=@+-]+$/.test(s)) return s;
    return "'" + s.replace(/'/g, "'\\''") + "'";
  }

  // 6. "Same as" CLI strip. `words` are the arguments after the verb.
  function cli(el, verb, words) {
    var text = "goat " + verb + (words && words.length ? " " + words.map(quote).join(" ") : "");
    el.replaceChildren(
      h("span", { class: "be-cli-label", text: "Same as" }),
      h("code", { text: text }),
      h("button", {
        type: "button", text: "Copy", "aria-label": "Copy the command",
        onclick: function (ev) {
          var b = ev.currentTarget;
          var done = function () { b.textContent = "Copied"; setTimeout(function () { b.textContent = "Copy"; }, 1500); };
          if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, function () {});
        },
      }));
    return text;
  }

  // 5. Confirm sheet. Resolves true only when the person presses the yes button.
  function confirm(o) {
    return new Promise(function (resolve) {
      var dlg = h("dialog", { class: "be-sheet", "aria-labelledby": "be-sheet-title" });
      var stripEl = h("div", { class: "be-cli" });
      var yes = h("button", { type: "button", class: "be-primary", text: o.yes || "Yes, do it" });
      var no = h("button", { type: "button", text: "No, go back" });
      dlg.append(
        h("h2", { id: "be-sheet-title", text: o.title }),
        h("div", { class: "be-preview", text: o.preview }),
        stripEl,
        h("div", { class: "be-sheet-buttons" }, no, yes));
      if (o.verb) cli(stripEl, o.verb, o.words || []);
      else stripEl.remove();
      var finish = function (v) { dlg.close(); dlg.remove(); resolve(v); };
      yes.addEventListener("click", function () { finish(true); });
      no.addEventListener("click", function () { finish(false); });
      dlg.addEventListener("cancel", function (ev) { ev.preventDefault(); finish(false); });
      document.body.append(dlg);
      if (dlg.showModal) dlg.showModal(); else dlg.setAttribute("open", "");
      no.focus();
    });
  }

  // 8. Error with what-to-do text.
  function error(el, e) {
    el.replaceChildren();
    if (!e) return;
    var dl = h("dl", null,
      h("dt", { text: "What happened" }), h("dd", { text: e.what || e.message || "Something went wrong." }));
    if (e.why) dl.append(h("dt", { text: "Why" }), h("dd", { text: e.why }));
    dl.append(h("dt", { text: "What to do" }), h("dd", { text: e.fix || "Try again." }));
    if (e.code) dl.append(h("dt", { text: "Code" }), h("dd", null, h("code", { text: e.code })));
    el.append(dl);
    el.setAttribute("role", "alert");
  }

  function note(el, text) {
    el.textContent = text || "";
    if (text) el.setAttribute("role", "status");
  }

  window.BE = {
    h: h, actions: actions, call: call, untilFromHours: untilFromHours, age: age, when: when,
    banner: banner, row: row, duration: duration, quote: quote, cli: cli, confirm: confirm,
    error: error, note: note,
  };
})();
</script>
<script>
(function () {
  "use strict";
  var BE = window.BE;
  var A = BE.actions();
  function load() {
    BE.cli(document.getElementById("strip"), A.status.cli, []);
    BE.call("status").then(function (s) {
      BE.banner(document.getElementById("banner"), s);
      var list = document.getElementById("list");
      list.replaceChildren(BE.row({ title: "Example row", meta: "Plain words, short labels.", badge: { text: "OK", tone: "ok" } }));
      BE.error(document.getElementById("error"), null);
    }, function (e) { BE.error(document.getElementById("error"), e); });
  }
  A.status.el.addEventListener("click", load);
  load();
})();
</script>
</body>
</html>
