        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Default"
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
    delete:
      summary: Delete (offboard) a vendor
      operationId: deleteVendor
      tags: [vendors]
      description: |
        Removes the vendor registry row and tears down its wire-layer ACL.

        **In per-uuid-slot-pool mode (ADR 1025)** there is no per-vendor ACL
        (the pool rule is pre-baked), so this instead **frees the slot**:
        clears `assigned_to` so the alias drops from `/aliases` and the
        slot index returns to the pool for re-onboarding. It is idempotent and
        reconciles an orphaned slot: a `DELETE` on an already-absent vendor
        still `204`s if it freed an assigned slot, and `404`s only when there
        was nothing to delete or free. This is the path `goat admin onboard
        --revoke` uses.

        Refuses with `409` if the vendor still has non-retired topics.
      responses:
        "204":
          description: Deleted (vendor row and/or slot freed).
          headers:
            Api-Version:
              $ref: '#/components/headers/ApiVersion'
        "200":
          description: Registry row deleted but wire-layer ACL teardown failed (per-vendor mode); re-run to reconcile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteVendorWarning"
          headers:
            Api-Version:
              $ref: '#/components/headers/ApiVersion'
        "404":
          description: No vendor and no assigned slot for that prefix.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        "409":
          description: Vendor has non-retired topics; retire them first.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Default"

  /vendors/{vendor}/rotate:
    parameters:
      - $ref: "#/components/parameters/VendorPath"
      - $ref: '#/components/parameters/ApiVersion'
    post:
      summary: Re-issue (rotate) a peer's cert in place
      operationId: rotateVendor
      tags: [vendors]
      description: |
        Re-issues the leaf cert for an **existing** peer without allocating a
        new slot or changing its anchor, the "rotate" sibling of revocation
        (ADR 1031). Use it for expiry renewal, post-compromise rotation, or
        retrofitting a new URI-SAN scheme onto already-issued certs (e.g.
        re-minting a goatnet's fleet from a legacy prefix to `urn:goat:<goatnet>:org=`).

        Everything identity-bearing is unchanged: anchor, CN, alias / handle,
        slot assignment, write namespace, and the pre-baked ACL. Only the leaf
        cert and the portal `api_key` are fresh (the old key's plaintext is
        unrecoverable, and a rotation event wants new credentials anyway). No
        ACL render and no router restart are needed: the rule already admits
        the unchanged anchor/CN.

        Operator-gated. Returns the same shape as onboarding (`POST
        /vendors`) with a fresh one-time bundle URL; swap the tarball's
        cert+key on the peer and restart it.
      responses:
        "200":
          description: Cert re-issued; body carries the fresh api_key and one-time bundle URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateVendorResponse"
          headers:
            Api-Version:
              $ref: '#/components/headers/ApiVersion'
        "404":
          description: "No such peer. Rotation re-issues, it does not create; onboard via POST /vendors instead."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Default"

  /envelopes:
    get:
      summary: List per-actor throughput envelopes
      operationId: listEnvelopes
      tags: [envelopes]
      description: |
        The anchor to throughput-envelope map (ADR 1045 /
        docs/design/qos-throughput-envelopes.md), read like the slot-alias
        registry. Each envelope is an actor's *expected* traffic as four
        ascending levels, `min <= mean <= high <= max`, on two axes (`msgs/s`
        and `bytes/s`), keyed by the write anchor (= vendor prefix, or slot_id
        in slot-pool mode). `goat top` fetches + caches this and renders each
        producer's LOW / normal / HIGH / OVER band; it degrades to "no
        envelope" when this cannot be fetched.

        DECLARED governance/display metadata only; it does not touch the wire,
        ACL, cert, or namespace. `source` is `default` (the rough class-baseline
        placeholder assigned at registration) or `edited` (party-set).
      responses:
        "200":
          description: Every stored envelope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeList"
          headers:
            Api-Version:
              $ref: '#/components/headers/ApiVersion'
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Vary:
              $ref: '#/components/headers/Vary'
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Default"

        '304':
          $ref: '#/components/responses/NotModified'
    parameters:
      - $ref: '#/components/parameters/ApiVersion'
  /vendors/{vendor}/envelope:
    parameters:
      - $ref: "#/components/parameters/VendorPath"
      - $ref: '#/components/parameters/ApiVersion'
    put:
      summary: Edit an actor's throughput envelope
      operationId: putEnvelope
      tags: [envelopes]
      description: |
        Records the registering party's declared throughput expectation (ADR
        1045). Scoped: the **owning vendor** (the party that knows its workload
        best) or the **operator**. The eight numbers must be non-negative and
        ascend `min <= mean <= high <= max` on each axis; an event-driven/bursty
        actor declares `min = 0` so correct silence never trips the LOW band.
        Stored as `source="edited"`. It never gates anything: declared intent,
        not authorization.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnvelopeInput"
      responses:
        "200":
          description: Envelope stored; body is the saved envelope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
          headers:
            Api-Version:
              $ref: '#/components/headers/ApiVersion'
        "400":
          description: Levels are negative or do not ascend min <= mean <= high <= max.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        "404":
          description: No such actor/anchor.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Default"

        '413':
          $ref: '#/components/responses/PayloadTooLarge'
  /vendors/{vendor}/topics:
    parameters:
      - $ref: "#/components/parameters/VendorPath"
      - $ref: '#/components/parameters/ApiVersion'
    get:
      summary: List active topics for a vendor
      operationId: listTopics
      tags: [topics]
      responses:
