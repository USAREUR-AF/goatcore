  /vendors/{vendor}:
    parameters:
      - $ref: "#/components/parameters/VendorPath"
      - $ref: '#/components/parameters/ApiVersion'
    patch:
      summary: Update a vendor's display name
      operationId: updateVendor
      tags: [vendors]
      description: Today the only mutable field through this operation is `display_name`; approval is an operator action elsewhere.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVendorRequest"
      responses:
        "200":
          description: The updated vendor row.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"
