      description: |
        Default is **retire**: sets `retired_at` and keeps the row as an audit
        tombstone; the `(vendor, key_pattern)` slot stays occupied, so
        re-registering the same key is refused. With `purge=true` the row is
        hard-deleted together with its schema and code-example rows and the
        on-disk schema directory, and the slot is freed; the audit event is
        written before the deletion.
      parameters:
        - name: purge
          in: query
          required: false
