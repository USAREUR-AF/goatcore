            application/json:
              schema:
                $ref: "#/components/schemas/CreateVendorResponse"
          headers:
            Api-Version:
              $ref: '#/components/headers/ApiVersion'
        "200":
          description: Created, but the vendor was auto-approved and the ACL re-render failed; `note_to_share` carries the warning and the operator reconciles the ACL later.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateVendorResponse"
          headers:
            Api-Version:
              $ref: '#/components/headers/ApiVersion'
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: Operator key required.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        "409":
          description: Prefix already taken.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Default"

        '413':
          $ref: '#/components/responses/PayloadTooLarge'
    parameters:
