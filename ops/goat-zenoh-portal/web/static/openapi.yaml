openapi: 3.1.0
info:
  title: goat-zenoh-portal API
  version: "0.2.0"
  description: |
    Self-service portal + topic registry + message inspector for the
    Zenoh data fabric. This document covers the vendor, org, topic, schema,
    envelope, bulk, inspector and machine affiliation repair operations; the portal registers further
    routes (access, machines, slots, labels, budgets, admin) that are not
    documented here yet.

    **Base URL.** Every operation below is relative to the `/api` server
    entry, so `GET /vendors` is `GET https://<portal-host>/api/vendors`.

    **Authentication.** All operations except `GET /health` and the one-time
    org/vendor bundle downloads require an `Authorization: Bearer <key>`
    header. The operator key is provisioned at deploy time; per-vendor keys
    are issued once by `POST /vendors` and re-issued by `POST /vendors/{vendor}/rotate`.

    **Scope.** Vendor-scoped routes (`/vendors/{vendor}/topics/...`)
    accept either the operator key or the matching vendor's key. The
    server rejects cross-vendor access with `403`.

    **`org` is the rename target (ADR 1052).** Every `/vendors*` route
    has a behavior-identical `/orgs*` alias, and the bulk wire keys are
    dual-read/dual-emitted as `org` (preferred) + `vendor` (deprecated).
    `/vendors*` and the `vendor` keys are **deprecated** but fully
    supported during the migration window; prefer `org`. Not renamed: the
    cert URI-SAN scheme and the `affiliation.vendor` taxonomy enum value.

    **Wire format.** Request and response bodies are UTF-8 JSON unless
    noted (the topic export/import operations also speak YAML; the schema
    download is binary; the stream is Server-Sent Events). Responses honour
    `Accept-Encoding: gzip`; the server does not vary JSON output on the
    `Accept` header.

    **Errors.** Errors generated by the portal use an RFC 9457 problem details body,
    `Content-Type: application/problem+json; charset=utf-8`, with `type`,
    `title`, `status`, `detail`, `instance` (the request id, also sent as
    `X-Request-Id`) and the portal's short `code`. The nested `error`
    object earlier clients read is kept inside it and is deprecated. Unknown
    paths and wrong methods under `/api` are problems too. A `5xx` `detail`
    is a fixed sentence per `code`; the underlying fault is logged against
    the request id, never sent.

    **Versioning.** Portal-generated `/api` responses carry `Api-Version: 0.2.0`.
    Proxy-generated `429` responses do not carry this header.
    A request may send `Api-Version` to name the contract it expects; a
    different major version is refused with `400`
    (`unsupported_api_version`). No version appears in any path.

    **Rate limit: 50 requests per second per client address**, enforced by the
    reverse proxy in front of the portal. Exceeding it returns `429` (see the
    `RateLimited` response).

    **Caching.** Each read operation declares its cache headers below.
    `Cache-Control: private, no-cache` permits storage with revalidation.
    Successful JSON and export reads up to 1 MiB carry a strong `ETag` and answer
    `304` to a matching `If-None-Match`; larger responses stream without a
    validator. Schema downloads use their stored digest as the validator
    regardless of size and also honour `If-Modified-Since`. The event
    stream sends `Cache-Control: no-cache`; one-time bundle downloads
    send `Cache-Control: no-store`.

    **Limits.** Schema upload limit: 1 MiB (1048576 bytes); a larger upload is
    refused with `413`. Every JSON request body is capped at 1 MiB (1048576
    bytes) and refused with `413` past it; string fields carry the
    `maxLength` shown on their schemas and an import holds at most 1000
    topics.
  contact:
    name: goat fabric operator
    url: /docs.html
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: /api
    description: This goatnet's portal (production, preprod or dev, whichever host serves this document); every path below is appended to /api.
  - url: http://127.0.0.1:8090/api
    description: Local dev (portal run from source on the developer machine)
security:
  - bearerAuth: []

tags:
  - name: machines
    description: Operator recovery of machine affiliation records.
  - name: meta
    description: Liveness and version.
  - name: orgs
    description: Org registration and listing (the rename target for vendors, ADR 1052).
  - name: vendors
    description: Vendor registration, rotation and listing (deprecated aliases of the org routes).
  - name: topics
    description: Topic CRUD per vendor or org.
  - name: schemas
    description: Schema versions attached to topics, and the compiled-schema download.
  - name: envelopes
    description: Declared per-actor throughput envelopes (ADR 1045).
  - name: bulk
    description: Bulk import and export of a vendor's topic set.
  - name: inspector
    description: Live message read-through against the Zenoh REST plugin.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: portal-api-key
      description: |
        Operator key, provisioned at deploy time by the fabric operator, for
        full admin, or a per-vendor key issued once by `POST /vendors` for
        vendor-scoped routes. A lost vendor key is
        replaced by `POST /vendors/{vendor}/rotate`, which issues a fresh one.

  parameters:
    VendorPath:
      name: vendor
      in: path
      required: true
      description: Vendor prefix (per-vendor goatnets) or the slot anchor / slot_id (per-uuid-slot-pool goatnets).
      schema:
        type: string
        example: homemade-sensors
    TopicId:
      name: id
      in: path
      required: true
      description: Numeric topic id as returned by the topic listing.
      schema:
        type: integer
        format: int64
        example: 42
    BundleToken:
      name: token
      in: path
      required: true
      description: One-time bundle token from the `bundle_url` of the mint or rotate response.
      schema:
        type: string
        example: example-bundle-token
    KeyExpr:
      name: key
      in: query
      required: true
      description: Zenoh key expression to read, for example `homemade-sensors/garage/temperature/v1` or a wildcard such as `homemade-sensors/**`.
      schema:
        type: string
        example: homemade-sensors/garage/temperature/v1

    ApiVersion:
      name: Api-Version
      in: header
      required: false
      description: The contract version the client expects. Only the major version is compared; a different major is refused with `400`.
      schema:
        type: string
        example: 0.2.0
  responses:
    Default:
      description: Any other failure, including `401` (missing or invalid bearer), `403` (wrong scope or operator-only), `400` (`unsupported_api_version`) and `500`. Body is a `Problem`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadRequest:
      description: The request body or parameters could not be decoded or failed validation (`code` is `decode` or `validate`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: No such vendor, topic or schema.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: |
        Too many requests. The reverse proxy in front of the portal answers this
        when a client exceeds 50 requests per second; the body is a `Problem`
        served by the fabric's problem-page service, never by the portal, and
        `Retry-After` says how long to wait. The fabric-wide ceiling in front
        of every service answers `429` in plain text.
      headers:
        Retry-After:
          description: Seconds to wait before retrying; the limiter period.
          schema:
            type: integer
            example: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:goat:portal:problem:rate_limited
            title: Too Many Requests
            status: 429
            detail: too many requests from this client address; wait one second and retry
            code: rate_limited
            error:
              code: rate_limited
              message: too many requests from this client address; wait one second and retry
    PayloadTooLarge:
      description: The request body passed 1 MiB (`code` is `payload_too_large`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotModified:
      description: The representation the client holds (`If-None-Match`) is current; no body.
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
        Api-Version:
          $ref: '#/components/headers/ApiVersion'
  schemas:
    AffiliationRepairRequest:
      type: object
      required: [from, to, reason]
      properties:
        from:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
          description: Exact stored spellings explicitly verified to represent the target organization. All other spellings in the comparison group must be selected.
          example: [Unit Alpha]
        to:
          type: string
          minLength: 1
          description: Approved target spelling; trimmed and normalized to NFC. All source spellings must share its nonempty folded comparison value.
          example: unit-alpha
        reason:
          type: string
          minLength: 1
          description: Nonblank operator justification, recorded in the audit event.
          example: Organization owner verified the legacy spelling.
        apply:
          type: boolean
          default: false
          description: False previews without writes. True requires expected_revision from a reviewed preview.
          example: false
        expected_revision:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Required only for apply and refused for preview. Binds the mapping and all records in the comparison group.
          example: b166abf7132327a367277d69281a922a3a5dd8c8c2174188881bbc89b4b0897d
      example:
        from: [Unit Alpha]
        to: unit-alpha
        reason: Organization owner verified the legacy spelling.
        apply: false
    AffiliationRepairRow:
      type: object
      required: [kind, id, affiliation]
      properties:
        kind:
          type: string
          enum: [grant, slot]
          description: Type of registry record selected for repair.
          x-enumDescriptions:
            grant: A custodian's machine quota grant.
            slot: A machine slot, including historical slots.
          example: grant
        id:
          type: string
          description: Custodian key for a grant or slot identifier for a slot.
          example: example-custodian
        affiliation:
          type: string
          description: Exact stored spelling before repair.
          example: Unit Alpha
      example:
        kind: grant
        id: example-custodian
        affiliation: Unit Alpha
    AffiliationRepairResult:
      type: object
      required: [from, to, revision, rows, grants, slots, applied]
      properties:
        from:
          type: array
          description: Exact source spellings selected for this repair.
          items:
            type: string
          example: [Unit Alpha]
        to:
          type: string
          description: Normalized target organization spelling.
          example: unit-alpha
        revision:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Revision of the reviewed state before application.
          example: b166abf7132327a367277d69281a922a3a5dd8c8c2174188881bbc89b4b0897d
        rows:
          type: array
          description: Records selected for repair, with their spellings before application.
          items:
            $ref: '#/components/schemas/AffiliationRepairRow'
          example:
            - kind: grant
              id: example-custodian
              affiliation: Unit Alpha
            - kind: slot
              id: example-slot
              affiliation: Unit Alpha
        grants:
          type: integer
          minimum: 0
          description: Number of machine quota grant records selected for repair.
          example: 1
        slots:
          type: integer
          minimum: 0
          description: Number of machine slot records selected for repair.
          example: 1
        applied:
          type: boolean
          description: Whether the repair and its audit event committed; false for a preview.
          example: false
        audit_id:
          type: integer
          minimum: 1
          description: Present only after the updates and audit event commit together.
          example: 42
      example:
        from: [Unit Alpha]
        to: unit-alpha
        revision: b166abf7132327a367277d69281a922a3a5dd8c8c2174188881bbc89b4b0897d
        rows:
          - kind: grant
            id: example-custodian
            affiliation: Unit Alpha
          - kind: slot
            id: example-slot
            affiliation: Unit Alpha
        grants: 1
        slots: 1
        applied: false
    Problem:
      type: object
      description: RFC 9457 problem details, the body of every error response.
      required:
        - type
        - title
        - status
        - code
        - error
      properties:
        type:
          type: string
          format: uri
          description: 'URN naming the problem class: `urn:goat:portal:problem:<code>`.'
          example: urn:goat:portal:problem:auth
          maxLength: 128
        title:
          type: string
          description: The HTTP reason phrase.
          example: Unauthorized
          maxLength: 64
        status:
          type: integer
          format: int32
          description: The HTTP status code, repeated in the body.
          example: 401
        detail:
          type: string
          description: What went wrong, for the operator or vendor. On a `5xx` a fixed sentence per `code`.
          example: missing bearer token
          maxLength: 1024
        instance:
          type: string
          description: The request id (`rq-` and 16 URL-safe base64 characters), the same value as the `X-Request-Id` response header; quote it when reporting a fault.
          example: rq-Z0b1kQ3xWv9tL2pM
          maxLength: 64
        code:
          type: string
          description: Machine-readable error class, for example `auth`, `decode`, `validate`, `notfound`, `exists`, `conflict`, `format_mismatch`, `payload_too_large`, `unsupported_api_version`, `zenoh`, `db`.
          example: auth
          maxLength: 64
        error:
          type: object
          description: 'The envelope earlier clients parse: the same `code` and the same message as `detail`. Kept for compatibility; read the top-level members instead.'
          required: [code, message]
          properties:
            code:
              type: string
              description: Machine-readable error class, for example `auth`, `decode`, `validate`, `notfound`, `exists`, `conflict`, `format_mismatch`, `too_large`, `zenoh`, `db`.
              example: auth
              maxLength: 64
            message:
              type: string
              description: Human-readable detail for the operator or vendor.
              example: missing bearer token
              maxLength: 1024
          deprecated: true
      example:
        type: urn:goat:portal:problem:auth
        title: Unauthorized
        status: 401
        detail: missing bearer token
        instance: rq-Z0b1kQ3xWv9tL2pM
        code: auth
        error:
          code: auth
          message: missing bearer token
    HealthProblem:
      type: object
      description: 'The 503 liveness record: the problem members plus the health members, so a probe and a person read the same body.'
      required:
        - type
        - title
        - status
        - code
        - error
        - health
        - registry
        - version
        - uptime
      properties:
        type:
          type: string
          format: uri
          description: URN naming the problem class.
          example: urn:goat:portal:problem:registry_unavailable
          maxLength: 128
        title:
          type: string
          description: The HTTP reason phrase.
          example: Service Unavailable
          maxLength: 64
        status:
          type: integer
          format: int32
          description: The HTTP status code, 503.
          example: 503
        detail:
          type: string
          description: A fixed sentence; the probe error is logged, not sent.
          example: registry probe failed
          maxLength: 1024
        instance:
          type: string
          description: The request id, the same value as `X-Request-Id`.
          example: rq-Z0b1kQ3xWv9tL2pM
          maxLength: 64
        code:
          type: string
          description: Always `registry_unavailable`.
          example: registry_unavailable
          maxLength: 64
        error:
          type: object
          description: 'The envelope earlier clients parse: the same `code` and the same message as `detail`. Kept for compatibility; read the top-level members instead.'
          required: [code, message]
          properties:
            code:
              type: string
              description: Machine-readable error class, for example `auth`, `decode`, `validate`, `notfound`, `exists`, `conflict`, `format_mismatch`, `too_large`, `zenoh`, `db`.
              example: auth
              maxLength: 64
            message:
              type: string
              description: Human-readable detail for the operator or vendor.
              example: missing bearer token
              maxLength: 1024
          deprecated: true
        health:
          type: string
          description: Always `unhealthy` here; the 200 record says `ok` in `status`.
          example: unhealthy
          maxLength: 16
        registry:
          type: string
          description: Always `unavailable` here.
          example: unavailable
          maxLength: 16
        reason:
          type: string
          description: The same fixed sentence as `detail`.
          example: registry probe failed
          maxLength: 1024
        version:
          type: string
          description: Portal build version string as compiled into the binary (not the version of this document).
          example: "0.1.0"
          maxLength: 32
        uptime:
          type: string
          description: Time since the process started, as a Go duration string.
          example: 7m38.4s
          maxLength: 64
        sunset:
          type: string
          description: Trial sunset date if one is configured; empty otherwise.
          example: ""
        legacy_vendor_surface_hits:
          type: integer
          format: int64
          description: Number of requests to the deprecated `/vendors*` routes since boot (the ADR 1052 phase-4 removal gate).
          example: 12
        api_key_bcrypt_compares:
          type: integer
          format: int64
          description: Internal convergence counter for API-key storage, a count of authentications since boot; 0 once every key has converged.
          example: 0
        api_key_digest_awaiting:
          type: integer
          format: int64
          description: Internal convergence counter, the number of vendor rows not yet converged; omitted when the count itself fails.
          example: 0
        operator_keys_shadowed:
          type: integer
          format: int64
          description: Number of operator handles whose directory key is overridden by an env key (#1351). Revoking those handles in the console has no effect until the env pin is removed. The handles are named in the portal startup log, not here.
          example: 0
      example:
        type: urn:goat:portal:problem:registry_unavailable
        title: Service Unavailable
        status: 503
        detail: registry probe failed
        instance: rq-Z0b1kQ3xWv9tL2pM
        code: registry_unavailable
        error:
          code: registry_unavailable
          message: registry probe failed
        health: unhealthy
        registry: unavailable
        reason: registry probe failed
        version: 0.2.0
        uptime: 7m38.4s
        sunset: ''
        legacy_vendor_surface_hits: 12
        api_key_bcrypt_compares: 0
    Health:
      type: object
      description: Liveness record on 200. The 503 shape is `HealthProblem`.
      required: [status, registry, version, uptime]
      properties:
        status:
          type: string
          enum: [ok, unhealthy]
          description: Overall verdict of the probe.
          x-enumDescriptions:
            ok: The portal is up and its registry answered the probe (HTTP 200).
            unhealthy: The portal is up but the registry probe failed (HTTP 503).
          example: ok
          maxLength: 16
        registry:
          type: string
          enum: [ok, unavailable]
          description: Result of the registry probe (one 1-row read) this operation performs.
          x-enumDescriptions:
            ok: The 1-row read succeeded.
            unavailable: The read failed or timed out after 3 seconds.
          example: ok
          maxLength: 16
        reason:
          type: string
          description: Present only when unhealthy; what the probe failed on.
          example: "registry probe failed: database is locked"
        version:
          type: string
          description: Portal build version string as compiled into the binary (not the version of this document).
          example: "0.1.0"
          maxLength: 32
        uptime:
          type: string
          description: Time since the process started, as a Go duration string.
          example: 7m38.4s
          maxLength: 64
        sunset:
          type: string
          description: Trial sunset date if one is configured; empty otherwise.
          example: ""
        legacy_vendor_surface_hits:
          type: integer
          format: int64
          description: Number of requests to the deprecated `/vendors*` routes since boot (the ADR 1052 phase-4 removal gate).
          example: 12
        api_key_bcrypt_compares:
          type: integer
          format: int64
          description: Internal convergence counter for API-key storage, a count of authentications since boot; 0 once every key has converged.
          example: 0
        api_key_digest_awaiting:
          type: integer
          format: int64
          description: Internal convergence counter, the number of vendor rows not yet converged; omitted when the count itself fails.
          example: 0
        operator_keys_shadowed:
          type: integer
          format: int64
          description: Number of operator handles whose directory key is overridden by an env key (#1351). Revoking those handles in the console has no effect until the env pin is removed. The handles are named in the portal startup log, not here.
          example: 0
      example:
        status: ok
        registry: ok
        version: "0.2.0"
        uptime: 7m38.4s
        sunset: ""
        legacy_vendor_surface_hits: 12
        api_key_bcrypt_compares: 0
        api_key_digest_awaiting: 0
        operator_keys_shadowed: 0

    Vendor:
      type: object
      description: One registered vendor (org) row.
      required: [prefix, display_name, approved, synthetic, created_at]
      properties:
        prefix:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{0,30}[a-z0-9]?$"
          maxLength: 32
          description: Lowercase identifier; becomes the top-level Zenoh namespace.
          example: homemade-sensors
        display_name:
          type: string
          description: Human-readable name shown in the portal and panoscope.
          example: Homemade Sensors GmbH
          maxLength: 200
        approved:
          type: boolean
          description: Whether the operator has approved the vendor (approval gates ACL rendering).
          example: true
        synthetic:
          type: boolean
          description: |
            Operator-managed demo / illustrative vendor (e.g. the synth-vendor
            demo publishers under caracal / community / homemade-sensors /
            pangolin). UI badges these; panoscope offers a 'Hide synthetic'
            toggle that filters them out of the visualization. Real partner
            vendors register with synthetic=false.
          example: true
        created_at:
          type: integer
          format: int64
          description: Registration time, Unix epoch seconds.
          example: 1756380000
      example:
        prefix: homemade-sensors
        display_name: Homemade Sensors GmbH
        approved: true
        synthetic: true
        created_at: 1756380000

    VendorList:
      type: object
      description: The vendor (org) listing, dual-emitted under both keys during the ADR 1052 migration window.
      required: [orgs, vendors]
      properties:
        orgs:
          type: array
          description: The org listing (ADR 1052 rename target). Same rows as `vendors`.
          items:
            $ref: "#/components/schemas/Vendor"
        vendors:
          type: array
          deprecated: true
          description: Deprecated alias of `orgs`; dual-emitted during the migration window.
          items:
            $ref: "#/components/schemas/Vendor"
      example:
        orgs:
          - prefix: homemade-sensors
            display_name: Homemade Sensors GmbH
            approved: true
            synthetic: true
            created_at: 1756380000
        vendors:
          - prefix: homemade-sensors
            display_name: Homemade Sensors GmbH
            approved: true
            synthetic: true
            created_at: 1756380000

    EnvelopeInput:
      type: object
      description: |
        The editable eight throughput numbers (ADR 1045). Each axis must
        ascend min <= mean <= high <= max and be non-negative; min = 0 declares a
        legitimately bursty/event-driven actor.
      required: [min_msgs_per_s, mean_msgs_per_s, high_msgs_per_s, max_msgs_per_s, min_bytes_per_s, mean_bytes_per_s, high_bytes_per_s, max_bytes_per_s]
      properties:
        min_msgs_per_s:
          type: number
          description: Floor of expected operation in messages per second; below it is the LOW fault band.
          example: 0
        mean_msgs_per_s:
          type: number
          description: Typical steady-state rate in messages per second.
          example: 2
        high_msgs_per_s:
          type: number
          description: Upper edge of normal in messages per second.
          example: 10
        max_msgs_per_s:
          type: number
          description: Ceiling in messages per second; beyond it is OVER (a flood).
          example: 50
        min_bytes_per_s:
          type: number
          description: Floor of expected operation in bytes per second.
          example: 0
        mean_bytes_per_s:
          type: number
          description: Typical steady-state throughput in bytes per second.
          example: 512
        high_bytes_per_s:
          type: number
          description: Upper edge of normal in bytes per second.
          example: 4096
        max_bytes_per_s:
          type: number
          description: Ceiling in bytes per second; beyond it is OVER.
          example: 65536
        class_key:
          type: string
          description: Optional provenance label naming the class baseline the numbers came from (e.g. C2); display only.
          example: C2
      example:
        min_msgs_per_s: 0
        mean_msgs_per_s: 2
        high_msgs_per_s: 10
        max_msgs_per_s: 50
        min_bytes_per_s: 0
        mean_bytes_per_s: 512
        high_bytes_per_s: 4096
        max_bytes_per_s: 65536
        class_key: C2

    Envelope:
      type: object
      description: A stored throughput envelope, the eight declared numbers plus the anchor and provenance the registry keeps.
      required: [anchor, source, min_msgs_per_s, mean_msgs_per_s, high_msgs_per_s, max_msgs_per_s, min_bytes_per_s, mean_bytes_per_s, high_bytes_per_s, max_bytes_per_s]
      properties:
        anchor:
          type: string
          description: Write anchor (vendor prefix / slot anchor) the envelope keys on.
          example: homemade-sensors
        source:
          type: string
          enum: [default, edited]
          description: Where the numbers came from.
          x-enumDescriptions:
            default: Rough class-baseline placeholder assigned at registration.
            edited: Set by the registering party or the operator through PUT /vendors/{vendor}/envelope.
          example: edited
          maxLength: 16
        min_msgs_per_s:
          type: number
          description: Floor of expected operation in messages per second; below it is the LOW fault band.
          example: 0
        mean_msgs_per_s:
          type: number
          description: Typical steady-state rate in messages per second.
          example: 2
        high_msgs_per_s:
          type: number
          description: Upper edge of normal in messages per second.
          example: 10
        max_msgs_per_s:
          type: number
          description: Ceiling in messages per second; beyond it is OVER (a flood).
          example: 50
        min_bytes_per_s:
          type: number
          description: Floor of expected operation in bytes per second.
          example: 0
        mean_bytes_per_s:
          type: number
          description: Typical steady-state throughput in bytes per second.
          example: 512
        high_bytes_per_s:
          type: number
          description: Upper edge of normal in bytes per second.
          example: 4096
        max_bytes_per_s:
          type: number
          description: Ceiling in bytes per second; beyond it is OVER.
          example: 65536
        class_key:
          type: string
          description: Provenance label naming the class baseline (e.g. C2); display only.
          example: C2
        created_at:
          type: integer
          format: int64
          description: When the envelope row was first written, Unix epoch seconds.
          example: 1756380000
        updated_at:
          type: integer
          format: int64
          description: When the envelope was last edited, Unix epoch seconds.
          example: 1756466400
      example:
        anchor: homemade-sensors
        source: edited
        min_msgs_per_s: 0
        mean_msgs_per_s: 2
        high_msgs_per_s: 10
        max_msgs_per_s: 50
        min_bytes_per_s: 0
        mean_bytes_per_s: 512
        high_bytes_per_s: 4096
        max_bytes_per_s: 65536
        class_key: C2
        created_at: 1756380000
        updated_at: 1756466400

    EnvelopeList:
      type: object
      description: Every stored envelope, keyed by anchor inside each row.
      required: [envelopes]
      properties:
        envelopes:
          type: array
          description: One row per actor that has an envelope.
          items:
            $ref: "#/components/schemas/Envelope"
      example:
        envelopes:
          - anchor: homemade-sensors
            source: edited
            min_msgs_per_s: 0
            mean_msgs_per_s: 2
            high_msgs_per_s: 10
            max_msgs_per_s: 50
            min_bytes_per_s: 0
            mean_bytes_per_s: 512
            high_bytes_per_s: 4096
            max_bytes_per_s: 65536
            class_key: C2
            created_at: 1756380000
            updated_at: 1756466400

    CreateVendorRequest:
      type: object
      description: Registration request for a new vendor (org).
      required: [prefix]
      properties:
        prefix:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{0,30}[a-z0-9]?$"
          maxLength: 32
          description: Lowercase identifier; becomes the top-level Zenoh namespace and the cert anchor.
          example: homemade-sensors
        display_name:
          type: string
          description: Human-readable name; defaults to the prefix when omitted.
          example: Homemade Sensors GmbH
          maxLength: 200
        auto_approve:
          type: boolean
          default: false
          description: Skip the operator-approval gate.
          example: false
        synthetic:
          type: boolean
          default: false
          description: |
            Mark this vendor as operator-managed demo / illustrative. UI shows
            a badge; panoscope can hide them via the 'Hide synthetic' toggle.
          example: false
        envelope:
          $ref: "#/components/schemas/EnvelopeInput"
          description: |
            Optional declared throughput envelope (ADR 1045). When present and
            valid, stored as the party's edited declaration; otherwise the
            actor gets the rough class-baseline default. Never gates
            registration.
        identity_id:
          type: string
          format: uuid
          maxLength: 36
          description: |
            Kratos identity UUID of the person this slot is onboarded FOR
            (per-uuid-slot-pool goatnets only). Recorded on the slot so
            ownership is a stored fact rather than something every consumer
            re-derives by matching names. A non-UUID is refused; omit it when
            no Ory identity exists and the slot keeps an honest "not recorded".
            A caller whose identity leg runs after the mint stamps it afterwards
            with PUT /slots/{anchor}/identity.
          example: 2f1b6c4e-7a3d-4e9b-9c1a-5d8e7f6a4b3c
      example:
        prefix: homemade-sensors
        display_name: Homemade Sensors GmbH
        auto_approve: true
        synthetic: true

    CreateVendorResponse:
      type: object
      description: The mint result. The same shape is returned by `POST /vendors` and by `POST /vendors/{vendor}/rotate`.
      required: [prefix, api_key, bundle_url, bundle_token, uri_san, approved, note_to_share]
      properties:
        prefix:
          type: string
          maxLength: 32
          description: The registered prefix (anchor).
          example: homemade-sensors
        api_key:
          type: string
          description: Bearer token for the vendor. Returned ONCE, only here. Treat like a password.
          example: example-vendor-key-shown-once
        bundle_url:
          type: string
          description: Single-use URL for the cert + key + root + onboarding-packet tarball.
          example: /api/org-bundle/homemade-sensors/example-bundle-token
        bundle_token:
          type: string
          description: The raw one-time token, so the operator can rebuild `bundle_url` if needed.
          example: example-bundle-token
        uri_san:
          type: string
          description: The URI-SAN minted into the vendor's certificate.
          example: "urn:goat:example:org=homemade-sensors"
        approved:
          type: boolean
          description: Whether the vendor is already approved (auto-approved or approval not required).
          example: true
        slot_id:
          type: string
          description: Assigned slot anchor (per-uuid-slot-pool goatnets only); the cert CN and write-namespace root.
          example: slot-017
        system_handle:
          type: string
          description: The human handle onboarded (slot alias). Slot-pool goatnets only.
          example: garage-gateway
        identity_id:
          type: string
          format: uuid
          maxLength: 36
          description: The person linkage recorded on the slot; absent when the request supplied none.
          example: 2f1b6c4e-7a3d-4e9b-9c1a-5d8e7f6a4b3c
        note_to_share:
          type: string
          description: Operator note (e.g. an ACL render warning). Empty when nothing to report.
          example: ""
      example:
        prefix: homemade-sensors
        api_key: example-vendor-key-shown-once
        bundle_url: /api/org-bundle/homemade-sensors/example-bundle-token
        bundle_token: example-bundle-token
        uri_san: "urn:goat:example:org=homemade-sensors"
        approved: true
        note_to_share: ""

    UpdateVendorRequest:
      type: object
      description: The editable vendor fields. Today only the display name is mutable through this operation.
      required: [display_name]
      properties:
        display_name:
          type: string
          description: New human-readable name; must be non-empty.
          example: Homemade Sensors AG
          maxLength: 200
      example:
        display_name: Homemade Sensors AG

    DeleteVendorWarning:
      type: object
      description: Returned with 200 when the registry row was deleted but the wire-layer revocation failed.
      required: [warning]
      properties:
        warning:
          type: string
          description: What failed and how to reconcile (re-run the DELETE).
          example: "registry-row deleted but wire-layer revocation failed: acl render: missing marker; re-run DELETE to reconcile"
      example:
        warning: "registry-row deleted but wire-layer revocation failed: acl render: missing marker; re-run DELETE to reconcile"

    Topic:
      type: object
      description: One registered topic row.
      required: [id, org_prefix, vendor_prefix, key_pattern, format, created_at]
      properties:
        id:
          type: integer
          format: int64
          description: Registry-assigned topic id; stable for the life of the row.
          example: 42
        org_prefix:
          type: string
          description: Org anchor (ADR 1052 rename target). Same value as `vendor_prefix`; dual-emitted.
          example: homemade-sensors
          maxLength: 32
        vendor_prefix:
          type: string
          deprecated: true
          description: Deprecated alias of `org_prefix`.
          example: homemade-sensors
          maxLength: 32
        key_pattern:
          type: string
          description: Exact Zenoh key expression the producer publishes to. Must start with `<vendor_prefix>/<system>/...`.
          example: homemade-sensors/garage/temperature/v1
          maxLength: 512
        format:
          type: string
          description: |
            One of `json`, `cbor`, `msgpack`, `text`, `raw`,
            `protobuf:<MessageName>` or `xml:<RootElement>`. The inspector
            dispatches decode by this string.
          example: json
          maxLength: 32
        schema_ref:
          type: string
          description: Pointer into `attest/schema/<vendor>/<system>/.../v<N>`. Optional but encouraged for protobuf topics.
          example: attest/schema/homemade-sensors/garage/temperature/v1
          maxLength: 512
        description:
          type: string
          description: Free-text purpose of the topic.
          example: Garage temperature, one reading per minute.
          maxLength: 2000
        publish_to_storage:
          type: boolean
          description: Whether zenohd's storage_manager retains this topic for replay (today informational).
          example: false
        publish_count:
          type: integer
          format: int64
          description: Publishes observed on this topic since registration.
          example: 1280
        last_seen_at:
          type: integer
          format: int64
          nullable: true
          description: Last observed publish, Unix epoch seconds; null when never seen.
          example: 1756466400
        created_at:
          type: integer
          format: int64
          description: Registration time, Unix epoch seconds.
          example: 1756380000
        retired_at:
          type: integer
          format: int64
          nullable: true
          description: Retirement time, Unix epoch seconds; null while active.
          example: null
      example:
        id: 42
        org_prefix: homemade-sensors
        vendor_prefix: homemade-sensors
        key_pattern: homemade-sensors/garage/temperature/v1
        format: json
        schema_ref: ""
        description: Garage temperature, one reading per minute.
        publish_to_storage: false
        publish_count: 1280
        last_seen_at: 1756466400
        created_at: 1756380000
        retired_at: null

    TopicList:
      type: object
      description: The active topics under one vendor.
      required: [topics]
      properties:
        topics:
          type: array
          description: Active (non-retired) topic rows, oldest first.
          items:
            $ref: "#/components/schemas/Topic"
      example:
        topics:
          - id: 42
            org_prefix: homemade-sensors
            vendor_prefix: homemade-sensors
            key_pattern: homemade-sensors/garage/temperature/v1
            format: json
            schema_ref: ""
            description: Garage temperature, one reading per minute.
            publish_to_storage: false
            publish_count: 1280
            last_seen_at: 1756466400
            created_at: 1756380000
            retired_at: null

    CreateTopicRequest:
      type: object
      description: Registration request for a topic under the vendor in the path.
      required: [key_pattern, format]
      properties:
        key_pattern:
          type: string
          description: Exact Zenoh key expression the producer publishes to. Must start with `<vendor_prefix>/<system>/...`.
          example: homemade-sensors/garage/temperature/v1
          maxLength: 512
        format:
          type: string
          description: Payload format string (`json`, `cbor`, `msgpack`, `text`, `raw`, `protobuf:<MessageName>`, `xml:<RootElement>`).
          example: json
          maxLength: 32
        schema_ref:
          type: string
          description: Optional pointer into `attest/schema/<vendor>/<system>/.../v<N>`.
          example: attest/schema/homemade-sensors/garage/temperature/v1
          maxLength: 512
        description:
          type: string
          description: Free-text purpose of the topic.
          example: Garage temperature, one reading per minute.
          maxLength: 2000
        publish_to_storage:
          type: boolean
          default: false
          description: Ask zenohd's storage_manager to retain this topic for replay (today informational).
          example: false
      example:
        key_pattern: homemade-sensors/garage/temperature/v1
        format: json
        description: Garage temperature, one reading per minute.

    UpdateTopicRequest:
      type: object
      description: All fields optional; only present fields are applied (PATCH semantics). At least one field must be present; an empty object is refused with `400`.
      properties:
        format:
          type: string
          nullable: true
          description: New payload format string; changing it against an uploaded schema whose root symbol no longer matches is refused with 422.
          example: protobuf:Reading
          maxLength: 32
        schema_ref:
          type: string
          nullable: true
          description: New pointer into `attest/schema/...`.
          example: attest/schema/homemade-sensors/garage/temperature/v2
          maxLength: 512
        description:
          type: string
          nullable: true
          description: New free-text purpose.
          example: Garage temperature, one reading per 30 seconds.
          maxLength: 2000
        publish_to_storage:
          type: boolean
          nullable: true
          description: New retention flag.
          example: true
      example:
        description: Garage temperature, one reading per 30 seconds.

      minProperties: 1
    SchemaEntry:
      type: object
      description: One topic_schemas row. Persisted `format` is `protobuf-fds` (a `protobuf-source` upload is compiled to a FileDescriptorSet on ingress) or `xsd` (an XML Schema Definition, persisted verbatim).
      required: [id, topic_id, version, format, size_bytes, sha256, uploaded_at, fetch_url]
      properties:
        id:
          type: integer
          format: int64
          description: Registry-assigned schema row id.
          example: 7
        topic_id:
          type: integer
          format: int64
          description: The topic this schema version belongs to.
          example: 42
        version:
          type: string
          description: Version label supplied at upload (defaults to `v1`).
          example: v1
        compatibility:
          type: string
          enum: [none, backward, forward, full]
          description: Declared compatibility promise relative to the previous version.
          x-enumDescriptions:
            none: No promise; consumers pin a version.
            backward: New readers can read old messages.
            forward: Old readers can read new messages.
            full: Both backward and forward.
          example: backward
          maxLength: 16
        format:
          type: string
          enum: [protobuf-fds, xsd]
          description: Persisted format of the schema body.
          x-enumDescriptions:
            protobuf-fds: A compiled protobuf FileDescriptorSet (either uploaded as such or compiled from `.proto` source on ingress).
            xsd: An XML Schema Definition document, persisted verbatim.
          example: protobuf-fds
          maxLength: 32
        size_bytes:
          type: integer
          format: int64
          description: Size in bytes of the persisted schema body (compiled FileDescriptorSet or .xsd).
          example: 2048
        sha256:
          type: string
          maxLength: 64
          minLength: 64
          description: Hex SHA-256 of the persisted schema body.
          example: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
        uploaded_at:
          type: integer
          format: int64
          description: Upload time, Unix epoch seconds.
          example: 1756380000
        uploaded_by:
          type: string
          description: Principal that uploaded it (`operator` or the vendor prefix).
          example: homemade-sensors
        fetch_url:
          type: string
          description: Relative URL to fetch the compiled bytes (`GET /api/schemas/{key}?version=...`).
          example: /api/schemas/homemade-sensors/garage/temperature/v1?version=v1
      example:
        id: 7
        topic_id: 42
        version: v1
        compatibility: backward
        format: protobuf-fds
        size_bytes: 2048
        sha256: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
        uploaded_at: 1756380000
        uploaded_by: homemade-sensors
        fetch_url: /api/schemas/homemade-sensors/garage/temperature/v1?version=v1

    SchemaList:
      type: object
      description: The schema versions recorded for one topic, newest first.
      required: [schemas]
      properties:
        schemas:
          type: array
          description: Schema rows, newest first.
          items:
            $ref: "#/components/schemas/SchemaEntry"
      example:
        schemas:
          - id: 7
            topic_id: 42
            version: v1
            compatibility: backward
            format: protobuf-fds
            size_bytes: 2048
            sha256: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
            uploaded_at: 1756380000
            uploaded_by: homemade-sensors
            fetch_url: /api/schemas/homemade-sensors/garage/temperature/v1?version=v1

    BulkFile:
      type: object
      description: The export/import document; the same shape round-trips through both operations.
      required: [topics]
      properties:
        org:
          type: string
          description: >-
            Org (anchor) prefix. When present must match the URL anchor.
            The rename target (ADR 1052); dual-read with `vendor` on import,
            dual-emitted with `vendor` on export.
          example: homemade-sensors
          maxLength: 32
        vendor:
          type: string
          deprecated: true
          description: >-
            Deprecated alias of `org` (ADR 1052). Still accepted on import and
            emitted on export during the deprecation window; prefer `org`.
          example: homemade-sensors
          maxLength: 32
        topics:
          type: array
          description: The topic set, one entry per key_pattern.
          items:
            $ref: "#/components/schemas/BulkTopic"
          maxItems: 1000
      example:
        org: homemade-sensors
        vendor: homemade-sensors
        topics:
          - key_pattern: homemade-sensors/garage/temperature/v1
            format: json
            description: Garage temperature, one reading per minute.
            publish_to_storage: false

    BulkTopic:
      type: object
      description: One topic in a bulk document.
      required: [key_pattern, format]
      properties:
        key_pattern:
          type: string
          description: Exact Zenoh key expression; the upsert key together with the vendor.
          example: homemade-sensors/garage/temperature/v1
          maxLength: 512
        format:
          type: string
          description: Payload format string.
          example: json
          maxLength: 32
        schema_ref:
          type: string
          description: Optional pointer into `attest/schema/...`.
          example: ""
          maxLength: 512
        description:
          type: string
          description: Free-text purpose.
          example: Garage temperature, one reading per minute.
          maxLength: 2000
        publish_to_storage:
          type: boolean
          default: false
          description: Retention flag.
          example: false
      example:
        key_pattern: homemade-sensors/garage/temperature/v1
        format: json
        description: Garage temperature, one reading per minute.
        publish_to_storage: false

    ImportDiff:
      type: object
      description: What an import did, or would do when `dry_run=true`.
      required: [org, vendor, dry_run, mode, entries, summary]
      properties:
        org:
          type: string
          description: Org anchor (ADR 1052 rename target).
          example: homemade-sensors
          maxLength: 32
        vendor:
          type: string
          deprecated: true
          description: Deprecated alias of `org`; dual-emitted.
          example: homemade-sensors
          maxLength: 32
        dry_run:
          type: boolean
          description: True when nothing was applied.
          example: false
        mode:
          type: string
          enum: [additive, replace]
          description: The import mode that was applied.
          x-enumDescriptions:
            additive: Create new and update existing topics; topics absent from the file are left alone.
            replace: Additionally retire topics that are in the registry but not in the file.
          example: additive
          maxLength: 16
        entries:
          type: array
          description: One row per key_pattern the import touched or considered.
          items:
            $ref: "#/components/schemas/ImportDiffEntry"
        summary:
          type: object
          description: Count of entries per action, keyed by the action name.
          additionalProperties:
            type: integer
          example:
            create: 1
            unchanged: 3
      example:
        org: homemade-sensors
        vendor: homemade-sensors
        dry_run: false
        mode: additive
        entries:
          - key_pattern: homemade-sensors/garage/humidity/v1
            action: create
        summary:
          create: 1
          unchanged: 3

    ImportDiffEntry:
      type: object
      description: One key_pattern's outcome in an import.
      required: [key_pattern, action]
      properties:
        key_pattern:
          type: string
          description: The topic key expression.
          example: homemade-sensors/garage/humidity/v1
          maxLength: 512
        action:
          type: string
          enum: [create, update, unchanged, retire]
          description: What happened (or would happen) to this topic.
          x-enumDescriptions:
            create: The topic did not exist and was registered.
            update: The topic existed and at least one field changed.
            unchanged: The topic existed and matched the file.
            retire: The topic was in the registry but not in the file (replace mode only).
          example: create
          maxLength: 16
      example:
        key_pattern: homemade-sensors/garage/humidity/v1
        action: create

    Sample:
      type: object
      description: One value read from the Zenoh REST plugin.
      required: [key, value]
      properties:
        key:
          type: string
          description: The concrete key the sample was published on.
          example: homemade-sensors/garage/temperature/v1
        value:
          type: [object, array, string, number, boolean, "null"]
          description: The payload as JSON when decodable, otherwise a string.
          example:
            celsius: 21.4
        encoding:
          type: string
          description: Zenoh encoding of the payload, when the plugin reported one.
          example: application/json
        timestamp:
          type: string
          description: Zenoh timestamp of the publish, when present. An NTP64 time (seconds since the Unix epoch as 32.32 fixed point) and the publisher id, separated by a slash.
          example: 7412345678901234567/AB12CD34
        source:
          type: string
          description: The peer or storage the sample came from, when reported.
          example: storage
      example:
        key: homemade-sensors/garage/temperature/v1
        value:
          celsius: 21.4
        encoding: application/json

    LatestResult:
      type: object
      description: The last value(s) at a key expression.
      required: [samples, key]
      properties:
        samples:
          type: array
          description: Matching samples, one per concrete key; empty when nothing has been published.
          items:
            $ref: "#/components/schemas/Sample"
        key:
          type: string
          description: The key expression that was queried.
          example: homemade-sensors/garage/temperature/v1
      example:
        samples:
          - key: homemade-sensors/garage/temperature/v1
            value:
              celsius: 21.4
            encoding: application/json
        key: homemade-sensors/garage/temperature/v1

    RecentResult:
      type: object
      description: Recent samples at a key expression from the storage-backed read.
      required: [samples, key, n]
      properties:
        samples:
          type: array
          description: Most recent samples, newest first.
          items:
            $ref: "#/components/schemas/Sample"
        key:
          type: string
          description: The key expression that was queried.
          example: homemade-sensors/garage/temperature/v1
        n:
          type: integer
          description: Count of samples requested (the effective `limit`).
          example: 20
      example:
        samples:
          - key: homemade-sensors/garage/temperature/v1
            value:
              celsius: 21.4
            encoding: application/json
        key: homemade-sensors/garage/temperature/v1
        n: 20

  headers:
    ApiVersion:
      description: The contract version this portal serves.
      schema:
        type: string
        example: 0.2.0
    ETag:
      description: Strong validator of this representation (the gzip coding carries its own tag). Send it back as `If-None-Match`.
      schema:
        type: string
        example: '"ZhE0mK8rJ2QkT6uHc1yA3w"'
    CacheControl:
      description: 'Always `private, no-cache`: a browser may keep the body but must revalidate before reusing it.'
      schema:
        type: string
        example: private, no-cache
    NoStore:
      description: The response contains credentials and must not be stored by a cache.
      schema:
        type: string
        example: no-store
    Vary:
      description: The response differs per bearer, so caches key on `Authorization` (and `Accept-Encoding`).
      schema:
        type: string
        example: Authorization, Accept-Encoding
paths:
  /machines/affiliation/repair:
    parameters:
      - $ref: '#/components/parameters/ApiVersion'
    post:
      summary: Preview or repair approved legacy affiliation spellings
      operationId: repairMachineAffiliation
      tags: [machines]
      description: |
        Requires an operator bearer for both preview and apply. Source spellings
        match exactly. Preview returns the affected grants and slots without writes.
        Apply rechecks the preview revision and updates only affiliation in both
        tables, including historical slots, with one audit event in the same
        transaction. No credentials, quotas or custody fields change.
        A lost response requires inspection of the audit and a fresh preview;
        the client must not automatically retry application.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AffiliationRepairRequest'
      responses:
        '200':
          description: Read-only preview or committed repair receipt.
          headers:
            Api-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AffiliationRepairResult'
        '400':
          description: Invalid mapping, missing fields, omitted variant, absent source or invalid revision (invalid_affiliation_repair); malformed JSON uses bad_json.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The comparison group changed since preview (affiliation_repair_stale). Preview again before applying.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
