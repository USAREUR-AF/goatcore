      operationId: getHealth
      security: []
      tags: [meta]
      description: |
        Probes the registry (one 1-row read) rather than returning a constant, so
        a portal whose registry is missing, locked, or corrupt answers 503 instead
        of a healthy-looking `ok`. Suitable as a container healthcheck and a
        blackbox target.
      responses:
        "200":
          description: Portal is up and its registry is readable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
          headers:
