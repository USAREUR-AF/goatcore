            Api-Version:
              $ref: '#/components/headers/ApiVersion'
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Default"

  /vendors/{vendor}/topics/{id}/schemas:
    parameters:
      - $ref: "#/components/parameters/VendorPath"
      - $ref: "#/components/parameters/TopicId"
      - $ref: '#/components/parameters/ApiVersion'
    get:
      summary: List uploaded schema versions for a topic
      operationId: listTopicSchemas
      tags: [schemas]
      description: |
        Returns the schema-version rows recorded for this topic (newest
        first). Each row is the persisted FileDescriptorSet metadata
        (version, compatibility, format, byte size, uploaded_at). The
        compiled descriptor bytes themselves are fetched via
        `GET /schemas/{key}`.
      responses:
        "200":
          description: The schema versions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchemaList"
          headers:
            Api-Version:
              $ref: '#/components/headers/ApiVersion'
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Vary:
              $ref: '#/components/headers/Vary'
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Default"
        '304':
          $ref: '#/components/responses/NotModified'
    post:
      summary: Upload a schema for a topic (.fds, .proto source, or .xsd)
      operationId: uploadTopicSchema
      tags: [schemas]
      description: |
        Multipart upload of a schema body for this topic. Three input
        formats are accepted via the `format` field:

        - **`protobuf-fds`**: a pre-compiled binary `FileDescriptorSet`
          (the output of `protoc --descriptor_set_out=... --include_imports`).
        - **`protobuf-source`**: raw `.proto` **source text**. The portal
          compiles it to a `FileDescriptorSet` in-process (bufbuild
          protocompile) and persists it under the same on-disk layout, so
          the vendor needs **no local `protoc`**. Single-file source with
          no imports beyond the protobuf well-known types is supported;
          multi-file imports are not (upload a `.fds` for those). This is
          the path that closed F-158; prefer it for hand-authored schemas.
        - **`xsd`**: an XML Schema Definition document, for topics whose
          own `format` is `xml:<RootElement>`. Persisted verbatim; the
          portal validates on ingress that it is well-formed and declares a
          top-level `<xs:element name="<RootElement>">` matching the topic
          format (422 `format_mismatch` otherwise).

        Persisted `format` is `protobuf-fds` for the two protobuf paths
        (source is compiled on ingress) or `xsd`. The topic's own `format`
        field (`protobuf:<MsgName>` or `xml:<RootElement>`) selects the
        symbol the decoder/validator binds to.

        Upload limit: 1 MiB (1048576 bytes) for the schema body.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, format]
              properties:
                file:
                  type: string
                  format: binary
                  description: The `.fds` bytes, the `.proto` source text, or the `.xsd` document (at most 1 MiB).
                format:
                  type: string
                  enum: [protobuf-fds, protobuf-source, xsd]
                  default: protobuf-fds
                  description: How to interpret `file`.
                  x-enumDescriptions:
                    protobuf-fds: A pre-compiled FileDescriptorSet; persisted as-is.
                    protobuf-source: Raw `.proto` text; compiled on ingress and persisted as a FileDescriptorSet.
                    xsd: An XML Schema Definition; validated for well-formedness and root element, persisted verbatim.
                  example: protobuf-source
                version:
                  type: string
                  description: Schema version label (e.g. `v1`). Defaults to `v1`.
                  example: v1
                compatibility:
                  type: string
                  enum: [none, backward, forward, full]
                  default: none
                  description: Declared compatibility promise relative to the previous version.
                  x-enumDescriptions:
                    none: No promise; consumers pin a version.
                    backward: New readers can read old messages.
                    forward: Old readers can read new messages.
                    full: Both backward and forward.
                  example: backward
            example:
              format: protobuf-source
              version: v1
              compatibility: backward
      responses:
        "200":
          description: Uploaded (idempotent re-upload of identical content).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchemaEntry"
          headers:
            Api-Version:
              $ref: '#/components/headers/ApiVersion'
        "201":
          description: Uploaded (new version).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchemaEntry"
          headers:
            Api-Version:
              $ref: '#/components/headers/ApiVersion'
        "400":
          description: Invalid format, unparseable `.fds`, `.proto` compile error (protoc-style `file:line:col` message), or malformed multipart. A body that overruns the cap before the multipart parse completes is also reported here as `decode`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A schema with this version already exists for the topic with different content.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        "413":
          description: The schema body exceeds 1 MiB (1048576 bytes).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        "422":
          description: The `.xsd` does not declare the root element the topic's `format` names (`error.code` is `format_mismatch`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: The schema store is not configured on this portal.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: "#/components/responses/Default"

  /schemas/{key}:
    parameters:
      - name: key
        in: path
        required: true
        description: The topic `key_pattern` (catch-all path; slashes allowed), e.g. `acme/observations/v1`.
        schema:
          type: string
          example: homemade-sensors/garage/temperature/v1
      - $ref: '#/components/parameters/ApiVersion'
    get:
      summary: Fetch the compiled schema body for a topic by key
      operationId: fetchSchemaByKey
      tags: [schemas]
      description: |
        Resolves `key_pattern` to its topic and that topic's latest schema and
        returns the persisted bytes (a compiled `FileDescriptorSet`, or the
        `.xsd` document). `?version=vN` selects a specific version. This is
        the endpoint panoscope's decoder calls to decode a live topic's wire
        bytes. The response carries `Last-Modified` (the upload time),
        `Cache-Control: private, no-cache` and a strong `ETag` from the stored
        digest. A matching `If-None-Match` or current `If-Modified-Since`
        returns `304` without a body.
      parameters:
        - name: version
          in: query
          required: false
          description: Schema version label to fetch; the latest version when omitted.
          schema:
            type: string
            example: v1
      responses:
        "200":
          description: The schema bytes. `Content-Type` is `application/x-protobuf-descriptor-set` for protobuf and `application/octet-stream` otherwise.
          headers:
            Last-Modified:
              description: The schema version's upload time.
              schema:
                type: string
                example: Thu, 28 Aug 2025 12:00:00 GMT
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Schema-Version:
              description: The version label served.
              schema:
                type: string
                example: v1
            X-Schema-Format:
              description: The persisted format (`protobuf-fds` or `xsd`).
              schema:
                type: string
                example: protobuf-fds
            X-Schema-SHA256:
              description: Hex SHA-256 of the body.
              schema:
                type: string
                example: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
            Api-Version:
              $ref: '#/components/headers/ApiVersion'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
              examples:
                fds:
                  summary: A compiled FileDescriptorSet
                  description: Binary protobuf bytes as produced by `protoc --descriptor_set_out`; no textual example is possible.
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: No topic, or no schema uploaded for that key (or that version).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: The schema store is not configured on this portal.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: "#/components/responses/Default"

        '304':
          $ref: '#/components/responses/NotModified'
  /vendors/{vendor}/topics/export:
    parameters:
      - $ref: "#/components/parameters/VendorPath"
      - name: format
        in: query
        required: false
        description: Output document format.
        schema:
          type: string
          enum: [yaml, json]
          default: yaml
          x-enumDescriptions:
            yaml: "`application/yaml`, the default."
            json: "`application/json`."
          example: yaml
      - $ref: '#/components/parameters/ApiVersion'
    get:
      summary: Export this vendor's topic set as YAML or JSON
      operationId: exportTopics
      tags: [bulk]
      description: |
        Returns the full active topic set under `<vendor>` as a single
        file. `Content-Disposition: attachment` so browsers download
        it. Round-trips through `POST /import` cleanly.
      responses:
        "200":
          description: The topic set.
          headers:
            Content-Disposition:
              description: "`attachment; filename=\"<vendor>-topics.yaml\"` (or `.json`)."
              schema:
                type: string
                example: attachment; filename="homemade-sensors-topics.yaml"
            Api-Version:
              $ref: '#/components/headers/ApiVersion'
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Vary:
              $ref: '#/components/headers/Vary'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkFile"
            application/yaml; charset=utf-8:
              schema:
                $ref: "#/components/schemas/BulkFile"
        "400":
          description: "`format` is neither `yaml` nor `json`."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Default"

        '304':
          $ref: '#/components/responses/NotModified'
  /vendors/{vendor}/topics/import:
    parameters:
      - $ref: "#/components/parameters/VendorPath"
      - name: dry_run
        in: query
        required: false
        description: Compute the diff without applying it.
        schema:
          type: boolean
          default: false
          example: true
      - name: mode
        in: query
        required: false
        description: |
          `additive` (default): create new + update existing; leave
          topics absent from the file alone. `replace`: also retire
          topics that are in the registry but not in the file.
        schema:
          type: string
          enum: [additive, replace]
          default: additive
          x-enumDescriptions:
            additive: Create new and update existing topics; topics absent from the file are left alone.
            replace: Additionally retire topics that are in the registry but not in the file.
          example: additive
      - $ref: '#/components/parameters/ApiVersion'
    post:
      summary: Bulk-import this vendor's topic set
      operationId: importTopics
      tags: [bulk]
      description: |
        Upsert by `(vendor, key_pattern)`. Accepts YAML or JSON based
        on `Content-Type`; falls back to a YAML-then-JSON sniff when
        the header is missing.
      requestBody:
        required: true
        content:
          application/yaml:
            schema:
              $ref: "#/components/schemas/BulkFile"
          application/json:
            schema:
              $ref: "#/components/schemas/BulkFile"
      responses:
        "200":
          description: Applied (or computed, when `dry_run=true`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportDiff"
          headers:
            Api-Version:
              $ref: '#/components/headers/ApiVersion'
        "400":
          description: Unparseable body, unknown `mode`, an `org`/`vendor` key that does not match the URL anchor, or a row the registry refused (`error.code` names the failing step).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Default"

        '413':
          $ref: '#/components/responses/PayloadTooLarge'
  /topics/latest:
    get:
      summary: Last value for a key expression (single-shot read via Zenoh REST)
      operationId: readLatest
      tags: [inspector]
      parameters:
        - $ref: "#/components/parameters/KeyExpr"
      responses:
        "200":
          description: The last value(s); `samples` is empty when nothing has been published.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LatestResult"
          headers:
            Api-Version:
              $ref: '#/components/headers/ApiVersion'
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Vary:
              $ref: '#/components/headers/Vary'
        "400":
          description: "`key` is missing."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          description: The Zenoh REST plugin did not answer.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: "#/components/responses/Default"

        '304':
          $ref: '#/components/responses/NotModified'
    parameters:
      - $ref: '#/components/parameters/ApiVersion'
  /topics/recent:
    get:
      summary: Recent samples for a key expression (Zenoh REST storage-backed read)
      operationId: readRecent
      tags: [inspector]
      parameters:
        - $ref: "#/components/parameters/KeyExpr"
        - name: limit
          in: query
          required: false
          description: Maximum number of samples to return.
          schema:
            type: integer
            default: 20
            example: 20
      responses:
        "200":
          description: The most recent samples, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecentResult"
          headers:
            Api-Version:
              $ref: '#/components/headers/ApiVersion'
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Vary:
              $ref: '#/components/headers/Vary'
        "400":
          description: "`key` is missing."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          description: The Zenoh REST plugin did not answer.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: "#/components/responses/Default"

        '304':
          $ref: '#/components/responses/NotModified'
    parameters:
      - $ref: '#/components/parameters/ApiVersion'
  /topics/stream:
    get:
      summary: Server-Sent Events stream of new publishes for a key expression
      operationId: streamTopic
      tags: [inspector]
      description: |
        Holds the connection open and emits one `sample` event per publish,
        with a comment heartbeat every 15 seconds. Once the SSE headers are
        written, a failed upstream poll sends an `error` event and the stream
        carries on; there is no JSON error from that point.

        Authenticate with the `Authorization` header like every other route.
        `EventSource` cannot set it, so browser clients read the stream with
        `fetch`. Never put the key in the query string: proxies log it.
      parameters:
        - $ref: "#/components/parameters/KeyExpr"
      responses:
        "200":
          description: 'An event stream (`text/event-stream`) with `Cache-Control: no-cache`.'
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                event: sample
                data: {"key":"homemade-sensors/garage/temperature/v1","value":{"celsius":21.4},"encoding":"application/json"}

                : heartbeat
          headers:
            Api-Version:
              $ref: '#/components/headers/ApiVersion'
            Cache-Control:
              description: The stream requires revalidation and carries no ETag.
              schema:
                type: string
                example: no-cache
        "400":
          description: "`key` is missing."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        "409":
          description: >
            `stream_limit`: this org or slot key already holds the maximum
            number of live streams (`PORTAL_MAX_STREAMS_PER_PRINCIPAL`, default
            8; operators are exempt). Close one and retry. Not 429, which the
            proxy's errors middleware reserves.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: "#/components/responses/Default"

    parameters:
      - $ref: '#/components/parameters/ApiVersion'
  /org-bundle/{vendor}/{token}:
    parameters:
      - $ref: "#/components/parameters/VendorPath"
      - $ref: "#/components/parameters/BundleToken"
      - $ref: '#/components/parameters/ApiVersion'
    get:
      summary: One-time org bundle download (no bearer auth; token-gated)
      operationId: downloadOrgBundle
      description: >
        The rename target (ADR 1052) and behavior-identical alias of
        `/vendor-bundle/{vendor}/{token}`. New mints emit this org path;
        the legacy `/vendor-bundle` path is deprecated. The `{vendor}`
        path-param name is kept for now (param rename is the deferred cosmetic
        step). Token-gated; no bearer auth. The token is consumed on the first
        successful download, so the response is not cacheable.
      tags: [orgs]
      security: []
      responses:
        "200":
          description: The onboarding tarball.
          content:
            application/gzip:
              schema:
                type: string
                format: binary
              examples:
                bundle:
                  summary: A gzip tarball
                  description: Contains the vendor leaf cert, its private key, the root CA and the onboarding packet; binary, no textual example.
          headers:
            Api-Version:
              $ref: '#/components/headers/ApiVersion'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        "400":
          description: Vendor or token missing from the path.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        "404":
          description: Not found, or the token was already consumed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Default"

  /vendor-bundle/{vendor}/{token}:
    parameters:
      - $ref: "#/components/parameters/VendorPath"
      - $ref: "#/components/parameters/BundleToken"
      - $ref: '#/components/parameters/ApiVersion'
    get:
      summary: One-time vendor bundle download (deprecated; prefer /org-bundle)
      operationId: downloadVendorBundle
      description: >
        Deprecated alias of `/org-bundle/{vendor}/{token}` (ADR 1052).
        Still served for back-compat, and each hit increments
        `legacy_vendor_surface_hits` (the Phase-4 removal gate). The token is
        consumed on the first successful download, so the response is not cacheable.
      tags: [vendors]
      deprecated: true
      security: []
      responses:
        "200":
          description: The onboarding tarball.
          content:
            application/gzip:
              schema:
                type: string
                format: binary
              examples:
                bundle:
                  summary: A gzip tarball
                  description: Contains the vendor leaf cert, its private key, the root CA and the onboarding packet; binary, no textual example.
          headers:
            Api-Version:
              $ref: '#/components/headers/ApiVersion'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        "400":
          description: Vendor or token missing from the path.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        "404":
          description: Not found, or the token was already consumed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Default"
