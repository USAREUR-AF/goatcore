                $ref: "#/components/schemas/Topic"
          headers:
            Api-Version:
              $ref: '#/components/headers/ApiVersion'
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Topic with this key_pattern already exists (a retired row still occupies the slot).
          content:
