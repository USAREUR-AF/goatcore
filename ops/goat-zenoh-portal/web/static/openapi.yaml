    post:
      summary: Register a new vendor (operator-only)
      operationId: createVendor
      tags: [vendors]
      description: |
        Mints a per-vendor X.509 leaf, issues a portal API key, writes
        the vendor row, and appends an allow rule to the rendered
        Zenoh ACL. **The `api_key` field in the response is the only
        place this key appears**, so capture it now.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVendorRequest"
      responses:
        "201":
          description: Created.
