# Per-site canary instance of signal-federation-probe.
# Image built from Dockerfile in this directory + published to GHCR via CI.
# Site-specific values (CANARY_TARGET, CANARY_REMOTE_KEY) must be in .env;
# render via Ansible from per-site group_vars (see ops/ansible/roles/
# signal-federation-canary/).

services:
  signal-federation-canary:
    image: ${SIGNAL_FEDERATION_PROBE_IMAGE:-ghcr.io/usareur-af/signal-federation-probe:latest}
    container_name: signal-federation-canary
    restart: unless-stopped
    network_mode: host  # so localhost:10000 (signal-a on the same host) is reachable
    command:
      - --mode=canary
      - --target=${CANARY_TARGET:?set CANARY_TARGET in .env, e.g. localhost:10000}
      - --remote-key=${CANARY_REMOTE_KEY:?set CANARY_REMOTE_KEY in .env (a stable peer at the federation-peer site)}
      - --interval=${CANARY_INTERVAL:-60s}
      - --metrics-addr=${CANARY_METRICS_ADDR:-:9091}
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: "${CANARY_MEMORY:-64M}"
        reservations:
          memory: "${CANARY_MEMORY_RESERVATION:-16M}"
