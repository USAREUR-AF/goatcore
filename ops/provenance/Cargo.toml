# The provenance library and the ingress adapter of ADR 1251
# (docs/design/pod-carriage-and-provenance.md §3, §7.2, §7.3):
#   - goat-provenance/  per-sample provenance (`prov` v1): canonical JSON,
#                       sign/verify, signer certificates, the cache
#   - goat-ingress/     ingress adapter for keyless sources (ASTERIX over UDP)
#
# Own workspace, standalone until the crates/ workspace can take them; then
# goat-cli depends on goat-provenance for `goat pub --sign` and
# `goat sub --provenance`. zenoh pinned =1.10.2 per
# docs/design/zenoh-version-pinning.md.

[workspace]
resolver = "2"
members = ["goat-provenance", "goat-ingress"]

[profile.release]
# IO-bound service: thin LTO buys nothing measurable at runtime.
lto = "thin"
codegen-units = 16
strip = true

# Finding F-614: the published zenoh-link-tls shares one TLS stream between
# its read and write tasks. The repository's patched copy fixes that, as in
# crates/Cargo.toml; every other zenoh crate stays on the published release.
[patch.crates-io]
zenoh-link-tls = { path = "../../vendor/zenoh-link-tls" }
