- verb: join-node
  phase: 13
  id: converge
  kind: A + GATE + SKIP + T
  title: converge the node's class
  what: Converges what the node's class runs. A core node at the founder site runs site-bootstrap. A joiner's core node first has the node and its founder checked for the replication declarations the wiring needs (spock-join-replication-declared.yml, read-only; GB-417), then bootstraps in three passes (without Spock, then a data-only seed from the founder, then with Spock), deploys Ory, wires the founder-side mirror and its own Spock wiring again, then turns on signal federation with its founder behind a gate, or prints a SKIP when the site declares it off. After signal federation, a joiner's core node mints its router and service leaves on this machine from the site's manifest (mint-site-certs.sh, which keeps a leaf already minted), stages the service leaves onto the node (stage-service-leaves.yml), then runs its own data router (zenoh-deploy.yml, limited to the node), so the site's fabric runs on its own router and not the founder's. A joiner that declares signal federation off gets its front door next, limited to the node, with traefik-acme.yml on an internet site (one whose dashboard_cert_delivery_mode is acme), lan-traefik-routes.yml on a LAN site. Then it runs each health publisher the end-state model (endstate.py model <site>) marks present at the site, its deploy play limited to the node; a model that cannot be read is a SKIP line. Then, on a joiner's core node, it runs the site services the site's group_vars turn on, each limited to the node, namely the decoy layer (decoy-deploy.yml), the dead-man watcher (deadman-watch-deploy.yml) and the Traefik compression exporter (traefik-compression-metrics-deploy.yml); each ends at once where its switch is off, and the exporter with its switch off takes itself down. Next it runs the host services with a switch of their own, each limited to the node, namely the budget notifier (budget-notify-deploy.yml), the self-claims collector (names-collector-deploy.yml), the image substrate client (oci-substrate-deploy.yml) and the host network health publisher (host-net-publish-deploy.yml); each says in one line that its switch is off and ends where it is. Last, behind a gate that resolves the founder's management API token, it runs a mesh DNS replica of the goatnet's zone on the node and registers the site's own nameserver group, this replica first and the founder's second, through the founder's management (ADR 1235), so the site resolves the goatnet's names when it is cut off. On a joiner with no obs host of its own (has_obs_host not true), a last step runs the observability stack on the core node (obs.yml, limited to the node, grafana_enabled=false, since Grafana's OAuth2 client would be an identity-store write at a second site, gate rows I1 and I4), once the site's group_vars declare obs_colocated_site_zones; without it the step is a SKIP that names the declaration. An obs node gets its baseline and LUKS, its utility half (Forgejo; skipped on a joiner, whose state of record stays with the founder) and its monitoring stack. A breakglass or network-jump node gets its own play.
  why: The node is part of the site only once its class's services run and, for a joiner's core node, replicate both ways with the founder.
  changes: The node's services, and on a joiner's core node the site's leaves in the state directory on this machine, the staged service leaves on the node, its Zenoh router container, its front door's Traefik routes when signal federation is off, the health publishers' containers, the site services a site turns on, and on a single-host joiner the obs stack's containers under /opt/<site>-obs and the `monitoring` Postgres role; on a joiner, the founder's Spock subscriptions, its signal-federation proxy and its relays' backends, and the site's NetBird nameserver group `<site>-mesh-dns`.
  verify: each play ends `failed=0`; the signal-federation gate proves an offer forwarded and delivered both ways; on a joiner's core node, zenoh-deploy.yml and each health publisher's play end `failed=0` and the router's health probe answers on the node, and the mesh DNS play's smoke test resolves a name of the goatnet's zone on the node
  runs: ops/scripts/ansible-preflight.sh, ops/ansible/site-bootstrap.yml, ops/ansible/site-bootstrap-for.yml, ops/ansible/ory-deploy.yml, ops/scripts/check-site-play-current.py, ops/ansible/spock-join-replication-declared.yml, ops/ansible/site-seed-from-peer.yml, ops/ansible/spock-seed-current-check.yml, ops/ansible/spock-mesh-wire.yml, ops/scripts/signal-federation-check.py, ops/ansible/signal-federation-transport.yml, ops/ansible/traefik-acme.yml, ops/ansible/site-rathole-client.yml, ops/ansible/inventory/generate-relays.sh, ops/ansible/relay-ingress-add-site.yml, ops/ansible/signal-federation-verify.yml, ops/scripts/mint-site-certs.sh, ops/ansible/stage-service-leaves.yml, ops/ansible/zenoh-deploy.yml, ops/ansible/lan-traefik-routes.yml, ops/goatbuilder/endstate/endstate.py, ops/ansible/fabric-health-deploy.yml, ops/ansible/mesh-health-deploy.yml, ops/ansible/presence-health-deploy.yml, ops/ansible/time-health-deploy.yml, ops/ansible/consistency-health-deploy.yml, ops/ansible/fabric-crawler-deploy.yml, ops/ansible/decoy-deploy.yml, ops/ansible/deadman-watch-deploy.yml, ops/ansible/traefik-compression-metrics-deploy.yml, ops/ansible/budget-notify-deploy.yml, ops/ansible/names-collector-deploy.yml, ops/ansible/oci-substrate-deploy.yml, ops/ansible/host-net-publish-deploy.yml, ops/scripts/with-secrets, ops/scripts/require-secret.sh, ops/ansible/goat-coredns.yml, ops/ansible/obs.yml, ops/ansible/mgmt-host-baseline.yml, ops/ansible/tang-server.yml, ops/ansible/mgmt-host-luks.yml, ops/ansible/utility-host-bootstrap.yml (an assembled tree's play; goatcore has none), ops/ansible/obs-host-bootstrap.yml, ops/ansible/breakglass-nodes.yml, ops/ansible/herd-connector-deploy.yml (an assembled tree's play; goatcore has none)
  by_hand: goatbuilder join-node <env> --site <site> --node <node> --class <class> --address <address> --from 13 --to 13 --dry-run prints this phase's commands exactly as the run starts them; run each one from the repository root with bash -euo pipefail -c '<command>'
  read: docs/tutorials/02-first-federated-node.md#what-join-node-runs-for-a-joiners-core-machine
  failed_because: a pass of the bootstrap, the seed or the Spock wiring failed, or the signal-federation gate found the repository incomplete
  then: read the play's output, fix it; every pass is idempotent, so resume with --from 13
