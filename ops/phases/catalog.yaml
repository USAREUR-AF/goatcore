  phase: 1
  id: preflight
  kind: GATE
  title: the nominator, the candidate tag and the secrets
  what: 'Prints the component, its image and its three rungs, then checks that this checkout can run the candidate: the nominator holds admin on the repository (on the overlay repository, from an assembled tree), the repository runs rc-validate.yml, and the candidate tag is chosen (the next free rc number, unless --rc or --tag names one). Before anything is tagged it derives, for every rung the run deploys to, the variables the component''s play templates from this environment, and refuses when one is not set.'
  why: A release candidate is attributed to an admin, as rc-validate.yml enforces, and a tag cut on a repository that does not validate it, or for a deploy that will refuse for a missing secret, is a tag left behind for nothing.
  changes: Nothing; it only reads (git, the GitHub API, the pins and the plays).
  verify: it prints the nominator's role and `candidate tag <image>/vX.Y.Z-rc.N on main <sha>`, and a `secrets:` line per rung with every variable set
  runs: gh (api user, the collaborator permission, the rc-validate.yml workflow); goatbuilder deploy's plan for each rung's secrets
  by_hand: gh api repos/<owner>/<repo>/collaborators/<you>/permission -q .role_name, then goatbuilder deploy --component <component> --env <rung> --dry-run for each rung
  read: docs/design/release-candidate-validation.md#who-may-nominate
  failed_because: the nominator is not an admin, the repository does not run rc-validate.yml, or a variable the play templates is not set
  then: run as an admin of the repository it names, from a checkout whose origin is the primary repository; for secrets, set the variables it names (the note under the refusal says where their references live) and run the same command again
- verb: release
  phase: 2
  id: tag
  kind: T
  title: the candidate tag on main, its checks and its image
  what: Cuts the annotated tag <image>/vX.Y.Z-rc.N on origin/main and pushes it, or validates an existing tag as it is (--tag). It then waits for rc-validate.yml and the image workflow on the tag, and resolves the image's digest under the image namespace.
  why: The tag is what decides that the expensive tests run (ADR 1173), and the candidate is pinned by digest, so the same bytes are what every rung runs.
  changes: 'On origin: the tag. Nothing on a goatnet.'
  verify: '`rc-validate.yml: success` and the image workflow''s `success`, then `candidate ref ghcr.io/…:<tag>@sha256:…`'
  runs: git (tag, push), gh (run list, run watch, run view), ops/scripts/image-digest
  by_hand: git tag -a <image>/vX.Y.Z-rc.N origin/main -m '<message>' && git push origin <tag>; gh run watch <run> --exit-status; ops/scripts/image-digest <namespace>/<image>:<tag>
  read: docs/design/release-candidate-validation.md#the-tag
  failed_because: rc-validate deleted the tag (the pusher is not maintain or admin, or the commit is not on main), the image build failed, or no digest was found
  then: read the workflow run it names; fix on main and cut the next rc number
- verb: release
  phase: 3
  id: dev-pin
  kind: T
  title: the candidate on the dev rung, as a landed pin
  what: In a scratch worktree of origin/main, declares the candidate as the dev rung's deviation for the component, reconciles records the pin makes stale, regenerates the pins and intents, re-signs every intent whose body changed, runs the gates (promote check, pins --check), and lands the change as a pull request.
  why: 'A goatnet runs what its pins say, from main: the candidate reaches dev only as a declared, signed, reviewed deviation, never by a deploy of an unpinned ref.'
  changes: 'On main, through a merged pull request: ops/pins/fleet-pins.yaml (the dev deviation), the regenerated group_vars and intents, and their signatures.'
  verify: '`chore(pins): <dev> runs release candidate <tag>` lands; `goatbuilder pins --check` passes'
  runs: goatbuilder pins (regenerate, --check), ops/enrollment intent-sign, goatbuilder promote check, ops/scripts/pr-land.sh
  by_hand: goatbuilder release <component> --tag <tag> --from dev --ack '<name>' (from this step on)
  read: docs/design/release-candidate-validation.md#running-a-candidate-step-by-step
  failed_because: a gate refused (pins drift, a record check, a missing CA key) or the pull request did not land
  then: read the gate's line; for a CA key, run where the goatnet's root key is; then resume with --from dev
- verb: release
  phase: 4
  id: dev-deploy
  kind: T
  title: deploy the candidate to the dev rung
  what: Deploys the component to the dev rung with this binary's push converger, from the checkout now at the merged pin, and reads every host's ledger.
  why: The live rows that follow test the candidate only once every host of the rung runs it.
  changes: 'On the dev rung''s hosts: the component, at the candidate''s ref; the deploy ledger rows.'
  verify: the deploy's verify step names the candidate's ref on every host
  runs: goatbuilder deploy
  by_hand: goatbuilder deploy --component <component> --env <dev>
  read: docs/design/goatbuilder.md
  failed_because: a host did not converge or is unreachable
  then: read `goatbuilder explain deploy` for the failed step; resume with --from dev once the host is back
- verb: release
  phase: 5
  id: dev-rows
  kind: GATE
  title: the live acceptance rows on the dev rung
  what: Maps what the candidate changed to the live acceptance rows it affects (ops/validation/affected-flows.py, from flow-map.yaml) and runs them against the dev rung (ops/validation/run-acceptance.py), keeping the evidence file under ops/validation/evidence/. No row mapped means the evidence is the cheap suites only, and it says so.
  why: The candidate goes to preprod only on evidence from a live goatnet, for the flows its change touches.
  changes: 'In this checkout: the evidence file. Nothing on the goatnet beyond what the rows exercise.'
  verify: every row PASS, or `no live rows are mapped`
  runs: ops/validation/affected-flows.py, ops/validation/run-acceptance.py
  by_hand: python3 ops/validation/affected-flows.py --component <component> --head <tag> --json, then python3 ops/validation/run-acceptance.py for the rows it names
  read: docs/design/release-candidate-validation.md#which-flows-a-change-affects
  failed_because: 'a live row FAILED on dev: the candidate is dead'
  then: fix on main and cut the next rc number (delete the tag); resume with --from rows only to re-run the rows
- verb: release
  phase: 6
  id: preprod
  kind: T
  title: the candidate record, the preprod rung, its deploy and rows
  what: Opens the candidate record with the dev evidence (or reuses the open record when preprod already runs the tag), abandons other open ladder candidates it supersedes, declares the preprod deviation, regenerates, re-signs and lands it; then deploys to preprod, runs the affected live rows there, records the convergence evidence, runs promote check and lands the evidence.
  why: Preprod is the rung the soak runs on; the record carries the evidence graduation reads, and one record per ref keeps promote check honest.
  changes: 'On main, through merged pull requests: the record under ops/release/records/<component>/, the preprod deviation, regenerated pins and intents, the evidence. On the preprod rung: the component at the candidate''s ref.'
  verify: both pull requests land; the preprod rows PASS; `goatbuilder promote check` passes
  runs: goatbuilder promote (open, abandon, check), goatbuilder pins, ops/enrollment intent-sign, ops/scripts/pr-land.sh, goatbuilder deploy, ops/validation/run-acceptance.py
  by_hand: goatbuilder release <component> --tag <tag> --from preprod --ack '<name>' (or --from preprod-rows when preprod already runs the tag)
  read: docs/design/release-candidate-validation.md#evidence-and-the-ladder
  failed_because: a gate refused, a pull request did not land, a host did not converge, or a live row FAILED on preprod after the dev PASS
  then: for a failed row, leave the candidate open and investigate (graduation refuses without convergence evidence); otherwise resume with --from preprod-rows
- verb: release
  phase: 7
  id: soak
  kind: MANUAL
  title: 'the soak: the prod command, and when it may run'
  what: Prints that the candidate is the preprod candidate, the soak's minimum days, and the exact command that graduates it after the soak with an operator's ack.
  why: Production waits a declared soak on preprod; graduation is an operator's act, never automatic (ADR 1177).
  changes: Nothing.
  verify: it prints `goatbuilder release <component> --tag <tag> --from prod --ack '<name>'`
  runs: 'nothing it starts: it reads the soak minimum from the release records'' policy'
  by_hand: goatbuilder promote status shows the candidate and its soak
  read: docs/design/release-graduation.md
  failed_because: nothing fails here
  then: after the soak, an operator runs the printed command
- verb: release
  phase: 8
  id: prod
  kind: T
  title: graduate, fold into fleet:, deploy prod, read every rung
  what: 'With --from prod: graduates the record (refused until the soak gate is met), folds the candidate into fleet: and deletes the rung deviations that carried it, abandons hotfix records it supersedes, regenerates, re-signs and lands it; deploys prod, then reads every other rung''s ledger (a verify-only deploy) so every rung is shown to run the fleet value.'
  why: One fleet value on every rung is the end state the ladder exists to reach; reading each ledger proves it rather than assuming it.
  changes: 'On main, through a merged pull request: the record graduated, fleet: moved, the deviations deleted, pins and intents regenerated and re-signed. On the prod rung: the component at the fleet value.'
  verify: '`chore(release): <tag> graduates` lands; prod''s deploy and every rung''s ledger read name the fleet value'
  runs: goatbuilder promote (graduate, abandon), goatbuilder pins, ops/enrollment intent-sign, ops/scripts/pr-land.sh, goatbuilder deploy (and --verify-only for every rung)
  by_hand: goatbuilder release <component> --tag <tag> --from prod --ack '<name>'
  read: docs/design/release-graduation.md
  failed_because: graduation refused (the soak or a gate), the pull request did not land, or a rung's ledger does not name the fleet value
  then: read the refusal; for a ledger, deploy that rung with goatbuilder deploy --component <component> --env <rung>
- verb: fastlane
  phase: 1
  id: component
  kind: GATE
  title: the component, its role, its play, and a pin revert undoes it
  what: 'Reads the component''s declaration in the pins: refuses an unknown component (naming the known ones), one with no Ansible role under its ledger name, one with no deploy playbook, and one a pin revert cannot undo (ADR 1127). With deploys on, it refuses a goatnet the component is on that declares the pull converger.'
  why: Fastlane skips the ladder, so it is allowed only where flipping the pin back is a complete rollback, and only through the component's own deploy path.
  changes: Nothing; it only reads ops/pins/fleet-pins.yaml and ops/ansible/.
  verify: it prints `current fleet ref:` and `ledger component:`
  runs: 'nothing it starts: it reads ops/pins/fleet-pins.yaml and ops/ansible/roles/'
  by_hand: goatbuilder preflight <component> --env <env> shows the component's rollout facts
  read: docs/design/fastlane.md#what-fastlane-is
  failed_because: the component is unknown, has no role or play, or is not cleanly reversible
  then: use the ladder (goatbuilder release) for a component a pin revert cannot undo
- verb: fastlane
  phase: 2
  id: graduation-set
  kind: GATE
  title: not a member of an open graduation set
  what: 'Refuses a component that belongs to an open graduation set: the set''s members move together (ADR 1125), and fastlane moves one component.'
  why: Moving one member of a set alone breaks the compatibility the set exists to keep.
  changes: Nothing.
  verify: it prints `not in an open set`
  runs: 'nothing it starts: it reads the graduation sets'
  by_hand: goatbuilder promote status
  read: docs/design/release-graduation.md
  failed_because: the component is in an open graduation set
  then: graduate the set normally
- verb: fastlane
  phase: 3
  id: digest
  kind: T
  title: the image digest the registry holds for the tag
  what: Derives the image from the current fleet ref and resolves the tag's digest through the GitHub packages API (every page), under the owner goatbuilder.yaml declares; a ref given with a digest must be the digest the registry holds. A release components ref is its whole pin, whose release is fetched and verified as deploy does (GB-381), and no registry is asked. It refuses a ref that is already the fleet value.
  why: The new fleet value is pinned by digest, and only to an image CI built from a merged commit.
  changes: Nothing.
  verify: 'it prints the digest (a release: `release verified: …`) and `new fleet ref: …@sha256:…`'
  runs: gh api (the organisation's container package versions)
  by_hand: gh api --paginate '/orgs/<owner>/packages/container/<image>/versions?per_page=100' --jq '.[]|select(.metadata.container.tags|index("<tag>"))|.name'
  read: docs/design/fastlane.md#the-floor-it-does-not-skip
  failed_because: gh is missing, the registry cannot be read, the tag is not built, or the digest given is not the registry's
  then: check that CI built the tag from a merged commit, and that this account can read the organisation's packages
- verb: fastlane
  phase: 4
  id: dry-run
  kind: GATE
  title: a dry run stops here, before any change
  what: 'With --dry-run the run stops here and prints what a real run would do: the fleet value it would set, the deviations it would clear and the ones it would keep (absent: true is topology), and the play it would deploy with. A real run passes through.'
  why: Every check that reads is done before anything is written, so a dry run shows a complete, refusal-free plan or the refusal itself.
  changes: Nothing.
  verify: it prints `would set`, `would clear deviations` and `would deploy via`
  runs: nothing it starts
  by_hand: goatbuilder fastlane <component> --ref <ref> --reason '<why>' --ack '<name>' --dry-run
  read: docs/design/fastlane.md#absent-true-survives--it-is-topology-not-skew
  failed_because: nothing fails here
  then: read the plan; run without --dry-run to ship it
- verb: fastlane
  phase: 5
  id: move-fleet
  kind: T
  title: 'fleet: moves to the new ref; pins and intents regenerated and re-signed'
  what: 'Sets the component''s fleet value to the new ref and clears its deviations except absent: true, recording the reason and the ack; regenerates the pins and intents; and re-signs every goatnet intent whose body changed with that goatnet''s root key.'
  why: Fastlane moves the value of record, not a deviation, so every goatnet runs the new ref and a pin revert restores the old one (fastlane.md, why fleet:).
  changes: 'In this checkout: ops/pins/fleet-pins.yaml, the regenerated group_vars and intents, and their signatures.'
  verify: '`wrote …` for each regenerated file and a signature for each changed intent'
  runs: goatbuilder pins (regenerate), ops/enrollment intent-sign
  by_hand: edit components.<component>.fleet in ops/pins/fleet-pins.yaml, then goatbuilder pins; cd ops/enrollment && go run ./cmd/intent-sign --intent <intent.json> --root-key <key>
  read: docs/design/fastlane.md#why-fleet-and-not-a-deviation
  failed_because: a goatnet's root key is not on this machine
  then: run where that goatnet's root key is (the refusal names the path it looked at)
- verb: fastlane
  phase: 6
  id: record-debt
  kind: T
  title: the hotfix record that owes a backfill; candidates it overtook abandoned
  what: Writes a hotfix record for the new ref, owing a backfill until it graduates normally, and abandons every open candidate record for the component whose ref this fastlane superseded.
  why: Skipping the ladder is a debt written as data, not a memory; a candidate whose ref no longer runs anywhere is closed with the reason.
  changes: 'In this checkout: the hotfix record and the abandoned records under ops/release/records/.'
  verify: '`hotfix record written` and an abandon line for each superseded record (or `none were open`)'
  runs: goatbuilder promote (hotfix, abandon)
  by_hand: goatbuilder promote hotfix <component> --ref <ref> --reason '<why>'; goatbuilder promote abandon <record> --reason '<why>' --superseded-by <ref>
  read: docs/design/fastlane.md#debt-is-written-as-data
  failed_because: an abandon was refused
  then: read the refusal; it names the record
- verb: fastlane
  phase: 7
  id: land
  kind: GATE
  title: the gates that still apply, then the pin PR lands
  what: Runs the gates that still apply (promote check, pins --check), then lands the pins, group_vars, intents and records as one pull request on a chore/fastlane branch, and returns this checkout to main at the merge.
  why: 'The ladder is skipped, the gates are not: the change lands on main through review like any other, and the deploys run from main.'
  changes: 'On main, through a merged pull request: the pins, group_vars, intents and records the steps before wrote.'
  verify: the pull request lands and the checkout is back on main at origin/main
  runs: goatbuilder promote check, goatbuilder pins --check, ops/scripts/pr-land.sh
  by_hand: goatbuilder promote check && goatbuilder pins --check; ops/scripts/pr-land.sh --worktree . --branch chore/fastlane-<component>-<tag> --title '<title>' --body-file <file> --paths ops/pins/fleet-pins.yaml ops/ansible/group_vars ops/consistency/intent ops/release/records
  read: docs/design/fastlane.md#the-floor-it-does-not-skip
  failed_because: a gate failed, the pins were already current, the pull request did not land, or the checkout could not return to main
  then: read the gate's line; when the pin landed but the checkout did not return, fast-forward it and deploy each goatnet with goatbuilder deploy
- verb: fastlane
  phase: 8
  id: deploy
  kind: A
  title: deploy to every goatnet the component belongs on
  what: Deploys the component to every goatnet it belongs on with this binary's push converger, reading each host's ledger, then prints the result. With --no-deploy it stops after the landing and prints the deploy command per goatnet.
  why: A fastlane is one command from a merged commit to every goatnet; the ledger read is the proof each one runs it.
  changes: 'On every goatnet the component belongs on: the component at the new ref; the deploy ledger rows.'
  verify: '`<component> is <tag> on every goatnet, ledger-verified`, or `NOT converged on:` naming each goatnet'
  runs: goatbuilder deploy
  by_hand: goatbuilder deploy --component <component> --env <goatnet> for each goatnet
  read: docs/design/fastlane.md#what-fastlane-is
  failed_because: a goatnet did not converge or is unreachable
  then: 'the pin is in main: re-run goatbuilder deploy for that goatnet once its hosts are reachable, or goatbuilder rollback <component>'
- verb: teardown
  phase: 2
  id: baseline
  kind: A
  title: 'phase 2: the host baseline is kept; the observability host''s Forgejo comes down'
  what: 'Takes down what standup''s phase 2 applied: the host baseline and LUKS are kept (the next standup reuses them), and on a site with an observability host its Forgejo comes down (compose-down, volumes kept). The observability host''s own baseline and utility steps are undeclared, so a full teardown that reaches them refuses.'
  why: 'Teardown takes a site down in the reverse of standup''s order, and only as far as it can without destroying data: each applied step comes down as ops/goatbuilder/teardown.yaml declares, and a step that holds data is refused rather than removed.'
  changes: 'On the observability host: Forgejo''s compose project stopped, volumes kept. Nothing on the core hosts.'
  verify: Forgejo's project lists no container (`docker compose ps -q`); a record in /var/lib/goat/forgejo/teardown.jsonl
  runs: ops/ansible/teardown-compose.yml
  by_hand: goatbuilder teardown <env> --site <site> --from 2 --to 2 [--services]
  read: docs/reference/goatbuilder/command-reference.md#goatbuilder-teardown
  failed_because: the stop failed on the host, or a reached step is undeclared or refused
  then: read the play's failed task; for an undeclared step, declare it in ops/goatbuilder/teardown.yaml or take it down by hand
- verb: teardown
  phase: 5
  id: mgmt-stack
  kind: A + GATE
  title: 'phase 5: the mgmt stack is refused; the relay client stops'
  what: 'Takes down what standup''s phase 5 applied: on an internet site the relay client (rathole-client) is stopped and disabled, its unit files kept; the mgmt stack itself is refused, because reversing it destroys the NetBird account and its database. A full teardown that reaches it refuses before touching anything; --services stops the relay client only.'
  why: 'Teardown takes a site down in the reverse of standup''s order, and only as far as it can without destroying data: each applied step comes down as ops/goatbuilder/teardown.yaml declares, and a step that holds data is refused rather than removed.'
  changes: 'On an internet site''s core host: the rathole-client unit stopped and disabled. Nothing else.'
  verify: no rathole-client unit is active; the verdict names the mgmt stack as refused
  runs: ops/ansible/teardown-systemd.yml
  by_hand: goatbuilder teardown <env> --site <site> --from 5 --to 5 [--services]
  read: docs/reference/goatbuilder/command-reference.md#goatbuilder-teardown
  failed_because: the mgmt stack is refused (data), or the unit stop failed
  then: take the mgmt stack down by hand, knowing it destroys the account; or run with --services to stop the services only
- verb: teardown
  phase: 6
  id: ory
  kind: GATE
  title: 'phase 6: the identity stack and the account seed are refused'
  what: Standup's phase 6 builds the identity store (Ory) and seeds the NetBird account (on a joiner, also the Spock wiring and the data-only copy from the founder). Reversing any of it destroys identities or replicated data, so teardown refuses each (and the joiner's wiring steps are undeclared). A full teardown that reaches phase 6 refuses before touching anything.
  why: 'Teardown takes a site down in the reverse of standup''s order, and only as far as it can without destroying data: each applied step comes down as ops/goatbuilder/teardown.yaml declares, and a step that holds data is refused rather than removed.'
  changes: Nothing.
  verify: the verdict names each phase 6 step as refused or undeclared
  runs: 'nothing it starts: it reads ops/goatbuilder/teardown.yaml'
  by_hand: goatbuilder teardown <env> --site <site> --from 6 --to 6 [--services]
  read: docs/reference/goatbuilder/command-reference.md#goatbuilder-teardown
  failed_because: a reached step is refused (data) or undeclared
  then: take the identity stack down by hand, knowing what it destroys; --services leaves it in place
- verb: teardown
  phase: 7
  id: public-tls
  kind: GATE
  title: 'phase 7: the certificate is kept; the relay tier is refused'
  what: 'Takes down what standup''s phase 7 applied on an internet site: the public TLS certificate is kept, and the relay tier (coturn, rathole, TLS renewal) is refused, because other sites'' links run through it; a joiner''s relay-ingress wiring is undeclared. A full teardown that reaches it refuses.'
  why: 'Teardown takes a site down in the reverse of standup''s order, and only as far as it can without destroying data: each applied step comes down as ops/goatbuilder/teardown.yaml declares, and a step that holds data is refused rather than removed.'
  changes: Nothing.
  verify: the verdict names the relay tier as refused
  runs: 'nothing it starts: it reads ops/goatbuilder/teardown.yaml'
  by_hand: goatbuilder teardown <env> --site <site> --from 7 --to 7 [--services]
  read: docs/reference/goatbuilder/command-reference.md#goatbuilder-teardown
  failed_because: the relay tier is refused, or a joiner's step is undeclared
  then: take the relay tier down by hand once no other site depends on it; --services leaves it in place
- verb: teardown
  phase: 8
  id: mesh-enroll
  kind: GATE
  title: 'phase 8: the enrolment is kept'
  what: 'Standup''s phase 8 enrols the hosts in the mesh with single-use keys. Teardown keeps the enrolment: the hosts stay peers, and the next standup reuses them.'
  why: 'Teardown takes a site down in the reverse of standup''s order, and only as far as it can without destroying data: each applied step comes down as ops/goatbuilder/teardown.yaml declares, and a step that holds data is refused rather than removed.'
  changes: Nothing.
  verify: the step reads `keep`
  runs: 'nothing it starts: it reads ops/goatbuilder/teardown.yaml'
  by_hand: goatbuilder teardown <env> --site <site> --from 8 --to 8 [--services]
  read: docs/reference/goatbuilder/command-reference.md#goatbuilder-teardown
  failed_because: nothing fails here
  then: remove a host from the mesh by hand in NetBird when it is retired
- verb: teardown
  phase: 9
  id: router
  kind: A + GATE
  title: 'phase 9: the router and SPIRE stop; signal federation is refused'
  what: 'Takes down what standup''s phase 9 applied: the zenoh router comes down (compose-down, volumes kept), the SPIRE server stops in its shared compose project, and on a site with an observability host its stack (Prometheus, Alertmanager, Grafana) comes down. Signal federation''s steps (tokens, proxies, relays, tunnels) are refused, because the other site''s half depends on them.'
  why: 'Teardown takes a site down in the reverse of standup''s order, and only as far as it can without destroying data: each applied step comes down as ops/goatbuilder/teardown.yaml declares, and a step that holds data is refused rather than removed.'
  changes: 'On the core hosts: the zenoh router''s project stopped and the SPIRE service stopped, containers and volumes kept. On the observability host: its stack stopped, volumes kept.'
  verify: the router's and the obs stack's projects list no container; no SPIRE container runs; a record per component in teardown.jsonl
  runs: ops/ansible/teardown-compose.yml, ops/ansible/teardown-service-stop.yml
  by_hand: goatbuilder teardown <env> --site <site> --from 9 --to 9 [--services]
  read: docs/reference/goatbuilder/command-reference.md#goatbuilder-teardown
  failed_because: a stop failed, or signal federation is refused
  then: read the play's failed task; take signal federation down by hand at both sites, together
- verb: teardown
  phase: 10
  id: surfaces
  kind: A + GATE
  title: 'phase 10: the dashboard stops; the OIDC clients are refused'
  what: 'Takes down what standup''s phase 10 applied: the NetBird dashboard stops in its shared compose project. The OIDC clients are refused (they are identity data), and a LAN site''s service surface and TLS routes are undeclared.'
  why: 'Teardown takes a site down in the reverse of standup''s order, and only as far as it can without destroying data: each applied step comes down as ops/goatbuilder/teardown.yaml declares, and a step that holds data is refused rather than removed.'
  changes: 'On the core host: the dashboard service stopped, container and volumes kept.'
  verify: no dashboard container runs; a record in teardown.jsonl
  runs: ops/ansible/teardown-service-stop.yml
  by_hand: goatbuilder teardown <env> --site <site> --from 10 --to 10 [--services]
  read: docs/reference/goatbuilder/command-reference.md#goatbuilder-teardown
  failed_because: the stop failed, or a reached step is refused or undeclared
  then: read the play's failed task; take the refused or undeclared step down by hand
- verb: teardown
  phase: 12
  id: control-plane
  kind: A + GATE
  title: 'phase 12: the services stop; the declared ACL and the account baseline are refused'
  what: 'Takes down what standup''s phase 12 applied, in reverse: the portal, onboard-runner, the onboarding intake, the notional pub/sub, mesh CoreDNS and grant-keyd come down (compose-down, volumes kept), and the pub/sub state mirror is kept (it stops with the portal). The declared NetBird ACL and the account baseline are refused: reversing them changes who can reach whom, for every site. A joiner''s mesh CoreDNS replica is undeclared, so a full teardown that reaches it refuses.'
  why: 'Teardown takes a site down in the reverse of standup''s order, and only as far as it can without destroying data: each applied step comes down as ops/goatbuilder/teardown.yaml declares, and a step that holds data is refused rather than removed.'
  changes: 'On the core hosts: each service''s compose project stopped, volumes kept.'
  verify: each service's project lists no container; a record per component in teardown.jsonl
  runs: ops/ansible/teardown-compose.yml
  by_hand: goatbuilder teardown <env> --site <site> --from 12 --to 12 [--services]
  read: docs/reference/goatbuilder/command-reference.md#goatbuilder-teardown
  failed_because: a stop failed, or the ACL or the account baseline is refused
  then: read the play's failed task; change the ACL through its declaration instead of tearing it down
- verb: teardown
  phase: 14
  id: cross-goatnet
  kind: T
  title: 'phase 14: the cross-goatnet surfaces are taken out'
  what: 'Runs ops/goatnets/cross-env-apply.sh --absent <site> on the operator machine, which redeploys every relay-health box without this site. It refuses while ops/goatnets/cross-env.yaml still lists the site: remove its row by pull request first. Not a service stop, so --services leaves it in place.'
  why: 'Teardown takes a site down in the reverse of standup''s order, and only as far as it can without destroying data: each applied step comes down as ops/goatbuilder/teardown.yaml declares, and a step that holds data is refused rather than removed.'
  changes: 'On every relay-health box: its overview, redeployed without this site.'
  verify: the site is gone from every relay-health overview
  runs: ops/goatnets/cross-env-apply.sh
  by_hand: 'goatbuilder teardown <env> --site <site> --from 14 --to 14 [--services]; by hand: ops/goatnets/cross-env-apply.sh --absent <site>'
  read: docs/reference/goatbuilder/command-reference.md#goatbuilder-teardown
  failed_because: the site is still listed in ops/goatnets/cross-env.yaml, or a box could not be redeployed
  then: remove the site's row from cross-env.yaml by pull request, then run it again
- verb: federate-backout
  phase: 1
  id: survey
  kind: GATE
  title: 'read every host of this peering: what exists, and the core''s candidate'
  what: 'Runs ops/ansible/peering-backout.yml read-only against every host of this peering: which of its resources exist on each, each found by the peering id and this peering''s own group values, and the core''s candidate configuration (the org fragment without this partner''s blocks, assembled by the core''s own assembler) with its digest. --dry-run stops after it and prints every resource it would remove, per host.'
  why: A back-out removes ONE peering and leaves every other one and the core as they were, so it first finds exactly what is this peering's.
  changes: Nothing; it only reads.
  verify: a per-host list of present and absent resources, and the core's candidate digest
  runs: ops/ansible/peering-backout.yml (ops/scripts/with-aws, ops/scripts/ansible-preflight.sh)
  by_hand: goatbuilder federate backout <partner> [--env <env>] [--edge-group <edge-group>] [--work <work>] --dry-run
  read: docs/operations/sovereign-federation-runbook.md#step-9-as-one-command
  failed_because: a host is unreachable, or a resource cannot be told apart from another peering's
  then: 'reach the host, or read the refusal: it names the resource and why it is not this peering''s'
- verb: federate-backout
  phase: 2
  id: confirm
  kind: CONFIRM
  title: a person types the partner id
  what: Asks a person to type the partner's id before anything changes; --yes answers it without a terminal, and without a terminal and without --yes the back-out is refused (C10).
  why: Removing a peering cuts a partner off; it happens only on a person's word.
  changes: Nothing.
  verify: the typed id matches the partner; otherwise `not confirmed; nothing was changed`
  runs: nothing it starts
  by_hand: goatbuilder federate backout <partner> [--env <env>] [--edge-group <edge-group>] [--work <work>] (at a terminal), or the same with --yes
  read: docs/operations/sovereign-federation-runbook.md#step-9-as-one-command
  failed_because: the id typed is not the partner's
  then: run it again and type the partner's id exactly
- verb: federate-backout
  phase: 3
  id: remove
  kind: A
  title: remove the tunnel, SPIRE trust, edge router, republisher and forwarder mapping
  what: 'Runs ops/ansible/peering-backout.yml with peering_backout_apply=true: each role''s own tasks/absent.yml removes this peering''s tunnel, its SPIRE trust domain and forwards, its edge router, its republisher and its forwarder mapping, and nothing of any other peering''s.'
  why: 'The partner is cut off at our edge first: it takes effect at once and needs no cooperation from them (the runbook''s Step 9).'
  changes: 'On this peering''s edge, core and forwarder hosts: this peering''s resources removed.'
  verify: a second survey finds each of them absent
  runs: ops/ansible/peering-backout.yml
  by_hand: goatbuilder federate backout <partner> [--env <env>] [--edge-group <edge-group>] [--work <work>] --yes
  read: docs/operations/sovereign-federation-runbook.md#step-9-as-one-command
  failed_because: a role's absent task failed
  then: read the play's failed task; running the back-out again is safe, it removes only what is still there
- verb: federate-backout
  phase: 4
  id: recheck
  kind: GATE
  title: the slot list against the registry, before the core restarts
  what: Immediately before the core router restarts, checks the slot list against the registry (ops/scripts/sync-slot-anchors.py), as the admission path does, and refuses the restart when they disagree (GB-223).
  why: A core restart on a stale slot list would drop or mis-route another peering's slots.
  changes: Nothing.
  verify: the slot recheck passes
  runs: ops/scripts/sync-slot-anchors.py
  by_hand: python3 ops/scripts/sync-slot-anchors.py (as the back-out runs it, in check mode)
  read: docs/operations/sovereign-federation-runbook.md#step-9-as-one-command
  failed_because: the slot list and the registry disagree
  then: regenerate and commit the slot list, then run the back-out again; the edge side is already removed
- verb: federate-backout
  phase: 5
  id: core
  kind: A
  title: the reviewed core candidate, the restart, and the partner's store
  what: Installs the reviewed core candidate and restarts the core router, refused when the core's digest changed since the survey. On a core configured from roles/goat-zenoh, it also takes the partner out of the role's list, restarts the router without the partner's store, and then drops that store whole (ADR 1234, ops/ansible/zenoh-drop-partner-store.yml).
  why: The core must stop admitting the partner and stop holding its data; the digest check means the core changed only as reviewed.
  changes: 'On the core host: the router''s configuration without this partner, the router restarted, the partner''s store directory deleted. In the checkout: the role''s peerings list without the partner, for review.'
  verify: the core runs the candidate digest; a second survey finds the partner's store absent
  runs: ops/ansible/peering-backout.yml (peering_backout_core_apply), ops/ansible/zenoh-drop-partner-store.yml
  by_hand: goatbuilder federate backout <partner> [--env <env>] [--edge-group <edge-group>] [--work <work>] --yes
  read: docs/operations/sovereign-federation-runbook.md#step-9-as-one-command
  failed_because: the core's digest changed since the survey, or the restart failed
  then: survey again (run the back-out again) and review the new candidate
- verb: federate-backout
  phase: 6
  id: directory
  kind: T
  title: withdraw our package for this counterparty
  what: Withdraws our package for this counterparty from the directory (/v1/parties/<us>/packages/<them>), with ops/federation/standup/directory_withdraw.py; our single entry and every other party's entry are never touched.
  why: Our package for them is how they would find us again; it goes, and nothing else does.
  changes: 'In the peering directory: our package for this counterparty removed.'
  verify: the directory no longer serves our package for them
  runs: ops/federation/standup/directory_withdraw.py
  by_hand: python3 ops/federation/standup/directory_withdraw.py (with the directory URL and our signing key)
  read: docs/operations/sovereign-federation-runbook.md#step-9-as-one-command
  failed_because: the directory could not be reached or refused the withdrawal
  then: run the back-out again once the directory answers; nothing else is redone
- verb: federate-backout
  phase: 7
  id: record
  kind: T
  title: the partner record leaves the checkout; survey again; the result
  what: Deletes the generated partner record (ops/federation/partners/<partner>.yaml) from the checkout, for review, then surveys again and writes <work>/backout/result.json with what was found before and after.
  why: The checkout must stop declaring the partner, and the result is the proof of what the back-out removed.
  changes: 'In the checkout: the partner record deleted (commit it through review). In the working directory: backout/result.json.'
  verify: the second survey finds every resource absent; result.json is written
  runs: ops/ansible/peering-backout.yml (the second survey)
  by_hand: goatbuilder federate backout <partner> [--env <env>] [--edge-group <edge-group>] [--work <work>] --yes; then commit the deleted partner record
  read: docs/operations/sovereign-federation-runbook.md#step-9-as-one-command
  failed_because: the second survey still finds a resource
  then: run the back-out again; it removes only what is still there
