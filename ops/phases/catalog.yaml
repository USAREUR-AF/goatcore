- verb: join-node
  phase: 13
  id: converge
  kind: A + GATE + SKIP
  title: converge the node's class
  what: Converges what the node's class runs. A core node at the founder site runs site-bootstrap. A joiner's core node bootstraps in three passes (without Spock, then a data-only seed from the founder, then with Spock), deploys Ory, wires the founder-side mirror and its own Spock wiring again, then turns on signal federation with its founder behind a gate, or prints a SKIP when the site declares it off. An obs node gets its baseline and LUKS, its utility half (Forgejo; skipped on a joiner, whose state of record stays with the founder) and its monitoring stack. A breakglass or network-jump node gets its own play.
  why: The node is part of the site only once its class's services run and, for a joiner's core node, replicate both ways with the founder.
  changes: The node's services; on a joiner, the founder's Spock subscriptions, its signal-federation proxy and its relays' backends.
  verify: each play ends `failed=0`; the signal-federation gate proves an offer forwarded and delivered both ways
  runs: ops/scripts/ansible-preflight.sh, ops/ansible/site-bootstrap.yml, ops/ansible/site-bootstrap-for.yml, ops/ansible/ory-deploy.yml, ops/ansible/site-seed-from-peer.yml, ops/ansible/spock-mesh-wire.yml, ops/scripts/signal-federation-check.py, ops/ansible/signal-federation-transport.yml, ops/ansible/traefik-acme.yml, ops/ansible/site-rathole-client.yml, ops/ansible/inventory/generate-relays.sh, ops/ansible/relay-ingress-add-site.yml, ops/ansible/signal-federation-verify.yml, ops/ansible/mgmt-host-baseline.yml, ops/ansible/tang-server.yml, ops/ansible/mgmt-host-luks.yml, ops/ansible/utility-host-bootstrap.yml (an assembled tree's play; goatcore has none), ops/ansible/obs-host-bootstrap.yml, ops/ansible/breakglass-nodes.yml, ops/ansible/herd-connector-deploy.yml (an assembled tree's play; goatcore has none)
  by_hand: goatbuilder join-node <env> --site <site> --node <node> --class <class> --address <address> --from 13 --to 13 --dry-run prints this phase's commands exactly as the run starts them; run each one from the repository root with bash -euo pipefail -c '<command>'
  read: docs/tutorials/02-first-federated-node.md#what-join-node-runs-for-a-joiners-core-machine
  failed_because: a pass of the bootstrap, the seed or the Spock wiring failed, or the signal-federation gate found the repository incomplete
  then: read the play's output, fix it; every pass is idempotent, so resume with --from 13
