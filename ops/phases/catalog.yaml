- verb: join-node
  phase: 1
  id: reach
  kind: GATE
  title: the node answers
  what: 'Before anything is done on the node, checks it answers: over SSH at --address (one batch-mode connection with this machine''s ssh, a 10 s connect timeout and no password prompt, the whole check bounded by JOIN_NODE_REACH_LIMIT, default 30 s; the node has answered when it logs in or when its own host key arrives, which ssh writes to a known_hosts file of the run''s own; a Jetson''s USB bridge address, 192.168.55.0/24, is refused), or for a phone node (--class phone --via usb) over the Android debug bridge (`adb get-state` says device). A login that the node refuses still counts as an answer: before phase 2 seeds this machine''s key, a node that takes only its first-login password refuses every batch login, so phase 1 cannot prove a login and phase 2 does. The run goes on to phase 2; it stops only when the node does not answer (GB-314), with the step for a person.'
  why: Every later phase reaches the node at this address or over this cable; a wrong address makes the baseline and enrolment act on another machine or none, and a node that does not answer would fail later with less said.
  changes: 'Nothing on the node, and nothing in this machine''s known_hosts: the node''s host key goes to a temporary file, removed when the check ends. Phase 2''s ssh records it.'
  verify: '`ssh <user>@<address>` reaches the box on the site LAN; for a phone node, `adb devices` lists the phone as `device`'
  runs: ops/scripts/join-node-reach.sh
  by_hand: ops/scripts/join-node-reach.sh ssh <user>@<address> (or usb), then run goatbuilder join-node again with --from 1
  read: docs/tutorials/02-first-federated-node.md#run-it-on-your-hardware
  failed_because: the node does not answer at the address given, or no phone answers over USB
  then: 'reach the box on the site LAN (ssh <user>@<address>) and pass its real LAN address as --address; for a phone, attach it by USB, allow USB debugging, accept this machine''s key on its screen and unlock it; then resume with --from 1'
- verb: join-node
  phase: 2
  id: seed-key
  kind: T + GATE
  title: seed the SSH key
  what: 'Probes whether the node already takes key auth and passwordless sudo; when it does not, seeds the operator''s key and NOPASSWD sudo with the first-login password, read from its environment variable (<SITE>_NODE_PASS by default), never from the command line. For a phone node (--class phone) the phase prepares the phone''s Linux VM over the Android debug bridge instead: Debian''s kernel with its boot settings, Docker Engine, and the deploy user with key auth and passwordless sudo; a VM already prepared is left as it is. A gate then runs the integrity checks in the VM, and a check that fails stops the run (GB-300).'
  why: Every play after it reaches the node with key auth and sudo; a password prompt would stop them. A phone's VM that returns wrong file data must not have a node built on it.
  changes: 'The node''s authorized_keys and sudoers, when the probe fails; nothing when it passes. On a phone node not yet prepared: the kernel the VM boots, its boot settings, Docker Engine, the deploy user and the hostname, and the VM is restarted.'
  verify: 'it prints that key auth and NOPASSWD sudo already work, or the seed ends without error; for a phone node, the integrity checks print `integrity: ok`'
  runs: ops/scripts/seed-ssh-key.sh, ops/scripts/phone-node-provision.sh (a phone node)
  by_hand: goatbuilder join-node <env> --site <site> --node <node> --class <class> --address <address> --from 2 --to 2 --dry-run prints this phase's commands exactly as the run starts them; run each one from the repository root with bash -euo pipefail -c '<command>'
  read: docs/tutorials/02-first-federated-node.md#before-the-real-run
  failed_because: the first-login password is wrong or its variable is empty; for a phone node, no phone answers over the Android debug bridge (GB-299) or its VM failed an integrity check (GB-300)
  then: set the password variable (--pass-var names it), or for a phone node do what the code's entry says (goatbuilder explain GB-299, GB-300), then resume with --from 2
- verb: join-node
  phase: 3
  id: repo-work
  kind: GATE + T
  title: 'repo work first: group, inventory, pins, exclusions; then the node''s clock; a joiner''s secrets'
  what: 'Runs the config preflight on the node''s group before it enrols: the node is in the inventory group, the pins and exclusions are declared. The mesh-address placeholder is allowed until phase 12. Then reads the node''s clock from its own time service over ssh, read-only (chronyc -c tracking, else timedatectl show): it must be synchronized to an outside reference and, where chrony gives an offset, within the budget (JOIN_NODE_CLOCK_BUDGET_MS, default 250 ms of the router''s 500 ms limit). A clock that cannot be read is said to be not verified, never passed. Last, on a joining site''s core node, its secrets (join-site-secrets.py): each value every site shares (the SPEC lines of newsite-secrets.sh marked cluster) is taken from the founder''s, as a reference in the reference file or, under a value store, as a value; newsite-secrets.sh mints the site''s own; each shared value is compared with the founder''s by digest, printing names only. A joiner value that differs is refused and kept (GB-353); a founder value that is missing or does not resolve is refused (GB-352).'
  why: A node that is not declared in the repository cannot be converged or graded, and a Zenoh router refuses a timestamp more than 500 ms ahead of its own clock without telling the node's owner; checking first means nothing on the node changes for an undeclared node or a wrong clock.
  changes: Nothing on the node. On a joining site's core node, the operator's secret store or reference file gains the site's values, and none is overwritten.
  verify: the config preflight passes for the node's group, the clock line prints the node's offset or says it was not verified, and on a joiner every shared value reads `same as` the founder's
