# ops/identity/grammar.yaml — the identity vocabulary source-of-truth (ADR 1067).
#
# ONE machine source for the identity grammar's controlled vocabularies. A
# deterministic generator (ops/identity/generate.py) derives every enforced
# artifact + the human tables from this file, one-way (SoT -> outputs, never
# prose parsed back). Design: docs/design/identity/ (grammar-sot-synthesis.html).
#
# Per value:
#   definition     - the meaning as a CLASSIFICATION (migrated verbatim-faithfully
#                    from the vetted tables: docs/design/identity-grammar.md,
#                    docs/adr/GLOSSARY.md, ADR 1043 — never re-glossed).
#   authority      - which of the three non-aligned identity sources it comes from:
#                    doctrinal (external mil canon we conform+map to) |
#                    native (goat-defined; goat is the authority) |
#                    industry (adopted best-practice pattern).
#                    goat's native UUID anchor is always the identity KEY; doctrinal
#                    codes ride as graded, mapped attributes (often latent, non-unique,
#                    coarse, or nation-scoped) — never the key.
#   basis          - the external standard (doctrinal) OR the ADR (native) it rests on.
#   mappings       - crosswalk to external identifiers, per authority-domain.
#   scope          - where a value is valid (national | nato | universal) — for
#                    non-universal doctrine.
#   added / deprecated / superseded_by - lifecycle. Deprecate-never-delete; a value
#                    ever minted into a cert or Ory identity stays valid FOREVER.
#
# Per dimension:
#   schema_description - the EXACT field-level description string the manifest schema
#                    carries; reproduced byte-for-byte by the generator (folded block
#                    scalars fold back to the exact single-line string). The richer
#                    per-value definitions additionally feed the human glossary.
#   rides            - the surfaces that enforce/carry the dimension.
#   closed           - closed enum => fail-closed on machine paths.
#
# Evolution: additive-only; removals/renames are a MAJOR bump + ratification.
# Semver below is stamped into every generated artifact — same additive-minor /
# fail-closed-on-unknown discipline as the descriptor's ?v=<major> (ADR 1051 §5).

version: "1.6.0"

dimensions:

  # ---- affiliation.kind : WHO the principal belongs to (identity-only) --------
  affiliation.kind:
    authority: native            # goat-defined buckets; nation crosswalks to doctrine
    basis: "ADR 1043"
    closed: true
    rides: [manifest, ory-aff-claim, cert-uri-san]
    schema_description: >-
      Affiliation kind — WHAT SORT OF ENTITY this is. vendor = commercial company.
      organic = belonging to the sovereign that RUNS THIS ENVIRONMENT (relative to
      the operator, not to any one nation — on a Lithuanian-sovereign goatnet a
      Lithuanian unit is organic). partner = MISNAMED VALUE, read it as 'foreign
      government/military organisation' (incl. multinational bodies such as
      NATO/SHAPE/EU — marked via the nation field, not a distinct kind). It borrows
      a word that means something exact elsewhere: partner = EXTERNAL TO THE
      ALLIANCE, which is affiliation.alliance_standing, not this field. An allied foreign
      army is kind=partner AND alliance_standing=member, so this value says nothing about
      alliance standing and must never be read as doing so (ADR 1148). civil =
      non-governmental civil-society participant (academia, independent researcher,
      NGO, non-profit). Cert URI-SAN aff-kind=<kind>. Orthogonal to role — a
      DEVELOPER may be any kind. DEPRECATED AND NO LONGER REQUIRED (ADR 1151
      migration step 5): this field asks two independent questions at once — what
      legal kind of thing this is, and whether it is ours or foreign — which is why
      a foreign commercial vendor has no correct value. Declare affiliation.sector
      (plus affiliation.gov_branch when sector is state) instead, and this value is
      DERIVED: commercial→vendor, civil-society→civil, state→organic or partner by
      whether the nation equals the goatnet's operating sovereign. It is still
      ACCEPTED and still emitted, and an explicit value still beats the derivation,
      so no existing manifest changes meaning and NOTHING RE-MINTS — aff-kind in the
      URI-SAN is attribution only, never a write prefix.
    values:
      vendor:
        definition: The principal belongs to a commercial company.
        authority: native
      organic:
        definition: >-
          The principal belongs to a unit of the sovereign that RUNS THIS
          ENVIRONMENT. Organic is relative to the operating sovereign, never to
          one fixed nation — on a Lithuanian-sovereign goatnet a Lithuanian unit
          is organic.
        authority: native
      partner:
        definition: >-
          MISNAMED VALUE. The principal belongs to a government/military
          organisation NOT organic to the operating sovereign (incl. multinational
          bodies like NATO/SHAPE/EU — distinguished by the nation field, not a
          distinct kind). This value names the ENTITY TYPE. It does NOT mean
          'partner' in the alliance sense: partner = EXTERNAL TO THE ALLIANCE,
          which is affiliation.alliance_standing. An allied foreign army is kind=partner
          AND alliance_standing=member (ADR 1148).
        authority: native
        mappings: { stanag_1059: nation }
      civil:
        definition: >-
          The principal belongs to a non-governmental civil-society organization
          — academia, an independent researcher, an NGO, a non-profit.
        authority: native
        basis: "ADR 1043 Amendment 1"
        added: 2026-07-01

  # ---- affiliation.unit_code.scheme : which codification system assigns a code --
  affiliation.unit_code.scheme:
    authority: doctrinal         # each SCHEME is externally defined; a specific
                                 # code's correctness/scope is graded per-instance
                                 # in the registry (unit_code {source,scope,...}).
    closed: true
    rides: [manifest, registry]
    schema_description: >-
      Which codification system assigns the code: sovereign = a nation's own
      national scheme (e.g. the US Unit Identification Code, UIC — 6-char
      alphanumeric); nato-logfas = NATO-codified in LOGFAS (the NATO logistics /
      ORBAT force-structure database), for NATO allies; sap = a national
      SAP-based defense ERP org/unit code (US Army = GCSS-Army; other nations,
      e.g. Ukraine, run SAP directly). Additively extensible — add schemes
      without a cutover.
    values:
      sovereign:
        definition: A nation's own unit-identity scheme (e.g. the US 6-char UIC).
        authority: doctrinal
        scope: national
        mappings: { us: UIC }
      nato-logfas:
        definition: >-
          NATO-codified in LOGFAS (the NATO logistics / ORBAT force-structure
          database), for NATO allies.
        authority: doctrinal
        scope: nato
        basis: "NATO LOGFAS ORBAT"
      sap:
        definition: >-
          A national SAP-based defense ERP org/unit code (US Army = GCSS-Army;
          other nations run SAP directly).
        authority: doctrinal
        scope: national
        mappings: { us_army: GCSS-Army }

  # ---- affiliation.unit_code.source : provenance grade of a specific code -------
  affiliation.unit_code.source:
    authority: native            # goat's provenance-grading model
    basis: "docs/design/unit-reference-service.md (ADR 1064)"
    closed: true
    rides: [manifest, registry]
    schema_description: >-
      Provenance of this code, recorded at onboarding by the unit-reference
      service (docs/design/unit-reference-service.md): authoritative = matched an
      ingested official CUI registry (US UIC catalog / NATO LOGFAS ORBAT /
      national scheme); operator-verified = an operator confirmed it against a
      trusted out-of-band source; self-asserted = the onboarder declared it,
      unmatched (honesty: shown UNCONFIRMED, never a false green); open-source =
      derived from an open ORBAT/name source. Omitted = self-asserted.
      Attribution-only — never a gate.
    values:
      authoritative:
        definition: >-
          Matched an ingested official CUI registry (US UIC catalog / NATO
          LOGFAS ORBAT / national scheme).
        authority: native
      operator-verified:
        definition: An operator confirmed it against a trusted out-of-band source.
        authority: native
      self-asserted:
        definition: >-
          The onboarder declared it, unmatched — shown UNCONFIRMED, never a false
          green. (Default when omitted.)
        authority: native
      open-source:
        definition: Derived from an open ORBAT / name source.
        authority: native

  # ---- affiliation.coalition : standing in the goatnet's active framework -------
  affiliation.coalition:
    authority: doctrinal         # framework membership is externally defined; the
                                 # nation->standing crosswalk lives in the
                                 # framework registry (ops/identity/
                                 # coalition-frameworks.yaml), graded per-instance.
    basis: "ADR 1077"
    closed: true                 # standing is a small framework-NEUTRAL set; the
                                 # FRAMEWORK (nato, ...) is per-goatnet config, not
                                 # a machine enum value — that is what keeps goat
                                 # net region-general, not NATO-baked.
    rides: [manifest, registry]  # mutable — a nation's membership changes and the
                                 # active framework differs per goatnet — so
                                 # registry-authoritative (currently-is), NEVER the
                                 # frozen cert and NEVER the Ory aff claim (relying
                                 # parties resolve current standing from nation +
                                 # the active framework, avoiding a stale green).
    schema_description: >-
      Coalition / alliance standing of the affiliation RELATIVE TO the goatnet's
      active coalition framework (ops/identity/coalition-frameworks.yaml; the
      framework is a per-goatnet / per-AOR choice — NATO is the first, others such
      as Five Eyes / AUKUS / a regional coalition add additively, no code change):
      member = the org's nation is a member of the active framework (or a framework
      body) and is eligible for that framework's member release-lane (e.g. REL
      NATO); partner = not a member — bilateral / coalition release-lanes only,
      never the member lane by standing. Framework-neutral by design so goat net
      serves any region (AFRICOM / INDOPACOM / SOUTHCOM / Arctic /
      Homeland / Global), not just the Euro-Atlantic / NATO case. Nation-derived
      and effective-dated — membership changes (FIN member 2023-04-04, SWE
      2024-03-07) — so it rides the registry (currently-is), never the frozen cert
      and never the Ory aff claim; the manifest may seed an explicit value and the
      framework registry is authoritative when nation is known. Omitted when no
      nation. The eligibility predicate for the reserved data-access coalition /
      releaseset scopes (ADR 1074 / ADR 1027).
    values:
      member:
        definition: >-
          The org's nation is a member of the goatnet's active coalition framework
          (or a framework body). Eligible for that framework's member release-lane.
        authority: doctrinal
      partner:
        definition: >-
          The org is not a member of the active framework — a partner / coalition
          participant, eligible for bilateral / coalition lanes only. (Richer
          standings for interagency / law-enforcement / associate dynamics are a
          deliberate additive future step, not modeled now.)
        authority: doctrinal

  affiliation.alliance_standing:
    authority: doctrinal         # preferred field name; the legacy
                                 # `coalition` key; same derivation, same
                                 # framework registry (coalition-frameworks.yaml).
    basis: "ADR 1077, ADR 1148"
    closed: true
    rides: [manifest, registry]  # derived from nation + active framework;
                                 # NEVER the frozen cert, NEVER the Ory aff claim.
    schema_description: >-
      ALLIANCE standing relative to the goatnet's active framework
      (ops/identity/coalition-frameworks.yaml; per-goatnet / per-AOR). member =
      an ALLY, in the alliance. partner = EXTERNAL TO THE ALLIANCE — not 'anyone
      who is not the host', since an ally is also not the host. Says nothing
      about coalition participation: a coalition is an ACTIVATED grouping formed
      for a purpose and membership of it is a positive fact, so a partner may be
      in no coalition at all. `alliance_standing` is the field name; the legacy
      `coalition` key is still accepted and `alliance_standing` wins when both
      are present (ADR 1148).
      Nation-derived and effective-dated — it rides the registry, never the
      frozen cert and never the Ory aff claim.
    values:
      member:
        definition: >-
          The org's nation is a member of the active framework (an ALLY).
        authority: doctrinal
      partner:
        definition: >-
          The org is not a member of the active framework — external to the
          alliance. Says nothing about coalition participation.
        authority: doctrinal

  # ---- affiliation.sector : state sector (mil vs gov/LE), orthogonal to nation --
  affiliation.sector:
    authority: native            # goat-defined institutional-sector buckets;
                                 # declared at onboarding, not derived.
    basis: "ADR 1077"
    closed: true
    rides: [manifest, registry]  # stable born-as attribution (an org's sector
                                 # rarely changes); registry-carried + app-consumed.
                                 # Ory-claim / cert carriage reserved (populate when
                                 # sector-scoped authz is enforced).
    schema_description: >-
      What the organisation is, orthogonal to its nation. state = a government
      body (armed forces, a ministry, police, a state lab); commercial = a
      company, including a state-owned one; civil-society = an NGO, university,
      research institute or press organisation. If the organisation sells what it
      does, it is commercial even when a government owns it.
      Does NOT say whether the organisation is foreign — that is derived by
      comparing nation with the goatnet's operating sovereign.
      The ADR 1077 values (military, law-enforcement, civil-government,
      intelligence, ngo, media, academic) remain valid until ADR 1151 migration
      step 5 retires them; the first four mean state plus the matching
      affiliation.gov_branch, the last three mean civil-society. Neither set is
      required. Rationale and sourcing: ADR 1151.
    values:
      # ---- TARGET SET (ADR 1151). Additive: nothing is required to use these yet.
      state:
        definition: >-
          A non-market unit of general government — it does not charge economically
          significant fees and it is state-controlled. An army, a ministry, a police
          force and a government lab are all `state`; which one goes in
          affiliation.gov_branch.
        authority: native
      commercial:
        definition: >-
          A market producer — it charges economically significant fees — whether or
          not the state controls it. A defence contractor and a state-owned arms
          manufacturer are both `commercial`. This is the ONE value common to the
          legacy and target sets; it was demand-gated under ADR 1077 and is
          ungated by ADR 1151, because a foreign commercial vendor had no correct
          answer without it.
        authority: native
      civil-society:
        definition: >-
          A non-market unit that is not government (the SNA's NPISH sector) — an
          NGO, a university, an independent researcher, a press organisation.
          Replaces the separate ngo / media / academic values, which asked what
          kind of civil-society body it is rather than which sector it sits in.
        authority: native
      # ---- LEGACY SET (ADR 1077). Accepted until ADR 1151 migration step 5
      # retires it. Each collapses into the target set as noted; the collapse is
      # data work (ADR 1151 step 4), not a rename, so both remain valid meanwhile.
      military:
        definition: >-
          A nation's armed forces (the mil side of a gov/mil actor).
          LEGACY (ADR 1077) — collapses to sector=state + gov_branch=military.
        authority: native
      law-enforcement:
        definition: >-
          Police / gendarmerie / border / customs — distinct legal authorities from
          the military, often with strong sensor + data access.
          LEGACY (ADR 1077) — collapses to sector=state + gov_branch=law-enforcement.
        authority: native
      civil-government:
        definition: >-
          A governmental, non-military, non-law-enforcement, non-intelligence agency
          (homeland / emergency management, diplomatic). NOT the non-governmental
          affiliation.kind=civil.
          LEGACY (ADR 1077) — collapses to sector=state + gov_branch=civil.
        authority: native
      intelligence:
        definition: >-
          A national intelligence / security service (the IC). Spans military and
          civilian agencies and maps cleanly to none of military / law-enforcement /
          civil-government, so it is its own governmental sector.
          LEGACY (ADR 1077) — collapses to sector=state + gov_branch=intelligence.
        authority: native
    # DEMAND-GATED non-governmental cluster — part of the closed vocabulary + the
    # manifest schema (so an enabling goatnet's manifests validate), but NOT exposed
    # or accepted at intake unless the console flag ONBOARD_SECTORS_NONGOV_ENABLED is
    # set (default OFF). Flip per-goatnet on demand (staged-rollout switch, like the
    # NotifyRosenpass toggle). Until then, non-gov participants carry no sector.
    gated_values:
      ngo:
        definition: A non-profit / non-governmental organization (relief, advocacy).
        authority: native
        gate: ONBOARD_SECTORS_NONGOV_ENABLED
      media:
        definition: A press / journalism organization.
        authority: native
        gate: ONBOARD_SECTORS_NONGOV_ENABLED
      academic:
        definition: A university / research institution.
        authority: native
        gate: ONBOARD_SECTORS_NONGOV_ENABLED

  # ---- affiliation.gov_branch : which branch, WHEN sector is state --------------
  affiliation.gov_branch:
    authority: native            # goat-defined. Economics has no reason to separate
                                 # an army from a foreign ministry, so there is no
                                 # public prior art to borrow here (ADR 1151).
    basis: "ADR 1151"
    closed: true
    rides: [manifest, registry]  # same carriage as affiliation.sector: born-as
                                 # attribution, registry-carried, app-consumed.
                                 # NOT in the cert, NOT a NetBird group, NEVER a
                                 # write prefix.
    schema_description: >-
      Which part of government, and only meaningful when affiliation.sector is
      `state`. military = armed forces; law-enforcement = police, gendarmerie,
      border, customs; intelligence = a national intelligence or security service,
      which spans military and civilian agencies; civil = another government
      agency (homeland, emergency management, diplomatic). Omitted where unknown,
      and omitted for any non-state sector. Not required: a manifest carrying only
      affiliation.sector stays valid. Rationale: ADR 1151.
    values:
      military:
        definition: A nation's armed forces.
        authority: native
      law-enforcement:
        definition: >-
          Police / gendarmerie / border / customs — distinct legal authorities from
          the military, often with strong sensor + data access.
        authority: native
      intelligence:
        definition: >-
          A national intelligence / security service (the IC). Spans military and
          civilian agencies, which is why it is its own branch rather than a
          subdivision of either.
        authority: native
      civil:
        definition: >-
          A governmental, non-military, non-law-enforcement, non-intelligence agency
          (homeland / emergency management, diplomatic). NOT affiliation.kind=civil,
          which means non-governmental — the collision of those two words is part of
          what ADR 1151 exists to end.
        authority: native

  # ---- affiliation.relationship : how a member's nation relates to the org's ----
  affiliation.relationship:
    authority: native            # goat-defined. The public sector taxonomies say
                                 # what an organisation IS; none of them say how an
                                 # individual's nationality relates to it, which is
                                 # the question a liaison officer poses (ADR 1171).
    basis: "ADR 1171"
    closed: true
    rides: [manifest, registry]  # declared per membership at admin review; carried
                                 # in the manifest beside affiliation.id, which IS
                                 # the membership assertion. NOT in the cert, NOT a
                                 # NetBird group, NEVER a write prefix.
    schema_description: >-
      How this person's own nationality relates to the organisation they belong to.
      Declared per membership by the admin at approval, NEVER derived. constituent =
      the member's nation is part of what the organisation is (a Belgian officer at
      a NATO command); their nation contributes to the org's contributor set, and
      this value is refused on an org whose composition is `national`. assigned = a
      full member working for the organisation whose nation is their own and does
      NOT transfer to it (a Canadian officer at USAREUR-AF — and equally a US
      officer there); they inherit the org's access, intersected with what their own
      nationality may receive. liaison = attached from outside, representing another
      organisation or nation; no effect on the org's national character and the
      org's access is NOT inherited, so their reads are an explicit grant. This
      value describes the RELATIONSHIP, not the nationality — what separates the US
      officer from the Canadian one is identity.nationality, a separate field. It is
      the explicit form of an inference that is otherwise unconditional and hidden.
      Optional; absent means undeclared. Rationale: ADR 1171.
    values:
      constituent:
        definition: >-
          The member's nation is part of the organisation's national character — a
          Belgian officer at a NATO command. Their nation contributes to the org's
          contributor set. Refused on an org whose composition is `national`: a
          national org's ownership is fixed at creation and no membership changes it.
        authority: native
      assigned:
        definition: >-
          A full member working for the organisation. Their nation is their own and
          does NOT transfer to the organisation — a Canadian officer assigned to a
          US command does not make that command Canadian. They inherit the org's
          access, intersected with what their own nationality may receive.
        authority: native
      liaison:
        definition: >-
          Attached from outside, representing another organisation or nation. No
          effect on the organisation's national character, and the org's access is
          NOT inherited — a liaison's reads are an explicit grant. This is the value
          that stops an attached officer inheriting their host's read lanes wholesale
          simply because membership is membership.
        authority: native

  # ---- org.composition : is the organisation one nation's, or a body of them ----
  org.composition:
    authority: native
    basis: "ADR 1171"
    closed: true
    rides: [registry]            # an ORG fact, so it rides the org registry only —
                                 # never a person's manifest, never the cert.
                                 # Declared once at org creation by an admin.
    schema_description: >-
      Whether the organisation is owned by one sovereign or constituted by a body of
      nations. national = owned by one sovereign regardless of who staffs it, and
      affiliation.nation holds that sovereign's alpha-3 code. multinational =
      constituted by a body of nations, where being staffed by many nations is what
      the organisation IS, and affiliation.nation holds the body marker (NATO, EU).
      Set once at creation and corrected only by an audited org update. Alliance
      standing and the derived organic test read the controlling nation ONLY, never
      a contributor nation — an organisation neither gains nor loses standing
      because of who is attached to it. Rationale: ADR 1171.
    values:
      national:
        definition: >-
          Owned by one sovereign regardless of who staffs it. USAREUR-AF is national
          and US-owned while carrying internationally sourced officers; each lower
          echelon beneath it is more strictly so. `constituent` memberships are
          refused here.
        authority: native
      multinational:
        definition: >-
          Constituted by a body of nations — org79x, SHAPE, Allied Command
          Transformation. affiliation.nation carries the body marker rather than a
          country, and the contributor set grows from `constituent` memberships.
        authority: native

  # ---- identity.nationality : the PERSON's own citizenship ---------------------
  identity.nationality:
    authority: iso               # ISO 3166-1 alpha-3, the same code set
                                 # affiliation.nation uses — one vocabulary, two
                                 # different subjects.
    basis: "ADR 1171"
    closed: false                # the ISO code set, not a goat-defined enum.
    rides: [manifest, registry]
    schema_description: >-
      The person's OWN citizenship — ISO 3166-1 alpha-3 (CAN, USA, SVK). A fact
      about the person, true regardless of who employs them, and DISTINCT from
      affiliation.nation, which is the controlling nation of the ORGANISATION they
      belong to. Neither is derived from the other and the two are permitted to
      disagree: that is the normal state for a liaison officer and for an
      internationally recruited member, and it is information rather than an error.
      Lives on identity, not affiliation, because the affiliation block describes
      WHO THE PRINCIPAL BELONGS TO and this describes the principal. Asked of the
      candidate at intake; the organisation's nation is never asked there.
      Rationale: ADR 1171.

  # ---- identity.type : person vs system principal ------------------------------
  identity.type:
    authority: native
    basis: "ADR 1043 §2; ADR 1031"
    closed: true
    rides: [manifest, registry]
    schema_description: >-
      Principal type in the org -> {person, system} graph. Omitted = person
      (backward-compatible default). A system is a headless publisher (a uuid /
      Zenoh slot) that is an org member in its own right; persons and systems are
      SIBLINGS under the org (vendor.short_tag). See enrolled_by for the custody
      edge.
    values:
      person:
        definition: >-
          A human principal — carries affiliation, role(s), optional echelon.
          (Default when omitted.)
        authority: native
      system:
        definition: >-
          A headless machine/service/autonomous principal (a uuid / Zenoh slot) —
          an org member in its own right; carries affiliation, node-class,
          optional autonomy + echelon.
        authority: native

  # ---- identity.status : lifecycle state ---------------------------------------
  identity.status:
    authority: native
    basis: "ADR 1031; docs/design/credential-revocation-and-offboarding.md"
    closed: true
    rides: [manifest, registry]
    schema_description: >-
      Lifecycle state in the declared issuance registry (the Data-Access COP's
      declared half; see docs/design/credential-revocation-and-offboarding.md +
      docs/design/data-access-cop.md). active = live; inactive = reversibly cut
      off (Ory deactivated by the revoke path); revoked = terminally offboarded
      (--purge). The revoke path flips active -> revoked (or leaves inactive).
    values:
      active:
        definition: Live.
        authority: native
      inactive:
        definition: Reversibly cut off (Ory deactivated by the revoke path).
        authority: native
      revoked:
        definition: Terminally offboarded (--purge).
        authority: native

  # ---- identity.autonomy : self-direction level (system principals) ------------
  identity.autonomy:
    authority: native
    basis: "ADR 1043 §1.4"
    closed: true
    rides: [manifest, cert-uri-san]
    schema_description: >-
      SYSTEM-principal only (omit for persons and for infra-class systems). How
      self-directing the asset is, per the identity grammar (ADR 1043 /
      docs/design/identity-grammar.md §1.4). Ordered, increasing self-direction:
      manual = manned/hand-operated; remote = unmanned but teleoperated/tethered
      (human in direct control, not autonomous); supervised = autonomous with a
      human on-the-loop; autonomous = fully self-directing. The manned/unmanned
      split is derivable (manual = manned, all others = unmanned) so no second
      field is paid. Orthogonal to node-class (any function/platform can be any
      level). Identity-only attribute — NEVER a NetBird group; rides the cert
      URI-SAN as autonomy=<level> for attribution + app-layer authz. Refining the
      autonomous band is a reserved future additive step.
    values:
      manual:
        definition: Manned / hand-operated.
        authority: native
      remote:
        definition: >-
          Unmanned but teleoperated / tethered — human in direct control, not
          autonomous.
        authority: native
      supervised:
        definition: Autonomous with a human on-the-loop who can intervene.
        authority: native
      autonomous:
        definition: Fully self-directing.
        authority: native

  # ---- identity.source_scheme : which external IdP authenticated the person ----
  # External ICAM federation (docs/design/external-icam-federation.md). Additive,
  # default value `native` — nothing changes for identities Kratos authenticates
  # itself. NOT a manifest onboarding field (the external binding is discovered at
  # login, not declared at onboard), so it is intentionally NOT in MANIFEST_PATHS —
  # listed here so the SoT is complete and the descriptor can generate from it.
  identity.source_scheme:
    authority: industry          # federation is an adopted 800-63C pattern; each
                                 # scheme is externally defined + mapped onto the
                                 # native anchor, never the key.
    basis: "docs/design/external-icam-federation.md; NIST SP 800-63C"
    closed: true
    rides: [registry, ory-external-subject]
    schema_description: >-
      Which external identity provider authenticated the person, mapped onto goat's
      native UUID anchor — NEVER the key (external subjects are pairwise per-RP or
      reissued over time). native = goat's own Kratos credential (default when
      omitted); dod-piv = DoD PKI / PIV / CAC, x509 client-cert, subject = EDIPI
      (doctrinal); login-gov = login.gov OIDC, pairwise sub (industry); entra = DoD
      Microsoft Entra ID OIDC/SAML, per-tenant oid (industry); sovereign-pki = a card
      from any profile in ops/identity/sovereign-pkis.yaml, subject <pki>:<identifier>. Additively
      extensible — add schemes without a cutover. The per-person subject value lives
      in the registry/descriptor external_subjects binding, keyed by
      (issuer, client_id, subject).
    values:
      native:
        definition: >-
          goat's own Kratos credential (password / webauthn / totp). Default when
          omitted.
        authority: native
      dod-piv:
        definition: >-
          DoD PKI / PIV / CAC — x509 client certificate, subject = EDIPI. The human
          analog of a doctrinal unit_code; EDIPI reissue / non-uniqueness is exactly
          why it is never the identity key.
        authority: doctrinal
        scope: national
        basis: "DoDI 8520.03"
        mappings: { us_dod: EDIPI }
      login-gov:
        definition: >-
          login.gov OIDC — pairwise sub (a different value per relying-party), IAL2
          identity proofing. Public / IL-limited IdP.
        authority: industry
        scope: national
        basis: "login.gov developer docs; NIST SP 800-63A"
      entra:
        definition: >-
          DoD Microsoft Entra ID (Gov) — OIDC (preferred) / SAML, per-tenant stable
          oid, conditional access. IL2 / IL4 / IL5.
        authority: industry
        basis: "IDManagement CBA-Azure"
      sovereign-pki:
        definition: >-
          A smart card from any sovereign PKI profile in ops/identity/sovereign-pkis.yaml
          (ADR 1209) — x509 client certificate validated by the icam-mtls-proxy; subject =
          "<pki>:<identifier>", the profile id and the number the card carries. us-dod
          keeps dod-piv as its scheme; every other profile records this one. Says which
          PKI issued the card, never the person's nationality (ADR 1171).
        authority: doctrinal
        scope: national
        basis: "docs/adr/1209; ops/identity/sovereign-pkis.yaml"

  # ---- assurance.{ial,aal,fal} : NIST 800-63 assurance levels (PER-EVENT) -------
  # Effective-dated per-login attributes of an assertion/session, NOT static
  # per-person fields (AAL varies per login: same person is AAL3 on CAC, AAL2 on a
  # login.gov OTP session). Ride the descriptor's freshness / consistency-token
  # machinery (ADR 1051). Downstream authz GATES on them, fail-closed on unknown —
  # refuse a low-assurance assertion for a high-assurance resource (the federation
  # analog of goat's fail-closed ACL). Closed ordinal scales; runtime, not manifest.
  assurance.ial:
    authority: industry
    basis: "NIST SP 800-63A (Identity Assurance Level)"
    closed: true
    rides: [registry, ory-external-subject]
    schema_description: >-
      NIST 800-63 Identity Assurance Level — how strongly the real-world identity
      was proofed. ial1 = self-asserted, no proofing; ial2 = remote or in-person
      proofing (login.gov verified, CAC issuance); ial3 = in-person / supervised
      remote proofing. Per-event + effective-dated; gate fail-closed.
    values:
      ial1:
        definition: Self-asserted; no identity proofing.
        authority: industry
      ial2:
        definition: >-
          Remote or in-person identity proofing (login.gov verified / CAC issuance).
        authority: industry
      ial3:
        definition: In-person or supervised-remote identity proofing.
        authority: industry

  assurance.aal:
    authority: industry
    basis: "NIST SP 800-63B (Authenticator Assurance Level)"
    closed: true
    rides: [registry, ory-external-subject]
    schema_description: >-
      NIST 800-63 Authenticator Assurance Level — how strong THIS authentication
      event was. aal1 = single factor; aal2 = two factors (one phishing-resistant
      preferred); aal3 = hardware-backed phishing-resistant (PIV / CAC / FIDO2).
      Varies per login for the same person — carry it per assertion, gate fail-closed.
    values:
      aal1:
        definition: Single-factor authentication.
        authority: industry
      aal2:
        definition: Two-factor authentication (multi-factor, software or hardware).
        authority: industry
      aal3:
        definition: >-
          Hardware-backed, phishing-resistant authentication (PIV / CAC / FIDO2).
        authority: industry

  assurance.fal:
    authority: industry
    basis: "NIST SP 800-63C (Federation Assurance Level)"
    closed: true
    rides: [registry, ory-external-subject]
    schema_description: >-
      NIST 800-63 Federation Assurance Level — how strongly the federated assertion
      itself is protected. fal1 = signed bearer assertion; fal2 = signed AND
      encrypted-to-the-RP (required for PII-bearing assertions); fal3 = holder-of-key
      (the subject proves possession of a key referenced in the assertion). Per-event.
    values:
      fal1:
        definition: Signed bearer assertion.
        authority: industry
      fal2:
        definition: >-
          Signed and encrypted-to-the-relying-party assertion (required for
          PII-bearing assertions).
        authority: industry
      fal3:
        definition: >-
          Holder-of-key assertion — the subject proves possession of a referenced key.
        authority: industry

  # ---- netbird.role : setup-key TTL tier (NOT the mesh role family) ------------
  netbird.role:
    authority: native
    basis: "docs/operations/setup-key-rotation.md"
    closed: true
    rides: [manifest]
    schema_description: >-
      Per docs/operations/setup-key-rotation.md. TTL defaults: bootstrap=1d,
      admin=7d, operator=30d, peer=90d.
    values:
      bootstrap:
        definition: First-bringup setup-key tier (1-day TTL default).
        authority: native
      admin:
        definition: Mesh-admin setup-key tier (7-day TTL default).
        authority: native
      operator:
        definition: Operator setup-key tier (30-day TTL default).
        authority: native
      peer:
        definition: Normal-member setup-key tier (90-day TTL default).
        authority: native

# ---------------------------------------------------------------------------------
# Vocabulary dimensions below are the identity-grammar dimensions that COMPOSE the
# netbird.auto_groups union + the cert URI-SAN value-sets (role=, echelon=,
# node-class=). Their per-value definitions feed the glossary now; the generator
# ASSEMBLES the composite targets (auto_groups enum, cert value-sets) from them in
# increment 3 (a one-time, reviewed re-serialization — not byte-for-byte against the
# current hand-ordered list). Listed here so the SoT is complete.
# ---------------------------------------------------------------------------------

  role_family:
    authority: native
    basis: "ADR 1043 §2; docs/design/identity-grammar.md §1.1"
    closed: true
    rides: [netbird-group, ory-groups, cert-uri-san]
    values:
      ADMIN:
        definition: Full backend — mgmt server, ACLs, dashboards.
        authority: native
      MONITOR:
        definition: >-
          Read-only platform observability (grafana/openobserve/minio); no mgmt.
          (Renamed the observability-sense of OPERATOR.)
        authority: native
      DEVELOPER:
        definition: >-
          Zenoh pub/sub + portal + dev web surfaces — the affiliation-neutral
          fabric-dev role, capability-equal to legacy VENDOR.
        authority: native
      OPERATOR:
        definition: Tactical actor — sensor / effector / C2 / data-process.
        authority: native
      OBSERVER:
        definition: Passive read of mission data + surfaces.
        authority: native
      VENDOR:
        definition: >-
          Legacy alias of DEVELOPER; retained until each goatnet's gated cutover.
        authority: native
        deprecated: true
        superseded_by: [DEVELOPER]

  node_class:
    authority: native
    basis: "ADR 1043 §1.4; docs/design/identity-grammar.md §1.4"
    closed: true
    rides: [netbird-group, cert-uri-san]
    values:
      SENSOR:
        definition: Sensing asset (system principal).
        authority: native
      EFFECTOR:
        definition: Acting / effecting asset (system principal).
        authority: native
      PROCESSOR:
        definition: Non-C2 data process — fusion / analytics / ML / transform.
        authority: native
        basis: "ADR 1043 §1.4"
      PLATFORM:
        definition: >-
          Multi-function / mobile composite (e.g. a UAS is not sensor xor
          effector).
        authority: native
        basis: "ADR 1043 §1.4"
      MGMT-HOST:
        definition: Management-host infrastructure class.
        authority: native
      ZENOH:
        definition: Zenoh router / fabric infrastructure class.
        authority: native
      SNITCH:
        definition: Snitch fleet-visibility infrastructure class.
        authority: native
      SERVICES:
        definition: Hosted-services infrastructure class.
        authority: native
      NETWORK:
        definition: >-
          Network transport infrastructure — routers, switches, radios and other
          bearer devices carrying the IP underlay the mesh rides on. Runs no goat
          software beyond a mesh client; enrolled so it is manageable over the
          mesh and so its health + custody are attributable. Infrastructure
          class, but the ONE infra class a site network admin may enroll for
          their own site (ADR 1113) rather than operator-only.
        authority: native
        basis: "ADR 1113"
      NETWORK-JUMP:
        definition: >-
          The one peer permitted to open an interactive session to NETWORK-class
          bearer gear — the egress half of the herd gear console, held apart from
          the console itself because a mgmt host is INFRA and NetBird groups only
          union reach, so nothing hosted there can be narrowed. Reaches NETWORK on
          tcp 22 and its own management plane on INFRA; no fabric ports, no lateral
          reach, never P2P. A normal-day path, unlike BREAKGLASS, and operator-
          enrolled, unlike NETWORK — the delegation is on the people who drive it,
          not on the peer.
        authority: native
        basis: "ADR 1131"
      EDGE-SERVER:
        definition: >-
          A named server that directly supports a site's edge devices. Takes
          NETWORK's shape exactly — reachable any-port by PLATFORM-ADMIN and
          INFRA; initiates only to INFRA on the management plane plus icmp; no
          fabric ports, no lateral reach, never P2P — and NETWORK's delegation:
          a site network admin may enroll one for their own site (ADR 1113).
          Reached by that site's network engineers on the device-admin ports.
        authority: native
        basis: "ADR 1216"
      PEERING-EDGE:
        definition: >-
          A federation edge router (ADR 1157) that stays a peer of our own mesh.
          It initiates to FABRIC-CORE on the fabric TLS port and nothing else;
          PLATFORM-ADMIN reaches it on tcp 22 and nothing else does. No other
          fabric, web or DNS reach, no lateral reach, never P2P. Placed by the
          membership declaration, never minted: the setup key that enrolled the
          box does not grant it.
        authority: native
        basis: "ADR 1219"
      MOON:
        definition: >-
          Uplink peer of a foreign-stack goatnet (its own mgmt / identity / CA,
          not federated into this mesh — its whole presence here is this one
          data-passage peer). Initiates to INFRA on peer-facing service ports
          only; nothing initiates toward it (sovereign box, reveal-only health).
          No external-infra, no lateral, never P2P.
        authority: native
        basis: "ADR 1092"
      POD:
        definition: >-
          Moon-pod-guidance appliance INSIDE our identity planes (our NetBird /
          Ory / X.509 CA; may run its own local zenoh router). Normal infra
          probe / admin destination; excluded from external-infra reach (grant
          on real need). Peering into the pod's local router is an ADR 1087
          graduated capability, never base reach.
        authority: native
        basis: "ADR 1092"
      BREAKGLASS:
        definition: >-
          Operator reach-in of last resort — a dual-homed, minimal node
          positioned so it can be reached, and can reach the local substrate,
          when the normal control plane is the broken thing. Reachable any-port
          by PLATFORM-ADMIN + INFRA; initiates only to INFRA and NETWORK on
          tcp 22; no fabric ports either direction, no lateral reach, never P2P.
          Not delegable: unlike NETWORK, a site admin's enrollment entitlement
          must not extend to the rescue path. The bad-day (second-transport)
          path is half the definition (ADR 1114 D3).
        authority: native
        basis: "ADR 1114"

  echelon:
    authority: doctrinal         # command-authority tiers are external doctrine
    basis: "US joint-echelon doctrine; ADR 1043 §1.3"
    closed: true
    rides: [netbird-group, cert-uri-san]
    values:
      COMMAND:
        definition: >-
          Top command-authority tier — a combatant / theater command; broadest
          legitimate site-scope (theater / multi-site).
        authority: doctrinal
      COMPONENT:
        definition: >-
          Service component command (platform engineering + project guidance);
          fleet-wide scope.
        authority: doctrinal
      OPERATIONAL:
        definition: Corps / division / JTF mid-tier (optional); multi-site scope.
        authority: doctrinal
      OPSCTR:
        definition: Base defense operations center; site-local scope.
        authority: doctrinal
      COMMAND-POST:
        definition: Tactical command post; site-local scope.
        authority: doctrinal
      MFT:
        definition: Mobile fires team; site-local scope.
        authority: doctrinal
      OFFSITE:
        definition: >-
          Deprecated catch-all that conflated geography + echelon + role;
          decompose into those three.
        authority: native
        deprecated: true
        superseded_by: [echelon, role_family, affiliation.kind]

# ---------------------------------------------------------------------------------
# Relationship edge-type catalog (affiliation graph). v1 populates only `parent`;
# the rest are RESERVED (designed, not built). Keyed by affiliation id (the id a
# unit_code identifies); most are effective-dated. See identity-grammar.md §3.2,
# ADR 1043 §4. Not a schema enum today — carried here so the vocabulary is complete
# and the graph/descriptor can generate from it.
# ---------------------------------------------------------------------------------

edge_types:
  authority: native
  basis: "ADR 1043 §4; docs/design/identity-grammar.md §3.2"
  rides: [registry, graph]
  values:
    parent:
      definition: >-
        Vertical containment / administrative command (ADMINCON). The v1,
        populated edge.
      authority: native
      status: built
    comrel:
      definition: >-
        Operational command relationship (OPCON / TACON-style control);
        time-bounded.
      authority: native
      status: reserved
    c2-authority:
      definition: Who exercises command-and-control authority over this unit.
      authority: native
      status: reserved
    data-authority:
      definition: >-
        Data owner / steward / releasing authority for this unit's data (ties to
        release-sets, ADR 1027).
      authority: native
      status: reserved
    provisions:
      definition: Who provisions / sustains / logistically supports this unit.
      authority: native
      status: reserved
    replaces:
      definition: >-
        Relief-in-place / transfer-of-authority successor (RIP-TOA); time-bounded.
      authority: native
      status: reserved
    supports:
      definition: Lateral direct-support edge.
      authority: native
      status: reserved
    coordinates-with:
      definition: Lateral peer-coordination edge.
      authority: native
      status: reserved
