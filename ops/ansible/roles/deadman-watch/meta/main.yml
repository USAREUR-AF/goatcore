---
galaxy_info:
  role_name: deadman-watch
  author: goat-maintainer
  description: |
    External dead-man's-switch watcher. Receives the obs host's
    Watchdog heartbeat and pages PagerDuty directly when it stops. Must run
    on a different host from the obs stack it watches.
  license: Apache-2.0
  min_ansible_version: "2.15"
  platforms:
    - name: Ubuntu
      versions: ["22.04", "24.04"]
dependencies: []
