---
# Canonical oauth2-proxy-dashboard deploy onto a mgmt-host stack
# (Block 83C.2-L7).
#
# Pre-reqs (operator-fired BEFORE this role):
#   1. Site Hydra reachable on loopback (ory-deploy.yml ran).
#   2. netbird-dashboard container already up + reachable on `mgmt` network
#      (dashboard-deploy.yml ran).
#   3. Patched consent UI in place per ADR 0857 (verified at first
#      adopter — Block 82B-rbac grafana). KRATOS_SELFSERVICE_UI_IMAGE
#      is rendered into `/opt/mgmt-host/.env` by the `ory` role's
#      lineinfile task from the `kratos_selfservice_ui_image` var in
#      per-site group_vars; bump the var + re-run `<site>-ory.yml`
#      for pin bumps.
#   4. dashboard_oauth2_proxy_client_secret + dashboard_oauth2_proxy_cookie_secret
#      env vars set (32+ chars; cookie secret base64-encoded 16/24/32 bytes).
#   5. oauth2-proxy-dashboard-oidc-client role has run (Hydra OAuth2 client
#      `oauth2-proxy-dashboard` exists).
#   6. Traefik dynamic config swaps the dashboard service loadBalancer
#      URL from http://dashboard:80 to http://oauth2-proxy-dashboard:4180
#      (rendered by traefik-acme.yml when
#      dashboard_oauth2_proxy_enabled: true is set in group_vars; see
#      ops/ansible/templates/traefik-acme/mgmt-dynamic.yml.j2).

- name: Require oauth2-proxy-dashboard inputs
  ansible.builtin.assert:
    that:
      - dashboard_oauth2_proxy_enabled | default(false) | bool
      - dashboard_oauth2_proxy_client_secret is defined and (dashboard_oauth2_proxy_client_secret | length) >= 32
      - dashboard_oauth2_proxy_cookie_secret is defined and (dashboard_oauth2_proxy_cookie_secret | length) in [16, 24, 32]
      - site_id is defined and (site_id | length) > 0
      - site_dns_zone is defined and (site_dns_zone | length) > 0
    fail_msg: |
      oauth2-proxy-dashboard role requires:
        - dashboard_oauth2_proxy_enabled: true
        - dashboard_oauth2_proxy_client_secret (32+ chars; env-sourced)
        - dashboard_oauth2_proxy_cookie_secret (16, 24, or 32 random bytes
                                                base64-encoded; env-sourced)
        - site_id, site_dns_zone

- name: Render oauth2-proxy-dashboard.env (mode 0600)
  ansible.builtin.template:
    src: oauth2-proxy-dashboard.env.j2
    dest: "{{ dashboard_oauth2_proxy_envfile }}"
    owner: root
    group: root
    mode: "0600"
  notify: reload oauth2-proxy-dashboard compose

- name: Lay down compose overlay
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../compose/mgmt-host/{{ dashboard_oauth2_proxy_compose_src }}"
    dest: "{{ dashboard_oauth2_proxy_compose_file }}"
    owner: root
    group: root
    mode: "0644"
  notify: reload oauth2-proxy-dashboard compose

# On-host DNS override for the OIDC issuer hostname (F-126 pattern, same
# shape as isitup's OAUTH2_PROXY_OIDC_HOST_ENTRY). Closes the gap where the
# container's embedded resolver can't reach mesh CoreDNS on :5353.
- name: Set {{ dashboard_oauth2_proxy_env_prefix }}_OIDC_HOST_ENTRY in /opt/mgmt-host/.env (compose-time substitution)
  ansible.builtin.lineinfile:
    path: /opt/mgmt-host/.env
    regexp: "^{{ dashboard_oauth2_proxy_env_prefix }}_OIDC_HOST_ENTRY="
    line: "{{ dashboard_oauth2_proxy_env_prefix }}_OIDC_HOST_ENTRY={{ dashboard_oauth2_proxy_oidc_host_entry }}"
    owner: root
    group: root
    mode: "0600"
    create: true
  notify: reload oauth2-proxy-dashboard compose

# Easy-rollback per ADR 0859 — drive OAUTH2_PROXY_DASHBOARD_IMAGE via
# the same compose-time env mechanism. Compose's
# ${OAUTH2_PROXY_DASHBOARD_IMAGE:-default} picks this up from
# /opt/mgmt-host/.env. Bumps to oauth2_proxy_dashboard_image MUST
# append a row to deploy-history.yml (CI checks via
# deploy-history-check.yml).
- name: Set {{ dashboard_oauth2_proxy_env_prefix }}_IMAGE in /opt/mgmt-host/.env (ADR 0859 — easy rollback)
  ansible.builtin.lineinfile:
    path: /opt/mgmt-host/.env
    regexp: "^{{ dashboard_oauth2_proxy_env_prefix }}_IMAGE="
    line: "{{ dashboard_oauth2_proxy_env_prefix }}_IMAGE={{ oauth2_proxy_dashboard_image }}"
    owner: root
    group: root
    mode: "0600"
    create: true
  notify: reload oauth2-proxy-dashboard compose

- name: Flush handlers so oauth2-proxy-dashboard is up before the smoke fires
  ansible.builtin.meta: flush_handlers

- name: Bring up {{ dashboard_oauth2_proxy_service }} (idempotent)
  ansible.builtin.command:
    cmd: >-
      docker compose
      -f /opt/mgmt-host/docker-compose.yml
      -f {{ dashboard_oauth2_proxy_compose_file }}
      up -d {{ dashboard_oauth2_proxy_service }}
    chdir: /opt/mgmt-host
  register: dashboard_proxy_compose_up
  changed_when: >-
    'Started' in (dashboard_proxy_compose_up.stderr | default(''))
    or 'Created' in (dashboard_proxy_compose_up.stderr | default(''))
    or 'Recreated' in (dashboard_proxy_compose_up.stderr | default(''))

- name: Wait for oauth2-proxy-dashboard healthy on :4180/ping
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ dashboard_oauth2_proxy_host_port }}/ping"
    status_code: 200
  retries: 10
  delay: 2
  register: dashboard_proxy_ping
  failed_when: false

- name: Print deploy summary
  ansible.builtin.debug:
    msg: |
      {{ dashboard_oauth2_proxy_service }} deployed:
        URL:           https://{{ dashboard_oauth2_proxy_fqdn }}/ (gates via OIDC)
        Allowed group: {{ dashboard_oauth2_proxy_allowed_groups }}
        OIDC:          {{ dashboard_oauth2_proxy_oidc_issuer_url }} (client_id={{ dashboard_oauth2_proxy_oidc_client_id }})

      Next:
        1. Apply traefik-acme.yml so the dashboard router's
           loadBalancer points at oauth2-proxy-dashboard:4180 instead of
           dashboard:80.
        2. Drill the gate end-to-end: an account outside the allowed
           group gets 403, an account in it gets 200.
# Deploy ledger now written by the shared `rollback-ledger`
# meta-dependency (meta/main.yml) per ADR 1060 — no per-role task here.

# F-530 fix 2: this role runs `meta: flush_handlers` before its own health/smoke,
# so it is rollback_promote_mode: explicit (meta/main.yml) — the pending ledger row
# is promoted here, as the LAST deploy step, only once the gates above have passed.
- name: oauth2-proxy-dashboard | record deploy convergence in the ledger after health/smoke
  ansible.builtin.include_role:
    name: rollback-ledger
    tasks_from: promote
  vars:
    rollback_component: "{{ dashboard_oauth2_proxy_service | default('oauth2-proxy-dashboard') }}"
    rollback_ref: "{{ oauth2_proxy_dashboard_image }}"
