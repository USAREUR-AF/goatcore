---
# ADR 1055 — peer-name resolver (Thor-only; needs mgmt Postgres access). Reads
# (pubkey,name) from the store, computes the exact hex the relay emits, writes the
# {hex:name} map locally + POSTs it to the cloud ingest so BOTH dashboards render
# names. Runs as a systemd timer. Gated: only where the mgmt store is reachable.
- name: relay-health | peer-names resolver env + timer (ADR 1055)
  when: relay_peer_names_enabled | bool
  block:
    # Installed here, not only in the enabled path's script loop: a Thor on the
    # sunset path ran whatever resolver it was last given, so a fix to the script
    # never reached it.
    - name: relay-health | peer-names resolver script + shared peer→person client
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ relay_health_dir }}/{{ item.dest }}"
        mode: "{{ item.mode }}"
      loop:
        - { src: "{{ relay_health_src_dir }}/relay-peer-names.py", dest: relay-peer-names.py, mode: "0755" }
        - { src: "{{ playbook_dir }}/../identity/peerowner.py", dest: peerowner.py, mode: "0644" }

    # The writer puts each peer's owner on every card (peer-identity-resolution.md
    # §"The carrier"). A key the portal refuses makes every card `owner: unread`
    # while the timer still succeeds, so the deploy asks the portal, with the
    # key the writer presents and on the route the writer uses (the operator-only
    # `POST /api/access/peers`), before reporting success. Only a REFUSED key
    # fails the deploy: a portal that is down or not found is said loudly and
    # does not block the health dashboard, whose job does not depend on it.
    # A host writer's key can drift from the portal's root key without anything
    # else noticing, because the portal's handle-map guard never compares it.
    - name: relay-health | peer-names — the writer needs a portal key to read owners (ADR 1249)
      ansible.builtin.fail:
        msg: >-
          relay-peer-names is enabled and relay_peer_names_portal_key is empty, so
          every peer's owner would be "not read" on every surface, permanently.
          Set the key, or set relay_peer_names_owner_enabled: false to deploy the
          writer without owners on purpose.
      when:
        - relay_peer_names_owner_enabled | default(true) | bool
        - relay_peer_names_portal_key | default('') | length == 0

    - name: relay-health | peer-names — find the portal app address
      ansible.builtin.command:
        argv:
          - docker
          - inspect
          - -f
          - "{{ '{{' }}(index .NetworkSettings.Networks \"{{ relay_peer_names_portal_net }}\").IPAddress{{ '}}' }}"
          - "{{ relay_peer_names_portal_container }}"
      register: relay_peer_names_portal_ip
      changed_when: false
      failed_when: false
      when:
        - relay_peer_names_portal_key | default('') | length > 0
        - relay_peer_names_portal_url | default('') | length == 0
        - relay_peer_names_portal_container | default('') | length > 0

    - name: relay-health | peer-names — the portal address the writer will use
      ansible.builtin.set_fact:
        relay_peer_names_probe_url: >-
          {{ relay_peer_names_portal_url if (relay_peer_names_portal_url | default('') | length > 0)
             else ('http://' ~ (relay_peer_names_portal_ip.stdout | default('') | trim) ~ ':' ~ relay_peer_names_portal_port
                   if (relay_peer_names_portal_ip.stdout | default('') | trim | length > 0) else '') }}
      when: relay_peer_names_portal_key | default('') | length > 0

    - name: relay-health | peer-names — ask the owner route with the writer's key
      ansible.builtin.uri:
        url: "{{ relay_peer_names_probe_url | trim }}/api/access/peers"
        method: POST
        body_format: json
        body: {"netbird_names": []}
        headers:
          Authorization: "Bearer {{ relay_peer_names_portal_key }}"
        status_code: [200, 401, 403]
        timeout: 15
        validate_certs: false
      register: relay_peer_names_probe
      until: relay_peer_names_probe.status | default(-1) in [200, 401, 403]
      retries: 6
      delay: 5
      changed_when: false
      failed_when: false
      no_log: true
      when:
        - relay_peer_names_portal_key | default('') | length > 0
        - relay_peer_names_probe_url | default('') | trim | length > 0

    - name: relay-health | peer-names — fail when the portal refuses the writer's key
      ansible.builtin.fail:
        msg: >-
          The portal at {{ relay_peer_names_probe_url | trim }} refused the key
          relay-peer-names presents (HTTP {{ relay_peer_names_probe.status }} on
          POST /api/access/peers, an operator route). Every peer's owner would be
          "not read". Re-render relay_peer_names_portal_key from the portal's
          current operator key, then re-run.
      when:
        - relay_peer_names_probe is defined
        - relay_peer_names_probe.status | default(-1) in [401, 403]

    - name: relay-health | peer-names — say so when the portal cannot be reached
      ansible.builtin.debug:
        msg: >-
          WARNING: relay-peer-names could not reach the portal
          ({{ (relay_peer_names_probe_url | default('') | trim) or 'no address: the portal container was not found' }}).
          The health dashboard deploys; every peer's owner reads "not read" until
          the portal answers. The writer retries every cycle.
      when:
        - relay_peer_names_portal_key | default('') | length > 0
        - (relay_peer_names_probe_url | default('') | trim | length == 0)
          or (relay_peer_names_probe.status | default(-1) not in [200, 401, 403])

    # The overlay's file is checked against the schema before it lands
    # (`--check-exceptions` refuses a wrong schema, a bad date, an unknown key
    # or a repeated peer id), so a bad file fails the deploy instead of
    # silently excepting nobody. With no file in the overlay, a file left on
    # the host from an earlier deploy is removed: the host follows the overlay.
    - name: relay-health | peer-names — the goatnet's owner exceptions (ADR 1249)
      ansible.builtin.copy:
        src: "{{ relay_peer_names_owner_exceptions_src }}"
        dest: "{{ relay_health_dir }}/owner-exceptions.json"
        mode: "0644"
        validate: "/usr/bin/env python3 {{ relay_health_dir }}/relay-peer-names.py --check-exceptions %s"
      when: relay_peer_names_owner_exceptions_src | default('') | length > 0

    - name: relay-health | peer-names — no owner exceptions in the overlay, none on the host
      ansible.builtin.file:
        path: "{{ relay_health_dir }}/owner-exceptions.json"
        state: absent
      when: relay_peer_names_owner_exceptions_src | default('') | length == 0

    - name: relay-health | peer-names — say so when owners have nowhere to be counted
      ansible.builtin.debug:
        msg: >-
          WARNING: relay_peer_names_owner_textfile is empty (relay_health_textfile_out
          is unset), so the peer owner reconcile writes no metrics and
          PeerOwnerMetricsAbsent will fire. Set relay_health_textfile_out.
      when:
        - relay_peer_names_owner_enabled | default(true) | bool
        - relay_peer_names_owner_textfile | default('') | length == 0

    - name: relay-health | peer-names resolver .env
      ansible.builtin.copy:
        dest: "{{ relay_health_dir }}/relay-peer-names.env"
        owner: root
        group: root
        mode: "0600"
        content: |
          RELAY_PEER_NAMES_PG_CONTAINER={{ relay_peer_names_pg_container }}
          RELAY_PEER_NAMES_PG_DB={{ relay_peer_names_pg_db }}
          RELAY_PEER_NAMES_PG_USER={{ relay_peer_names_pg_user }}
          RELAY_PEER_NAMES_LOCAL_DIR={{ relay_health_www_dir }}/ingest
          RELAY_PEER_NAMES_INGEST_URLS={{ relay_peer_names_ingest_urls }}
          RELAY_METRICS_BEARER_TOKEN={{ relay_metrics_bearer_token }}
          RELAY_PEER_NAMES_PORTAL_URL={{ relay_peer_names_portal_url }}
          RELAY_PEER_NAMES_PORTAL_KEY={{ relay_peer_names_portal_key }}
          RELAY_PEER_NAMES_ID_CONSOLE_URL={{ relay_peer_names_id_console_url }}
          RELAY_PEER_NAMES_PORTAL_CONTAINER={{ relay_peer_names_portal_container }}
          RELAY_PEER_NAMES_PORTAL_NET={{ relay_peer_names_portal_net }}
          RELAY_PEER_NAMES_PORTAL_PORT={{ relay_peer_names_portal_port }}
          RELAY_PEER_NAMES_OWNER_TEXTFILE={{ relay_peer_names_owner_textfile }}
          RELAY_PEER_NAMES_OWNER_EXCEPTIONS={{ (relay_health_dir ~ '/owner-exceptions.json') if (relay_peer_names_owner_exceptions_src | default('') | length > 0) else '' }}
      no_log: true

    - name: relay-health | install peer-names resolver service + timer
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "/etc/systemd/system/{{ item }}"
        mode: "0644"
      loop:
        - relay-peer-names.service
        - relay-peer-names.timer

    - name: relay-health | seed an initial peer-names resolve
      ansible.builtin.command:
        cmd: "/usr/bin/env python3 {{ relay_health_dir }}/relay-peer-names.py"
      environment:
        RELAY_PEER_NAMES_PG_CONTAINER: "{{ relay_peer_names_pg_container }}"
        RELAY_PEER_NAMES_PG_DB: "{{ relay_peer_names_pg_db }}"
        RELAY_PEER_NAMES_PG_USER: "{{ relay_peer_names_pg_user }}"
        RELAY_PEER_NAMES_LOCAL_DIR: "{{ relay_health_www_dir }}/ingest"
        RELAY_PEER_NAMES_INGEST_URLS: "{{ relay_peer_names_ingest_urls }}"
        RELAY_METRICS_BEARER_TOKEN: "{{ relay_metrics_bearer_token }}"
        RELAY_PEER_NAMES_PORTAL_URL: "{{ relay_peer_names_portal_url }}"
        RELAY_PEER_NAMES_PORTAL_KEY: "{{ relay_peer_names_portal_key }}"
        RELAY_PEER_NAMES_ID_CONSOLE_URL: "{{ relay_peer_names_id_console_url }}"
        RELAY_PEER_NAMES_PORTAL_CONTAINER: "{{ relay_peer_names_portal_container }}"
        RELAY_PEER_NAMES_PORTAL_NET: "{{ relay_peer_names_portal_net }}"
        RELAY_PEER_NAMES_PORTAL_PORT: "{{ relay_peer_names_portal_port }}"
        RELAY_PEER_NAMES_OWNER_TEXTFILE: "{{ relay_peer_names_owner_textfile }}"
        RELAY_PEER_NAMES_OWNER_EXCEPTIONS: "{{ (relay_health_dir ~ '/owner-exceptions.json') if (relay_peer_names_owner_exceptions_src | default('') | length > 0) else '' }}"
      changed_when: false
      failed_when: false
      no_log: true

    - name: relay-health | enable + start peer-names timer
      ansible.builtin.systemd:
        name: relay-peer-names.timer
        enabled: true
        state: started
        daemon_reload: true
