---
galaxy_info:
  role_name: pgbackrest
  author: goat-maintainer
  license: Apache-2.0
  min_ansible_version: "2.14"
  platforms:
    - name: Ubuntu
      versions:
        - jammy
        - noble

# Universal deploy-rollback ledger (ADR 1060).
dependencies:
  - role: rollback-ledger
    vars:
      rollback_component: pgbackrest
      # The role deploys configuration (pgbackrest.conf, the cron schedule).
      # The binary ships in the postgres-spock image, which this role does
      # not pin, so this row is config, not an image.
      rollback_artifact_type: config
      rollback_ref: "pgbackrest.conf stanza={{ pgbackrest_stanza }}"
