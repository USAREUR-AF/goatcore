---
# ops/ansible/roles/admit-audit/defaults/main.yml
#
# Defaults for the admit-audit role. Override per-play or per-host
# as needed.

# Where the mgmt-host compose stack lives (matches ops/ansible/mgmt-host.yml
# + roles/observability/).
compose_dir: /opt/mgmt-host

# Whether the base stack was brought up with the phase2 override.
# vega production PoC is single-instance per host, so default false.
phase2: false

# Read-only Postgres role used by the admit-audit sidecar. SELECT
# on public.peers only — no access to setup_keys, users, or the
# spock schema.
pg_admit_audit_role: admit_audit

# DB where the peers table lives (the one Netbird management
# writes to).
pg_admit_audit_db: netbird

# Container image: the build .github/workflows/admit-audit-image.yml publishes
# as goat-admit-audit, pinned by digest. The role carries no pin. The pin of
# record is the `admit-audit` row of ops/pins/fleet-pins.yaml, rendered into
# group_vars/<member>/pins.yml for every goatnet the table lists; a host group
# outside the table sets admit_audit_image in its own group_vars. The deploy
# refuses an empty value. The bare name `admit-audit` is an old hand-pushed
# image that nothing builds: never pin it. Moving a running goatnet onto a new
# image is a version change: take it through the release ladder.
#   admit_audit_image: ghcr.io/{{ ghcr_org }}/goat-admit-audit:sha-<rev>@sha256:<digest>
admit_audit_image: ""
