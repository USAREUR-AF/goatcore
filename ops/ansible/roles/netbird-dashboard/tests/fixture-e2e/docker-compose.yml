# netbird-dashboard fixture-e2e compose
#
# Block 21D.1 E2E + perf harness. Brings up a minimal-but-faithful
# auth stack (postgres + Kratos + Hydra + selfservice-ui-node +
# netbird-mgmt + Traefik + dashboard) for headless Playwright to
# drive the OAuth dance against.
#
# Diverges from production in three deliberate ways:
#
# 1. Postgres is plain `postgres:16`, not the postgres-spock build —
#    Spock multi-master is not exercised by the SPA E2E. The Spock
#    replication path has its own soak driver in
#    ../../../ory/tests/soak/.
# 2. The TLS cert is a single-shot self-signed multi-SAN cert
#    generated by ./gen-cert.sh at bringup time. Production uses a
#    cert-sign-issued offline-CA-rooted leaf. E2E doesn't validate
#    the cert chain (`ignoreHTTPSErrors: true`); the chain-trust
#    flow is its own test surface.
# 3. Hostnames are mapped via `extra_hosts:` to the Traefik IP
#    inside the compose network (no real DNS, no /etc/hosts on the
#    runner). Each subdomain resolves to the shared Traefik service.
#
# Fixture invariants the production stack also has — the harness'
# value is asserting these continue to hold:
#
# - Hydra client: `skip_consent: true`, `access_token_strategy: jwt`,
#   `redirect_uris=[/peers, /access-control, /silent-auth]`.
# - mgmt-a HttpConfig.AuthAudience matches the Hydra client_id.
# - Single multi-SAN cert covers all 4 mgmt-stack hostnames.
#
# The fixture's seed.sh sibling provisions the Hydra client + Kratos
# identity + mgmt-side user record + cert + Traefik dynamic config.

name: dashboard-e2e

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: e2e-postgres-password-fixed-1234
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 30
    volumes:
      - ./conf/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    networks:
      mgmt:

  kratos-migrate:
    image: oryd/kratos:v1.3.1
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DSN: "postgres://postgres:e2e-postgres-password-fixed-1234@postgres:5432/kratos?sslmode=disable"
    command: ["migrate", "-c", "/etc/config/kratos.yaml", "sql", "-e", "--yes"]
    volumes:
      - ./conf/kratos.yaml:/etc/config/kratos.yaml:ro
      - ./conf/identity-schema.json:/etc/config/identity-schema.json:ro
    restart: "no"
    networks:
      mgmt:

  kratos:
    image: oryd/kratos:v1.3.1
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully
    environment:
      DSN: "postgres://postgres:e2e-postgres-password-fixed-1234@postgres:5432/kratos?sslmode=disable"
      # SECRETS_CIPHER must be EXACTLY 32 bytes — Kratos enforces
      # `secrets.cipher.items.maxLength: 32` because the value is
      # used as an AES-256 key. SECRETS_COOKIE has no maxLength
      # (minLength: 16). See F-086.
      SECRETS_COOKIE: "e2e-kratos-cookie-secret-fixed-32xxx"
      SECRETS_CIPHER: "e2e-kratos-cipher-secret-32bytes"
    command: ["serve", "-c", "/etc/config/kratos.yaml", "--dev"]
    volumes:
      - ./conf/kratos.yaml:/etc/config/kratos.yaml:ro
      - ./conf/identity-schema.json:/etc/config/identity-schema.json:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:4433/health/ready"]
      interval: 3s
      retries: 30
    networks:
      mgmt:

  hydra-migrate:
    image: oryd/hydra:v2.3.0
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DSN: "postgres://postgres:e2e-postgres-password-fixed-1234@postgres:5432/hydra?sslmode=disable"
    command: ["migrate", "-c", "/etc/config/hydra.yaml", "sql", "up", "-e", "--yes"]
    volumes:
      - ./conf/hydra.yaml:/etc/config/hydra.yaml:ro
    restart: "no"
    networks:
      mgmt:

  hydra:
    image: oryd/hydra:v2.3.0
    depends_on:
      hydra-migrate:
        condition: service_completed_successfully
    environment:
      DSN: "postgres://postgres:e2e-postgres-password-fixed-1234@postgres:5432/hydra?sslmode=disable"
      SECRETS_SYSTEM: "e2e-hydra-system-secret-fixed-32xxx"
      SECRETS_COOKIE: "e2e-hydra-cookie-secret-fixed-32xxx"
    command: ["serve", "all", "-c", "/etc/config/hydra.yaml", "--dev"]
    volumes:
      - ./conf/hydra.yaml:/etc/config/hydra.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:4444/health/ready"]
      interval: 3s
      retries: 30
    networks:
      mgmt:

  selfservice-ui:
    image: oryd/kratos-selfservice-ui-node:v1.3.1
    depends_on:
      kratos:
        condition: service_healthy
    environment:
      KRATOS_PUBLIC_URL: "http://kratos:4433"
      KRATOS_BROWSER_URL: "https://auth.localhost.test"
      HYDRA_ADMIN_URL: "http://hydra:4445"
      COOKIE_SECRET: "e2e-ui-cookie-secret-fixed-32xxx"
      CSRF_COOKIE_NAME: "ui_csrf"
      CSRF_COOKIE_SECRET: "e2e-ui-csrf-secret-fixed-32xxxx"
      BASE_URL: "https://auth.localhost.test"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:3000/health/alive"]
      interval: 3s
      retries: 30
    networks:
      mgmt:

  netbird-mgmt:
    # The image namespace is GHCR_ORG. run.sh exports it: the caller's value,
    # else ghcr_org from ops/ansible/group_vars/all.yml, the namespace this
    # checkout deploys from.
    image: ghcr.io/${GHCR_ORG:?run this stack through run.sh, or export GHCR_ORG (the image namespace)}/netbird-mgmt@sha256:0122a19060141e573e02e4faf1581406ce2e6059965661383c80cd7475f7fe73
    depends_on:
      postgres:
        condition: service_healthy
      hydra:
        condition: service_healthy
    environment:
      NETBIRD_STORE_ENGINE_POSTGRES_DSN: "host=postgres user=postgres password=e2e-postgres-password-fixed-1234 dbname=netbird sslmode=disable"
      NETBIRD_MIGRATION_MARKER: "/opt/netbird-ha/migrations.allow"
      NETBIRD_RUN_MIGRATIONS: "true"
    volumes:
      - ./conf/management.json:/etc/netbird/management.json:ro
    healthcheck:
      # The netbird-mgmt image above was rebuilt
      # without wget (slimmed) — the prior `CMD-SHELL` wget probe fails
      # immediately with "executable file not found in $PATH". Image
      # DOES ship bash + grep, so use bash's /dev/tcp builtin to send a
      # raw HTTP/1.0 GET and assert the `setup_required` field appears
      # in the body. Same semantics as the original wget+grep, runs
      # entirely in shell builtins. (Caught when CI for PR #77 surfaced
      # this previously-silent breakage; netbird-dashboard E2E had been
      # red on main .)
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/80 && printf 'GET /api/instance HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q setup_required <&3"]
      interval: 3s
      retries: 30
    networks:
      mgmt:

  dashboard:
    image: netbirdio/dashboard:latest
    depends_on:
      hydra:
        condition: service_healthy
    environment:
      AUTH_AUTHORITY: "https://oauth2.localhost.test/"
      AUTH_AUDIENCE: "netbird-dashboard"
      AUTH_CLIENT_ID: "netbird-dashboard"
      AUTH_CLIENT_SECRET: "e2e-dashboard-client-secret-fixed"
      AUTH_SUPPORTED_SCOPES: "openid profile email offline_access"
      AUTH_REDIRECT_URI: "/peers"
      AUTH_SILENT_REDIRECT_URI: "/silent-auth"
      NETBIRD_TOKEN_SOURCE: "accessToken"
      USE_AUTH0: "false"
      NEXTAUTH_URL: "https://dashboard.localhost.test"
      NETBIRD_MGMT_API_ENDPOINT: "https://mgmt.localhost.test"
      NETBIRD_MGMT_GRPC_API_ENDPOINT: "https://mgmt.localhost.test"
      NETBIRD_HOTLOAD: "false"
      SITE_ID: "e2e"
      ROUTER_ROLE: "a"
    networks:
      mgmt:

  traefik:
    image: traefik:v3.7.16@sha256:1336e85aaed293bd63d005086e0dd013b04078b26aaeb1c18b26a2f928af7e65
    depends_on:
      kratos:
        condition: service_healthy
      hydra:
        condition: service_healthy
      selfservice-ui:
        condition: service_healthy
      netbird-mgmt:
        condition: service_healthy
      dashboard:
        condition: service_started
    command:
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.websecure.address=:443"
      - "--ping=true"
      - "--log.level=INFO"
      - "--accesslog=true"
    ports:
      # 443 host-side matches the implicit-port URLs in Hydra OIDC
      # redirects + cert SANs + DASHBOARD_BASE_URL — Playwright dials
      # `https://dashboard.localhost.test/` which is port 443. Older
      # `8443:443` mapping forced a port-suffixed BASE_URL that
      # diverged from every other URL in the stack. GH-Actions runner
      # has 443 free; dev-laptop users can override via the
      # `DASHBOARD_E2E_HOST_HTTPS_PORT` env-var if 443 collides.
      - "127.0.0.1:${DASHBOARD_E2E_HOST_HTTPS_PORT:-443}:443"
    volumes:
      - ./conf/traefik-dynamic.yml:/etc/traefik/dynamic/traefik-dynamic.yml:ro
      - ./conf/tls:/etc/traefik/tls:ro
    healthcheck:
      # Traefik v3 images are FROM scratch — no shell, no wget. The
      # canonical probe is the `traefik healthcheck` subcommand against
      # the `--ping` endpoint enabled in `command:` above. Older
      # `CMD wget http://localhost:8080/ping` healthcheck was broken
      # twice over: wget not in image + 8080/ping not exposed (no
      # `--ping=true` flag).
      test: ["CMD", "traefik", "healthcheck", "--ping=true"]
      interval: 3s
      retries: 10
    networks:
      mgmt:
        aliases:
          - dashboard.localhost.test
          - mgmt.localhost.test
          - oauth2.localhost.test
          - auth.localhost.test

networks:
  mgmt:
    driver: bridge
