---
# signal-federation-canary role defaults. Per-site overrides in group_vars.
#
# .github/workflows/signal-federation-probe-image.yml publishes this image to
# ghcr.io/<repository owner>/signal-federation-probe on every push to main that
# changes ops/signal-federation-probe/. Pinned by digest to the build it
# published from this repository's current source (ghcr_org usareur-af). A
# goatnet pulling from another namespace overrides signal_federation_probe_image
# with a digest published there: the digest is what docker pulls, so a pin
# from one namespace does not resolve in another.
signal_federation_probe_image: "ghcr.io/{{ ghcr_org }}/signal-federation-probe:sha-65d0b96@sha256:2915fe3ba58ae49f956dbf6317a35d4df3e81693c93c8b630ae311ee1ee780e7"
signal_federation_canary_target: "localhost:10000"
signal_federation_canary_interval: "60s"
signal_federation_canary_metrics_addr: ":9091"

# REQUIRED per-site override (no default — must be set):
#   signal_federation_canary_remote_key: "<wg-pubkey-of-stable-peer-at-federation-peer-site>"
