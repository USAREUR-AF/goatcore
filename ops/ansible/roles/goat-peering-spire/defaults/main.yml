---
# Defaults for `goat-peering-spire` — ADR 1157 step 2: each side federates the other's
# SPIRE trust domain. Recognition only: what the partner may do stays the edge's ACL.
#
# Design: docs/design/federated-trust-model.md,
#         docs/design/cross-sovereign-federation.md §2 and §10
#
# Off by default. A side with no SPIRE server leaves this false, and the play says the
# step was not done. A goatnet's own server is deployed by roles/spire with
# spire_federation_enabled: true, which serves the bundle endpoint this role relies on.
peering_spire_enabled: false

# The inventory host running the spire-server container, and its CLI there.
peering_spire_server_host: ""
peering_spire_container: spire-server
peering_spire_bin: /opt/spire/bin/spire-server

# Where this edge host reaches our own bundle endpoint (spire_federation_bundle_endpoint_port).
peering_spire_server_addr: ""
peering_spire_bundle_port: 8443

# The bundle endpoint has to be reachable between domains, inside the tunnel
# (cross-sovereign-federation.md §10). Two forwards on the edge host, because neither
# server has a route to the link:
#   inbound   <our link ip>:<bundle port>  -> our server
#   outbound  <listen address>:<local port> -> <their link ip>:<bundle port>
# TLS passes through both untouched: https_spiffe authenticates the far server by its
# own SVID, so the forwards see ciphertext and vouch for nothing.
# Empty: the source address of this edge's route to peering_spire_server_addr
# (tasks/outbound-listen.yml), the address that server's dial arrives on.
peering_spire_outbound_listen: ""
# Every peering on one edge host forwards outbound on peering_spire_outbound_listen, so
# each needs its own port here; the role refuses one another peering already listens on.
peering_spire_outbound_port: 18443

# From the agreement, through federation-<them>-transport.yml.
peering_spire_partner_trust_domain: "{{ goat_peering_partner_trust_domain | default('') }}"
peering_spire_local_link_ip: "{{ goat_peering_local_link_ip | default('') }}"
peering_spire_remote_link_ip: "{{ goat_peering_remote_link_ip | default('') }}"

peering_spire_our_bundle_file: "{{ fed_work | default('') }}/ours.spiffe-bundle"
peering_spire_their_bundle_file: "{{ fed_work | default('') }}/theirs.spiffe-bundle"
# Phase 13 imports the exchanged bundle only when our server holds none for the
# partner, or the file's spiffe_sequence is newer than the held one's: the refresh
# from the partner's bundle endpoint keeps the held one current (tasks/bundle-import.yml).
# true imports the file over any held bundle, for a partner whose SPIRE server was
# rebuilt with new keys, confirmed on the call.
peering_spire_bundle_replace: false

# The partner these forwards serve, in their unit names: goat-peering-bundle-in-<partner>
# and goat-peering-bundle-out-<partner>. One edge host can carry several peerings, and
# each has its own pair of forwards; a fixed name would make the second peering replace
# the first's. Rendered by `goat federate apply` (federation-<them>-transport.yml).
peering_spire_partner_id: "{{ goat_peering_partner_sovereign | default('') }}"

