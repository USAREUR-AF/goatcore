---
# Defaults for the `compliance-proxy` role — Stage-2 mesh front for the
# cloud compliance dashboard (ADR 1029 + docs/design/compliance-dashboard-mesh-fronting.md).
#
# Mirrors `oauth2-proxy-dashboard` (OIDC login vs site Hydra, group-gated),
# but the upstream is an `aws-sigv4-proxy` sidecar that SigV4-signs to the
# AWS_IAM-locked Lambda Function URL instead of a local container. Brings up
# `compliance.<site>.<zone>` mesh-only — the dashboard moves off the ALB and
# behind the mesh (Stage 2), the ALB retires.
#
# SHELF-READY: deploy only when the env is at Stage 2 — the usareur-af-infra
# Function URL must exist (enable_function_url=true) and grant this proxy's
# invoke credential (function_url_invoke_principal_arns).
#
# Inputs (set in group_vars/<site>_hosts/vars.yml + env):
#   - compliance_proxy_enabled: true
#   - compliance_proxy_oidc_client_secret           env-sourced, 32+ chars (Hydra client `oauth2-proxy-compliance`)
#   - compliance_proxy_cookie_secret                env-sourced, 16/24/32 bytes b64
#   - compliance_function_url_host                  e.g. <id>.lambda-url.eu-central-1.on.aws (no scheme)
#   - compliance_function_url_region                e.g. eu-central-1
#   - compliance_invoke_aws_access_key_id / _secret env-sourced, scoped lambda:InvokeFunctionUrl cred
#   - site_id, site_dns_zone

compliance_proxy_compose_file: /opt/mgmt-host/docker-compose.compliance-proxy.yml
compliance_proxy_envfile: /opt/mgmt-host/oauth2-proxy-compliance.env

# oauth2-proxy image — digest-pin on first live deploy (ADR 0859); plain tag
# while shelf-ready. Driven via /opt/mgmt-host/.env compose substitution +
# tracked in deploy-history.yml. The aws-sigv4-proxy image is pinned inline in
# the compose overlay's ${AWS_SIGV4_PROXY_IMAGE:-...} default — kept out of the
# role-default *_image vars so the single-image deploy-history-check passes.
oauth2_proxy_compliance_image: "quay.io/oauth2-proxy/oauth2-proxy:v7.6.0@sha256:dcb6ff8dd21bf3058f6a22c6fa385fa5b897a9cd3914c88a2cc2bb0a85f8065d"

compliance_proxy_fqdn: "compliance.{{ site_id }}.{{ site_dns_zone }}"
compliance_proxy_cookie_domain: "{{ compliance_proxy_fqdn }}"

# Site Hydra issuer + client (companion oidc-client registration required —
# same shape as oauth2-proxy-dashboard-oidc-client). Trailing slash required.
compliance_proxy_oidc_issuer_url: "https://oauth2.{{ site_id }}.{{ site_dns_zone }}/"
compliance_proxy_oidc_client_id: "oauth2-proxy-compliance"

# The authz predicate — access to the cloud compliance dashboard is the
# `COMPLIANCE` group, granted/revoked via `goat admin onboard` (ADR 1029).
compliance_proxy_allowed_groups: "COMPLIANCE"

# The Traefik route file's name before it became compliance.yml, removed from
# the host on deploy. Empty removes nothing; a goatnet whose hosts once carried
# the route under another name sets that name in its group_vars.
compliance_proxy_traefik_dynamic_filename_legacy: ""

# On-host DNS override for the OIDC issuer.
compliance_proxy_oidc_host_entry: "oauth2.{{ site_id }}.{{ site_dns_zone }}:{{ mesh_ip_a }}"

# AWS Function URL the sigv4 proxy signs to (no defaults — fail-closed,
# per-env Class-A values; set at Stage-2 enable).
compliance_function_url_host: ""
compliance_function_url_region: ""
