---
# Defaults for the goat-zenoh-portal role.
#
# Variables that MUST be set per-host or per-environment:
#   - portal_operator_api_key (passed via env var PORTAL_OPERATOR_API_KEY)
#   - site_dns_zone (used to derive portal_traefik_host)

# Image — portal_image has NO role default. The pin of record is the
# `goat-zenoh-portal` row of ops/pins/fleet-pins.yaml, rendered into
# group_vars/<member>/pins.yml; group_vars/all.yml carries the pin for hosts
# outside the pin table. A bump prepends a row to
# roles/goat-zenoh-portal/deploy-history.yml (ADR 0859).
portal_listen_port: 8090
portal_container_name: "goat-zenoh-portal"

portal_data_dir: "/opt/goat-zenoh-portal"
# The SQLite registry. Read by the server only while portal_store is sqlite (the
# goat-zenoh-portal-store role's default, ADR 1165 step A); on a goatnet cut over
# to Postgres it is the read-only archive the cutover left in place.
portal_db_path: "{{ portal_data_dir }}/registry.db"
portal_bundles_path: "{{ portal_data_dir }}/bundles"
# By-anchor PUBLIC recipient-cert store (U7 publish-my-key distribution): every
# mint/rotation drops the public leaf at <dir>/<anchor>.pem and
# GET /api/access/recipient-cert serves it to grant-keyd. Under portal_data_dir
# (already host-mounted) so it persists across redeploys with no extra bind.
# The binary's upstream default is /var/lib/goat-zenoh-portal/recipient-keys —
# NOT mounted by this role, so it must be overridden here like the schema dir.
portal_recipient_keys_path: "{{ portal_data_dir }}/recipient-keys"
# Block 85 portal-schema-publishing store. Defaults to a subdir of
# portal_data_dir (which is already host-mounted into the container)
# so the schemastore can write without a separate volume. The binary's
# upstream default is /var/lib/goat-zenoh-portal/schemas — NOT mounted
# by this role, so leaving it default crashes the container on first
# POST /api/vendors/.../schemas with "mkdir … permission denied."
portal_schema_dir: "{{ portal_data_dir }}/schemas"

# Service operator-key store (machine credentials, not human per-person keys).
# A service's OWN role writes its key here (under portal_data_dir, already
# host-mounted + persistent) so a portal redeploy from any operator laptop can
# never drop it — the fix for the runner-key fragility. Read by the portal via
# PORTAL_OPERATOR_API_KEYS_DIR, merged with the env keys (env wins on conflict).
portal_operator_keys_dir: "{{ portal_data_dir }}/operator-keys.d"
# Live re-read of that directory (portal internal/config/operator_key_store.go).
# 30s is chosen to be short enough that "I approved your key" and "it works" are
# the same conversation, and long enough that the poll is invisible. Env keys
# stay frozen at boot regardless — they are the break-glass tier.
portal_operator_keys_reload_interval: "30s"

# Identity-grammar Phase B — the declared-half principal-graph registry
# (generated by ops/operators/gen-roster.py) the Data-Access COP reconciles
# live identities against. Placed inside portal_data_dir (already
# host-mounted) so no extra bind-mount is needed.
# Set to "" to disable (the COP then reports the gap and identities reconcile
# to unknown rather than active/cut-off).
portal_roster_path: "{{ portal_data_dir }}/roster.json"

# WHICH GOATNET'S ROSTER THIS HOST IS SERVED. ADR 1172: identity does not cross
# a goatnet boundary, so a host receives docs/operators/<portal_roster_env>/
# roster.json — the people that goatnet itself admitted — and never the
# controller-side union at docs/operators/roster.json, which spans every
# environment. Deliberately EMPTY here: a goatnet names itself in its own
# group_vars, and a host that has not is refused rather than defaulted, because
# every wrong default in this variable ships one environment's people into
# another. Empty is also how a goatnet with no manifest folder yet opts out of
# the roster entirely (the COP then reports the gap, per portal_roster_path).
portal_roster_env: ""

# ADR 1027 (data-access program B2) — the declared release-set registry
# (ops/permissions/release-sets.yaml) the Data-Access COP reveals as the
# release-governance picture (org → release lane). Placed inside
# portal_data_dir (already host-mounted). Declarative reveal only — reads stay
# flat until the B2.1 read partition enforces. Set to "" to disable (the COP
# then notes release-set membership is not declared).
portal_release_sets_path: "{{ portal_data_dir }}/release-sets.yaml"

# This goatnet's own release sets, declared in its group_vars (e.g.
# group_vars/<site>_hosts/data-access.yml). Same shape as the release_sets
# list in ops/permissions/release-sets.yaml:
#   portal_release_sets:
#     - set: REL-ALL
#       prefix: release/REL-ALL/   # optional, defaults to release/<set>/
#       members: []                # org ids; optional, defaults to []
# Non-empty => the role renders portal_release_sets_path from this list
# (templates/release-sets.yaml.j2). Empty => the deploy STOPS, unless
# portal_release_sets_use_example says to install the example registry
# ops/permissions/release-sets.yaml. List every lane the goatnet's
# zenoh_release_writers / zenoh_partner_read_lanes / zenoh_partner_slot_blocks
# name, or the COP will not show it.
portal_release_sets: []

# true installs the example registry ops/permissions/release-sets.yaml (the
# example goatnet's sets) when portal_release_sets is empty. True by default
# only on the example goatnet (zagros, zagros-*), which keeps the committed
# file; a learning box sets it on purpose. Anywhere else an empty
# portal_release_sets fails the deploy (tasks/release-sets-guard.yml) rather
# than showing another goatnet's release lanes as this one's.
portal_release_sets_use_example: "{{ (site_id | default('')) is match('^zagros(-|$)') }}"

# ADR 1138 portal half — the pre-cut partner slot blocks, RENDERED FROM THE SAME
# group_var the router reads (`zenoh_partner_slot_blocks`). One fact, one home:
# if these two ever disagree the portal hands a partner a slot the router does
# not treat as a partner slot, and that partner reads the whole fabric silently.
# Rendering rather than hand-maintaining a second copy is the point.
# Empty declaration => the portal REFUSES a partner mint rather than issuing an
# ordinary slot.
portal_partner_slot_blocks_path: "{{ portal_data_dir }}/partner-slot-blocks.yaml"

# ADR 1077 (data-access program B2.2) — the coalition frameworks registry. With
# portal_roster_path, the COP derives the member release lane (REL-COALITION)
# from onboarded orgs' nations vs the active framework, so a coalition member
# auto-appears in the lane without a hand edit of release-sets.yaml. Empty
# disables the derivation. portal_coalition_framework = the goatnet's ACTIVE
# framework (e.g. "nato"); empty uses the registry default_framework.
portal_coalition_frameworks_path: "{{ portal_data_dir }}/coalition-frameworks.yaml"
portal_coalition_framework: ""

# ADR 1075 — the per-goatnet access lane an UNLABELED producer inherits
# (community | org | controlled). The ratified sandbox default is community
# (a producer that stamps nothing is surface-readable by every authenticated
# viewer). Operational goatnets override to org or controlled in group_vars;
# the portal validates this at startup and refuses an out-of-enum value.
portal_data_label_access_default: "community"

# Org data-governance starting posture (ADR 1102, GovernBootstrapOpen). true =
# kick-start OPEN (any member of a not-yet-nominated org may govern it; orgs
# narrow themselves); false = canonical fail-closed (only nominated admins
# govern). Default true preserves current behavior; a goatnet closes it
# deliberately once its orgs have named admins.
portal_govern_bootstrap_open: true

# Zenoh router co-located on the same host. The portal proxies reads
# through the REST plugin AND applies marker-based incremental ACL +
# storage edits to the live config.json5, then SIGHUPs the router
# container via the Docker Engine API over the mounted socket.
#
# Previously the portal wrote to a separate access_control.json5
# (pre-F-124 architecture) AND used the deprecated cert_uri_san_*
# subject shape (rejected by zenoh-config 1.9.0). Both broken paths
# silently no-op'd; every portal-minted vendor relied on operator
# add-vendor.sh fired by hand. The new wiring closes the gap.
portal_zenoh_rest_url: "http://zenohd:8000"

# Identity model (ADR 1025). "per-vendor" (onboarding renders a
# per-vendor ACL rule + SIGHUPs the router) or "per-uuid-slot-pool"
# (onboarding allocates a pre-baked slot + mints CN=<anchor>, no
# ACL edit, no restart). MUST agree with the router role's
# zenoh_identity_model on the same goatnet.
portal_identity_model: "per-vendor"

# Per-uuid slot pool (consulted only when portal_identity_model ==
# "per-uuid-slot-pool"). The salt MUST be byte-for-byte identical to the
# router role's zenoh_slot_pool_salt (the anchor is sha256("<salt>:<k>")
# [:32] on both sides — a mismatch means every minted cert matches no
# router rule and writes nothing) and distinct per goatnet. The size MUST
# equal the router's zenoh_slot_pool_size. NOTE: the portal bakes the pool
# into its SQLite once at first boot; bumping the size later is a no-op on
# an existing DB (pool growth is a deliberate migration, not a config
# bump) — size the pool correctly the first time.
portal_slot_pool_salt: ""
portal_slot_pool_size: 0
# Lazy slot storage: MUST match the router's zenoh_lazy_slot_storage. When true,
# the portal live-adds a slot's <anchor>/** store at mint (the router no longer
# pre-cuts a store per pool slot). See zenoh-storage-taxonomy-sharding.md.
portal_lazy_slot_storage: false

# Path to the live zenohd config.json5 (bind-mounted r/w into the
# portal container). The zenoh role renders this file under its per-stack
# /etc/<zenoh_stack> dir with BEGIN/END markers the portal edits between
# Unused/dormant in per-uuid-slot-pool mode —
# the ACL is fully baked by ansible; the portal does no ACL render there.
portal_acl_config_path: "/etc/{{ zenoh_stack | default('goat-zenoh') }}/config.json5"

# Docker container running zenohd; receives SIGHUP after each ACL edit.
portal_acl_container_name: "{{ zenoh_stack | default('goat-zenoh') }}-router"

# Docker socket — bind-mounted into the portal container so the Go
# code can POST to the Engine API to send SIGHUP. Trust boundary:
# the portal is the control plane for vendor onboarding, so it owning
# this surface is in line with its responsibility scope.
portal_acl_docker_socket: "/var/run/docker.sock"

# Rocksdb parent dir the per-vendor storage stanza references. Must
# match the directory the goat-zenoh role bind-mounts into the
# zenohd container (so zenohd sees the storage files the portal
# provisioned).
portal_acl_storage_dir_prefix: "/var/lib/{{ zenoh_stack | default('goat-zenoh') }}/rocksdb"

# Skip the SIGHUP step (the marker edit still runs). Default false —
# in production the portal owns end-to-end vendor wiring.
portal_acl_reload_fake: false

# F-156 live config reload via Zenoh admin-REST. When set + the router
# has adminspace.permissions.write: true (the goat-zenoh role
# default since this finding closed), the portal's vendor-mint flow
# live-adds the per-vendor storage stanza via admin-space PUT instead
# of relying on SIGHUP (which zenohd 1.9.0 ignores). Best-effort: if
# the router rejects the write, mint still succeeds (on-disk edit in
# place) but the change requires a router restart to take effect.
# Empty string disables. The container resolves goat-zenoh-router
# via the docker network the portal and router share.
portal_acl_admin_rest_url: "http://{{ zenoh_stack | default('goat-zenoh') }}-router:8000"

# Cert-mint shell-out. The CA root and age identity must already be
# present at these paths on the host; the role bind-mounts them
# read-only into the container.
portal_ca_bundle_dir: "/etc/{{ site_id }}-ca"   # a shared role must not name a goatnet
# Controller-side sources for the Path-B CA bundle + age identity, staged onto
# the host by the role (real-mint mode). Per-goatnet, derived from site_id — the
# CA key + age identity live on the operator laptop, never in the repo.
portal_ca_root_src: "{{ playbook_dir }}/../enrollment/ca/{{ site_id }}/root-cert.pem"
portal_ca_key_src: "{{ goat_controller_state_dir | default(lookup('env', 'HOME') ~ '/.goat/state') }}/{{ site_id }}-ca/ca.key.age"
portal_age_identity_src: "{{ lookup('env', 'HOME') }}/.config/age/keys.txt"
portal_age_identity_path: "/etc/{{ site_id }}-age/keys.txt"   # a shared role must not name a goatnet
portal_ca_root_cert: "/etc/{{ site_id }}-ca/root-cert.pem"   # a shared role must not name a goatnet
# The portal flag that takes portal_ca_root_cert. A goatnet whose pinned image
# predates --ca-root-cert sets the flag that image reads.
portal_ca_root_cert_flag: "--ca-root-cert"
portal_onboarding_packet_path: "/etc/goat-zenoh-portal/zenoh-trial-onboarding.md"
portal_cert_sign_ca_id: ""   # REQUIRED per goatnet — a shared default
# would sign certs for a new goatnet under ANOTHER goatnet's authority.
portal_cert_sign_site_id: "{{ site_id }}"   # a shared role must not name a goatnet
# Subject O of every leaf the portal mints, passed as cert-sign --org. Read
# from goat_cert_organization (group_vars/all.yml), the same fact the operator
# plays state on their cert-sign calls, so a cert-sign built from this tree
# stamps the goatnet's organisation rather than its built-in default. Empty
# omits the flag and leaves cert-sign's default.
portal_cert_sign_org: "{{ goat_cert_organization | default('') }}"
# Per-goatnet cert identity + onboarding-filename strings. Each goatnet MUST
# override these in its group_vars so its minted certs + tarballs carry its own
# names. The URI-SAN prefix in particular is frozen
# into every cert and pinned by external integrations — set it before the first
# external org mints. See docs/design/portal-lexicon.md §"Cert identity layer".
# portal_cert_sign_uri_prefix has no default: the compose template falls back
# to portal_cert_sign_uri_prefix_default, which only this role reads, so a role
# that requires the goatnet's own prefix (grant-keyd) refuses when the goatnet
# sets none.
portal_cert_sign_uri_prefix_default: "urn:goat:{{ site_id }}:org="
portal_cert_sign_cn_suffix: "-trial-peer"        # per-vendor-mode CN suffix; slot-pool mode ignores it (CN = bare anchor)
portal_cert_sign_dns_suffix: "{{ site_id }}.peer"   # a shared role must not name a goatnet    # DNS-SAN suffix: client.<principal>.<suffix>
portal_onboarding_packet_name: "zenoh-trial-onboarding.md"  # in-tarball onboarding packet filename
portal_onboarding_tarball_stem: "{{ site_id }}-onboarding"   # a shared role must not name a goatnet      # minted tarball filename stem
portal_onboarding_root_cert_name: "{{ site_id }}-ca-root.pem"   # a shared role must not name a goatnet   # in-tarball CA root cert filename
# Set true to skip real cert-sign (returns stub cert + tarball). Use only
# on a host without a cert-sign that supports --uri-san.
portal_cert_sign_fake: false

# Path to the bundle-create binary on the host (bind-mounted into the
# container). When set, the portal mints the goat-cli profile bundle
# (.cbor) into the vendor tarball with the same CA it uses for
# cert-sign, so the vendor gets a one-command `goat profile init` with no
# separate hand-delivered file.
#
# Empty by default = OFF: the .cbor is omitted (graceful) and the bind-
# mount is skipped, so a routine portal redeploy is safe even before the
# binary exists. To ENABLE: (1) place a native-arch bundle-create at the
# path below on the host (same as cert-sign — see role README), then
# (2) set portal_bundle_create_bin to that path in group_vars and redeploy.
# Enabling before the binary is placed would fail the container's bind-mount.
portal_bundle_create_bin: ""

# The PUBLIC key of the CA that signs the .cbor, staged on the host and shipped
# in the onboarding tarball beside the bundle it verifies.
#
# goat-cli 0.4.45 onward compiles in no CA root. Before that a release
# carried exactly one goatnet's key, so a bundle from any other goatnet failed
# to install with an error that reads like file corruption. Roots are
# operator-supplied now — one binary works against every goatnet — which makes
# it this role's job to hand the recipient the matching root. NOTES.md tells
# them to check the fingerprint out of band; shipping the file is convenience,
# not an assertion of trust.
#
# DERIVED, not declared: bundle-create is invoked with --ca-id
# {{ portal_cert_sign_ca_id }} (certmint.go passes Minter.CAID through), so the
# verifying key is public-keys/<that id>.pem by construction. Deriving it means
# a CA rotation is one variable, and a goatnet cannot end up shipping the root
# for a CA it does not sign with.
portal_bundle_ca_pubkey_src: "{{ playbook_dir }}/../enrollment/public-keys/{{ portal_cert_sign_ca_id }}.pem"
portal_bundle_ca_pubkey: "/opt/goat-zenoh-portal/bundle-ca.pem"


# Host path the ACL taxonomy is staged at, bind-mounted into the container at
# /ops/ansible/netbird_acl_taxonomy.yml when bundle-create is enabled. Only
# consulted on that path; irrelevant when portal_bundle_create_bin is "".
portal_acl_taxonomy_host_path: "/opt/goat-zenoh-portal/netbird_acl_taxonomy.yml"

# Operator API key — Bearer token authorizing /api/vendors POST + system
# topic management. Startup requires this bearer or a nonempty named key map;
# the role validates both formats before rendering.
# Read from <SITE>_PORTAL_OPERATOR_API_KEY (site_id upper-cased, - -> _), never
# the bare name: a bare name is whichever goatnet's key the shell exported, so
# one goatnet's root key reaches another's portal. Empty refuses at deploy.
portal_operator_api_key: "{{ lookup('env', (site_id | upper | replace('-', '_')) ~ '_PORTAL_OPERATOR_API_KEY') }}"  # or: PORTAL_OPERATOR_API_KEYS
# Per-person operator keys — comma-separated `handle:key` pairs from
# env PORTAL_OPERATOR_API_KEYS. Optional + additive: the portal merges these
# with the legacy single key above (which maps to handle `operator`), so the
# read-only inspection surfaces (panoscope/stethoscope/flashlight) keep using
# PORTAL_OPERATOR_API_KEY while named operators get per-person attribution in
# audit_events. Empty = legacy single-key behaviour unchanged.
portal_operator_api_keys: "{{ lookup('env', (site_id | upper | replace('-', '_')) ~ '_PORTAL_OPERATOR_API_KEYS') | default('', true) }}"
# Handles a deploy may deliberately drop from PORTAL_OPERATOR_API_KEYS. Empty =
# a run that would drop any handle refuses. Set per run with -e, never
# in group_vars: a standing allow-list is the silent revocation this guards.
portal_operator_keys_allow_removal: []
portal_operator_approval_required: true

# Kratos admin URL — site-Kratos /admin endpoint the portal queries to
# render the per-vendor identity roster on /admin/vendor-activity.html
# (Block 83 / 83C.4). Optional: when empty, the admin page renders
# activity counts without the identity-roster column and gap-notes the
# absence inline. Kratos admin port has no bearer auth on the trial
# fabric — network segmentation is the gate (the portal lives on the
# same docker network as Kratos). Default empty so existing
# sites stay unchanged on apply; opt in per-site via group_vars.
portal_kratos_admin_url: ""

# Sunset banner shown in the UI. Empty = no banner. Format whatever you
# want; e.g. "" or "Friday 14 July 2026".
portal_sunset_date: ""

# Vendor-facing tarball-render parameters. The portal substitutes these
# into the in-tarball onboarding doc and bakes them into the worked
# first-publisher.py example, so vendors don't have to ask the operator
# what the router endpoint is or how to wire mTLS.
#
# Default: the router's mesh DNS hostname (resolved by mesh CoreDNS; cert minted
# with matching DNS SAN). Vendors connect by hostname, TLS hostname verification
# stays on, and the mesh IP can move without re-minting the router cert.
# Set portal_public_url + portal_feedback_channel per-site as needed;
# both default to empty (in which case NOTES.md emits an "ask operator"
# placeholder).
# DERIVED, never a literal. This value is baked into every partner's onboarding
# tarball (NOTES.md, first-publisher.py, the goat-cli .cbor) as the router they
# dial — so a wrong value does not fail loudly, it points a partner's Zenoh
# client at ANOTHER GOATNET'S FABRIC.
#
# A shared role default hardcoded to one goatnet's router is fail-open: a goatnet
# that forgets to override it mints real partner bundles pointing at the other
# goatnet (instance-variability-model.md §3 names this class).
#
# Deriving from site_id + site_dns_zone makes a NEW goatnet correct by
# construction instead of correct-if-someone-remembered. A site whose router is on
# a different name still overrides.
portal_router_endpoint: "tls/zenoh.{{ site_id }}.{{ site_dns_zone }}:7447"
portal_public_url: ""
# OPTIONAL onboarding-engine URL (goat-id-console) baked into minted goat-cli
# bundles as onboard_endpoint (docs/design/onboarding-extraction-plan.md). Set
# per-site to https://onboard.<site>.<zone> where the onboard route exists;
# empty on goatnets without it (CLI falls back to the portal endpoint).
portal_onboard_url: ""
portal_feedback_channel: ""

# ADR 1062 three-stage candidate onboarding — the PUBLIC front-desk base URL
# one-time invite links are built against (e.g. https://intake.<zone>).
# Empty (default) is correct for step 1 (mesh-side invite mint only): invite
# mint returns a relative intake_path and never fabricates an absolute URL. The
# public collector (step 2) sets this per-goatnet once the front desk exists.
portal_intake_base_url: ""

# Vendor-progress swimlane (Block 88; docs/design/portal-vendor-progress.md).
# Each substrate degrades to no-op when its env var resolves empty: the
# swimlane just shows "—" cells for the disabled column. Operator can
# light up L2 / L3+L4 independently.
#
# L2 — netbird-mgmt peer poll.
# DERIVED off this site's identity (NOT a hardcoded literal) so a forked
# goatnet cannot silently poll another goatnet's mgmt with its token. The mgmt
# apex is the site's enrollment zone (`netbird.<...>` apex = site_dns_zone); the
# token env var follows the per-site `<SITE>_NB_API_TOKEN` convention used in
# .envrc.local.d (site-a→SITE_A). replace('-','_') keeps the
# env-var name shell-legal for hyphenated site_ids.
portal_netbird_mgmt_url: "https://{{ site_dns_zone }}"
portal_netbird_api_token_envvar: "{{ site_id | upper | replace('-', '_') }}_NB_API_TOKEN"
# The name the token carries INSIDE the container (portal.env). A goatnet whose
# pinned image predates PORTAL_NETBIRD_API_TOKEN sets the name that image reads,
# or a list of names: portal.env then carries the token under each, and any of
# the images reads its own.
portal_netbird_api_token_env: "PORTAL_NETBIRD_API_TOKEN"
# Where the NetBird management hostname in portal_netbird_mgmt_url points INSIDE the container.
# On a mgmt host `mesh-coredns` pins that name to 127.0.0.1 in /etc/hosts, and
# Docker's embedded DNS hands the host resolver's answer to containers, where it
# arrives as `CNAME localhost.` and glibc discards it. Inside a container
# 127.0.0.1 would be the container anyway. So the name is pinned to
# `host-gateway`, the host, where traefik publishes :443 for it. Without the pin
# every NetBird read fails with `error sending request`. Never a bridge or mesh IP; ""
# drops the pin for a host whose traefik does not serve the name.
portal_netbird_host_addr: "host-gateway"
portal_netbird_poll_interval: "60s"
#
# ADR 1116 §9 — machine-mint mesh wiring (machine-enrollment.md §"The mesh
# half"). The goatnet's NetBird group-name prefix, DERIVED from site_id so it
# has one home, never hand-typed per site. KEEP THE HYPHEN: this is a group-name
# prefix (site-a → SITE-A), not an env-var name — do NOT copy the
# replace('-','_') the token envvar above uses. The derivation only
# coincidentally equals netbird_acl_taxonomy.yml's site_prefix: a site_id and its
# taxonomy prefix can differ, so the role preflight-asserts equality against the taxonomy before
# rendering, and ops/ci/check-gear-class-parity.py asserts the same statically.
portal_mesh_site_prefix: "{{ site_id | upper }}"
# Default OFF: with mint off the derived groups still travel in the enroll
# response and a human assigns exactly them; on, the portal mints the one-off
# single-use setup key itself. Flipped per-goatnet in group_vars, never here.
portal_mesh_key_mint_enabled: false
# How long a minted machine setup key stays usable — the window to JOIN, not
# the peer's lifetime (the key is single-use + group-exact). Goatnets override
# to 720h where keys are hand-carried to a site; the role
# default matches the binary's own 24h.
portal_mesh_key_ttl: "24h"
# Persistent SITE scopes (netbird_exercises rows WITHOUT an `ex-` prefix) that
# this goatnet's mint may scope a machine key to, named one by one. Empty is
# the default and the safe state: a site rung is only mintable once someone
# decides it should be, and naming each row keeps every OTHER site rung on the
# same mgmt server out of the map. Widening the template's filter instead would
# arm them all silently.
#
# The hazard that originally kept every site rung out is cleared: ADR 1124 made
# a site's reach to its host site a RULE rather than a second membership, so a
# key carrying only <SITE>-* no longer strands the peer.
portal_mesh_site_scopes: []
#
# L3/L4 — MinIO audit-NDJSON tailer (reads the same bucket the audit-
# subscriber writes). Default endpoint = same host-bind the audit-
# subscriber writes to (mesh IP : 9000). Credentials resolved
# from operator-named envvars per per-site naming convention; the
# audit-write user has its own write-only policy, so the portal gets
# a SEPARATE read-only IAM user (created out-of-band by the operator
# via mc; see docs/operations/portal-vendor-progress-runbook.md).
# Endpoint DERIVED off this site's own mesh IP: a hardcoded address makes a forked
# goatnet read another goatnet's MinIO and see zero of its own
# audit events. The SECRET key follows the per-site `<SITE>_PORTAL_AUDIT_S3_*`
# convention (env-sourced — it IS a secret). The ACCESS key is NOT a secret and
# is NOT env-sourced: it is a fixed contract equal to the MinIO read-user name
# minted by the `minio` role's `minio_extra_users` (see group_vars/<site>/minio.yml
# — `goat-portal-audit-read`). Sourcing it from a per-operator env var let the
# value drift from the MinIO user name → `403 InvalidAccessKeyId` (F-188 Addendum
# the envrc held `portal-audit-reader`). Pinning it here makes drift
# structurally impossible; override in group_vars only if you ALSO rename the
# MinIO user. (stethoscope already does this — see stethoscope_audit_access_key.)
portal_audit_s3_endpoint: "http://{{ mesh_ip_a }}:9000"

# Prometheus base URL for the swimlane's distinct-topic counts. Deriving that
# number from a registry table written per observed message grows without bound
# and produces a very large write-ahead log. The audit-subscriber already exports
# the same counts to Prometheus labelled by DECLARED key pattern — bounded
# series — so the portal reads those instead of keeping a third copy.
#
# EMPTY BY DEFAULT, deliberately. A goatnet without an obs stack renders the
# count as unknown, which is true. Guessing a URL here would be worse than
# leaving it unset: the wrong Prometheus answers, and another goatnet's numbers
# appear on this one's screen. Set it per goatnet, to a host this portal can
# actually reach.
portal_prometheus_url: ""
portal_audit_s3_bucket: "audit-integrity"
portal_audit_s3_region: "us-east-1"
portal_audit_s3_access_key: "goat-portal-audit-read"   # MUST equal the minio_extra_users read-user name
portal_audit_s3_secret_key_envvar: "{{ site_id | upper | replace('-', '_') }}_PORTAL_AUDIT_S3_SECRET_KEY"
# The leading object-key path segment the audit-subscriber writes under, and the
# readers (portal/panoscope/stethoscope) must query the SAME segment or they see
# nothing. SoT is the per-site `audit_subscriber_id` group_var. REQUIRED per-site
# — define audit_subscriber_id in group_vars for any goatnet running the portal.
# The built-in fallback derives it from site_id; a new instance MUST set it
# (instance-variability-model).
portal_audit_subscriber_id: "{{ audit_subscriber_id | default(site_id ~ '-A') }}"
portal_audit_tail_interval: "30s"

# The fabric_name GET /api/fabric/config reports, which clients show and record.
# Stated per goatnet in group_vars. Empty = the variable is rendered empty and
# the portal uses its built-in value.
portal_fabric_name: ""

# Traefik front. Mesh-only; no public DNS. Pattern is
# `<surface>.<site_id>.<site_dns_zone>` per the canonical naming;
# site_dns_zone comes from group_vars.
portal_traefik_host: "portal.{{ site_id | mandatory }}.{{ site_dns_zone | mandatory }}"
portal_traefik_router_name: "portal"
portal_traefik_network: "mgmt"
# Traefik cert resolver name — matches the Traefik static config
# (`le` = Let's Encrypt via Cloudflare DNS-01). Same pattern panoscope
# + airdefenders / auth / dashboard / oauth2 use.
portal_traefik_cert_resolver: "le"
# File-provider directory + filename for the Traefik dynamic route.
# Traefik is file-provider-only (no docker provider); each
# service ships its own file here. Filename intentionally distinct from
# mgmt.yml + airdefenders.yml + panoscope.yml so a portal
# redeploy can't stomp neighboring routes.
portal_traefik_dynamic_dir: "/etc/traefik/dynamic"
portal_traefik_dynamic_filename: "portal.yml"

# The pre-rename filename, removed from the host on deploy. Leaving it
# behind would give Traefik two routers on the same Host() rule. Empty = no
# such file on this goatnet's hosts; a goatnet that carried one names it in
# group_vars.
portal_traefik_dynamic_filename_legacy: ""
# Mesh-only gating — portal is mesh-internal and not part of the
# enrollment surface; restrict to the netbird mesh CIDR via the
# `mesh-only-allowlist` middleware defined in mgmt-dynamic.yml.j2.
# Set to "" to disable.
portal_traefik_mesh_only_middleware: "mesh-only-allowlist@file"
# Per-source concurrency ceiling on the portal's request router — the
# `goat-inflight` middleware defined in mgmt-dynamic.yml.j2. The
# entrypoint-wide rate limit counts requests per second and so cannot see a
# slow caller doing expensive work; this counts what is in flight, which is
# where expensive work shows up. NOT applied to the SSE stream router, which
# holds connections open by design. Set to "" to disable.
#
# DEPLOY ORDER on a host that has never rendered this middleware: run
# `traefik-acme.yml` (or the `traefik` role) BEFORE `portal-deploy.yml`. A
# router referencing a middleware that does not exist goes into error state
# and stops serving — the portal would 404 until the definition lands. Both
# middleware files now define it unattached for exactly this reason, so the
# window only exists on a host whose Traefik config predates this change.
portal_traefik_inflight_middleware: "goat-inflight@file"
# Per-source browsing rate ceiling on the portal's request router — the
# `goat-ratelimit` middleware (50 r/s, burst 100) defined in
# mgmt-dynamic.yml.j2. It sat on the websecure entrypoint previously
# where it refused the hub's own netbird client reaching signal through the
# docker gateway; the entrypoint now carries a 3000 r/s ceiling and this
# limiter is attached per browsing router instead. NOT on the SSE stream
# router. Set to "" to disable. Same deploy-order note as goat-inflight.
portal_traefik_ratelimit_middleware: "goat-ratelimit@file"
# The 429 page. Traefik's own rate-limit refusal is plain text; the API
# document promises an RFC 9457 problem body, so an `errors` middleware on
# the request router fetches the page for a 429 from a sidecar that serves
# constant bodies (`goat-zenoh-portal problem-pages`, same image, no
# registry, no volumes). It is a separate container ON PURPOSE: an errors
# middleware fetches its page from the service directly, outside the
# router's limiters, so a page served by the portal would hand every shed
# request straight back to the backend.
# Default OFF: the sidecar needs a portal image that carries the
# `problem-pages` subcommand (#1247), and no pinned image does yet; a
# default of true would start a crash-looping sidecar on the next converge
# of any portal host. Flip it per site in the same change that moves the
# pin, the two-step the limiters used. Off again keeps Traefik's plain-text
# 429 (the document then overstates the 429 body); the compose call does
# not remove orphans, so a sidecar already deployed stays behind until
# `docker rm -f <container name>` on the host.
portal_problem_pages_enabled: false
portal_problem_pages_container_name: "goat-problem-pages"
portal_problem_pages_listen_port: 8091
# Small on purpose: the worst case is the entrypoint ceiling (3000 r/s)
# worth of shed requests, each a constant 300-byte body.
portal_problem_pages_cpus_limit: "0.5"
portal_problem_pages_memory_limit: "64m"
# CPU ceiling for the portal container, as a docker `cpus` value.
# DERIVED from the target host — half its vCPUs, floor 1 — because a fixed
# value above the host's core count makes the container refuse to start (the
# goat-zenoh cpus: 6.0 default did exactly that to every smaller host). Set to
# "" to run unlimited, or to an explicit number to override.
portal_cpus_limit: "{{ [ (ansible_processor_vcpus | default(2) | int) // 2, 1 ] | max }}.0"

# Memory ceiling for the portal container, as a docker `memory` value (#1251).
# FIXED, not host-derived: unlike cpus, a memory limit above host RAM does not
# stop the container from starting, so the goat-zenoh footgun does not apply.
# This matches the router's fixed goat_zenoh_memory default. The value is about
# 8x the measured working set (~66 MiB: RssAnon 49 MiB, cgroup 66 MiB), which
# bounds a body-heavy request pattern whose per-request caps (#1247) do not
# bound in aggregate, and still leaves headroom. Set to "" to run unlimited, or
# set an explicit value to override per goatnet. Raise it if real load is
# OOM-killed.
portal_memory_limit: "512m"
# Optional second network for reaching the Zenoh router by container name.
# When set, compose joins the portal to this network alongside the
# private `portal` network + the Traefik network.
portal_zenoh_network: ""

# Cloudflare DNS publish — mirrors the airdefenders + panoscope pattern.
# When `portal_publish_cloudflare_dns: true`, the role looks up the zone
# id, lists existing A records, and POSTs any missing ones from
# `portal_cloudflare_a_record_ips`. Auth from the CLOUDFLARE_API_TOKEN
# env var resolved through the play-level cloudflare_api_token var
# (see portal-deploy.yml).
portal_publish_cloudflare_dns: false
portal_cloudflare_zone: ""
portal_cloudflare_a_record_ips: []

# Block 94 cross-surface deep-link contract — sibling-surface base URLs.
# Served at GET /api/siblings; static catalog JS reads them on page load
# to render `diagnose ↗` + `tail ↗` + `panoscope ↗` row buttons on
# vendor / topic / progress pages. Empty string = no sibling at this
# deployment = no button (URL-only contract, no runtime coupling).
# Hostname pattern is `<surface>.<site_id>.<site_dns_zone>`.
# See docs/design/zenoh-surface-deep-links.md.
portal_sibling_panoscope_url: "https://panoscope.{{ site_id | mandatory }}.{{ site_dns_zone | mandatory }}"
portal_sibling_stethoscope_url: "https://stethoscope.{{ site_id | mandatory }}.{{ site_dns_zone | mandatory }}"
portal_sibling_flashlight_url: "https://flashlight.{{ site_id | mandatory }}.{{ site_dns_zone | mandatory }}"

# Display lexicon (docs/design/portal-lexicon.md) — render-time UI vocabulary
# substituted into the embedded HTML at serve time + served at GET
# /api/branding for the frontend JS. Display-only: NEVER changes an API route,
# cert URI-SAN, registry key, or any machine path (mirror of the slot-alias
# invariant). Empty product/org fields = the "Zenoh Trial — Vendor Portal" /
# vendor wording (the Go binary fills these defaults). A goatnet overrides
# product-name/title + org in group_vars. portal_lex_org alone
# derives the plural + title-case forms; override the rest only for an
# irregular noun. The panoscope nav link is templated per-env off site_id so
# a portal links to its own goatnet's panoscope, never to another's.
portal_lex_product_name: ""
portal_lex_product_title: ""
portal_lex_org: ""
portal_lex_orgs: ""
portal_lex_org_title: ""
portal_lex_orgs_title: ""
portal_lex_panoscope_url: "https://panoscope.{{ site_id | mandatory }}.{{ site_dns_zone | mandatory }}/"
