---
galaxy_info:
  role_name: goat_zenoh_portal
  author: goat-maintainer
  description: goat Zenoh trial-fabric / fabric portal (per docs/design/zenoh-trial-fabric.md).
  license: Apache-2.0
  min_ansible_version: "2.14"
  platforms:
    - name: Ubuntu
      versions:
        - jammy
        - noble

# Universal deploy-rollback ledger (ADR 1060). Pilot: group_vars-pinned image
# (portal_image is set in group_vars/<env>/vars.yml, NOT the role
# default) — the on-host jsonl is the only record of the real deployed ref,
# which is exactly the gap this closes.
dependencies:
  - role: rollback-ledger
    vars:
      rollback_component: goat-zenoh-portal
      rollback_artifact_type: image
      rollback_ref: "{{ portal_image }}"
