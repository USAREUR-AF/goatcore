---
# Build cert-sign on the controller for this host's architecture, from this
# checkout's ops/enrollment, and install it at /usr/local/bin/cert-sign (the
# path the portal container bind-mounts). Included by main.yml for a host whose
# binary is missing, and for one whose binary predates --org when the pinned
# portal image passes it.
- name: Build cert-sign on the controller for this host's architecture
  ansible.builtin.command:
    argv:
      - go
      - build
      - -tags
      - nopiv
      - -o
      - "{{ playbook_dir }}/../../.cert-sign-{{ inventory_hostname }}"
      - ./cmd/cert-sign
    chdir: "{{ playbook_dir }}/../enrollment"
  environment:
    GOOS: linux
    GOARCH: "{{ 'arm64' if ansible_architecture in ['aarch64', 'arm64'] else 'amd64' }}"
    CGO_ENABLED: "0"
  delegate_to: localhost
  become: false
  changed_when: true

- name: Install cert-sign on the host
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../.cert-sign-{{ inventory_hostname }}"
    dest: /usr/local/bin/cert-sign
    mode: "0755"
    owner: root
    group: root
  become: true

- name: Remove the controller-side build artefact
  ansible.builtin.file:
    path: "{{ playbook_dir }}/../../.cert-sign-{{ inventory_hostname }}"
    state: absent
  delegate_to: localhost
  become: false
