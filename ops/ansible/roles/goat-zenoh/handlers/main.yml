---
# Restart on any config change. F-124 item 4 collapsed the separate
# access_control.json5 into config.json5 (Zenoh 1.x built-in ACL); any
# Ansible-time policy change re-renders the single file and the
# heavy-equivalent restart picks it up. The add-vendor.sh helper still
# SIGHUPs zenohd in steady state for low-touch vendor additions.

- name: Restart zenoh router
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - "{{ goat_zenoh_compose_path }}"
      - up
      - -d
      - --force-recreate
  changed_when: true
