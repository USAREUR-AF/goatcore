---
galaxy_info:
  role_name: smtp_sink
  author: goat-maintainer
  license: Apache-2.0
  min_ansible_version: "2.14"
  platforms:
    - name: Ubuntu
      versions:
        - noble

# Universal deploy-rollback ledger (ADR 1060).
dependencies:
  - role: rollback-ledger
    vars:
      rollback_component: smtp-sink
      rollback_artifact_type: image
      rollback_ref: "{{ smtp_sink_image }}"
