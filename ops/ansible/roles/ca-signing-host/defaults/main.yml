---
# Operator roster — list of dicts with required fields:
#   name:       UNIX account name (also used as git author name short form)
#   email:      git author email (also used as the gecos field)
#   ssh_pubkey: full ssh authorized_keys line (typed `ssh-ed25519 AAA... comment`)
#   comment:    optional, free-form
#
# Override in group_vars/<host_group>/vars.yml — empty by default so the role
# can be applied on a host that hasn't onboarded operators yet (it'll create
# the group, drop the binaries + blob, but admit no SSH access until at least
# one operator is named).
ca_signing_host_operators: []

# Dev CA ID string — must match the public-key file at
# ops/enrollment/public-keys/<id>.pem and the encrypted blob's recipient set.
# REQUIRED, no default: the deployment names its own CA in the group_vars of
# the host group it applies this role to. The role refuses to run without it.
ca_signing_host_ca_id: ""

# Repo to clone for the allowlist git checkout. Operators commit + push the
# allowlist update from this clone after each issuance.
#
# DELIBERATELY NOT `{{ source_repo }}`. Every other consumer of this repo's
# artifacts became self-referential — goat_get_release_repo,
# goat_docs_release_repo, snitch_release_repo — because a deploy should pull from
# the repo it was driven from. This one is different in kind: the signing host is
# an OFFLINE CA, and what it clones is the allowlist that decides who gets
# credentials. Making that follow whichever checkout an operator happened to run
# from turns an operator's working directory into an input to certificate
# issuance. Which repo the CA trusts is a security decision, not a naming
# convention, so it is an explicit, reviewable constant. REQUIRED, no default:
# the deployment sets it in the group_vars of the host group it applies this
# role to, and the role refuses to run without it.
ca_signing_host_repo_url: ""
ca_signing_host_repo_branch: "main"

# Path on the Ansible controller of the operator-curated relays file.
# Copied to /opt/goat-ca/wg-cp0-relays.json on the target.
ca_signing_host_relays_file: "{{ playbook_dir }}/../enrollment/wg-cp0-relays-prod.json"

# Path within the cloned repo of the allowlist file the bundle-create
# --update-allowlist flag points to.
ca_signing_host_allowlist_relpath: "ops/enrollment/wg-cp0-bundle-allowlist.json"

# Where to install the binaries. /usr/local/bin keeps them on the default PATH
# for all SSH sessions.
ca_signing_host_bindir: "/usr/local/bin"

# Working directory for the encrypted CA blob, root-cert, relays file, ca-id
# marker, and the cloned repo.
ca_signing_host_workdir: "/opt/goat-ca"

# Group operators are placed in. SSH access is gated on membership.
ca_signing_host_group: "goat-ca-operators"
