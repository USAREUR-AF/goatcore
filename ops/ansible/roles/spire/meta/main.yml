---
galaxy_info:
  role_name: spire
  author: goat-maintainer
  license: Apache-2.0
  min_ansible_version: "2.14"
  platforms:
    - name: Ubuntu
      versions:
        - jammy
        - noble

# Universal deploy-rollback ledger (ADR 1060).
dependencies:
  - role: rollback-ledger
    vars:
      rollback_component: spire
      rollback_artifact_type: image
      rollback_ref: "{{ spire_server_image }}"
      rollback_reversible: false
      rollback_restore_pointer: "Consistent PostgreSQL + server/agent state restore: docs/design/spire-upgrades.md"
