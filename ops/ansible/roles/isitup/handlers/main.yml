---
# `--force-recreate` is load-bearing: compose's change-detection does NOT
# track env_file content (it hashes the YAML, not referenced files), so a
# plain `up -d` after an isitup.env edit leaves the running container with
# stale env. Single-file bind mounts (services.env, check.sh, nginx.conf,
# index.html) also pin the inode at container-create time, so atomic-write
# template renders need a recreate to be observed inside the container.
- name: Reload isitup compose
  ansible.builtin.command:
    cmd: >-
      docker compose
      -f /opt/mgmt-host/docker-compose.yml
      -f /opt/mgmt-host/docker-compose.isitup.yml
      up -d --force-recreate isitup oauth2-proxy-isitup
    chdir: /opt/mgmt-host
  listen: reload isitup compose

- name: Restart isitup container only
  ansible.builtin.command:
    cmd: docker restart isitup
  listen: restart isitup container

# The list-only play (isitup-rows.yml) changes services.env and nothing else,
# so it recreates the isitup container alone. `--no-deps` and the single service
# name leave oauth2-proxy-isitup running as it is.
- name: Recreate the isitup container only
  ansible.builtin.command:
    cmd: >-
      docker compose
      -f /opt/mgmt-host/docker-compose.yml
      -f /opt/mgmt-host/docker-compose.isitup.yml
      up -d --force-recreate --no-deps isitup
    chdir: /opt/mgmt-host
  listen: recreate isitup container
