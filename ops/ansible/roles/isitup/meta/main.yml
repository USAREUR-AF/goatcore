---
galaxy_info:
  role_name: isitup
  author: goat-maintainer
  license: Apache-2.0
  min_ansible_version: "2.14"
  platforms:
    - name: Ubuntu
      versions:
        - jammy
        - noble

# Universal deploy-rollback ledger (ADR 1060). The list-only play
# (isitup-rows.yml) and the controller-only render (isitup-rows-render.yml) set
# isitup_rows_only: they deploy no image, so they write no ledger row.
dependencies:
  - role: rollback-ledger
    when: not (isitup_rows_only | default(false) | bool)
    vars:
      rollback_component: isitup
      rollback_artifact_type: image
      rollback_promote_mode: explicit  # mid-role flush_handlers; promote after smoke
      rollback_ref: "{{ isitup_image }}"
