---
# Check the peering leaves and the partner's CA before the role writes anything
# (goat_zenoh_edge_install_certs). Reads only; certificates-install.yml writes
# them later, after the role's other checks, so a later refusal cannot leave a
# new certificate installed with its restart lost.
# docs/design/federation-certificate-lifecycle.md, "Installing on the edge".

- name: edge certs | the paths the edge reads are the files this role installs
  ansible.builtin.assert:
    that:
      - lookup('vars', item.var) == goat_zenoh_edge_cert_dir ~ '/' ~ item.file
    fail_msg: >-
      {{ item.var }} is '{{ lookup('vars', item.var) }}', but with
      goat_zenoh_edge_install_certs the role installs that file at
      {{ goat_zenoh_edge_cert_dir }}/{{ item.file }} and the edge reads it there.
      Remove {{ item.var }} from group_vars (the role derives it from
      goat_zenoh_edge_cert_dir), or set goat_zenoh_edge_install_certs: false and
      place the files by hand.
    quiet: true
  loop:
    - { var: goat_zenoh_edge_outward_cert, file: peering-outward.pem }
    - { var: goat_zenoh_edge_outward_key, file: peering-outward-key.pem }
    - { var: goat_zenoh_edge_inward_cert, file: peering-inward.pem }
    - { var: goat_zenoh_edge_inward_key, file: peering-inward-key.pem }
    - { var: goat_zenoh_edge_partner_ca_path, file: partner-ca.pem }
  loop_control:
    label: "{{ item.var }}"

- name: edge certs | the certificate directory is an absolute directory of its own
  ansible.builtin.assert:
    that:
      - goat_zenoh_edge_cert_dir is match('^/[A-Za-z0-9._/-]+[^/]$')
      - "'/../' not in goat_zenoh_edge_cert_dir ~ '/'"
      - "'/./' not in goat_zenoh_edge_cert_dir ~ '/'"
      - goat_zenoh_edge_cert_dir | dirname | length > 1
    fail_msg: >-
      goat_zenoh_edge_cert_dir '{{ goat_zenoh_edge_cert_dir }}' must be an absolute
      path at least two levels deep, without '.' or '..' parts and without a
      trailing '/'. The default is /etc/goat-zenoh-edge-<partner>/tls.

- name: edge certs | the run's working directory is known
  ansible.builtin.assert:
    that:
      - goat_zenoh_edge_cert_src_dir is match('^/.*[^/]$')
      - goat_zenoh_edge_partner_ca_src is match('^/.+')
      - goat_zenoh_edge_agreement_src is match('^/.+')
    fail_msg: >-
      goat_zenoh_edge_install_certs needs the run's working directory on the
      controller: pass -e fed_work=<work> (both driver avenues pass it to every
      peering play), or set goat_zenoh_edge_cert_src_dir, goat_zenoh_edge_partner_ca_src
      and goat_zenoh_edge_agreement_src to absolute paths, the directory without a
      trailing '/'. Given: '{{ goat_zenoh_edge_cert_src_dir }}'.

- name: edge certs | our CA is named, to check the leaves against
  ansible.builtin.assert:
    that:
      - goat_zenoh_edge_our_ca_path | length > 0
    fail_msg: >-
      goat_zenoh_edge_our_ca_path is unset. The leaves are checked against our CA
      as the edge holds it, before anything is installed.

# Our CA at the role's own path (<cert_dir>/our-ca.pem, the default with the
# switch on) is installed by this role, from the controller, like the leaves: a
# driver that is not the edge host then leaves the edge everything it mounts. Any
# other path names a CA placed on the edge by hand, read where it is.
- name: edge certs | whether this role installs our CA
  ansible.builtin.set_fact:
    _ze_certs_our_ca_installs: "{{ goat_zenoh_edge_our_ca_path == goat_zenoh_edge_cert_dir ~ '/our-ca.pem' }}"

- name: edge certs | our CA's source is its certificate file
  ansible.builtin.assert:
    that:
      - goat_zenoh_edge_our_ca_src is match('^/.+')
      - goat_zenoh_edge_our_ca_src | basename == 'our-ca.pem'
    fail_msg: >-
      goat_zenoh_edge_our_ca_src '{{ goat_zenoh_edge_our_ca_src }}' is not our CA's
      certificate file. The role installs our CA only from <fed_work>/pki/our-ca.pem,
      where phase 8 places the CA's certificate beside the leaves, and never the CA's
      key. Nothing was written.
  when: _ze_certs_our_ca_installs | bool

- name: edge certs | read our CA on the controller (read-only)
  ansible.builtin.slurp:
    src: "{{ goat_zenoh_edge_our_ca_src }}"
  delegate_to: localhost
  become: false
  check_mode: false
  register: _ze_certs_our_ca_src
  when: _ze_certs_our_ca_installs | bool

- name: edge certs | read our CA from this host (read-only)
  ansible.builtin.slurp:
    src: "{{ goat_zenoh_edge_our_ca_path }}"
  register: _ze_certs_our_ca_edge
  when: not (_ze_certs_our_ca_installs | bool)

- name: edge certs | our CA as the checks read it
  ansible.builtin.set_fact:
    _ze_certs_our_ca:
      content: "{{ (_ze_certs_our_ca_src if _ze_certs_our_ca_installs | bool else _ze_certs_our_ca_edge).content }}"

# Only our CA's certificate goes to the edge: exactly one certificate, and a
# source holding any private key (the CA's own, or anything else) is refused
# before a byte is written.
- name: edge certs | our CA's source is exactly one certificate
  ansible.builtin.assert:
    that:
      - "'PRIVATE KEY' not in _ze_certs_our_ca_text"
      - _ze_certs_our_ca_blocks == ['CERTIFICATE']
    fail_msg: >-
      {{ goat_zenoh_edge_our_ca_src }}
      {{ 'holds a private key' if 'PRIVATE KEY' in _ze_certs_our_ca_text
         else 'is not exactly one certificate (it holds: ' ~ (_ze_certs_our_ca_blocks | join(', ') or 'no PEM block') ~ ')' }}.
      Only our CA's certificate is installed on the edge, never its key: give
      goat_zenoh_edge_our_ca_src that one certificate alone. Nothing was written.
  vars:
    _ze_certs_our_ca_text: "{{ _ze_certs_our_ca.content | b64decode }}"
    _ze_certs_our_ca_blocks: "{{ _ze_certs_our_ca_text | regex_findall('-----BEGIN ([A-Z0-9 ]+)-----') }}"
  when: _ze_certs_our_ca_installs | bool

- name: edge certs | check the leaves and the partner CA on the controller
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - "{{ role_path }}/files/check-peering-certs.py"
      - --src-dir
      - "{{ goat_zenoh_edge_cert_src_dir }}"
      - --partner-ca
      - "{{ goat_zenoh_edge_partner_ca_src }}"
      - --agreement
      - "{{ goat_zenoh_edge_agreement_src }}"
      - --partner-id
      - "{{ goat_zenoh_edge_partner_id }}"
      - --partner-fingerprint
      - "{{ goat_zenoh_edge_partner_ca_fingerprint }}"
      - --min-valid-seconds
      - "{{ goat_zenoh_edge_cert_min_valid_seconds }}"
      - --our-ca
      - "-"
    stdin: "{{ _ze_certs_our_ca.content | b64decode }}"
  delegate_to: localhost
  become: false
  register: _ze_certs_check
  changed_when: false
  failed_when: false
  check_mode: false

- name: edge certs | refuse material that failed a check
  ansible.builtin.fail:
    msg: >-
      goat-zenoh-edge refuses to install the peering certificates; nothing was
      written on the edge.
      {{ (_ze_certs_check.stdout_lines | select('match', '^refused: ') | list
          + (_ze_certs_check.stderr_lines | default([]) | list)) | join(' | ') }}
  when: _ze_certs_check.rc != 0

- name: edge certs | the checks that passed
  ansible.builtin.debug:
    msg: "{{ _ze_certs_check.stdout_lines | select('match', '^ok: ') | list }}"

- name: edge certs | look for another peering's files in the directory
  ansible.builtin.stat:
    path: "{{ goat_zenoh_edge_cert_dir }}/.peering"
  register: _ze_certs_marker_stat

- name: edge certs | read the directory's owner
  ansible.builtin.slurp:
    src: "{{ goat_zenoh_edge_cert_dir }}/.peering"
  register: _ze_certs_marker
  when: _ze_certs_marker_stat.stat.exists

- name: edge certs | refuse a directory another peering holds
  ansible.builtin.assert:
    that:
      - (_ze_certs_marker.content | b64decode | trim) == goat_zenoh_edge_partner_id
    fail_msg: >-
      {{ goat_zenoh_edge_cert_dir }} holds the certificates of the peering with
      '{{ _ze_certs_marker.content | b64decode | trim }}', not
      '{{ goat_zenoh_edge_partner_id }}'. Two peerings never share a certificate
      directory: give this one its own goat_zenoh_edge_cert_dir. Nothing was written.
  when: _ze_certs_marker_stat.stat.exists

- name: edge certs | the checksums of what was checked
  ansible.builtin.set_fact:
    _ze_certs_sums: >-
      {{ _ze_certs_check.stdout_lines | select('match', '^checksums: ') | first
         | regex_replace('^checksums: ', '') | from_json }}

- name: edge certs | list what an unmarked directory already holds
  ansible.builtin.find:
    paths: "{{ goat_zenoh_edge_cert_dir }}"
    hidden: true
    file_type: any
    get_checksum: true
  register: _ze_certs_existing
  when: not _ze_certs_marker_stat.stat.exists

- name: edge certs | refuse an unmarked directory unless it is empty or already holds these exact files
  # A directory with no .peering file is adopted only when it is empty, or when
  # every file in it is one this role installs with the same bytes as the checked
  # source: a hand-placed set from another peering, an older set, or a system
  # directory is never adopted and re-owned.
  ansible.builtin.assert:
    that:
      - _ze_certs_foreign | length == 0
    fail_msg: >-
      {{ goat_zenoh_edge_cert_dir }} has no .peering file and holds files that are
      not this peering's checked material: {{ _ze_certs_foreign | join(', ') }}.
      Give this peering its own empty goat_zenoh_edge_cert_dir, or remove those
      files after checking whose they are. Nothing was written.
  vars:
    _ze_certs_expected:
      peering-outward.pem: "{{ _ze_certs_sums[goat_zenoh_edge_cert_src_dir ~ '/peering-outward.pem'] }}"
      peering-outward-key.pem: "{{ _ze_certs_sums[goat_zenoh_edge_cert_src_dir ~ '/peering-outward-key.pem'] }}"
      peering-inward.pem: "{{ _ze_certs_sums[goat_zenoh_edge_cert_src_dir ~ '/peering-inward.pem'] }}"
      peering-inward-key.pem: "{{ _ze_certs_sums[goat_zenoh_edge_cert_src_dir ~ '/peering-inward-key.pem'] }}"
      partner-ca.pem: "{{ _ze_certs_sums[goat_zenoh_edge_partner_ca_src] }}"
      our-ca.pem: "{{ (_ze_certs_our_ca.content | b64decode | hash('sha1')) if _ze_certs_our_ca_installs | bool else '' }}"
    _ze_certs_foreign: >-
      {%- set out = [] -%}
      {%- for f in _ze_certs_existing.files | default([]) -%}
      {%- set n = f.path | basename -%}
      {%- if (_ze_certs_expected[n] | default('')) == '' or (f.checksum | default('')) != _ze_certs_expected[n] -%}
      {%- set _ = out.append(n) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ out }}
  when: not _ze_certs_marker_stat.stat.exists
