---
# The key-bundle grant against the core's key storages. A core storing keys/**
# against a per-set grant declares a queryable wider than the lane this edge
# grants; zenoh refuses it SILENTLY, so the partner's fetch returns an empty
# result that reads as "nothing was published". The core is read where it runs
# (find-core.yml: this host, else the one host of <partner>_core), at the path
# its router reads (core-config-path.yml). A comparison that cannot run fails
# the play; it is never reported as a pass. Only
# goat_zenoh_edge_key_scope_check: false turns it off, and that is reported.
- name: edge | report a disabled key-storage comparison
  ansible.builtin.debug:
    msg: >-
      SKIP, by decision: goat_zenoh_edge_key_scope_check is false, so the core's
      key storages were not compared with the key-bundle grant
      {{ goat_zenoh_edge_key_bundle_key_exprs | default([]) | join(', ') }}.
      This is not a pass.
  when: not (goat_zenoh_edge_key_scope_check | default(true) | bool)

# main.yml has already looked for the core; included on its own, look here.
- name: edge | find our core router
  ansible.builtin.include_tasks: find-core.yml
  when:
    - goat_zenoh_edge_key_scope_check | default(true) | bool
    - _edge_core_found is not defined

- name: edge | refuse a key-storage comparison that found no core to read
  ansible.builtin.fail:
    msg: >-
      could not run: the core key-storage comparison found no core to read
      ({{ _edge_core_not_found }}). The key-bundle grant
      {{ goat_zenoh_edge_key_bundle_key_exprs | join(', ') }} was not compared with
      the core's key storages. Put our core host, alone, in inventory group
      {{ _edge_core_group_name }}, or name the container in
      goat_zenoh_edge_core_container when the core runs on this host; set
      goat_zenoh_edge_key_scope_check: false only to accept this deliberately.
  when:
    - goat_zenoh_edge_key_scope_check | default(true) | bool
    - _edge_core_container | default('') | length == 0

- name: edge | where the core router reads its configuration
  ansible.builtin.include_tasks: core-config-path.yml
  vars:
    _edge_core_on: "{{ _edge_core_host | default('') }}"
  when:
    - goat_zenoh_edge_key_scope_check | default(true) | bool
    - _edge_core_container | default('') | length > 0

- name: edge | refuse a core whose configuration path cannot be told
  ansible.builtin.fail:
    msg: >-
      could not run: cannot tell where the core router {{ _edge_core_container }}
      on {{ _edge_core_host | default('', true) or inventory_hostname }}
      reads its configuration: {{ _edge_core_config_problem }}. The key-bundle
      grant was not compared with the core's key storages; set
      goat_zenoh_edge_key_scope_check: false only to accept this deliberately.
  when:
    - goat_zenoh_edge_key_scope_check | default(true) | bool
    - _edge_core_container | default('') | length > 0
    - _edge_core_config_problem | length > 0

- name: edge | read the core's key storages, to compare against what we grant
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ _edge_core_container }}"
      - cat
      - "{{ _edge_core_config_path }}"
  register: _edge_core_key_config
  changed_when: false
  failed_when: false
  check_mode: false
  no_log: true
  delegate_to: "{{ _edge_core_host | default('', true) or inventory_hostname }}"
  when:
    - goat_zenoh_edge_key_scope_check | default(true) | bool
    - _edge_core_container | default('') | length > 0

# The configuration stays hidden (it can hold credentials); the read's exit
# status and error text do not.
- name: edge | refuse a core configuration that could not be read
  vars:
    _read: "{{ _edge_core_key_config }}"
    _why: "{{ (_read.stderr | default('') | trim) or (_read.msg | default('no error text')) }}"
  ansible.builtin.fail:
    msg: >-
      could not run: could not read {{ _edge_core_config_path }} from
      {{ _edge_core_container }} on
      {{ _edge_core_host | default('', true) or inventory_hostname }}:
      docker exec ... cat exited {{ _read.rc | default('without a status') }}
      ({{ _why | truncate(400) }}). The key-bundle grant was not compared with
      the core's key storages. For a core router whose start arguments name no
      configuration, set goat_zenoh_edge_core_config_path to where it reads one;
      set goat_zenoh_edge_key_scope_check: false only to accept this deliberately.
  when:
    - goat_zenoh_edge_key_scope_check | default(true) | bool
    - _edge_core_container | default('') | length > 0
    - (_edge_core_key_config.rc | default(-1) | int) != 0

- name: edge | compare the core's key storages with the grant
  ansible.builtin.set_fact:
    _edge_core_key_report: >-
      {{ _edge_core_key_config.stdout |
         zenoh_key_storage_check(goat_zenoh_edge_key_bundle_key_exprs) }}
  no_log: true
  when:
    - goat_zenoh_edge_key_scope_check | default(true) | bool
    - (_edge_core_key_config.rc | default(-1) | int) == 0

# Every storage that can hold a key under keys/ must be included in the grant, by
# key-expression inclusion: a store wider than the grant (keys/**, keys/*/**) or for
# another set (keys/other/**) declares a queryable the edge refuses SILENTLY.
- name: edge | refuse a core whose key storage is not included in the grant
  ansible.builtin.assert:
    that:
      - _edge_core_key_report.error | length == 0
      - _edge_core_key_report.wider | length == 0
    fail_msg: >-
      {{ _edge_core_key_report.error or ('The core stores ' ~ (_edge_core_key_report.wider | join(', '))
         ~ ', not included in the key-bundle grant ' ~ (goat_zenoh_edge_key_bundle_key_exprs | join(', '))
         ~ '.') }} A queryable declared wider than the granted lane, or for
      another lane, is refused silently, so the partner's fetch will return an
      empty result that reads as "no bundle published". Narrow the core's key
      storage to the released set(s), or set goat_zenoh_edge_key_scope_check=false
      if you have deliberately accepted this.
    success_msg: >-
      PASS: every key storage on the core
      ({{ (_edge_core_key_report.observed | join(', ')) or 'none' }}) is included in
      the key-bundle grant {{ goat_zenoh_edge_key_bundle_key_exprs | join(', ') }}.
  when:
    - goat_zenoh_edge_key_scope_check | default(true) | bool
    - (_edge_core_key_config.rc | default(-1) | int) == 0
