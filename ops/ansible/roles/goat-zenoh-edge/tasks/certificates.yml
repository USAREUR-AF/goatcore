---
# Install the peering leaves and the partner's CA from the run's working
# directory (goat_zenoh_edge_install_certs). Every check runs before the first
# write on the edge; a refusal leaves the edge as it was.
# docs/design/federation-certificate-lifecycle.md, "Installing on the edge".

- name: edge certs | the paths the edge reads are the files this role installs
  ansible.builtin.assert:
    that:
      - lookup('vars', item.var) == goat_zenoh_edge_cert_dir ~ '/' ~ item.file
    fail_msg: >-
      {{ item.var }} is '{{ lookup('vars', item.var) }}', but with
      goat_zenoh_edge_install_certs the role installs that file at
      {{ goat_zenoh_edge_cert_dir }}/{{ item.file }} and the edge reads it there.
      Remove {{ item.var }} from group_vars (the role derives it from
      goat_zenoh_edge_cert_dir), or set goat_zenoh_edge_install_certs: false and
      place the files by hand.
    quiet: true
  loop:
    - { var: goat_zenoh_edge_outward_cert, file: peering-outward.pem }
    - { var: goat_zenoh_edge_outward_key, file: peering-outward-key.pem }
    - { var: goat_zenoh_edge_inward_cert, file: peering-inward.pem }
    - { var: goat_zenoh_edge_inward_key, file: peering-inward-key.pem }
    - { var: goat_zenoh_edge_partner_ca_path, file: partner-ca.pem }
  loop_control:
    label: "{{ item.var }}"

- name: edge certs | the certificate directory is an absolute directory of its own
  ansible.builtin.assert:
    that:
      - goat_zenoh_edge_cert_dir is match('^/[A-Za-z0-9._/-]+[^/]$')
      - "'/../' not in goat_zenoh_edge_cert_dir ~ '/'"
      - "'/./' not in goat_zenoh_edge_cert_dir ~ '/'"
      - goat_zenoh_edge_cert_dir | dirname | length > 1
    fail_msg: >-
      goat_zenoh_edge_cert_dir '{{ goat_zenoh_edge_cert_dir }}' must be an absolute
      path at least two levels deep, without '.' or '..' parts and without a
      trailing '/'. The driver passes the allocated value; the default is
      /etc/goat-zenoh-edge-<partner>/tls.

- name: edge certs | the run's working directory is known
  ansible.builtin.assert:
    that:
      - goat_zenoh_edge_cert_src_dir is match('^/.+')
      - goat_zenoh_edge_partner_ca_src is match('^/.+')
      - goat_zenoh_edge_agreement_src is match('^/.+')
    fail_msg: >-
      goat_zenoh_edge_install_certs needs the run's working directory on the
      controller: pass -e fed_work=<work> (the driver does), or set
      goat_zenoh_edge_cert_src_dir, goat_zenoh_edge_partner_ca_src and
      goat_zenoh_edge_agreement_src to absolute paths.

- name: edge certs | our CA is named, to check the leaves against
  ansible.builtin.assert:
    that:
      - goat_zenoh_edge_our_ca_path | length > 0
    fail_msg: >-
      goat_zenoh_edge_our_ca_path is unset. The leaves are checked against our CA
      as the edge holds it, before anything is installed.

- name: edge certs | read our CA from this host (read-only)
  ansible.builtin.slurp:
    src: "{{ goat_zenoh_edge_our_ca_path }}"
  register: _ze_certs_our_ca

- name: edge certs | check the leaves and the partner CA on the controller
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - "{{ role_path }}/files/check-peering-certs.py"
      - --src-dir
      - "{{ goat_zenoh_edge_cert_src_dir }}"
      - --partner-ca
      - "{{ goat_zenoh_edge_partner_ca_src }}"
      - --agreement
      - "{{ goat_zenoh_edge_agreement_src }}"
      - --partner-id
      - "{{ goat_zenoh_edge_partner_id }}"
      - --partner-fingerprint
      - "{{ goat_zenoh_edge_partner_ca_fingerprint }}"
      - --min-valid-seconds
      - "{{ goat_zenoh_edge_cert_min_valid_seconds }}"
      - --our-ca
      - "-"
    stdin: "{{ _ze_certs_our_ca.content | b64decode }}"
  delegate_to: localhost
  become: false
  register: _ze_certs_check
  changed_when: false
  failed_when: false
  check_mode: false

- name: edge certs | refuse material that failed a check
  ansible.builtin.fail:
    msg: >-
      goat-zenoh-edge refuses to install the peering certificates; nothing was
      written on the edge.
      {{ (_ze_certs_check.stdout_lines | select('match', '^refused: ') | list
          + (_ze_certs_check.stderr_lines | default([]) | list)) | join(' | ') }}
  when: _ze_certs_check.rc != 0

- name: edge certs | the checks that passed
  ansible.builtin.debug:
    msg: "{{ _ze_certs_check.stdout_lines }}"

- name: edge certs | look for another peering's files in the directory
  ansible.builtin.stat:
    path: "{{ goat_zenoh_edge_cert_dir }}/.peering"
  register: _ze_certs_marker_stat

- name: edge certs | read the directory's owner
  ansible.builtin.slurp:
    src: "{{ goat_zenoh_edge_cert_dir }}/.peering"
  register: _ze_certs_marker
  when: _ze_certs_marker_stat.stat.exists

- name: edge certs | refuse a directory another peering holds
  ansible.builtin.assert:
    that:
      - (_ze_certs_marker.content | b64decode | trim) == goat_zenoh_edge_partner_id
    fail_msg: >-
      {{ goat_zenoh_edge_cert_dir }} holds the certificates of the peering with
      '{{ _ze_certs_marker.content | b64decode | trim }}', not
      '{{ goat_zenoh_edge_partner_id }}'. Two peerings never share a certificate
      directory: give this one its own goat_zenoh_edge_cert_dir. Nothing was written.
  when: _ze_certs_marker_stat.stat.exists

- name: edge certs | the per-peering directory
  ansible.builtin.file:
    path: "{{ goat_zenoh_edge_cert_dir }}"
    state: directory
    owner: "{{ goat_zenoh_edge_cert_owner }}"
    group: "{{ goat_zenoh_edge_cert_group }}"
    mode: "0750"

- name: edge certs | which peering this directory belongs to
  ansible.builtin.copy:
    content: "{{ goat_zenoh_edge_partner_id }}\n"
    dest: "{{ goat_zenoh_edge_cert_dir }}/.peering"
    owner: "{{ goat_zenoh_edge_cert_owner }}"
    group: "{{ goat_zenoh_edge_cert_group }}"
    mode: "0644"

- name: edge certs | the certificates and the partner CA
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: "{{ goat_zenoh_edge_cert_owner }}"
    group: "{{ goat_zenoh_edge_cert_group }}"
    mode: "0644"
  loop:
    - { src: "{{ goat_zenoh_edge_cert_src_dir }}/peering-outward.pem", dest: "{{ goat_zenoh_edge_outward_cert }}" }
    - { src: "{{ goat_zenoh_edge_cert_src_dir }}/peering-inward.pem", dest: "{{ goat_zenoh_edge_inward_cert }}" }
    - { src: "{{ goat_zenoh_edge_partner_ca_src }}", dest: "{{ goat_zenoh_edge_partner_ca_path }}" }
  notify: Restart goat zenoh edge

- name: edge certs | the private keys, readable by their owner alone
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: "{{ goat_zenoh_edge_cert_owner }}"
    group: "{{ goat_zenoh_edge_cert_group }}"
    mode: "0600"
  loop:
    - { src: "{{ goat_zenoh_edge_cert_src_dir }}/peering-outward-key.pem", dest: "{{ goat_zenoh_edge_outward_key }}" }
    - { src: "{{ goat_zenoh_edge_cert_src_dir }}/peering-inward-key.pem", dest: "{{ goat_zenoh_edge_inward_key }}" }
  loop_control:
    label: "{{ item.dest }}"
  diff: false
  notify: Restart goat zenoh edge
