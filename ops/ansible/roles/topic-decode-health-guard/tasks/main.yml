---
# Install (or fully remove) the hourly topic decode-health audit. Idempotent.
# Contract: docs/design/live-state-guard-scheduling.md §4.
# Canon: docs/design/topic-decode-health.md.

# ---------------------------------------------------------------------------
# Teardown. Runs FIRST and unconditionally when disabled, so turning the gate
# off removes the background process rather than declining to redeploy it. The
# role netbird-admin-reconcile only skips, and that is the defect this clause
# exists to stop repeating.
# ---------------------------------------------------------------------------
- name: topic-decode-health-guard | teardown when disabled
  when: not (topic_decode_health_guard_enabled | bool)
  block:
    - name: topic-decode-health-guard | stop + disable timer and service
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
        enabled: false
      loop:
        - topic-decode-health-guard.timer
        - topic-decode-health-guard.service
      failed_when: false

    - name: topic-decode-health-guard | remove units, script, lib, env and metric
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system/topic-decode-health-guard.timer
        - /etc/systemd/system/topic-decode-health-guard.service
        - /usr/local/sbin/topic-decode-health-guard.sh
        - "{{ topic_decode_health_guard_lib_dir }}"
        - /etc/goat/topic-decode-health-guard.env
        - /etc/goat/decode-health-baseline
        # The stale metric goes too. A textfile the exporter keeps serving after
        # the job is gone reads as a healthy audit that simply stopped changing —
        # indistinguishable from a fabric where nothing is wrong.
        - "{{ topic_decode_health_guard_textfile_dir }}/topic_decode_health_guard.prom"

    - name: topic-decode-health-guard | remove alert rules
      ansible.builtin.file:
        path: "{{ topic_decode_health_guard_rules_dir }}/topic-decode-health-guard.yml"
        state: absent
      notify: reload prometheus for topic-decode-health-guard

    - name: topic-decode-health-guard | reload systemd after removal
      ansible.builtin.systemd:
        daemon_reload: true

    - name: topic-decode-health-guard | say what was removed
      ansible.builtin.debug:
        msg:
          - "topic-decode-health-guard is TORN DOWN on this host."
          - "The report dir {{ topic_decode_health_guard_report_dir }} is left deliberately —"
          - "it is evidence, not state. Remove it by hand if you mean to."
          - "The portal service key is NOT revoked by this teardown: delete its file from"
          - "the portal's operator-key directory to cut it, which the portal hot-reloads."

# ---------------------------------------------------------------------------
# Install.
# ---------------------------------------------------------------------------
- name: topic-decode-health-guard | install
  when: topic_decode_health_guard_enabled | bool
  block:
    # Refuse rather than install something that cannot work. A unit that fails
    # every hour is noise people mute, and a muted guard is no guard — which is
    # the exact failure this role exists to fix, reintroduced by deployment.
    - name: topic-decode-health-guard | refuse to install unconfigured
      ansible.builtin.assert:
        that:
          - topic_decode_health_guard_portal_url | length > 0
          - topic_decode_health_guard_portal_key | length > 0
        fail_msg: >-
          This guard needs portal_url + portal_key. It reads what the registry
          SAYS a topic is and what is actually on the key, and BOTH now come from
          the portal — so a missing credential does not degrade it, it blinds it,
          and a blind run must exit 2 rather than look clean. Mint the service
          identity with ops/scripts/create-decode-health-identity.sh and put the
          values in this goatnet's group_vars. Do NOT reuse a per-person op_ key:
          a guard that stops when somebody offboards is not a guard.
          router_url is OPTIONAL and deliberately not asserted — it serves only
          the advisory unregistered axis, and refusing to install a guard that
          can fully grade the fabric because an optional extra is unreachable is
          how a goatnet ends up with no guard at all.
        quiet: true

    - name: topic-decode-health-guard | refuse an empty failing-grade list
      ansible.builtin.assert:
        that:
          - topic_decode_health_guard_fail_on | length > 0
        fail_msg: >-
          topic_decode_health_guard_fail_on is empty, which installs a guard that
          can never fail. It would still write metrics and a report, so every
          surface would show an audited goatnet while the unit stayed green
          through a fabric carrying unreadable bytes. If you want reporting
          without failing, say so explicitly by narrowing the list — not by
          emptying it.
        quiet: true

    # The contract asks for a metrics surface, and F-335 is why this is a
    # separate, louder warning than the rest: an unset textfile dir is a
    # supported posture (journal-only), but a WRONG one fails silently forever.
    - name: topic-decode-health-guard | say when the unregistered axis will not run
      ansible.builtin.debug:
        msg: >-
          topic_decode_health_guard_router_url is unset, so the advisory
          UNREGISTERED axis (keys on the fabric with no registry row, ADR 1028)
          will report "not checked" rather than an empty list. Everything that can
          fail this guard still runs — grading goes through the portal. Set the
          router URL only if this host can actually reach the router's published
          REST port; where the router publishes none, it cannot.
      when: topic_decode_health_guard_router_url | length == 0

    - name: topic-decode-health-guard | warn when this host will publish no metric
      ansible.builtin.debug:
        msg: >-
          topic_decode_health_guard_textfile_dir is unset, so this guard is visible
          only in the journal and NO alert rules will do anything. That is a valid
          posture; it is not a good one. The two goatnets use OPPOSITE directories —
          find the real one with
          `ps -o args= -C node_exporter | tr ' ' '\n' | grep textfile.directory`
          and confirm the series reaches Prometheus, not merely the disk.
      when: topic_decode_health_guard_textfile_dir | length == 0

    - name: topic-decode-health-guard | directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: root
        group: root
        mode: "{{ item.mode }}"
      loop:
        - { path: /etc/goat, mode: "0755" }
        - { path: "{{ topic_decode_health_guard_lib_dir }}", mode: "0755" }
        - { path: "{{ topic_decode_health_guard_report_dir }}", mode: "0755" }

    # Flat path, unlike machine-provenance-guard: this check is self-contained
    # Python and resolves nothing relative to its own location, so it does not
    # need the installed prefix to mirror the repo.
    - name: topic-decode-health-guard | install the check
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../ci/check-topic-decode-health.py"
        dest: "{{ topic_decode_health_guard_lib_dir }}/check-topic-decode-health.py"
        owner: root
        group: root
        mode: "0755"
      notify: restart topic-decode-health-guard timer

    - name: topic-decode-health-guard | install wrapper
      ansible.builtin.copy:
        src: topic-decode-health-guard.sh
        dest: /usr/local/sbin/topic-decode-health-guard.sh
        owner: root
        group: root
        mode: "0755"
      notify: restart topic-decode-health-guard timer

    - name: topic-decode-health-guard | render the known-bad baseline
      ansible.builtin.template:
        src: decode-health-baseline.j2
        dest: /etc/goat/decode-health-baseline
        owner: root
        group: root
        mode: "0644"
      when: topic_decode_health_guard_baseline | length > 0
      notify: restart topic-decode-health-guard timer

    - name: topic-decode-health-guard | remove the baseline when the goatnet declares none
      ansible.builtin.file:
        path: /etc/goat/decode-health-baseline
        state: absent
      when: topic_decode_health_guard_baseline | length == 0

    - name: topic-decode-health-guard | refuse a baseline entry with no reason or no expiry
      ansible.builtin.assert:
        that:
          - topic_decode_health_guard_baseline
            | rejectattr('why', 'defined')
            | list | length == 0
          - topic_decode_health_guard_baseline
            | rejectattr('clear_by', 'defined')
            | list | length == 0
        fail_msg: >-
          Every baseline entry needs both `why` and `clear_by`. An entry without a
          reason is indistinguishable from someone silencing an alarm they did not
          understand, and one without an expiry is not a baseline — it is deleting
          the check for that topic permanently, which is the failure this whole
          role exists to prevent.
        quiet: true
      when: topic_decode_health_guard_baseline | length > 0

    - name: topic-decode-health-guard | install env file
      ansible.builtin.template:
        src: topic-decode-health-guard.env.j2
        dest: /etc/goat/topic-decode-health-guard.env
        owner: root
        group: root
        mode: "0600"
      no_log: true
      notify: restart topic-decode-health-guard timer

    - name: topic-decode-health-guard | install units
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "/etc/systemd/system/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - topic-decode-health-guard.service
        - topic-decode-health-guard.timer
      notify: restart topic-decode-health-guard timer

    - name: topic-decode-health-guard | does this goatnet have a rules dir?
      ansible.builtin.stat:
        path: "{{ topic_decode_health_guard_rules_dir }}"
      register: tdh_rules_dir

    # `copy`, NOT `template`. Prometheus annotations use {{ $value }} and
    # {{ $labels.x }}, which Jinja evaluates and dies on — a sibling role hit
    # exactly that on its first run. Static also means what is in the repo is
    # byte-for-byte what Prometheus loads.
    - name: topic-decode-health-guard | install alert rules
      ansible.builtin.copy:
        src: topic-decode-health-guard.rules.yml
        dest: "{{ topic_decode_health_guard_rules_dir }}/topic-decode-health-guard.yml"
        owner: root
        group: root
        mode: "0644"
      when:
        - tdh_rules_dir.stat.exists | default(false)
        - topic_decode_health_guard_textfile_dir | length > 0
      notify: reload prometheus for topic-decode-health-guard

    - name: topic-decode-health-guard | say so when there is nowhere to alert from
      ansible.builtin.debug:
        msg: >-
          No alert rules installed ({{ 'no rules dir at ' ~ topic_decode_health_guard_rules_dir
          if not (tdh_rules_dir.stat.exists | default(false))
          else 'no textfile dir, so the series would never arrive' }}).
          Expected where the obs stack runs on a different host. The audit
          still runs and still writes its report, but a topic publishing unreadable
          bytes on this goatnet will page nobody — the systemd unit is the only
          alarm, so somebody has to be watching failed units or reading the journal.
      when: >-
        not (tdh_rules_dir.stat.exists | default(false))
        or topic_decode_health_guard_textfile_dir | length == 0

    - name: topic-decode-health-guard | flush handlers so the timer starts from current unit files
      ansible.builtin.meta: flush_handlers

    - name: topic-decode-health-guard | enable + start timer
      ansible.builtin.systemd:
        name: topic-decode-health-guard.timer
        enabled: true
        state: started
        daemon_reload: true

    # Prove it works now, with somebody watching, rather than discovering at :43
    # unattended that a credential was wrong.
    - name: topic-decode-health-guard | run once now
      ansible.builtin.command:
        cmd: systemctl start --wait topic-decode-health-guard.service
      register: tdh_run
      changed_when: false
      failed_when: false
      when: topic_decode_health_guard_run_now | bool

    - name: topic-decode-health-guard | what did the unit exit with?
      ansible.builtin.command:
        cmd: systemctl show topic-decode-health-guard.service -p ExecMainStatus --value
      register: tdh_status
      changed_when: false
      failed_when: false
      when: topic_decode_health_guard_run_now | bool

    - name: topic-decode-health-guard | read back the report
      ansible.builtin.slurp:
        src: "{{ topic_decode_health_guard_report_dir }}/last-run.txt"
      register: tdh_report
      failed_when: false
      when: topic_decode_health_guard_run_now | bool

    - name: topic-decode-health-guard | report
      ansible.builtin.debug:
        msg: "{{ (tdh_report.content | b64decode).split('\n') }}"
      when:
        - topic_decode_health_guard_run_now | bool
        - tdh_report.content is defined

    # The contract: exit 2 means a source could not be read, and the deploy play
    # FAILS on it. Not because the fabric is wrong — because the guard is blind,
    # and a blind guard installed quietly is how this whole class of defect
    # started. Exit 1 does NOT fail the deploy: that is the fabric's condition,
    # reported, and it is the timer's job to keep saying so.
    - name: topic-decode-health-guard | fail the deploy when the guard could not read its sources
      ansible.builtin.fail:
        msg: >-
          topic-decode-health-guard exited 2 on its first run: a source could not be
          read, so this deploy has installed a guard that sees nothing. Check the
          report above — the usual causes are a portal URL this host cannot reach, a
          portal key not registered in the portal's operator-key directory (the
          portal's key reload is FAIL-SAFE, so a bad key is invisible except in the
          portal log), or a router URL pointing at a container name that does not
          resolve from this host. Fix it before walking away; an installed-but-blind
          guard is worse than none, because every surface now says this goatnet is
          audited.
      when:
        - topic_decode_health_guard_run_now | bool
        - (tdh_status.stdout | default('0') | trim) == '2'
