---
- name: Refuse a goat-cli release known to break onboarding
  ansible.builtin.assert:
    that:
      - goat_get_release_tag not in goat_get_refused_release_tags
    fail_msg: >-
      goat_get_release_tag is {{ goat_get_release_tag }}, which is on the refused
      list. {{ goat_get_refused_release_reason[goat_get_release_tag]
               | default('No reason recorded — see ops/ansible/roles/goat-get/defaults/main.yml.') }}
      Serving it would put that binary on every host whose onboard-runner
      auto-syncs from this surface.
    quiet: true

# SPDX-License-Identifier: Apache-2.0
#
# goat-get role — serves the goat-cli release binaries (linux/darwin ×
# amd64/arm64) from a mesh-internal nginx behind Traefik, so on-mesh
# vendors can `curl https://get.<site>.<zone>/goat-<os>-<arch>` without
# reaching the GitHub release page. Mirrors the brief
# role: file-provider Traefik route, container on `mgmt`, `le` cert
# resolver, mesh-only gating. The hostname is per-goatnet via the
# site-templated goat_get_hostname.
#
# Pre-flight (operator-side, NOT this role):
#   1. DNS record for `get.<site>.<zone>` published (handled here when
#      goat_get_publish_cloudflare_dns: true).
#   2. `get.<site>.<zone>` is in that goatnet's Let's Encrypt tls.domains
#      SAN list (the site traefik-acme play re-rendered with
#      goat_get_enabled: true in group_vars).
#   3. Only for a PRIVATE release repository (goat_get_release_private:
#      true, or the family's own *_release_private flag): GOAT_CLI_RELEASE_TOKEN
#      (or GH_TOKEN) is set in the operator env with contents:read on the repo.
#      A public release is read anonymously; a set token is used when GitHub
#      accepts it (tasks/github-release-access.yml under ops/ansible/).
#
# Idempotent — re-running re-fetches the pinned release assets (cheap)
# and is otherwise a no-op on a healthy host.

# ---------------------------------------------------------------------------
# Cloudflare DNS publish — delegate_to localhost so the API call leaves
# the operator workstation, not the target host.
# ---------------------------------------------------------------------------
- name: goat-get | Cloudflare — look up zone id
  ansible.builtin.uri:
    url: "https://api.cloudflare.com/client/v4/zones?name={{ goat_get_cloudflare_zone }}"
    method: GET
    headers:
      Authorization: "Bearer {{ cloudflare_api_token | default('') }}"
    return_content: true
  register: goat_get_cf_zone_lookup
  when: goat_get_publish_cloudflare_dns | bool
  delegate_to: localhost
  become: false
  run_once: true

- name: goat-get | Cloudflare — record zone id fact
  ansible.builtin.set_fact:
    goat_get_cf_zone_id: "{{ goat_get_cf_zone_lookup.json.result[0].id }}"
  when: goat_get_publish_cloudflare_dns | bool
  run_once: true

- name: goat-get | Cloudflare — list existing A records for the hostname
  ansible.builtin.uri:
    url: "https://api.cloudflare.com/client/v4/zones/{{ goat_get_cf_zone_id }}/dns_records?type=A&name={{ goat_get_hostname }}"
    method: GET
    headers:
      Authorization: "Bearer {{ cloudflare_api_token | default('') }}"
    return_content: true
  register: goat_get_cf_existing
  when: goat_get_publish_cloudflare_dns | bool
  delegate_to: localhost
  become: false
  run_once: true

- name: goat-get | Cloudflare — capture existing A-record content set
  ansible.builtin.set_fact:
    goat_get_cf_existing_ips: "{{ goat_get_cf_existing.json.result | map(attribute='content') | list }}"
  when: goat_get_publish_cloudflare_dns | bool
  run_once: true

- name: goat-get | Cloudflare — create missing A records
  ansible.builtin.uri:
    url: "https://api.cloudflare.com/client/v4/zones/{{ goat_get_cf_zone_id }}/dns_records"
    method: POST
    headers:
      Authorization: "Bearer {{ cloudflare_api_token | default('') }}"
      Content-Type: application/json
    body_format: json
    body:
      type: A
      name: "{{ goat_get_hostname }}"
      content: "{{ item }}"
      ttl: 60
      proxied: false
    status_code: [200, 201]
  loop: "{{ goat_get_cloudflare_a_record_ips }}"
  when:
    - goat_get_publish_cloudflare_dns | bool
    - item not in (goat_get_cf_existing_ips | default([]))
  delegate_to: localhost
  become: false
  run_once: true

# ---------------------------------------------------------------------------
# Fetch the release binaries onto the host (host has internet egress;
# avoids crossing the mesh with multi-MB artifacts per the no-large-scp
# rule). Resolve the release by tag, then pull each named asset via its
# API asset URL with Accept: application/octet-stream.
# ---------------------------------------------------------------------------
# Mirror-first. A sovereign / partner site has no credential to the GitHub org
# and must not need one, so the release assets are also published to the R2
# download mirror (bucket `goat-downloads`, fronted by `goat_get_mirror_base`)
# under `cli/<tag>/<asset>`. Probe the mirror first; only fall back to the
# GitHub release API when the mirror does not carry this tag. Integrity is
# unchanged on both legs — the per-asset .sha256 sidecars still gate the
# serve — so the mirror is a transport, not a trust anchor.
# Probe EVERY asset, not just the first. A partially-mirrored tag (an upload
# that missed a file, or an edge still serving a cached 404 for one object)
# would pass a first-asset-only probe and then fail mid-download with the
# mirror already chosen. Checking one asset cannot detect that; checking all
# of them can, so the mirror leg is taken only when the whole set is present.
- name: goat-get | probe the download mirror for every asset in this tag
  ansible.builtin.uri:
    url: "{{ goat_get_mirror_base }}/{{ goat_get_mirror_prefix }}/{{ item }}"
    method: HEAD
    status_code: [200, 403, 404]
  register: goat_get_mirror_probe
  failed_when: false
  loop: "{{ goat_get_assets }}"
  run_once: true
  become: true

- name: goat-get | use the mirror only when it carries the COMPLETE set
  ansible.builtin.set_fact:
    # One Jinja expression, not a YAML mapping: set_fact does NOT evaluate
    # Jinja in a dict KEY, so templated keys would stay unrendered strings
    # and every lookup below would miss silently.
    goat_get_asset_urls: >-
      {{ dict(goat_get_assets | zip(goat_get_assets
         | map('regex_replace', '^',
               goat_get_mirror_base ~ '/' ~ goat_get_mirror_prefix ~ '/'))) }}
    goat_get_dl_headers: {"Accept": "application/octet-stream"}
    goat_get_source: mirror
  when: >-
    goat_get_mirror_probe.results | default([]) | length > 0
    and goat_get_mirror_probe.results
        | map(attribute='status') | reject('equalto', 200) | list | length == 0

- name: goat-get | otherwise fall back to the GitHub release API
  ansible.builtin.set_fact:
    goat_get_source: github
  when: goat_get_source is not defined

# Only the GitHub leg talks to GitHub. A public release repository is read
# anonymously; the token is used when it is set and accepted, and is required
# only when goat_get_release_private is true. A token GitHub refuses (401/403)
# does not block a public download: the role warns and reads anonymously.
- name: goat-get | decide how to read the GitHub release (token or anonymous)
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/github-release-access.yml"
  vars:
    ghr_label: "goat-get"
    ghr_repo: "{{ goat_get_release_repo }}"
    ghr_tag: "{{ goat_get_release_tag }}"
    ghr_token: "{{ goat_get_github_token }}"
    ghr_token_name: "goat_get_github_token (GOAT_CLI_RELEASE_TOKEN, else GH_TOKEN, else GHCR_READ_TOKEN)"
    ghr_private: "{{ goat_get_release_private }}"
    ghr_private_var: goat_get_release_private
    ghr_hint: >-
      Preferred instead: publish the tag to {{ goat_get_mirror_base }}, which a site with no GitHub identity can read.
  when: goat_get_source == 'github'

- name: goat-get | GitHub request headers (Authorization only when the token is used)
  ansible.builtin.set_fact:
    goat_get_gh_auth: "{{ ghr_auth_headers }}"
  no_log: true
  when: goat_get_source == 'github'

- name: goat-get | GitHub leg download headers
  ansible.builtin.set_fact:
    goat_get_dl_headers: "{{ {'Accept': 'application/octet-stream'} | combine(goat_get_gh_auth) }}"
  no_log: true
  when: goat_get_source == 'github'

- name: goat-get | create compose + www dirs
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ goat_get_compose_dir }}"
    - "{{ goat_get_www_dir }}"
  become: true

- name: goat-get | resolve release by tag (asset id + url map)
  ansible.builtin.uri:
    url: "https://api.github.com/repos/{{ goat_get_release_repo }}/releases/tags/{{ goat_get_release_tag }}"
    method: GET
    headers: "{{ {'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'} | combine(goat_get_gh_auth) }}"
    return_content: true
  register: goat_get_release
  become: true
  no_log: true
  when: goat_get_source == 'github'

- name: goat-get | build name->api-url map for the assets we serve
  ansible.builtin.set_fact:
    goat_get_asset_urls: >-
      {{ goat_get_release.json.assets
         | selectattr('name', 'in', goat_get_assets)
         | items2dict(key_name='name', value_name='url') }}
  when: goat_get_source == 'github'

- name: goat-get | every requested asset is present in the release
  ansible.builtin.assert:
    that:
      - goat_get_asset_urls.keys() | list | sort == goat_get_assets | sort
    fail_msg: >-
      Release {{ goat_get_release_tag }} is missing some expected assets.
      Wanted {{ goat_get_assets }}, found {{ goat_get_asset_urls.keys() | list }}.

- name: goat-get | download each release asset to the www dir
  ansible.builtin.get_url:
    url: "{{ goat_get_asset_urls[item] }}"
    headers: "{{ goat_get_dl_headers }}"
    dest: "{{ goat_get_www_dir }}/{{ item }}"
    # binaries get +x; checksum files (per-asset *.sha256 + SHA256SUMS) are plain text
    mode: "{{ '0755' if (item.startswith('goat-') and not item.endswith('.sha256')) else '0644' }}"
    force: true
    # The goat binaries are ~100 MB; get_url's default 10 s read timeout blows
    # up on the larger asset over a lossy mesh. Give it room + retry — the host's
    # egress to GitHub is the slow, flaky leg.
    timeout: 300
  loop: "{{ goat_get_assets }}"
  become: true
  no_log: true
  register: goat_get_download
  until: goat_get_download is succeeded
  retries: 3
  delay: 5

- name: goat-get | render landing index.html
  ansible.builtin.template:
    src: index.html.j2
    dest: "{{ goat_get_www_dir }}/index.html"
    mode: "0644"
  become: true

# Machine-readable "what version are we handing out" marker, derived from the
# SAME goat_get_release_tag that pins the served binaries — so there is no
# second bump point to keep in sync. `goat` reads this when it connects and
# nudges the operator if their binary is behind (crate::version_check;
# docs/design/goat-cli-mesh-download.md §"Version-staleness check").
- name: goat-get | render version.json (staleness marker)
  ansible.builtin.template:
    src: version.json.j2
    dest: "{{ goat_get_www_dir }}/version.json"
    mode: "0644"
  become: true

# This goatnet's own facts for the goat CLI (defaults: goat_get_goatnet_facts).
# goat-cli holds no goatnet; `goat context refresh` reads this file and writes
# its keys into the context's profile.toml.
- name: goat-get | render goatnet.toml (per-goatnet facts for the goat CLI)
  ansible.builtin.template:
    src: goatnet.toml.j2
    dest: "{{ goat_get_www_dir }}/goatnet.toml"
    mode: "0644"
  become: true

# ---------------------------------------------------------------------------
# CA roots — served at get.<site>/ca-roots/ alongside the binaries.
#
# goat-cli compiles in no goatnet CA, so an operator supplies the
# verification root for whichever goatnet they are joining. That only works if
# roots are obtainable, which is what this block is for. Copied straight out of
# the repo checkout (ops/enrollment/public-keys/*.pem) — public keys, already
# committed, no release fetch to 404.
#
# Every root is served, not just this goatnet's: the reason for the change is
# that ONE laptop should work against several goatnets at once.
# Serving a root asserts nothing — `goat ca add` prints a fingerprint and tells
# the operator to confirm it out of band.
# ---------------------------------------------------------------------------
- name: goat-get | ca-roots | create subdir
  ansible.builtin.file:
    path: "{{ goat_get_www_dir }}/{{ goat_get_ca_roots_www_subdir }}"
    state: directory
    mode: "0755"
  become: true
  when: goat_get_ca_roots_enabled | bool

- name: goat-get | ca-roots | enumerate root PEMs in the checkout
  ansible.builtin.set_fact:
    goat_get_ca_roots_files: "{{ query('fileglob', goat_get_ca_roots_src_dir ~ '/*.pem') | sort }}"
  when: goat_get_ca_roots_enabled | bool
  delegate_to: localhost
  become: false
  run_once: true

# Fail closed rather than silently publishing an empty directory. An empty
# ca-roots/ looks identical to a working one from the client side right up to
# the point where `goat profile init` cannot verify anything, and the operator
# has no way to tell which end is at fault.
- name: goat-get | ca-roots | at least one root is present to serve
  ansible.builtin.assert:
    that:
      - goat_get_ca_roots_files | length > 0
    fail_msg: >-
      No *.pem found in {{ goat_get_ca_roots_src_dir }}. goat-cli compiles in no
      CA root, so serving none hands out a binary that cannot verify any bundle.
      Check the checkout, or set goat_get_ca_roots_enabled=false deliberately.
  when: goat_get_ca_roots_enabled | bool
  run_once: true

- name: goat-get | ca-roots | publish each root PEM
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ goat_get_www_dir }}/{{ goat_get_ca_roots_www_subdir }}/{{ item | basename }}"
    mode: "0644"
  loop: "{{ goat_get_ca_roots_files }}"
  become: true
  when: goat_get_ca_roots_enabled | bool

# The fingerprints on the index MUST be the ones `goat ca add` prints, or the
# page teaches a check that fails for the wrong reason. One derivation, in
# ops/enrollment/ca-root-fingerprint.py, used by both — never re-derived in
# Jinja (b64decode there mangles binary, and a wrong fingerprint on a trust page
# is worse than none).
- name: goat-get | ca-roots | derive CA-ID + fingerprint for each root
  ansible.builtin.command:
    argv: >-
      {{ [playbook_dir ~ '/../enrollment/ca-root-fingerprint.py', '--json']
         + goat_get_ca_roots_files }}
  register: goat_get_ca_roots_fp
  changed_when: false
  when: goat_get_ca_roots_enabled | bool
  delegate_to: localhost
  become: false
  run_once: true

- name: goat-get | ca-roots | build index rows
  ansible.builtin.set_fact:
    goat_get_ca_roots_rows: "{{ (goat_get_ca_roots_fp.stdout | from_json).roots }}"
  when: goat_get_ca_roots_enabled | bool
  run_once: true

# A directory of opaque filenames is not usable on its own — the reader needs
# the fingerprint to check against, and the one command that consumes the file.
- name: goat-get | ca-roots | render index
  ansible.builtin.template:
    src: ca-roots-index.html.j2
    dest: "{{ goat_get_www_dir }}/{{ goat_get_ca_roots_www_subdir }}/index.html"
    mode: "0644"
  become: true
  when: goat_get_ca_roots_enabled | bool

# ---------------------------------------------------------------------------
# grant-crypto SDK assets (ADR 1106) — OPT-IN parallel payload at get.<site>/sdk/.
# Same host/cert/DNS/mesh-gate as the goat-cli surface; a separate GitHub release
# (grant-crypto-sdk-v*) pinned by goat_get_sdk_release_tag, fetched into a www/sdk/
# subdir nginx already serves. Whole block guarded by goat_get_sdk_enabled — a
# site that hasn't opted in never touches this. Fail-closed like the goat-cli
# flow: release-access probe on the SDK tag, then a set-equality assert on the
# requested assets. See docs/design/goat-cli-mesh-download.md §"SDK assets".
# ---------------------------------------------------------------------------
- name: goat-get | sdk | decide how to read the GitHub release (token or anonymous)
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/github-release-access.yml"
  vars:
    ghr_label: "goat-get | sdk"
    ghr_repo: "{{ goat_get_sdk_release_repo }}"
    ghr_tag: "{{ goat_get_sdk_release_tag }}"
    ghr_token: "{{ goat_get_github_token }}"
    ghr_token_name: "goat_get_github_token (GOAT_CLI_RELEASE_TOKEN, else GH_TOKEN, else GHCR_READ_TOKEN)"
    ghr_private: "{{ goat_get_sdk_release_private }}"
    ghr_private_var: goat_get_sdk_release_private
    ghr_hint: >-
      goat_get_sdk_enabled is true. If the SDK release tag has not been cut yet, cut grant-crypto-sdk-v* (workflow grant-crypto-sdk-release.yml).
  when: goat_get_sdk_enabled | bool

- name: goat-get | sdk | GitHub request headers (Authorization only when the token is used)
  ansible.builtin.set_fact:
    goat_get_sdk_gh_auth: "{{ ghr_auth_headers }}"
  no_log: true
  when: goat_get_sdk_enabled | bool

- name: goat-get | sdk | create www/sdk dir
  ansible.builtin.file:
    path: "{{ goat_get_www_dir }}/{{ goat_get_sdk_www_subdir }}"
    state: directory
    mode: "0755"
  become: true
  when: goat_get_sdk_enabled | bool

- name: goat-get | sdk | resolve SDK release by tag (asset id + url map)
  ansible.builtin.uri:
    url: "https://api.github.com/repos/{{ goat_get_sdk_release_repo }}/releases/tags/{{ goat_get_sdk_release_tag }}"
    method: GET
    headers: "{{ {'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'} | combine(goat_get_sdk_gh_auth) }}"
    return_content: true
  register: goat_get_sdk_release
  become: true
  no_log: true
  when: goat_get_sdk_enabled | bool

- name: goat-get | sdk | build name->api-url map for the SDK assets we serve
  ansible.builtin.set_fact:
    goat_get_sdk_asset_urls: >-
      {{ goat_get_sdk_release.json.assets
         | selectattr('name', 'in', goat_get_sdk_assets)
         | items2dict(key_name='name', value_name='url') }}
  when: goat_get_sdk_enabled | bool

- name: goat-get | sdk | every requested SDK asset is present in the release
  ansible.builtin.assert:
    that:
      - goat_get_sdk_asset_urls.keys() | list | sort == goat_get_sdk_assets | sort
    fail_msg: >-
      Release {{ goat_get_sdk_release_tag }} is missing some expected SDK assets.
      Wanted {{ goat_get_sdk_assets }}, found {{ goat_get_sdk_asset_urls.keys() | list }}.
      (Version-derived names track goat_get_sdk_version={{ goat_get_sdk_version }};
      a src-tarball name mismatch means the tag and the built artifact disagree.)
  when: goat_get_sdk_enabled | bool

- name: goat-get | sdk | download each SDK asset to the www/sdk dir
  ansible.builtin.get_url:
    url: "{{ goat_get_sdk_asset_urls[item] }}"
    headers: "{{ {'Accept': 'application/octet-stream'} | combine(goat_get_sdk_gh_auth) }}"
    dest: "{{ goat_get_www_dir }}/{{ goat_get_sdk_www_subdir }}/{{ item }}"
    # All SDK assets are tarballs / checksum text — plain files, no +x.
    mode: "0644"
    force: true
    timeout: 300
  loop: "{{ goat_get_sdk_assets }}"
  become: true
  no_log: true
  register: goat_get_sdk_download
  until: goat_get_sdk_download is succeeded
  retries: 3
  delay: 5
  when: goat_get_sdk_enabled | bool

# Unpack the SDK's own documentation site into www/sdk/docs/. The docs tarball
# is re-rooted to a top-level docs/, so unarchiving it into www/sdk/ lands the
# pages at www/sdk/docs/ (nginx serves the whole tree — get.<site>/sdk/docs/).
# The web-served docs are therefore the SAME bytes the SDK ships in-tarball,
# pinned to the served release. remote_src: the archive is already on the host
# (downloaded by the SDK asset fetch above).
- name: goat-get | sdk | unarchive docs into www/sdk/docs
  ansible.builtin.unarchive:
    src: "{{ goat_get_www_dir }}/{{ goat_get_sdk_www_subdir }}/grant-crypto-sdk-docs-{{ goat_get_sdk_version }}.tar.gz"
    dest: "{{ goat_get_www_dir }}/{{ goat_get_sdk_www_subdir }}/"
    remote_src: true
  become: true
  when: goat_get_sdk_enabled | bool

- name: goat-get | sdk | render SDK landing index.html
  ansible.builtin.template:
    src: sdk-index.html.j2
    dest: "{{ goat_get_www_dir }}/{{ goat_get_sdk_www_subdir }}/index.html"
    mode: "0644"
  become: true
  when: goat_get_sdk_enabled | bool

- name: goat-get | sdk | render SDK version.json (staleness marker)
  ansible.builtin.template:
    src: sdk-version.json.j2
    dest: "{{ goat_get_www_dir }}/{{ goat_get_sdk_www_subdir }}/version.json"
    mode: "0644"
  become: true
  when: goat_get_sdk_enabled | bool

# Name-fallback snapshot (docs/design/name-fallback-resolver.md, ADR 1082):
# serve the signed, serial-versioned name set so goat-cli can cache it while
# names work and fall back to it when mesh DNS is down. Copied from the repo
# checkout (the committed artifact IS the deployable — drift+sig gated in
# CI), only for sites that opted in via name_snapshot_enabled.
- name: goat-get | publish name-fallback snapshot + signature
  ansible.builtin.copy:
    # goat_get_dns_dir covers sites whose ops/dns/ directory is not named
    # after site_id.
    src: "{{ playbook_dir }}/../dns/{{ goat_get_dns_dir | default(site_id) }}/{{ item }}"
    dest: "{{ goat_get_www_dir }}/{{ item }}"
    mode: "0644"
  loop:
    - name-snapshot.json
    - name-snapshot.json.sig
  become: true
  when: name_snapshot_enabled | default(false)

# ---------------------------------------------------------------------------
# Serve + route.
# ---------------------------------------------------------------------------
- name: goat-get | render docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ goat_get_compose_dir }}/docker-compose.yml"
    mode: "0644"
  become: true
  notify: goat-get | recreate container

- name: goat-get | render Traefik dynamic config (file provider)
  ansible.builtin.template:
    src: traefik-goat-get.yml.j2
    dest: "{{ goat_get_traefik_dynamic_dir }}/{{ goat_get_traefik_dynamic_filename }}"
    mode: "0644"
  become: true
  # Traefik picks up file-provider changes automatically — no SIGHUP.

# The route filename changed. Traefik's file provider reads
# the whole directory, so an orphaned old file is not inert: it declares a
# second router on the same Host() rule. Guarded on the two names differing so
# this is a no-op once the rename is old.
- name: goat-get | remove pre-rename Traefik route file
  ansible.builtin.file:
    path: "{{ goat_get_traefik_dynamic_dir }}/{{ goat_get_traefik_dynamic_filename_legacy }}"
    state: absent
  become: true
  when:
    - goat_get_traefik_dynamic_filename_legacy | default('') | length > 0
    - goat_get_traefik_dynamic_filename_legacy != goat_get_traefik_dynamic_filename

- name: goat-get | pull nginx image
  community.docker.docker_image:
    name: "{{ goat_get_image }}"
    source: pull
  become: true

- name: goat-get | bring up via docker compose
  community.docker.docker_compose_v2:
    project_src: "{{ goat_get_compose_dir }}"
    state: present
    pull: missing
  become: true

- name: goat-get | wait for container to be Running
  ansible.builtin.command:
    cmd: "docker inspect -f '{{ '{{' }}.State.Running{{ '}}' }}' {{ goat_get_container_name }}"
  register: goat_get_running
  retries: 30
  delay: 2
  until: goat_get_running.stdout | trim == 'true'
  changed_when: false
  become: true
# Deploy ledger now written by the shared `rollback-ledger`
# meta-dependency (meta/main.yml) per ADR 1060 — no per-role task here.
# ---------------------------------------------------------------------------
# jetson-wireguard-kmod assets (ADR 1118) — OPT-IN parallel payload at
# get.<site>/kmod/. Mirror of the SDK family above: release-access probe on the
# release tag, set-equality assert on assets, host-side fetch (no large scp),
# fail-closed throughout. See docs/design/goat-cli-mesh-download.md §"Jetson
# kernel-module assets".
# ---------------------------------------------------------------------------
- name: goat-get | kmod | decide how to read the GitHub release (token or anonymous)
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/github-release-access.yml"
  vars:
    ghr_label: "goat-get | kmod"
    ghr_repo: "{{ goat_get_kmod_release_repo }}"
    ghr_tag: "{{ goat_get_kmod_release_tag }}"
    ghr_token: "{{ goat_get_github_token }}"
    ghr_token_name: "goat_get_github_token (GOAT_CLI_RELEASE_TOKEN, else GH_TOKEN, else GHCR_READ_TOKEN)"
    ghr_private: "{{ goat_get_kmod_release_private }}"
    ghr_private_var: goat_get_kmod_release_private
    ghr_hint: >-
      goat_get_kmod_enabled is true. While that repo is private, the token needs contents:read on it (or flip the repo public and set goat_get_kmod_release_private false).
  when: goat_get_kmod_enabled | bool

- name: goat-get | kmod | GitHub request headers (Authorization only when the token is used)
  ansible.builtin.set_fact:
    goat_get_kmod_gh_auth: "{{ ghr_auth_headers }}"
  no_log: true
  when: goat_get_kmod_enabled | bool

- name: goat-get | kmod | create www/kmod dir
  ansible.builtin.file:
    path: "{{ goat_get_www_dir }}/{{ goat_get_kmod_www_subdir }}"
    state: directory
    mode: "0755"
  become: true
  when: goat_get_kmod_enabled | bool

- name: goat-get | kmod | resolve kmod release by tag (asset id + url map)
  ansible.builtin.uri:
    url: "https://api.github.com/repos/{{ goat_get_kmod_release_repo }}/releases/tags/{{ goat_get_kmod_release_tag }}"
    method: GET
    headers: "{{ {'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'} | combine(goat_get_kmod_gh_auth) }}"
    return_content: true
  register: goat_get_kmod_release
  become: true
  no_log: true
  when: goat_get_kmod_enabled | bool

- name: goat-get | kmod | build name->api-url map for the kmod assets we serve
  ansible.builtin.set_fact:
    goat_get_kmod_asset_urls: >-
      {{ goat_get_kmod_release.json.assets
         | selectattr('name', 'in', goat_get_kmod_assets)
         | items2dict(key_name='name', value_name='url') }}
  when: goat_get_kmod_enabled | bool

- name: goat-get | kmod | every requested kmod asset is present in the release
  ansible.builtin.assert:
    that:
      - goat_get_kmod_asset_urls.keys() | list | sort == goat_get_kmod_assets | sort
    fail_msg: >-
      Release {{ goat_get_kmod_release_tag }} is missing expected kmod assets.
      Wanted {{ goat_get_kmod_assets }}, found
      {{ goat_get_kmod_asset_urls.keys() | list }}.
  when: goat_get_kmod_enabled | bool

- name: goat-get | kmod | download each kmod asset to the www/kmod dir
  ansible.builtin.get_url:
    url: "{{ goat_get_kmod_asset_urls[item] }}"
    headers: "{{ {'Accept': 'application/octet-stream'} | combine(goat_get_kmod_gh_auth) }}"
    dest: "{{ goat_get_www_dir }}/{{ goat_get_kmod_www_subdir }}/{{ item }}"
    mode: "0644"
    force: true
    timeout: 300
  loop: "{{ goat_get_kmod_assets }}"
  become: true
  no_log: true
  register: goat_get_kmod_download
  until: goat_get_kmod_download is succeeded
  retries: 3
  delay: 5
  when: goat_get_kmod_enabled | bool

- name: goat-get | kmod | render kmod landing index.html
  ansible.builtin.template:
    src: kmod-index.html.j2
    dest: "{{ goat_get_www_dir }}/{{ goat_get_kmod_www_subdir }}/index.html"
    mode: "0644"
  become: true
  when: goat_get_kmod_enabled | bool

# The release this subdir serves, read back into the ledger row (served payloads).
- name: goat-get | kmod | write kmod version.json (served-payload marker)
  ansible.builtin.copy:
    content: "{{ {'tag': goat_get_kmod_release_tag} | to_nice_json }}\n"
    dest: "{{ goat_get_www_dir }}/{{ goat_get_kmod_www_subdir }}/version.json"
    mode: "0644"
  become: true
  when: goat_get_kmod_enabled | bool

# ---------------------------------------------------------------------------
# octo-pod appliance assets — OPT-IN parallel payload at get.<site>/octo-pod/.
# Same shape as the kmod family above: release-access probe on the release tag,
# set-equality assert on assets, host-side fetch, fail-closed throughout.
#
# This is what lets an edge pod take new software without reaching GitHub —
# `octo-pod upgrade` points at https://get.<site>.<zone>/octo-pod and finds
# LATEST, the artifact and the cosign signature over SHA256SUMS all there.
# The mirror is a mirror: it copies a signed release, it does not sign one,
# and the pod verifies the signature after downloading regardless of where it
# came from. So a compromised surface serves software no pod will install.
# ---------------------------------------------------------------------------
- name: goat-get | octo-pod | decide how to read the GitHub release (token or anonymous)
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/github-release-access.yml"
  vars:
    ghr_label: "goat-get | octo-pod"
    ghr_repo: "{{ goat_get_octopod_release_repo }}"
    ghr_tag: "{{ goat_get_octopod_release_tag }}"
    ghr_token: "{{ goat_get_github_token }}"
    ghr_token_name: "goat_get_github_token (GOAT_CLI_RELEASE_TOKEN, else GH_TOKEN, else GHCR_READ_TOKEN)"
    ghr_private: "{{ goat_get_octopod_release_private }}"
    ghr_private_var: goat_get_octopod_release_private
    ghr_hint: >-
      goat_get_octopod_enabled is true. octo-pod releases are tagged octo-pod-vX.Y.Z.
  when: goat_get_octopod_enabled | bool

- name: goat-get | octo-pod | GitHub request headers (Authorization only when the token is used)
  ansible.builtin.set_fact:
    goat_get_octopod_gh_auth: "{{ ghr_auth_headers }}"
  no_log: true
  when: goat_get_octopod_enabled | bool

- name: goat-get | octo-pod | create www/octo-pod dir
  ansible.builtin.file:
    path: "{{ goat_get_www_dir }}/{{ goat_get_octopod_www_subdir }}"
    state: directory
    mode: "0755"
  become: true
  when: goat_get_octopod_enabled | bool

- name: goat-get | octo-pod | resolve octo-pod release by tag (asset id + url map)
  ansible.builtin.uri:
    url: "https://api.github.com/repos/{{ goat_get_octopod_release_repo }}/releases/tags/{{ goat_get_octopod_release_tag }}"
    method: GET
    headers: "{{ {'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'} | combine(goat_get_octopod_gh_auth) }}"
    return_content: true
  register: goat_get_octopod_release
  become: true
  no_log: true
  when: goat_get_octopod_enabled | bool

- name: goat-get | octo-pod | build name->api-url map for the octo-pod assets we serve
  ansible.builtin.set_fact:
    goat_get_octopod_asset_urls: >-
      {{ goat_get_octopod_release.json.assets
         | selectattr('name', 'in', goat_get_octopod_assets)
         | items2dict(key_name='name', value_name='url') }}
  when: goat_get_octopod_enabled | bool

# Set-equality, not "at least one": a release missing SHA256SUMS.cosign-bundle
# would mirror fine and then be refused by every pod at upgrade time, which is
# a failure discovered at the edge instead of here.
- name: goat-get | octo-pod | every requested octo-pod asset is present in the release
  ansible.builtin.assert:
    that:
      - goat_get_octopod_asset_urls.keys() | list | sort == goat_get_octopod_assets | sort
    fail_msg: >-
      Release {{ goat_get_octopod_release_tag }} is missing expected octo-pod
      assets. Wanted {{ goat_get_octopod_assets }}, found
      {{ goat_get_octopod_asset_urls.keys() | list }}. Note the version in the
      artifact names comes from the tag — a tag/VERSION mismatch shows up here.
  when: goat_get_octopod_enabled | bool

- name: goat-get | octo-pod | download each octo-pod asset to the www/octo-pod dir
  ansible.builtin.get_url:
    url: "{{ goat_get_octopod_asset_urls[item] }}"
    headers: "{{ {'Accept': 'application/octet-stream'} | combine(goat_get_octopod_gh_auth) }}"
    dest: "{{ goat_get_www_dir }}/{{ goat_get_octopod_www_subdir }}/{{ item }}"
    mode: "0644"
    force: true
    timeout: 300
  loop: "{{ goat_get_octopod_assets }}"
  become: true
  no_log: true
  register: goat_get_octopod_download
  until: goat_get_octopod_download is succeeded
  retries: 3
  delay: 5
  when: goat_get_octopod_enabled | bool

- name: goat-get | octo-pod | render octo-pod landing index.html
  ansible.builtin.template:
    src: octopod-index.html.j2
    dest: "{{ goat_get_www_dir }}/{{ goat_get_octopod_www_subdir }}/index.html"
    mode: "0644"
  become: true
  when: goat_get_octopod_enabled | bool

# The release this subdir serves, read back into the ledger row (served payloads).
- name: goat-get | octo-pod | write octo-pod version.json (served-payload marker)
  ansible.builtin.copy:
    content: "{{ {'tag': goat_get_octopod_release_tag} | to_nice_json }}\n"
    dest: "{{ goat_get_www_dir }}/{{ goat_get_octopod_www_subdir }}/version.json"
    mode: "0644"
  become: true
  when: goat_get_octopod_enabled | bool

# ---------------------------------------------------------------------------
# goatbuilder assets — OPT-IN parallel payload at get.<site>/goatbuilder/
# (docs/design/goatbuilder-distribution.md). Same shape as the kmod family:
# release-access probe on the release tag, set-equality assert on assets,
# host-side fetch, fail-closed throughout. This surface mirrors a signed
# release; it never signs one. An operator verifies the cosign bundle over
# SHA256SUMS after downloading, from here or from GitHub, identically.
# ---------------------------------------------------------------------------
- name: goat-get | goatbuilder | preconditions — a release tag is pinned
  ansible.builtin.assert:
    that:
      - goat_get_goatbuilder_release_tag | length > 0
    fail_msg: >-
      goat_get_goatbuilder_enabled is true but goat_get_goatbuilder_release_tag is
      empty: no goatbuilder release is pinned. Cut the release (a repository admin
      tags main: goatbuilder/v<semver>), then set the tag in the role defaults.
  run_once: true
  when: goat_get_goatbuilder_enabled | bool

- name: goat-get | goatbuilder | decide how to read the GitHub release (token or anonymous)
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/github-release-access.yml"
  vars:
    ghr_label: "goat-get | goatbuilder"
    ghr_repo: "{{ goat_get_goatbuilder_release_repo }}"
    ghr_tag: "{{ goat_get_goatbuilder_release_tag }}"
    ghr_token: "{{ goat_get_github_token }}"
    ghr_token_name: "goat_get_github_token (GOAT_CLI_RELEASE_TOKEN, else GH_TOKEN, else GHCR_READ_TOKEN)"
    ghr_private: "{{ goat_get_goatbuilder_release_private }}"
    ghr_private_var: goat_get_goatbuilder_release_private
    ghr_hint: >-
      goat_get_goatbuilder_enabled is true. If the tag is not cut, a repository admin tags main:
      git tag {{ goat_get_goatbuilder_release_tag }} <sha> && git push origin {{ goat_get_goatbuilder_release_tag }}.
  when: goat_get_goatbuilder_enabled | bool

- name: goat-get | goatbuilder | GitHub request headers (Authorization only when the token is used)
  ansible.builtin.set_fact:
    goat_get_goatbuilder_gh_auth: "{{ ghr_auth_headers }}"
  no_log: true
  when: goat_get_goatbuilder_enabled | bool

- name: goat-get | goatbuilder | create www/goatbuilder dir
  ansible.builtin.file:
    path: "{{ goat_get_www_dir }}/{{ goat_get_goatbuilder_www_subdir }}"
    state: directory
    mode: "0755"
  become: true
  when: goat_get_goatbuilder_enabled | bool

- name: goat-get | goatbuilder | resolve goatbuilder release by tag (asset id + url map)
  ansible.builtin.uri:
    url: "https://api.github.com/repos/{{ goat_get_goatbuilder_release_repo }}/releases/tags/{{ goat_get_goatbuilder_release_tag }}"
    method: GET
    headers: "{{ {'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'} | combine(goat_get_goatbuilder_gh_auth) }}"
    return_content: true
  register: goat_get_goatbuilder_release
  become: true
  no_log: true
  when: goat_get_goatbuilder_enabled | bool

- name: goat-get | goatbuilder | build name->api-url map for the goatbuilder assets we serve
  ansible.builtin.set_fact:
    goat_get_goatbuilder_asset_urls: >-
      {{ goat_get_goatbuilder_release.json.assets
         | selectattr('name', 'in', goat_get_goatbuilder_assets)
         | items2dict(key_name='name', value_name='url') }}
  when: goat_get_goatbuilder_enabled | bool

- name: goat-get | goatbuilder | every requested goatbuilder asset is present in the release
  ansible.builtin.assert:
    that:
      - goat_get_goatbuilder_asset_urls.keys() | list | sort == goat_get_goatbuilder_assets | sort
    fail_msg: >-
      Release {{ goat_get_goatbuilder_release_tag }} is missing expected goatbuilder assets.
      Wanted {{ goat_get_goatbuilder_assets }}, found
      {{ goat_get_goatbuilder_asset_urls.keys() | list }}. Re-run goatbuilder-release.yml
      on the tag; a release that looks published and serves part of its set is not served.
  when: goat_get_goatbuilder_enabled | bool

- name: goat-get | goatbuilder | download each goatbuilder asset to the www/goatbuilder dir
  ansible.builtin.get_url:
    url: "{{ goat_get_goatbuilder_asset_urls[item] }}"
    headers: "{{ {'Accept': 'application/octet-stream'} | combine(goat_get_goatbuilder_gh_auth) }}"
    dest: "{{ goat_get_www_dir }}/{{ goat_get_goatbuilder_www_subdir }}/{{ item }}"
    mode: "0644"
    force: true
    timeout: 300
  loop: "{{ goat_get_goatbuilder_assets }}"
  become: true
  no_log: true
  register: goat_get_goatbuilder_download
  until: goat_get_goatbuilder_download is succeeded
  retries: 3
  delay: 5
  when: goat_get_goatbuilder_enabled | bool

- name: goat-get | goatbuilder | render goatbuilder landing index.html
  ansible.builtin.template:
    src: goatbuilder-index.html.j2
    dest: "{{ goat_get_www_dir }}/{{ goat_get_goatbuilder_www_subdir }}/index.html"
    mode: "0644"
  become: true
  when: goat_get_goatbuilder_enabled | bool

- name: goat-get | goatbuilder | render goatbuilder version.json (staleness marker)
  ansible.builtin.template:
    src: goatbuilder-version.json.j2
    dest: "{{ goat_get_www_dir }}/{{ goat_get_goatbuilder_www_subdir }}/version.json"
    mode: "0644"
  become: true
  when: goat_get_goatbuilder_enabled | bool
