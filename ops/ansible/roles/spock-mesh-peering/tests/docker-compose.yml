# 2-node compose smoke harness for the spock-mesh-peering role.
#
# Two postgres-spock instances on the same docker network. Container
# names mirror the Spock node-naming convention so the in-DSN host
# resolves naturally:
#   test-postgres-a → the "test-a" site's postgres
#   test-postgres-b → the "test-b" site's postgres
#
# Run-test.sh orchestrates compose-up + Ansible role invocation +
# verification + compose-down.

services:
  test-postgres-a:
    image: "${POSTGRES_SPOCK_IMAGE:?set it to a digest-pinned postgres-spock image; run-test.sh reads the fleet pin}"  # never :latest (it broke the conf-load contract 2026-07-15)
    container_name: test-postgres-a
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]  # mirror production (site-bootstrap Phase 2); the image CMD alone does not load the Spock conf
    environment:
      POSTGRES_PASSWORD: spockmeshtest
      POSTGRES_USER: postgres
      SITE_NAME: test-a
    networks:
      - spockmesh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d netbird"]
      interval: 2s
      timeout: 2s
      retries: 30

  test-postgres-b:
    image: "${POSTGRES_SPOCK_IMAGE:?set it to a digest-pinned postgres-spock image; run-test.sh reads the fleet pin}"  # never :latest (it broke the conf-load contract 2026-07-15)
    container_name: test-postgres-b
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]  # mirror production (site-bootstrap Phase 2); the image CMD alone does not load the Spock conf
    environment:
      POSTGRES_PASSWORD: spockmeshtest
      POSTGRES_USER: postgres
      SITE_NAME: test-b
    networks:
      - spockmesh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d netbird"]
      interval: 2s
      timeout: 2s
      retries: 30

networks:
  spockmesh:
    name: spockmesh-test
