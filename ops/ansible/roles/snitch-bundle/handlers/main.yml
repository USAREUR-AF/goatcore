---
# Block 61H — multi-platform builds. Two restart handlers, one per service
# manager, dispatched via the per-OS task file.

- name: Restart snitch-probe (systemd)
  ansible.builtin.systemd:
    name: snitch-probe.service
    state: restarted
    daemon_reload: true

- name: Restart snitch-probe (launchd)
  ansible.builtin.command:
    cmd: launchctl kickstart -k system/{{ snitch_probe_launchd_label }}
  changed_when: true
