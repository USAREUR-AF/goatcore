---
galaxy_info:
  role_name: audit_fifo_evict
  author: goat-maintainer
  license: Apache-2.0
  min_ansible_version: "2.14"
  platforms:
    - name: Ubuntu
      versions:
        - jammy
        - noble
dependencies:
  - role: rollback-ledger
    vars:
      rollback_component: audit-fifo-evict
      rollback_artifact_type: forward-only
      rollback_ref: "{{ audit_fifo_evict_mc_image }}"
      rollback_reversible: false
      rollback_restore_pointer: >-
        Disable destructive mode and preserve the pending-pass journal.
        Code rollback cannot restore deleted versions; recovery requires a
        previously preserved cold archive if one exists.
