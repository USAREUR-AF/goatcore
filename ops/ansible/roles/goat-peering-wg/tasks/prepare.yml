---
# Phase 2. The interface and its key, with no address and no peer. Idempotent, and
# it rotates a key only when a rotation id is passed (tasks/transport-key.yml): the
# public half is in a signed package by the next phase.
- name: peering-wg | skip unless this host declared a WireGuard peering edge
  ansible.builtin.meta: end_host
  when: not (peering_wg_enabled | bool)

- name: peering-wg | another peering's interface, port, address or carrier is not taken
  ansible.builtin.import_tasks: ownership.yml

- name: peering-wg | the interface name fits IFNAMSIZ
  ansible.builtin.assert:
    that:
      - peering_wg_interface | length > 0
      - peering_wg_interface | length <= 15
      - peering_wg_interface is match('^[a-zA-Z0-9_-]+$')
    fail_msg: "peering_wg_interface must be 1-15 chars of a-zA-Z0-9_-; got {{ peering_wg_interface }}"

- name: peering-wg | install WireGuard and nftables
  ansible.builtin.apt:
    name: "{{ peering_wg_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: peering-wg | config directory
  ansible.builtin.file:
    path: "{{ peering_wg_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

# The private key is made here and never leaves this host. Only the public half
# crosses, inside the signed package. A rotation sets the old one aside first.
- name: peering-wg | the private key, set aside first under a rotation
  ansible.builtin.include_tasks: transport-key.yml

- name: peering-wg | link script
  ansible.builtin.template:
    src: goat-peering-wg-link.sh.j2
    dest: /usr/local/sbin/goat-peering-wg-link
    owner: root
    group: root
    mode: "0755"

- name: peering-wg | link service
  ansible.builtin.template:
    src: goat-peering-wg@.service.j2
    dest: /etc/systemd/system/goat-peering-wg@.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart goat peering wg

# force: false, because phase 11 writes the full file and a re-run of this phase
# must not take the address and the peer away.
- name: peering-wg | link environment, interface only until the agreement says more
  ansible.builtin.copy:
    dest: "{{ peering_wg_env_path }}"
    force: false
    owner: root
    group: root
    mode: "0600"
    content: |
      WG_IFNAME={{ peering_wg_interface }}
      WG_KEY_FILE={{ peering_wg_key_path }}
      WG_LISTEN_PORT={{ peering_wg_listen_port }}

- name: peering-wg | bring the interface up
  ansible.builtin.systemd:
    name: "{{ peering_wg_service }}"
    state: started
    enabled: true
    daemon_reload: true

- name: peering-wg | under a rotation, the interface holds the new key
  ansible.builtin.include_tasks: transport-live.yml

- name: peering-wg | flush handlers so the checks below see this run's service
  ansible.builtin.meta: flush_handlers

- name: peering-wg | the interface answers with a public key
  ansible.builtin.command: "wg show {{ peering_wg_interface }} public-key"
  register: _pw_public
  changed_when: false

- name: peering-wg | the carrier to a peering forwarder
  ansible.builtin.include_tasks: carrier.yml
  when: peering_wg_via_forwarder | bool

- name: peering-wg | say what init will read
  ansible.builtin.debug:
    msg: "{{ peering_wg_interface }} holds {{ _pw_public.stdout }}; no address and no peer until phase 11."
