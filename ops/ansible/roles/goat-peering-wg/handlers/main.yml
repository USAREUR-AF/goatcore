---
- name: Restart goat peering wg
  ansible.builtin.systemd:
    name: "{{ peering_wg_service }}"
    state: restarted
    enabled: true
    daemon_reload: true

- name: Restart goat peering wg carrier
  ansible.builtin.systemd:
    name: "{{ peering_wg_carrier_service }}"
    state: restarted
    enabled: true
    daemon_reload: true
