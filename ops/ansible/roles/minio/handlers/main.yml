---
- name: minio compose changed
  ansible.builtin.command:
    cmd: docker compose up -d minio
    chdir: "{{ minio_compose_dir }}"
  changed_when: true

# Local handler — Prometheus is in obs-host's compose project, not ours.
# A reload picks up new rule files without restart.
# SIGHUP to the obs-host's Prometheus container: its HTTP /-/reload is off
# by default (obs-host obs_prometheus_web_lifecycle).
- name: prometheus reload from minio role
  ansible.builtin.command:
    argv: [docker, kill, --signal, HUP, prometheus]
  changed_when: true
  failed_when: false
