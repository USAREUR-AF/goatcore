---
# SCOPE — integdev lab only. This is NOT a goatnet's router.
#
# This role deploys a plain-TCP zenohd (container `zenoh-router`, host-published
# 0.0.0.0:7447, no mTLS, no ACL). Its only callers are `integdev-bootstrap.yml`
# Phase 7 and `integdev-refresh.yml` Phase 7, both of which apply it
# unconditionally in a `roles:` list.
#
# A GOATNET's router is the `goat-zenoh` role, deployed by
# `zenoh-deploy.yml -e target=<site>_hosts` (mTLS, slot-pool ACL, mesh-IP bind,
# container `{{ zenoh_stack }}-router`). Verified live: zagros-a runs
# `zagros-sandbox-zenoh-router`, nova-a runs `goat-zenoh-router`, and no
# `zenoh-router` container exists on either. Do not wire this role into
# site-bootstrap or any goatnet playbook — on a goatnet host its 0.0.0.0:7447
# publish collides with the fabric router's mesh-IP:7447 publish.
# See docs/design/zenoh-data-fabric.md §"Which role deploys a goatnet's router".
#
# Zenoh router role defaults — router + storage_manager + rocksdb backend.
#
# Image: upstream eclipse/zenoh, pinned by content digest per
# docs/design/zenoh-version-pinning.md.
#
# History: ADR 0708 chose to build the router image from source under our
# supply-chain pipeline because the in-process audit-logger plugin had to
# share a rustc + plugin-trait ABI with zenohd. Block 82S moved
# audit observation out-of-process into goat-audit-subscriber; with no
# in-process plugin left, ADR 0858 pivoted to the upstream image. The
# rocksdb storage backend is not shipped in upstream/eclipse-zenoh:1.9.0
# (only rest + storage_manager); this role downloads the matching prebuilt
# .so from the upstream zenoh-backend-rocksdb 1.9.0 release and bind-mounts
# it via the host plugin dir below. Backend + zenohd are products of the
# same upstream release, so ABI alignment is structural (F-122 closed by
# construction).
zenoh_image:              "eclipse/zenoh:1.9.0@sha256:157965d71e0bfd0a044d76a985ff0e5c306ad3968929168fb9678cd2a7fec23f"
zenoh_listen_addr:        "tcp/0.0.0.0:7447"
zenoh_metrics_addr:       "tcp/0.0.0.0:8088"
zenoh_storage_path:       "/var/lib/zenoh/rocksdb"
zenoh_plugin_dir:         "/opt/zenoh/plugins"
zenoh_config_path:        "/etc/zenoh/config.json5"
zenoh_compose_path:       "/opt/zenoh/docker-compose.yml"
zenoh_retention_days:     7

# Peer router target for federation — set per-host via inventory.
# Empty = standalone router (no federation).
zenoh_peer_target:        ""

# ---- Router ZID pinning (deterministic, per-host stable) -------------------
# A pinned Zenoh ID gives the router one stable identity across restarts:
# routing-graph continuity, a stable audit-dedup key `(src_zid, key_expr)`,
# and a durable provenance anchor for the (ZID, EntityId) source-info chain
# that consumers read. Without it, zenohd mints a fresh random ZID on every
# restart and the same logical router reads as a new origin each time.
# See ADR 1041 + docs/design/zenoh-capability-adoption.md §"Router ZID pinning".
#
# Derived, NOT baked into the image (a fixed id in a cloneable artifact is an
# instant collision the moment you scale past one instance) and NOT from
# machine-id (a notorious clone-collision source on VMs). The seed is the
# operator-assigned inventory hostname + realm — unique fleet-wide and stable
# across reinstalls. Hashed and truncated to 16 bytes (the zenoh ZID max),
# lowercase hex (zenoh rejects uppercase). The ZID stays opaque — site/region
# is encoded in the namespace + cert URI-SAN, not the ZID (deliberate delta,
# see docs/design/deliberate-deltas.md). Override per-host by setting
# zenoh_router_zid directly.
#
# LEADING-ZERO STRIP (regex_replace '^0+') — a zenoh ZID is a u128 rendered as
# MINIMAL hex, so a leading-zero hex string is REJECTED at config load:
#   "Invalid id: 0c21… - Leading 0s are not valid" (zenoh-protocol core/mod.rs)
# and zenohd exits 133 into a crash loop. ~1 host in 16 draws a seed-hash whose
# first nibble is 0; zagros-b hit it live under the sibling
# goat-zenoh role, which was fixed then — this role was left with
# the same derivation until F-350 swept the class. Scope here is the integdev
# lab (see the header), so the exposure was a future integdev host, not a
# goatnet. Stripping yields a valid shorter (still ≤16-byte) ZID and is a NO-OP
# for every hash that does not start with 0, so no already-running router's ZID
# changes on its next redeploy — and none can be carrying a leading-zero ZID,
# because such a router could never have started. Verified: no host
# in inventory/mgmt-hosts.ini draws a leading zero today (only mgmt-zagros-02-thor
# ever did, under the already-fixed goat-zenoh role), so this change is
# preventive and moves nothing that is live.
zenoh_zid_realm:          "{{ site_id | mandatory }}"
zenoh_zid_seed:           "{{ inventory_hostname }}|{{ zenoh_zid_realm }}|zenoh-router"
zenoh_router_zid:         "{{ (zenoh_zid_seed | hash('sha256'))[:32] | regex_replace('^0+', '') }}"

# ---- RocksDB backend artifact (upstream eclipse-zenoh release) -------------
# Per-arch standalone .zip published by the eclipse-zenoh project at the
# 1.9.0 release tag; contains one file: libzenoh_backend_rocksdb.so.
# The role picks the arch via ansible_architecture and verifies the .zip
# SHA256 (published by the GitHub API at release-asset level).
#
# When bumping zenoh_image to a newer version, bump both the version + the
# per-arch checksums here in lockstep. ops/ci/check-zenoh-pinning.sh asserts
# the version line matches the version in docs/design/zenoh-version-pinning.md.
zenoh_rocksdb_backend_version: "1.9.0"
zenoh_rocksdb_backend_url_template: >-
  https://github.com/eclipse-zenoh/zenoh-backend-rocksdb/releases/download/{version}/zenoh-backend-rocksdb-{version}-{arch}-unknown-linux-musl-standalone.zip
zenoh_rocksdb_backend_arch_map:
  aarch64: "aarch64"
  x86_64:  "x86_64"
zenoh_rocksdb_backend_sha256_map:
  aarch64: "298734a4f50dfa12c27337cbafeb7d99949f4f3fda4c330ff6891d39fdd97112"
  x86_64:  "88b13af5ddaadff9ec55c61765db6344666ae38731257877023b07c59a0c4bd1"

# Container memory ceilings. The defaults are the values these limits had
# when they were written into the compose template; a small host lowers them
# in group_vars. ops/ci/check-compose-memory-is-variable.sh refuses a literal.
zenoh_memory_limit: 1G  # the zenoh-router container
zenoh_memory_reservation: 256M  # its memory reservation
