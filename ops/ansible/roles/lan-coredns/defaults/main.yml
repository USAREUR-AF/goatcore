---
# lan-coredns role defaults — closed-LAN authoritative DNS server.
# See README.md for the load-bearing invariants vs the sibling mesh-coredns role.

# Required (must be set per-host or in wrapper play vars):
#   lan_coredns_bind_ip         — host's LAN IP. NOT mesh, NOT wg-cp0.
#                                 The closed-LAN posture means LAN bind
#                                 IS the trust boundary (inverse of
#                                 mesh-coredns).
#   lan_coredns_zone_name       — authoritative zone (e.g. "nova.lan").
#   lan_coredns_smoke_test_name — hostname expected to resolve.
#   lan_coredns_smoke_test_expect — expected IP for the smoke test.

# Defaults — override per-site as needed.

# Port 53 — on the closed LAN, no other consumer of :53 on the host.
# Distinct from mesh-coredns which uses 5353 to coexist with netbird
# daemon's :53 listener.
lan_coredns_port: 53

# Zone data lives under ops/dns/<zone-short-name>/<zone-name>.hosts.
# Default path mirrors the per-site convention.
lan_coredns_zone_dir: "{{ playbook_dir }}/../dns/{{ site_id }}"   # derived from site_id; a shared role must not name a goatnet

# Host paths
lan_coredns_dir: "/opt/lan-dns"
lan_coredns_corefile_path: "{{ lan_coredns_dir }}/Corefile"
lan_coredns_zone_path: "{{ lan_coredns_dir }}/{{ lan_coredns_zone_name }}.hosts"
lan_coredns_compose_path: "{{ lan_coredns_dir }}/docker-compose.yml"
lan_coredns_owner: "{{ ansible_user }}"
lan_coredns_group: "{{ ansible_user }}"

# CoreDNS image. Same as mesh-coredns — official CNCF, Docker Hub verified
# publisher. An overlay may set a hardened catalogue image here (ADR 1220).
lan_coredns_image: "coredns/coredns:1.15.0"

# Container name. Distinct from mesh-coredns's "mesh-dns" — both could
# theoretically run on the same host (they wouldn't in practice but the
# naming makes it explicit which posture is in effect).
lan_coredns_container_name: "lan-dns"
