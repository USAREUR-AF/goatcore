---
# peering-prepare.yml — phase 2 of a peering standup: make what the package measures.
#
#   Driver: ops/scripts/peering-standup.sh, goatbuilder federate
#   Roles:  roles/goat-peering-wg, roles/goat-peering-spire
#
# `goat federate init` reads the federation interface's key with `wg show`, so the
# interface exists before our half is signed. It carries nothing at this point: no
# address and no peer, which arrive in phase 11 once the agreement selects wireguard.
# The SPIRE bundle written here is what phase 5 exchanges.
- name: Peering prepare (the federation interface, and the bundle to exchange)
  hosts: peering_edges
  gather_facts: true
  become: true
  pre_tasks:
    - name: The peering plays require the host firewall baseline on an edge (GB-279)
      ansible.builtin.include_role:
        name: goat-host-firewall
        tasks_from: require.yml
  tasks:
    - name: Prepare the federation interface
      ansible.builtin.include_role:
        name: goat-peering-wg
        tasks_from: prepare
      when: peering_wg_enabled | default(false) | bool
    - name: Export our SPIRE bundle for the exchange
      ansible.builtin.include_role:
        name: goat-peering-spire
        tasks_from: export
