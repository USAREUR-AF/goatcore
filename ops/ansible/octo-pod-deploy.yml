---
# octo-pod-deploy.yml: an octo-pod from its pinned, signed release (gate J18;
# docs/design/goatbuilder-build-targets.md section 3.2, "Edge kinds keep their
# own installers").
#
# The play of the release component `octo-pod`, found by its name. join-node
# runs it in phase 13 of a machine of the type octo-pod, and `goatbuilder
# deploy` and `rollback` run it on a group, after goatbuilder has fetched the
# release's checksums file, verified its signature for octo-pod's release
# workflow at the pin's tag, and held the package to it, on the operator's
# machine. Never run by hand with files nothing verified.
#
# octo-pod's own repository installs a pod; this play calls its installer and
# reimplements none of it:
#   1. the release-file role puts the verified package in place and writes the
#      deploy ledger row (rollback: it switches back to the package before);
#   2. apt installs that package, and the version dpkg then reports must be the
#      package's own;
#   3. `octo-pod bootstrap` prepares the box (container runtime, mesh agent,
#      clock, the images the package pins by digest);
#   4. a machine with no pod identity gets one, named for the machine, with
#      `octo-pod init` (the pod name is its mesh peer name); one that has an
#      identity keeps it;
#   5. `octo-pod apply` converges it and `octo-pod verify` must pass.
# The pod captures and keeps locally; it releases no feed to the fabric until
# its owner gives it a fabric slot, which is not this play's.
- name: octo-pod | install the verified release, then the pod's own steps
  hosts: "{{ target | mandatory }}"
  gather_facts: true
  become: true
  vars:
    octo_pod_cli: /opt/octo-pod/bin/octo-pod
    octo_pod_etc: /etc/octo-pod
  roles:
    - role: release-file
  tasks:
    - name: octo-pod | the package the release-file role put in place
      ansible.builtin.command: readlink -e "{{ release_file_root | default('/opt/goat/releases') }}/{{ release_file_component }}/current"
      register: _op_pkg
      changed_when: false

    - name: octo-pod | the package's own name and version
      ansible.builtin.command: dpkg-deb --field "{{ _op_pkg.stdout }}" Package Version
      register: _op_fields
      changed_when: false

    - name: octo-pod | it is octo-pod's package
      ansible.builtin.assert:
        that:
          - _op_pkg.stdout is match('.*\.deb$')
          - _op_fields.stdout_lines | length == 2
          - _op_fields.stdout_lines[0] == 'Package: octo-pod'
        fail_msg: "{{ _op_pkg.stdout }} is not octo-pod's package ({{ _op_fields.stdout_lines | join(', ') }}): the release's file for this host must be its .deb"
        quiet: true

    - name: octo-pod | install the package and what it depends on
      ansible.builtin.apt:
        deb: "{{ _op_pkg.stdout }}"
        allow_downgrade: true
      register: _op_apt
      retries: 20
      delay: 15
      until: _op_apt is succeeded

    - name: octo-pod | the version installed
      ansible.builtin.command: dpkg-query --showformat '${Version}' --show octo-pod
      register: _op_installed
      changed_when: false

    - name: octo-pod | the version installed is the package's
      ansible.builtin.assert:
        that:
          - "('Version: ' ~ _op_installed.stdout) == _op_fields.stdout_lines[1]"
        fail_msg: "dpkg reports octo-pod {{ _op_installed.stdout }}, not the release's {{ _op_fields.stdout_lines[1] }}"
        quiet: true

    - name: octo-pod | bootstrap (octo-pod's own preparation of the box)
      ansible.builtin.command: "{{ octo_pod_cli }} bootstrap"
      register: _op_bootstrap
      changed_when: "'changed=0' not in _op_bootstrap.stdout"

    - name: octo-pod | does the pod have an identity?
      ansible.builtin.stat:
        path: "{{ octo_pod_etc }}/inventory.ini"
      register: _op_identity

    - name: octo-pod | the pod's name is the machine's
      ansible.builtin.assert:
        that:
          - inventory_hostname is match('^[a-z0-9][a-z0-9-]*$')
        fail_msg: "octo-pod names a pod with lowercase letters, digits and hyphens, and its name is its mesh peer name: {{ inventory_hostname }} cannot be one"
        quiet: true
      when: not _op_identity.stat.exists

    - name: octo-pod | an identity for a pod that has none
      ansible.builtin.command: "{{ octo_pod_cli }} init --pod {{ inventory_hostname }}"
      when: not _op_identity.stat.exists
      changed_when: true

    - name: octo-pod | apply (converge the pod)
      ansible.builtin.command: "{{ octo_pod_cli }} apply"
      register: _op_apply
      changed_when: "'changed=0' not in _op_apply.stdout"

    - name: octo-pod | verify (octo-pod's own pass or fail)
      ansible.builtin.command: "{{ octo_pod_cli }} verify"
      changed_when: false
