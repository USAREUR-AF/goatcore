---
# Stage minted leaf cert+key pairs onto a host for the Zenoh publisher services
# and the audit subscriber.
#
# Only the leaf and its key are staged. Each of these roles reads the goatnet's
# CA root from the router's TLS directory (<service>_ca_root_src), which
# zenoh-deploy.yml fills, never from its own cert directory.
#
# WHY THIS EXISTS: every publisher role — fabric-health, mesh-health,
# presence-health, time-health, consistency-health, consistency-console,
# fabric-crawler — FAILS CLOSED
# when its leaf is absent, pointing at the offline-CA ceremony. But nothing in the
# repo ever put the ceremony's OUTPUT on the host. Previously that hop was a
# hand-run scp, undocumented, and it is the single reason a joiner node cannot be
# stood up from the plays alone. This play is that missing hop.
#
# It is deliberately dumb: it copies files the CA ceremony already produced. It
# never mints, never touches the CA, and refuses rather than deploying a service
# with no identity. Each leaf goes where the service's role reads it on this
# host: the role's <service>_cert_dir from the site's group_vars, else the
# role's default (service_leaf_map below).
#
# Usage (after ops/scripts/mint-site-certs.sh <site>):
#   ansible-playbook -i inventory/mgmt-hosts.ini -e target=<group> stage-service-leaves.yml \
#     -e leaf_src_dir=<the out= directory that script printed>
# where <group> is the goatnet's host group (e.g. zagros_dev_hosts). Narrow to one
# host within it with `-l <host>` if the group has more than one.
#
# `target` is MANDATORY and has no default: the leaf set is goatnet-scoped (its
# CN and URI-SAN name one goatnet), so a run with no target that fell through to
# `hosts: all` would write one goatnet's leaves over every goatnet's hosts in the
# inventory. Binding the play to `{{ target | mandatory }}`, like the other
# site-scoped deploy plays (audit-subscriber-deploy.yml, brief-deploy.yml), makes
# that mistake a parse-time failure instead of a cross-goatnet overwrite.
#
# Idempotent: re-running with unchanged leaves reports ok, not changed. Rotation
# is the same command — a new leaf in the source dir replaces the old one and the
# service deploy that follows picks it up.
- name: Stage service leaf certificates
  hosts: "{{ target | mandatory }}"
  become: true
  gather_facts: false

  vars:
    # Where mint-site-certs.sh wrote the leaves, on the CONTROL node.
    leaf_src_dir: ""

    # service -> where its role reads its leaf. `dir_var` is the role's
    # <service>_cert_dir variable: the host's group_vars value when it sets one,
    # else `dir`, the role's own default. `cert_var`/`key_var` name a role's
    # file-name variables where it has them (else <service>-cert.pem and
    # <service>-key.pem). tests/test_stage_service_leaves.py holds each default
    # to the role's defaults/main.yml.
    #
    # The crawler's role reads fabric-health's leaf by default (its directory and
    # file names); `shares_with` says so. When the crawler resolves to exactly
    # fabric-health's files it is not staged over them, and the run says so.
    # Any other two services that resolve to one file are refused.
    service_leaf_map:
      fabric-health: {dir_var: fabric_health_cert_dir, dir: /opt/fabric-health/certs}
      mesh-health: {dir_var: mesh_health_cert_dir, dir: /opt/mesh-health/certs}
      presence-health: {dir_var: presence_health_cert_dir, dir: /opt/presence-health/certs}
      time-health: {dir_var: time_health_cert_dir, dir: /opt/time-health/certs}
      peer-health: {dir_var: peer_health_cert_dir, dir: /opt/peer-health/certs}
      consistency-health: {dir_var: consistency_health_cert_dir, dir: /opt/consistency-health/certs}
      # The console subscribes to the roll-up over TLS and fails closed without its leaf.
      consistency-console: {dir_var: consistency_console_cert_dir, dir: /opt/consistency-console/certs}
      # panoscope (its role is in goatstuff) reads its Zenoh client pair under these
      # names; with no cert_var/key_var, an entry's cert and key name the files.
      panoscope:
        dir_var: panoscope_cert_dir
        dir: /etc/panoscope
        cert: zenoh-client-cert.pem
        key: zenoh-client-key.pem
      fabric-crawler:
        dir_var: fabric_crawler_cert_dir
        dir: /opt/fabric-health/certs
        cert_var: fabric_crawler_cert_file
        cert: fabric-health-cert.pem
        key_var: fabric_crawler_key_file
        key: fabric-health-key.pem
        shares_with: fabric-health
      goat-topology: {dir_var: goat_topology_cert_dir, dir: /opt/goat-topology/certs}
      audit-subscriber: {dir_var: audit_subscriber_cert_dir, dir: /opt/audit-subscriber/certs}
      node-net-health: {dir_var: node_net_health_cert_dir, dir: /opt/node-net-health/certs}
      ntp-health-pub: {dir_var: ntp_health_pub_cert_dir, dir: /opt/ntp-health-pub/certs}

    # Stage only these services (e.g. -e '{"leaf_only": ["goat-topology"]}'); empty = all.
    leaf_only: []

    # Chainguard images run as uid 65532; the roles normalize to this too.
    leaf_owner: "65532"

  tasks:
    - name: assert a source directory was given
      ansible.builtin.assert:
        that:
          - leaf_src_dir | length > 0
        fail_msg: >-
          stage-service-leaves: pass -e leaf_src_dir=<dir> pointing at the output of
          ops/scripts/mint-site-certs.sh (the out= directory it printed).
        quiet: true

    - name: resolve the source directory on the control node
      ansible.builtin.set_fact:
        leaf_src_resolved: "{{ leaf_src_dir | expanduser }}"
        leaf_map: >-
          {{ service_leaf_map if (leaf_only | length == 0)
             else (service_leaf_map | dict2items | selectattr('key', 'in', leaf_only) | items2dict) }}

    # Where each role reads its leaf on this host: its group_vars value, else
    # the role's default.
    - name: resolve where each service's role reads its leaf
      ansible.builtin.set_fact:
        leaf_dest: >-
          {{ leaf_dest | default({}) | combine({item.key: {
               'dir': lookup('vars', item.value.dir_var, default=item.value.dir),
               'cert': lookup('vars', item.value.cert_var, default=item.value.cert)
                       if item.value.cert_var is defined
                       else item.value.cert | default(item.key ~ '-cert.pem'),
               'key': lookup('vars', item.value.key_var, default=item.value.key)
                      if item.value.key_var is defined
                      else item.value.key | default(item.key ~ '-key.pem'),
               'shares_with': item.value.shares_with | default('')}}) }}
      loop: "{{ service_leaf_map | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    # A service that reads exactly the files of the service it shares with
    # (the crawler with fabric-health, by default) has nothing of its own to
    # stage there.
    - name: start with no service set aside
      ansible.builtin.set_fact:
        leaf_shared: []

    - name: list the services that share a leaf
      ansible.builtin.set_fact:
        leaf_shared: "{{ leaf_shared + [item.key] }}"
      loop: "{{ leaf_dest | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      # Over the whole map, as the one-file-one-reader check is: a leaf_only run
      # must still know that a service it does not stage reads another's leaf.
      when:
        - item.value.shares_with | length > 0
        - item.value.shares_with in leaf_dest
        - (item.value.dir ~ '/' ~ item.value.cert) == (leaf_dest[item.value.shares_with].dir ~ '/' ~ leaf_dest[item.value.shares_with].cert)
        - (item.value.dir ~ '/' ~ item.value.key) == (leaf_dest[item.value.shares_with].dir ~ '/' ~ leaf_dest[item.value.shares_with].key)

    - name: say which services read another's leaf
      ansible.builtin.debug:
        msg: >-
          {{ item }} reads {{ leaf_dest[item].shares_with }}'s leaf
          ({{ leaf_dest[item].dir }}/{{ leaf_dest[item].cert }}): it is not staged over it.
          To give it its own, set {{ service_leaf_map[item].dir_var }} and its file
          names in the site's group_vars.
      loop: "{{ leaf_shared }}"

    - name: the services to stage, each with the files its role reads
      ansible.builtin.set_fact:
        leaf_stage: >-
          {{ leaf_dest | dict2items | selectattr('key', 'in', leaf_map.keys() | list)
             | rejectattr('key', 'in', leaf_shared) | list }}

    # Over every service in the map, not only those staged now: a leaf_only run
    # must not overwrite a file another service's role reads.
    - name: which services' roles read each file
      ansible.builtin.set_fact:
        leaf_readers: >-
          {{ leaf_readers | default({})
             | combine({(item.value.dir ~ '/' ~ item.value.cert): (leaf_readers | default({})).get(item.value.dir ~ '/' ~ item.value.cert, []) + [item.key]})
             | combine({(item.value.dir ~ '/' ~ item.value.key): (leaf_readers | default({})).get(item.value.dir ~ '/' ~ item.value.key, []) + [item.key]}) }}
      loop: "{{ leaf_dest | dict2items | rejectattr('key', 'in', leaf_shared) | list }}"
      loop_control:
        label: "{{ item.key }}"

    - name: refuse two services whose roles read one file
      ansible.builtin.assert:
        that:
          - (leaf_readers | default({}) | dict2items | map(attribute='value') | map('length') | max | default(0)) <= 1
        fail_msg: >-
          stage-service-leaves: {% for f, who in (leaf_readers | default({})).items() if who | length > 1 %}{{ who | join(' and ') }} read the same file ({{ f }}); {% endfor %}staging one would overwrite the other's
          leaf. Give each its own <service>_cert_dir in the site's group_vars.
        quiet: true

    - name: refuse when a leaf is missing on the control node
      ansible.builtin.stat:
        path: "{{ leaf_src_resolved }}/{{ item.key }}-cert.pem"
      delegate_to: localhost
      become: false
      register: leaf_src_stat
      loop: "{{ leaf_stage }}"
      loop_control:
        label: "{{ item.key }}"

    - name: report which leaves are absent
      ansible.builtin.assert:
        that:
          - leaf_src_stat.results | rejectattr('stat.exists') | list | length == 0
        fail_msg: >-
          stage-service-leaves: no leaf in {{ leaf_src_resolved }} for
          {{ leaf_src_stat.results | rejectattr('stat.exists')
             | map(attribute='item.key') | join(', ') }}.
          Add them to the site's ops/enrollment/manifests/<site>-certs.yaml and
          re-run mint-site-certs.sh — do not hand-copy from another site, the CN
          and URI-SAN are goatnet-scoped.
        quiet: true

    - name: ensure each cert directory exists
      ansible.builtin.file:
        path: "{{ item.value.dir }}"
        state: directory
        owner: "{{ leaf_owner }}"
        group: "{{ leaf_owner }}"
        mode: "0750"
      loop: "{{ leaf_stage }}"
      loop_control:
        label: "{{ item.value.dir }}"

    - name: stage leaf certificates
      ansible.builtin.copy:
        src: "{{ leaf_src_resolved }}/{{ item.key }}-cert.pem"
        dest: "{{ item.value.dir }}/{{ item.value.cert }}"
        owner: "{{ leaf_owner }}"
        group: "{{ leaf_owner }}"
        mode: "0644"
      loop: "{{ leaf_stage }}"
      loop_control:
        label: "{{ item.key }}"

    - name: stage leaf private keys
      ansible.builtin.copy:
        src: "{{ leaf_src_resolved }}/{{ item.key }}-key.pem"
        dest: "{{ item.value.dir }}/{{ item.value.key }}"
        owner: "{{ leaf_owner }}"
        group: "{{ leaf_owner }}"
        mode: "0400"
      loop: "{{ leaf_stage }}"
      loop_control:
        label: "{{ item.key }}"
      no_log: true
