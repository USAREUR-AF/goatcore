# The same hosts as mgmt-hosts.ini, reached over the mesh instead of the cloud
# session door. Loaded after mgmt-hosts.ini, so a host listed here overrides its
# connection settings. Fill it in at standup phase 8, once the hosts have mesh
# addresses; until then it is empty and every play uses mgmt-hosts.ini.
#
# [<site>_hosts]
# <host> ansible_host=<mesh address> ansible_user=<user> ansible_connection=ssh
