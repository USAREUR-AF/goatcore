---
# SPDX-License-Identifier: Apache-2.0
#
# Operator-fired playbook bringing up the peering directory
# (`saltlick.<site>.<zone>`) on a mgmt host.
#
# WHAT THIS SERVICE IS, SO THE DEPLOY IS NOT MISREAD
#   A directory where a party publishes its own interconnection capability, so
#   two organisations can check compatibility before they build anything
#   between them. Advisory, never authoritative: being listed grants access to
#   nothing, and federation works with this service switched off. Deploying it
#   changes no party's ability to federate — it only saves two competent
#   parties from misconfiguring each other.
#   Design: docs/design/peering-directory-service.md.
#   Source and image: USAREUR-AF/saltlick, ghcr.io/usareur-af/saltlick (public).
#
# Usage:
#   cd ops/ansible
#   OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES \
#     ../scripts/ansible-preflight.sh \
#     -i inventory/hosts.ini -i inventory/mgmt-hosts-mesh.ini \
#     -e target=<mgmt host or group> saltlick-deploy.yml
#
# Pre-flight, all operator-side and none of it done by this play:
#   1. saltlick.<site>.<zone> is in the master Let's Encrypt SAN list: set
#      `saltlick_enabled: true` in the site's group_vars and re-run
#      traefik-acme.yml BEFORE this playbook.
#   2. Mesh DNS resolves the name: the isitup_services row is registered and
#      ops/dns/generate-mesh-hosts.py has been re-run and CoreDNS deployed.
#      Register the row in the SAME change that enables the deploy — a surface
#      declared ahead of its deploy grades `unknown` and stays invisible, and
#      one registered after it is a service nobody can find.
#
# Cross-refs:
#   docs/design/peering-directory-service.md (the invariant, §2; mesh-internal, §5.1)
#   docs/design/federation-package-spec.md   (the artifact this directory serves)

- name: saltlick | deploy the peering directory
  hosts: "{{ target | mandatory }}"
  become: true
  gather_facts: true
  roles:
    - saltlick
