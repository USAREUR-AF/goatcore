---
# site.yml — the relay tier.
#
# A goatnet is stood up by `goatbuilder standup` (docs/operations/goatnet-standup.md),
# not by this file. It remains for re-running the relay tier by hand. The site's
# services are site-services.yml. A deployment with tiers of its own (a network
# host, bridges, probes) carries its own site.yml in its overlay.
#
# Usage:
#   ansible-playbook site.yml
#
# Prerequisites:
#   - terraform apply (creates the relay VPSes)
#   - inventory/generate-relays.sh (populates the inventory + SSH keys)

- import_playbook: relay-server.yml
