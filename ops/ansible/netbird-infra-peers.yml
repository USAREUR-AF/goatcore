---
# ops/ansible/netbird-infra-peers.yml — the site's own hosts' peers in its
# <PREFIX>-INFRA group.
#
# netbird-acl-bootstrap.yml creates a site's groups with no peers, and nothing
# else puts the site's own management hosts in its INFRA group (the taxonomy's
# "substrate/infra peers (mgmt hosts, ...)"). join-node phase 10 mints a new
# node's setup key with the groups the founder's own peer holds
# (mesh-enroll-host.yml, mesh_enroll_groups_from_peer), and refuses when that
# peer holds none: so on a fresh goatnet every join-node refused there.
# Standup phase 12 runs this after the ACL bootstrap.
#
# For each host of `site_group` in the inventory, the peer whose name or
# hostname is that host's name joins <PREFIX>-INFRA. A peer already in it is
# left as it is; nothing is removed from the group. A host with no peer, or a
# name that matches more than one peer, stops the run before anything is
# written.
#
#   ansible-playbook -i localhost, -i inventory/mgmt-hosts.ini --connection local \
#     netbird-infra-peers.yml -e target_site=zagros -e site_group=zagros_hosts \
#     -e netbird_mgmt_url=https://netbird.zagros.example.org
#
# The token is <SITE>_NB_API_TOKEN, as for netbird-acl-bootstrap.yml.

- name: NetBird INFRA group holds the site's own hosts
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  # The API may serve a certificate from the goatnet's own CA (a LAN goatnet
  # does): verify against it when its root is in the repository.
  module_defaults:
    ansible.builtin.uri:
      ca_path: "{{ omit if (netbird_api_ca | default('auto')) == 'public' else ((playbook_dir ~ '/../enrollment/ca/' ~ target_site ~ '/root-cert.pem') if (playbook_dir ~ '/../enrollment/ca/' ~ target_site ~ '/root-cert.pem') is exists else omit) }}"
  vars:
    taxonomy_path: "{{ playbook_dir }}/netbird_acl_taxonomy.yml"
    _nb_url: "{{ netbird_mgmt_url | mandatory }}"
    _nb_token: "{{ lookup('env', (target_site | upper | replace('-', '_')) ~ '_NB_API_TOKEN') }}"
    _hosts: "{{ groups[site_group | mandatory] | default([]) }}"
  tasks:
    - name: infra peers | the site, its hosts and its token are given
      ansible.builtin.assert:
        that:
          - (target_site | default('')) | length > 0
          - _hosts | length > 0
          - _nb_token | length > 0
        quiet: true
        fail_msg: >-
          netbird-infra-peers.yml needs -e target_site, -e site_group naming an
          inventory group with hosts (it has {{ _hosts | length }}), and
          {{ (target_site | default('') | upper | replace('-', '_')) ~ '_NB_API_TOKEN' }} in the environment.

    - name: infra peers | load the taxonomy
      ansible.builtin.include_vars:
        file: "{{ taxonomy_path }}"

    - name: infra peers | the site's INFRA group name
      ansible.builtin.set_fact:
        _infra_name: "{{ (netbird_acl_taxonomy[target_site].site_prefix | default(target_site | upper)) ~ '-INFRA' }}"

    - name: infra peers | read the peers and the groups
      ansible.builtin.uri:
        url: "{{ _nb_url }}/api/{{ item }}"
        method: GET
        headers:
          Authorization: "Token {{ _nb_token }}"
          Accept: application/json
        status_code: [200]
        return_content: true
      loop: [peers, groups]
      register: _nb_read
      check_mode: false
      no_log: true

    - name: infra peers | match each host to one peer
      vars:
        _peers: "{{ _nb_read.results[0].json }}"
        _groups: "{{ _nb_read.results[1].json }}"
        _match: >-
          {%- set out = {} -%}
          {%- for h in _hosts -%}
          {%- set _ = out.update({h: (_peers | selectattr('name', 'equalto', h) | list
                                     + _peers | selectattr('hostname', 'equalto', h) | list)
                                   | map(attribute='id') | unique | list}) -%}
          {%- endfor -%}
          {{ out }}
      ansible.builtin.set_fact:
        _infra_group: "{{ _groups | selectattr('name', 'equalto', _infra_name) | list }}"
        _host_peer: "{{ _match }}"

    - name: infra peers | the group exists and every host has exactly one peer
      ansible.builtin.assert:
        that:
          - _infra_group | length == 1
          - _host_peer.values() | map('length') | reject('equalto', 1) | list | length == 0
        quiet: true
        fail_msg: >-
          Nothing was written.
          {% if _infra_group | length != 1 %}{{ _infra_name }} is {{ 'missing' if _infra_group | length == 0 else 'there more than once' }}: run netbird-acl-bootstrap.yml for {{ target_site }} first.{% endif %}
          {% for h, ids in _host_peer.items() if ids | length != 1 %}
          {{ h }}: {{ 'no peer named so (enrol it first: mesh-enroll-host.yml)' if ids | length == 0 else (ids | length) ~ ' peers named so' }}.
          {% endfor %}

    - name: infra peers | what the group holds, and what it gains
      vars:
        _have: "{{ (_infra_group[0].peers | default([], true)) | map(attribute='id') | list }}"
        _want: "{{ _host_peer.values() | map('first') | list }}"
      ansible.builtin.set_fact:
        _infra_have: "{{ _have }}"
        _infra_add: "{{ _want | difference(_have) }}"

    - name: infra peers | put the site's hosts in {{ _infra_name }}
      ansible.builtin.uri:
        url: "{{ _nb_url }}/api/groups/{{ _infra_group[0].id }}"
        method: PUT
        headers:
          Authorization: "Token {{ _nb_token }}"
          Content-Type: application/json
        body_format: json
        body:
          name: "{{ _infra_name }}"
          peers: "{{ (_infra_have + _infra_add) | unique | list }}"
        status_code: [200]
      when: _infra_add | length > 0
      changed_when: true
      no_log: true

    - name: infra peers | say what changed
      ansible.builtin.debug:
        msg: >-
          {{ _infra_name }}: {{ (_infra_add | length) ~ ' peer(s) added for ' ~ (_hosts | join(', ')) if _infra_add | length > 0
             else 'already holds the peers of ' ~ (_hosts | join(', ')) ~ '; nothing changed' }}
