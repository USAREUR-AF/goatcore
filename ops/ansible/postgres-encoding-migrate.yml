---
# postgres-encoding-migrate.yml — move a goatnet's Postgres clusters from
# SQL_ASCII to UTF8, every Spock member together, with a rollback copy kept.
#
# Status: WIP, not for production use — the gate is one live migration of a
# goatnet run end to end with this playbook (docs/operations/postgres-utf8-migration.md).
#
# Runbook: docs/operations/postgres-utf8-migration.md (when, outage, order).
# Role:    roles/postgres-encoding-migrate (one tasks file per phase).
#
# Usage (from an assembled tree, ops/ansible):
#   ../scripts/ansible-preflight.sh -i inventory/mgmt-hosts.ini -i inventory/mgmt-hosts-mesh.ini \
#     postgres-encoding-migrate.yml -e migrate_groups=<founder>_hosts,<joiner>_hosts
#
#   -e postgres_encoding_migrate_action=migrate   (default) phases 1-9, resumable
#   -e postgres_encoding_migrate_stop_after=<n>   stop after phase n
#   -e postgres_encoding_migrate_action=status    what the open run has done
#   -e postgres_encoding_migrate_action=rollback -e postgres_encoding_migrate_confirm=<run id>
#   -e postgres_encoding_migrate_action=cleanup  -e postgres_encoding_migrate_confirm=<run id>
#
# migrate_groups is every group holding the goatnet's Spock members and their
# standbys (comma-separated). Not a site's obs group: it runs no goatnet
# Postgres. Every Spock node a member subscribes to must be listed.
#
# Phases (each leaves a marker per host; a re-run skips what is done):
#   1 preflight   gates only, opens the run
#   2 quiesce     stop units and writers, wait for sessions to drain
#   3 capture     Spock caught up, replicated tables identical, row counts,
#                 pgBackRest backup, dumps (each node its own)
#   4 snapshot    stop Postgres, copy PGDATA to a kept volume, move the
#                 pgBackRest repository aside
#   5 reinit      compose re-creates Postgres as UTF8; restore; counts equal
#   6 standby     rebuild each pair site's standby from its new primary
#   7 pgbackrest  new stanza + full backup
#   8 rewire      Spock: founders, joiners; Ory staged; subscription set equal
#   9 finish      a write on each node replicates; start writers and units

- name: "postgres-encoding-migrate | inputs"
  hosts: localhost
  gather_facts: false
  become: false
  tasks:
    - name: "inputs | migrate_groups and action"
      ansible.builtin.assert:
        that:
          - migrate_groups is defined
          - migrate_groups is string
          - migrate_groups | length > 0
          - (postgres_encoding_migrate_action | default('migrate')) in ['migrate', 'rollback', 'cleanup', 'status']
        fail_msg: >-
          Pass -e migrate_groups=<group>[,<group>...] (the goatnet's Spock
          member groups, comma-separated) and optionally
          -e postgres_encoding_migrate_action=migrate|rollback|cleanup|status.
        quiet: true

    - name: "inputs | every listed group has hosts in this inventory"
      ansible.builtin.assert:
        that:
          - (groups[item] | default([])) | length > 0
        fail_msg: "Group {{ item }} has no hosts in this run's inventory."
        quiet: true
      loop: "{{ migrate_groups.split(',') | map('trim') | select | list }}"

# ---------------------------------------------------------------- status
- name: "postgres-encoding-migrate | status"
  hosts: "{{ migrate_groups }}"
  gather_facts: false
  become: "{{ postgres_encoding_migrate_become | default(true) }}"
  tasks:
    - name: status
      ansible.builtin.include_role:
        name: postgres-encoding-migrate
        tasks_from: "{{ item }}"
      loop: [context.yml, status.yml]
      when: (postgres_encoding_migrate_action | default('migrate')) == 'status'

# ---------------------------------------------------------------- migrate
- name: "postgres-encoding-migrate | phase 1 preflight"
  hosts: "{{ migrate_groups }}"
  gather_facts: false
  become: "{{ postgres_encoding_migrate_become | default(true) }}"
  any_errors_fatal: true
  tasks:
    - name: preflight
      ansible.builtin.include_role:
        name: postgres-encoding-migrate
        tasks_from: "{{ item }}"
      loop: [context.yml, preflight.yml]
      when: (postgres_encoding_migrate_action | default('migrate')) == 'migrate'

- name: "postgres-encoding-migrate | phase 2 quiesce"
  hosts: "{{ migrate_groups }}"
  gather_facts: false
  become: "{{ postgres_encoding_migrate_become | default(true) }}"
  any_errors_fatal: true
  tasks:
    - ansible.builtin.include_role: {name: postgres-encoding-migrate, tasks_from: phase.yml}
      vars: {pem_phase: "2", pem_name: quiesce}
      when: (postgres_encoding_migrate_action | default('migrate')) == 'migrate'

- name: "postgres-encoding-migrate | phase 3 capture"
  hosts: "{{ migrate_groups }}"
  gather_facts: false
  become: "{{ postgres_encoding_migrate_become | default(true) }}"
  any_errors_fatal: true
  tasks:
    - ansible.builtin.include_role: {name: postgres-encoding-migrate, tasks_from: phase.yml}
      vars: {pem_phase: "3", pem_name: capture}
      when: (postgres_encoding_migrate_action | default('migrate')) == 'migrate'

- name: "postgres-encoding-migrate | phase 4 snapshot"
  hosts: "{{ migrate_groups }}"
  gather_facts: false
  become: "{{ postgres_encoding_migrate_become | default(true) }}"
  any_errors_fatal: true
  tasks:
    - ansible.builtin.include_role: {name: postgres-encoding-migrate, tasks_from: phase.yml}
      vars: {pem_phase: "4", pem_name: snapshot}
      when: (postgres_encoding_migrate_action | default('migrate')) == 'migrate'

- name: "postgres-encoding-migrate | phase 5 reinit"
  hosts: "{{ migrate_groups }}"
  gather_facts: false
  become: "{{ postgres_encoding_migrate_become | default(true) }}"
  any_errors_fatal: true
  tasks:
    - ansible.builtin.include_role: {name: postgres-encoding-migrate, tasks_from: phase.yml}
      vars: {pem_phase: "5", pem_name: reinit}
      when: (postgres_encoding_migrate_action | default('migrate')) == 'migrate'

- name: "postgres-encoding-migrate | phase 6 standby"
  hosts: "{{ migrate_groups }}"
  gather_facts: false
  become: "{{ postgres_encoding_migrate_become | default(true) }}"
  any_errors_fatal: true
  tasks:
    - ansible.builtin.include_role: {name: postgres-encoding-migrate, tasks_from: phase.yml}
      vars: {pem_phase: "6", pem_name: standby}
      when: (postgres_encoding_migrate_action | default('migrate')) == 'migrate'

- name: "postgres-encoding-migrate | phase 7 pgbackrest"
  hosts: "{{ migrate_groups }}"
  gather_facts: false
  become: "{{ postgres_encoding_migrate_become | default(true) }}"
  any_errors_fatal: true
  tasks:
    - ansible.builtin.include_role: {name: postgres-encoding-migrate, tasks_from: phase.yml}
      vars: {pem_phase: "7", pem_name: pgbackrest}
      when: (postgres_encoding_migrate_action | default('migrate')) == 'migrate'

# Phase 8: one play per step, so each step finishes on every node before the
# next starts (the join order of goatbuilder join-node phase 13).
- name: "postgres-encoding-migrate | phase 8.1 Spock netbird, founders"
  hosts: "{{ migrate_groups }}"
  gather_facts: false
  become: "{{ postgres_encoding_migrate_become | default(true) }}"
  any_errors_fatal: true
  tasks:
    - ansible.builtin.include_role: {name: postgres-encoding-migrate, tasks_from: phase.yml}
      vars: {pem_phase: "8.1", pem_name: rewire, pem_step: netbird-founders}
      when: (postgres_encoding_migrate_action | default('migrate')) == 'migrate'

- name: "postgres-encoding-migrate | phase 8.2 Spock netbird, joiners"
  hosts: "{{ migrate_groups }}"
  gather_facts: false
  become: "{{ postgres_encoding_migrate_become | default(true) }}"
  any_errors_fatal: true
  tasks:
    - ansible.builtin.include_role: {name: postgres-encoding-migrate, tasks_from: phase.yml}
      vars: {pem_phase: "8.2", pem_name: rewire, pem_step: netbird-joiners}
      when: (postgres_encoding_migrate_action | default('migrate')) == 'migrate'

- name: "postgres-encoding-migrate | phase 8.3 start kratos and hydra"
  hosts: "{{ migrate_groups }}"
  gather_facts: false
  become: "{{ postgres_encoding_migrate_become | default(true) }}"
  any_errors_fatal: true
  tasks:
    - ansible.builtin.include_role: {name: postgres-encoding-migrate, tasks_from: phase.yml}
      vars: {pem_phase: "8.3", pem_name: rewire, pem_step: ory-start}
      when: (postgres_encoding_migrate_action | default('migrate')) == 'migrate'

- name: "postgres-encoding-migrate | phase 8.4 Ory, joiners (node + repset)"
  hosts: "{{ migrate_groups }}"
  gather_facts: false
  become: "{{ postgres_encoding_migrate_become | default(true) }}"
  any_errors_fatal: true
  tasks:
    - ansible.builtin.include_role: {name: postgres-encoding-migrate, tasks_from: phase.yml}
      vars: {pem_phase: "8.4", pem_name: rewire, pem_step: ory-joiners-1}
      when: (postgres_encoding_migrate_action | default('migrate')) == 'migrate'

- name: "postgres-encoding-migrate | phase 8.5 Ory, founders"
  hosts: "{{ migrate_groups }}"
  gather_facts: false
  become: "{{ postgres_encoding_migrate_become | default(true) }}"
  any_errors_fatal: true
  tasks:
    - ansible.builtin.include_role: {name: postgres-encoding-migrate, tasks_from: phase.yml}
      vars: {pem_phase: "8.5", pem_name: rewire, pem_step: ory-founders}
      when: (postgres_encoding_migrate_action | default('migrate')) == 'migrate'

- name: "postgres-encoding-migrate | phase 8.6 Ory, joiners (subscriptions + history)"
  hosts: "{{ migrate_groups }}"
  gather_facts: false
  become: "{{ postgres_encoding_migrate_become | default(true) }}"
  any_errors_fatal: true
  tasks:
    - ansible.builtin.include_role: {name: postgres-encoding-migrate, tasks_from: phase.yml}
      vars: {pem_phase: "8.6", pem_name: rewire, pem_step: ory-joiners-2}
      when: (postgres_encoding_migrate_action | default('migrate')) == 'migrate'

- name: "postgres-encoding-migrate | phase 8.7 subscription set"
  hosts: "{{ migrate_groups }}"
  gather_facts: false
  become: "{{ postgres_encoding_migrate_become | default(true) }}"
  any_errors_fatal: true
  tasks:
    - ansible.builtin.include_role: {name: postgres-encoding-migrate, tasks_from: phase.yml}
      vars: {pem_phase: "8.7", pem_name: rewire, pem_step: verify}
      when: (postgres_encoding_migrate_action | default('migrate')) == 'migrate'

- name: "postgres-encoding-migrate | phase 9.1 a write on each node replicates"
  hosts: "{{ migrate_groups }}"
  gather_facts: false
  become: "{{ postgres_encoding_migrate_become | default(true) }}"
  any_errors_fatal: true
  tasks:
    - ansible.builtin.include_role: {name: postgres-encoding-migrate, tasks_from: phase.yml}
      vars: {pem_phase: "9.1", pem_name: finish, pem_step: probe}
      when: (postgres_encoding_migrate_action | default('migrate')) == 'migrate'

- name: "postgres-encoding-migrate | phase 9.2 start writers and units"
  hosts: "{{ migrate_groups }}"
  gather_facts: false
  become: "{{ postgres_encoding_migrate_become | default(true) }}"
  any_errors_fatal: true
  tasks:
    - ansible.builtin.include_role: {name: postgres-encoding-migrate, tasks_from: phase.yml}
      vars: {pem_phase: "9.2", pem_name: finish, pem_step: restart}
      when: (postgres_encoding_migrate_action | default('migrate')) == 'migrate'

# ---------------------------------------------------------------- rollback / cleanup
- name: "postgres-encoding-migrate | rollback and cleanup: the confirmed run"
  hosts: "{{ migrate_groups }}"
  gather_facts: false
  become: "{{ postgres_encoding_migrate_become | default(true) }}"
  any_errors_fatal: true
  tasks:
    - name: context
      ansible.builtin.include_role: {name: postgres-encoding-migrate, tasks_from: context.yml}
      when: (postgres_encoding_migrate_action | default('migrate')) in ['rollback', 'cleanup']

    - name: "confirm | the run named is the run open on every member"
      ansible.builtin.assert:
        that:
          - _pem_run | length > 0
          - postgres_encoding_migrate_confirm | default('') == _pem_run
          - (ansible_play_hosts | map('extract', hostvars, '_pem_run') | unique | list) == [_pem_run]
        fail_msg: >-
          {{ postgres_encoding_migrate_action }} acts on one open run across
          every member of migrate_groups and needs
          -e postgres_encoding_migrate_confirm=<that run id>. Open runs:
          {% for h in ansible_play_hosts %}{{ h }}={{ hostvars[h]._pem_run or '(none)' }} {% endfor %}
        quiet: true
      when: (postgres_encoding_migrate_action | default('migrate')) in ['rollback', 'cleanup']

- name: "postgres-encoding-migrate | rollback: stop"
  hosts: "{{ migrate_groups }}"
  gather_facts: false
  become: "{{ postgres_encoding_migrate_become | default(true) }}"
  any_errors_fatal: true
  tasks:
    - ansible.builtin.include_role: {name: postgres-encoding-migrate, tasks_from: rollback.yml}
      vars: {pem_step: stop}
      when: (postgres_encoding_migrate_action | default('migrate')) == 'rollback'

- name: "postgres-encoding-migrate | rollback: restore"
  hosts: "{{ migrate_groups }}"
  gather_facts: false
  become: "{{ postgres_encoding_migrate_become | default(true) }}"
  any_errors_fatal: true
  tasks:
    - ansible.builtin.include_role: {name: postgres-encoding-migrate, tasks_from: rollback.yml}
      vars: {pem_step: restore}
      when: (postgres_encoding_migrate_action | default('migrate')) == 'rollback'

- name: "postgres-encoding-migrate | rollback: start"
  hosts: "{{ migrate_groups }}"
  gather_facts: false
  become: "{{ postgres_encoding_migrate_become | default(true) }}"
  any_errors_fatal: true
  tasks:
    - ansible.builtin.include_role: {name: postgres-encoding-migrate, tasks_from: rollback.yml}
      vars: {pem_step: start}
      when: (postgres_encoding_migrate_action | default('migrate')) == 'rollback'

- name: "postgres-encoding-migrate | rollback: verify and close"
  hosts: "{{ migrate_groups }}"
  gather_facts: false
  become: "{{ postgres_encoding_migrate_become | default(true) }}"
  any_errors_fatal: true
  tasks:
    - ansible.builtin.include_role: {name: postgres-encoding-migrate, tasks_from: rollback.yml}
      vars: {pem_step: verify}
      when: (postgres_encoding_migrate_action | default('migrate')) == 'rollback'

- name: "postgres-encoding-migrate | cleanup"
  hosts: "{{ migrate_groups }}"
  gather_facts: false
  become: "{{ postgres_encoding_migrate_become | default(true) }}"
  any_errors_fatal: true
  tasks:
    - ansible.builtin.include_role: {name: postgres-encoding-migrate, tasks_from: cleanup.yml}
      when: (postgres_encoding_migrate_action | default('migrate')) == 'cleanup'
