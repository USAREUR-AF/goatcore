---
# SPDX-License-Identifier: Apache-2.0
#
# Deploy the goat-presence-health meter (ADR 1040 gap 3 / ADR 1036 —
# docs/design/environment-health-surface.md, the presence domain). One
# containerized mTLS Zenoh client peer watches the fabric's liveliness
# presence tokens (`**/presence/**`) and publishes ops/presence/health/<site>.
# Native push-based presence; persists nothing.
#
#   OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES aws-vault exec <profile> --no-session -- \
#     ../scripts/ansible-preflight.sh \
#       -i inventory/mgmt-hosts.ini -i inventory/mgmt-hosts-mesh.ini \
#       presence-health-deploy.yml
#
#   # Another goatnet:  add  -e target=<site>_hosts
#
# Pre-flight (operator-side):
#   1. zenoh-router Healthy on the target host with the infra-presence-health
#      subject + its rules LIVE (rules take effect only after a router restart).
#   2. Infra leaf cert + key minted (Subject CN=goat-presence-health-trial-peer) at
#      /opt/presence-health/certs/presence-health-{cert,key}.pem.
#   3. goat-presence-health image SHA-pinned in the role defaults + deploy-history.yml
#      (replace the PENDING :latest placeholder with the built digest).
#
# Live-fire: a live subscriber on ops/presence/health/<site> sees the per-site
# EnvHealthV1{domain:"presence"} (`goat --context <goatnet> sub 'ops/presence/health/**' --count 2`).

- name: deploy goat-presence-health meter on the trial fabric (ADR 1040 gap 3 / ADR 1036)
  hosts: "{{ target | mandatory }}"   # -e target=<site>_hosts selects the goatnet
  become: true
  gather_facts: true

  pre_tasks:
    # ONE writer per site key. This roll-up publishes ops/presence/health/<site>,
    # one key for the whole site. A site whose host group holds two nodes
    # would otherwise get a second copy on the second node: two writers to one
    # key, the last one silently winning. On a passive node the copy cannot
    # even start, because the router network it joins is not there, and the
    # group-wide deploy fails on that node every time.
    #
    # Same guard as the single lazy crawler: the play ends for a node whose
    # router_role is not the single home, and that is a skip, not a failure.
    # The guard's skip message speaks of admin surfaces; the reason here is the
    # one above. The guard file is used unchanged because goatstuff carries a
    # copy that must stay byte-identical to this repository's.
    # `single_homed_role` on the component in ops/pins/fleet-pins.yaml tells
    # deploy verification the same thing (goatnet-deployment-doctrine.md P13).
    - name: "Guard — one roll-up per site, on the router host (doctrine P13)"
      ansible.builtin.include_tasks: tasks/assert-admin-write-host.yml
      vars:
        admin_write_surface: "the presence health roll-up"

  roles:
    - role: presence-health
