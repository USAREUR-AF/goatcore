---
# SPDX-License-Identifier: Apache-2.0
#
# Provision a per-dataset cold-storage bucket on a goatnet mgmt host's MinIO (-e target=<env>_hosts). Block 95
# Phase C entry point. See docs/design/audit-cold-storage-offload.md.
#
# Usage (operator-fired, single shot per dataset):
#
#   OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES aws-vault exec <profile> --no-session -- \
#     ../scripts/ansible-preflight.sh \
#       -i inventory/mgmt-hosts.ini \
#       -i inventory/mgmt-hosts-mesh.ini \
#       cold-storage-bucket.yml \
#       -e cold_storage_dataset_id=zagros-1.0 \
#       -e cold_storage_operator=<your-handle> \
#       -e cold_storage_description="zagros-1.0 milestone close — audit data preserved before 7d→30d retention flip" \
#       -e cold_storage_retention_days=365
#
# Pre-flight: MinIO container Healthy on the target host; the `local` mc alias is
# pre-configured inside the container by the minio role.
#
# After this playbook succeeds, run ops/scripts/offload-to-cold.sh
# from the operator laptop to perform the actual mirror + manifest
# emit. The role here just creates the empty locked-and-ready bucket.

- name: cold-storage bucket provisioning (Block 95)
  hosts: "{{ target | mandatory }}"
  gather_facts: false
  become: true

  pre_tasks:

    - name: Pre-flight | dataset_id provided
      ansible.builtin.assert:
        that:
          - "cold_storage_dataset_id is defined"
          - "cold_storage_dataset_id | length > 0"
        fail_msg: >-
          Pass -e cold_storage_dataset_id=<kebab-case>
          (e.g. cold_storage_dataset_id=zagros-1.0)

  roles:
    - role: cold-storage-bucket
