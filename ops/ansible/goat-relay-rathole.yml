---
# goat-relay-rathole.yml — deploy the rathole reverse-tunnel SERVER onto the
# all-Rust goat-relay tier.
#
# WHY THIS EXISTS: relay-server-rathole.yml is a tasks file imported only by
# the legacy relay-server.yml (hosts: relay_servers), which also deploys the
# legacy Go netbird-relay + Coturn. An all-Rust relay tier (ADR 0709/
# 0712, "no legacy relay anywhere") runs goat-relay via goat-relay-deploy.yml,
# which has NO rathole import — so there was no path to deploy rathole-server
# on Rust relays. That left netbird.<zone>:443 closed and BLOCKED all off-LAN
# enrollment (the mesh is behind CGNAT; rathole is the only public reverse
# path). It surfaced on the first all-Rust standalone tier.
# This play closes the gap; pairs with site-rathole-client.yml (mgmt-host side).
#
# RUN:
#   cd ops/ansible
#   AWS_VAULT=1 AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_PROD \
#     AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY_PROD \
#     ../scripts/ansible-preflight.sh \
#     -i inventory/hosts-<site>.ini -i inventory/<site>-goat-relay-alias.ini \
#     goat-relay-rathole.yml
#   (AWS_VAULT=1 makes aws_cmd a bare `aws` so the delegate_to:localhost SM
#    put-secret-value uses the raw account keys, not aws-vault. Connection
#    to the relays is SSM — needs community.aws + session-manager-plugin.)
#
# rathole_bin/url/config_dir come from group_vars/all.yml; per-relay
# rathole_secret_name + aws_region + ansible_aws_ssm_* come from the relay
# inventory (inventory/hosts-<site>.ini). Idempotent: re-runs reuse the
# persisted server.pubkey + existing token (relay-server-rathole.yml logic).
#
# Azure (relay_cloud=azure): SSH through Bastion, public IP from the inventory,
# and no Key Vault write: the operator has no write role. See
# relay-server-rathole.yml "Azure hand-off" for how the site client gets the
# credentials (-e relay_rathole_handoff_dir=<local dir>).

- name: Deploy rathole reverse-tunnel server on the goat-relay tier
  hosts: "{{ target | mandatory }}"
  become: true

  tasks:
    # -- F-188 guard: rathole ingress is ONLY meaningful colocated on a LIVE
    # relay data plane. A goatnet shipped with rathole running (:443/:2333) but
    # no relay container, so enrollment worked while every peer's
    # relay-fallback failed (Relays 0/N, nothing on :33073). Catch that
    # half-built state HERE instead of letting it look healthy. Either data
    # plane counts: the all-Rust goat-relay (goat-relay-deploy.yml) or the
    # upstream NetBird relay (container netbird-relay, image netbirdio/relay,
    # relay-server.yml). Deploy one first, or run both in one pass via
    # goat-relay-colocated.yml. Waive for a deliberate ingress-only host with
    # -e allow_rathole_without_relay=true.
    - name: F-188 guard — require a relay data plane (or explicit waiver)
      ansible.builtin.include_tasks: tasks/relay-data-plane-guard.yml

    # Public IP (IMDSv2) — stored in the SM secret as relay_ip, informational
    # for the client. Same fetch the legacy relay play uses unconditionally.
    - name: Detect public IP from EC2 metadata (IMDSv2)
      ansible.builtin.shell: |
        TOKEN=$(curl -s -X PUT "http://169.254.169.254/latest/api/token" \
          -H "X-aws-ec2-metadata-token-ttl-seconds: 30")
        curl -s -H "X-aws-ec2-metadata-token: $TOKEN" \
          http://169.254.169.254/latest/meta-data/public-ipv4
      register: public_ip_result
      changed_when: false
      when: relay_cloud | default('aws') != 'azure'

    - name: Set public IP fact
      ansible.builtin.set_fact:
        vps_public_ip: "{{ public_ip_result.stdout | trim }}"
      when: relay_cloud | default('aws') != 'azure'

    - name: Set public IP fact (Azure, from inventory relay_public_ip)
      ansible.builtin.set_fact:
        vps_public_ip: "{{ relay_public_ip | mandatory('relay_public_ip is unset: regenerate the inventory with generate-relays-azure.sh') }}"
      when: relay_cloud | default('aws') == 'azure'

    # rathole-server: install binary + generate/read Noise keypair + token +
    # write server.toml (:443 service, :2333 control) + systemd unit. Gated
    # so a tier can opt out via deploy_rathole: false in inventory vars.
    - name: Rathole server stack
      ansible.builtin.import_tasks: relay-server-rathole.yml
      when: deploy_rathole | default(true) | bool

    # Persist pubkey + token to Secrets Manager so the rathole CLIENT (the
    # mgmt-host, site-rathole-client.yml) can fetch them and dial in. NO
    # turn_secret field here — coturn's static-auth-secret is managed by the
    # coturn role on-host, not threaded through this rathole SM-put.
    # (The all-Rust tier DOES run coturn STUN now via the coturn role /
    # goat-relay-coturn.yml — the prior "no Coturn" note is obsolete.)
    - name: Store rathole credentials in Secrets Manager
      delegate_to: localhost
      become: false
      ansible.builtin.shell: >
        {{ aws_cmd }} aws secretsmanager put-secret-value
        --region "{{ aws_region }}"
        --secret-id "{{ rathole_secret_name }}"
        --secret-string '{"token":"{{ rathole_auth_token }}","public_key":"{{ rathole_public_key }}","relay_ip":"{{ vps_public_ip }}"}'
      changed_when: false
      when:
        - deploy_rathole | default(true) | bool
        - rathole_secret_name is defined
        - rathole_public_key | default('') | length > 0
        - relay_cloud | default('aws') != 'azure'

    - name: Rathole server status
      ansible.builtin.debug:
        msg: >-
          rathole-server on {{ inventory_hostname }} — :443 public + :2333
          control ; SM secret {{ rathole_secret_name | default('n/a') }} ;
          pubkey={{ rathole_public_key[:16] | default('?') }}...

  handlers:
    - name: Restart rathole server
      ansible.builtin.systemd:
        name: rathole-server
        state: restarted
        daemon_reload: true
