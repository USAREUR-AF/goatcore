# Which image each component runs. A goatnet's own row is added by goatlite or by hand.
# Not deployed by goatcore: flashlight, goat-topology, herd, herd-connector, microscope, netvis, panoscope, stethoscope.
# Their roles and playbooks are in goatstuff (ops/ansible/roles/<name>/); a goatnet
# that does not run them needs no row for them.
# herd and herd-connector have no public image: their fleet pins are null, and a
# goatnet that runs them supplies its own image (herd_image, herd_connector_image).
goatnets: {}
components:
  netbird-mgmt:
    owns_state: true
    rollback: none
    var: netbird_mgmt_image
    image_workflow: .github/workflows/netbird-mgmt.yml
    deploy_playbook: mgmt-host.yml
    fleet: ghcr.io/{{ ghcr_org }}/netbird-mgmt@sha256:0122a19060141e573e02e4faf1581406ce2e6059965661383c80cd7475f7fe73
