// WHEN it wedged — a distinct chip from the live-health dot: the dot is the router's
// state NOW, this is the recurrence history (a router healthy this instant can still
// be wedging hourly). Red "WEDGED NOW" if live-deadlocked; else N wedge-recoveries/24h.
function zenohWedgeChip(name, now){
  const wd = (ZENOH_WEDGES||{})[name];
  if(!wd) return "";
  if(wd.currently_wedged){
    const since = wd.wedged_since ? " · "+ago(now-wd.wedged_since) : "";
    return `<span class="hchip" style="background:rgba(217,83,79,.2)" title="the router is WEDGED right now (deadlocked; the watchdog will auto-restart it). Click for the wedge-events timeline."><span class="sdot ${sdot('red')}"></span><b style="color:var(--red)">WEDGED NOW</b>${since}</span>`;
  }
  const n = wd.restarts_24h||0;
  if(n<=0) return "";                          // no wedges in 24h → no chip (band dot carries health)
  const ageS = wd.last_wedge_ts!=null ? now - wd.last_wedge_ts : null;
  // recency-graded: recent cluster = red, hours-old = amber, stale (recovered) = grey.
  const st = (n>=3 && ageS!=null && ageS < RECENT_WEDGE_S) ? "red"
           : (ageS!=null && ageS < 2*RECENT_WEDGE_S) ? "amber" : "grey";
  const lastTxt = ageS!=null ? ago(ageS)+" ago" : "—";
  return `<span class="hchip" title="watchdog wedge-recoveries (auto-restarts) in the trailing 24h window; each is a wedge episode. Dot: red = recent, grey = none recent (recovered). Click the router for the event timeline."><span class="sdot ${sdot(st)}"></span>wedges <b>${n}</b>/24h · last <b>${lastTxt}</b></span>`;
}
function zenohRowSpark(z){
  const hist = z.history||[];   // [t, open_ms, close_wait, estab, fd_used]
  if(hist.length<2) return "";
  const W=110,H=22; let maxv=1; hist.forEach(p=>{maxv=Math.max(maxv,p[1]||0);});
  const vals = hist.map(p=>p[1]||0);   // open latency trend — the seizure signature
  return `<span class="ovspark" title="new-session open latency, last ${hist.length} samples (a rising staircase = admission seizing)"><svg class="spark" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:${H}px">
    <polyline fill="none" stroke="var(--blue)" stroke-width="1.2" points="${sparkPath(vals,W,H,maxv)}"/></svg></span>`;
}
function zenohBand(now){
  const names = Object.keys(ZENOH);
  if(!names.length) return "";

  const pill=$("fleetPill");
  // The pill is the OVERALL health glance, not relays-only: a wedged/flapping
  // fabric router or a wedged site node must show here too (else the header
  // reads green while the fabric is down — the gap this closes).
  const zr = zenohRollup(now);
  let hostWedgedTop=false;
  Object.values(HOSTS).forEach(doc=>{ if(!hostStale(doc,now) && (((doc.host_net||{}).mesh||{}).selfheal_wedged===1 || meshSt(doc.host_net||{}).st==="red")) hostWedgedTop=true; });
  if(stale){ pill.className="pill p-grey"; pill.textContent=`stale ${ago(age)}`; }
  else if(anyRed || zr.wedgedNow || zr.unhealthy){ pill.className="pill p-red"; pill.textContent="degraded"; }
  else if(anyAmber || hostWedgedTop || zr.amber || zr.wedgedRecently){ pill.className="pill p-amber"; pill.textContent="degraded"; }
  else { pill.className="pill p-green"; pill.textContent="healthy"; }
  // Plain-language network verdict — the "is it me, or the network?" answer,
  // legible to anyone, not just an admin reading per-relay dots. Driven by the
  // same non-flapping reachability roll-up as the fleet pill.
  (function(){
    const box=$("netverdict"), vh=$("nvHead"), vt=$("nvText"), n=relays.length;
    // Site-host trouble roll-up. A lockout can be INVISIBLE to this verdict: all
    // relays green, but the ACTIVE node wedged (control plane up, peers not
    // connecting). It must never tell a user "it's you" while a site node is
    // wedged. Only REPORTING hosts count — a stale host is an honest unknown.
    // A node's connected-peer COUNT is
    // NOT a reachability measure (peers_total is the mostly-offline roster), so
    // it does not drive this verdict: a peer-count "wedge" false-alarms
    // "this may not be you" on nodes whose services are fully reachable. Real
    // per-node trouble surfaced here = control plane down (ctlSt red / meshSt
    // amber). The self-heal wedge / low-peer count is surfaced as an honest INFO
    // aside, never an alarm. The correct F-261-class lockout detector (a node
    // truly unreachable while relays are green) is the net-health reachability-
    // canary (off-node probe), not the peer count.
    let hostDegraded=false; const selfReportNames=[];
    Object.values(HOSTS).forEach(doc=>{
      if(hostStale(doc, now)) return;
      const hn=doc.host_net||{}, m=hn.mesh||{}, ms_=meshSt(hn).st;
      if(ms_==="amber" || ctlSt(hn).st==="red"){ hostDegraded=true; }
      if(m.selfheal_wedged===1){ selfReportNames.push(hn.host||doc.host); }
    });
    // A self-heal-wedged node is a
    // real event, surfaced as its own amber verdict (matches the top pill's
    // hostWedgedTop → amber); it supersedes the weaker INFO-aside treatment.
    const wedgedNames = selfReportNames; const hostWedged = wedgedNames.length>0;
    let cls, head, text;
    if(stale){
      cls="nv-grey"; head="Status unknown — data is stale";
      text=`The last probe is ${ago(age)} old, so this can't confirm the network's state right now. Give it a moment and reload.`;
    } else if(okCount===0){
      cls="nv-red"; head="The network is down — it's not you";
      text=`None of the ${n} relays are answering from this outside-the-mesh vantage. The mesh's front door is unreachable, so nobody can get on right now — this is a network/relay outage, not your device or connection.`;
    } else if(anyRed || okCount<n){
      cls="nv-amber"; head="Degraded — real trouble on the network";
      text=`Only ${okCount} of ${n} relays are reachable. Whether you can connect depends on which relay you land on, so if you're struggling it may not be only you. This is partial network/relay trouble.`;
    } else if(zr.wedgedNow){
      cls="nv-red"; head=`Fabric router WEDGED${zr.names.length?" — "+zr.names.join(", "):""}`;
      text=`state: deadlocked now · wedges (24h): ${zr.wedges24h} · recovery: watchdog restart ~1–2 min · impact: data plane down, relay front door up · detail: zenoh routers band.`;
    } else if(hostWedged){
      cls="nv-amber"; head=`Site node mesh WEDGED — ${wedgedNames.join(", ")}`;
      text=`state: control plane up, peers not connecting (boot-wedge) · recovery: self-heal restarting netbird · impact: services on that node may be unreachable to peers; relay front door up.`;
    } else if(hostDegraded){
      cls="nv-amber"; head="A site node reports a degraded control plane";
      text=`The relay front door is up, but a site node's control plane is not fully connected. Enrollment and config updates on that node may be affected; peers already connected keep running over WireGuard. If one specific service is unreachable, it may be that node rather than you.`;
    } else if(zr.wedgedRecently){
      cls="nv-amber"; head=`Fabric router unstable — ${zr.wedges24h} wedge/24h`;
      text=`state: answering now · wedges (24h): ${zr.wedges24h} · last: ${ago(zr.lastWedgeAgoS)} ago · each auto-recovered ~1–2 min · detail: zenoh routers band timeline.`;
    } else if(authAmber){
      // F-269 — the explicit counter to "if you can't connect it's you." The
      // network's front door is up, but the relay is turning SPECIFIC peers away
      // (a stale/corrupt local netbird profile presenting a dead relay token).
      // If you are one of the named peers, this is NOT you.
      cls="nv-amber"; head="The network is up — but specific peer(s) are being turned away";
      const who = authOffenders.slice(0,3).map(o=>`${o.ip} (${o.count})`).join(", ");
      text=`All ${n} relays are healthy from outside the mesh, but the relay is auth-rejecting one or more peers`
        + (authExpired>0 ? ` — ${authExpired} expired-auth-token rejection(s) in 5m${who?` from egress IP ${who}`:""}` : "")
        + (authWsTimeout>0 ? `${authExpired>0?"; ":" — "}${authWsTimeout} WS-upgrade timeout(s)` : "")
        + `. If you are one of the named peers this is NOT you: a stale/corrupt local netbird profile is presenting a dead relay token. Recreate the profile (remove → add → re-enroll) — a soft reset (down/up, re-login, daemon restart, re-enroll) does NOT clear it.`;
    } else {
      cls="nv-green"; head="The network is up — if you can't connect, it's most likely you";
      text=`All ${n} relays are answering and healthy from outside the mesh. The front door is up, so if you can't get on, the problem is most likely your own device or connection — run the client-side recovery steps first.`
        + (zr.wedges24h>0 && !zr.wedgedRecently ? ` (fabric router: ${zr.wedges24h} wedge/24h, last ${ago(zr.lastWedgeAgoS)} ago — stable now.)` : "");
    }
    box.className="netverdict "+cls; vh.textContent=head; vt.textContent=text;
  })();
  $("foot").textContent = `probed ${age>=0?ago(age)+" ago":"—"} · refresh ${REFRESH_MS/1000}s · ${new Date((data.generated||0)*1000).toLocaleString()}`;
}

async function tick(){
  try{
    const [r] = await Promise.all([
      fetch(JSON_URL+"?t="+Date.now(), {cache:"no-store"}),
      loadPeerNames(),                 // best-effort; never blocks the health render
      loadPeerSeries(),                // best-effort per-peer history (Part B)
      loadHosts(),                     // best-effort site-host band (host-net health)
      loadHostSeries(),                // best-effort host history for drill-downs
      loadZenoh(),                     // best-effort zenoh-router band
      loadZenohSeries(),               // best-effort router history for drill-downs
      loadZenohWedges(),               // best-effort wedge-event timeline
      loadPeers(),                     // best-effort test-peer perspective band
      loadStatusHistory(),             // best-effort top-of-page status timeline
    ]);
    render(await r.json());
    renderStatusTimeline();
  }catch(e){
    // A gated dashboard whose oauth2-proxy login SESSION expired gets its
    // background fetches 302'd cross-origin to the Dex login — which surfaces
    // as "TypeError: Failed to fetch" and dead-ends the page (an XHR can't
    // follow a cross-origin redirect; a full navigation can). Detect that and
    // re-auth by reloading, guarded so we never loop.
    if(await authExpired()){
      const now=Date.now(), last=+(sessionStorage.getItem("rhReauth")||0);
      if(now-last > 20000){ sessionStorage.setItem("rhReauth", String(now)); location.reload(); return; }
    }
    $("fleetPill").className="pill p-red";
    $("fleetPill").textContent="no data";
    $("foot").textContent = "could not load "+JSON_URL+" — is the prober running, or did your login session expire? ("+e+")";
  }
}
// True when the login session has expired: a same-origin fetch gets redirected
// (cross-origin) to the oauth2-proxy/Dex login, an opaque redirect under
// redirect:"manual". A valid session returns 200; an ungated deploy also 200.
async function authExpired(){
  try{
    const r = await fetch(JSON_URL+"?auth="+Date.now(), {cache:"no-store", redirect:"manual"});
    return r.type === "opaqueredirect" || r.status === 0;
  }catch(_){ return false; }
}
tick(); setInterval(tick, REFRESH_MS);
</script>
<div id="cardModal" class="modal" onclick="if(event.target===this)closeCard()">
  <div class="pcard"><button class="cx" onclick="closeCard()" title="close (Esc)">✕</button><div id="cardBody"></div></div>
</div>
</body>
</html>
