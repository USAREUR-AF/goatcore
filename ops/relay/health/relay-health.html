<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>goat · relay fleet health</title>
<!--
  relay-health.html — the goat relay-fleet health dashboard.

  HACKABLE BY DESIGN: one self-contained file, vanilla JS, no build step, no
  framework. Fetches relay-health.json (produced by relay-health-probe.sh)
  every REFRESH_MS and renders it. To change what's shown, edit the render()
  function below. To add a probe, add a field in the prober's JSON and a
  cell() call here. Tweak CONFIG to taste.

  FOUR-LEVEL DRILLDOWN, hash-routed (back-button works, zero framework):
    1  fleet overview — every relay one compact row (list ⇄ map toggle,
       #view=map persisted in localStorage)
    2  per-relay detail (#relay=<name>) — the full probe/throughput/peers panel
    3  peer baseball card (click a peer row; ADR 1055)
    4  identity block inside the card (registry/id-console deep-link)

  Honesty discipline (matches the rest of goat): never a false green. Stale
  JSON greys out + shows age; unknown/unmeasured reads grey, not green; the
  :443 flap shows its real ok-ratio (n) rather than a binary up/down; a relay
  without declared geo= renders "unplaced", never at a guessed coordinate
  (ADR 1080).
-->
<style>
  :root{
    --bg:#14110d; --panel:#1d1812; --panel2:#241d15; --line:#3a3026;
    --ink:#f0e6d6; --dim:#9c8f7a; --faint:#6b6051;
    --green:#5cb85c; --amber:#e0a32e; --red:#d9534f; --grey:#5b5346; --blue:#4c9fd6;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  header{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;
    padding:18px 22px;border-bottom:1px solid var(--line);background:var(--panel)}
  header h1{margin:0;font-size:18px;letter-spacing:.5px}
  header h1 .goat{color:var(--amber)}
  .sub{color:var(--dim);font-size:12px;font-family:var(--mono)}
  .fleet{margin-left:auto;display:flex;gap:18px;align-items:center}
  .fleet .big{font-size:26px;font-weight:700;font-family:var(--mono)}
  .pill{padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;
    font-family:var(--mono);text-transform:uppercase;letter-spacing:.5px}
  .p-green{background:rgba(92,184,92,.18);color:var(--green)}
  .p-amber{background:rgba(224,163,46,.18);color:var(--amber)}
  .p-red{background:rgba(217,83,79,.2);color:var(--red)}
  .p-grey{background:rgba(91,83,70,.25);color:var(--dim)}
  /* Top-of-page network-state verdict — the plain "is it me, or the network?"
     answer, so anyone (not just an admin reading dots) can tell at a glance. */
  .netverdict{margin:0 0 14px;padding:15px 18px;border-radius:11px;border:1px solid;
    display:flex;gap:14px;align-items:flex-start}
  .netverdict .vdot{width:13px;height:13px;border-radius:50%;flex:none;margin-top:5px}
  .netverdict .vh{font-size:15px;font-weight:700;letter-spacing:.02em;margin:0 0 3px}
  .netverdict .vt{color:var(--dim);font-size:13.5px;line-height:1.55;margin:0;max-width:80ch}
  .nv-green{border-color:rgba(92,184,92,.45);background:rgba(92,184,92,.09)}
  .nv-green .vdot{background:var(--green)} .nv-green .vh{color:var(--green)}
  .nv-amber{border-color:rgba(224,163,46,.45);background:rgba(224,163,46,.09)}
  .nv-amber .vdot{background:var(--amber)} .nv-amber .vh{color:var(--amber)}
  .nv-red{border-color:rgba(217,83,79,.5);background:rgba(217,83,79,.10)}
  .nv-red .vdot{background:var(--red)} .nv-red .vh{color:var(--red)}
  .nv-grey{border-color:rgba(91,83,70,.4);background:rgba(91,83,70,.10)}
  .nv-grey .vdot{background:var(--dim)} .nv-grey .vh{color:var(--dim)}
  /* test-peer band: the "what a real user here would experience" implication */
  .pimpl{color:var(--dim);font-size:11px;font-style:italic;margin-left:4px;
    max-width:34ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* Top-of-page status-history timeline (statuspage-style): per-day by default,
     click a day to drill to per-hour. Worst-per-bucket, five severity levels. */
  .statustl{margin:0 0 14px}
  .statustl-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 6px;flex-wrap:wrap}
  .statustl-h h3{margin:0;font-size:12px;letter-spacing:.4px;text-transform:uppercase;color:var(--dim)}
  .statustl-h .lg{display:flex;gap:9px;font-size:10px;color:var(--dim);flex-wrap:wrap}
  .statustl-h .lg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:3px;vertical-align:-1px}
  .statusbar{display:flex;gap:2px;height:26px}
  .statusbar .seg{flex:1 1 0;border-radius:2px;cursor:pointer;min-width:3px;transition:transform .08s}
  .statusbar .seg:hover{transform:scaleY(1.2)}
  .seg-0{background:#3fa66a}.seg-1{background:#9ac53f}.seg-2{background:#e0a32e}
  .seg-3{background:#e07b2e}.seg-4{background:#d1443f}.seg-x{background:var(--panel2)}
  .statustl .crumbrow{font-size:11px;color:var(--dim);margin-top:5px}
  .statustl .crumbrow a{color:var(--blue);cursor:pointer}
  /* Rows, not tiles: each relay is a full-width card whose body splits into
     a reachability/service-state column + a throughput column. */
  main{padding:18px 22px;display:flex;flex-direction:column;gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;
    overflow:hidden}
  .card.stale{opacity:.55}
  .card .body{display:grid;grid-template-columns:minmax(290px,1fr) minmax(330px,1.05fr)}
  @media(max-width:820px){.card .body{grid-template-columns:1fr}}
  .checks{padding:6px 14px 12px}
  .tput{padding:8px 16px 12px;border-left:1px solid var(--line)}
  @media(max-width:820px){.tput{border-left:0;border-top:1px solid var(--line)}}
  .tput h4{margin:6px 0 8px;font-size:11px;letter-spacing:.4px;text-transform:uppercase;
    color:var(--dim);font-weight:700}
  .tput .nums{display:flex;gap:14px;font-family:var(--mono);font-size:12px;
    margin-bottom:8px;flex-wrap:wrap}
  .tput .nums b{color:var(--ink);font-weight:700}
  .tput .none{color:var(--faint);font-size:12px;padding:14px 0;line-height:1.6}
  .tput code{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:0 4px}
  .peers{padding:8px 16px 12px;border-left:1px solid var(--line)}
  @media(max-width:820px){.peers{border-left:0;border-top:1px solid var(--line)}}
  .peers h4{margin:6px 0 8px;font-size:11px;letter-spacing:.4px;text-transform:uppercase;color:var(--dim)}
  .peers .none{color:var(--faint);font-size:12px;padding:10px 0}
  .prow{display:flex;align-items:center;gap:8px;margin:2px 0;font-family:var(--mono);font-size:11px;cursor:pointer;border-radius:3px;padding:1px 2px}
  .prow:hover{background:var(--panel2)}
  .pid{width:132px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none}
  .prow:hover .pid{color:var(--ink)}
  .pbar{flex:1;height:10px;background:var(--panel2);border-radius:3px;overflow:hidden}
  .pfill{display:block;height:100%;background:var(--blue)}
  .pfill.hog{background:var(--red,#e5484d)}
  .pval{width:118px;text-align:right;color:var(--ink);flex:none}
  .hogtag{color:var(--red,#e5484d);font-size:10px}
  /* Peer baseball-card modal (ADR 1055). */
  .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:50;align-items:center;justify-content:center}
  .pcard{position:relative;background:var(--panel,#161a20);border:1px solid var(--line);border-radius:10px;padding:18px 20px;min-width:340px;max-width:min(560px,92vw);max-height:88vh;overflow:auto;box-shadow:0 12px 48px rgba(0,0,0,.5)}
  .cx{position:absolute;top:10px;right:12px;background:none;border:0;color:var(--dim);font-size:16px;cursor:pointer}
  .cx:hover{color:var(--ink)}
  .ctitle{font-size:15px;font-weight:600;color:var(--ink);margin:0 20px 12px 0;word-break:break-word}
  .crow{display:flex;gap:12px;padding:5px 0;border-top:1px solid var(--line);font-size:12px}
  .crow .ck{width:96px;color:var(--dim);flex:none;text-transform:uppercase;letter-spacing:.3px;font-size:10px;padding-top:2px}
  .crow .cv{color:var(--ink);word-break:break-word;font-family:var(--mono)}
  .crow code{font-size:11px;color:var(--blue)}
  .cdim{color:var(--faint)}
  .cok{color:var(--green,#30a46c)}
  .idlink{color:var(--blue);text-decoration:none;font-weight:600}
  .idlink:hover{text-decoration:underline}
  .cts{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
  .ctsh{font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--dim);margin-bottom:6px}
  .ctsrow{display:flex;align-items:center;gap:10px;padding:5px 0;color:var(--ink)}
  .ctsl{width:66px;color:var(--dim);font-size:11px;flex:none}
  .ctsv{display:flex;align-items:center;gap:8px;font-size:11px;font-family:var(--mono);min-width:0}
  .spark{background:var(--panel2);border-radius:3px;flex:none}
  .sparkv{white-space:nowrap;color:var(--ink)}
  .spark-wrap{display:flex;gap:6px;align-items:stretch}
  .spark-y{display:flex;flex-direction:column;justify-content:space-between;
    font:10px/1 var(--mono);color:var(--faint);text-align:right;min-width:52px;padding:1px 0}
  .spark{display:block;flex:1;height:48px;background:var(--panel2);border-radius:6px}
  .gauge{margin-top:10px}
  .gauge .track{height:12px;border-radius:6px;background:var(--panel2);
    overflow:hidden;border:1px solid var(--line)}
  .gauge .fill{height:100%;border-radius:6px 0 0 6px}
  .gauge .lbl{display:flex;justify-content:space-between;gap:8px;
    font-family:var(--mono);font-size:11px;margin-top:5px;color:var(--dim)}
  .gf-green{background:var(--green)} .gf-amber{background:var(--amber)}
  .gf-red{background:var(--red)} .gf-grey{background:var(--grey)}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .chip{font-family:var(--mono);font-size:11px;color:var(--dim);background:var(--panel2);
    border:1px solid var(--line);border-radius:5px;padding:2px 7px}
  .card .top{display:flex;align-items:center;gap:10px;padding:12px 14px;
    border-bottom:1px solid var(--line)}
  .dot{width:13px;height:13px;border-radius:50%;flex:none;box-shadow:0 0 0 3px rgba(0,0,0,.25)}
  .d-green{background:var(--green)} .d-amber{background:var(--amber)}
  .d-red{background:var(--red)} .d-grey{background:var(--grey)}
  .card .name{font-weight:700;font-size:15px;font-family:var(--mono)}
  .card .meta{color:var(--faint);font-size:11px;font-family:var(--mono)}
  .card .meta a{color:var(--faint)}
  .rows{padding:6px 14px 12px}
  .row{display:flex;align-items:center;gap:8px;padding:6px 0;
    border-top:1px dashed rgba(58,48,38,.6)}
  .row:first-child{border-top:0}
  .row .k{color:var(--dim);font-size:12px;width:104px;flex:none}
  .row .v{font-family:var(--mono);font-size:12px;display:flex;align-items:center;gap:7px}
  .sdot{width:9px;height:9px;border-radius:50%;flex:none}
  .bars{display:inline-flex;gap:3px}
  .bar{width:7px;height:14px;border-radius:2px;background:var(--grey)}
  .bar.ok{background:var(--green)} .bar.bad{background:var(--red)}
  .note{color:var(--faint);font-size:11px}
  .vantnote{margin:0 22px 14px;padding:10px 14px;border-radius:8px;font-size:12.5px;
    line-height:1.45;border:1px solid var(--line)}
  .vantnote b{color:var(--fg)}
  .vantnote code{font-family:var(--mono);font-size:11px;background:rgba(255,255,255,.06);
    padding:1px 5px;border-radius:4px}
  .vn-l1{color:var(--dim)}
  .vn-l1 .vn-place{color:var(--fg);font-weight:700}
  .vn-l2{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
  .vn-same,.vn-diff{padding:4px 10px;border-radius:6px;font-size:12px;color:var(--fg)}
  .vn-same{background:rgba(64,192,120,.10);border:1px solid rgba(64,192,120,.32)}
  .vn-diff{background:rgba(255,176,32,.10);border:1px solid rgba(255,176,32,.32)}
  .vn-tag{display:inline-block;margin-right:7px;font-size:10px;font-weight:700;
    text-transform:uppercase;letter-spacing:.04em;opacity:.85}
  .vn-same .vn-tag{color:var(--green)} .vn-diff .vn-tag{color:var(--amber,#ffb020)}
  .vn-thor{background:rgba(255,176,32,.05);border-color:rgba(255,176,32,.26)}
  .vn-cloud{background:rgba(64,192,120,.05);border-color:rgba(64,192,120,.26)}
  footer{padding:12px 22px;color:var(--faint);font-size:11px;border-top:1px solid var(--line);
    font-family:var(--mono)}
  .deepless{color:var(--faint);font-size:11px;padding:2px 0}
  /* Level-1 fleet overview — every relay is one compact row (fits one screen at
     5-20 relays); click a row -> level 2 = the full per-relay panel. */
  .ovrow{display:flex;align-items:center;gap:14px;padding:10px 14px;background:var(--panel);
    border:1px solid var(--line);border-radius:10px;cursor:pointer}
  .ovrow:hover{background:var(--panel2)}
  .ovrow.stale{opacity:.55}
  .ovrow .name{font-weight:700;font-family:var(--mono);font-size:14px;width:56px;flex:none}
  .ovrow .gnet{color:var(--dim);font-family:var(--mono);font-size:11px;width:52px;flex:none}
  .chip-place{font-family:var(--mono);font-size:11px;color:var(--dim);background:var(--panel2);
    border:1px solid var(--line);border-radius:5px;padding:1px 7px;white-space:nowrap;flex:none}
  .ovrow .lat{font-family:var(--mono);font-size:12px;width:110px;display:flex;gap:6px;
    align-items:center;flex:none}
  .ovrow .peers{font-family:var(--mono);font-size:11px;color:var(--dim);width:120px;flex:none}
  .ovspark{margin-left:auto;flex:none;display:flex;align-items:center;gap:8px}
  .crumb{padding:14px 22px 0;font-size:12px;font-family:var(--mono)}
  .crumb a{color:var(--blue);text-decoration:none;cursor:pointer}
  .crumb a:hover{text-decoration:underline}
  .viewtog{margin-left:auto;display:flex;gap:0;border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .viewtog button{background:var(--panel);color:var(--dim);border:0;padding:3px 12px;
    font:11px var(--mono);cursor:pointer;text-transform:uppercase;letter-spacing:.4px}
  .viewtog button.on{background:var(--panel2);color:var(--ink);font-weight:700}
  .ovbar{display:flex;align-items:center;gap:12px;margin-bottom:2px}
  .mapwrap{background:var(--panel);border:1px solid var(--line);border-radius:10px;
    overflow:hidden}
  .mapwrap.stale{opacity:.55}
  .ovtray{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;
    background:var(--panel);border:1px solid var(--line);border-radius:10px}
  .ovtray code{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:11px}
  /* Site-network-host band (host-net health) — condensed rows
     above the relay fleet; same drill-down grammar as relays. */
  .hostband-h{display:flex;align-items:baseline;gap:10px;margin:4px 0 0}
  .hostband-h h3{margin:0;font-size:12px;letter-spacing:.4px;text-transform:uppercase;color:var(--dim)}
  .hostrow{display:flex;align-items:center;gap:12px;padding:9px 14px;background:var(--panel);
    border:1px solid var(--line);border-radius:10px;cursor:pointer;flex-wrap:wrap}
  .hostrow:hover{background:var(--panel2)}
  .hostrow.stale{opacity:.6}
  .hostrow .name{font-weight:700;font-family:var(--mono);font-size:13px;flex:none}
  .hchip{font-family:var(--mono);font-size:11px;color:var(--dim);background:var(--panel2);
    border:1px solid var(--line);border-radius:5px;padding:1px 7px;white-space:nowrap;
    display:inline-flex;align-items:center;gap:5px}
  /* wedge badge — a site node whose control plane is up but peers won't connect
     Red, unmissable; this state is otherwise invisible. */
  .wbadge{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.05em;
    color:#fff;background:var(--red,#c0392b);border-radius:4px;padding:0 5px;margin-left:4px}
  .heal{font-family:var(--mono);font-size:10px;color:var(--dim);margin-left:4px}
  .hchip b{color:var(--ink);font-weight:700}
  .hage{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--faint);white-space:nowrap}
  .hage.bad{color:var(--red);font-weight:700}
  /* Host detail page: metric-group cards in a grid; each drills to history. */
  .hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
  .hcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:12px 14px;cursor:pointer}
  .hcard:hover{background:var(--panel2)}
  .hcard h4{margin:0 0 8px;font-size:11px;letter-spacing:.4px;text-transform:uppercase;
    color:var(--dim);display:flex;align-items:center;gap:8px}
  .hcard .kv{display:flex;justify-content:space-between;gap:10px;padding:3px 0;
    font-size:12px;border-top:1px dashed rgba(58,48,38,.6)}
  .hcard .kv:first-of-type{border-top:0}
  .hcard .kv .k{color:var(--dim)}
  .hcard .kv .v{font-family:var(--mono);color:var(--ink)}
  .hcard .drill{margin-top:8px;font-size:10.5px;color:var(--faint);font-family:var(--mono)}
  .stalebanner{padding:10px 14px;border:1px solid rgba(217,83,79,.5);border-radius:8px;
    background:rgba(217,83,79,.08);font-size:12.5px;color:var(--ink)}
  .bigchart{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .bigchart h4{margin:0 0 6px;font-size:11px;letter-spacing:.4px;text-transform:uppercase;color:var(--dim)}
</style>
</head>
<body>
<header>
  <h1><span class="goat">goat</span> · relay fleet health</h1>
  <!-- Up-level link to the cross-goatnet overview. Hidden unless goatnets.json
       declares MORE THAN ONE goatnet: on a single-goatnet deployment an "all
       goatnets" link that leads to a one-row page is just a dead end. -->
  <a id="upLevel" class="sub" href="goatnets.html"
     style="display:none;color:var(--blue);text-decoration:none;border:1px solid var(--line);
            border-radius:5px;padding:3px 9px">&#8593; all goatnets</a>
  <span class="sub" id="scope">—</span>
  <div class="fleet">
    <div><div class="big" id="fleetCount">—</div><div class="sub">relays ok</div></div>
    <span class="pill p-grey" id="fleetPill">loading</span>
  </div>
</header>
<div id="statustl" class="statustl"></div>
<div id="netverdict" class="netverdict nv-grey"><span class="vdot"></span><div><div class="vh" id="nvHead">Checking the network…</div><div class="vt" id="nvText">Probing the relay fleet from outside the mesh.</div></div></div>
<div id="vantnote" class="vantnote"></div>
<div id="crumb" class="crumb" style="display:none"></div>
<main id="grid"></main>
<footer id="foot">probed —</footer>

<script>
// Show the up-level link only when this deployment actually knows about other
// goatnets. Fails silently: goatnets.json is absent on older deployments and a
// missing cross-goatnet view must not break the fleet page.
fetch("goatnets.json?t=" + Date.now())
  .then(r => r.ok ? r.json() : null)
  .then(c => { if (c && (c.goatnets || []).length > 1)
                 document.getElementById("upLevel").style.display = ""; })
  .catch(() => {});
</script>
<script>
// ===================== CONFIG (hack here) =====================
const REFRESH_MS   = 15000;                  // dashboard re-fetch cadence
const JSON_URL     = "relay-health.json";    // produced by relay-health-probe.sh
const NAMES_URL    = "ingest/peer-names.json";// relay-peer-id -> NetBird name (ADR 1055; site-host resolver, best-effort)
const SERIES_URL   = "ingest/peer-series.json";// relay-peer-id -> downsampled fwd/rcv history (ADR 1055 Part B, this box)
const STALE_AFTER  = 90;                      // seconds; older JSON greys the fleet
// ==============================================================

// Relay-peer-id -> friendly name map, resolved on the site host from the mgmt store
// (the relay only knows the one-way hash). Best-effort: absent -> hex fallback.
let PEER_NAMES = {};
let ID_CONSOLE_URL = "";  // set from peer-names.json (site-host only); enables the person deep-link
async function loadPeerNames(){
  try{
    const r = await fetch(NAMES_URL+"?t="+Date.now(), {cache:"no-store"});
    if(r.ok){ const d = await r.json(); PEER_NAMES = (d && d.names) || {}; ID_CONSOLE_URL = (d && d.id_console_url) || ""; }
  }catch(e){ /* names are optional; keep the last good map */ }
}
// Relay-peer-id -> {h,d,w:[[bucket_ts,fwd_bps,rcv_bps],...]} downsampled by the
// ingest on THIS box. Best-effort; empty tier -> "collecting" in the card.
let PEER_SERIES = {};
async function loadPeerSeries(){
  try{
    const r = await fetch(SERIES_URL+"?t="+Date.now(), {cache:"no-store"});
    if(r.ok){ const d = await r.json(); PEER_SERIES = (d && d.series) || {}; }
  }catch(e){ /* series optional; keep last good */ }
}

const $ = (id) => document.getElementById(id);
const ago = (s) => s < 60 ? s+"s" : s < 3600 ? Math.round(s/60)+"m" : Math.round(s/3600)+"h";
// human bytes/s with spelled-out units ("4.6 KB/s") — null = not yet sampled.
function bps(n){ if(n==null) return "—"; const u=["B/s","KB/s","MB/s","GB/s"]; let i=0,v=n; while(v>=1024&&i<3){v/=1024;i++} return (i?v.toFixed(1):v)+" "+u[i]; }
// bits/s -> Mbps (network speed convention — what a speed test / iperf3 reports).
function mbps(bits){ if(bits==null) return "—"; const m=bits/1e6; return (m>=100?Math.round(m):m.toFixed(m>=10?0:1))+" Mbps"; }
// Measured link CAPACITY (a short iperf3 speed test — what the link CAN do),
// with provenance. hn.capacity is written by capacity-probe.sh (hourly + on
// demand). Distinct from the usage rate; shown in Mbps.
function capacityLine(hn){
  const c = hn.capacity;
  if(!c || !c.mesh || c.mesh.down_bps==null) return `<span class="note">not measured yet</span>`;
  const up = c.mesh.up_bps!=null ? ` <span class="cdim">↑</span> <b>${mbps(c.mesh.up_bps)}</b>` : "";
  const age = c.measured_at ? ` <span class="cdim">· ${ago((Date.now()/1000)-c.measured_at)} ago</span>` : "";
  const pub = (c.public||{}).down_bps!=null ? ` <span class="cdim">· ${mbps(c.public.down_bps)} public</span>` : "";
  // Cross-node federation-primary leg (node-to-node mesh, F-261/ADR 1085 D):
  // shows whether multi-node adds a slower internal hop than the WAN mesh.
  const cn = (c.crossnode||{}).down_bps!=null
    ? ` <span class="cdim">· ${mbps(c.crossnode.down_bps)} → ${esc(c.crossnode.name||'peer node')}</span>` : "";
  return `<span class="cdim">↓</span> <b>${mbps(c.mesh.down_bps)}</b>${up} <span class="cdim">mesh</span>${pub}${cn}${age}`;
}
// packets/s (datagrams), thousands as "1.2k".
function pps(n){ if(n==null) return "—"; return n>=1000?(n/1000).toFixed(1)+"k":n+""; }
// declared capacity rate, Gbit above 1000 Mbit.
function capRate(mbit){ return mbit>=1000 ? (mbit/1000)+" Gbit/s" : mbit+" Mbit/s"; }
// capacity PROVENANCE label — keeps a NIC ceiling from reading as the relay's
// real limit (the goat-relay process saturates well below the NIC).
function capSrc(s){ return {nic:"NIC ceiling — process saturates lower", measured:"measured high-water", target:"ops target"}[s] || "declared"; }
// latency -> status (green<120ms, amber<300, red otherwise; -1 unknown)
function latSt(ms){ return ms<0?"grey":ms<120?"green":ms<300?"amber":"red"; }

// status -> css suffix. "grey" is the honest unknown, never a false green.
function sdot(status){ return {green:"d-green",amber:"d-amber",red:"d-red"}[status]||"d-grey"; }

// SVG sparkline points for one numeric series over a [0..w]x[0..h] box.
function sparkPath(vals, w, h, max){
  if(!vals.length || max<=0) return "";
  const n=vals.length, dx = n>1 ? w/(n-1) : 0;
  return vals.map((v,i)=> `${(i*dx).toFixed(1)},${(h-(v/max)*h).toFixed(1)}`).join(" ");
}
// Rolling-window mean of the dominant direction (max of rx,tx) over history.
// history row = [t, rx_bps, tx_bps, rx_pps, tx_pps, peers]. null if empty.
function rollMeanDominant(hist){
  if(!hist.length) return null;
  return hist.reduce((a,r)=> a + Math.max(r[1],r[2]), 0) / hist.length;
}

// Throughput panel: sparkline (rx+tx over the window) + utilization gauge vs
// the operator-DECLARED capacity. Honest by construction: no deep data ->
// "operator-deep only"; no declared capacity -> grey gauge, never a fake %.
function throughputPanel(r, now){
  const d = r.deep, cap = r.cap || {};
  if(!d){
    return `<div class="tput"><h4>throughput · host NIC rate</h4>
      <div class="none">operator-deep only — run <code>serve.sh --deep</code><br>
      the credential-free hosted probe can't read host throughput (no relay
      metrics endpoint / port). Reachability above is the hosted signal.</div></div>`;
  }
  const hist = d.history || [];
  // Freshness: age of the LATEST deep sample for THIS relay, from its own
  // history timestamp (can lag the fleet `generated` if this relay's deep probe
  // failed a pass). Graded — never implies "live" when the data is old.
  const lastT = hist.length ? hist[hist.length-1][0] : null;
  const ageS  = (lastT!=null && now!=null) ? Math.max(0, now-lastT) : null;
  const fr = ageS==null  ? {t:"sample age unknown", c:"--faint"}
           : ageS<=45    ? {t:`updated ${ago(ageS)} ago`, c:"--dim"}
           : ageS<=150   ? {t:`aging · ${ago(ageS)} ago`, c:"--amber"}
           :               {t:`STALE · last ${ago(ageS)} ago`, c:"--red"};
  const W=300, H=48;
  let maxv=1; hist.forEach(p=>{ maxv=Math.max(maxv,p[1],p[2]); });
  const winMin = ((hist.length*REFRESH_MS/1000)/60).toFixed(1);   // window span covered
  const yOf = v => (H-(v/maxv)*H).toFixed(1);
  const lastIn = hist.length? hist[hist.length-1][1]:0, lastOut = hist.length? hist[hist.length-1][2]:0;
  // Chart with reference: labeled y-axis (0 → window peak), a zero baseline, and
  // an end-dot per series marking the current value (ties the line to the in/out
  // numbers above). Auto-scaled per relay, so the axis label is what gives the
  // line magnitude — without it the lines are just shapes.
  const svg = hist.length>=2
    ? `<div class="spark-wrap">
         <div class="spark-y"><span>${bps(maxv)}</span><span>0</span></div>
         <svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
           <line x1="0" y1="${H-0.5}" x2="${W}" y2="${H-0.5}" stroke="var(--line)" stroke-width="1"/>
           <polyline fill="none" stroke="var(--blue)" stroke-width="1.5" points="${sparkPath(hist.map(p=>p[1]),W,H,maxv)}"/>
           <polyline fill="none" stroke="var(--amber)" stroke-width="1.5" points="${sparkPath(hist.map(p=>p[2]),W,H,maxv)}"/>
           <circle cx="${W-1.5}" cy="${yOf(lastIn)}" r="2.5" fill="var(--blue)"/>
           <circle cx="${W-1.5}" cy="${yOf(lastOut)}" r="2.5" fill="var(--amber)"/>
         </svg>
       </div>
       <div class="note" style="margin-top:3px"><span style="color:var(--blue)">━</span> in&nbsp;&nbsp;<span style="color:var(--amber)">━</span> out&nbsp;·&nbsp;y-axis 0 to ${bps(maxv)} (window peak)&nbsp;·&nbsp;${hist.length} samples / ~${winMin} min</div>`
    : `<div class="none">chart needs 2+ deep samples (have ${hist.length} — each <code>--deep</code> pass adds one; fills to ~10 min)</div>`;
  // utilization = rolling-window mean of the busier direction / declared capacity
  const roll = rollMeanDominant(hist);
  let gauge;
  if(cap.bps==null){
    gauge = `<div class="gauge" title="No utilization shown until a relay's sustainable throughput is established (measured high-water from a load test, or an ops target) and set as cap_mbit in relays.conf. The instance NIC line-rate is NOT that number — the goat-relay process saturates well below it.">
      <div class="track"><div class="fill gf-grey" style="width:0%"></div></div>
      <div class="lbl"><span>utilization</span><span>capacity not declared</span></div></div>`;
  } else if(roll==null){
    gauge = `<div class="gauge"><div class="track"><div class="fill gf-grey" style="width:0%"></div></div>
      <div class="lbl"><span>utilization</span><span>warming up</span></div></div>`;
  } else {
    const pct = Math.min(100, (roll/cap.bps)*100);
    const pctTxt = pct===0 ? "0" : pct<1 ? "<1" : pct.toFixed(pct<10?1:0);   // show "<1%", never a bare "0%" that hides real traffic
    const gc = pct>=90?"gf-red":pct>=70?"gf-amber":"gf-green";
    gauge = `<div class="gauge" title="busier direction ~${bps(roll)} averaged over ${hist.length} samples ÷ declared ${capRate(cap.mbit)} (${capSrc(cap.src)})">
      <div class="track"><div class="fill ${gc}" style="width:${pct.toFixed(1)}%"></div></div>
      <div class="lbl"><span><b>${pctTxt}%</b> of ${capRate(cap.mbit)} used <span class="note">(${capSrc(cap.src)})</span></span><span class="note">avg of ${hist.length} · ~${winMin} min</span></div></div>`;
  }
  const pw = d.peers_window_min || 5;
  const pc = (d.peers_recent!=null) ? d.peers_recent : d.peers_5m;
  const peers = (pc!=null) ? `<span class="chip">${pc} peers auth'd ≤${pw}m</span>` : "";
  const capPps = (cap.pps!=null) ? ` <span class="note">/ ${pps(cap.pps)} cap</span>` : "";
  return `<div class="tput">
    <h4 title="Whole-host NIC rate: every byte on the relay host (control, SSH, our probes), not only relayed peer traffic. The relayed per-peer breakdown is the panel below.">throughput · host NIC rate</h4>
    <div class="note" style="margin:-2px 0 6px">whole host, all traffic · <b>relayed per-peer breakdown below ↓</b></div>
    <div class="note" style="margin:-3px 0 7px"><span style="color:var(${fr.c})">⟳ ${fr.t}</span></div>
    <div class="nums">
      <span><span style="color:var(--blue)">●</span> in <b>${bps(d.rx_bps)}</b></span>
      <span><span style="color:var(--amber)">●</span> out <b>${bps(d.tx_bps)}</b></span>
      <span><b>${pps(d.rx_pps)}/${pps(d.tx_pps)}</b> <span class="note">packets/s in/out</span>${capPps}</span></div>
    ${svg}
    ${gauge}
    <div class="chips">${peers}<span class="chip">cpu ${d.cpu_pct}%</span><span class="chip">mem ${d.mem_pct}%</span></div>
    ${deliveryCard(d.delivery)}
  </div>`;
}

// Relay data-plane delivery health. Renders the relay's own
// drop counters + the QUIC-vs-WS connection split. The load-bearing signals:
//  - datagram_too_large: a WS peer sent a frame bigger than a QUIC peer can
//    receive. After the F-275 fix these are DROPPED + COUNTED (not fatal), so a
//    steady trickle is expected/benign; a SPIKE means a peer is pushing oversize
//    frames cross-transport. Pre-fix this KILLED the QUIC peer's writer.
//  - writer_death / evictions: a QUIC writer hit a connection-level failure and
//    the relay closed the conn (post-fix behaviour). Should be ~0; a rising
//    count is real distress worth a look.
//  - peer_not_found: frames addressed to peers not in the registry (offline /
//    departed). High-volume is normal churn; it's here for completeness.
// Honest: null delivery (relay hasn't published it yet / pre-transport-vis
// build) renders nothing rather than fabricating zeros.
function deliveryCard(dv){
  if(dv==null) return "";
  const dr = dv.drops||{};
  const dtl = +dv.datagram_too_large || +dr.datagram_too_large || 0;
  const wdeath = +dv.writer_death||0, evict = +dv.evictions||0;
  const win = dv.window_min!=null ? ` <span class="note">(${dv.window_min}m)</span>` : "";
  // datagram_too_large / writer_death drive the colour: green at 0, amber on any,
  // red when writer deaths are recurring (the actual wedge precursor).
  const st = (wdeath>=3) ? "red" : (wdeath>0||dtl>0) ? "amber" : "green";
  const tq = (dv.conns_quic!=null||dv.conns_ws!=null)
    ? `<span class="chip" title="active relay connections by transport, from the relay's own stats endpoint. QUIC = UDP datagrams (path-MTU-bound frames); WS = TCP (frames to 8820 B). The size mismatch across transports is what F-275 was about.">transport <b>${cnt(dv.conns_quic)}</b> quic · <b>${cnt(dv.conns_ws)}</b> ws</span>`
    : "";
  return `<div class="chips" style="margin-top:4px">
    <span class="chip" title="relay data-plane delivery (ADR 1055). Drops are silent at the wire (spec §3.3) but counted here. datagram_too_large = a WS→QUIC oversized frame, dropped+counted since the F-275 fix (was a writer-kill before). writer_death = a QUIC writer hit a connection-level failure and the relay closed the conn. Both should stay near 0; a rising trend is the signal.">
      <span class="sdot ${sdot(st)}"></span>delivery${win} · <b>${cnt(dtl)}</b> too-large · <b>${cnt(wdeath)}</b> writer-death · <b>${cnt(evict)}</b> evict</span>
    ${tq}
    <span class="chip cdim" title="cumulative relay drop counters by reason (lifetime, since relay start).">drops pnf <b>${cnt(dr.peer_not_found)}</b> · wfull <b>${cnt(dr.writer_full)}</b> · wclosed <b>${cnt(dr.writer_closed)}</b></span>
  </div>`;
}

// Per-peer forwarded-rate distribution (ADR 1055 §2b). Only renders when the
// relay published a peers[] block (its --stats-addr endpoint + the Go
// relay-probe publisher). Sorted desc by push rate — the bar shape shows flat
// vs power-law, and a peer taking an outsized share is flagged HOG (a throttle/
// evict candidate). Honest: rate null (first sample) falls back to cumulative
// bytes + says so; all-zero reads "idle", never a fabricated bar.
function hbytes(n){ if(n==null) return "—"; const u=["B","KB","MB","GB","TB"]; let i=0,v=n; while(v>=1024&&i<4){v/=1024;i++} return (i?v.toFixed(1):v)+" "+u[i]; }
function shortId(h){ return (typeof h==="string" && h.length>12) ? h.slice(0,10)+"…" : (h||"?"); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
// Display label for a relay peer id: the friendly NetBird name when resolved
// (trimmed — the auto-onboard names carry a long -<goatnet>-<date>-<host> suffix),
// else the short hex. The full name + full hex always ride in the title (hover).
function trimName(n){
  let s = n.replace(/^peer-/, "");                 // drop the onboard "peer-" prefix
  s = s.replace(/-\d{4}-\d{2}-\d{2}.*$/, "");     // drop the -<date>-<host> tail; <handle>-<goatnet> stays, for any goatnet
  return (s.length>28 ? s.slice(0,27)+"…" : s) || n;
}
// PEER_NAMES[id] is a baseball-card object {name,id,aff,ip,os,host,seen,conn}
// (or a bare string for legacy maps). Normalize to an object.
function cardOf(id){ const v=PEER_NAMES[id]; if(v==null) return null; return (typeof v==="string")?{name:v}:v; }
function nameFor(id){ const c=cardOf(id); return (c&&c.name) ? esc(trimName(c.name)) : shortId(id); }
function titleFor(id){ const c=cardOf(id); return esc((c&&c.name) ? (c.name+"\n"+id+"\nclick for peer card") : (id+"\nclick for peer card")); }
function peersPanel(r){
  const d=r.deep; if(!d || !Array.isArray(d.peers) || d.peers.length===0) return "";
  const haveRate = d.peers.some(p=>p.fwd_bps!=null);
  const val = p => haveRate ? (p.fwd_bps||0) : (p.fwd_bytes||0);
  const rows = d.peers.map(p=>({id:p.peer_id, v:val(p)})).sort((a,b)=>b.v-a.v);
  const total = rows.reduce((s,x)=>s+x.v,0), max = rows.length?rows[0].v:0;
  const fmt = haveRate ? bps : hbytes;
  const unit = haveRate ? "rate" : "bytes";
  if(total===0){
    return `<div class="peers"><h4>per-peer forwarded ${unit} <span class="note">${rows.length} peer${rows.length!==1?"s":""} · idle</span></h4>
      <div class="none">no forwarded bytes this sample</div></div>`;
  }
  const shareTop = max/total;                                  // power-law signal
  const shape = shareTop>=0.40 ? `power-law · top ${(shareTop*100).toFixed(0)}%` : "roughly flat";
  const TOPN=12, shown=rows.slice(0,TOPN);
  const bars = shown.map(x=>{
    const hog = (x.v/total)>=0.40;                             // >40% of total = hog
    const w = max>0 ? Math.max(2,(x.v/max)*100) : 0;
    return `<div class="prow" onclick="openCard('${x.id}','${esc(r.name)}','${fmt(x.v)}')" title="${titleFor(x.id)}">`
      + `<span class="pid">${nameFor(x.id)}</span>`
      + `<span class="pbar"><span class="pfill${hog?" hog":""}" style="width:${w.toFixed(1)}%"></span></span>`
      + `<span class="pval">${fmt(x.v)}${hog?' <b class="hogtag">HOG</b>':""}</span></div>`;
  }).join("");
  const more = rows.length>TOPN ? `<div class="note" style="margin-top:4px">+${rows.length-TOPN} more</div>` : "";
  // Relayed total across all peers, so the sum is directly comparable to the
  // host-NIC throughput above (which also counts both directions + rathole +
  // control + OS) — a peer sum well under the NIC rate is expected, not a gap.
  const relayed = `<div class="note" style="margin-top:5px">relayed total (fwd, all ${rows.length} peers): <b>${fmt(total)}</b> — counted once, vs whole-host NIC rate above</div>`;
  return `<div class="peers"><h4>per-peer forwarded ${unit} <span class="note">${rows.length} peers · ${shape}${haveRate?"":" · cumulative (first sample)"}</span></h4>${bars}${more}${relayed}</div>`;
}

// Peer baseball card (ADR 1055). Click a peer row -> identity/affiliation/NetBird
// id + last-seen, plus the time-series section (Part B — the retention layer is
// designed-not-built, so the windows are honestly labeled "retention pending").
function fmtSeen(s){
  if(!s) return "—";
  const t=Date.parse(s); if(isNaN(t)) return esc(String(s));
  const d=(Date.now()-t)/1000; if(d<0) return "just now";
  return d<60?Math.round(d)+"s ago":d<3600?Math.round(d/60)+"m ago":d<86400?Math.round(d/3600)+"h ago":Math.round(d/86400)+"d ago";
}
// Inline-SVG sparkline of forwarded rate for one tier (no chart lib). Empty tier
// reads "collecting" — honest: the window fills as samples accumulate, no backfill.
function sparkline(pts){
  if(!pts || pts.length===0) return '<span class="cdim">collecting…</span>';
  const W=200,H=30, vals=pts.map(p=>+p[1]||0), max=Math.max(1,...vals), n=pts.length;
  const x=i=> n<=1?W:(i/(n-1))*W, y=v=> H-2-(v/max)*(H-4);
  const d=vals.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ');
  const cur=vals[vals.length-1];
  return `<svg class="spark" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">`
    + `<path d="${d}" fill="none" stroke="var(--blue)" stroke-width="1.5"/></svg>`
    + `<span class="sparkv">${bps(cur)}<span class="cdim"> · peak ${bps(max)} · n=${n}</span></span>`;
}
function openCard(id, relay, rate){
  const c = cardOf(id) || {};
  const row=(k,v)=>`<div class="crow"><span class="ck">${k}</span><span class="cv">${v}</span></div>`;
  // NetBird groups — the peer's mesh-ACL grouping (legacy role/affiliation encoding).
  // NOT canonical affiliation: the identity grammar puts affiliation on the cert
  // URI-SAN / identity registry (a different key than the relay's wg-pubkey hash),
  // which is the Part-B registry join — shown honestly as "pending" below.
  const grp = c.aff ? esc(c.aff).replace(/,/g,", ") : '<span class="cdim">— (default group only)</span>';
  const conn = c.conn===true ? '<span class="cok">on mesh</span>' : c.conn===false ? '<span class="cdim">offline</span>' : '<span class="cdim">?</span>';
  let h = `<div class="ctitle">${c.name?esc(c.name):shortId(id)}</div>`;
  h += row("netbird groups", grp);
  h += row("affiliation", '<span class="cdim">canonical (registry/cert) — pending join</span>');
  h += row("netbird id", c.id?('<code>'+esc(c.id)+'</code>'):'<span class="cdim">—</span>');
  h += row("relay id", '<code title="'+esc(id)+'">'+esc(id.slice(0,20))+'…</code>');
  h += row("mesh ip", c.ip?esc(c.ip):'<span class="cdim">—</span>');
  h += row("host / os", (c.host?esc(c.host):'—')+(c.os?(' · '+esc(c.os)):''));
  h += row("last seen", fmtSeen(c.seen)+' · '+conn);
  h += row("forwarding", 'via '+esc(relay)+' @ '+esc(rate));
  // Deep-link into the id-admin-console person record (peer-identity-resolution.md).
  // ID_CONSOLE_URL is set only on the mesh (site host) dashboard, and the whole page is
  // ADMINS-gated, so the link is mesh + admin only. c.ory_id is baked by the site host
  // resolver (peer name → registry → Ory id); absent → person unresolved, no link.
  if(c.ory_id && ID_CONSOLE_URL){
    const url = ID_CONSOLE_URL.replace(/\/+$/,"") + "/users/" + encodeURIComponent(c.ory_id);
    h += row("full identity", '<a class="idlink" href="'+esc(url)+'" target="_blank" rel="noopener">open in id-admin-console →</a>');
  } else if(ID_CONSOLE_URL){
    h += row("full identity", '<span class="cdim">person unresolved — org via portal access view</span>');
  }
  const S = PEER_SERIES[id] || {};
  const tsrow=(label,key)=>`<div class="ctsrow"><span class="ctsl">${label}</span><span class="ctsv">${sparkline(S[key])}</span></div>`;
  h += `<div class="cts"><div class="ctsh">forwarded rate over time <span class="cdim">(this box)</span></div>`
    + tsrow("last hour","h") + tsrow("last 24 h","d") + tsrow("last 7 days","w") + `</div>`;
  document.getElementById("cardBody").innerHTML = h;
  document.getElementById("cardModal").style.display = "flex";
}
function closeCard(){ document.getElementById("cardModal").style.display="none"; }
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeCard(); });

// Per-relay overall rollup from its probes (worst wins; unknown stays grey).
function relayStatus(r, tunnelEndpoint){
  const e = r.enroll;
  const enroll = e.ok===0 ? "red" : e.ok<e.tries ? "amber" : "green";   // flap -> amber
  const ctl    = r.rathole_ctl===true ? "green" : "red";
  const stun   = r.stun===true ? "green" : r.stun===false ? "amber" : "grey";
  const dp     = r.dataplane || {};
  // The relay data plane (:33073) is served over TWO independent transports.
  // WS/TCP is a direct path to the relay's own goat-relay (no hairpin), so it
  // drives health on BOTH vantages. QUIC/UDP shares STUN's residential-UDP-
  // egress caveat from the site host, so it's informational on a tunnel endpoint and
  // health-driving only externally. quic false = amber (can't tell filtered
  // from VN-disabled), never red, never a false green.
  const wsTcp  = dp.ws_tcp===true ? "green" : dp.ws_tcp===false ? "red" : "grey";
  const quic   = dp.quic_udp===true ? "green" : dp.quic_udp===false ? "amber" : "grey";
  const order  = {red:0,amber:1,grey:2,green:3};
  // From the tunnel ENDPOINT (the site host), :443 hairpins and STUN/QUIC are
  // residential-UDP — unreliable from this vantage and NOT representative of
  // what a real enrolling peer sees. Health there is :2333 control reachability
  // + :33073 WS/TCP data-plane reach (both non-hairpin); :443/STUN/QUIC are
  // informational only.
  let worst = tunnelEndpoint ? [ctl, wsTcp] : [enroll, ctl, stun, wsTcp, quic];
  if(r.deep){
    if(r.deep.rathole && r.deep.rathole!=="active") worst.push("red");
    if(r.deep.watchdog && r.deep.watchdog!=="active") worst.push("amber");
    if(r.deep.relay_up===0) worst.push("red");
    // F-229 — root-disk fill + runaway container log. A full root disk kills
    // SSM on a relay; warn well before then.
    const dk = +r.deep.disk_pct;
    if(dk>=95) worst.push("red"); else if(dk>=85) worst.push("amber");
    if(+r.deep.max_container_log_mb > 2000) worst.push("amber");
    // F-269 — this relay is auth-rejecting a peer (stale cached token / WS
    // upgrade never finished). A specific peer being turned away is a real
    // per-peer fault, not "it's you." ws_handoff_eof is benign QUIC-race noise
    // — never colored.
    const ar = r.deep.auth_reject;
    if(ar && ((+ar.expired_token||0)>0 || (+ar.ws_upgrade_timeout||0)>0)) worst.push("amber");
  }
  return worst.reduce((a,b)=> order[b]<order[a]?b:a, "green");
}

function bars(ok,tries){
  let h="";
  for(let i=0;i<tries;i++) h += `<span class="bar ${i<ok?'ok':'bad'}"></span>`;
  return `<span class="bars">${h}</span>`;
}

function row(k, statusClass, vHtml){
  return `<div class="row"><span class="k">${k}</span>

}

// Placement chip text (ADR 1080): declared place (underscores = spaces), else
// the provider region, else an honest em-dash. Never a guessed location.
function placeChip(r){
  const p = r.placement || {};
  const label = p.place ? esc(p.place).replace(/_/g," ") : (r.region ? esc(r.region) : "—");
  const tip = [p.provider?("provider "+p.provider):null, r.region?("region "+r.region):null,
               p.az?("az "+p.az):null,
               (p.lat!=null)?("geo "+p.lat+","+p.lon):"no declared geo (unplaced on map)"]
              .filter(Boolean).join(" · ");
  return `<span class="chip-place" title="${esc(tip)}">${label}</span>`;
}
// Tiny overview sparkline: dominant direction over the deep history window.
// No deep data -> an honest dash (hosted fast probes can't see throughput).
function ovSpark(r){
  const hist = (r.deep && r.deep.history) || [];
  if(hist.length < 2) return `<span class="note" title="throughput needs deep data (--deep or relay self-publish)">—</span>`;
  const W=110, H=22;
  let maxv=1; hist.forEach(p=>{ maxv=Math.max(maxv, p[1], p[2]); });
  const vals = hist.map(p=>Math.max(p[1],p[2]));
  return `<svg class="spark" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:${H}px">
      <polyline fill="none" stroke="var(--blue)" stroke-width="1.2" points="${sparkPath(vals,W,H,maxv)}"/>
    </svg><span class="note">${bps(Math.max(hist[hist.length-1][1], hist[hist.length-1][2]))}</span>`;
}

// ===================== site network hosts (host-net health) =====================
// The site hosts (mgmt hosts) are the rathole tunnel ENDPOINTS — when a
// host's uplink degrades, relays read "flapping" and the mesh loses its control
// plane. This band surfaces exactly those metrics,
// from the host's own vantage, with stored last-known state while it's dark.
function hostAge(doc, now){ return Math.max(0, now - (doc.received_at||0)); }
function hostStale(doc, now){
  const iv = ((doc.host_net||{}).interval_s) || 60;
  return hostAge(doc, now) > 3*iv;
}
// Per-group status: {st, note}. Thresholds are the RCA-derived degradation
// signals; every threshold rides in the tooltip so a color is never unexplained.
function wanSt(hn){
  const w = hn.wan||{};
  if(w.loss_pct==null) return {st:"grey", note:"loss unmeasured"};
  if(w.loss_pct>=20 || (w.rtt_avg_ms!=null && w.rtt_avg_ms>400)) return {st:"red", note:"uplink failing"};
  if(w.loss_pct>=5  || (w.rtt_avg_ms!=null && w.rtt_avg_ms>150)) return {st:"amber", note:"lossy/slow"};
  return {st:"green", note:"clean"};
}
function tunSt(hn){
  const t = hn.tunnels||{};
  if(t.total==null) return {st:"grey", note:"unmeasured"};
  if((t.active??0) < (t.total??0)) return {st:"red", note:"tunnel down"};
  if((t.errs_15m??0) >= 30) return {st:"red", note:"flapping hard"};
  if((t.errs_15m??0) >= 5)  return {st:"amber", note:"flapping"};
  return {st:"green", note:"stable"};
}
function ctlSt(hn){
  const c = hn.control||{};
  if(c.signal_container==="down" || c.mgmt_container==="down") return {st:"red", note:"container down"};
  // Health keys on BACKPRESSURE (outbound_full: the recipient IS connected but
  // its receive queue is saturated) — the genuine signal-plane distress signal.
  // notfound is deliberately NOT a health input: it counts offers to OFFLINE
  // peers (retry overhead, not a fault — the dominant term in a mesh with many
  // peers down), and its one real dysfunction case (cross-shard misses while
  // federation is unhealthy) is owned by the federation band. Thresholds/min are
  // provisional — calibrate to the observed healthy baseline. See
  // relay-health-dashboard.md §"signal chip: offline-retry vs backpressure".
  const bp = c.signal_backpressure_60s;
  if(bp!=null && bp>=300) return {st:"red", note:"signal backpressure — recipient queues saturated"};
  if(bp!=null && bp>=30)  return {st:"amber", note:"signal backpressure building"};
  if(c.signal_container==null) return {st:"grey", note:"no mgmt plane here"};
  return {st:"green", note:"normal"};
}
function meshSt(hn){
  const m = hn.mesh||{};
  // Node health is NOT derived from the connected-peer COUNT .
  // peers_total is the full registered roster — mostly OFFLINE at any instant —
  // so connected/total just tracks how many peers happen to be powered on, not
  // this node's health or reachability. The old ratio (r<0.10 "dark", r<0.50
  // "degraded") and the selfheal_wedged floor both false-alarmed on offline
  // peers: a node can read 10% connected from offline peers alone while its
  // relay-fronted services are fully reachable. Authoritative reachability = the relay
  // front door (probed above) + the net-health reachability-canary (off-node;
  // the correct F-261-class lockout detector — to be wired into this verdict).
  // Peer count + self-heal wedge are shown as INFO annotations on the chip only,
  // never a health color. The one real per-node signal here is control plane.
  if(m.management && m.management!=="Connected")
    return {st:"amber", note:"control plane not Connected ("+m.management+")"};
  if(m.peers_total==null) return {st:"grey", note:"unmeasured"};
  return {st:"green", note:"control plane up; "+(m.peers_connected||0)+"/"+m.peers_total+" self-reported peers (a peer count is not a health measure)"};
}
function sysSt(hn){
  const s = hn.sys||{};
  if(s.disk_pct==null) return {st:"grey", note:"unmeasured"};
  if(s.disk_pct>=95) return {st:"red", note:"disk critical"};
  if(s.disk_pct>=85) return {st:"amber", note:"disk high"};
  return {st:"green", note:"nominal"};
}
function hostStatus(doc, now){
  if(hostStale(doc, now)) return "grey";      // not reporting — honest unknown, never a guessed red
  const hn = doc.host_net||{};
  return worstStatus([wanSt(hn).st, tunSt(hn).st, ctlSt(hn).st, meshSt(hn).st, sysSt(hn).st]);
}
function pct(n){ return n==null ? "—" : (+n).toFixed(0)+"%"; }
function ms(n){ return n==null ? "—" : (+n)<10 ? (+n).toFixed(1)+" ms" : Math.round(+n)+" ms"; }
function cnt(n){ return n==null ? "—" : String(n); }
// netbird self-heal restart chip + its cross-boot HISTORY. The chip
// shows this-boot count (selfheal_restart_total); the tooltip lists the recent
// restart TIMELINE (selfheal_restart_history = [[unixtime,connected,total],…],
// newest last) so "how often is this node self-healing" is answerable, not just
// "did it restart this boot". Nothing when the node has never self-healed.
function healChip(m){
  const tot = m.selfheal_restart_total;
  const hist = Array.isArray(m.selfheal_restart_history) ? m.selfheal_restart_history : [];
  if(!(tot>0) && hist.length===0) return "";
  let tip = "netbird self-heal restarts this boot.";
  if(hist.length){
    const lines = hist.slice(-8).reverse().map(e=>{
      const t=e[0], c=e[1], tt=e[2];
      return `  ${ago(Date.now()/1000 - t)} ago — restarted at ${c}/${tt} peers`;
    }).join("\n");
    tip += `\nrecent self-heal restarts (newest first):\n${lines}`;
  }
  const n = (tot>0)?tot:hist.length;
  return `<span class="heal" title="${esc(tip)}">· ${cnt(n)} self-heal↻${hist.length>1?` <span class="cdim">(${hist.length} logged)</span>`:''}</span>`;
}
// Condensed band row (level 1): the collapsed view — status + the four

  return `<div class="hostrow ${stale?'stale':''}" onclick="openHost('${esc(hn.host||doc.host)}')" title="open ${esc(hn.host||doc.host)} host-network detail">
    <span class="dot ${sdot(st)}"></span>

    <span class="hchip" title="rathole tunnels active/total · client WARN/ERROR count last 15m (≥5 amber, ≥30 red — the relay-side FLAPPING you see is these tunnels dropping)"><span class="sdot ${sdot(stale?'grey':tunSt(hn).st)}"></span>tunnels <b>${cnt(t.active)}/${cnt(t.total)}</b> · <b>${cnt(t.errs_15m)}</b> errs</span>
    ${c.signal_msgs_60s!=null ? `<span class="hchip" title="signal activity/min. 'offline-retry' = share of offers whose recipient is OFFLINE (not on the mesh right now) — expected overhead in a mesh with peers down, NOT a fault, so it does not color this chip. 'backpressure' = recipient present but its receive queue is saturated (the real signal-plane distress) — that drives the color. Cross-shard delivery health lives in the federation band."><span class="sdot ${sdot(stale?'grey':ctlSt(hn).st)}"></span>signal <b>${cnt(c.signal_msgs_60s)}</b>/min${nf==null?'':` · <span class="cdim">${nf}% offline-retry</span>`}${(c.signal_backpressure_60s)?` · <b>${cnt(c.signal_backpressure_60s)}</b> backpressure`:''}</span>` : ""}
    <span class="hchip" title="${esc(stale?'this host\'s own netbird peer view':meshSt(hn).note)}"><span class="sdot ${sdot(stale?'grey':meshSt(hn).st)}"></span>mesh <b>${cnt(m.peers_connected)}/${cnt(m.peers_total)}</b>${(!stale && m.selfheal_wedged===1)?'<span class="wbadge" title="self-reported low connected-peer count with the control plane up (self-heal engaged, F-261). INFORMATIONAL only — a peer count is not a reachability measure; relay-fronted services can be fully reachable at a low count. Verify via the relay front door / reachability probe.">low-peers?</span>':''}${healChip(m)}</span>
    ${hostRowSpark(hn)}
    ${ageHtml}

}
function hostRowSpark(hn){
  const hist = hn.history||[], i = hn.iface||{};
  // L0 throughput number (visible before drill-down). Lead with measured
  // CAPACITY (Mbps — what the link can do) when the capacity probe has run;
  // else fall back to peak USAGE, then current rate. Matches the host card.
  const cap = hn.capacity && hn.capacity.mesh && hn.capacity.mesh.down_bps;
  const havePeak = (i.rx_bps_peak!=null || i.tx_bps_peak!=null);
  const num = (cap!=null)
    ? `<span class="note">${mbps(cap)} <span class="cdim">cap</span></span>`
    : havePeak

    : (i.rx_bps!=null ? `<span class="note">${bps(Math.max(i.rx_bps||0, i.tx_bps||0))}</span>` : "");
  if(hist.length<2) return num ? `<span class="ovspark">${num}</span>` : "";
  const W=110,H=22; let maxv=1; hist.forEach(p=>{maxv=Math.max(maxv,p[1]||0,p[2]||0);});
  const vals = hist.map(p=>Math.max(p[1]||0,p[2]||0));

    <polyline fill="none" stroke="var(--blue)" stroke-width="1.2" points="${sparkPath(vals,W,H,maxv)}"/></svg>${num}</span>`;
}

// ---- federation band: cross-node signal transport health (ADR 1085 / F-256) --
// Its own category because federation is a CROSS-node fact — no single host card
// can show it. A peer present on signal server A can only exchange offers with a
// peer on server B via federation, whose transport can be the fragile node-to-node
// mesh (primary) or the partition-independent relay path (backup). This band
// reads each node's federation-proxy leg + its live signal-stream count and
// tells the operator the one thing the host cards can't: is cross-shard
// signaling healthy, is failover ready, and how is live signal split across
// nodes. Only appears where ≥1 host runs the proxy (multi-node signal goatnets).
// mode (ADR 1107): "active-active" = split-across-nodes is the ideal; "loose-site"/
// "single" = each site homes its own peers, so a severed cross-site leg is island-
// mode (not a severed fabric) and a missing backup is lower-criticality.
function fedSt(f, loose){
  if(!f || f.leg==null) return {st:"grey", note:"no federation on this node"};
  if(f.leg==="down")   return loose
    ? {st:"amber", note:"cross-site transport down — this site keeps serving its OWN peers (island-mode); only connections BETWEEN sites stall, until the link heals"}
    : {st:"red",   note:"transport SEVERED — mesh primary down and no relay backup up"};
  if(f.leg==="backup") return {st:"amber", note:"on the relay-backup leg — mesh primary flapped, failover carrying"};
  if((f.backup_ready||0)===0) return loose
    ? {st:"grey",  note:"mesh primary up; no relay backup leg ready — cross-site path only, lower criticality in loose federation"}
    : {st:"amber", note:"mesh primary up but NO backup leg ready — a flap would sever"};
  return {st:"green", note:"mesh primary, relay backup ready"};
}
function fedRow(name, f, crossnode, loose){
  const s = fedSt(f, loose);
  const streamsTitle = loose
    ? "live signal streams homed on this node. In loose federation each site homes its OWN peers — single-homing per site is the design, not a split to rebalance."
    : "live signal streams homed on this node (signal connected_peers). Compare across nodes: this is the active-active split. All on one node = active-passive in practice (sticky long-lived streams).";
  const legLabel = f.leg==="mesh" ? "MESH primary" : f.leg==="backup" ? "RELAY backup" : f.leg==="down" ? "SEVERED" : "—";
  return `<div class="hostrow" title="${esc(name)} — cross-node signal federation from this node's federation-proxy">
    <span class="dot ${sdot(s.st)}"></span>
    <span class="name">${esc(name)}</span>
    <span class="hchip" title="which bearer carries THIS node's cross-shard offers to its peer right now: mesh = node-to-node WireGuard (fast, dies with a node-to-node partition); relay = public path via the relay fleet (survives that partition — the F-256 fix). Failover mesh→relay takes ~4s of health checks."><span class="sdot ${sdot(s.st)}"></span>leg <b>${legLabel}</b></span>
    <span class="hchip" title="relay backup legs health-checked UP right now = failover depth if the mesh primary drops. 0 while on mesh = a flap would have nowhere to go."><span class="sdot ${sdot((f.backup_ready||0)>0?'green':'amber')}"></span>backup <b>${cnt(f.backup_ready)}</b> ready</span>
    <span class="hchip" title="${streamsTitle}"><span class="sdot ${sdot(f.signal_streams>0?'green':'grey')}"></span>signal <b>${cnt(f.signal_streams)}</b> streams</span>
    <span class="hchip" title="cross-shard offers this node FORWARDED to its peer in the last publish window — federation actually delivering, not merely reachable"><span class="sdot d-grey"></span>fwd <b>${f.fwd_60s==null?'—':f.fwd_60s+'/min'}</b></span>
    ${crossnode ? `<span class="hchip" title="measured node-to-node mesh-leg capacity (the federation PRIMARY transport) — short iperf3, hourly. The relay-backup leg's capacity is the relay-path measurement."><span class="sdot d-grey"></span>mesh link <b>${mbps(crossnode.down_bps)}</b></span>` : ""}
  </div>`;
}
function federationBand(now){
  const parts = Object.keys(HOSTS).map(n=>{
    const hn = HOSTS[n].host_net||{};
    return {name: hn.host||n, f: hn.federation||null, cap: hn.capacity||null};
  }).filter(p => p.f && (p.f.leg!=null || p.f.signal_streams!=null));
  if(!parts.length) return "";
  parts.sort((a,b)=>a.name.localeCompare(b.name));
  const legs = parts.map(p=>p.f.leg);
  const streams = parts.map(p=>p.f.signal_streams||0);
  const totStreams = streams.reduce((a,b)=>a+b,0);
  // Federation MODE (ADR 1107) — grade against what this goatnet's federation is
  // MEANT to be, not against active-active by assumption. loose-site/single: each
  // site homes its own peers, so single-homing is the DESIGN (not active-passive)
  // and a cross-site cut is island-mode (not a severed fabric).
  const fmode = parts.map(p=>p.f && p.f.mode).find(Boolean) || "active-active";
  const loose = (fmode==="loose-site" || fmode==="single");
  let vst, vh, vt;
  if(legs.includes("down")){
    if(loose){ vst="amber"; vh="Cross-site path down — sites serving locally";
      vt="A node's cross-site signal transport has no path right now. In a loosely-federated goatnet this is island-mode, NOT an outage: each site keeps matchmaking its own peers; only connections BETWEEN sites stall, and they resume when the link heals. This is not the active-active sharding failure."; }
    else { vst="red"; vh="Federation severed";
      vt="A node's cross-shard transport has no path — mesh primary down and no relay backup up. Peers on different signal servers can't exchange offers; the mesh will shard into islands (the F-256 failure mode)."; }
  }
  else if(legs.includes("backup")){ vst="amber"; vh="Failover leg carrying";
    vt="A node's mesh primary flapped and cross-shard signaling is riding the relay-backup leg — working exactly as the F-256 fix intends (partition-independent), at higher latency. It self-recovers to the mesh primary when the node-to-node link heals."; }
  else if(fmode==="single"){ vst="green"; vh="Single-signal by design";
    vt=`This goatnet runs ONE signal node by design; ${totStreams} live streams are homed on it. There is no cross-shard federation to fail — no split, no forwarding dependency — so a lone node reporting here is healthy, not a missing peer. A second node can be stood up as a loosely-federated site without changing this being green.`; }
  else if(parts.length<2){
    if(loose){ vst="grey"; vh="One site reporting";
      vt="Only one site is publishing to this ingest, so the other site's federation health can't be seen from here. In loose federation each site is independently healthy — this greys the cross-site view, it is not itself a fault."; }
    else { vst="grey"; vh="Single federation node reporting";
      vt="Only one federation node is reporting, so cross-node health can't be assessed here. On a two-node goatnet this means the peer node is dark or not publishing to this ingest."; }
  }
  else if(loose){ vst="green"; vh="Loose federation healthy";
    vt=`Each site homes its own signal (streams ${streams.join(" / ")} across ${parts.length} sites) with the cross-site path up. Signal is deliberately NOT split hot across sites — single-homing per site is the design, not active-passive to rebalance. Cross-site offers forward on demand; a link cut degrades to island-mode, not an outage.`; }
  else if(streams.filter(x=>x>0).length<=1){ vst="amber"; vh="Signal single-homed in practice";
    vt=`All ${totStreams} live signal streams are homed on one node — the fabric is running active-passive right now (signal streams are sticky and long-lived, so they stay put after a rebalance). Active-active is configured and both legs are healthy; peers re-home to the other node on their next reconnect. No action needed unless it persists.`; }
  else { vst="green"; vh="Active-active healthy";
    vt=`Both signal nodes are on the mesh-primary leg with a relay backup ready, and ${totStreams} live streams are split across the fabric. A node-to-node partition fails cross-shard signaling over to the relays automatically — the healer no longer rides the patient.`; }
  const crossnode = (parts.map(p=>p.cap && p.cap.crossnode).find(Boolean)) || null;
  const rows = parts.map(p=>fedRow(p.name, p.f, crossnode, loose)).join("");
  const sub = loose
    ? "how each site homes its own peers and whether the cross-site path is ready (ADR 1107): single-homing per site is by design — a cross-site cut is island-mode, not an outage"
    : "how peers on different signal servers reach each other (ADR 1085 · F-256): which transport carries cross-shard offers, whether failover is ready, and how live signal is split across nodes";
  return `<div class="hostband-h"><h3>federation — cross-node signal health</h3>
    <span class="note">${sub}</span></div>
    <div class="netverdict nv-${vst}" style="margin:8px 0 4px"><span class="vdot"></span><div><div class="vh">${esc(vh)}</div><div class="vt">${esc(vt)}</div></div></div>
    ${rows}`;
}
// ---- level 2: one host, metric-group cards (each drills to history) ----
const HOST_CARDS = [
  {key:"wan",     title:"wan uplink"},
  {key:"tunnels", title:"rathole tunnels"},
  {key:"control", title:"control plane"},
  {key:"mesh",    title:"mesh (own view)"},
  {key:"sys",     title:"system"},

function kv(k,v,tip){ return `<div class="kv" ${tip?`title="${esc(tip)}"`:""}><span class="k">${k}</span><span class="v">${v}</span></div>`; }
// rate in/out: lead with the PEAK (the "up to N Mbps" a speed test shows) and
// keep the 60s AVG as context. host-net-ratesample.sh feeds rx/tx_bps_peak;
// hosts not yet running it (peak absent) fall back to the plain avg display.
// Compact, scannable: busier direction only — peak then avg — so it reads as
// one clean line instead of four slashed numbers. The in/out split lives in the
// row's tooltip.
function rateInOut(i){
  const havePeak = (i.rx_bps_peak!=null || i.tx_bps_peak!=null);
  if(!havePeak && i.rx_bps==null) return "—";
  const peak = havePeak ? Math.max(i.rx_bps_peak||0, i.tx_bps_peak||0) : Math.max(i.rx_bps||0, i.tx_bps||0);
  const avg  = Math.max(i.rx_bps||0, i.tx_bps||0);
  return `<b>${bps(peak)}</b> <span class="cdim">peak</span> · ${bps(avg)} <span class="cdim">avg ${i.peak_window_s||60}s</span>`;
}
function hostCardBody(key, hn){
  const w=hn.wan||{}, t=hn.tunnels||{}, c=hn.control||{}, m=hn.mesh||{}, s=hn.sys||{}, l=hn.lan||{}, i=hn.iface||{};
  switch(key){
    case "wan": return kv("packet loss", `<b>${pct(w.loss_pct)}</b> of ${cnt(w.sent)} pings`, "to "+(w.ping_target||"?")+" from the host — bursty loss kills long-lived TCP (tunnels) regardless of bandwidth")
      + kv("rtt", `${ms(w.rtt_avg_ms)} <span class="note">(${ms(w.rtt_min_ms)}–${ms(w.rtt_max_ms)})</span>`)
      + kv("jitter", ms(w.jitter_ms))
      + kv("capacity", capacityLine(hn), "measured link capacity — a short iperf3 speed test to "+((hn.capacity||{}).target||"a mesh target")+", run hourly + on demand. What the link CAN do (Mbps). This is the throughput-health metric; the usage line below is how much is actually flowing now.")
      + kv("usage now", rateInOut(i), "actual traffic on the iface (busier direction, bytes/s — not capacity). in/out avg now: ↓ "+bps(i.rx_bps)+" ↑ "+bps(i.tx_bps)+". peak = highest 1s rate over the last "+((i.peak_window_s||60))+"s; avg = bytes ÷ that window. A mostly-idle fast link reads LOW here and high on capacity above.")
      + kv("public ip", esc(w.public_ip||"—"), "the site egress — if this changes, the uplink itself changed")
      + kv("lan", `${esc(l.ip||"—")} via ${esc(l.gw||"—")} · gw ${ms(l.gw_rtt_ms)}`);
    case "tunnels": {
      const by = t.errs_by_relay||{};
      const bys = Object.keys(by).sort().map(r=>`${esc(r)}:${by[r]}`).join(" · ") || "—";
      return kv("active", `<b>${cnt(t.active)}/${cnt(t.total)}</b> units`)
        + kv("errors 15m", `<b>${cnt(t.errs_15m)}</b>`, "rathole-client WARN/ERROR — every drop kills the mgmt/signal fronting riding that tunnel")
        + kv("by relay", bys);
    }
    case "control": {
      const nf = (c.signal_msgs_60s>=1 && c.signal_notfound_60s!=null) ? Math.round(100*c.signal_notfound_60s/c.signal_msgs_60s) : null;
      return kv("signal container", c.signal_container==null?"— (not this host)":esc(c.signal_container))
        + kv("mgmt container", c.mgmt_container==null?"—":esc(c.mgmt_container))
        + kv("signal rate", `${bps(c.signal_rx_bps)} in / ${bps(c.signal_tx_bps)} out`, "a signal server forwards what it receives — sustained in≫out = storm of undeliverable retries")
        + kv("messages", `${cnt(c.signal_msgs_60s)}/min`, "logged signal relay activity per minute")
        + kv("offline-retry", nf==null?"—":`<b>${nf}%</b>`, "share of offers whose recipient is OFFLINE (absent locally AND across federation) = signal-server 'notfound'. This is retry overhead to peers that aren't on the mesh right now — inefficiency, NOT a fault, and NOT counted toward signal health. Its one dysfunction case (cross-shard misses while federation is down) is surfaced by the federation band.")
        + kv("backpressure", c.signal_backpressure_60s==null?"—":`<b>${cnt(c.signal_backpressure_60s)}</b>/min`, "signal 'outbound_full': the recipient IS connected but its receive queue is saturated. THIS is the real signal-plane distress signal (recipient can't keep up), and it — not offline-retry — colors control-plane health.");
    }
    case "mesh": return kv("management", esc(m.management||"—"))
      + kv("peers", `<b>${cnt(m.peers_connected)}/${cnt(m.peers_total)}</b> connected`, "this host's own netbird view — collapses when signaling breaks");
    case "sys": return kv("load 1m", cnt(s.load1)) + kv("memory", pct(s.mem_pct)) + kv("disk /", pct(s.disk_pct))

  }

}
function hostCardSt(key, hn){ return {wan:wanSt, tunnels:tunSt, control:ctlSt, mesh:meshSt, sys:sysSt}[key](hn); }
function staleBanner(doc, now){
  if(!hostStale(doc, now)) return "";

    Everything below is its <b>last stored report</b> (${new Date((doc.received_at||0)*1000).toLocaleString()}), kept precisely for this moment.</div>`;
}
function hostPage(doc, now){
  const hn = doc.host_net||{};
  const cards = HOST_CARDS.map(cd=>{
    const st = hostStale(doc,now) ? {st:"grey",note:"last known"} : hostCardSt(cd.key, hn);

// ---- level 3: one metric group's history (h/d/w tiers from the ingest) ----
const CARD_SERIES = {   // which stored columns each card charts: [label, col, color, fmt]
  wan:     [["packet loss %","loss","var(--red)",pct],["rtt avg ms","rtt","var(--amber)",ms],["uplink in B/s","rx","var(--blue)",bps],["uplink out B/s","tx","var(--amber)",bps]],
  tunnels: [["tunnel errors (15m window)","tun_errs","var(--red)",cnt]],
  control: [["signal in B/s","sig_rx","var(--blue)",bps],["signal out B/s","sig_tx","var(--amber)",bps],["signal msgs/min","sig_msgs","var(--blue)",cnt],["signal offline-retry/min","sig_nf","var(--dim)",cnt]],
  mesh:    [["peers connected","peers","var(--green)",cnt]],
  sys:     [],

function bigChart(label, rows, col, color, fmt, tierLabel, metrics){
  const ci = (metrics||HOST_SERIES_METRICS).indexOf(col)+1;
  if(ci<=0 || !rows || rows.length<2) return `<div class="bigchart"><h4>${label} · ${tierLabel}</h4><div class="none" style="color:var(--faint);font-size:12px">collecting — needs 2+ stored samples in this window</div></div>`;
  const W=640,H=80, vals=rows.map(r=>+r[ci]||0), maxv=Math.max(1,...vals);

  return `<div class="bigchart"><h4>${label} · ${tierLabel}</h4>
    <div class="spark-wrap">
      <div class="spark-y"><span>${fmt(maxv)}</span><span>0</span></div>
      <svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:${H}px">
        <line x1="0" y1="${H-0.5}" x2="${W}" y2="${H-0.5}" stroke="var(--line)" stroke-width="1"/>
        <polyline fill="none" stroke="${color}" stroke-width="1.5" points="${sparkPath(vals,W,H,maxv)}"/>
      </svg>
    </div>
    <div class="note" style="margin-top:3px">${fmtT(t0)} → ${fmtT(t1)} · ${rows.length} buckets · latest <b>${fmt(vals[vals.length-1])}</b> · peak <b>${fmt(maxv)}</b></div>
  </div>`;
}
function hostCardHistoryPage(doc, now, cardKey){
  const hn = doc.host_net||{};
  const S = HOST_SERIES[hn.host] || {};
  const specs = CARD_SERIES[cardKey] || [];
  const tiers = [["last hour · 1-min buckets","h"],["last 24 h · 15-min buckets","d"],["last 7 days · 2-h buckets","w"]];
  let out = staleBanner(doc, now);
  if(!specs.length) out += `<div class="note">no stored history for this group (current values only — see the host page)</div>`;
  specs.forEach(([label,col,color,fmt])=>{
    tiers.forEach(([tl,tk])=>{ out += bigChart(label, S[tk], col, color, fmt, tl); });

// ===================== zenoh router service health =====================
// The router can wedge in ways its container HEALTHCHECK can't see: the transport
// accept path seizes while REST + established sessions keep flowing (new-session
// opens stall to the 10s timeout; CLOSE-WAIT climbs unbounded — F-253). This band
// surfaces exactly the signals that catch it — a real mTLS new-session OPEN, the
// CLOSE-WAIT count, FD headroom — from the site host's vantage, with stored
// last-known state + h/d/w history that survives the router restarting. Same
// drill-down grammar as the site-host band: row → metric-group cards → history.
function mb(n){ return n==null ? "—" : (+n>=1024 ? (+n/1024).toFixed(1)+" GB" : Math.round(+n)+" MB"); }
function zenohAge(doc, now){ return Math.max(0, now - (doc.received_at||0)); }
function zenohStale(doc, now){
  const iv = ((doc.zenoh||{}).interval_s) || 30;
  return zenohAge(doc, now) > 3*iv;
}
// Per-group status: {st, note}. Thresholds come from FD exhaustion and accept-loop stall behaviour;
// every threshold rides in the tooltip so a color is never unexplained. Only the
// four HEALTH groups (container/admission/wedge/capacity) drive the router dot;
// sessions is informational and crypto is posture (graded, not a health input).
function zContainerSt(z){
  const c = z.container||{};
  if(c.oom===true) return {st:"red", note:"OOMKilled"};
  if(c.running===false) return {st:"red", note:"stopped"};
  if(c.health==="unhealthy") return {st:"red", note:"container unhealthy"};
  if(c.health==="starting") return {st:"amber", note:"starting"};
  if(c.health==="healthy") return {st:"green", note:"healthy"};
  if(c.running==null) return {st:"grey", note:"unmeasured"};
  return {st:"grey", note:"no healthcheck"};   // running but no HEALTHCHECK verdict
}
function zAdmissionSt(z){
  const a = z.admission||{};
  if(a.rest_ok===false) return {st:"red", note:"REST adminspace stalled"};
  if(a.open_ok===false) return {st:"red", note:"new-session open FAILED — seizure"};
  if(a.open_ms!=null && a.open_ms>=10000) return {st:"red", note:"opens stalling to timeout — seizure"};
  if(a.open_ms!=null && a.open_ms>=2000) return {st:"amber", note:"new-session opens slow"};
  if(a.open_ms!=null) return {st:"green", note:"opens fast"};
  // open probe not run (no client cert): REST alone CANNOT confirm admission —
  // F-253 wedged the transport while REST answered. Honest grey, never a green.
  if(a.rest_ms!=null && a.rest_ms>=15000) return {st:"red", note:"REST stalled"};
  if(a.rest_ms!=null && a.rest_ms>=5000) return {st:"amber", note:"REST slow"};
  if(a.rest_ms!=null) return {st:"grey", note:"open unmeasured — REST ok but can't confirm admission (deploy probe cert)"};
  return {st:"grey", note:"unmeasured"};
}
function zWedgeSt(z){
  const w = z.wedge||{};
  if(w.close_wait==null) return {st:"grey", note:"unmeasured"};
  if(w.close_wait>=200) return {st:"red", note:"CLOSE-WAIT pileup — wedge building"};
  if(w.close_wait>=25)  return {st:"amber", note:"CLOSE-WAIT climbing"};
  return {st:"green", note:"0 leaked / nominal"};
}
function zSessionsSt(z){
  const s = z.sessions||{};
  if(s.estab==null) return {st:"grey", note:"unmeasured"};
  if(s.estab===0) return {st:"amber", note:"no established sessions"};
  return {st:"green", note:"flowing"};
}
function zCapacitySt(z){
  const c = z.capacity||{};
  if(c.fd_used==null || c.fd_cap==null || !c.fd_cap) return {st:"grey", note:"fd unmeasured"};
  const r = c.fd_used/c.fd_cap;
  if(r>=0.8) return {st:"red", note:"fd exhaustion risk"};
  if(r>=0.5) return {st:"amber", note:"fd elevated"};
  return {st:"green", note:"headroom ok"};
}
function zCryptoSt(z){
  const c = z.container||{}, cr = z.crypto||{};
  if(c.variant==="stock") return {st:"amber", note:"stock image — un-patched accept loop"};
  if(cr.attest_present===true && cr.attest_fips===true) return {st:"green", note:"FIPS module attested"};
  if(c.variant==="pqc"||c.variant==="pqc-fips") return {st:"green", note:"PQC/patched image"};
  if(cr.version) return {st:"grey", note:"posture — see goat health --domain crypto"};
  return {st:"grey", note:"unmeasured"};
}
function zenohStatus(doc, now){
  if(zenohStale(doc, now)) return "grey";     // bounced/unreachable — honest unknown, never a guessed red
  const z = doc.zenoh||{};
  return worstStatus([zContainerSt(z).st, zAdmissionSt(z).st, zWedgeSt(z).st, zCapacitySt(z).st]);
}
// A wedge within this window = "unstable now"; older wedges are historical
// context (shown as a count in the band), not a live alarm. Keeps a stale
// cluster of wedges from N hours ago reading as ongoing instability.
const RECENT_WEDGE_S = 3 * 3600;
// Fleet-level zenoh rollup — folds the router band into the TOP-OF-PAGE verdict
// + pill. Alarms (pill/verdict) fire only on the CURRENT state: wedged now, or a
// wedge within RECENT_WEDGE_S. wedges24h is the trailing-24h count (a rolling
// window, refreshed each report) carried for context, NOT an alarm by itself —
// a router that wedged repeatedly but has been stable for hours reads stable.
// Stale routers count as honest-unknown, never a fault.
function zenohRollup(now){
  const r = {wedgedNow:false, unhealthy:false, amber:false,
             wedges24h:0, lastWedgeAgoS:null, wedgedRecently:false, names:[]};
  Object.values(ZENOH||{}).forEach(doc=>{
    const name = (doc.zenoh&&doc.zenoh.router)||doc.router;
    const wd = (ZENOH_WEDGES||{})[name] || {};
    if(wd.currently_wedged){ r.wedgedNow=true; if(name) r.names.push(name); }
    if((wd.restarts_24h||0) > r.wedges24h) r.wedges24h = wd.restarts_24h||0;
    if(wd.last_wedge_ts){ const ago = now - wd.last_wedge_ts;
      if(r.lastWedgeAgoS===null || ago < r.lastWedgeAgoS) r.lastWedgeAgoS = ago; }
    if(zenohStale(doc, now)) return;
    const st = zenohStatus(doc, now);
    if(st==="red") r.unhealthy=true; else if(st==="amber") r.amber=true;
  });
  r.wedgedRecently = r.wedges24h>=3 && r.lastWedgeAgoS!==null && r.lastWedgeAgoS < RECENT_WEDGE_S;
  return r;
}
// Condensed band row (level 1): status + the wedge-relevant headline numbers +
// report age. open latency is THE seizure signal; CLOSE-WAIT is the leading
// indicator; fd is F-248. Click -> router page.
function zenohRow(doc, now){
  const z = doc.zenoh||{}, c = z.container||{}, a = z.admission||{}, w = z.wedge||{}, cap = z.capacity||{}, s = z.sessions||{};
  const stale = zenohStale(doc, now), age = zenohAge(doc, now);
  const st = zenohStatus(doc, now);
  const openTxt = a.open_ms==null ? "unmeasured" : (a.open_ok===false ? "FAILED" : ms(a.open_ms));
  const fdTxt = (cap.fd_used==null||cap.fd_cap==null) ? "—" : `${cnt(cap.fd_used)}/${cnt(cap.fd_cap)}`;
  const ageHtml = stale
    ? `<span class="hage bad" title="no report for ${ago(age)} — router bounced or the probe is down; values below are its LAST report">NOT REPORTING · last ${ago(age)} ago</span>`
    : `<span class="hage">reported ${ago(age)} ago</span>`;
  return `<div class="hostrow ${stale?'stale':''}" onclick="openZenoh('${esc(z.router||doc.router)}')" title="open ${esc(z.router||doc.router)} zenoh router detail">
    <span class="dot ${sdot(st)}"></span>
    <span class="name">${esc(z.router||doc.router)}</span>
    <span class="gnet">${esc(z.goatnet||"")}</span>
    <span class="hchip" title="container image variant — the F-253 accept-loop fix rides the pqc/pqc-fips images; a router on bare eclipse/zenoh still carries the wedge">${esc(c.variant||"?")}</span>
    <span class="hchip" title="container HEALTHCHECK verdict + uptime (RestartCount ${cnt(c.restart_count)})"><span class="sdot ${sdot(stale?'grey':zContainerSt(z).st)}"></span>${esc(c.health||"—")}${c.uptime_s!=null?` · up ${ago(c.uptime_s)}`:""}</span>
    <span class="hchip" title="a real mTLS NEW-SESSION open against the transport port — THE seizure signal (stalls toward the 10s open_timeout under the wedge while REST/established stay fine, F-253); 'unmeasured' = no probe cert deployed"><span class="sdot ${sdot(stale?'grey':zAdmissionSt(z).st)}"></span>open <b>${openTxt}</b></span>
    <span class="hchip" title="CLOSE-WAIT sockets in the router netns — 0 healthy, climbing is the wedge building ; ≥25 amber, ≥200 red"><span class="sdot ${sdot(stale?'grey':zWedgeSt(z).st)}"></span>close-wait <b>${cnt(w.close_wait)}</b></span>
    <span class="hchip" title="open file descriptors vs the nofile soft limit — F-248 was FD exhaustion; the rocksdb store set dominates the baseline"><span class="sdot ${sdot(stale?'grey':zCapacitySt(z).st)}"></span>fd <b>${fdTxt}</b></span>
    <span class="hchip" title="established sessions — TLS/TCP on :7447 (countable); QUIC on :7448 multiplexes one UDP socket (see the sessions card for TLS bytes vs QUIC datagrams)"><span class="sdot ${sdot(stale?'grey':zSessionsSt(z).st)}"></span>sessions <b>${cnt(s.estab)}</b> <span class="note">${s.tls_bps_tx!=null?bps(s.tls_bps_tx)+" tls":""}</span></span>
