menuentry "cable-reinstall" --id cable-reinstall {
    search --no-floppy --fs-uuid --set=root __BOOTUUID__
    linux /cable-installer/vmlinuz ip=dhcp url=http://10.77.0.1:8099/ubuntu.iso autoinstall "ds=nocloud-net;s=http://10.77.0.1:8099/nocloud/" modprobe.blacklist=cdc_ncm,cdc_ether,rndis_host ---
    initrd /cable-installer/initrd
}
