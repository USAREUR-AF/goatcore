# Publishes the wg-cp0 orchestrator binary (ops/enrollment/cmd/wg-cp0) on a tag
# wg-cp0/v<semver>, e.g. wg-cp0/v0.1.0.
#
# Assets, per release:
#   wg-cp0-<goos>-<goarch>[.exe]   linux, darwin and windows, amd64 and arm64;
#                                  CGO off, -trimpath, stripped
#   <asset>.sha256                 one per binary
#   SHA256SUMS                     every asset's digest
#   SHA256SUMS.cosign-bundle       a keyless cosign signature over SHA256SUMS,
#                                  made under this workflow's GitHub OIDC identity
#   <asset>.sigstore.json          one per binary: a keyless cosign signature
#                                  over that file, under the same identity
#   wg-cp0.intoto.jsonl            SLSA build provenance naming every binary by
#                                  digest, made by actions/attest-build-provenance
#
# The same shape as _release-binary.yml, which builds this repository's Rust
# binaries: a tag is built only when it is on main and was pushed by a
# repository admin, and the signature is verified the way a downloader checks
# it. wg-cp0 is a Go binary, so the build legs are Go cross-compiles on one
# runner rather than cargo on one runner per platform.
#
# Dry paths: workflow_dispatch builds and signs without publishing, and a pull
# request that edits this file builds every leg and writes SHA256SUMS (and signs
# it and each binary, and writes the provenance, when the branch is in this
# repository). Per-PR builds of the source itself
# are wg-cp0-accessor.yml's.

name: wg-cp0-release

on:
  push:
    tags:
      - 'wg-cp0/v*'
  pull_request:
    paths:
      - '.github/workflows/wg-cp0-release.yml'
      - '.github/release-notes/wg-cp0.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  nominator:
    name: the tag is on main and pushed by a repository admin
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'wg-cp0/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: The pusher holds the admin role
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          role=$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${GITHUB_ACTOR}/permission" --jq .role_name 2>/dev/null || echo unknown)
          echo "${GITHUB_ACTOR} holds role: ${role}"
          if [ "$role" != admin ]; then
            echo "::error::${GITHUB_ACTOR} holds the '${role}' role; only a repository admin cuts a release. Nothing is built for ${GITHUB_REF_NAME}."
            exit 1
          fi
      - name: The tagged commit is on main
        run: |
          set -euo pipefail
          git fetch -q origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not on main. Nothing is built."
            exit 1
          fi

  build:
    name: build ${{ matrix.goos }}-${{ matrix.goarch }}
    needs: [nominator]
    # A pull request or workflow_dispatch has no tag: nominator is skipped and the build runs.
    if: ${{ !cancelled() && (needs.nominator.result == 'success' || needs.nominator.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    defaults:
      run:
        working-directory: ops/enrollment
    env:
      CGO_ENABLED: "0"
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          # 'stable', as wg-cp0-accessor.yml: a pinned patch level goes stale
          # on standard-library security fixes.
          go-version: 'stable'
          cache-dependency-path: ops/enrollment/go.sum
      - name: go vet (this target's build tags)
        run: go vet ./cmd/wg-cp0/...
      - name: the test binary compiles for this target
        run: go test -c -o "$RUNNER_TEMP/wg-cp0.test" ./cmd/wg-cp0
      - name: Build and stage the asset and its .sha256
        env:
          EXT: ${{ matrix.goos == 'windows' && '.exe' || '' }}
        run: |
          set -euo pipefail
          out="wg-cp0-${GOOS}-${GOARCH}${EXT}"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          go build -trimpath -ldflags="-s -w" -o "$GITHUB_WORKSPACE/dist/$out" ./cmd/wg-cp0
          cd "$GITHUB_WORKSPACE/dist"
          sum=$(sha256sum "$out" | awk '{print $1}')
          echo "$sum  $out" > "$out.sha256"
          echo "- \`$out\` sha256 \`$sum\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wg-cp0-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  checksums:
    name: SHA256SUMS, signatures and provenance (cosign, keyless)
    needs: [build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      # The keyless signatures and the provenance are made under this job's OIDC identity.
      id-token: write
      # The provenance is also recorded in this repository's attestations.
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          pattern: wg-cp0-*
          merge-multiple: true
      - name: SHA256SUMS
        run: |
          set -euo pipefail
          cat artifacts/*.sha256 | sort -k 2 > SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 6
          (cd artifacts && sha256sum -c ../SHA256SUMS)
          { echo '```'; cat SHA256SUMS; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # A pull request from a fork gets no OIDC token, so it cannot sign.
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
      - name: Sign SHA256SUMS, then verify it the way a downloader does
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          set -euo pipefail
          cosign sign-blob --yes --bundle SHA256SUMS.cosign-bundle SHA256SUMS
          cosign verify-blob --bundle SHA256SUMS.cosign-bundle \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            SHA256SUMS
      - name: Sign each asset SHA256SUMS names, then verify each signature
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          set -euo pipefail
          # One keyless signature per binary or archive, written beside it as
          # <asset>.sigstore.json (the Sigstore bundle format). SHA256SUMS.cosign-bundle
          # above is unchanged, and stays the signature the update commands check.
          while read -r _ asset <&3; do
            cosign sign-blob --yes --new-bundle-format --bundle "$asset.sigstore.json" "artifacts/$asset"
            cosign verify-blob --new-bundle-format --bundle "$asset.sigstore.json" \
              --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "artifacts/$asset"
            test -s "$asset.sigstore.json"
          done 3< SHA256SUMS
      - name: SLSA build provenance for every asset SHA256SUMS names
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: SHA256SUMS
      - name: Stage the provenance as wg-cp0.intoto.jsonl, then verify it for each asset
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          OUT: wg-cp0.intoto.jsonl
        run: |
          set -euo pipefail
          test -s "$BUNDLE"
          cp "$BUNDLE" "$OUT"
          while read -r _ asset <&3; do
            gh attestation verify "artifacts/$asset" --bundle "$OUT" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/wg-cp0-release.yml"
          done 3< SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wg-cp0-checksums
          path: |
            SHA256SUMS
            SHA256SUMS.cosign-bundle
            *.sigstore.json
            *.intoto.jsonl
          if-no-files-found: ignore
          retention-days: 30

  release:
    name: attach the assets to the release
    needs: [build, checksums]
    if: ${{ !cancelled() && github.ref_type == 'tag' && startsWith(github.ref_name, 'wg-cp0/v') && needs.checksums.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-assets
          merge-multiple: true
      - name: Every asset, its digest and the signature are present
        run: |
          set -euo pipefail
          ls -la release-assets/
          test -s release-assets/SHA256SUMS.cosign-bundle
          (cd release-assets && sha256sum -c SHA256SUMS)
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ github.ref_name }}
          files: release-assets/*
          body_path: .github/release-notes/wg-cp0.md
          generate_release_notes: true
          fail_on_unmatched_files: true
