name: consistency-console-image
# Builds ops/consistency/Dockerfile.console — the CF-6 consistency console
# (Rust + axum + eclipse-zenoh + prost) — and publishes to
# ghcr.io/<owner>/goat-consistency-console.
#
# Per docs/design/consistency-foundation.md §7 + ADR 1110 D5: a stateless,
# mesh-internal, admin-gated projection of the consistency rollup. It
# subscribes ops/consistency/health/** + report/**, verifies the committed
# IntentV1 at every render, renders grades + verbatim remediation pointers,
# and stores/executes nothing. Observation, never enforcement.
#
# The `test` job is the same ADR 1110 D2 gate the meter's workflow runs: the
# whole workspace, including the shared golden corpus in both crates and the
# console's own live-fire (a real rollup envelope over a loopback two-peer
# zenoh wire rendered into ZAGROS's grid). What that does NOT prove: mTLS to a
# real router, the router ACL, the oauth2 fence — those
# await a deploy decision.
#
# BUILD CONTEXT IS ops/consistency/ (not the crate dir) because the library
# compiles ops/consistency/grammar.yaml in; the Dockerfile mirrors the repo
# layout so the relative include path means the same thing in both places.
#
# Per-arch native build + manifest combine, mirroring
# consistency-health-image.yml:
#   - linux/amd64 on ubuntu-24.04
#   - linux/arm64 on ubuntu-24.04-arm (GitHub-hosted arm64 runner)
#
# Tag scheme:
#   - On main push:                      :latest + :sha-<short>
#   - On consistency-console/v* tag:     :<tag-name>
#   - On any build:                      :sha-<short>

#
# DELIBERATELY NOT TRIGGERED BY ops/consistency/intent/**. Those files
# are GENERATED by ops/pins/generate-pins.py on every pin bump for EVERY
# component, and they are runtime data, not build input: .dockerignore excludes
# intent/ from the build context outright, on the stated grounds that "an image
# carrying one goatnet's intent would be a per-goatnet image". The deployed
# meter reads them from a mounted path the ansible role places. Triggering on
# them rebuilt two multi-arch images ~140 times a month and gated the pin PR
# that caused it. grammar.yaml and testdata/ DO belong above — grammar.yaml is
# compiled in, and testdata/ is read by the cargo-test job in this workflow.
#
# Build body: .github/workflows/_image-build.yml (shared).

on:
  push:
    branches: [main]
    paths:
      - 'ops/consistency/rust/**'
      - 'ops/consistency/grammar.yaml'
      - 'ops/consistency/testdata/**'
      - 'ops/consistency/Dockerfile.console'
      - '.github/workflows/consistency-console-image.yml'
    tags: ['consistency-console/v*']
  pull_request:
    paths:
      - 'ops/consistency/rust/**'
      - 'ops/consistency/grammar.yaml'
      - 'ops/consistency/testdata/**'
      - 'ops/consistency/Dockerfile.console'
      - '.github/workflows/consistency-console-image.yml'
  workflow_dispatch:

# Supersede in-flight runs for the same ref. A push during review used to
# leave the previous run going to completion, so a branch pushed three
# times paid three times for an answer only the last one needed. Keyed on
# the workflow plus the ref, and NEVER cancels on main — a merge-commit run
# is the one whose result is recorded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: cargo test — grading library, shared golden corpus, meter and console
        working-directory: ops/consistency/rust
        run: cargo test --locked --workspace
      - name: cargo clippy
        working-directory: ops/consistency/rust
        run: cargo clippy --locked --all-targets -- -D warnings

  image:
    needs: ["test"]
    uses: ./.github/workflows/_image-build.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      image_name: goat-consistency-console
      tag_prefix: consistency-console
      context: ops/consistency
      file: ops/consistency/Dockerfile.console
      description: "CF-6 consistency console \u2014 stateless projection of the consistency rollup (consistency-foundation.md \u00a77 / ADR 1110 D5)"
