name: netbird-mgmt

# Builds ops/netbird/Dockerfile — upstream Netbird management binary with the
# skip-migrations.patch applied — and publishes to
# ghcr.io/usareur-af/netbird-mgmt. Tag format matches the image IDs
# ops/ansible/coordinated-upgrade.yml expects (patched-<ref>).
#
# Per-arch native build + manifest combine.
#   - linux/amd64 on ubuntu-24.04
#   - linux/arm64 on ubuntu-24.04-arm  (GitHub-hosted arm64 runner)
#
# Why native per-arch (not buildx cross-compile)?
# CGO=1 is mandatory (netbirdio/dex fork's SQLite bindings). Cross-compiling
# CGO from amd64 to arm64 requires installing cross-gcc and fiddling with
# sysroots; running native on each arch is simpler and matches upstream's
# own build pattern. Final step `docker buildx imagetools create` merges
# the two single-arch images into one multi-arch tag.
#
# Pattern: https://docs.docker.com/build/ci/github-actions/multi-platform/
#
# NETBIRD_REF: defaults to the commit SHA the skip-migrations patch is
# rebased against (see ops/netbird/Dockerfile). When upstream Netbird ships
# a tag containing that commit, bump the Dockerfile default and the input
# default below.

on:
  push:
    branches: [main]
    paths:
      - 'ops/netbird/**'
      - 'ops/mgmt-host-bootstrap/**'
      - '.github/workflows/netbird-mgmt.yml'
    tags: ['netbird-mgmt/v*']
  pull_request:
    paths:
      - 'ops/netbird/**'
      - 'ops/mgmt-host-bootstrap/**'
      - '.github/workflows/netbird-mgmt.yml'
  workflow_dispatch:
    inputs:
      netbird_ref:
        description: 'Netbird git ref to build: tag, branch, or commit SHA'
        required: true
        # Keep in sync with ops/netbird/Dockerfile ARG NETBIRD_REF default.
        default: '0358be23136da50e829ba99a83e54ef555071a7f'  # upstream v0.71.4

# REGISTRY_IMAGE is NOT a workflow-level `env:` literal: ghcr requires a
# lowercase namespace and the usareur-af org owner is mixed-case, and workflow
# expressions have no lowercasing function. Each publishing job resolves it
# self-referentially in bash instead (see the "Resolve self-referential
# registry namespace" steps), so goat-maintainer CI publishes to ghcr.io/goat-maintainer and
# usareur-af CI to ghcr.io/usareur-af. A hardcoded org 403s silently on main
# under the other owner — the class that stalled signal-server image builds.

# Supersede in-flight runs for the same ref. A push during review used to
# leave the previous run going to completion, so a branch pushed three
# times paid three times for an answer only the last one needed. Keyed on
# the workflow plus the ref, and NEVER cancels on main — a merge-commit run
# is the one whose result is recorded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      ref: ${{ steps.ver.outputs.ref }}
      patch_tag: ${{ steps.ver.outputs.patch_tag }}
    steps:
      - name: Resolve Netbird ref
        id: ver
        run: |
          R="${{ github.event.inputs.netbird_ref }}"
          # Keep fallback in sync with ops/netbird/Dockerfile ARG NETBIRD_REF
          # default. `push` events don't supply github.event.inputs.netbird_ref,
          # so this fallback is what the workflow actually builds against on
          # most fires.
          if [ -z "$R" ]; then R=0358be23136da50e829ba99a83e54ef555071a7f; fi  # upstream v0.71.4
          if [ "${#R}" = 40 ]; then
            SHORT="${R:0:7}"
          else
            SHORT="$R"
          fi
          echo "ref=$R"                     >> "$GITHUB_OUTPUT"
          echo "patch_tag=patched-$SHORT"   >> "$GITHUB_OUTPUT"

  # One build per architecture, written to a file and never pushed here. The
  # integration job tests the amd64 file's image; the publish job pushes the
  # files' images only after it passes, and checks each pushed image's config
  # digest (its image ID) against the one recorded here, so the tested image
  # and the pushed one are the same image.
  build:
    needs: resolve
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-24.04
          - arch: arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read  # apt-failover pulls its cache image
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/apt-failover

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build (${{ matrix.arch }}) to a file
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ops/netbird
          platforms: linux/${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            NETBIRD_REF=${{ needs.resolve.outputs.ref }}
          cache-from: type=gha,scope=netbird-mgmt-${{ matrix.arch }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=gha,mode=max,scope=netbird-mgmt-{0},ignore-error=true', matrix.arch) || '' }}
          outputs: type=docker,dest=/tmp/image/netbird-mgmt-${{ matrix.arch }}.tar

      - name: Record the image ID (config digest)
        env:
          IMAGE_ID: ${{ steps.build.outputs.imageid }}
        run: |
          case "$IMAGE_ID" in sha256:*) ;; *) echo "::error::no image ID from the build"; exit 1 ;; esac
          echo "$IMAGE_ID" > /tmp/image/netbird-mgmt-${{ matrix.arch }}.id
          echo "built ${{ matrix.arch }}: $IMAGE_ID" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the image file
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-${{ matrix.arch }}
          path: /tmp/image/*
          if-no-files-found: error
          retention-days: 1

  # The fleet image's service-user command (ADR 1274) against the amd64 image
  # the build job wrote: Postgres, signal and that image, an account, the
  # bootstrap identity minted and switched on with the read-back value, checked
  # through the REST API, rotated, minted again to show a re-run makes nothing,
  # and every output and the container log searched for the token. Then the
  # command's own tests on the patched tree against Postgres (the image build
  # runs them on SQLite), where the row locks they test take effect.
  service-user-integration:
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download the amd64 image file
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: image-amd64
          path: /tmp/image

      - name: Load it and check it is the image the build recorded
        run: |
          want="$(cat /tmp/image/netbird-mgmt-amd64.id)"
          docker load -i /tmp/image/netbird-mgmt-amd64.tar
          got="$(docker image inspect --format '{{.Id}}' "$want")"
          [ "$got" = "$want" ] || { echo "::error::loaded $got, the build recorded $want"; exit 1; }
          docker tag "$want" goat-ci/netbird-mgmt:under-test
          echo "tested amd64: $want" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.11'
          cache-dependency-path: ops/mgmt-host-bootstrap/go.sum

      - name: The service-user command against the built image
        working-directory: ops/mgmt-host-bootstrap
        env:
          MGMT_BOOTSTRAP_MANAGEMENT_IMAGE: goat-ci/netbird-mgmt:under-test
          MGMT_BOOTSTRAP_REQUIRE_SERVICE_USER: '1'
          # No geolocation seed in this job; enrolment is not what it grades.
          MGMT_BOOTSTRAP_DISABLE_GEOLOCATION: 'true'
        run: go test -tags integration -count=1 -v -run '^TestEndToEnd_FleetServiceUserBootstrap$' -timeout 20m ./...

      - name: The command's own tests on the patched tree, against Postgres
        env:
          NETBIRD_REF: ${{ needs.resolve.outputs.ref }}
          NETBIRD_STORE_ENGINE: postgres
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/netbird" && cd "$RUNNER_TEMP/netbird"
          git init -q . && git fetch -q --depth 1 https://github.com/netbirdio/netbird.git "$NETBIRD_REF" && git checkout -q FETCH_HEAD
          for p in skip-migrations auto-peer-name peer-id-bound-relay-tokens setupkey-user-id-stamp \
                   client-signal-backoff-jitter client-offer-circuit-breaker service-user-token-bootstrap; do
            git apply "$GITHUB_WORKSPACE/ops/netbird/patches/$p.patch"
          done
          CGO_ENABLED=1 go test -count=1 -run '^TestServiceUser' ./management/cmd/

  publish:
    needs: [resolve, build, service-user-integration]
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: true
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Resolve self-referential registry namespace (lowercased)
        run: echo "REGISTRY_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/netbird-mgmt" >> "$GITHUB_ENV"

      - name: Download the ${{ matrix.arch }} image file
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: image-${{ matrix.arch }}
          path: /tmp/image

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the recorded image, and check what was pushed
        env:
          ARCH: ${{ matrix.arch }}
          SHORT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          want="$(cat /tmp/image/netbird-mgmt-$ARCH.id)"
          docker load -i /tmp/image/netbird-mgmt-$ARCH.tar
          tag="$REGISTRY_IMAGE:sha-${SHORT_SHA:0:7}-$ARCH"
          docker tag "$want" "$tag"
          docker push "$tag"
          repo_digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$tag")"
          raw="$(docker buildx imagetools inspect --raw "$repo_digest")"
          pushed_config="$(jq -r '.config.digest // empty' <<< "$raw")"
          if [ -z "$pushed_config" ]; then
            # An index (the containerd image store pushes one): its image
            # manifest for this architecture holds the config.
            m="$(jq -r --arg a "$ARCH" '[.manifests[] | select(.platform.architecture == $a)][0].digest' <<< "$raw")"
            pushed_config="$(docker buildx imagetools inspect --raw "${repo_digest%@*}@$m" | jq -r '.config.digest')"
          fi
          [ "$pushed_config" = "$want" ] || { echo "::error::pushed config $pushed_config, built and tested $want"; exit 1; }
          echo "pushed $ARCH: $repo_digest (config $pushed_config)" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p /tmp/digests && touch "/tmp/digests/${repo_digest##*@sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error

  merge:
    needs: [resolve, publish]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Resolve self-referential registry namespace (lowercased)
        run: echo "REGISTRY_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/netbird-mgmt" >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=${{ needs.resolve.outputs.patch_tag }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,prefix=sha-
            type=match,pattern=netbird-mgmt/v(.*),group=1,prefix=patched-v

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        env:
          # Pass JSON via env var — direct ${{ }} interpolation of multi-line
          # JSON into the bash script body corrupts it (embedded quotes break
          # the heredoc), and jq parses `Invalid literal at line 1, column 6`.
          META_JSON: ${{ steps.meta.outputs.json }}
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$META_JSON") \
            $(printf "${{ env.REGISTRY_IMAGE }}@sha256:%s " *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:${{ needs.resolve.outputs.patch_tag }}
