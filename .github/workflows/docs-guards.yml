name: docs-guards

# One job for the document-shape guards over docs/. Previously these were
# five workflows (adr-number-uniqueness, adr-status-vs-code, doc-links,
# doc-code-citations, guide-example-names): five runner starts on overlapping
# `docs/**` filters for one job's worth of work, and four separate parsers of
# docs/adr/INDEX.md. Coverage is unchanged; the path filter is the union.
#
# Kept out on purpose: mermaid-renders.yml drives a headless browser and stays
# its own workflow; circulated-docs.yml renders PDFs and does the same.

on:
  pull_request:
    paths:
      - '.github/workflows/docs-guards.yml'
      - 'docs/**'
      - 'crates/goat-cli/**'
      - 'crates/panoscope-core/src/**'
      - 'ops/ansible/group_vars/*/pins.yml'
      - 'ops/ansible/roles/**'
      - 'ops/ci/**'
      - 'ops/release/adr_index.py'
      - 'ops/goat-id-console/**'
      - 'ops/goat-zenoh-portal/**'
      - 'ops/onboard-runner/**'
      - 'ops/fieldkit/**'
      - 'README.md'
      - '.github/release-notes/**'
      - 'ops/postgres/spock/README.md'
      - 'ops/postgres/spock/conf/postgresql.conf'
      - 'ops/compose/mgmt-host/monitoring/**'
      - 'crates/goatbuilder/CHANGELOG.md'
      - 'crates/goatbuilder/changelog.d/**'
      - 'crates/goatbuilder/tests/fixtures/full-plans.golden.json'
      - 'ops/release/changelog.py'
      - '.github/workflows/_release-binary.yml'
      - '.github/workflows/*-release.yml'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The whole history and the tags: the changelog checks below compare with a
          # merge base and with each goatbuilder release (ops/release/changelog.py).
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5

      # A single GraphQL request compares newly claimed ADR/finding IDs across
      # open PRs. Confirmed collisions fail; API or pagination gaps warn open.
      - name: Cross-PR ADR and finding IDs are unique
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 ops/ci/test-cross-pr-id-uniqueness.py
          python3 ops/ci/check-cross-pr-id-uniqueness.py

      # ADR register — one number, one ADR; every ADR indexed; index agrees; ADR-0002 vocabulary
      - name: ADR numbers are unique
        run: ops/ci/check-adr-number-uniqueness.sh
      - name: every ADR has an index row
        run: ops/ci/check-adr-index-complete.sh
      - name: index status agrees with each ADR
        run: ops/ci/check-adr-index-status-agrees.sh
      - name: the index rows of ADRs above 1234 equal their render from the ADR files
        run: |
          python3 ops/release/adr_index.py --self-test
          python3 ops/release/adr_index.py check
      - name: status-vocabulary guard self-test
        run: python3 ops/ci/check-adr-status-vocabulary.py --self-test
      - name: every status leads with an ADR-0002 token
        run: python3 ops/ci/check-adr-status-vocabulary.py docs/adr
      - name: self-test — guard proves RED on a planted under-claiming ADR
        run: ops/ci/check-adr-status-vs-code.sh --self-test
      - name: no ADR under-claims code that exists in the tree
        run: ops/ci/check-adr-status-vs-code.sh

      # Links and citations
      # Fieldkit scope guard (docs/design/fieldkit-and-bleating-edge.md §3): a Fieldkit tool
      # declares no action without an allowed goat CLI verb, and every allowed verb exists in
      # the CLI. The CLI's command tree is read from docs/goat-cli-book/src/reference.md, the
      # committed `goat docs --markdown`; goat-cli's own test
      # (the_book_reference_is_in_sync_with_the_command_tree) fails when it differs from the
      # clap tree, so a renamed or removed `goat pod` verb fails one check or the other.
      - name: Fieldkit scope guard self-test
        run: python3 ops/ci/check-fieldkit-scope.py --self-test
      - name: every Fieldkit action equals an allowed goat command the CLI defines
        run: python3 ops/ci/check-fieldkit-scope.py --docs docs/goat-cli-book/src/reference.md
      - name: relative .md links resolve
        run: python3 ops/ci/check-doc-links.py
      - name: every `path:line` citation is within its file
        run: ./ops/ci/check-doc-code-citations.sh

      # The by-hand signature check in the documents: its cosign identity is the
      # one the release workflows sign with (read from .github/workflows).
      - name: every documented cosign identity is a release signer's
        run: |
          pip install --quiet pyyaml
          python3 ops/ci/check-doc-signer-identity.py --self-test
          python3 ops/ci/check-doc-signer-identity.py

      # A pull request that records the full standup plans on a base older than a change
      # to what they are made from turns main red once merged (14 Nov); it is rebased and
      # the record regenerated. HEAD is GitHub's merge: base first, the head second.
      - name: a pull request that changes the full-plans record is on a base holding what it records
        run: |
          python3 ops/ci/test_check_golden_base_current.py
          python3 ops/ci/check-golden-base-current.py --base HEAD^1 --head HEAD^2

      # The Unreleased section is one pointer line, never a render: a committed render made
      # every merge conflict with every other open pull request that adds an entry. The
      # render goes into the run's summary instead.
      - name: goatbuilder's changelog entries are well formed and its Unreleased section is the pointer line
        run: |
          python3 ops/release/changelog.py --self-test
          python3 ops/release/changelog.py check
          python3 ops/release/changelog.py show >> "$GITHUB_STEP_SUMMARY"

      # A pull request that changes goatbuilder's CHANGELOG.md (a release, release notes) on a
      # base older than a release would mix the two; it is rebased first. Entry files alone
      # merge at any base. HEAD is the merge
      # GitHub made: its first parent is the base, its second the pull request's head.
      - name: a pull request that changes goatbuilder's CHANGELOG.md is on a base holding every release
        run: |
          python3 ops/ci/test_check_changelog_base_current.py
          python3 ops/ci/check-changelog-base-current.py --base HEAD^1 --head HEAD^2

      # Not here: the skill-audience guard (ADR 1174) runs where the
      # .claude/skills tree lives, and the roster-handle guard reads a roster
      # of real people that this repository does not carry; the leak gate
      # (leak-gate.yml) refuses names in this tree instead.
