name: simple-bn and door-admit unit tests

# The simple boundary node's encoder and the admit door's decision, rule expansion
# and proxy (ADR 1253, ADR 1254). Standard-library tests; the rule expansion needs PyYAML.
on:
  pull_request:
    paths:
      - 'ops/simple-bn/**'
      - 'ops/door-admit/**'
      - '.github/workflows/boundary-and-door.yml'
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  unit:
    name: simple-bn and door-admit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: simple-bn encoder
        run: python3 -W error::ResourceWarning -m unittest discover -s ops/simple-bn/tests -v
      - name: door-admit decision, rule expansion and proxy
        run: |
          python3 -c "import yaml" || pip install --no-cache-dir pyyaml==6.0.2
          python3 -m unittest discover -s ops/door-admit/tests -v
