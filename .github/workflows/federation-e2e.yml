name: federation-e2e

# Rung 9, end to end (docs/operations/sovereign-federation-runbook.md,
# ops/federation-e2e/README.md).
#
# Two sovereigns with separate CAs, generated fresh, run the REAL driver without
# --dry-run on container hosts: the real `goat federate` verbs, the real plays, a real
# WireGuard link, real pinned zenohd routers and real spire-servers. The terminal gate is
# the real acceptance.sh from both sides, and the proof is read back from the receiving
# side. Twice, with the listener and the first mover swapped, once per avenue (ADR 1201).
#
# A hermetic run with no real counterparty and no goatnet, FIPS-waived. No GitHub runner
# reaches a goatnet (ops/validation/goatnet-runners.yaml), and this one reaches none.
on:
  pull_request:
    paths:
      - 'ops/federation-e2e/**'
      - 'ops/ci/check-federation-e2e-harness.sh'
      - 'ops/e2e/report.py'
      - 'ops/federation/standup/**'
      - 'ops/federation/roundtrip/**'
      - 'ops/federation/republisher/**'
      - 'ops/scripts/peering-standup.sh'
      - 'ops/goatbuilder/parity-federate.sh'
      - 'ops/ansible/roles/goat-peering-wg/**'
      - 'ops/ansible/roles/goat-peering-spire/**'
      - 'ops/ansible/roles/goat-zenoh-edge/**'
      - 'ops/ansible/roles/goat-fed-republisher/**'
      - 'ops/ansible/roles/goat-zenoh/templates/config.json5.j2'
      - 'ops/ansible/roles/spire/templates/server.conf.j2'
      - 'ops/ansible/tasks/peering-applied-vars.yml'
      - 'ops/ansible/peering-*.yml'
      - 'crates/goatbuilder/src/federate/**'
      - 'crates/goatbuilder/src/main.rs'
      - 'crates/goat-federation/**'
      - 'crates/goat-cli/src/cmd/federate.rs'
      - 'ops/ci/check-federation-e2e-prepare.sh'
      - '.github/workflows/federation-e2e.yml'
  schedule:
    - cron: '37 4 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # Rule 2 of docs/design/ci-results-follow-inputs.md: the stages keep their results. The build
  # makes the two binaries and both images once; each scenario is a job that takes them, side by
  # side; "re-run failed jobs" repeats only a scenario that failed. The required check is the
  # last job, under its unchanged name, and passes only when the build and every scenario did.
  build:
    name: "two sovereigns: build (goat, goatbuilder, the host and republisher images)"
    runs-on: ubuntu-24.04
    # packages: read, so the apt failover step can pull the cache image from ghcr.io.
    permissions:
      contents: read
      packages: read
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Our own package cache, only when the runner's Ubuntu mirror does not answer
      # (docs/design/ci-apt-failover.md): the runner's apt and the host image build use it.
      - uses: ./.github/actions/apt-failover
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      # The compiler ci.yml's rust job pins (ADR 0707), so the binaries proved here are built
      # by the same one.
      - name: Install Rust toolchain (1.95.0, pinned)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: '1.95.0'
      - name: Cache cargo registry + build target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/target
          key: federation-e2e-cargo-${{ runner.os }}-1.95.0-${{ hashFiles('crates/Cargo.lock') }}
      # The hosts carry every package a scenario needs in their image. The runner needs the
      # harness's Python packages, pinned with hashes, the kernel's wireguard module, and jq
      # and pkg-config, which its image already has. A declared input that cannot be reached
      # exits 69 with "environment:", never as a failure of the change.
      - name: The harness's Python packages (pinned, hashed)
        timeout-minutes: 5
        run: |
          set -o pipefail
          if python3 -m pip install --quiet --require-hashes --no-deps -r ops/federation-e2e/requirements.lock 2>&1 | tee "$RUNNER_TEMP/pip.log"; then exit 0; fi
          # Only an unreachable PyPI is environment; a hash mismatch, a missing pin or a bad
          # Python is a defect of the change.
          if grep -qE 'NewConnectionError|Temporary failure in name resolution|Read timed out|Max retries exceeded|Failed to establish a new connection' "$RUNNER_TEMP/pip.log"; then
            echo "::error::environment: PyPI did not answer for ops/federation-e2e/requirements.lock (a declared input)"; exit 69
          fi
          echo "::error::the harness's Python packages did not install from ops/federation-e2e/requirements.lock"; exit 1
      # jq and pkg-config are on the runner image; only a missing one is installed. A declared
      # input: the runner's mirror, with retries and a fallback to archive.ubuntu.com and
      # security.ubuntu.com (ops/ci/apt-install-fallback.sh); still failing exits 69.
      - name: "The runner's tools (declared input: the Ubuntu mirror, only for what is missing)"
        timeout-minutes: 15
        run: ops/ci/apt-install-fallback.sh jq pkg-config
      # The environment's catalog and verdict rules, no Docker (ops/federation-e2e/tests).
      - name: The e2e environment's harness checks
        run: ops/ci/check-federation-e2e-harness.sh
      # Release, because a debug build reads its embedded message catalogs from the
      # source tree at run time, and these binaries run on hosts that have no such path.
      - name: Build goat and goatbuilder
        working-directory: crates
        run: cargo build --release --locked -p goat-cli -p goatbuilder
      # The runner on a checkout shaped like the public one (no group_vars pins.yml, no
      # goatbuilder.yaml, no goatnet in fleet-pins.yaml): it prepares both sovereigns
      # from files every checkout carries (docs/tutorials/04-two-sovereigns.md).
      - name: The runner prepares from a public-shaped checkout
        timeout-minutes: 10
        run: ops/ci/check-federation-e2e-prepare.sh crates/target/release/goatbuilder
      - name: The host and republisher images
        timeout-minutes: 25
        run: ops/federation-e2e/run.sh --images-only "$RUNNER_TEMP/build/images"
      - name: The build, gathered for the scenario stages
        run: |
          mkdir -p "$RUNNER_TEMP/build/bin"
          cp crates/target/release/goat crates/target/release/goatbuilder "$RUNNER_TEMP/build/bin/"
      - name: Upload the build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: federation-e2e-build
          path: ${{ runner.temp }}/build
          retention-days: 3
      # The binaries alone, for the last job to publish once every scenario has passed.
      - name: Upload the binaries alone
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: federation-e2e-bin
          path: ${{ runner.temp }}/build/bin
          retention-days: 3

  scenario:
    name: "two sovereigns: scenario ${{ matrix.scenario }}"
    needs: build
    runs-on: ubuntu-24.04
    # packages: read, so the apt failover step can pull the cache image from ghcr.io.
    permissions:
      contents: read
      packages: read
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        # 1 goatbuilder, pasture first; 2 the script avenue, meadow first; 3 three parties on
        # one edge and one core; 4 nothing-hand-written, strict (ops/federation-e2e/run.sh).
        scenario: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Our own package cache, only when the runner's Ubuntu mirror does not answer
      # (docs/design/ci-apt-failover.md): the runner's apt and the host image build use it.
      - uses: ./.github/actions/apt-failover
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      # The hosts carry every package a scenario needs in their image. The runner needs the
      # harness's Python packages, pinned with hashes, the kernel's wireguard module, and jq
      # and pkg-config, which its image already has. A declared input that cannot be reached
      # exits 69 with "environment:", never as a failure of the change.
      - name: The harness's Python packages (pinned, hashed)
        timeout-minutes: 5
        run: |
          set -o pipefail
          if python3 -m pip install --quiet --require-hashes --no-deps -r ops/federation-e2e/requirements.lock 2>&1 | tee "$RUNNER_TEMP/pip.log"; then exit 0; fi
          # Only an unreachable PyPI is environment; a hash mismatch, a missing pin or a bad
          # Python is a defect of the change.
          if grep -qE 'NewConnectionError|Temporary failure in name resolution|Read timed out|Max retries exceeded|Failed to establish a new connection' "$RUNNER_TEMP/pip.log"; then
            echo "::error::environment: PyPI did not answer for ops/federation-e2e/requirements.lock (a declared input)"; exit 69
          fi
          echo "::error::the harness's Python packages did not install from ops/federation-e2e/requirements.lock"; exit 1
      # jq and pkg-config are on the runner image; only a missing one is installed. A declared
      # input: the runner's mirror, with retries and a fallback to archive.ubuntu.com and
      # security.ubuntu.com (ops/ci/apt-install-fallback.sh); still failing exits 69.
      - name: "The runner's tools (declared input: the Ubuntu mirror, only for what is missing)"
        timeout-minutes: 15
        run: ops/ci/apt-install-fallback.sh jq pkg-config
      # The runner kernel's own module first. Only when it lacks one is the kernel's modules
      # package fetched, through the same fallback.
      - name: "The wireguard kernel module (declared input: linux-modules-extra when the kernel lacks it)"
        timeout-minutes: 15
        run: |
          if sudo modprobe wireguard 2>/dev/null && grep -q '^wireguard ' /proc/modules; then exit 0; fi
          echo "the runner kernel $(uname -r) has no loadable wireguard module; fetching linux-modules-extra-$(uname -r)"
          ops/ci/apt-install-fallback.sh "linux-modules-extra-$(uname -r)" || exit $?
          sudo modprobe wireguard && grep -q '^wireguard ' /proc/modules \
            || { echo "::error::the wireguard module did not load from linux-modules-extra-$(uname -r)"; exit 1; }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: federation-e2e-build
          path: ${{ runner.temp }}/build
      - name: The build's binaries are executable again (artifacts keep no mode)
        run: chmod +x "$RUNNER_TEMP/build/bin/goat" "$RUNNER_TEMP/build/bin/goatbuilder"
      - name: Scenario ${{ matrix.scenario }}
        timeout-minutes: 65
        run: >-
          ops/federation-e2e/run.sh --scenario ${{ matrix.scenario }} --images "$RUNNER_TEMP/build/images"
          --goat "$RUNNER_TEMP/build/bin/goat" --goatbuilder "$RUNNER_TEMP/build/bin/goatbuilder"
          --record "$RUNNER_TEMP/federation-report"
      - name: The acceptance counts
        if: always()
        run: cat "$RUNNER_TEMP/federation-report/acceptance-counts.txt" || true
      - name: Upload the run record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: federation-e2e-report-scenario-${{ matrix.scenario }}
          path: ${{ runner.temp }}/federation-report
          retention-days: 14

  federation:
    # The required check, under its name: it passes only when the build and all four scenarios
    # passed, so branch protection does not change.
    name: two sovereigns through the real driver, proved from the receiving side
    needs: [build, scenario]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Every stage passed
        env:
          BUILD: ${{ needs.build.result }}
          SCENARIOS: ${{ needs.scenario.result }}
        run: |
          echo "build: $BUILD; scenarios: $SCENARIOS"
          [ "$BUILD" = success ] && [ "$SCENARIOS" = success ] \
            || { echo "::error::a stage did not pass (build $BUILD, scenarios $SCENARIOS)"; exit 1; }
      # The binaries this run proved, for ops/federation-e2e/live.sh on real hosts: the
      # live run then ships the commit CI measured, not a build of its own.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: federation-e2e-bin
          path: ${{ runner.temp }}/bin
      - name: Upload the binaries this run proved
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: federation-live-binaries
          path: |
            ${{ runner.temp }}/bin/goat
            ${{ runner.temp }}/bin/goatbuilder
          retention-days: 14
