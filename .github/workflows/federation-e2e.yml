name: federation-e2e

# Rung 9, end to end (docs/operations/sovereign-federation-runbook.md,
# ops/federation-e2e/README.md).
#
# Two sovereigns with separate CAs, generated fresh, run the REAL driver without
# --dry-run on container hosts: the real `goat federate` verbs, the real plays, a real
# WireGuard link, real pinned zenohd routers and real spire-servers. The terminal gate is
# the real acceptance.sh from both sides, and the proof is read back from the receiving
# side. Twice, with the listener and the first mover swapped, once per avenue (ADR 1201).
#
# A hermetic run with no real counterparty and no goatnet, FIPS-waived. No GitHub runner
# reaches a goatnet (ops/validation/goatnet-runners.yaml), and this one reaches none.
on:
  pull_request:
    paths:
      - 'ops/federation-e2e/**'
      - 'ops/ci/check-federation-e2e-harness.sh'
      - 'ops/e2e/report.py'
      - 'ops/federation/standup/**'
      - 'ops/federation/roundtrip/**'
      - 'ops/federation/republisher/**'
      - 'ops/scripts/peering-standup.sh'
      - 'ops/goatbuilder/parity-federate.sh'
      - 'ops/ansible/roles/goat-peering-wg/**'
      - 'ops/ansible/roles/goat-peering-spire/**'
      - 'ops/ansible/roles/goat-zenoh-edge/**'
      - 'ops/ansible/roles/goat-fed-republisher/**'
      - 'ops/ansible/roles/goat-zenoh/templates/config.json5.j2'
      - 'ops/ansible/roles/spire/templates/server.conf.j2'
      - 'ops/ansible/tasks/peering-applied-vars.yml'
      - 'ops/ansible/peering-*.yml'
      - 'crates/goatbuilder/src/federate/**'
      - 'crates/goatbuilder/src/main.rs'
      - 'crates/goat-federation/**'
      - 'crates/goat-cli/src/cmd/federate.rs'
      - 'ops/ci/check-federation-e2e-prepare.sh'
      - '.github/workflows/federation-e2e.yml'
  schedule:
    - cron: '37 4 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  federation:
    name: two sovereigns through the real driver, proved from the receiving side
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install Rust toolchain (1.99.1, pinned)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.99.1'
      - name: Cache cargo registry + build target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/target
          key: federation-e2e-cargo-${{ runner.os }}-1.99.1-${{ hashFiles('crates/Cargo.lock') }}
      # No distribution mirror during the job. The runner needs only the harness's Python
      # packages, pinned with hashes, and the kernel's own wireguard module; the hosts carry
      # every package a scenario needs in their image. A declared input that cannot be
      # reached exits 69 with "environment:", never as a failure of the change.
      - name: The harness's Python packages (pinned, hashed)
        timeout-minutes: 5
        run: |
          python3 -m pip install --quiet --require-hashes --no-deps -r ops/federation-e2e/requirements.lock \
            || { echo "::error::environment: PyPI did not provide ops/federation-e2e/requirements.lock (a declared input)"; exit 69; }
      - name: The wireguard kernel module
        run: |
          sudo modprobe wireguard && grep -q '^wireguard ' /proc/modules \
            || { echo "::error::environment: the runner's kernel $(uname -r) has no wireguard module"; exit 69; }
      # The environment's catalog and verdict rules, no Docker (ops/federation-e2e/tests).
      - name: The e2e environment's harness checks
        run: ops/ci/check-federation-e2e-harness.sh
      # Release, because a debug build reads its embedded message catalogs from the
      # source tree at run time, and these binaries run on hosts that have no such path.
      - name: Build goat and goatbuilder
        working-directory: crates
        run: cargo build --release --locked -p goat-cli -p goatbuilder
      # The runner on a checkout shaped like the public one (no group_vars pins.yml, no
      # goatbuilder.yaml, no goatnet in fleet-pins.yaml): it prepares both sovereigns
      # from files every checkout carries (docs/tutorials/04-two-sovereigns.md).
      - name: The runner prepares from a public-shaped checkout
        timeout-minutes: 10
        run: ops/ci/check-federation-e2e-prepare.sh crates/target/release/goatbuilder
      - name: Two sovereigns, four scenarios (the fourth, nothing-hand-written, strict)
        timeout-minutes: 105
        run: ops/federation-e2e/run.sh --goat crates/target/release/goat --goatbuilder crates/target/release/goatbuilder --record "$RUNNER_TEMP/federation-report"
      - name: The acceptance counts
        if: always()
        run: cat "$RUNNER_TEMP/federation-report/acceptance-counts.txt" || true
      # The binaries this run proved, for ops/federation-e2e/live.sh on real hosts: the
      # live run then ships the commit CI measured, not a build of its own.
      - name: Upload the binaries this run proved
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: federation-live-binaries
          path: |
            crates/target/release/goat
            crates/target/release/goatbuilder
          retention-days: 14
      - name: Upload the run record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: federation-e2e-report
          path: ${{ runner.temp }}/federation-report
          retention-days: 14
