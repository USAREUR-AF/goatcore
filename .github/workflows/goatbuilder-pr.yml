# goatbuilder — the build/release CLI (ADR 1198). Same gates as goat-cli-pr.yml:
# check, clippy with warnings denied, test. The crate embeds the config schema
# from ops/goatbuilder/schema/, so a schema change rebuilds and re-tests it.
#
# This repository declares no deployment (no ops/goatbuilder/goatbuilder.yaml,
# no goatnet in ops/pins, no live ladder rung), so the gates here are the ones
# that run on the code, its fixtures and the mock: unit, golden and flow tests,
# the parity gates that read only this tree, the standup and teardown plans on
# fixtures (standup parity on the fixture's one site), and the tutorials'
# rehearsals. The gates that read a declared deployment (validate/doctor, the
# deploy, release, verify, fresh-source, pins, promote and standup parity
# gates against its goatnets, the live-site input
# scan, the end-state check of its sites, the image pre-pull test, join-node on
# its sites, the catalog-wide presence-flag check) run in the CI of the
# repository that declares it, on its assembled tree.
#
# Rollback: rm this file.

name: goatbuilder-pr

on:
  pull_request:
    paths:
      - 'crates/goatbuilder/**'
      - 'crates/Cargo.toml'
      - 'crates/Cargo.lock'
      - 'ops/goatbuilder/schema/**'
      - 'ops/goatbuilder/targets/**'      # tests/target_types.rs, target_type_plans_unchanged.rs
      - 'ops/goatbuilder/families/**'
      # tests/small_computer_live.rs: the collector, its stand-in machine, and what a model delivers
      - 'ops/scripts/small-computer-endstate.py'
      - 'tests/fixtures/small-computer/**'
      - 'docs/tutorials/00-goatlite.md'   # tests/goatlite_budget.rs: the first-run budget (G2)
      # tests/doc_configs.rs: every whole goatbuilder.yaml example in any document
      # validates, so a change to any document runs it, and a new example is
      # checked by its own pull request.
      - 'docs/**/*.md'
      - 'ops/goatbuilder/goatbuilder.yaml'
      - 'ops/goatbuilder/parity-*.sh'
      - 'ops/pins/**'
      - 'ops/release/graduate.py'
      - 'ops/release/tests/**'
      - 'ops/release/ladder_gate.py'
      - 'ops/release/ladder.yaml'
      - 'ops/consistency/python/**'
      - 'ops/scripts/rc.sh'
      - 'ops/scripts/fastlane.sh'
      - 'ops/scripts/pr-land.sh'
      - '.github/workflows/goatbuilder-pr.yml'
      - 'ops/ci/goatbuilder-pr-scope.sh'
      - 'crates/goat-errors/**'
      - 'crates/goat-federation/**'
      - 'crates/goat-cli/src/cmd/federate.rs'
      - 'crates/goat-cli/src/main.rs'
      - 'crates/goat-cli/src/profile.rs'
      - 'ops/federation/vectors/**'
      - 'crates/goat-fun/**'
      - 'crates/goat-selfupdate/**'
      # The committed command reference (docs::tests regenerates it from the
      # clap tree and refuses a diff) — a hand edit to it must run the gate too.
      - 'docs/reference/goatbuilder/command-reference.md'
      - 'ops/scripts/translate-ftl.py'
      # What check-goatbuilder-portable.py scans beyond the crate.
      - 'ops/ci/check-goatbuilder-portable.py'
      # The promise to the last release (ops/goatbuilder/compat/ is under ops/goatbuilder/**).
      - 'ops/ci/check-goatbuilder-compat.sh'
      - 'ops/errors/catalog.yaml'
      - 'docs/reference/goatbuilder/**'
      # The phase catalog the C11 conformance test reads (tests/legibility.rs).
      - 'ops/phases/catalog.yaml'
      - 'ops/ci/check-one-door-allow-shrinks.py'
      - 'ops/ci/check-goatbuilder-tests-leave-home.sh'
      # The scripts avenue (ADR 1201): a change to a script, a parity gate or the
      # tools both avenues call must run the gates too, or "both avenues identical"
      # is only ever checked when the binary changes.
      - 'ops/goatbuilder/**'
      - 'ops/scripts/deploy-component.sh'
      - 'ops/scripts/rollback.sh'
      - 'ops/scripts/goat-standup.sh'
      - 'ops/scripts/goat-teardown.sh'
      - 'ops/scripts/goatnet-endstate.sh'
      - 'ops/ci/check-role-honours-presence-flag.py'
      - 'ops/ci/presence-flag-allowlist.txt'
      - 'ops/scripts/envrc-var.sh'
      - 'ops/scripts/standup-required-inputs.py'
      - 'ops/scripts/test_standup_required_inputs.py'
      - 'ops/scripts/standup-images.py'
      - 'ops/scripts/standup-image-pull.sh'
      - 'ops/scripts/test_standup_image_pull.py'
      - 'ops/scripts/standup-mesh-record.py'
      - 'ops/scripts/test_standup_mesh_record.py'
      - 'ops/scripts/node-seed.py'
      - 'ops/scripts/test_node_seed.py'
      - 'ops/scripts/external-service-finish.py'
      - 'ops/scripts/test_external_service_finish.py'
      - 'ops/scripts/lifecycle-sweep.py'
      - 'ops/scripts/test_lifecycle_sweep.py'
      - 'ops/warrant/membership.py'
      - 'ops/scripts/mint-site-certs.sh'
      - 'ops/goatnets/cross-env-apply.sh'
      - 'ops/scripts/goatlite-render.py'
      - 'ops/secrets/off-when-empty.txt'
      - 'ops/ansible/**'
      - 'ops/errors/**'
      - 'ops/scripts/peering-standup.sh'
      - 'ops/scripts/deploy-secrets-needed.py'
      - 'ops/scripts/ansible-preflight.sh'
      - 'ops/scripts/fresh-source.sh'
      - 'ops/scripts/lib/source_of_record.py'
      - 'ops/ci/test-source-of-record.sh'
      - 'ops/scripts/env-door.sh'
      - 'ops/scripts/generate-door-inventory.py'
      - 'ops/scripts/standup-phase-run'
      - 'ops/secrets/posture.py'
      - 'tests/test_standup_phase_run.py'
      - 'ops/scripts/standup-timings-close.py'
      - 'tests/test_standup_timings_close.py'
      - 'tests/test_deploy_secrets_*.py'
      - 'ops/scripts/goatlite-render.py'
      - 'tests/test_goatlite_render_*.py'
      - 'ops/ci/check-phase-numbering.sh'
      - 'ops/release/**'
      - 'ops/validation/**'
      # The goatnet tutorials (ADR 1202): their rehearsals run as written.
      - 'docs/tutorials/**'
      - 'ops/tutorials/**'
      # The unit suite checks that every play's templated hosts: line resolves
      # to an extra-var target mode (the F-587 shape), so a play change runs it.
      - 'ops/ansible/*.yml'

permissions:
  contents: read

concurrency:
  group: goatbuilder-pr-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    working-directory: crates

jobs:
  # A pull request that changes only documents no gate here reads, beyond the
  # documents' configuration examples, runs tests/doc_configs.rs alone:
  # ops/ci/goatbuilder-pr-scope.sh says which paths those are. Both required
  # checks still report: "check + clippy + test" runs that one test, and the
  # macOS job is skipped by its `if`, which GitHub counts as passed. Any other
  # change, and any scope that is not exactly `docs-only` (this job failing
  # included), runs every gate.
  scope:
    name: scope (documents only, or every gate)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
      - name: The pull request's changes, against the base it merges into
        id: scope
        working-directory: ${{ github.workspace }}
        run: |
          ops/ci/goatbuilder-pr-scope.sh --self-test
          # A pull request's checkout is its merge commit: its first parent is the base.
          s=$(git diff --name-status HEAD^1 HEAD | ops/ci/goatbuilder-pr-scope.sh)
          echo "scope=$s" >> "$GITHUB_OUTPUT"

  host:
    name: check + clippy + test
    needs: scope
    # Runs for every pull request, documents only included: its steps choose.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    timeout-minutes: 20
    env:
      FULL: ${{ needs.scope.outputs.scope != 'docs-only' }}
    steps:
      # Depth 2: the pull request's merge commit and its parents, so row A1 reads
      # the base branch's crates/goatbuilder/Cargo.toml at the merge's first parent.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
      - uses: ./.github/actions/apt-failover
        if: env.FULL == 'true'
      - name: Install Rust toolchain (1.100.0 + clippy)
        uses: dtolnay/rust-toolchain@d5e4d57b030548f435d0befec15ff413a2c60eff # 1.100.0
        with:
          components: clippy
      - name: Cache cargo registry + git deps
        if: env.FULL == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-goatbuilder-pr-${{ hashFiles('crates/Cargo.lock') }}
          restore-keys: |
            cargo-goatbuilder-pr-
      - name: Cache cargo build target
        if: env.FULL == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: crates/target
          key: target-goatbuilder-pr-${{ hashFiles('crates/Cargo.lock') }}
          restore-keys: |
            target-goatbuilder-pr-
      # Documents only: the same caches, restored and never saved, so a short
      # run never writes a partial build under the key the full run reads.
      - name: Restore the cargo registry (documents only)
        if: env.FULL != 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-goatbuilder-pr-${{ hashFiles('crates/Cargo.lock') }}
          restore-keys: |
            cargo-goatbuilder-pr-
      - name: Restore the cargo build target (documents only)
        if: env.FULL != 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: crates/target
          key: target-goatbuilder-pr-${{ hashFiles('crates/Cargo.lock') }}
          restore-keys: |
            target-goatbuilder-pr-
      - name: Documents only — every whole configuration example the documents ship validates (tests/doc_configs.rs)
        if: env.FULL != 'true'
        run: cargo test -p goatbuilder --test doc_configs
      - name: goatbuilder ships no environment or programme name
        if: env.FULL == 'true'
        working-directory: ${{ github.workspace }}
        run: |
          python3 ops/ci/check-goatbuilder-portable.py --self-test
          python3 ops/ci/check-goatbuilder-portable.py
      - name: cargo check
        if: env.FULL == 'true'
        run: cargo check -p goatbuilder --all-targets
      - name: cargo clippy (deny warnings)
        if: env.FULL == 'true'
        run: cargo clippy -p goatbuilder -p goat-federation -p goat-fun -p goat-selfupdate --all-targets -- -D warnings
      - name: Install the Python the pins and promote flows render with
        if: env.FULL == 'true'
        run: pip install --quiet pyyaml jsonschema cryptography
      - name: cryptsetup, which makes the LUKS2 header tests/small_computer_live.rs reads
        if: env.FULL == 'true'
        timeout-minutes: 5
        run: |
          if ! command -v cryptsetup; then
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y -qq --no-install-recommends cryptsetup-bin
          fi
      - name: Mark the time before the tests, for the state-directory guard
        if: env.FULL == 'true'
        run: touch "$RUNNER_TEMP/goatbuilder-tests-start"
      - name: cargo test (unit, golden commands, tutor, the C11 conformance test, A2 configuration compatibility, the docs' config examples; every test target but the flows)
        if: env.FULL == 'true'
        env:
          GOAT_TEST_REQUIRE_CRYPTSETUP: "1"
        run: cargo test -p goatbuilder --bins --test cli_golden --test tutor --test bound_not_a_tty --test update --test verify_release --test federate_verbs --test legibility --test legibility_one_door --test config_compat --test deprecation --test deploy_success --test doc_configs --test full_plans_unchanged --test no_secret_on_argv --test federate_acceptance_bilateral --test status_real_hosts --test malformed_checkout_file --test doctor_target --test fastlane_owner --test deploy_dry_run_refusals --test release_deploy --test release_promote --test network_tap --test tap_machine --test small_computer_live --test type_services --test component_source --test federation_boundary --test octo_pod --test goat_processors --test first_bite
      - name: cargo test -p goat-fun (the shared hidden runner, goat and goatbuilder bound) and goat-federation (the verbs goatbuilder runs)
        if: env.FULL == 'true'
        run: cargo test -p goat-fun -p goat-selfupdate -p goat-federation
      - name: cargo test (the type and family files, and the recorded plans of every type)
        if: env.FULL == 'true'
        run: cargo test -p goatbuilder --test target_types --test target_type_plans_unchanged
      - name: The one-door allow-list only shrinks, against the pull request's base
        if: env.FULL == 'true'
        working-directory: ${{ github.workspace }}
        run: |
          python3 ops/ci/check-one-door-allow-shrinks.py --self-test
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          python3 ops/ci/check-one-door-allow-shrinks.py --base FETCH_HEAD
      - name: cargo test (whole-flow integration; a skipped flow fails the job)
        if: env.FULL == 'true'
        run: |
          set -o pipefail
          cargo test -p goatbuilder --test flows -- --nocapture 2>&1 | tee /tmp/flows.log
          if grep -q '^skipped:' /tmp/flows.log; then echo "::error::a flow skipped for missing Python deps"; exit 1; fi
      # Gate row E4: the goat-get deploy serves a goatbuilder release only once its
      # signature verifies, with this build as the controller's verifier. The test
      # runs the role's goatbuilder tasks with ansible-playbook against this runner.
      - name: The goat-get deploy serves goatbuilder only once its signature verifies (gate row E4)
        if: env.FULL == 'true'
        # In a venv of its own, first on PATH: a bare `pip install` can land in one
        # interpreter while the ansible-playbook found on PATH runs another, which
        # then has no ansible module.
        run: |
          python3 -m venv "$RUNNER_TEMP/e4-ansible"
          "$RUNNER_TEMP/e4-ansible/bin/python" -m pip install --quiet ansible-core==2.20.11
          PATH="$RUNNER_TEMP/e4-ansible/bin:$PATH" GOAT_GET_RELEASE_TEST_REQUIRED=1 cargo test -p goatbuilder --test goat_get_verifies_release
      # Gate row E1: a deployment made with each released 0.x binary continues on
      # this build. The released binaries come from a cache keyed on their pinned
      # checksums; only a cache miss downloads, and fetch.sh refuses a download
      # whose SHA-256 is not the pin. REQUIRED=1: a missing binary fails the job.
      - name: Cache the released goatbuilder binaries the upgrade test runs
        if: env.FULL == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/goatbuilder-upgrade
          key: goatbuilder-upgrade-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/goatbuilder/tests/upgrade/releases.sha256', 'crates/goatbuilder/tests/upgrade/signatures.sha256') }}
      - name: Fetch the released binaries, checked against their pins
        if: env.FULL == 'true'
        run: goatbuilder/tests/upgrade/fetch.sh ~/.cache/goatbuilder-upgrade
      - name: cargo test (upgrade, gate rows E1, E2 and E3)
        if: env.FULL == 'true'
        env:
          GOATBUILDER_UPGRADE_REQUIRED: '1'
        run: GOATBUILDER_UPGRADE_DIR="$HOME/.cache/goatbuilder-upgrade" cargo test -p goatbuilder --test upgrade --test upgrade_federation --test upgrade_update
      - name: The tests wrote nothing into the real state directory
        if: env.FULL == 'true'
        working-directory: ${{ github.workspace }}
        run: bash ops/ci/check-goatbuilder-tests-leave-home.sh --after "$RUNNER_TEMP/goatbuilder-tests-start"
      # Row A1 reads the date each release was tagged; the checkout is shallow and
      # has no tags. Tag objects and their commits only, no trees. A1 also reads
      # the deprecations.yaml a release shipped (git show <tag>:<path>); the
      # filtered fetch makes origin a promisor, so git fetches that one file's
      # trees and blob on demand. The second line proves it on the baseline's tag.
      - name: Fetch the goatbuilder release tags (A1 reads their dates and shipped lists)
        if: env.FULL == 'true'
        working-directory: ${{ github.workspace }}
        run: |
          git fetch --no-tags --depth=1 --filter=tree:0 origin '+refs/tags/goatbuilder/v*:refs/tags/goatbuilder/v*'
          git show "$(sed -n 's/^release: //p' ops/goatbuilder/compat/baseline.yaml):ops/goatbuilder/compat/deprecations.yaml" > /dev/null
      - name: The promise — commands and documents of the last release still hold (A1, A3, A4)
        if: env.FULL == 'true'
        working-directory: ${{ github.workspace }}
        # The baseline is ops/goatbuilder/compat/ (its README says how a release moves it).
        run: bash ops/ci/check-goatbuilder-compat.sh crates/target/debug/goatbuilder
      - name: Every message has a translation in every shipped language
        if: env.FULL == 'true'
        working-directory: .
        run: |
          python3 ops/scripts/translate-ftl.py --self-test
          python3 ops/scripts/translate-ftl.py --check --catalog goatbuilder --catalog goat-errors || {
            echo "::error::A message in English has no translation in some shipped language (docs/design/goat-cli-i18n.md §CLI catalog currency)."
            echo "::error::Fill it: ops/scripts/translate-ftl.py --apply --catalog goatbuilder --catalog goat-errors   (needs ANTHROPIC_API_KEY; or dispatch docs-translation-gate.yml with apply=true)"
            exit 1
          }
      - name: Parity gate — `rollback --list/--status` read exactly what rollback.sh reads
        if: env.FULL == 'true'
        working-directory: ${{ github.workspace }}
        timeout-minutes: 8   # an apt mirror stall has no timeout of its own
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y -qq jq >/dev/null
          pip install --quiet yq   # the jq-wrapping yq the script side reads the in-repo ledger with
          # The gate ignores only goatbuilder's `(GB-NNN — goatbuilder explain GB-NNN)` line; a real difference still fails.
          ops/goatbuilder/parity-rollback.sh --self-test
          # No host is reachable from a runner, and the gate pins that no-reach path:
          # an ssh that refuses at once keeps every one of the 81 components from
          # waiting out a connect timeout per host on the script side.
          mkdir -p "$RUNNER_TEMP/noreach" && printf '#!/bin/sh\nexit 255\n' > "$RUNNER_TEMP/noreach/ssh" && chmod +x "$RUNNER_TEMP/noreach/ssh"
          PATH="$RUNNER_TEMP/noreach:$PATH" ops/goatbuilder/parity-rollback.sh crates/target/debug/goatbuilder   # every component with a deploy-history.yml
          # Again under mikefarah's yq, the one the script tells an operator to
          # install (brew install yq): its @tsv differs from the Python yq's, and
          # a multi-line summary split into several numbered rows under it (#2066).
          mkdir -p "$RUNNER_TEMP/myq"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/myq/yq" https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          echo "a2c097180dd884a8d50c956ee16a9cec070f30a7947cf4ebf87d5f36213e9ed7  $RUNNER_TEMP/myq/yq" | sha256sum -c --quiet
          chmod +x "$RUNNER_TEMP/myq/yq"
          PATH="$RUNNER_TEMP/noreach:$RUNNER_TEMP/myq:$PATH" ops/goatbuilder/parity-rollback.sh crates/target/debug/goatbuilder
      - name: Parity gate — `history` lists exactly what rollback.sh --list lists
        if: env.FULL == 'true'
        working-directory: ${{ github.workspace }}
        timeout-minutes: 8
        env:
          GOAT_MESH_PROBE: "0"
          GOAT_DOOR_OPEN: "0"   # decide the door, do not open it: nothing is reachable here
        run: |
          ops/goatbuilder/parity-history.sh --self-test
          PATH="$RUNNER_TEMP/noreach:$PATH" ops/goatbuilder/parity-history.sh crates/target/debug/goatbuilder zagros_dev
      - name: Parity gate — both avenues refuse an incomplete ledger verification on the real path (#1545)
        if: env.FULL == 'true'
        working-directory: ${{ github.workspace }}
        run: ops/goatbuilder/parity-verify-refusals.sh crates/target/debug/goatbuilder
      - name: End state — the model's self-test, both avenues grade the fixtures alike (ADR 1206)
        if: env.FULL == 'true'
        working-directory: ${{ github.workspace }}
        run: |
          python3 ops/goatbuilder/endstate/endstate.py --self-test
          ops/goatbuilder/parity-endstate.sh crates/target/debug/goatbuilder
          # a service a site declares off is never deployed: the checker's own cases, then the
          # catalog-wide run, which judges goatcore's own roles and names (SKIP) the rows deployed
          # from goatstuff or goatrodeo; those are judged on an assembled tree. Its allowlist
          # (known gaps and reviewed home: rows) only shrinks against the pull request's base.
          python3 ops/ci/check-role-honours-presence-flag.py --self-test
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          python3 ops/ci/check-role-honours-presence-flag.py --base FETCH_HEAD
      - name: Fresh source on an assembled tree — goatcore at goatcore.ref plus an overlay is judged against that pair (C3)
        if: env.FULL == 'true'
        working-directory: ${{ github.workspace }}
        run: ops/ci/test-source-of-record.sh
      - name: Parity gate — `fastlane --dry-run` checks exactly what fastlane.sh checks
        if: env.FULL == 'true'
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}   # cannot read the GHCR packages API; both sides refuse at the digest step with the same words
        run: ops/goatbuilder/parity-fastlane.sh crates/target/debug/goatbuilder microscope sha-b7a1621
      - name: The ladder's readiness document and runtime-health gate (ops/release/tests)
        if: env.FULL == 'true'
        working-directory: ${{ github.workspace }}
        run: |
          python3 ops/release/tests/test_readiness.py
          python3 ops/release/tests/test_runtime_health.py
          python3 ops/release/tests/test_hotfix_shadow.py
          python3 ops/release/tests/test_ladder_gate.py
      - name: Parity gate — both avenues refuse a member deviation that shadows its goatnet (ADR 1256)
        if: env.FULL == 'true'
        working-directory: ${{ github.workspace }}
        run: ops/goatbuilder/parity-pins-member-over.sh crates/target/debug/goatbuilder
      - name: Parity gate — both avenues resolve an opt-in component only where a goatnet opts in, and it moves nothing else
        if: env.FULL == 'true'
        working-directory: ${{ github.workspace }}
        run: ops/goatbuilder/parity-pins-opt-in.sh crates/target/debug/goatbuilder
      - name: Every input a standup reaches is set — the scan finds the fixture's gaps in one pass
        if: env.FULL == 'true'
        working-directory: ${{ github.workspace }}
        run: python3 ops/scripts/test_standup_required_inputs.py
      - name: The standup pre-pull lists a member's image pins and pulls them N at once, on a fixture checkout of its own
        if: env.FULL == 'true'
        working-directory: ${{ github.workspace }}
        run: python3 -W error::ResourceWarning ops/scripts/test_standup_image_pull.py
      - name: Each phase runs through the shared runner; a goatlite's phase 1 creates its own secrets store (LP-007)
        if: env.FULL == 'true'
        working-directory: ${{ github.workspace }}
        run: python3 tests/test_standup_phase_run.py
      - name: goat-standup.sh closes the operator step's timings row when the run resumes, as goatbuilder standup does
        if: env.FULL == 'true'
        working-directory: ${{ github.workspace }}
        run: python3 tests/test_standup_timings_close.py
      - name: The deploy secrets check names every env lookup the play reaches — role defaults and task lookups
        if: env.FULL == 'true'
        working-directory: ${{ github.workspace }}
        run: python3 -W error::ResourceWarning -m unittest tests/test_deploy_secrets_role_defaults.py tests/test_deploy_secrets_task_lookups.py -v
      - name: goatlite's render — the LAN surface, and lite.internet's internet-correct values (goatlite.md §6)
        if: env.FULL == 'true'
        working-directory: ${{ github.workspace }}
        run: python3 -W error::ResourceWarning -m unittest discover -s tests -p 'test_goatlite_render_*.py' -v
      - name: Phase 8 records the mesh IPs where the router certificate reads them, and re-mints only on a change
        if: env.FULL == 'true'
        working-directory: ${{ github.workspace }}
        run: python3 ops/scripts/test_standup_mesh_record.py
      - name: The autoinstall seed per node class carries the asserted LUKS layout, the role package lists and key-only access
        if: env.FULL == 'true'
        working-directory: ${{ github.workspace }}
        run: python3 ops/scripts/test_node_seed.py
      - name: external-service-finish writes a governed scope's membership entry and names the group from the taxonomy's site_prefix
        if: env.FULL == 'true'
        working-directory: ${{ github.workspace }}
        run: python3 -W error::ResourceWarning ops/scripts/test_external_service_finish.py
      - name: The lifecycle sweep holds, revokes and restores by its lanes, and on a governed scope emits a membership entry instead of writing live
        if: env.FULL == 'true'
        working-directory: ${{ github.workspace }}
        run: python3 -W error::ResourceWarning ops/scripts/test_lifecycle_sweep.py
      - name: Phase 12's dependency graph is valid, and both avenues run it in waves
        if: env.FULL == 'true'
        working-directory: ${{ github.workspace }}
        run: |
          python3 ops/goatbuilder/standup-dag.py --check
          ops/goatbuilder/test-standup-waves.sh
      - name: Parity gate — `teardown --dry-run` plans exactly the teardown goat-teardown.sh plans
        if: env.FULL == 'true'
        working-directory: ${{ github.workspace }}
        env:
          GOAT_MESH_PROBE: "0"
        run: ops/goatbuilder/parity-teardown.sh crates/target/debug/goatbuilder zagros_prod:zagros-prod zagros:uk zagros_dev:zagros-dev
      - name: Parity gate — `standup --dry-run` plans exactly the phases goat-standup.sh plans, on the fixture's one site
        if: env.FULL == 'true'
        working-directory: ${{ github.workspace }}
        env:
          GOAT_MESH_PROBE: "0"
        run: |
          ops/goatbuilder/parity-standup.sh --self-test
          # This tree declares no deployment; a scratch worktree of this commit declares the fixture's.
          git worktree add --detach "$RUNNER_TEMP/standup-parity" HEAD
          cp ops/goatbuilder/fixtures/standup-parity/goatbuilder.yaml "$RUNNER_TEMP/standup-parity/ops/goatbuilder/goatbuilder.yaml"
          "$RUNNER_TEMP/standup-parity/ops/goatbuilder/parity-standup.sh" "$PWD/crates/target/debug/goatbuilder" zagros_dev:zagros-dev
      - name: Parity gate — `federate --dry-run` plans exactly the phases peering-standup.sh plans
        if: env.FULL == 'true'
        working-directory: ${{ github.workspace }}
        run: ops/goatbuilder/parity-federate.sh crates/target/debug/goatbuilder hello-ally
      - name: Parity gate — `goatbuilder federate <verb>` answers exactly as `goat federate <verb>` over the conformance vectors
        if: env.FULL == 'true'
        working-directory: ${{ github.workspace }}
        run: |
          (cd crates && cargo build -p goat-cli)
          ops/goatbuilder/parity-federate-verbs.sh crates/target/debug/goat crates/target/debug/goatbuilder
      - name: Every operator-facing phase sequence is whole numbers from 1, no gaps, no letters
        if: env.FULL == 'true'
        working-directory: ${{ github.workspace }}
        env:
          GOAT_MESH_PROBE: "0"
        run: ops/ci/check-phase-numbering.sh crates/target/debug/goatbuilder
      - name: The standup rehearsal converges every class of the fixture, in phase order, on a copy
        if: env.FULL == 'true'
        working-directory: ${{ github.workspace }}
        run: |
          cp -R ops/goatbuilder/fixtures/standup "$RUNNER_TEMP/standup-fixture"
          crates/target/debug/goatbuilder --mock "$RUNNER_TEMP/standup-fixture" standup dev --site alpha --ack "CI" --yes
          crates/target/debug/goatbuilder --mock "$RUNNER_TEMP/standup-fixture" status --env dev
      - name: The goatnet tutorials' rehearsals run as written and match the worked example's checkpoints
        if: env.FULL == 'true'
        working-directory: ${{ github.workspace }}
        run: ops/tutorials/check.sh crates/target/debug/goatbuilder

  # goatbuilder ships darwin binaries (goatbuilder-release.yml), so its unit,
  # golden and flow tests run on macOS too, and the upgrade tests (gate rows E1,
  # E2, E3) with the released darwin-arm64 binaries. No Windows job: goatbuilder drives
  # Ansible and aws-vault, neither of which runs natively there, and it is not
  # shipped for Windows (goat-cli-pr.yml's windows job has no counterpart here).
  macos:
    name: macOS test (unit, golden, flows)
    needs: scope
    # Skipped, which counts as passed, only for a pull request of documents only.
    if: ${{ !cancelled() && needs.scope.outputs.scope != 'docs-only' }}
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust toolchain (1.100.0)
        uses: dtolnay/rust-toolchain@d5e4d57b030548f435d0befec15ff413a2c60eff # 1.100.0
      - name: Cache cargo registry + git deps
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-goatbuilder-pr-macos-${{ hashFiles('crates/Cargo.lock') }}
          restore-keys: |
            cargo-goatbuilder-pr-macos-
      - name: Cache cargo build target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: crates/target
          key: target-goatbuilder-pr-macos-${{ hashFiles('crates/Cargo.lock') }}
          restore-keys: |
            target-goatbuilder-pr-macos-
      - name: Install the Python the pins and promote flows render with
        run: python3 -m pip install --quiet --break-system-packages pyyaml jsonschema || python3 -m pip install --quiet pyyaml jsonschema
      - name: Mark the time before the tests, for the state-directory guard
        run: touch "$RUNNER_TEMP/goatbuilder-tests-start"
      - name: cargo test
        run: cargo test -p goatbuilder
      # Gate rows E1, E2 and E3 on darwin-arm64, as the host job runs them on
      # linux-amd64: the released darwin-arm64 binaries, from a cache keyed on their
      # pinned checksums, checked by fetch.sh. REQUIRED=1: a missing binary fails the job.
      - name: Cache the released goatbuilder binaries the upgrade test runs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/goatbuilder-upgrade
          key: goatbuilder-upgrade-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/goatbuilder/tests/upgrade/releases.sha256', 'crates/goatbuilder/tests/upgrade/signatures.sha256') }}
      - name: Fetch the released binaries, checked against their pins
        run: goatbuilder/tests/upgrade/fetch.sh ~/.cache/goatbuilder-upgrade
      - name: cargo test (upgrade, gate rows E1, E2 and E3)
        env:
          GOATBUILDER_UPGRADE_REQUIRED: '1'
        run: GOATBUILDER_UPGRADE_DIR="$HOME/.cache/goatbuilder-upgrade" cargo test -p goatbuilder --test upgrade --test upgrade_federation --test upgrade_update
      - name: The tests wrote nothing into the real state directory
        working-directory: ${{ github.workspace }}
        run: bash ops/ci/check-goatbuilder-tests-leave-home.sh --after "$RUNNER_TEMP/goatbuilder-tests-start"

  # Gate rows E1, E2 and E3 on linux-arm64: goatbuilder ships a linux-arm64
  # binary (goatbuilder-release.yml), so a 0.x install there must move to this
  # build and back as on linux-amd64. Only the three upgrade tests run here; the
  # host job runs every other gate. darwin-amd64 runs in
  # goatbuilder-upgrade-darwin-amd64.yml, at each release tag and weekly, not on
  # pull requests: the Intel macOS pool queues long (gate row E3).
  linux-arm64:
    name: linux-arm64 upgrade test (gate rows E1, E2, E3)
    needs: scope
    # Skipped, which counts as passed, only for a pull request of documents only.
    if: ${{ !cancelled() && needs.scope.outputs.scope != 'docs-only' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust toolchain (1.100.0)
        uses: dtolnay/rust-toolchain@d5e4d57b030548f435d0befec15ff413a2c60eff # 1.100.0
      - name: Cache cargo registry + git deps
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-goatbuilder-pr-arm64-${{ hashFiles('crates/Cargo.lock') }}
          restore-keys: |
            cargo-goatbuilder-pr-arm64-
      - name: Cache cargo build target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: crates/target
          key: target-goatbuilder-pr-arm64-${{ hashFiles('crates/Cargo.lock') }}
          restore-keys: |
            target-goatbuilder-pr-arm64-
      - name: Install the Python the pins and promote flows render with
        run: python3 -m pip install --quiet --break-system-packages pyyaml jsonschema || python3 -m pip install --quiet pyyaml jsonschema
      - name: Cache the released goatbuilder binaries the upgrade test runs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/goatbuilder-upgrade
          key: goatbuilder-upgrade-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/goatbuilder/tests/upgrade/releases.sha256', 'crates/goatbuilder/tests/upgrade/signatures.sha256') }}
      - name: Fetch the released binaries, checked against their pins
        run: goatbuilder/tests/upgrade/fetch.sh ~/.cache/goatbuilder-upgrade
      - name: Mark the time before the tests, for the state-directory guard
        run: touch "$RUNNER_TEMP/goatbuilder-tests-start"
      - name: cargo test (upgrade, gate rows E1, E2 and E3)
        env:
          GOATBUILDER_UPGRADE_REQUIRED: '1'
        run: GOATBUILDER_UPGRADE_DIR="$HOME/.cache/goatbuilder-upgrade" cargo test -p goatbuilder --test upgrade --test upgrade_federation --test upgrade_update
      - name: The tests wrote nothing into the real state directory
        working-directory: ${{ github.workspace }}
        run: bash ops/ci/check-goatbuilder-tests-leave-home.sh --after "$RUNNER_TEMP/goatbuilder-tests-start"

