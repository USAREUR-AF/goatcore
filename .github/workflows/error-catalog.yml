# The error catalog gate (ADR 1199, docs/design/error-interpretation.md).
#
# ops/errors/catalog.yaml is the one home for every error goat and goatbuilder
# print and every tool error they carry. On any change to it, to the crate
# that embeds it, to the code that cites it (the federation library too), or
# to the generated reference:
# the Python gate tests itself (the full run is error-catalog-read-targets.yml,
# which also runs when a document a `read` path names changes);
# the crate's tests compile every pattern with the
# Rust engine and prove the three matching layers on real messages.
# ops/ci/check-error-codes-kept.py holds the catalog to the last release:
# no code it printed is dropped or retitled without a retired mark (gate A5).
# ops/ci/check-drill-log-coded.py names every error in a drill's logs that carries no
# code (gate C5); its self-test runs here, and the drill runs it on its own logs.

name: error-catalog

on:
  workflow_dispatch:  # the weekly path-filtered run starts it on main
  pull_request:
    paths:
      - 'ops/errors/**'
      - 'crates/goat-errors/**'
      - 'crates/goatbuilder/src/**'
      - 'crates/goat-federation/src/**'
      - 'crates/goat-cli/src/errors.rs'
      - 'crates/goat-cli/src/cmd/explain.rs'
      - 'docs/reference/errors.md'
      - 'docs/reference/errors/**'
      - 'docs/design/goat-cli-error-codes.md'
      - 'ops/ci/check-error-catalog.py'
      - 'ops/ci/check-error-codes-kept.py'
      - 'ops/ci/check-drill-log-coded.py'
      - 'ops/ci/test_check_drill_log_coded.py'
      - '.github/workflows/error-catalog.yml'
  push:
    branches: [main]
    paths:
      - 'ops/errors/**'
      - 'crates/goat-errors/**'

permissions:
  contents: read

concurrency:
  group: error-catalog-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  catalog:
    name: catalog gate self-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release tags, for the codes-kept gate: it reads the catalog at the
          # newest goatbuilder/v<x.y.z> and goat-cli-v<x.y.z> tags reachable from HEAD.
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: PyYAML
        run: pip install pyyaml
      - name: Gate self-test
        run: python3 ops/ci/check-error-catalog.py --self-test
      - name: Every code of the last release is kept (gate row A5), self-test
        run: python3 ops/ci/check-error-codes-kept.py --self-test
      - name: Every code of the last release is kept (gate row A5)
        run: python3 ops/ci/check-error-codes-kept.py
      - name: A drill log holds no error without its code (gate row C5), self-test
        run: python3 ops/ci/check-drill-log-coded.py --self-test

  crate:
    name: goat-errors tests (patterns compile, three layers hold)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: crates
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain (1.100.0 + clippy)
        uses: dtolnay/rust-toolchain@d5e4d57b030548f435d0befec15ff413a2c60eff # 1.100.0
        with:
          components: clippy
      - name: Cache cargo registry + git deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: goat-errors-cargo-${{ runner.os }}-${{ hashFiles('crates/Cargo.lock') }}
      - name: cargo clippy (deny warnings)
        run: cargo clippy -p goat-errors --all-targets -- -D warnings
      - name: cargo test
        run: cargo test -p goat-errors
