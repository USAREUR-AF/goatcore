# The error catalog gate (ADR 1199, docs/design/error-interpretation.md).
#
# ops/errors/catalog.yaml is the one home for every error goat and goatbuilder
# print and every tool error they carry. On any change to it, to the crate
# that embeds it, to the code that cites it, or to the generated reference:
# the Python gate tests itself, then runs in full: every `read` path names a
# document in this repository, so a plain checkout passes it;
# the crate's tests compile every pattern with the
# Rust engine and prove the three matching layers on real messages.

name: error-catalog

on:
  pull_request:
    paths:
      - 'ops/errors/**'
      - 'crates/goat-errors/**'
      - 'crates/goatbuilder/src/**'
      - 'crates/goat-cli/src/errors.rs'
      - 'crates/goat-cli/src/cmd/explain.rs'
      - 'docs/reference/errors.md'
      - 'docs/design/goat-cli-error-codes.md'
      - 'ops/ci/check-error-catalog.py'
      - '.github/workflows/error-catalog.yml'
  push:
    branches: [main]
    paths:
      - 'ops/errors/**'
      - 'crates/goat-errors/**'

permissions:
  contents: read

concurrency:
  group: error-catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog:
    name: catalog gate self-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: PyYAML
        run: pip install pyyaml
      - name: Gate self-test
        run: python3 ops/ci/check-error-catalog.py --self-test
      - name: Gate, in full
        run: python3 ops/ci/check-error-catalog.py

  crate:
    name: goat-errors tests (patterns compile, three layers hold)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: crates
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain (1.100.0 + clippy)
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: clippy
      - name: Cache cargo registry + git deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: goat-errors-cargo-${{ runner.os }}-${{ hashFiles('crates/Cargo.lock') }}
      - name: cargo clippy (deny warnings)
        run: cargo clippy -p goat-errors --all-targets -- -D warnings
      - name: cargo test
        run: cargo test -p goat-errors
