# goatbuilder's bare `?` gate (gate row C5): no `?` in crates/goatbuilder/src/
# passes up an error without its catalog code, except the places listed in
# crates/goatbuilder/tests/bare-question-baseline.txt, which only shrinks.
# ops/ci/check-goatbuilder-bare-question.sh builds a copy of the tree with an
# error type that converts only from coded errors and reads the compiler's
# errors; the tree itself is not changed. It runs the same way locally.
#
# Cost: one `cargo check` of goatbuilder's binary in the copy. The registry and
# the dependencies' build are cached; goatbuilder and its path crates are
# checked again each run, since the copy is a new directory.
#
# Rollback: rm this file.

name: goatbuilder-bare-question

on:
  pull_request:
    paths:
      - 'crates/goatbuilder/**'
      - 'crates/goat-errors/**'
      - 'crates/goat-federation/**'
      - 'crates/Cargo.toml'
      - 'crates/Cargo.lock'
      - 'ops/ci/check-goatbuilder-bare-question.sh'
      - 'ops/ci/goatbuilder_bare_question.py'
      - 'ops/ci/test_goatbuilder_bare_question.py'
      - '.github/workflows/goatbuilder-bare-question.yml'
  push:
    branches: [main]
    paths:
      - 'crates/goatbuilder/**'
      - 'crates/goat-errors/**'
      - 'crates/goat-federation/**'
      - 'crates/Cargo.toml'
      - 'crates/Cargo.lock'
      - 'ops/ci/check-goatbuilder-bare-question.sh'
      - 'ops/ci/goatbuilder_bare_question.py'
      - 'ops/ci/test_goatbuilder_bare_question.py'
      - '.github/workflows/goatbuilder-bare-question.yml'

permissions:
  contents: read

concurrency:
  group: goatbuilder-bare-question-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  bare-question:
    name: no bare ? passes up an uncoded error
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/crates/target-bare-question
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install Rust toolchain (1.100.0)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: '1.100.0'
      - name: Cache cargo registry + the copy's build target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/target-bare-question
          key: goatbuilder-bare-question-${{ runner.os }}-1.100.0-${{ hashFiles('crates/Cargo.lock') }}
          restore-keys: |
            goatbuilder-bare-question-${{ runner.os }}-1.100.0-
      - name: The gate's own tests
        run: ops/ci/check-goatbuilder-bare-question.sh --self-test
      - name: No bare ? passes up an uncoded error (beyond the baseline)
        run: ops/ci/check-goatbuilder-bare-question.sh
