# goatlite-vm-image — the goatlite prepared VM image (docs/design/goatlite.md §11
# measure 5; ops/vm-image/README.md). Builds Ubuntu 24.04 with phase 2's host
# baseline applied and every image any goatlite runs already pulled, boots the
# result once as a learner would (new cloud-init user; every image present by
# digest, nothing pulled), and uploads the qcow2 with its record as an artifact.
#
# Runs on every change to what the image is made from (the baseline playbook and
# the roles it runs, the pin table, the image list, the builder) and on demand.
# Status: WIP, not for production use — gate: one standup from the image, timed
# the way docs/design/goatlite.md §11 times a standup.
#
# Uses no secret: the checkout and the artifact upload run on the GITHUB_TOKEN
# the job is given, read-only.
#
# Rollback: rm this file.

name: goatlite-vm-image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ops/vm-image/**'
      - 'ops/ansible/mgmt-host-baseline.yml'
      - 'ops/ansible/roles/docker-engine/**'
      - 'ops/ansible/roles/egress-shaping/**'
      - 'ops/ansible/roles/netbird-boot-selfheal/**'
      - 'ops/ansible/roles/netbird-client-pin/**'
      - 'ops/ansible/group_vars/all.yml'
      - 'ops/pins/fleet-pins.yaml'
      - 'ops/scripts/standup-images.py'
      - 'ops/scripts/standup-image-pull.sh'
      - 'ops/scripts/goatlite-render.py'
      - '.github/workflows/goatlite-vm-image.yml'
  pull_request:
    paths:
      - 'ops/vm-image/**'
      - 'ops/ansible/mgmt-host-baseline.yml'
      - 'ops/ansible/roles/docker-engine/**'
      - 'ops/ansible/roles/egress-shaping/**'
      - 'ops/ansible/roles/netbird-boot-selfheal/**'
      - 'ops/ansible/roles/netbird-client-pin/**'
      - 'ops/ansible/group_vars/all.yml'
      - 'ops/pins/fleet-pins.yaml'
      - 'ops/scripts/standup-images.py'
      - 'ops/scripts/standup-image-pull.sh'
      - 'ops/scripts/goatlite-render.py'
      - '.github/workflows/goatlite-vm-image.yml'

permissions:
  contents: read

concurrency:
  group: goatlite-vm-image-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: build and first-boot the image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/apt-failover
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Room for a 40 GB sparse disk and its compressed copy
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: QEMU, cloud-localds, ansible-core and the collections
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y -qq qemu-system-x86 qemu-utils cloud-image-utils
          python3 -m pip install --quiet pyyaml jsonschema jmespath 'ansible-core==2.20.11'
          ansible-galaxy collection install -r ops/ansible/requirements.yml >/dev/null
      - name: KVM for the build VM (emulation without it)
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi
          ls -l /dev/kvm || echo "no /dev/kvm: the build runs under emulation"
      - name: Build, then first-boot check
        run: ops/vm-image/build.sh --out "$RUNNER_TEMP/vm-image"
      - name: Upload the image and its record
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: goatlite-ubuntu-24.04-amd64
          path: ${{ runner.temp }}/vm-image/
          compression-level: 0
          retention-days: 14
          if-no-files-found: warn

  # The zero-SaaS lab run (ops/vm-image/zero-saas/README.md): a goatlite stood up from the
  # image just built, by a laptop VM, on a private segment with no route out, every frame
  # of the run in pcap. Passes only when the standup and verify pass and no packet of the
  # clock went to an outside address and no DNS question named an outside name. Lab only:
  # its phase-11 stand-in is not part of goatbuilder.
  zero-saas-standup:
    name: standup from the image with no route out (zero-SaaS)
    needs: build
    # Started by hand only (workflow_dispatch), never by a push or a pull request, until
    # the run can pass: it stops in phase 2, where mgmt-host-baseline.yml refreshes and
    # upgrades apt on every standup (docs/design/pluggable-dependencies.md, status). It
    # then runs on every change, as a required job.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # the laptop's checkout is a clone of this one, made from a bundle
      - uses: ./.github/actions/apt-failover
      - name: Room for two VM disks
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: QEMU and xorriso
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y -qq qemu-system-x86 qemu-utils xorriso
      - name: KVM for the two VMs (emulation without it)
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi
          ls -l /dev/kvm || echo "no /dev/kvm: the run is emulated and will likely time out"
          free -m
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: goatlite-ubuntu-24.04-amd64
          path: ${{ runner.temp }}/vm-image
      - name: The laptop VM (tutorial 00 section 1; before the clock, with network)
        timeout-minutes: 60
        run: ops/vm-image/zero-saas/lab.sh prepare-laptop --work "$RUNNER_TEMP/lab"
      - name: The standup with no route out, and the judge
        timeout-minutes: 170
        env:
          LAB_BOX_MEMORY_MB: '10240'
          LAB_LAPTOP_MEMORY_MB: '3072'
        run: |
          ops/vm-image/zero-saas/lab.sh run --work "$RUNNER_TEMP/lab" \
            --image "$RUNNER_TEMP/vm-image/goatlite-ubuntu-24.04-amd64.qcow2" --record "$RUNNER_TEMP/zero-saas-record"
      - name: Upload the record
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zero-saas-standup-record
          path: ${{ runner.temp }}/zero-saas-record/
          retention-days: 14
          if-no-files-found: warn

  # A founder and one machine that joins it as the first core machine of a new site
  # (ops/e2e/vm/founder.sh, gates J1 and J3), with the lab's stand-in for the person at
  # standup phase 11, named in the record. Started by hand only: three VMs need about
  # 14 GB of memory, and no run has passed whole yet (the README says where it stops).
  founder-join:
    name: a founder, and a core machine of a site that joins it
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # the laptop's checkout is a clone of this one, made from a bundle
      - uses: ./.github/actions/apt-failover
      - name: Room for three VM disks
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: QEMU and xorriso
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y -qq qemu-system-x86 qemu-utils xorriso ubuntu-cloudimage-keyring gpgv
      - name: KVM for the VMs
        run: |
          [ -e /dev/kvm ] || { echo "::error::environment: no /dev/kvm on this runner, and the run refuses emulation"; exit 1; }
          sudo chmod 0666 /dev/kvm
          free -m
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: goatlite-ubuntu-24.04-amd64
          path: ${{ runner.temp }}/vm-image
      - name: The laptop VM
        timeout-minutes: 60
        run: ops/vm-image/zero-saas/lab.sh prepare-laptop --work "$RUNNER_TEMP/lab"
      - name: The founder and the machine that joins it
        timeout-minutes: 150
        run: ops/e2e/vm/founder.sh --work "$RUNNER_TEMP/lab" --image "$RUNNER_TEMP/vm-image/goatlite-ubuntu-24.04-amd64.qcow2" --record "$RUNNER_TEMP/founder-record" --phase-11-stand-in --joiner-site beta
      - name: Upload the record
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vm-founder-record
          path: ${{ runner.temp }}/founder-record/
          retention-days: 14
          if-no-files-found: warn
