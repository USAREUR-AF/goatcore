# goatlite-vm-image — the goatlite prepared VM image (docs/design/goatlite.md §11
# measure 5; ops/vm-image/README.md). Builds Ubuntu 24.04 with phase 2's host
# baseline applied and every image any goatlite runs already pulled, boots the
# result once as a learner would (new cloud-init user; every image present by
# digest, nothing pulled), and uploads the qcow2 with its record as an artifact.
#
# Runs on every change to what the image is made from (the baseline playbook and
# the roles it runs, the pin table, the image list, the builder) and on demand.
# Status: WIP, not for production use — gate: one standup from the image, timed
# the way docs/design/goatlite.md §11 times a standup.
#
# Uses no secret: the checkout and the artifact upload run on the GITHUB_TOKEN
# the job is given, read-only.
#
# Rollback: rm this file.

name: goatlite-vm-image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ops/vm-image/**'
      - 'ops/ansible/mgmt-host-baseline.yml'
      - 'ops/ansible/roles/docker-engine/**'
      - 'ops/ansible/roles/egress-shaping/**'
      - 'ops/ansible/roles/netbird-boot-selfheal/**'
      - 'ops/ansible/roles/netbird-client-pin/**'
      - 'ops/ansible/group_vars/all.yml'
      - 'ops/pins/fleet-pins.yaml'
      - 'ops/scripts/standup-images.py'
      - 'ops/scripts/standup-image-pull.sh'
      - 'ops/scripts/goatlite-render.py'
      - '.github/workflows/goatlite-vm-image.yml'
  pull_request:
    paths:
      - 'ops/vm-image/**'
      - 'ops/ansible/mgmt-host-baseline.yml'
      - 'ops/ansible/roles/docker-engine/**'
      - 'ops/ansible/roles/egress-shaping/**'
      - 'ops/ansible/roles/netbird-boot-selfheal/**'
      - 'ops/ansible/roles/netbird-client-pin/**'
      - 'ops/ansible/group_vars/all.yml'
      - 'ops/pins/fleet-pins.yaml'
      - 'ops/scripts/standup-images.py'
      - 'ops/scripts/standup-image-pull.sh'
      - 'ops/scripts/goatlite-render.py'
      - '.github/workflows/goatlite-vm-image.yml'

permissions:
  contents: read

concurrency:
  group: goatlite-vm-image-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: build and first-boot the image
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Room for a 40 GB sparse disk and its compressed copy
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: QEMU, cloud-localds, ansible-core and the collections
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y -qq qemu-system-x86 qemu-utils cloud-image-utils
          python3 -m pip install --quiet pyyaml jsonschema jmespath 'ansible-core==2.20.11'
          ansible-galaxy collection install -r ops/ansible/requirements.yml >/dev/null
      - name: KVM for the build VM (emulation without it)
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi
          ls -l /dev/kvm || echo "no /dev/kvm: the build runs under emulation"
      - name: Build, then first-boot check
        run: ops/vm-image/build.sh --out "$RUNNER_TEMP/vm-image"
      - name: Upload the image and its record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goatlite-ubuntu-24.04-amd64
          path: ${{ runner.temp }}/vm-image/
          compression-level: 0
          retention-days: 14
          if-no-files-found: warn
