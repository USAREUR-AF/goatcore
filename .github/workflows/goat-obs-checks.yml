name: goat-obs checks

# CI gate for the on-mgmt-host observability stack (ops/compose/goat-obs) and
# its host-side feeders.
#
# Why this exists: both halves shipped with tests that NOTHING ran. The
# prometheus rules directory had five promtool suites sitting unexecuted since
# they were written, and the identity-reconcile python suites
# landed with the fragility-audit hardening and had no runner
# either. An alerting rule that silently stops matching is the exact failure
# class those rules exist to catch, so leaving their tests unrun was the same
# blindness one level up.
#
# Both jobs are cheap (seconds) and path-scoped to the trees they cover.

on:
  # push: on main REMOVED — this workflow is a guard, not a publisher. It
  # already gates the pull request, and a squash merge puts the reviewed diff
  # on main unchanged, so re-running it there re-verifies a commit whose answer
  # is known. 98 of 119 workflows did that; measured at 4,787 runs in
  # one day, roughly half of them this shape.
  #
  # An earlier draft of this comment also said "main is protected from
  # force-push". IT IS NOT — this plan cannot have branch protection at all
  # (the API answers "Upgrade to GitHub Pro"). A force-push to main therefore
  # bypasses this guard entirely. That is a real gap and it is 's, not
  # something a paths filter or a trigger change can close.
  # Publishers keep push: on purpose — the merge commit is the artifact.
  pull_request:
    paths:
      - 'ops/compose/goat-obs/**'
      - 'ops/compose/mgmt-host/monitoring/rules/compose-orphans.yml'
      # Host readers of the portal registry, SQLite and Postgres eras (ADR 1165
      # step A): the shared Postgres reader and the scripts that use it.
      - 'ops/scripts/portal_registry_pg.py'
      - 'ops/scripts/test_portal_registry_pg.py'
      - 'ops/scripts/reap-orphans.py'
      - 'ops/scripts/test_reap_orphans.py'
      - 'ops/scripts/sync-slot-anchors.py'
      # The Thor probe's delivery-stall counters feed rules/zenoh-wedge.yml.
      - 'ops/relay/health/zenoh-router-signals.py'
      - 'ops/relay/health/test_zenoh_router_signals.py'
      # Both exporter paths and their TCP/TLS probe feed admission alerting.
      - 'ops/relay/health/zenoh-health-probe.sh'
      - 'ops/relay/health/zenoh-health-to-prom.py'
      - 'ops/relay/health/relay-metrics-ingest.py'
      - 'ops/relay/health/test_zenoh_admission_probe.py'
      # The registry WAL gauges feed rules/registry-wal.yml (the 91.4 GB WAL
      # the 24h-average runway alert could not see).
      - 'ops/relay/health/registry-wal-signals.py'
      - 'ops/relay/health/test_registry_wal_signals.py'
      # The relay-health ingest (ADR 1058) writes the dashboard allowlist.
      - 'ops/relay/health/relay-metrics-ingest.py'
      - 'ops/relay/health/test_relay_metrics_ingest_allowlist.py'
      - 'ops/relay/health/test_relay_metrics_ingest.py'
      - 'ops/relay/health/test_atomic_ingest.py'
      - 'ops/ci/check-grafana-dashboard-promql.sh'
      - 'ops/ci/check-textfile-exposition.sh'
      - 'ops/ci/check-blackbox-covers-registry.sh'
      - 'ops/ci/check-stream-exclusion-matches-relabel.sh'
      # The obs-host role's templates feed the blackbox coverage check.
      - 'ops/ansible/roles/obs-host/**'
      - 'ops/ansible/roles/observability/templates/alertmanager.yml.j2'
      - 'ops/ci/check-alertmanager-renders.py'
      - 'ops/ci/test_zenoh_admission_routing.py'
      - 'ops/ci/check-alert-severity-deliverable.py'
      # The dashboards are an input to the PromQL parse check.
      - 'ops/compose/goat-obs/grafana/dashboards/**'
      # A goatnet's group_vars are inputs to the stream-exclusion and blackbox
      # checks below.
      - 'ops/ansible/group_vars/**'
      - 'ops/ansible/roles/node-exporter/templates/link-capacity.prom.j2'
      - '.github/workflows/goat-obs-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

# Supersede in-flight runs for the same ref. A push during review used to
# leave the previous run going to completion, so a branch pushed three
# times paid three times for an answer only the last one needed. Keyed on
# the workflow plus the ref, and NEVER cancels on main — a merge-commit run
# is the one whose result is recorded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  prometheus-rules:
    name: promtool check + unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Pinned to the SAME Prometheus the goat-obs stack runs
      # (prom/prometheus:v2.54.1 in ops/compose/goat-obs/docker-compose.yml).
      # Validating with a newer promtool than the deployed server would let a
      # rule pass CI and fail to load in production, so bump this WITH the
      # compose image pin, not independently.
      PROM_VERSION: '2.54.1'
      PROM_SHA256: '31715ef65e8a898d0f97c8c08c03b6b9afe485ac84e1698bcfec90fc6e62924f'
    steps:
      - uses: actions/checkout@v4

      - name: install promtool (version-pinned + checksum-verified)
        run: |
          set -euo pipefail
          tarball="prometheus-${PROM_VERSION}.linux-amd64.tar.gz"
          curl -fsSLO "https://github.com/prometheus/prometheus/releases/download/v${PROM_VERSION}/${tarball}"
          echo "${PROM_SHA256}  ${tarball}" | sha256sum -c -
          tar xzf "${tarball}"
          sudo install -m 0755 "prometheus-${PROM_VERSION}.linux-amd64/promtool" /usr/local/bin/promtool
          promtool --version

      # Parse + structural validation of every rule Prometheus will load. The
      # glob mirrors prometheus.yml's `rule_files: /etc/prometheus/rules/*.yml`
      # exactly, so CI covers precisely the set the server reads — no more, no
      # less.
      - name: promtool check rules
        working-directory: ops/compose/goat-obs/prometheus
        run: promtool check rules rules/*.yml

      # Behavioural tests. `check rules` only proves an expression PARSES; it
      # cannot tell you a label matcher selects the series you meant, or that
      # an absent() guard fires on a deleted metric without also firing forever
      # on a goatnet that never had it. Globbing tests/*.yml rather than
      # tests/*.test.yml on purpose: everything in that directory is a suite,
      # and a stricter glob would silently skip a misnamed file — the same
      # class of silent gap this job exists to close.
      #
      # tests/ is deliberately NOT under rules/: Prometheus loads
      # /etc/prometheus/rules/*.yml and the goat-obs compose bind-mounts only
      # ./prometheus/rules, so these fixtures are never visible to the server.
      - name: promtool test rules
        working-directory: ops/compose/goat-obs/prometheus
        run: promtool test rules tests/*.yml

      # The dashboards/ half, which nothing checked until ADR 1128. A panel
      # with a malformed expression ships fine and renders an empty graph —
      # indistinguishable from "no data", which on a CAPACITY dashboard is the
      # worst possible failure mode: an operator concludes the link is idle.
      # Reuses the promtool installed above, so it validates against the same
      # parser version the server runs.
      - name: dashboard PromQL parse check
        run: ops/ci/check-grafana-dashboard-promql.sh

      # Renders every Prometheus-textfile template in EVERY branch and lints
      # the output. A template that emits malformed exposition in one branch
      # makes node_exporter reject the WHOLE file and serve none of its
      # metrics — and an absent metric is indistinguishable from the honest
      # "not declared" state it was written to express. Shipped to ZAGROS on
      # exactly that way.
      - name: textfile exposition check
        run: |
          pip install --quiet jinja2
          ops/ci/check-textfile-exposition.sh

      # Two facts that must agree and nothing made them: the ^nova- relabel in
      # prometheus.yml rewrites `service` at ingest, and netview's SSE
      # exclusion matches against that same label from THREE homes. Deploying
      # the relabel silently broke the exclusion — the streams rejoined the
      # percentiles and the page reported a held-open stream lifetime (5.0 s)
      # as a response time. An operator screenshot caught it; nothing else did.
      - name: stream exclusion matches the relabel
        run: ops/ci/check-stream-exclusion-matches-relabel.sh

      # Probe coverage vs the service registry. The two lists live in DIFFERENT
      # host groups (an obs host is its own machine in its own group, and
      # group_vars cannot read across groups), so nothing made them agree. The
      # gap is silent in the direction that matters: cert observability is
      # per-target, and TlsCertExpiryUnobserved stays quiet while any one
      # target still reports a certificate — so one forgotten vhost renews
      # unwatched behind a green dashboard.
      - name: blackbox probes cover the declared services
        run: |
          pip install --quiet pyyaml
          ops/ci/check-blackbox-covers-registry.sh

      # WHERE THREE MORE RUN. The prometheus template render check, "loaded
      # alert rules have something feeding them" and "installed dashboards can
      # draw something" judge each goatnet's own declarations: its
      # isitup_services, its scrape targets and ops/pins/obs-metric-sources.yaml.
      # Those live with the goatnet's overlay, not in this tree, so the three
      # run on the assembled tree of the repository that holds them.
      - name: alertmanager templates render a clean pager severity — previously run by nothing
        run: python3 ops/ci/check-alertmanager-renders.py
      - name: admission pages preserve short failures and receiver fan-out
        run: python3 ops/ci/test_zenoh_admission_routing.py
      - name: every alert rule's severity is one the pager delivers — previously run by nothing
        run: python3 ops/ci/check-alert-severity-deliverable.py

  obs-python-tests:
    name: identity-reconcile + router probes + registry-wal unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # stdlib-only suites (they run as root cron/timer jobs on the mgmt host
      # with the system interpreter). compileall first: a syntax error in a
      # cron-invoked script otherwise surfaces as a silently missing metric.
      # budget-notify's suite moved with its tree to goatstuff.
      - name: portal registry host readers (sqlite and postgres eras)
        working-directory: ops/scripts
        run: |
          python -m pip install --quiet pyyaml
          python -m py_compile portal_registry_pg.py reap-orphans.py sync-slot-anchors.py
          python -W error::ResourceWarning -m unittest test_portal_registry_pg test_reap_orphans -v

      - name: identity-reconcile
        working-directory: ops/compose/goat-obs/identity-reconcile
        run: |
          python -m compileall -q .
          python -W error::ResourceWarning -m unittest discover -v

      - name: dormancy-report (ADR 1216 device expiry count)
        working-directory: ops/compose/goat-obs/dormancy-report
        run: |
          python -m compileall -q .
          python -W error::ResourceWarning -m unittest discover -v

      - name: zenoh-router-signals
        working-directory: ops/relay/health
        run: |
          python -m py_compile zenoh-router-signals.py
          python -W error::ResourceWarning -m unittest test_zenoh_router_signals -v

      - name: registry-wal-signals (portal registry WAL gauges)
        working-directory: ops/relay/health
        run: |
          python -m py_compile registry-wal-signals.py
          python -W error::ResourceWarning -m unittest test_registry_wal_signals -v

      - name: zenoh admission proxy and both exporters
        working-directory: ops/relay/health
        run: |
          bash -n zenoh-health-probe.sh
          python -m py_compile zenoh-health-to-prom.py
          python -m py_compile relay-metrics-ingest.py
          python -W error::ResourceWarning -m unittest test_zenoh_admission_probe -v

      - name: relay-metrics-ingest (allowlist route input bounds)
        working-directory: ops/relay/health
        run: |
          python -m py_compile relay-metrics-ingest.py
          python -W error::ResourceWarning -m unittest test_relay_metrics_ingest_allowlist -v

      - name: relay-metrics-ingest (independent current-health processing)
        working-directory: ops/relay/health
        run: |
          python -W error::ResourceWarning -m unittest test_relay_metrics_ingest -v

      - name: relay metrics atomic publication
        working-directory: ops/relay/health
        run: |
          python -m py_compile relay-metrics-ingest.py
          python -W error::ResourceWarning -m unittest test_atomic_ingest -v
