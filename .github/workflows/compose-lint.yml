name: compose-lint

# Validates our docker-compose specs parse cleanly with all interpolated
# env vars resolved. Catches missing required vars (POSTGRES_SUPERUSER_PASSWORD),
# invalid references, volume-name typos, and bad override-file merges before
# they hit the pilot.

on:
  # push: on main REMOVED — this workflow is a guard, not a publisher. It
  # already gates the pull request, and a squash merge puts the reviewed diff
  # on main unchanged, so re-running it there re-verifies a commit whose answer
  # is known. 98 of 119 workflows did that; measured at 4,787 runs in
  # one day, roughly half of them this shape.
  #
  # An earlier draft of this comment also said "main is protected from
  # force-push". IT IS NOT — this plan cannot have branch protection at all
  # (the API answers "Upgrade to GitHub Pro"). A force-push to main therefore
  # bypasses this guard entirely. That is a real gap and it is 's, not
  # something a paths filter or a trigger change can close.
  # Publishers keep push: on purpose — the merge commit is the artifact.
  pull_request:
    paths:
      - 'ops/compose/**'
      - '.github/workflows/compose-lint.yml'

# Supersede in-flight runs for the same ref. A push during review used to
# leave the previous run going to completion, so a branch pushed three
# times paid three times for an answer only the last one needed. Keyed on
# the workflow plus the ref, and NEVER cancels on main — a merge-commit run
# is the one whose result is recorded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ops/compose/mgmt-host
    env:
      # Values match .env.example — only used for interpolation validation.
      # CI is not actually bringing containers up.
      SITE_NAME: ci
      POSTGRES_SUPERUSER_PASSWORD: ci-test-only
      # The compose files name no image for postgres-a/-b or signal-a/-b; a
      # deploy renders these two from the goatnet's pins. Any reference
      # satisfies interpolation here.
      POSTGRES_SPOCK_IMAGE: ghcr.io/example/postgres-spock:sha-abc1234
      SIGNAL_SERVER_IMAGE: ghcr.io/example/signal-server:sha-abc1234
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Phase 1 base (docker-compose.yml)
        run: docker compose config --quiet

      - name: Phase 2 override merged with base
        run: docker compose -f docker-compose.yml -f docker-compose.phase2.yml config --quiet
