# Publishes goat, the operator CLI, on a tag goat-cli-v<semver>, e.g. goat-cli-v0.5.14.
# The version in crates/goat-cli/Cargo.toml must equal the tag's semver.
# workflow_dispatch builds and signs without publishing.
name: goat-release

on:
  push:
    tags:
      - 'goat-cli-v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/_release-binary.yml
    with:
      package: goat-cli
      bin: goat
      tag_prefix: goat-cli-v
      notes: goat.md
      # The book the goat-docs role serves at docs.<site>, built from this tag.
      docs_script: docs/goat-cli-book/build.sh
      docs_asset: goat-docs.tar.gz
