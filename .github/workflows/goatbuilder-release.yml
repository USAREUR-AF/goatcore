# Publishes goatbuilder on a tag goatbuilder/v<semver>, e.g. goatbuilder/v0.4.1.
# The version in crates/goatbuilder/Cargo.toml must equal the tag's semver.
# workflow_dispatch builds and signs without publishing.
name: goatbuilder-release

on:
  push:
    tags:
      - 'goatbuilder/v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/_release-binary.yml
    with:
      package: goatbuilder
      bin: goatbuilder
      tag_prefix: goatbuilder/v
      notes: goatbuilder.md
      # goatbuilder drives Unix hosts and does not build for Windows.
      windows: false
