# stable-guard: keeps the branch `stable` a pointer to whole-tree releases (ADR 1231).
#
# `stable` is moved only by .github/workflows/stable.yml, to a goatcore/v tag.
# GitHub cannot restrict a branch to one workflow, so this workflow guards it:
#   - a pull request opened against `stable` is closed with a note that
#     contributions go to `main`;
#   - a push to `stable` by a person is checked: the new head must carry a
#     goatcore/v tag, and the job fails when it does not.
# A ruleset on `stable` refuses deleting it and moving it backwards.
#
# pull_request_target runs this file as it is on the base branch and never
# checks out, builds or runs the pull request's code.
name: stable-guard

on:
  pull_request_target:
    branches: [stable]
    types: [opened, reopened]
  push:
    branches: [stable]

permissions:
  contents: read

concurrency:
  group: stable-guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  close:
    name: a pull request against stable is closed
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write   # to comment on and close the pull request
    steps:
      - name: close it and say where contributions go
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr close "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --comment "Thank you. The branch \`stable\` only points at the newest release and takes no pull requests. Please open this against \`main\`; CONTRIBUTING.md has the steps."

  verify:
    name: stable points at a whole-tree release
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: check out stable with every tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: the head of stable carries a goatcore/v tag
        run: |
          tags="$(git tag --points-at HEAD | grep '^goatcore/v' || true)"
          if [ -z "$tags" ]; then
            echo "::error title=stable-guard::stable was moved to $(git rev-parse --short HEAD), which is not a whole-tree release. Only the workflow 'stable' moves this branch."
            exit 1
          fi
          echo "stable is at $tags"
