name: zenoh-pqc-image

# Builds ops/zenoh/pqc-image/Dockerfile — the PQ-hybrid-TLS zenoh router
# (docs/design/zenoh-pqc-tls.md): digest-pinned upstream eclipse/zenoh 1.9.0
# with /zenohd rebuilt from the same source tag + the 14-line aws-lc-rs
# CryptoProvider patch (X25519MLKEM768 preferred). Publishes to
# ghcr.io/usareur-af/zenoh-pqc.
#
# Per-arch native build + manifest combine (same pattern as
# goat-relay-image.yml): linux/amd64 on ubuntu-24.04, linux/arm64 on
# ubuntu-24.04-arm. Native per-arch avoids cross-compiling the Rust build.
# The smoke step boots the built image with the fleet plugin set (rest +
# storage_manager + the upstream rocksdb backend .so the ansible role
# bind-mounts) and fails on plugin-compatibility mismatch — the F-122/F-136
# ABI class is checked fail-closed on every build, per-arch.
#
# IMPORTANT (fleet pinning discipline): deploys pin the multi-arch LIST
# digest from the merge job, never a per-arch leaf.

on:
  push:
    branches: [main]
    paths:
      - 'ops/zenoh/pqc-image/**'
      - '.github/workflows/zenoh-pqc-image.yml'
    tags: ['zenoh-pqc/v*']
  pull_request:
    paths:
      - 'ops/zenoh/pqc-image/**'
      - '.github/workflows/zenoh-pqc-image.yml'
  workflow_dispatch:

# Self-referential namespace (docs/design/usareur-af-repo-migration.md, Phase 2):
# REGISTRY_IMAGE is resolved per-job from the repo owner, lowercased (ghcr rejects
# uppercase, so `${{ github.repository_owner }}` alone breaks for usareur-af — the
# reason #154 hardcoded usareur-af; lowercasing is the fix that keeps it self-
# referential). Each repo publishes to its OWN namespace.
env:
  IMAGE_NAME: zenoh-pqc

# Supersede in-flight runs for the same ref. A push during review used to
# leave the previous run going to completion, so a branch pushed three
# times paid three times for an answer only the last one needed. Keyed on
# the workflow plus the ref, and NEVER cancels on main — a merge-commit run
# is the one whose result is recorded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-24.04
          - arch: arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Resolve self-referential registry namespace (lowercased)
        run: echo "REGISTRY_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (${{ matrix.arch }})
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ops/zenoh/pqc-image
          file: ops/zenoh/pqc-image/Dockerfile
          target: runtime
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: zenoh-pqc:smoke-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=zenoh-pqc-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=zenoh-pqc-${{ matrix.arch }}
      - name: Smoke — plugin ABI + PQ provider boot
        run: |
          set -euo pipefail
          # Fetch the exact rocksdb backend .so the ansible role bind-mounts
          # (ops/ansible/roles/zenoh/defaults/main.yml url template).
          arch_triple="$([ "${{ matrix.arch }}" = amd64 ] && echo x86_64 || echo aarch64)"
          curl -sSfL -o /tmp/rocksdb.zip \
            "https://github.com/eclipse-zenoh/zenoh-backend-rocksdb/releases/download/1.9.0/zenoh-backend-rocksdb-1.9.0-${arch_triple}-unknown-linux-musl-standalone.zip"
          mkdir -p /tmp/plugins && unzip -o /tmp/rocksdb.zip -d /tmp/plugins
          cat > /tmp/smoke.json5 <<'EOF'
          {
            mode: "router",
            listen: { endpoints: ["tcp/0.0.0.0:7447"] },
            plugins_loading: { enabled: true, search_dirs: ["/", "/opt/zenoh/plugins"] },
            plugins: {
              rest: { http_port: 8000 },
              storage_manager: {
                backend_search_dirs: ["/opt/zenoh/plugins"],
                volumes: { rocksdb: {} },
                storages: { smoke: { key_expr: "smoke/**", volume: { id: "rocksdb", dir: "smoke", create_db: true } } },
              },
            },
          }
          EOF
          docker run -d --name smoke \
            -v /tmp/smoke.json5:/smoke.json5:ro \
            -v /tmp/plugins:/opt/zenoh/plugins:ro \
            zenoh-pqc:smoke-${{ matrix.arch }} -c /smoke.json5
          sleep 8
          docker logs smoke 2>&1 | tee /tmp/smoke.log
          if grep -qi 'compatibility mismatch\|Cannot spawn\|panic' /tmp/smoke.log; then
            echo "::error::plugin ABI or boot failure"; exit 1
          fi
          # rest plugin answering == zenohd + plugins all live
          docker exec smoke sh -c 'wget -qO- http://127.0.0.1:8000/@/local/router' | head -c 300
          docker rm -f smoke
      - name: Push by digest (${{ matrix.arch }})
        if: github.event_name != 'pull_request'
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ops/zenoh/pqc-image
          file: ops/zenoh/pqc-image/Dockerfile
          target: runtime
          platforms: linux/${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=zenoh-pqc-${{ matrix.arch }}
          outputs: |
            type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.push.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Resolve self-referential registry namespace (lowercased)
        run: echo "REGISTRY_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}" >> "$GITHUB_ENV"
      - name: Download digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,prefix=sha-
            type=match,pattern=zenoh-pqc/v(.*),group=1,prefix=v
      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        env:
          # Pass JSON via env var — direct ${{ }} interpolation of multi-line
          # JSON into the bash body corrupts it (embedded quotes break the
          # heredoc), and jq parses `Invalid literal at line 1, column 6`.
          META_JSON: ${{ steps.meta.outputs.json }}
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$META_JSON") \
            $(printf "${{ env.REGISTRY_IMAGE }}@sha256:%s " *)
      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:latest
