name: e2e-canary-image

# The canary image the deployment e2e harness moves (docs/design/deployment-e2e.md):
# built like every other component image, so the live canary on a dev goatnet pulls a
# digest CI wrote from a merged commit. The hermetic tier builds its own copies
# into a local registry and never uses this one.
on:
  push:
    branches: [main]
    paths:
      - 'ops/e2e/canary/**'
      - '.github/workflows/e2e-canary-image.yml'
    tags: ['e2e-canary/v*']
  pull_request:
    paths:
      - 'ops/e2e/canary/**'
      - '.github/workflows/e2e-canary-image.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  image:
    uses: ./.github/workflows/_image-build.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      image_name: e2e-canary
      tag_prefix: e2e-canary
      context: ops/e2e/canary
      file: ops/e2e/canary/Dockerfile
