name: vm-types

# One machine of each target type that has an ops/e2e/vm/types/<type>.sh, from a
# published Ubuntu cloud image to `doctor --target`, in a VM on the runner (gate
# J1; docs/design/goatbuilder-build-targets.md section 3.6). Reads nothing but
# this checkout and the public image and package mirrors; no secret, no host.
# Every job prints whether its runner has /dev/kvm before anything uses it.
#
# Rollback: rm this file.
on:
  pull_request:
    paths:
      - 'ops/e2e/vm/**'
      - 'ops/goatbuilder/targets/**'
      - 'ops/ansible/mgmt-host-baseline.yml'
      - 'ops/ansible/wireguard-kmod.yml'
      - 'ops/ansible/breakglass-nodes.yml'
      - 'ops/ansible/roles/breakglass-node/**'
      - 'ops/ansible/simple-bn.yml'
      - 'ops/ansible/roles/simple-bn/**'
      - 'ops/simple-bn/**'
      - 'ops/ansible/octo-pod-deploy.yml'
      - 'ops/ansible/first-bite-deploy.yml'
      - 'ops/ansible/goat-processors-runner-deploy.yml'
      - 'ops/ansible/roles/release-file/**'
      - 'ops/scripts/tap-endstate.py'
      - 'crates/goatbuilder/src/joinnode.rs'
      - 'crates/goatbuilder/src/targets.rs'
      - 'crates/goatbuilder/src/source.rs'
      - 'crates/goatbuilder/src/tap_machine.rs'
      - '.github/workflows/vm-types.yml'
  schedule:
    - cron: '43 2 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  amd64:
    name: ${{ matrix.type }} (amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        type: [network-tap, breakglass, federation-boundary, octo-pod, simple-boundary, first-bite, example-overlay, goat-processors, network-jump]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/apt-failover
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: KVM on this runner, as it is
        run: ls -l /dev/kvm || echo "no /dev/kvm on this runner"
      - name: QEMU and the controller's tools
        timeout-minutes: 8
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 update -qq
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 install -y -qq --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils ubuntu-cloudimage-keyring gpgv openssh-client
          python3 -m pip install --quiet --retries 5 --timeout 30 pyyaml jsonschema jmespath 'ansible-core>=2.16,<2.21'
          ops/ci/ansible-galaxy-install.sh -r ops/ansible/requirements.yml
          if [ -e /dev/kvm ]; then sudo chmod 0666 /dev/kvm; fi
      - name: Install Rust toolchain (1.100.0)
        uses: dtolnay/rust-toolchain@d5e4d57b030548f435d0befec15ff413a2c60eff # 1.100.0
      - name: Cache cargo registry + build target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/target
          key: vm-types-cargo-${{ runner.os }}-${{ hashFiles('crates/Cargo.lock') }}
      - name: Build goatbuilder
        working-directory: crates
        run: cargo build -p goatbuilder
      - name: The machine, from the cloud image to doctor --target
        run: ops/e2e/vm/run.sh "${{ matrix.type }}" --goatbuilder crates/target/debug/goatbuilder --work "$RUNNER_TEMP/vm" --record "$RUNNER_TEMP/vm-record"
      - name: Upload the run record
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vm-types-${{ matrix.type }}-amd64
          path: ${{ runner.temp }}/vm-record
          if-no-files-found: warn

  arm64:
    # No hosted arm64 runner has /dev/kvm, so arm64 is emulated, from an image whose
    # packages are already upgraded (ops/e2e/vm/prepare-image.sh), kept by the published
    # image's digest. Not on a pull request: it takes most of an hour, and making the
    # image another.
    name: network-tap (arm64, emulated)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      VM_IMAGES: ${{ github.workspace }}/../vm-images
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/apt-failover
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: QEMU and the controller's tools
        timeout-minutes: 8
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 update -qq
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 install -y -qq --no-install-recommends qemu-system-arm qemu-efi-aarch64 ipxe-qemu qemu-utils cloud-image-utils ubuntu-cloudimage-keyring gpgv openssh-client
          python3 -m pip install --quiet --retries 5 --timeout 30 pyyaml jsonschema jmespath 'ansible-core>=2.16,<2.21'
          ops/ci/ansible-galaxy-install.sh -r ops/ansible/requirements.yml
      - name: Install Rust toolchain (1.100.0)
        uses: dtolnay/rust-toolchain@d5e4d57b030548f435d0befec15ff413a2c60eff # 1.100.0
      - name: Build goatbuilder
        working-directory: crates
        run: cargo build -p goatbuilder
      - name: The published image's digest
        id: base
        run: |
          set -euo pipefail
          sha="$(curl -fsSL --retry 3 https://cloud-images.ubuntu.com/releases/24.04/release/SHA256SUMS | sed -n 's/^\([0-9a-f]\{64\}\) [ *]ubuntu-24.04-server-cloudimg-arm64.img$/\1/p')"
          [ -n "$sha" ] && echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Cache the prepared image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/../vm-images/24.04
          key: vm-prepared-arm64-${{ steps.base.outputs.sha }}-${{ hashFiles('ops/e2e/vm/prepare-image.sh') }}
      - name: Prepare the image, where it is not kept
        run: compgen -G "$VM_IMAGES/24.04/prepared-arm64-*.qcow2" >/dev/null || ops/e2e/vm/prepare-image.sh --arch arm64
      - name: The machine, from the prepared image to doctor --target
        run: VM_CPUS=4 ops/e2e/vm/run.sh network-tap --arch arm64 --prepared --goatbuilder crates/target/debug/goatbuilder --work "$RUNNER_TEMP/vm" --record "$RUNNER_TEMP/vm-record"
      - name: Upload the run record
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vm-types-network-tap-arm64
          path: ${{ runner.temp }}/vm-record
          if-no-files-found: warn
