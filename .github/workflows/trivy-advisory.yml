name: Trivy advisory scan

on:
  pull_request:
    branches: [main]
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '**/go.mod'
      - '**/go.sum'
      - '**/package.json'
      - '**/package-lock.json'
      - '**/requirements*.txt'
      - '**/pyproject.toml'
      - '**/poetry.lock'
      - '**/Dockerfile*'
      - '**/*.tf'
      - '**/*.tfvars'
      - '**/*.yaml'
      - '**/*.yml'
      - 'ops/scripts/trivy-scan.py'
      - 'ops/scripts/trivy-images.txt'
      - '.github/workflows/trivy-advisory.yml'
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy:
    name: Trivy advisory scan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Findings and scanner/setup/report errors are informational during this
    # rollout. The job summary and artifacts retain the outcome for review.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      # Installed from the GitHub release and checked against a pinned digest,
      # not through setup-trivy: its installer downloads via get.trivy.dev,
      # which hosted runners do not resolve (curl exit 6).
      - name: Install Trivy
        env:
          TRIVY_VERSION: 0.75.0
          TRIVY_SHA256: c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f
        run: |
          set -euo pipefail
          tarball="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSL --retry 3 --retry-delay 5 -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/$tarball"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$HOME/.local/bin" trivy
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/trivy" --version

      - name: Scan repository and curated images
        id: scan
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: python3 ops/scripts/trivy-scan.py --no-secrets

      - name: Upload Trivy reports
        id: reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-reports-${{ github.run_id }}
          path: .envrc.local.d/trivy-reports/**
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

      - name: Report workflow outcome
        if: always()
        env:
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
          REPORT_OUTCOME: ${{ steps.reports.outcome }}
        run: |
          report_count=$(find .envrc.local.d/trivy-reports -type f -name '*.json' 2>/dev/null | wc -l | tr -d ' ')
          {
            echo
            echo '### Trivy workflow status'
            if [ "$SCAN_OUTCOME" = success ]; then
              echo 'The scan command completed. Review the severity table above for findings.'
            else
              echo "The scan command outcome was: $SCAN_OUTCOME. Review the logs; this advisory job does not block the PR."
            fi
            if [ "$REPORT_OUTCOME" = success ] && [ "$report_count" -gt 0 ]; then
              echo 'The HTML summary and JSON reports were uploaded as a 14-day workflow artifact.'
            else
              echo "No JSON reports were uploaded (upload outcome: $REPORT_OUTCOME; report files: $report_count)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
