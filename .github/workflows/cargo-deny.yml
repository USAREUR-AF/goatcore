name: cargo-deny

# Rust license / bans / sources gate. Single responsibility:
#
#   - licenses: enforce ADR 0110 + ADR 0111 Tier 1-4 permissive allowlist
#               (Tier-5 disqualified by omission). License posture has
#               no automated check today on the Rust side.
#
#   - bans:     wildcard deps denied; multi-version warns.
#
#   - sources:  unknown-registry + unknown-git denied; only crates.io
#               and explicitly-named git remotes allowed.
#
# RustSec advisory scanning is the responsibility of the sibling
# `.github/workflows/rust-audit.yml` (cargo-audit). This workflow
# deliberately does NOT scan advisories — see deny.toml header.
#
# Triggers mirror rust-audit.yml so the two gates run as a pair on every
# Cargo.lock / Cargo.toml change.

on:
  # push: on main REMOVED — this workflow is a guard, not a publisher. It
  # already gates the pull request, and a squash merge puts the reviewed diff
  # on main unchanged, so re-running it there re-verifies a commit whose answer
  # is known. 98 of 119 workflows did that; measured at 4,787 runs in
  # one day, roughly half of them this shape.
  #
  # An earlier draft of this comment also said "main is protected from
  # force-push". IT IS NOT — this plan cannot have branch protection at all
  # (the API answers "Upgrade to GitHub Pro"). A force-push to main therefore
  # bypasses this guard entirely. That is a real gap and it is 's, not
  # something a paths filter or a trigger change can close.
  # Publishers keep push: on purpose — the merge commit is the artifact.
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      - '**/Cargo.toml'
      - '.github/workflows/cargo-deny.yml'

concurrency:
  group: cargo-deny-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cargo-deny:
    name: cargo-deny (root workspace)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run cargo-deny (licenses + bans + sources, advisories handled by rust-audit.yml)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check licenses bans sources
          arguments: --workspace

  # The action points at the repo-root Cargo.toml + deny.toml. The grant-crypto
  # subtree (data-access M2, ADR 1106) is TWO separate workspaces the root
  # `--workspace` run does not descend into: the SDK (ops/grant-crypto/sdk — core +
  # capi) and the grant-keyd service (ops/grant-crypto/keyd, pulling zenoh's
  # transitive tree). Both get scanned here. cargo-deny only auto-discovers
  # deny.toml next to the target manifest and takes --config only as a top-level
  # flag (before the subcommand), which the action can't express — so this runs the
  # CLI directly, mirroring rust-audit.yml's `cargo install` pattern. Both workflows
  # trigger on the same Cargo.toml/lock changes, so the install cost profile matches.
  cargo-deny-grant-crypto:
    name: cargo-deny (ops/grant-crypto sdk + keyd)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: stable
          components: ''
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Run cargo-deny against the SDK workspace with the root policy
        run: cargo-deny --manifest-path ops/grant-crypto/sdk/Cargo.toml --config deny.toml check licenses bans sources
      - name: Run cargo-deny against the grant-keyd workspace with the root policy
        run: cargo-deny --manifest-path ops/grant-crypto/keyd/Cargo.toml --config deny.toml check licenses bans sources
