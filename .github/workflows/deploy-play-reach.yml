# Gate row J28 (docs/design/goatbuilder-v1-gate.md): every ops/ansible/*-deploy.yml
# is reached by a goatbuilder verb, or listed in ops/goatbuilder/deploy-plays.yaml
# with its reason (`unreached:`), or listed as owed to the gate row that will
# route it (`owed:`); and so is every deploy play of the other public
# repositories the list declares (`repositories:`, each at a full commit).
# Blocking (--strict): a play that is none of these, a list entry a verb now
# reaches, an entry for a play that is gone, or a declared repository that
# cannot be read at its commit fails the job.
#
# Rollback: delete this file, ops/ci/check-deploy-plays-reached.py and
# ops/goatbuilder/deploy-plays.yaml.
name: deploy-play-reach

on:
  pull_request:
    paths:
      - '.github/workflows/deploy-play-reach.yml'
      - 'ops/ci/check-deploy-plays-reached.py'
      - 'ops/goatbuilder/deploy-plays.yaml'
      - 'ops/ansible/*.yml'
      - 'ops/pins/fleet-pins.yaml'
      - 'ops/pins/lite-pins.yaml'
      - 'ops/goatbuilder/targets/**'
      - 'crates/goatbuilder/src/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  reach:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Every deploy play is reached by a verb, or listed with its reason or the row it is owed to
        run: |
          set -o pipefail
          pip install --quiet pyyaml
          python3 ops/ci/check-deploy-plays-reached.py --self-test
          # The other public repositories' plays, each fetched at the commit the
          # list pins (repositories:). Read as YAML only; nothing of theirs runs.
          python3 ops/ci/check-deploy-plays-reached.py --strict --fetch "$RUNNER_TEMP/deploy-play-repositories" | tee -a "$GITHUB_STEP_SUMMARY"
