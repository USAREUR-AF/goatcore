# Gate row J28 (docs/design/goatbuilder-v1-gate.md): every ops/ansible/*-deploy.yml
# is reached by a goatbuilder verb, or listed in ops/goatbuilder/deploy-plays.yaml
# with its reason. First as a report (goatbuilder-build-targets.md section 4.6,
# step 4): it names today's gaps and exits 0. It becomes blocking (--strict) once
# each gap has a component, a phase, a type or a listed reason.
#
# Rollback: delete this file, ops/ci/check-deploy-plays-reached.py and
# ops/goatbuilder/deploy-plays.yaml.
name: deploy-play-reach

on:
  pull_request:
    paths:
      - '.github/workflows/deploy-play-reach.yml'
      - 'ops/ci/check-deploy-plays-reached.py'
      - 'ops/goatbuilder/deploy-plays.yaml'
      - 'ops/ansible/*.yml'
      - 'ops/pins/fleet-pins.yaml'
      - 'ops/pins/lite-pins.yaml'
      - 'ops/goatbuilder/targets/**'
      - 'crates/goatbuilder/src/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  reach:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Every deploy play is reached by a verb or listed (a report until each gap is answered)
        run: |
          set -o pipefail
          pip install --quiet pyyaml
          python3 ops/ci/check-deploy-plays-reached.py --self-test
          python3 ops/ci/check-deploy-plays-reached.py | tee -a "$GITHUB_STEP_SUMMARY"
