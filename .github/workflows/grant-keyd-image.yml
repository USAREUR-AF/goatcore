name: grant-keyd-image
# Builds ops/grant-crypto/keyd/Dockerfile — the grant-keyd key-distribution
# daemon (ADRs 1094 + 1106, docs/rfc/encryption-control-mechanism) — and
# publishes to ghcr.io/usareur-af/grant-keyd.
#
# Until this workflow existed the image was built on a laptop and `docker load`ed
# onto the ZAGROS Thor, so no pin could name it, the release ladder could not carry
# it, and no other goatnet could pull it. Same shape as
# onboard-runner-image: per-arch native build + multi-arch manifest combine.
# Build context is ops/grant-crypto (the parent): keyd path-depends on the SDK
# core at sdk/core, so both subtrees must be in the context.
#
# Tag scheme:
#   - On main push:  `:latest` + `:sha-<short>`
#   - On any build:  `:sha-<short>` (always)
#
# Build body: .github/workflows/_image-build.yml.

on:
  push:
    branches: [main]
    paths:
      - 'ops/grant-crypto/keyd/**'
      - 'ops/grant-crypto/sdk/core/**'
      - '.github/workflows/grant-keyd-image.yml'
    tags: ['grant-keyd/v*']
  pull_request:
    paths:
      - 'ops/grant-crypto/keyd/**'
      - 'ops/grant-crypto/sdk/core/**'
      - '.github/workflows/grant-keyd-image.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  image:
    uses: ./.github/workflows/_image-build.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      image_name: grant-keyd
      tag_prefix: grant-keyd
      context: ops/grant-crypto
      file: ops/grant-crypto/keyd/Dockerfile
      description: "grant-keyd — grant-keyed encryption key-distribution daemon"
