# Builds one of this repository's command-line binaries for five platforms,
# signs its checksums, and attaches everything to the GitHub Release of the tag.
# Called by goat-release.yml and goatbuilder-release.yml; runs with GITHUB_TOKEN
# alone. A caller that names a docs_script also gets the binary's book.
#
# Assets, per release:
#   <bin>-linux-amd64    ubuntu-24.04,     linked against glibc 2.31 (Ubuntu 20.04, Debian 11 and later)
#   <bin>-linux-arm64    ubuntu-24.04-arm, linked against glibc 2.31
#   <bin>-darwin-amd64   macos-15, cross-compiled to x86_64-apple-darwin,
#                        ad-hoc signed, not notarized
#   <bin>-darwin-arm64   macos-15, ad-hoc signed, not notarized
#   <bin>-windows-amd64.exe  windows-latest, MSVC (unless the caller sets
#                        windows: false)
#   <asset>.sha256       one per binary
#   <docs_asset>         the binary's book, when the caller names a docs_script
#                        (built on ubuntu-24.04 from this tag's binary), with
#                        its .sha256
#   SHA256SUMS           every asset's digest, the book's included
#   SHA256SUMS.cosign-bundle  a keyless cosign signature over SHA256SUMS, made
#                        under this workflow's GitHub OIDC identity
#
# The names are the ones `goat update` and `goatbuilder update` fetch
# (crates/goat-selfupdate: <bin>-<os>-<arch>, with .exe on Windows).
#
# darwin-amd64 is cross-compiled on Apple Silicon: GitHub's Intel macOS runner
# pool is winding down and a job queued for one can wait hours. The Xcode SDK
# on macos-15 is universal, so the cross build needs no extra configuration;
# the binary cannot run on the arm64 host (no Rosetta), so its --version check
# is replaced by a check that it is an x86_64 Mach-O. goatbuilder checks the signature
# against the certificate identity ^https://github.com/<this repository>/, so
# the signature must be made here, in this repository, and nowhere else.

name: release-binary

on:
  workflow_call:
    inputs:
      package:
        description: cargo package under crates/
        type: string
        required: true
      bin:
        description: binary name, and the prefix of every asset
        type: string
        required: true
      tag_prefix:
        description: the release tag minus its semver, e.g. goatbuilder/v
        type: string
        required: true
      notes:
        description: release notes file under .github/release-notes/
        type: string
        required: true
      windows:
        description: build the windows-amd64 leg (false for a binary that does not build on Windows)
        type: boolean
        required: false
        default: true
      docs_script:
        description: >-
          repository-relative script that builds the binary's book, called as
          `<script> <binary> <output .tar.gz>` and writing <output>.sha256 beside
          it; empty builds no book
        type: string
        required: false
        default: ''
      docs_asset:
        description: the book's asset name, e.g. goat-docs.tar.gz (required with docs_script)
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  nominator:
    name: the tag is on main and pushed by a repository admin
    if: startsWith(github.ref_name, inputs.tag_prefix) && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: The pusher holds the admin role
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          role=$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${GITHUB_ACTOR}/permission" --jq .role_name 2>/dev/null || echo unknown)
          echo "${GITHUB_ACTOR} holds role: ${role}"
          if [ "$role" != admin ]; then
            echo "::error::${GITHUB_ACTOR} holds the '${role}' role; only a repository admin cuts a release. Nothing is built for ${GITHUB_REF_NAME}."
            exit 1
          fi
      - name: The tagged commit is on main
        run: |
          set -euo pipefail
          git fetch -q origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not on main. Nothing is built."
            exit 1
          fi

  plan:
    name: the platforms this binary builds for
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          WINDOWS: ${{ inputs.windows }}
        run: |
          set -euo pipefail
          # glibc: the Linux glibc floor, linked by cargo-zigbuild, never the runner's.
          # cross: the binary is built for an architecture the runner cannot execute.
          legs='[
            {"runner":"ubuntu-24.04",    "os_label":"linux",  "arch":"amd64","rust_target":"x86_64-unknown-linux-gnu", "glibc":"2.31","cross":false,"ext":""},
            {"runner":"ubuntu-24.04-arm","os_label":"linux",  "arch":"arm64","rust_target":"aarch64-unknown-linux-gnu","glibc":"2.31","cross":false,"ext":""},
            {"runner":"macos-15",        "os_label":"darwin", "arch":"amd64","rust_target":"x86_64-apple-darwin",      "glibc":"",    "cross":true, "ext":""},
            {"runner":"macos-15",        "os_label":"darwin", "arch":"arm64","rust_target":"aarch64-apple-darwin",     "glibc":"",    "cross":false,"ext":""},
            {"runner":"windows-latest",  "os_label":"windows","arch":"amd64","rust_target":"x86_64-pc-windows-msvc",   "glibc":"",    "cross":false,"ext":".exe"}
          ]'
          if [ "$WINDOWS" != true ]; then
            legs="$(jq -c 'map(select(.os_label != "windows"))' <<<"$legs")"
          fi
          matrix="$(jq -c '{include: .}' <<<"$legs")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          jq -r '.include[] | "- \(.os_label)-\(.arch) on \(.runner)"' <<<"$matrix" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: build ${{ matrix.os_label }}-${{ matrix.arch }}
    needs: [nominator, plan]
    # workflow_dispatch has no tag: nominator is skipped and the build runs.
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.nominator.result == 'success' || needs.nominator.result == 'skipped') }}
    runs-on: ${{ matrix.runner }}
    # A cold-cache release build on the Windows runner takes over 20 minutes.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    defaults:
      run:
        shell: bash
        working-directory: crates
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
        with:
          targets: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: crates
          key: release-${{ inputs.package }}-${{ matrix.rust_target }}

      - name: NASM (Windows), which ring's x86_64 assembly needs under MSVC
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1

      - name: Python for zig (Linux)
        if: matrix.glibc != ''
        id: python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: zig and cargo-zigbuild (Linux), to link against the glibc floor and not the runner's
        if: matrix.glibc != ''
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
          ZIGLANG_VERSION: '0.16.0'
          CARGO_ZIGBUILD_VERSION: '0.23.4'
        run: |
          set -euo pipefail
          "$PYTHON" -m pip install --quiet "ziglang==${ZIGLANG_VERSION}"
          cargo install --locked cargo-zigbuild --version "=${CARGO_ZIGBUILD_VERSION}"

      - name: cargo build --release --locked -p ${{ inputs.package }}
        env:
          PKG: ${{ inputs.package }}
          RUST_TARGET: ${{ matrix.rust_target }}
          GLIBC_FLOOR: ${{ matrix.glibc }}
          CARGO_ZIGBUILD_PYTHON_PATH: ${{ steps.python.outputs.python-path }}
        run: |
          set -euo pipefail
          if [ -n "$GLIBC_FLOOR" ]; then
            cargo zigbuild --release --locked -p "$PKG" --target "$RUST_TARGET.$GLIBC_FLOOR"
          else
            cargo build --release --locked -p "$PKG" --target "$RUST_TARGET"
          fi

      - name: Refuse a Linux binary that needs a newer glibc than the floor
        if: matrix.glibc != ''
        env:
          BIN: target/${{ matrix.rust_target }}/release/${{ inputs.bin }}
          GLIBC_FLOOR: ${{ matrix.glibc }}
        run: |
          set -euo pipefail
          need="$(objdump -T "$BIN" | grep -o 'GLIBC_[0-9][0-9.]*' | sed 's/^GLIBC_//' | sort -uV | tail -1 || true)"
          if [ -z "$need" ]; then
            echo "::error::no versioned glibc symbols in $BIN; the floor cannot be checked"
            exit 1
          fi
          echo "binary needs glibc $need; floor is $GLIBC_FLOOR"
          if [ "$(printf '%s\n%s\n' "$need" "$GLIBC_FLOOR" | sort -V | tail -1)" != "$GLIBC_FLOOR" ]; then
            echo "::error::$BIN needs glibc $need, above the floor $GLIBC_FLOOR"
            exit 1
          fi

      - name: The cross-built macOS binary is x86_64
        if: matrix.cross && runner.os == 'macOS'
        env:
          BIN: target/${{ matrix.rust_target }}/release/${{ inputs.bin }}
        run: |
          set -euo pipefail
          archs="$(lipo -archs "$BIN")"
          echo "$BIN: $archs"
          if [ "$archs" != x86_64 ]; then
            echo "::error::$BIN is '$archs', not x86_64"
            exit 1
          fi

      - name: Ad-hoc sign the macOS binary
        # The linker's own ad-hoc signature can stall or kill a launch on macOS 14
        # and later; a codesign ad-hoc signature does not. No Apple account is
        # involved, so the binary is not notarized (see the release notes).
        if: runner.os == 'macOS'
        env:
          BIN: target/${{ matrix.rust_target }}/release/${{ inputs.bin }}
        run: |
          set -euo pipefail
          codesign --force --sign - "$BIN"
          codesign --verify --strict --verbose=2 "$BIN"

      - name: --version agrees with the tag
        # A cross-built binary cannot run on its runner; it shares the source,
        # and so the version, of the native legs that do run this check.
        if: ${{ !matrix.cross }}
        env:
          BIN: target/${{ matrix.rust_target }}/release/${{ inputs.bin }}${{ matrix.ext }}
          PREFIX: ${{ inputs.tag_prefix }}
        run: |
          set -euo pipefail
          got="$("$BIN" --version | awk '{print $2}')"
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            want="${GITHUB_REF_NAME#"$PREFIX"}"
            echo "binary says $got, tag says $want"
            if [ "$got" != "$want" ]; then
              echo "::error::the binary reports $got and the tag is $want: bump the version in crates/${{ inputs.package }}/Cargo.toml before tagging"
              exit 1
            fi
          else
            echo "binary says $got (no tag on this run)"
          fi

      - name: Stage the asset and its .sha256
        id: stage
        env:
          SRC: target/${{ matrix.rust_target }}/release/${{ inputs.bin }}${{ matrix.ext }}
          OUT: ${{ inputs.bin }}-${{ matrix.os_label }}-${{ matrix.arch }}${{ matrix.ext }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$SRC" "$GITHUB_WORKSPACE/dist/$OUT"
          cd "$GITHUB_WORKSPACE/dist"
          if command -v sha256sum >/dev/null; then sum=$(sha256sum "$OUT" | awk '{print $1}'); else sum=$(shasum -a 256 "$OUT" | awk '{print $1}'); fi
          echo "$sum  $OUT" > "$OUT.sha256"
          echo "- \`$OUT\` sha256 \`$sum\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.bin }}-${{ matrix.os_label }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  docs:
    name: book ${{ inputs.docs_asset }}
    needs: [nominator]
    if: ${{ !cancelled() && inputs.docs_script != '' && (needs.nominator.result == 'success' || needs.nominator.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: docs_asset is named
        env:
          DOCS_ASSET: ${{ inputs.docs_asset }}
        run: |
          set -euo pipefail
          case "$DOCS_ASSET" in
            *.tar.gz) ;;
            *) echo "::error::docs_script is set, so docs_asset must name a .tar.gz (got '${DOCS_ASSET}')"; exit 1 ;;
          esac
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: crates
          key: docs-${{ inputs.package }}
      - name: cargo build --release --locked -p ${{ inputs.package }} (the book carries this binary's --help)
        working-directory: crates
        env:
          PKG: ${{ inputs.package }}
        run: cargo build --release --locked -p "$PKG"
      - uses: peaceiris/actions-mdbook@ee69d230fe19748b7abf22df32acaa93833fad08 # v2
        with:
          mdbook-version: '0.5.4'
      - name: gettext and mdbook-i18n-helpers, for the translated builds
        timeout-minutes: 10
        env:
          MDBOOK_I18N_HELPERS_VERSION: '0.4.0'
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 -o DPkg::Lock::Timeout=120 update
          sudo apt-get -o DPkg::Lock::Timeout=120 install -y gettext
          cargo install --locked mdbook-i18n-helpers --version "=${MDBOOK_I18N_HELPERS_VERSION}"
      - name: Build the book
        env:
          SCRIPT: ${{ inputs.docs_script }}
          BIN: crates/target/release/${{ inputs.bin }}
          DOCS_ASSET: ${{ inputs.docs_asset }}
        run: |
          set -euo pipefail
          "./$SCRIPT" "$BIN" "dist/$DOCS_ASSET"
          test -s "dist/$DOCS_ASSET"
          (cd dist && sha256sum -c "$DOCS_ASSET.sha256")
          {
            echo "### ${DOCS_ASSET}"
            echo "- size $(du -h "dist/$DOCS_ASSET" | cut -f1), sha256 \`$(awk '{print $1}' "dist/$DOCS_ASSET.sha256")\`"
            echo "- index.html present: $(tar tzf "dist/$DOCS_ASSET" | grep -cx './index.html' || true)"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.bin }}-docs
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  checksums:
    name: SHA256SUMS, signed with cosign (keyless)
    needs: [build, docs]
    # docs is skipped for a binary with no book.
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.docs.result == 'success' || needs.docs.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true
      - name: SHA256SUMS
        run: |
          set -euo pipefail
          cat artifacts/*.sha256 | sort -k 2 > SHA256SUMS
          (cd artifacts && sha256sum -c ../SHA256SUMS)
          { echo '```'; cat SHA256SUMS; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign SHA256SUMS, then verify it the way goatbuilder update does
        run: |
          set -euo pipefail
          cosign sign-blob --yes --bundle SHA256SUMS.cosign-bundle SHA256SUMS
          cosign verify-blob --bundle SHA256SUMS.cosign-bundle \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.bin }}-checksums
          path: |
            SHA256SUMS
            SHA256SUMS.cosign-bundle
          if-no-files-found: error
          retention-days: 30

  release:
    name: attach the assets to the release
    needs: [build, docs, checksums]
    if: ${{ !cancelled() && github.ref_type == 'tag' && startsWith(github.ref_name, inputs.tag_prefix) && needs.checksums.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets
          merge-multiple: true
      - run: ls -la release-assets/
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          files: release-assets/*
          body_path: .github/release-notes/${{ inputs.notes }}
          generate_release_notes: true
          fail_on_unmatched_files: true
