name: doctor-battle-drills

on:
  workflow_dispatch:  # the weekly path-filtered run starts it on main
  pull_request:
    paths:
      - 'docs/operations/battle-drills/**'
      - 'ops/ci/check-doctor-battle-drills.sh'
      - '.github/workflows/doctor-battle-drills.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check drill structure and index
        run: bash ops/ci/check-doctor-battle-drills.sh
