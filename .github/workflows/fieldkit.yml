name: fieldkit

# Fieldkit tools and the Bleating Edge design system (ops/fieldkit/,
# docs/design/fieldkit-and-bleating-edge.md). One job: the scope guard, the
# inlined design-system copy, the Gatepost mock's own tests, and a headless
# browser run of every tool against its local mock. No pod or goatnet is needed.
# The browser run uses the portal's Playwright install
# (ops/goat-zenoh-portal/web/e2e, config playwright.fieldkit.config.ts), so
# Fieldkit carries no package manifest of its own.
# docs-guards.yml also runs the scope guard on docs and CI changes.

on:
  workflow_dispatch:  # the weekly path-filtered run starts it on main
  pull_request:
    paths:
      - 'ops/fieldkit/**'
      - 'ops/ci/check-fieldkit-scope.py'
      - 'ops/ci/fieldkit-cli-allowlist.txt'
      - 'docs/goat-cli-book/src/reference.md'
      - 'ops/goat-zenoh-portal/web/e2e/fieldkit/**'
      - 'ops/goat-zenoh-portal/web/e2e/playwright.fieldkit.config.ts'
      - 'ops/goat-zenoh-portal/web/e2e/package-lock.json'
      - '.github/workflows/fieldkit.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  fieldkit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Scope guard self-test
        run: python3 ops/ci/check-fieldkit-scope.py --self-test
      # The CLI's verbs come from the committed `goat docs --markdown` (the book
      # reference), which goat-cli's tests hold equal to the clap tree.
      - name: Every Fieldkit action equals an allowed goat command the CLI defines
        run: python3 ops/ci/check-fieldkit-scope.py --docs docs/goat-cli-book/src/reference.md
      - name: Every tool carries the current Bleating Edge
        run: python3 ops/fieldkit/inline.py --check
      - name: The Gatepost mock refuses what the pod refuses
        run: python3 ops/fieldkit/gatepost/test_mock_pod_api.py

      - uses: ./.github/actions/apt-failover
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ops/goat-zenoh-portal/web/e2e/package-lock.json
      - name: Install dependencies
        working-directory: ops/goat-zenoh-portal/web/e2e
        run: npm ci
      - name: Install Playwright browsers
        working-directory: ops/goat-zenoh-portal/web/e2e
        run: npx playwright install --with-deps chromium
      - name: Tools in a browser against their mocks
        working-directory: ops/goat-zenoh-portal/web/e2e
        run: npx playwright test -c playwright.fieldkit.config.ts --reporter=list
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fieldkit-playwright-report
          path: ops/goat-zenoh-portal/web/e2e/test-results/fieldkit/
          retention-days: 7
