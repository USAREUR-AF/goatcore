# contributor-trust: a required check on every pull request to main (ADR 1221).
#
# Decides whether a pull request needs a recorded security review before it
# can merge: always for an author outside the maintainers who is neither
# registered in a community environment nor the author of an earlier merged
# pull request, and for any outside author when the change touches a path in
# .github/contributor-trust/sensitive-paths.txt. An owner records the review
# by applying the `security-reviewed` label. A new push removes the label, so
# the review always covers the code that merges.
#
# pull_request_target runs this file and the script as they are on main. The
# pull request's code is never checked out, built or run: the script reads
# the author and the changed paths from the API. A change to this check takes
# effect only after it merges.
name: contributor-trust

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read
  issues: read
  pull-requests: write   # only to remove a stale security-reviewed label

concurrency:
  group: contributor-trust-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  contributor-trust:
    name: contributor-trust
    # Every event runs the whole check, including a label other than
    # security-reviewed: a skipped run of a required check counts as passed.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: check out the base branch (the check as merged)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: .github/contributor-trust
          persist-credentials: false

      - name: a new push withdraws an earlier security review
        if: >-
          github.event.action == 'synchronize'
          && contains(github.event.pull_request.labels.*.name, 'security-reviewed')
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh api -X DELETE "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels/security-reviewed"

      - name: decide
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
          CONTRIBUTOR_ROSTER_REPO: ${{ vars.CONTRIBUTOR_ROSTER_REPO }}
          CONTRIBUTOR_ROSTER_TOKEN: ${{ secrets.CONTRIBUTOR_ROSTER_TOKEN }}
        run: python3 .github/contributor-trust/check.py
