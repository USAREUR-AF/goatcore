name: codeql

# CodeQL from this repo, instead of the managed "Code Quality" scan.
#
# The managed scan (it shows in the run list as event `dynamic`, with no YAML
# anywhere) ran on every pull request, could not be path-filtered, and its Go
# leg compiled all 27 Go modules from a cold module cache before analysing:
# about six minutes on a PR that changed three signature files, the slowest
# check on every PR in the repo (#1993). This workflow:
#
#   * starts only when Go, Python or JavaScript/TypeScript source changes;
#   * analyses only the languages the push touched (the `detect` job reads
#     the diff; a push to main or the weekly schedule analyses all);
#   * for Go, builds only the modules the push touched, with the module
#     cache (Go's extractor needs a traced build: `build-mode: none` is
#     refused for Go, so the saving is in building less, not in not building).
#     Python and JavaScript are extracted from source with no build.
#
# `push: main` stays, and this is the one guard-shaped workflow that keeps
# it: code scanning diffs a pull request's alerts against the default
# branch's, so main needs its own analysis or every alert reads as new
# (docs/design/ci-discipline.md R8).
#
# After this merges, an admin turns the managed scan off: Settings -> Code
# security -> Code quality. Until then both run.

on:
  pull_request:
    paths:
      - '**.go'
      - '**/go.mod'
      - '**/go.sum'
      - '**.py'
      - '**.js'
      - '**.jsx'
      - '**.ts'
      - '**.tsx'
      - '.github/workflows/codeql.yml'
  push:
    branches: [main]
    paths:
      - '**.go'
      - '**/go.mod'
      - '**/go.sum'
      - '**.py'
      - '**.js'
      - '**.jsx'
      - '**.ts'
      - '**.tsx'
      - '.github/workflows/codeql.yml'
  schedule:
    # Weekly full analysis of main, so query-pack updates reach the baseline.
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  detect:
    name: which languages changed
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      languages: ${{ steps.pick.outputs.languages }}
      go_modules: ${{ steps.pick.outputs.go_modules }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
      - name: Pick the languages and Go modules this push touched
        id: pick
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # Every tracked Go module, as the directory holding its go.mod.
          all_modules=$(git ls-files -- '*/go.mod' 'go.mod' | xargs -n1 dirname | sort -u)
          if [ "$EVENT" != "pull_request" ]; then
            echo 'languages=["go","python","javascript-typescript"]' >> "$GITHUB_OUTPUT"
            echo "go_modules=$(tr '\n' ' ' <<<"$all_modules")" >> "$GITHUB_OUTPUT"
            echo "full analysis ($EVENT)"
            exit 0
          fi
          # HEAD is the PR merge commit; HEAD^1 is the base tip (fetch-depth 2).
          changed=$(git diff --name-only HEAD^1 HEAD)
          self=0
          grep -qx '.github/workflows/codeql.yml' <<<"$changed" && self=1
          langs=()
          modules=""
          if [ "$self" = 1 ] || grep -qE '\.go$|/go\.(mod|sum)$|^go\.(mod|sum)$' <<<"$changed"; then
            langs+=('"go"')
            if [ "$self" = 1 ]; then
              modules=$all_modules
            else
              # A changed Go file belongs to the nearest go.mod above it.
              while IFS= read -r f; do
                case "$f" in *.go|*/go.mod|*/go.sum|go.mod|go.sum) ;; *) continue ;; esac
                d=$(dirname "$f")
                while [ "$d" != "." ] && [ ! -f "$d/go.mod" ]; do d=$(dirname "$d"); done
                [ -f "$d/go.mod" ] && modules="$modules$d"$'\n'
              done <<<"$changed"
              modules=$(sort -u <<<"$modules" | sed '/^$/d')
            fi
          fi
          if [ "$self" = 1 ] || grep -qE '\.py$' <<<"$changed"; then langs+=('"python"'); fi
          if [ "$self" = 1 ] || grep -qE '\.(js|jsx|ts|tsx)$' <<<"$changed"; then langs+=('"javascript-typescript"'); fi
          list=$(IFS=,; echo "[${langs[*]-}]")
          echo "languages=$list" >> "$GITHUB_OUTPUT"
          echo "go_modules=$(tr '\n' ' ' <<<"$modules")" >> "$GITHUB_OUTPUT"
          echo "analysing: $list"
          echo "go modules: ${modules:-none}"

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: detect
    if: ${{ needs.detect.outputs.languages != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.detect.outputs.languages) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        if: matrix.language == 'go'
        with:
          go-version: '1.26.10'
          cache-dependency-path: '**/go.sum'

      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: ${{ matrix.language }}
          # Go's extractor traces a real build; the other two read source.
          build-mode: ${{ matrix.language == 'go' && 'manual' || 'none' }}
          queries: security-and-quality

      # Only the modules this push touched (every module on main / schedule).
      # A module that does not build is reported and left out of the
      # database rather than failing the scan: the build gate for a module is
      # its own workflow, not this one.
      - name: Build the touched Go modules under the CodeQL tracer
        if: matrix.language == 'go'
        shell: bash
        env:
          MODULES: ${{ needs.detect.outputs.go_modules }}
        run: |
          set -uo pipefail
          for m in $MODULES; do
            echo "::group::go build $m"
            if (cd "$m" && go build ./...); then
              echo "built $m"
            else
              echo "::warning::$m did not build and is not in the CodeQL database"
            fi
            echo "::endgroup::"
          done

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: "/language:${{ matrix.language }}"
