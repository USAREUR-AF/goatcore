name: codeql

# Keep the same language categories on pull requests and main so GitHub can
# compare every baseline configuration. Path filters avoid unrelated runs;
# within a run, Go builds every module and Python/JavaScript read source.
# The separately managed Code Quality scan may also run until disabled by an admin.

on:
  pull_request:
    paths:
      - '**.go'
      - '**/go.mod'
      - '**/go.sum'
      - '**.py'
      - '**.js'
      - '**.jsx'
      - '**.ts'
      - '**.tsx'
      - '.github/workflows/codeql.yml'
  push:
    branches: [main]
    paths:
      - '**.go'
      - '**/go.mod'
      - '**/go.sum'
      - '**.py'
      - '**.js'
      - '**.jsx'
      - '**.ts'
      - '**.tsx'
      - '.github/workflows/codeql.yml'
  schedule:
    # Weekly full analysis of main, so query-pack updates reach the baseline.
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  detect:
    name: select baseline languages
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      languages: ${{ steps.pick.outputs.languages }}
      go_modules: ${{ steps.pick.outputs.go_modules }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Select the same languages and Go modules as main
        id: pick
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # Every tracked Go module, as the directory holding its go.mod.
          all_modules=$(git ls-files -- '*/go.mod' 'go.mod' | xargs -n1 dirname | sort -u)
          echo 'languages=["go","python","javascript-typescript"]' >> "$GITHUB_OUTPUT"
          echo "go_modules=$(tr '\n' ' ' <<<"$all_modules")" >> "$GITHUB_OUTPUT"
          echo "full baseline coverage ($EVENT)"

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: detect
    if: ${{ needs.detect.outputs.languages != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.detect.outputs.languages) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        if: matrix.language == 'go'
        with:
          go-version: '1.26.10'
          cache-dependency-path: '**/go.sum'

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # Go's extractor traces a real build; the other two read source.
          build-mode: ${{ matrix.language == 'go' && 'manual' || 'none' }}
          queries: security-and-quality

      # Build the same modules on pull requests and main for comparable coverage.
      # A module that does not build is reported and left out of the
      # database rather than failing the scan: the build gate for a module is
      # its own workflow, not this one.
      - name: Build all Go modules under the CodeQL tracer
        if: matrix.language == 'go'
        shell: bash
        env:
          MODULES: ${{ needs.detect.outputs.go_modules }}
        run: |
          set -uo pipefail
          for m in $MODULES; do
            echo "::group::go build $m"
            if (cd "$m" && go build ./...); then
              echo "built $m"
            else
              echo "::warning::$m did not build and is not in the CodeQL database"
            fi
            echo "::endgroup::"
          done

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
