name: consistency-health-image
# Builds ops/consistency/Dockerfile — the goat-consistency-health meter (Rust +
# tokio + eclipse-zenoh + prost) — and publishes to
# ghcr.io/usareur-af/goat-consistency-health.
#
# Per docs/design/consistency-foundation.md §5 + ADR 1110 / ADR 1036: the
# consistency domain of the environment-health surface. One binary, two modes —
# a per-node convergence publisher (ops/consistency/report/<host_id>, facts
# only, no verdict) and a passive per-goatnet rollup that grades through the
# shared library and publishes EnvHealthV1{domain:"consistency"} on
# ops/consistency/health/<site>. Observation, never enforcement; persists
# nothing.
#
# The `test` job below is not optional ceremony: ADR 1110 D2 permits an
# implementation of the grading grammar ONLY if it passes the shared golden
# corpus, and this is where the Rust execution of that corpus runs against the
# same bytes the Python one reads. An image that shipped without it would be a
# second opinion wearing the grammar's name.
#
# BUILD CONTEXT IS ops/consistency/ (not the crate dir) because the library
# compiles ops/consistency/grammar.yaml in; the Dockerfile mirrors the repo
# layout so the relative include path means the same thing in both places.
#
# Per-arch native build + manifest combine, mirroring node-net-health-image.yml:
#   - linux/amd64 on ubuntu-24.04
#   - linux/arm64 on ubuntu-24.04-arm (GitHub-hosted arm64 runner)
#
# Tag scheme:
#   - On main push:                     :latest + :sha-<short>
#   - On consistency-health/v* tag:     :<tag-name>
#   - On any build:                     :sha-<short>

#
# DELIBERATELY NOT TRIGGERED BY ops/consistency/intent/**. Those files
# are GENERATED by ops/pins/generate-pins.py on every pin bump for EVERY
# component, and they are runtime data, not build input: .dockerignore excludes
# intent/ from the build context outright, on the stated grounds that "an image
# carrying one goatnet's intent would be a per-goatnet image". The deployed
# meter reads them from a mounted path the ansible role places. Triggering on
# them rebuilt two multi-arch images ~140 times a month and gated the pin PR
# that caused it. grammar.yaml and testdata/ DO belong above — grammar.yaml is
# compiled in, and testdata/ is read by the cargo-test job in this workflow.
#
# Build body: .github/workflows/_image-build.yml (shared).

on:
  push:
    branches: [main]
    paths:
      - 'ops/consistency/rust/**'
      - 'ops/consistency/grammar.yaml'
      - 'ops/consistency/testdata/**'
      - 'ops/consistency/Dockerfile'
      - '.github/workflows/consistency-health-image.yml'
    tags: ['consistency-health/v*']
  pull_request:
    paths:
      - 'ops/consistency/rust/**'
      - 'ops/consistency/grammar.yaml'
      - 'ops/consistency/testdata/**'
      - 'ops/consistency/Dockerfile'
      - '.github/workflows/consistency-health-image.yml'
  workflow_dispatch:

# Supersede in-flight runs for the same ref. A push during review used to
# leave the previous run going to completion, so a branch pushed three
# times paid three times for an answer only the last one needed. Keyed on
# the workflow plus the ref, and NEVER cancels on main — a merge-commit run
# is the one whose result is recorded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    # The corpus conformance gate (ADR 1110 D2) plus the meter's own tests —
    # including the local live fire, which publishes a real ConsistencyReportV1
    # between two zenoh peer sessions over loopback and grades what arrives. No
    # router, no container, no goatnet: it proves the topics, the encoding and
    # the publish -> receive -> grade path, and nothing about mTLS or a router
    # ACL, which only a live subscriber on a real goatnet can show (F-177 makes
    # a denied write SILENT).
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: cargo test — grading library, shared golden corpus, and the meter
        working-directory: ops/consistency/rust
        run: cargo test --locked --workspace
      - name: cargo clippy
        working-directory: ops/consistency/rust
        run: cargo clippy --locked --all-targets -- -D warnings

  image:
    needs: ["test"]
    uses: ./.github/workflows/_image-build.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      image_name: goat-consistency-health
      tag_prefix: consistency-health
      context: ops/consistency
      description: "Net domain of the environment-health surface (node-net-health.md/ADR 1036)"
