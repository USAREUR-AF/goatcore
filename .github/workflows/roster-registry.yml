# Principal-graph registry guard (identity-grammar Phase B).
#
# Validates every committed declared-half artifact — docs/operators/<goatnet>/
# roster.json, one per goatnet (ADR 1172), plus the controller-side union at
# docs/operators/roster.json — generated by ops/operators/gen-roster.py from
# the gitignored operator manifests. Because the manifests are gitignored, CI
# CANNOT re-derive a roster to diff it (a literal `gen-roster.py --check` only
# works locally, where the manifests exist). This guard does what CI can
# without manifests: assert each artifact is well-formed JSON, internally
# consistent (orgs↔members, valid kinds, no duplicate org ids), free of
# identity material (no emails / human names in the public-safe file), and —
# for a per-goatnet artifact — non-empty, because an empty one deploys as a
# fleet of strays rather than as a missing file.
#
# Staleness (roster.json out of sync with the manifests) stays a LOCAL
# pre-commit discipline: run `ops/operators/gen-roster.py` after any manifest
# change. See docs/design/data-access-cop.md.
# Org catalogs are checked offline against sync-org-catalog.render_catalog.
# This detects edits outside the generated form, not drift from the live store.
#
# Phase C (anti-regression, ADR 1043) adds a second guard here: the manifest
# validator's identity-grammar gate (validate.py) is unit-tested against
# fixtures (test_validate_grammar.py). The gate itself runs at the onboard
# chokepoint (operator-onboard.yml's pre-flight) — manifests are gitignored so CI
# can't run it against real ones — but its LOGIC is CI-locked here so a
# regression that lets a new affiliation-less / legacy-role manifest through
# fails the build.
#
# F-274 adds a third guard: the roster's collab projection is fixture-tested
# (test_gen_roster_collab.py) — most importantly that a manifest with no collab
# block projects `unrecorded`, never `none`, so "nobody wrote it down" can never
# be read as "this person has no collaboration-environment account".
#
# Rollback: rm this file + ops/ci/check-roster-registry.py.

name: roster-registry

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/operators/roster.json'
      - 'docs/operators/*/roster.json'
      - 'ops/operators/gen-roster.py'
      - 'ops/operators/validate.py'
      - 'ops/operators/test_validate_grammar.py'
      - 'ops/operators/test_gen_roster_collab.py'
      - 'ops/operators/test_gen_roster_emit_fields.py'
      - 'ops/operators/test_gen_roster_orgstore.py'
      - 'ops/operators/test_gen_roster_derive_kind.py'
      - 'ops/operators/test_gen_roster_per_goatnet.py'
      - 'ops/ansible/filter_plugins/affiliation_kind.py'
      - 'ops/ansible/filter_plugins/test_affiliation_kind.py'
      - 'ops/identity/orgs/**'
      - 'ops/identity/backfill-aff-trait.py'
      - 'ops/identity/test_backfill_aff_trait.py'
      - 'ops/scripts/sync-org-catalog.py'
      - 'ops/ci/check-org-catalog.py'
      - 'ops/ci/test_check_org_catalog.py'
      - 'ops/operators/schema/operator-manifest.schema.json'
      - 'ops/ci/check-roster-registry.py'
      - 'ops/ci/check-affiliation-kind-enum-sync.sh'
      - 'ops/ci/check-affiliation-id-trait-sync.sh'
      - 'ops/goat-id-console/internal/orgstore/store.go'
      - 'ops/ci/check-nation-fold-parity.sh'
      - 'ops/goat-id-console/internal/nation/nation.go'
      - 'ops/goat-zenoh-portal/internal/access/coalition.go'
      - 'ops/ansible/roles/ory/templates/ory/identity-schema.json.j2'
      - '.github/workflows/roster-registry.yml'

# Supersede in-flight runs for the same ref. A push during review used to
# leave the previous run going to completion, so a branch pushed three
# times paid three times for an answer only the last one needed. Keyed on
# the workflow plus the ref, and NEVER cancels on main — a merge-commit run
# is the one whose result is recorded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check-roster-registry:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate roster.json (well-formed + consistent + no identity leak)
        run: python3 ops/ci/check-roster-registry.py
      - name: Install validator deps
        run: pip install --quiet pyyaml jsonschema
      - name: Affiliation backfill catalog and identity tests
        run: python3 ops/identity/test_backfill_aff_trait.py
      - name: Org-catalog drift guard tests
        run: python3 ops/ci/test_check_org_catalog.py
      # A goatnet's org catalog is committed with that goatnet's overlay, not
      # here; the generator and the drift guard are proven by the test above.
      - name: Committed org catalogs match their generator (offline)
        run: |
          if [ -d ops/identity/orgs ]; then
            python3 ops/ci/check-org-catalog.py
          else
            echo "no committed org catalog in this tree: nothing to compare"
          fi
      - name: Identity-grammar gate unit test (Phase C anti-regression)
        run: python3 ops/operators/test_validate_grammar.py
      - name: Collab-projection unit test
        run: python3 ops/operators/test_gen_roster_collab.py
      - name: Field-emission unit test (A12 — sector/display_name/standing emitted, standing dual-reads coalition)
        run: python3 ops/operators/test_gen_roster_emit_fields.py
      # ADR 1112 / ADR 1147 item 6. This test shipped with the org-catalog overlay
      # and was never referenced by any workflow, while both its siblings above
      # were -- so the overlay that `--org-source store` depends on had no CI
      # cover at all. It pins the two properties item 6 rests on: an empty
      # catalog is a no-op, and the catalog wins loudly on conflict.
      - name: Org-catalog overlay unit test (ADR 1112 store mode)
        run: python3 ops/operators/test_gen_roster_orgstore.py
      # ADR 1151 step 3, the Python half of the derive_kind table — shipped with
      # that step and, like the overlay test above, never referenced by a
      # workflow. It is the test that fails when the console's Go table and this
      # one disagree about organic-vs-partner.
      - name: derive_kind unit test (ADR 1151 — kind derived from the target block)
        run: python3 ops/operators/test_gen_roster_derive_kind.py
      # operator-onboard.yml reads the same table through this filter, not a copy
      # of its own, so a sector added to derive_kind reaches the play.
      - name: derive_kind filter for operator-onboard.yml (ADR 1151 — one table, no play copy)
        run: python3 ops/ansible/filter_plugins/test_affiliation_kind.py

      - name: ADR 1172 — a goatnet's roster reads only that goatnet's manifests
        run: python3 ops/operators/test_gen_roster_per_goatnet.py

      - name: affiliation.kind enum sync (manifest schema <-> Ory identity-schema)
        run: bash ops/ci/check-affiliation-kind-enum-sync.sh
      - name: affiliation id <-> Kratos org trait sync (manifest schema + org registry -> Ory identity-schema)
        run: bash ops/ci/check-affiliation-id-trait-sync.sh
      - name: nation fold parity (console <-> portal <-> roster generator)
        run: bash ops/ci/check-nation-fold-parity.sh
