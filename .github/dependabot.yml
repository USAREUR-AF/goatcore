# Base-image refresh for digest-pinned Dockerfiles (ADR 0703).
#
# Pinning a FROM by digest stops a rebuild changing under us, and also stops it
# picking up the upstream's CVE rebuilds (Chainguard republishes :latest for
# that). This file is the other half: dependabot opens a PR when a pinned
# digest has a newer build behind the same tag, so a pin is reviewed and moved
# rather than silently stale.
#
# ONLY directories whose FROM carries @sha256 belong here. A floating FROM gets
# nothing from dependabot but tag-version bumps. ops/ci/check-image-refs-pinned.py
# fails when a Dockerfile pins a digest and its directory is missing below —
# pin a base and add its directory in the same change.
version: 2
updates:
  - package-ecosystem: docker
    directories:
      - /ops/admit-audit
      - /ops/base-images/go-build
      - /ops/base-images/runtime-cc
      - /ops/base-images/runtime-shell
      - /ops/base-images/runtime-static
      - /ops/base-images/rust-build
      - /ops/e2e/canary
      - /ops/e2e/host
      - /ops/goat-id-console
      - /ops/goat-zenoh-portal
      - /ops/federation-e2e/host
      - /ops/netbird
      - /ops/onboard-runner
      - /ops/postgres/spock
      - /signal-server
    schedule:
      interval: weekly
      day: monday
    groups:
      base-images:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
    ignore:
      # Postgres major version bumps are an on-disk upgrade for a replicated
      # Spock fleet (see docs/adr for the Spock HA topology) and need their
      # own reviewed upgrade plan, not a dependabot auto-bump. The pgedge
      # minimal images also drop pg_trgm on major bumps, which breaks
      # 02-spock-extension.sql (see PR #2080 CI failures).
      - dependency-name: "ghcr.io/pgedge/pgedge-postgres"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directories:
      - /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: gomod
    directories:
      - /ops/admit-audit
      - /ops/enrollment
      - /ops/federation/reference
      - /ops/goat-id-console
      - /ops/goat-zenoh-portal
      - /ops/grant-crypto
      - /ops/grant-crypto/sdk/bindings/go
      - /ops/mgmt-host-bootstrap
      - /ops/onboard-runner
      - /ops/relay-probe
      - /ops/signal-federation-probe
      - /ops/smoketest
      - /ops/snitch
      - /ops/time-hygiene
      - /ops/wg-cp0-mesh-reach
      - /ops/zenoh/loadgen
      - /signal-server
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      gomod:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: npm
    directories:
      - /ops/ansible/roles/netbird-dashboard/tests/fixture-e2e/playwright
      - /ops/goat-id-console/web/e2e
      - /ops/goat-zenoh-portal/web/e2e
      - /ops/grant-crypto/sdk/bindings/ts
      - /ops/smoketest/dashboard
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: pip
    directories:
      - /ops/grant-crypto/sdk/bindings/python
      - /ops/serve
      - /ops/smoketest/apptests
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      pip:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: cargo
    directories:
      - /
      - /crates
      - /ops/consistency/rust
      - /ops/federation/republisher
      - /ops/grant-crypto/keyd
      - /ops/grant-crypto/sdk
      - /ops/relay-auth-probe
      - /ops/zenoh-ingress-gateway
      - /ops/zenoh/pqc-image/bench
      - /ops/zenoh/pqc-image/fips-probe
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      cargo:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
