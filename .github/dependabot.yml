# Base-image refresh for digest-pinned Dockerfiles (ADR 0703).
#
# Pinning a FROM by digest stops a rebuild changing under us, and also stops it
# picking up the upstream's CVE rebuilds (Chainguard republishes :latest for
# that). This file is the other half: dependabot opens a PR when a pinned
# digest has a newer build behind the same tag, so a pin is reviewed and moved
# rather than silently stale.
#
# ONLY directories whose FROM carries @sha256 belong here. A floating FROM gets
# nothing from dependabot but tag-version bumps. ops/ci/check-image-refs-pinned.py
# fails when a Dockerfile pins a digest and its directory is missing below —
# pin a base and add its directory in the same change.
version: 2
updates:
  - package-ecosystem: docker
    directories:
      - /ops/admit-audit
      - /ops/base-images/go-build
      - /ops/base-images/runtime-cc
      - /ops/base-images/runtime-shell
      - /ops/base-images/runtime-static
      - /ops/base-images/rust-build
      - /ops/e2e/canary
      - /ops/e2e/host
      - /ops/e2e/vm
      - /ops/goat-id-console
      - /ops/gatewatch
      - /ops/goat-zenoh-portal
      - /ops/federation-e2e/host
      - /ops/netbird
      - /ops/onboard-runner
      - /ops/postgres/spock
      - /ops/secwatch
      - /ops/smoketest
      - /ops/snitch
      - /ops/zenoh/loadgen
      - /ops/zenoh/overlay
      - /ops/zenoh/pqc-image
      - /signal-server
    schedule:
      interval: weekly
      day: monday
    groups:
      base-images:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
    ignore:
      # Postgres major version bumps are an on-disk upgrade for a replicated
      # Spock fleet (see docs/adr for the Spock HA topology) and need their
      # own reviewed upgrade plan, not a dependabot auto-bump. The pgedge
      # minimal images also drop pg_trgm on major bumps, which breaks
      # 02-spock-extension.sql (see PR #2080 CI failures).
      # A Postgres major upgrade is a planned migration (pg_upgrade), never a
      # dependency bump.
      # Dependabot names a docker image without its registry host (its PRs say
      # `pgedge/pgedge-postgres`, as they say `chainguard/go`). Written with the
      # host, this rule matched nothing, so neither update-types (#59) nor the
      # range stopped the 16 -> 18 proposals (#991).
      # tests/test_dependabot_ignore_names.py checks each ignore names an image
      # the way Dependabot does. Digest refreshes of the 16 tag still come through.
      - dependency-name: "pgedge/pgedge-postgres"
        update-types: ["version-update:semver-major"]
        versions: [">=17"]
      # Zenoh and the Rust toolchain that builds our routers move as one unit
      # through ops/upstream/upstream.py (ADR 1262): the router, the rocksdb
      # plugin and every client at one version. Dependabot refreshes their
      # digests at the pinned tag; it never proposes a new version.
      - dependency-name: "eclipse/zenoh"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "rust"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]

  # Action revisions in workflows are pinned to full
  # commit SHAs with the version in a trailing comment (.github/ACTION-PINS.md).
  # Dependabot moves the SHA and the comment together, so a pin is reviewed and
  # moved rather than left behind its tag.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
