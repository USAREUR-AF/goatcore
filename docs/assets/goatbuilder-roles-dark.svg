.scene .gl{font:700 14px ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;letter-spacing:.08em;fill:#a7ae98}
.scene .ml{font-size:17px;font-weight:700;fill:#e6e9da;paint-order:stroke fill;stroke:#1a2016;stroke-width:4px;stroke-linejoin:round}
.scene .hit{fill:transparent}.scene .ring{fill:none;stroke:none}
.scene .body polygon{stroke-linejoin:round}
.scene .built .st{fill:#1a3223;stroke:#74cf93;stroke-width:1.8}
.scene .built .sl{fill:#74cf93;stroke:#74cf93;stroke-width:1.8}
.scene .built .sr{fill:#74cf93;fill-opacity:.78;stroke:#74cf93;stroke-width:1.8}
.scene .built .scr{fill:#1a3223}
.scene .built .dt{stroke:#0e140c;stroke-width:2;stroke-linecap:round;opacity:.75}
.scene .built .led{fill:#0e140c}
.scene .plan .st,.scene .plan .sl,.scene .plan .sr{fill:#12160f;stroke:#e6e9da;stroke-width:1.5;stroke-dasharray:5 4}
.scene .plan .kid polygon{stroke-dasharray:none;stroke-width:1.2}
.scene .plan .dt{stroke:#7d866e;stroke-width:1.5}.scene .plan .led{fill:none;stroke:#7d866e;stroke-width:1.5}
