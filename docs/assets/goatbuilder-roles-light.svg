<svg class="scene" viewBox="30 0 950 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Twelve machine roles on one site plan. Solid, built by goatbuilder today: core, obs, phone, break-glass, network-gear jump box. Dashed, designed as goatbuilder target types: goat-processors, federation boundary, simple boundary, octo-pod, sensor node, vendor gateway, first-bite."><style>
.scene{font-family:'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif;overflow:visible}
