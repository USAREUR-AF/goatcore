<svg class="scene" viewBox="30 0 1010 590" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Thirteen machine roles on one site plan, and a place for your own. Solid, built by goatbuilder today: core, obs, phone, break-glass, network-gear jump box. Dashed, designed as goatbuilder target types: goat-processors, federation boundary, simple boundary, octo-pod, sensor node, vendor gateway, first-bite, network tap, and a role of your own."><style>
.scene{font-family:'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif;overflow:visible}
.scene .pd{fill:#e6e8d9;stroke:#d3d6c4;stroke-width:1.2}.scene .pe{fill:#d3d6c4}
