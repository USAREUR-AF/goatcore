.scene .built .led{fill:#ffffff}
.scene .plan .st,.scene .plan .sl,.scene .plan .sr{fill:#f1f2e8;stroke:#1b2118;stroke-width:1.5;stroke-dasharray:5 4}
.scene .plan .dt{stroke:#7f8770;stroke-width:1.5}.scene .plan .led{fill:none;stroke:#7f8770;stroke-width:1.5}
