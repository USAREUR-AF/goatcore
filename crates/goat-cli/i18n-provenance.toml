# Translation provenance + feedback channels (ADR 1024 /
# docs/design/goat-cli-i18n.md). PARAMETERIZED: edit this file to update
# the feedback channels or a language's review status without touching
# code. The two channel values are also overridable at runtime per
# deployment via env (GOAT_I18N_FEEDBACK_EMAIL / GOAT_I18N_FEEDBACK_REPO),
# so a partner standup can point them at a different address/repo without
# a rebuild. Embedded into the binary via include_str! (works air-gapped).

[feedback]
# Where operators report translation errors. The email is the durable
# channel; the repo takes issues and PRs against the catalogs. Each
# goatnet publishes its email in goatnet.toml (`i18n_feedback_email`); a
# value here is the fallback for a context without one.
email = ""  # each goatnet publishes its own (goatnet.toml i18n_feedback_email)
repo = ""   # provisional — set to the shared partner repo URL when it exists

[review]
# Per-language review status. Drives the machine-translation warning: a
# non-English locale whose status is not "native-reviewed" emits the
# notice pointing operators at the feedback channels above.
#   native-reviewed — a native speaker has reviewed the catalog (trusted)
#   human           — human-translated, review pending
#   machine         — machine-translated, NOT reviewed (default; warns)
#   easter-egg      — opt-in fun locale, phrasebook-grade, NOT reviewed
#                     (warns like machine; never auto-selected from OS locale)
# Languages absent here default to "machine".
en = "native-reviewed"   # Tier 0 — the canonical arbiter

# Tier 1 seed
fr = "machine"           # NATO official language (member-nation seed)
uk = "machine"           # named partner

# Tier 2 — NATO-member languages (machine-translated scaffolding; each
# flips to native-reviewed as a native speaker reviews it).
sq = "machine"   # Albanian
bg = "machine"   # Bulgarian
hr = "machine"   # Croatian
cs = "machine"   # Czech
da = "machine"   # Danish
nl = "machine"   # Dutch
et = "machine"   # Estonian
fi = "machine"   # Finnish
de = "machine"   # German
el = "machine"   # Greek
hu = "machine"   # Hungarian
is = "machine"   # Icelandic
it = "machine"   # Italian
lv = "machine"   # Latvian oss-allow: language name
lt = "machine"   # Lithuanian
lb = "machine"   # Luxembourgish
mk = "machine"   # Macedonian
cnr = "machine"  # Montenegrin
nb = "machine"   # Norwegian (Bokmål)
pl = "machine"   # Polish
pt = "machine"   # Portuguese
ro = "machine"   # Romanian oss-allow: language name
sk = "machine"   # Slovak
sl = "machine"   # Slovenian
es = "machine"   # Spanish
sv = "machine"   # Swedish
tr = "machine"   # Turkish

# Easter-egg tier — opt-in only (`--lang tlh`), never auto-selected.
tlh = "easter-egg"  # Klingon / tlhIngan Hol — affectionate, speakers welcome to PR
