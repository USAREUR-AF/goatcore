[package]
name = "goat-cli"
version = "0.5.18"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
description = "goat-cli — unified operator command-line for the goat data fabric. Composes panoscope-core (portal client, Zenoh mTLS, audit-tail) into a single CLI: profile init/reuse, ZTOL-aware doctor, org portal browse, topic CRUD, pub/sub, stethoscope delegation. ADR 1019 / docs/design/goat-cli.md."
default-run = "goat"

[[bin]]
name = "goat"
path = "src/main.rs"

[dependencies]
goat-fun = { path = "../goat-fun" }
panoscope-core = { path = "../panoscope-core" }
goat-errors = { path = "../goat-errors" }
# The self-update core goatbuilder shares (asset name, version compare, checksum, atomic replace).
goat-selfupdate = { path = "../goat-selfupdate" }
# Grant-keyed (supplemental) encryption for the sealed data path (goat pub
# --sealed / goat sub --open) + the member-leaf rotate verb (ADR 1094/1102/1106).
# grant-crypto is the ADR-1106 SDK core: the pure, zenoh-free crypto (the typed
# datapath — seal/open/unwrap — plus rotate). goat-cli is a CONVENIENCE consumer
# of that SDK, not the only path; the SDK stays directly usable elsewhere.
# grant-keyd (with default-features = false) contributes ONLY the SPIRE-SVID
# bundle-signer verification and a re-export of the SDK datapath — the
# native-Zenoh publisher stays behind its `publisher` feature, so this pulls NO
# extra transport tree.
grant-crypto = { path = "../../ops/grant-crypto/sdk/core" }
grant-keyd = { path = "../../ops/grant-crypto/keyd", default-features = false }
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
clap_complete = "4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "io-std", "io-util", "process", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Bundle verifier (ADR 1019 / Phase B Step 2D) — ECDSA P-256 over
# SHA-256(canonical CBOR ex-signature), matching the Go side at
# ops/enrollment/bundle/bundle.go.
ciborium = "0.2"
p256 = { version = "0.14", features = ["ecdsa", "pem", "pkcs8"] }
sha2 = "0.10"
pem = "3"
# Self-claims: leaf certs carry Ed25519 keys (signed by the P-256 CA) —
# claim artifacts are signed/verified with the leaf key.
ed25519-dalek = { version = "2", features = ["pkcs8", "pem"] }
# `verify`: federate init picks the root that signed the profile certificate's
# chain by verifying that signature against each bundle root (#1289). Not the
# P-256-only check in names.rs: the offline CA's X.509 root is Ed25519
# (ops/enrollment/x509ca/root.go). It resolves to ring, already built via rustls.
x509-parser = { version = "0.16", features = ["verify"] }
# Doctor (ADR 1019 / Phase B Step 3) — full Zenoh mTLS session at
# step 3 + portal /api/vendors at step 4. The zenoh pin must match
# fleet-wide version pinning per docs/design/zenoh-version-pinning.md.
zenoh = { version = "=1.9.0", default-features = false, features = ["transport_tls", "transport_tcp"] }
# Dynamic protobuf decode for `goat sub --decode` (Phase D.B). Same
# crate pair panoscope uses for its Decoded stream view; reuses the
# select-by-declared-format pattern that closed the DRS-style
# first-message-fallback class.
prost-reflect = { version = "0.14", features = ["serde"] }
prost = "0.13"
# Phase F.2 — `goat services` reads ops/serve/services.yaml (the SoT
# per CLAUDE.md §Hosted services) and probes each service's
# `https://<name>.<domain_suffix><health_path or />`. Reqwest config
# mirrors panoscope-core's (rustls-tls + json) so the rustls
# instantiation is shared and we stay LE-trust-anchored.
serde_yaml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "socks", "gzip"] }
futures = "0.3"
# P2.2 — the native NetBird onboard names the setup-key/peer with today's date
# (matching the playbook's ansible_date_time.date). Local date only.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Phase F.3 — `goat client bundle import` base64-encodes the CBOR
# bundle bytes into the JSON-RPC params field so the daemon can
# decode back to bytes server-side (JSON has no native byte type).
base64 = "0.22"
# Phase F.3 — `goat client` needs unix-socket support out of tokio.
# The "net" feature pulls in UnixStream + UnixListener; the existing
# top-level tokio dep already enables io-util / io-std / process.

# Phase D.C compose — ratatui interactive command-builder TUI per
# ADR 1019 §14. Crossterm is the input/output backend (ratatui's
# POSIX default). TTY-gated by construction; piped/CI invocations
# refuse to launch.
ratatui = "0.29"
crossterm = "0.28"

# Internationalization (ADR 1024 / docs/design/goat-cli-i18n.md) — the
# standard Rust localization stack. Catalogs are Fluent (.ftl), embedded
# in the binary via rust-embed so the tool localizes air-gapped with no
# network egress. i18n-embed-fl's `fl!` macro compile-time-checks every
# id against the English fallback catalog, making "English is the
# arbiter" a build invariant. Machine surface stays locale-invariant by
# rule (see the design doc's prose-vs-contract boundary).
i18n-embed = { version = "0.15", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.9"
rust-embed = "8"
unic-langid = "0.9"
once_cell = "1"

# `goat doctor --topic` mints an OS-random nonce for the write-precheck
# scratch key + sentinel payload (uniqueness so a stale retained value
# can't mask an ACL denial). OS entropy over a clock-derived nonce on
# purpose: a backward NTP step — a first-class concern on this fabric —
# could otherwise collide two invocations' timestamps. Same `OsRng`
# idiom the test surface already uses.
rand_core = { version = "0.6", features = ["getrandom"] }
# Operator-action audit.
# Payload encryption: the OperatorActionV1 protobuf body is age-encrypted
# to the operator age roster before it touches the bus, mirroring the Go
# age semantics at ops/enrollment/ca/age_ca.go (X25519 `age1...` recipients).
# Pure-Rust (no C deps) so the Windows-gnu cross-check the CI gate runs
# stays green. Binary (non-armored) format — `armor` feature left off.
age = { version = "0.11", default-features = false }

# Full-screen TUI lenses (top/who/tail) redirect stderr at the fd level for
# the alternate screen's lifetime so the zenoh stack's `tracing`/`log` output
# (e.g. the "Skipping name verification of TLS server" WARN) can't bleed into
# the rendered frame and corrupt it (the goat-who 0.4.7 defect). dup2 isn't in
# std; libc is already in the tree transitively. Unix-only — the Windows-gnu
# cross-check the CI gate runs never sees it, and the TUI lenses aren't a
# Windows path.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "test-util"] }
trycmd = "0.15"
insta = { version = "1", features = ["json", "yaml"] }
tempfile = "3"
# Self-claims tests mint real X.509 leaf certs (signed by a test CA) so
# verify_claim's chain checks run against genuine DER, not hand-rolled TBS.
rcgen = "0.13"
# Phase C — tests construct PortalError::Http { status: StatusCode::... }
# to exercise the map_portal_err code path. reqwest is already a
# transitive dep via panoscope-core; this dev-only entry exposes it
# directly to the test surface.
reqwest = { version = "0.12", default-features = false }
# narrate-cascade integration tests (queued gap #1) — drive
# observe_stethoscope_check's async reqwest+select! path against an
# in-process HTTP server serving canned SSE bodies. Covers endpoint
# resolution, HTTP error responses, and deadline expiry that the pure
# scan_blocks_for_outcome unit tests can't reach. See
# docs/project/active-work/queued/goat-cli-test-coverage-followons.yaml.
wiremock = "0.6"
