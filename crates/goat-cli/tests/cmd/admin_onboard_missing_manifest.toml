# `goat admin onboard` refuses early when the operator manifest is
# absent — caught BEFORE the ansible child spawn, so the operator
# gets a clean message instead of a noisy 30-second ansible failure.
# An operator signal (GOAT_OPERATOR_HANDLE) is set so the operator-only
# capability guard passes and we reach the manifest check.
bin.name = "goat"
args = ["admin", "onboard", "no-such-operator", "--repo-root", "/tmp/goat-cli-phase-f-2-no-such-repo-root", "--dry-run"]
status.code = 1
stderr = """
error: no operator manifest at /tmp/goat-cli-phase-f-2-no-such-repo-root/ops/operators/no-such-operator.yml — author it first per docs/design/operator-onboard-utilities.md
"""
[env]
# Keep this fixture away from an operator's active profile and automatic refresh.
add = { GOAT_OPERATOR_HANDLE = "trycmd-operator", GOAT_PROFILE_DIR = "/tmp/goat-cli-trycmd-uninitialized" }
