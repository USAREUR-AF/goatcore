# `goat federate` prints the shared library's own refusal code, as goatbuilder
# does, and exits 1 like it: a package file it cannot read is X-FED-001.
bin.name = "goat"
args = ["federate", "lint", "/nonexistent/package.json"]
status.code = 1
stdout = ""
stderr = """
goat federate is moving to goatbuilder and will be removed from goat: run `goatbuilder federate lint ...`
error: /nonexistent/package.json: No such file or directory (os error 2)
  code: X-FED-001
"""
[env]
# Keep this fixture away from an operator's active profile and automatic refresh.
add = { GOAT_PROFILE_DIR = "/tmp/goat-cli-trycmd-uninitialized" }
