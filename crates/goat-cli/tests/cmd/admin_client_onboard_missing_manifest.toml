# `goat admin client onboard` refuses early when the device manifest is
# absent — caught BEFORE the bundle-create child spawn, so the operator
# gets a clear message naming the expected path instead of a noisy
# go-build failure.
#
# An operator signal (GOAT_OPERATOR_HANDLE) is set so the operator-only
# capability guard passes and we reach the manifest check.
bin.name = "goat"
args = ["admin", "client", "onboard", "no-such-device", "--repo-root", "/tmp/goat-cli-phase-f-4-no-such-repo-root", "--dry-run", "--ca-id", "dev-x", "--age-identity", "/tmp/x", "--ca-key", "/tmp/y"]
status.code = 1
stderr = """
error: no device manifest at /tmp/goat-cli-phase-f-4-no-such-repo-root/ops/devices/no-such-device.yml — author it from ops/devices/example.yml.example first
"""
[env]
# Keep this fixture away from an operator's active profile and automatic refresh.
add = { GOAT_OPERATOR_HANDLE = "trycmd-operator", GOAT_PROFILE_DIR = "/tmp/goat-cli-trycmd-uninitialized" }
