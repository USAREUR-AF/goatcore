# A non-English, non-native-reviewed locale (uk) emits the machine-
# translation notice to stderr before the (localized) error, pointing at
# the parameterized feedback channels (ADR 1024 decision 6 /
# docs/design/goat-cli-i18n.md). The notice itself renders in English
# here because the uk catalog hasn't translated it (the meta-caveat is
# the authoritative English by default). The notice is prose on stderr;
# it does not touch stdout or any --json. Suppressible via
# GOAT_I18N_NO_WARN (asserted by doctor_no_profile_uk.toml).
bin.name = "goat"
args = ["--profile-dir", "[..]/goat-trycmd-warn-fixture", "doctor"]
status.code = 3
stderr = """
note: uk output is machine-translated and not yet native-reviewed — the English text is authoritative. Report translation errors to your goat administrator. Suppress with GOAT_I18N_NO_WARN=1.
error: немає профілю для контексту `default`
  help: no profile at [..]/goat-trycmd-warn-fixture/contexts/default. Run `goat profile init <bundle.cbor>` first.
  code: E_PROFILE_MISSING
"""

[env]
add = { GOAT_LANG = "uk" }
