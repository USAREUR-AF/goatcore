# Cargo workspace for goat's operator and build tooling:
#   - goat-cli/          the `goat` operator CLI
#   - goatbuilder/       build, release, deploy, standup
#   - goat-federation/   federation package v1: the library behind the federation verbs
#   - goat-errors/       the error catalog every message is interpreted from
#   - goat-selfupdate/   release self-update
#   - goat-fun/          the easter eggs
#   - panoscope-core/    portal client + audit-tail reader, shared with the
#                        inspection surfaces in the goatstuff repository
#
# Deliberately NOT a member of the goat-relay workspace at the repository
# root: trust-domain separation and build isolation (the reqwest/axum/tokio
# stack must not slow `cargo check` for relay developers).

[workspace]
resolver = "2"
members = [
    "panoscope-core",
    "goat-cli",
    "goat-federation",
    "goatbuilder",
    "goat-errors",
    "goat-fun",
    "goat-selfupdate",
]

[profile.release]
# CI-speed: thin LTO + parallel codegen. These are IO-bound tools where
# whole-program LTO buys negligible runtime. The data-plane relay keeps fat
# LTO in the repository-root profile.
lto = "thin"
codegen-units = 16
strip = true
