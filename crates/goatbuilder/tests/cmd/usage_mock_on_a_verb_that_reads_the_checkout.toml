# used to accept the flag and read the real checkout anyway, then name a file
# the person never pointed them at. It is a refusal, and it names the verbs
# that do take a fixture.
bin.name = "goatbuilder"
args = ["--mock", "ops/goatbuilder/fixtures/basic", "pins", "--check"]
status.code = 2
stdout = ""
stderr = """
goatbuilder: --mock reads a fixture instead of hosts, and pins reads this checkout, so the fixture would have been ignored. The verbs that take one: status, diff, history, deploy, verify, rollback, preflight, plan, apply, adopt, standup, teardown, federate, survey.
  (GB-276 — goatbuilder explain GB-276)
"""
