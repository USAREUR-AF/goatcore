# `join-node --help`: the flags and the contract a reader relies on.
bin.name = "goatbuilder"
args = ["join-node", "--help"]
status.code = 0
stdout = """
One more machine of a class at a live site, declared → converged → verified: the node-addition
sequence of docs/tutorials/02-first-federated-node.md as numbered phases with its gates (reach, key,
repo work first, baseline, kernel WireGuard before and after enrolment, the kernel ACL plane as the
enrolment gate, the class's converge, acceptance)

Usage: goatbuilder join-node [OPTIONS] --site <SITE> --node <NODE> --class <CLASS> <ENV>

Arguments:
  <ENV>  The environment (goatnet)

Options:
  -o, --output <OUTPUT>      Output format: a table for a person; JSON or YAML for a program
                             [default: table] [possible values: table, json, yaml]
      --site <SITE>          The site the node joins
  -C, --repo <DIR>           The repository root. Defaults to the checkout this binary is run in
      --node <NODE>          The node's inventory name
      --class <CLASS>        The machine class: core | obs | breakglass | network-jump
      --yes                  Confirm a declarative verb without prompting (for automation)
      --address <ADDRESS>    The node's LAN address (required to run; phase 1 says how to find it)
      --frozen               Refuse any run that would need to fast-forward the checkout (strict C3)
      --offline              An islanded site: do not fetch the trunk; judge the checkout against
                             the cached one, and record the run as offline (C3;
                             ops/scripts/fresh-source.sh)
      --pass-var <PASS_VAR>  The env var holding the node's first-login password (default
                             <SITE>_NODE_PASS)
      --from <FROM>          Resume from this phase [default: 1]
      --mock <DIR>           Run against a fixture directory instead of hosts: no registry, no
                             transport, deterministic (goatbuilder-conformance.md §"The fixture")
      --lang <TAG>           Language for help and error explanations (a tag such as fr, uk, de);
                             output a pipeline reads stays English. Default: the OS locale [env:
                             GOAT_LANG=]
      --to <TO>              Stop after this phase [default: 99]
      --color <COLOR>        Color the table's ok/FAIL glyph and verdict (auto|always|never). `auto`
                             colors only a terminal; NO_COLOR and CLICOLOR_FORCE override. JSON and
                             YAML are never colored [default: auto] [possible values: auto, always,
                             never]
      --dry-run              Print every phase and command; run nothing
  -v, --verbose              Log what a run does — the external commands it shells out to, and the
                             network phase of `update` — to stderr, so `-o json|yaml` stays a clean
                             document. Or set RUST_LOG=goatbuilder=debug
      --timeout <SECS>       Seconds to bound the connect/reach phase before failing fast — the one
                             phase that can block on an unreachable host (`update`'s fetch of the
                             served version). Does NOT cap a play's own run or the binary download
                             (stall-bounded). Also reads GOATBUILDER_TIMEOUT [env:
                             GOATBUILDER_TIMEOUT=]
  -h, --help                 Print help
"""
stderr = ""
