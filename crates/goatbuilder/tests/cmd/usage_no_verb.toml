# No verb: usage on stderr, exit 2.
bin.name = "goatbuilder"
args = []
status.code = 2
stdout = ""
stderr = """
Build and ship a goat environment: declare, converge, verify — under one deploy contract

Usage: goatbuilder [OPTIONS] <COMMAND>

Commands:
  validate    Check a config against the versioned schema and the cross-field rules, offline
  doctor      Probe what a run needs before anything is cut: deps, checkout freshness, each
              environment's transport, and that every component's playbook resolves to a definite
              target mode
  status      Declared against recorded, per machine: converged, pending or unknown (C7, C8). Reads
              only. Exit 3 while any machine is not converged
  deploy      Put the pin main declares onto one environment and prove it: resolve the component and
              the environment's groups from the pins, the play and its target mode, every secret the
              play templates, the transport; run the play through ansible-preflight; read the deploy
              ledger back from every host and call it done only when the newest row names the
              declared digest with action=deploy (C7). On a fixture (`--mock`) the scripted
              converger stands in for the hosts
  preflight   Before a rollout, the readiness and reversibility readout (ADR 1211): three facts —
              State (stateless | stateful), Rollback (pin-revert | restore-required | none) and
              Scope (single | coupled) — declared per component and FAIL-CLOSED when undeclared,
              with the readiness half the other verbs prove (ref pullable, pins --check, the secrets
              gate, fresh source, the declared end state) and a validation of the rollback fact
              (rollback --dry-run for pin-revert, the retention window for restore-required).
              `deploy` runs it first; honesty-graded, never a false green. Reads only; exit 3 when
              not clean
  release     Take a release candidate from a tag on main through the dev goatnet's live validation
              to the preprod rung (ADR 1173); after the soak, with `--from prod`, graduate it, fold
              it into fleet:, deploy prod and re-verify every rung. Replaces ops/scripts/rc.sh step
              for step
  rollback    Roll a deployed component back to its N-th most recent ref, by artifact type, reading
              the on-host ledger as the source of truth (ADR 1060). Replaces
              ops/scripts/rollback.sh: exit 3 refused unsafe (data, cert, forward-only,
              reversible:false), 4 guided (config, acl)
  fastlane    One command from a merged commit to every goatnet (ADR 1127): the deliberate exception
              to the ladder. Replaces ops/scripts/fastlane.sh step for step; refuses an unpinned
              digest or an open graduation set, and runs the deploys through this binary
  standup     A site from nothing to verified: the standup's phases in the doctrine's order with a
              fail-closed gate at each end, the observability host as a parallel leg, the rescue
              classes and the cross-goatnet surfaces last (ADR 1183). Replaces
              ops/scripts/goat-standup.sh step for step. On a fixture (`--mock`) every component of
              every class is converged by the scripted converger and the declared → verified time is
              the one-hour goatnet's measure
  teardown    A site from verified to nothing — standup's mirror, records kept (a burn-down appends
              teardown rows, never erases). On a fixture (`--mock`) it rehearses the burn-down in
              reverse phase order; on real hosts it prints the order and refuses to execute until
              each phase declares its teardown play (docs/design/goatbuilder-speed.md)
  join-node   One more machine of a class at a live site, declared → converged → verified: the
              node-addition sequence of docs/tutorials/02-first-federated-node.md as numbered phases
              with its gates (reach, key, repo work first, baseline, kernel WireGuard before and
              after enrolment, the kernel ACL plane as the enrolment gate, the class's converge,
              acceptance)
  federate    A sovereign peering declared, converged and verified (ADR 1157): our half measured,
              the packages exchanged through the peering directory, one agreement composed and
              verified, the leaves minted from it, the rules rendered by the one writer, the edge
              deployed, the transport the agreement chose opened, acceptance in all four tiers.
              Replaces ops/scripts/peering-standup.sh step for step
  pins        ONE resolution pass with TWO renderings: every listed member's group_vars pins.yml and
              every listed goatnet's IntentV1 artifact, from ops/pins/fleet-pins.yaml. Replaces
              ops/pins/generate-pins.py byte for byte. `--check` validates, regenerates and refuses
              drift, an unsigned or tampered intent, and a governed pin defined outside pins.yml
              (exit 1)
  promote     Guide and observe release graduation across the goatnet ladder (ADR 1120, 1125):
              status, open a candidate, graduate, graduate a set, the hotfix path, review,
              readiness, abandon, check. Replaces ops/release/graduate.py step for step. Nothing
              here graduates by itself: a mutation runs only when invoked, prints what it did, and
              asks for --yes without a terminal (C10, ADR 1177)
  explain     Interpret an error: a code (`GB-007`, `X-SSH-001`, `E_OFF_MESH`), or any error text —
              this binary's own, or a tool's words it carried (ansible, ssh, op, aws, git, gh,
              cosign, docker, netbird). Prints what happened, why, what to do and where to read
              more; `-` reads the text from stdin
  tutor       Lessons, vimtutor-style: each names the exact command to run against a throwaway copy
              of a fixture (or, read-only, against this checkout), then checks what that command
              actually did — its exit and its rows — before the next unlocks. `tutor` shows the
              lesson you are on and marks it done when your runs satisfy it; `tutor <n>`, `--list`,
              `--reset`
  secrets     The declared secrets posture (ADR 1204): which store is in force (1password, openbao,
              sops, git-crypt, env-file, env), what is available, how to supply what is missing, and
              the store's own checks. `init --env <goatnet>` writes the zero-SaaS quickstart's env
              file: a strong random value for every variable the goatnet's plays template, 0600,
              gitignored, never rotating a value already there. Same module as
              ops/scripts/with-secrets
  verify      Read every host's newest deploy-ledger row for one component and say whether it names
              the ref main declares (C7). Reads only; exit 3 while any host is pending or unknown.
              The same check `deploy --verify-only` runs
  diff        What is different from main right now (C8): main's declared ref against each host's
              newest ledger row, for one component or, without one, every component of the
              environment, read in one pass per member group. Reads only; exit 3 on any drift or
              unreadable host
  runs        The runs this machine recorded, newest first: one row per run, with its id, verb, exit
              code, number of commands and arguments. Each run of a verb that drives hosts leaves a
              record at <state>/runs/<id>/run.json, kept until you remove it. Reads only
  show        One recorded run, phase by phase and command by command, each with its exit code and
              log, then its inputs with their sources. `-o json` prints the record itself. Reads
              only
  history     The deploy ledger as a timeline, newest first, on every host of the environment (C8):
              one row per record, with the machine, the time, the action (deploy or rollback) and
              the version. Each record's prior version and the operator who ran it are in `-o json`.
              Reads only
  plan        Write what a declarative verb would do to a plan file for review: the declared refs,
              the play and target, the ledger, main's commit, the transport (deploy); the artifact
              type and the target ref (rollback). Touches no host's state. Run it as reviewed with
              `apply`
  apply       Run exactly a reviewed plan. Refuses (exit 1, naming what moved) when main's
              declaration, the pins commit, the play or the rollback target moved since the plan was
              written; a changed transport is reported, not refused
  adopt       Declare what an environment already runs: read every host's ledgers and propose a pins
              deviation for each component whose running ref differs from main's declaration. A
              report by default; with --yes the edits are written into a fresh worktree of main for
              review. Never deploys
  assay       Check that a goatnet was built correctly, layer by layer: every acceptance check that
              applies to the site, including the checks an operator runs with the goat CLI. The
              standup's acceptance phase as its own command. Reads only; exit 3 while any check
              fails or cannot answer
  endstate    Check that a goatnet is in its declared end state: every service its own declarations
              say it runs is deployed, running, healthy and doing its job, with its zero-trust edges
              wired, and nothing runs that it does not declare. Reads only; exit 3 while anything is
              off
  survey      How consistent the software is inside each goatnet and across the ladder's goatnets,
              read in one parallel pass. Reads only
  update      Replace this binary with the release its goatnet serves at
              `get.<site>.<zone>/goatbuilder/`: the download is checked against its `.sha256` and
              the signed `SHA256SUMS` before anything is touched, and the swap is atomic. Already
              current: one row, exit 0. `--check` reads only (exit 3 when behind). The surface:
              `GOATBUILDER_UPDATE_URL`, else `--site` from its group_vars, else the one the last
              update used
  completion  Print a shell completion script to stdout (`goatbuilder completion zsh >> ~/.zshrc`).
              For live candidates a static script cannot know — the sites, components and goatnets
              this checkout declares — wire a hook to `goatbuilder _complete` (see the generated
              script's header)
  docs        The command reference: `goatbuilder docs` points at it; `--markdown` emits the whole
              thing, walked from the live command tree so it can never drift from `--help`
  help        Print this message or the help of the given subcommand(s)

Options:
  -o, --output <OUTPUT>  Output format: a table for a person; JSON or YAML for a program [default:
                         table] [possible values: table, json, yaml]
  -C, --repo <DIR>       The repository root. Defaults to the checkout this binary is run in
      --yes              Confirm a declarative verb without prompting (for automation)
      --frozen           Refuse any run that would need to fast-forward the checkout (strict C3)
      --offline          An islanded site: do not fetch the trunk; judge the checkout against the
                         cached one, and record the run as offline (C3; ops/scripts/fresh-source.sh)
      --mock <DIR>       Run against a fixture directory instead of hosts: no registry, no
                         transport, deterministic (goatbuilder-conformance.md §"The fixture")
      --lang <TAG>       Language for help and error explanations (a tag such as fr, uk, de); output
                         a pipeline reads stays English. Default: the OS locale [env: GOAT_LANG=]
      --color <COLOR>    Color the table's ok/FAIL glyph and verdict (auto|always|never). `auto`
                         colors only a terminal; NO_COLOR and CLICOLOR_FORCE override. JSON and YAML
                         are never colored [default: auto] [possible values: auto, always, never]
  -v, --verbose          Log what a run does — the external commands it shells out to, and the
                         network phase of `update` — to stderr, so `-o json|yaml` stays a clean
                         document. Or set RUST_LOG=goatbuilder=debug
      --timeout <SECS>   Seconds to bound the connect/reach phase before failing fast — the one
                         phase that can block on an unreachable host (`update`'s fetch of the served
                         version). Does NOT cap a play's own run or the binary download
                         (stall-bounded). Also reads GOATBUILDER_TIMEOUT [env: GOATBUILDER_TIMEOUT=]
  -h, --help             Print help
  -V, --version          Print version
"""
