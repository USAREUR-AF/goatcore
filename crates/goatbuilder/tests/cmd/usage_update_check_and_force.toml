# --check reads only and --force installs: together they are a usage error (exit 2).
bin.name = "goatbuilder"
args = ["update", "--check", "--force"]
status.code = 2
stdout = ""
stderr = """
error: the argument '--check' cannot be used with '--force'

Usage: goatbuilder update --check

For more information, try '--help'.
  (GB-242 — goatbuilder explain GB-242)
"""
