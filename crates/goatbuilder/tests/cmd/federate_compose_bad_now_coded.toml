# A --now that is not a date is refused by the shared library with X-FED-003,
# exit 1 as in goat (gate row C5).
bin.name = "goatbuilder"
args = ["federate", "compose", "--now", "notadate", "first.json", "second.json"]
status.code = 1
stdout = ""
stderr = """
goatbuilder: --now `notadate` is not a YYYY-MM-DD date
  (X-FED-003 — goatbuilder explain X-FED-003)
"""
