  -v, --verbose          Log what a run does — the external commands it shells out to, and the
                         network phase of `update` — to stderr, so `-o json|yaml` stays a clean
                         document. Or set RUST_LOG=goatbuilder=debug
      --timeout <SECS>   Seconds to bound the connect/reach phase before failing fast — the one
