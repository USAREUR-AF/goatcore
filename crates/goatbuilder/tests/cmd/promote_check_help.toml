# `promote check --help`.
bin.name = "goatbuilder"
args = ["promote", "check", "--help"]
status.code = 0
stdout = """
CI invariants C1–C10 (fail-closed, current-tree). Exit 0/1

Usage: goatbuilder promote check [OPTIONS]

Options:
  -o, --output <OUTPUT>  Output format: a table for a person; JSON or YAML for a program [default:
                         table] [possible values: table, json, yaml]
  -C, --repo <DIR>       The repository root. Defaults to the checkout this binary is run in
      --yes              Confirm a declarative verb without prompting (for automation)
      --frozen           Refuse any run that would need to fast-forward the checkout (strict C3)
      --offline          An islanded site: do not fetch the trunk; judge the checkout against the
