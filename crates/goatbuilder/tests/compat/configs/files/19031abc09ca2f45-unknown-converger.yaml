# The conformance fixture's topology (goatbuilder-conformance.md §"The fixture").
# Any shape that validates against the schema; this one is two components on
# two environments — dev (five machines, scripted in converger.yaml) and
# preprod (one) — with the ladder's own gate vocabulary between them.
schema: goatbuilder/v1
preset: lite
repo:
  source: example-org/example-repo
  image_namespace: ghcr.io/example-org
components:
  portal:
    declared_in: declared/pins.yaml
  netvis:
    declared_in: declared/pins.yaml
environments:
  - name: dev
    converger: carrier-pigeon
  - name: preprod
    converger: push-ansible
promotion:
  path:
    - name: dev
      kind: rung
      environment: dev
    - name: preprod
      kind: rung
      environment: preprod
      gates:
        - id: soak
          min_days: 1
