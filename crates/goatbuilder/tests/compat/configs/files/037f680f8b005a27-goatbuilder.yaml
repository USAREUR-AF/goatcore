# The rollout-preflight fixture (ADR 1211, docs/design/goatbuilder-rollout-preflight.md).
# Five components on one environment, each a case the preflight grading must get
# right. declared/artifacts.yaml carries the three facts; `mystery` is left out of
# it on purpose, so it fails closed. Records sit one version behind the pins so a
# pin-revert has somewhere to roll back to (the rollback --dry-run validation).
schema: goatbuilder/v1
preset: lite
repo:
  source: example-org/example-repo
  image_namespace: ghcr.io/example-org
components:
  netvis:
    declared_in: declared/pins.yaml
  id-console:
    declared_in: declared/pins.yaml
  console:
    declared_in: declared/pins.yaml
  health:
    declared_in: declared/pins.yaml
  mystery:
    declared_in: declared/pins.yaml
environments:
  - name: zagros-dev
    converger: push-ansible
promotion:
  path:
    - name: zagros-dev
      kind: rung
      environment: zagros-dev
