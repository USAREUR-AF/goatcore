# The survey fixture (goatbuilder-conformance.md §"survey"): two goatnets on a
# two-rung ladder, with one of each thing `survey` must find planted in the
# records — hosts of one goatnet that disagree (router on dev), a host off its
# declaration with nothing declaring it (portal on prod-b), prod behind dev with
# an open candidate (portal: declared, in flight) and without one (router:
# undeclared skew), and a machine whose record cannot be read (prod-c).
schema: goatbuilder/v1
preset: lite
repo:
  source: example-org/example-repo
  image_namespace: ghcr.io/example-org
components:
  portal:
    declared_in: declared/pins.yaml
  router:
    declared_in: declared/pins.yaml
environments:
  - name: dev
    converger: push-ansible
  - name: prod
    converger: push-ansible
promotion:
  path:
    - name: dev
      kind: rung
      environment: dev
    - name: prod
      kind: rung
      environment: prod
      gates:
        - id: soak
          min_days: 1
