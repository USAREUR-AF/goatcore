[package]
name = "goatbuilder"
version = "0.6.0"
edition = "2021"
description = "The build/release command-line for a goat environment: one config, one deploy contract, enforced in one place (ADR 1198)"
publish = false

[[bin]]
name = "goatbuilder"
path = "src/main.rs"

[dependencies]
goat-fun = { path = "../goat-fun" }
anyhow = "1"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
# `completion <shell>`: the static shell scripts, generated from the clap tree,
# as goat-cli does (crates/goat-cli, `goat completion`).
clap_complete = "4"
# `--verbose`/`-v`: a diagnostic log to stderr, goat's stack (so `--json` keeps
# stdout clean). The events are emitted at the external-command and network
# phases (src/trace.rs).
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
goat-errors = { path = "../goat-errors" }
# `federate init|lint|compose|diff|verify|apply`: the six federation verbs, run
# in process from the library goat federate also runs (src/federate/verbs.rs).
# Phase 5 also checks each package's signature under the key read aloud.
goat-federation = { path = "../goat-federation" }
# `update`: the self-update core goat shares (asset name, version compare,
# checksum, atomic replace), and a small blocking HTTP client for get.<site>.
goat-selfupdate = { path = "../goat-selfupdate" }
ureq = { version = "2", default-features = false, features = ["tls"] }
jsonschema = { version = "0.17", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
regex = "1"
sha2 = "0.10"
chrono = "0.4"
base64 = "0.22"
similar = "2"
# Languages (ADR 1024, docs/design/goat-cli-i18n.md §"goatbuilder"): goat's
# stack, goat's provenance file, catalogs embedded — no runtime files.
i18n-embed = { version = "0.15", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.9"
rust-embed = "8"
unic-langid = "0.9"
once_cell = "1"
toml = "0.8"
# Splits an inventory's ansible_ssh_common_args into ssh arguments.
shlex = "1"
# `federate` phase 5: our verifying key, derived from the seed that signs our
# package, shown to be read aloud.
ed25519-dalek = "2"
# `update`: SHA256SUMS's keyless signature checked in process (src/update/signature.rs):
# ECDSA and Ed25519 by ring, certificates by x509-parser. Both were already linked
# (ring through rustls, x509-parser through goat-federation), so nothing new is built.
ring = "0.17"
x509-parser = { version = "0.16", features = ["verify"] }

[dev-dependencies]
# Golden command tests, the same framework and conventions as goat-cli
# (crates/goat-cli/tests/cli_golden.rs): `.toml` cases in tests/cmd/,
# regenerated with `TRYCMD=overwrite cargo test -p goatbuilder --test cli_golden`.
trycmd = "0.15"
# Whole-flow integration tests run the built binary on throwaway copies of
# the fixtures (tests/flows.rs).
tempfile = "3"
# update/signature.rs: a certificate no trusted CA issued.
rcgen = "0.13"
# tests/support/sigstore.rs: certificate validity windows for the stand-in Sigstore.
time = "0.3"

